      - {vrf_name: ansible-msd-sanity-b}
      - {vrf_name: ansible-msd-sanity-c}
      - {vrf_name: ansible-msd-sanity-child-write}
      - {vrf_name: ansible-nd-vrf-deleted}
      - {vrf_name: ansible-nd-vrf-deleted-extra}
      - {vrf_name: ansible-nd-vrf-gathered}
      - {vrf_name: ansible-nd-vrf-gathered-l3vni}
      - {vrf_name: ansible-nd-vrf-mcfg-deleted}
      - {vrf_name: ansible-nd-vrf-mcfg-gathered}
      - {vrf_name: ansible-nd-vrf-mcfg-merged}
      - {vrf_name: ansible-nd-vrf-mcfg-merged-l3vni}
      - {vrf_name: ansible-nd-vrf-mcfg-over-keep}
      - {vrf_name: ansible-nd-vrf-mcfg-over-remove}
      - {vrf_name: ansible-nd-vrf-mcfg-replaced}
      - {vrf_name: ansible-nd-vrf-mcfg-sanity-a}
      - {vrf_name: ansible-nd-vrf-mcfg-sanity-b}
      - {vrf_name: ansible-nd-vrf-mcfg-sanity-c}
      - {vrf_name: ansible-nd-vrf-merged}
      - {vrf_name: ansible-nd-vrf-merged-l3vni}
      - {vrf_name: ansible-nd-vrf-merged-stage-resource}
      - {vrf_name: ansible-nd-vrf-merged-stage-switch}
      - {vrf_name: ansible-nd-vrf-over-keep}
      - {vrf_name: ansible-nd-vrf-over-remove}
      - {vrf_name: ansible-nd-vrf-replaced}
      - {vrf_name: ansible-nd-vrf-replaced-l3vni}
      - {vrf_name: ansible-nd-vrf-sanity-a}
      - {vrf_name: ansible-nd-vrf-sanity-b}
      - {vrf_name: ansible-nd-vrf-sanity-c}
      - {vrf_name: ansible-std-sanity-child-cfg}

    nd_cleanup_network_fabrics:
      - "{{ ansible_it_fabric | default(nd_test_fabric_name | default('')) }}"
      - "{{ ansible_msd_parent_fabric | default('') }}"
      - "{{ ansible_msd_child_fabric | default('') }}"
      - "{{ ansible_mcfg_parent_fabric | default('') }}"
      - "{{ ansible_mcfg_child_fabric | default('') }}"
    nd_cleanup_network_config:
      - {network_name: ansible-nd-net-deleted}
      - {network_name: ansible-nd-net-deleted-extra}
      - {network_name: ansible-nd-net-gathered-a}
      - {network_name: ansible-nd-net-gathered-b}
      - {network_name: ansible-nd-net-mcfg-deleted}
      - {network_name: ansible-nd-net-mcfg-merged-resource}
      - {network_name: ansible-nd-net-mcfg-merged-switch}
      - {network_name: ansible-nd-net-mcfg-over-keep}
      - {network_name: ansible-nd-net-mcfg-over-seed}
      - {network_name: ansible-nd-net-mcfg-replaced}
      - {network_name: ansible-nd-net-mcfg-sanity}
      - {network_name: ansible-nd-net-merged-l2}
      - {network_name: ansible-nd-net-merged-l3}
      - {network_name: ansible-nd-net-msd-deleted}
      - {network_name: ansible-nd-net-msd-merged-resource}
      - {network_name: ansible-nd-net-msd-merged-switch}
      - {network_name: ansible-nd-net-msd-over-keep}
      - {network_name: ansible-nd-net-msd-over-seed}
      - {network_name: ansible-nd-net-msd-replaced}
      - {network_name: ansible-nd-net-msd-sanity}
      - {network_name: ansible-nd-net-over-keep}
      - {network_name: ansible-nd-net-over-remove}
      - {network_name: ansible-nd-net-replaced}
      - {network_name: ansible-nd-net-sanity-a}
      - {network_name: ansible-nd-net-sanity-b}
      - {network_name: ansible-nd-net-sanity-c}

    nd_cleanup_l3out_config:
      - {name: ansible-test-l3out-bgp}
      - {name: ansible-test-l3out-static}
      - {name: ansible-test-l3out-svi}

    nd_cleanup_switch_fabric_name: >-
      {{ ansible_it_fabric | default(nd_test_fabric_name | default('')) }}
    nd_cleanup_switch_identifiers:
      - "{{ ansible_switch1 | default('') }}"
      - "{{ ansible_switch2 | default('') }}"
      - "{{ ansible_switch3 | default('') }}"

    nd_cleanup_policy_fabric_name: >-
      {{ fabric_name | default(ansible_it_fabric | default(nd_test_fabric_name | default(''))) }}
    nd_cleanup_policy_switch_ids:
      - "{{ switch_serial_1 | default(ansible_switch1 | default('')) }}"
      - "{{ switch_serial_2 | default(ansible_switch2 | default('')) }}"
    nd_cleanup_policy_descriptions:
      - ADD-duplicate-allowed
      - BFD timers
      - BFD timers - custom priority sw1
      - CLI aliases
      - DK-changed-priority
      - DK-original
      - Delete me by description
      - Enable BFD feature
      - Enable OSPF feature
      - Enable system vlan long-name
      - GATHERED-TC9-force-create
      - IT-TIV-bad-type HOUR_OFFSET
      - IT-TIV-cache BFD
      - IT-TIV-cache LACP
      - IT-TIV-cache LLDP
      - IT-TIV-check-mode unknown
      - IT-TIV-happy clock_timezone
      - IT-TIV-unknown-key reject
      - Lifecycle test
      - Lifecycle test - recreated
      - MOTD banner
      - OSPF best practices
      - REPLACE-PY
      - REPLACE-X
      - Same description
      - Set summertime to CEST
      - Set timezone to CET
      - Source cleanup switch freeform
      - Spanning-tree best practices
      - Summertime CEST
      - Syslog configuration
      - System vlan long-name
      - Timezone CET
      - Timezone CET on both switches
      - Timezone for markDelete test
      - VRF route tracking object 10
      - as-format asdot
      - gathered output entry
      - ghost policy reference
      - policy with empty switch list
      - two-level policy entry

    nd_cleanup_policy_group_descriptions:
      - Enable BFD feature
      - Enable BFD timers
      - Enable LACP on leaf switches
      - Enable LLDP on leaf switches
      - Enable system vlan long-name
      - IT-GATHERED-Enable LACP
      - IT-GATHERED-Enable LLDP
      - IT-GATHERED-System vlan long-name
      - IT-GATHERED-Timezone CET
      - IT-MERGED-BFD timers
      - IT-MERGED-Enable LACP
      - IT-MERGED-Enable LLDP
      - IT-MERGED-Enable NV Overlay
      - IT-MERGED-Multi switch freeform
      - IT-MERGED-Staged feature
      - IT-MERGED-Staged freeform
      - IT-MERGED-System vlan long-name
      - IT-MERGED-Timezone CET
      - IT-RT-Enable LACP
      - IT-RT-Enable LLDP
      - IT-RT-System vlan long-name
      - IT-RT-Timezone CET
      - IT-TIV-bad-type HOUR_OFFSET
      - IT-TIV-cache BFD
      - IT-TIV-cache LACP
      - IT-TIV-cache LLDP
      - IT-TIV-check-mode unknown
      - IT-TIV-happy switch_freeform
      - IT-TIV-roundtrip clock
      - IT-TIV-unknown-key reject
      - Pending cleanup Enable LACP
      - Pending cleanup switch_freeform source
      - SPC-BFD-BFD timers
      - SPC-BFD-Enable BFD feature
      - SPC-CHECK-MD-Summertime CEST
      - SPC-CHECK-Timezone PST
      - SPC-FORCE-baseline freeform
      - SPC-ID-Enable LLDP
      - SPC-ID-Timezone EST
      - SPC-NODEPLOY-Enable LACP
      - SPC-NODEPLOY-as-format asdot
      - Set timezone to CET
      - Split membership and intent update

    nd_cleanup_vpc_pair_fabric_name: >-
      {{ fabric_name | default(nd_test_fabric_name | default('')) }}
    nd_cleanup_vpc_pair_peer1: >-
      {{ switch1_serial | default(nd_test_vpc_peer1_ip | default('')) }}
    nd_cleanup_vpc_pair_peer2: >-
      {{ switch2_serial | default(nd_test_vpc_peer2_ip | default('')) }}

    nd_cleanup_prefix_list_ipv4_config:
      - ip_version: ipv4
        name: PL-IPV4-BORDERS
        entries:
          - {sequence_number: 10, action: permit, prefix: 10.0.0.0/8}
      - ip_version: ipv4
        name: PL-IPV4-DATACENTER
        entries:
          - {sequence_number: 10, action: permit, prefix: 192.168.0.0/16}
    nd_cleanup_prefix_list_ipv6_config:
      - ip_version: ipv6
        name: PL-IPV6-DATACENTER
        entries:
          - {sequence_number: 10, action: permit, prefix: "2001:db8::/32"}

    nd_cleanup_route_map_config:
      - {name: "{{ nd_test_route_map_primary_name | default('ANSIBLE_RM_PRIMARY') }}"}
      - {name: "{{ nd_test_route_map_secondary_name | default('ANSIBLE_RM_SECONDARY') }}"}
      - {name: "{{ nd_test_route_map_tertiary_name | default('ANSIBLE_RM_TERTIARY') }}"}

  tasks:
    - name: Validate the requested cleanup suite
      ansible.builtin.assert:
        that:
          - nd_suite | default('') | length > 0
          - nd_suite | default('') in nd_cleanup_supported_suites
        fail_msg: >-
          Cleanup verification is not implemented for
          {{ nd_suite | default('undefined') }}.
          Supported suites: {{ nd_cleanup_supported_suites | join(', ') }}.

    - name: Initialize cleanup verification status
      ansible.builtin.set_fact:
        nd_cleanup_verification_complete: false

    - name: Verify cleanup for loopback-interface suite
      when: nd_suite == 'nd_interface_loopback'
      block:
        - name: Validate loopback verifier scope
          ansible.builtin.assert:
            that:
              - nd_cleanup_fabric_name | length > 0
              - nd_cleanup_switch_ip | length > 0
            fail_msg: Define nd_test_fabric_name and nd_test_switch_ip for loopback verification.

        - name: Probe for leftover loopback test resources
          cisco.nd.nd_interface_loopback:
            fabric_name: "{{ nd_cleanup_fabric_name }}"
            config: "{{ nd_cleanup_loopback_config }}"
            state: deleted
          check_mode: true
          register: nd_loopback_cleanup_probe

        - name: Assert that no loopback test resources remain
          ansible.builtin.assert:
            that:
              - nd_loopback_cleanup_probe is not changed
              - nd_loopback_cleanup_probe is not failed

        - name: Mark loopback cleanup verification complete
          ansible.builtin.set_fact:
            nd_cleanup_verification_complete: true

    - name: Verify cleanup for fabric suite
      when: nd_suite == 'nd_manage_fabric'
      block:
        - name: Query each reserved test fabric by exact name
          cisco.nd.nd_rest:
            path: "/api/v1/manage/fabrics/{{ item }}"
            method: get
          loop: "{{ nd_cleanup_fabric_names }}"
          loop_control:
            label: "{{ item }}"
          register: nd_fabric_cleanup_queries
          changed_when: false
          failed_when: false

        - name: Assert that every reserved test fabric is absent
          ansible.builtin.assert:
            that:
              - item.status | default(0) | int == 404
            fail_msg: >-
              Reserved test fabric {{ item.item }} is still present or its state
              could not be verified (HTTP {{ item.status | default('unknown') }}).
          loop: "{{ nd_fabric_cleanup_queries.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Mark fabric cleanup verification complete
          ansible.builtin.set_fact:
            nd_cleanup_verification_complete: true

    - name: Verify cleanup for resource-manager suite
      when: nd_suite == 'nd_resource_manager'
      block:
        - name: Validate resource-manager verifier scope
          ansible.builtin.assert:
            that:
              - nd_cleanup_resource_manager_fabrics | reject('equalto', '') | list | length > 0
            fail_msg: Define the exact resource-manager test fabric names.

        - name: Gather resource-manager allocations from exact test fabrics
          cisco.nd.nd_manage_resource_manager:
            fabric_name: "{{ item }}"
            state: gathered
          loop: >-
            {{ nd_cleanup_resource_manager_fabrics
               | reject('equalto', '') | unique | list }}
          loop_control:
            label: "{{ item }}"
          register: nd_resource_manager_cleanup_gathers
          changed_when: false

        - name: Assert that reserved resource-manager entities are absent
          ansible.builtin.assert:
            that:
              - item is not changed
              - item is not failed
              - >-
                item.gathered | default([]) | map(attribute='entity_name') | list
                | intersect(nd_cleanup_resource_manager_entity_names)
                | length == 0
            fail_msg: >-
              Reserved resource-manager test allocations remain in fabric {{ item.item }}.
          loop: "{{ nd_resource_manager_cleanup_gathers.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Mark resource-manager cleanup verification complete
          ansible.builtin.set_fact:
            nd_cleanup_verification_complete: true

    - name: Verify cleanup for vPC-access-interface suite
      when: nd_suite == 'nd_interface_vpc_access'
      block:
        - name: Validate vPC-access verifier scope
          ansible.builtin.assert:
            that:
              - nd_cleanup_vpc_access_fabric_name | length > 0
              - nd_cleanup_vpc_peer1 | length > 0
              - nd_cleanup_vpc_peer2 | length > 0
            fail_msg: >-
              Define nd_test_vpc_access_fabric_name (or nd_test_fabric_name),
              nd_test_vpc_peer1_ip, and nd_test_vpc_peer2_ip.

        - name: Probe exact reserved vPC-access interfaces
          cisco.nd.nd_interface_vpc_access:
            fabric_name: "{{ nd_cleanup_vpc_access_fabric_name }}"
            config: "{{ nd_cleanup_vpc_access_config }}"
            state: deleted
          check_mode: true
          register: nd_vpc_access_cleanup_probe

        - name: Assert that reserved vPC-access interfaces are absent
          ansible.builtin.assert:
            that:
              - nd_vpc_access_cleanup_probe is not changed
              - nd_vpc_access_cleanup_probe is not failed

        - name: Gather the exact vPC pair used by the access suite
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ nd_cleanup_vpc_access_fabric_name }}"
            state: gathered
            config:
              - peer1_switch_id: "{{ nd_cleanup_vpc_peer1 }}"
