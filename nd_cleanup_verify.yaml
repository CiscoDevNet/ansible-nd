      - ext_test_fabric_deleted
      - ext_test_fabric_config_actions
      - ai_ibgp_test_fabric_merged
      - ai_ibgp_test_fabric_replaced
      - ai_ibgp_test_fabric_deleted
      - ai_ibgp_test_fabric_config_actions
      - ai_ebgp_test_fabric_merged
      - ai_ebgp_test_fabric_replaced
      - ai_ebgp_test_fabric_deleted
      - ai_ebgp_test_fabric_config_actions

    nd_cleanup_resource_manager_fabrics:
