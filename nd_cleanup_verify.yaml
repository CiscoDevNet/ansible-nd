      - "{{ ansible_sno_1 | default('') }}~{{ intf_1_2 | default('') }}"
      - "{{ ansible_sno_1 | default('') }}~{{ intf_1_10 | default('') }}~{{ ansible_sno_2 | default('') }}~{{ intf_1_10 | default('') }}"
      - "{{ ansible_sno_1 | default('') }}~{{ intf_1_2 | default('') }}~{{ ansible_sno_2 | default('') }}~{{ intf_1_2 | default('') }}"
      - "{{ ansible_sno_1 | default('') }}~{{ intf_1_3 | default('') }}~{{ ansible_sno_2 | default('') }}~{{ intf_1_2 | default('') }}"
      - "{{ ansible_sno_1 | default('') }}~{{ intf_1_3 | default('') }}~{{ ansible_sno_2 | default('') }}~{{ intf_1_3 | default('') }}"
      - "external_invalid_dynamic_{{ ansible_sno_1 | default('') }}~{{ intf_1_3 | default('') }}~{{ ansible_sno_2 | default('') }}~{{ intf_1_3 | default('') }}"
