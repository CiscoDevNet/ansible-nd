      - base_network_vlan_device
      - base_port_channel_device
      - base_route_map_device
      - base_unsupported_pool
      - base_vpc_domain_fabric
      - ebgp_anycast_rp_fabric
      - ebgp_device_bgp_asn_device
      - ebgp_invalid_pool_type
      - ebgp_mcast_fabric
      - ebgp_router_id_fabric
      - ebgp_unsupported_pool
      - ebgp_vrf_vlan_device
      - external_instance_device
      - external_invalid_pool_type
      - external_loopback_ipv6_fabric
      - external_tunnel_ios_xe_device
      - external_unsupported_pool
      - ibgp_all_anycast_rp_fabric
      - ibgp_all_bgp_asn_fabric
      - ibgp_all_fex_device
      - ibgp_all_hypershield_ha_source_fabric
      - ibgp_all_l2_vni_fabric
      - ibgp_all_l3_vni_fabric
      - ibgp_all_loopback0_fabric
      - ibgp_all_loopback_device
      - ibgp_all_mcast_fabric
      - ibgp_all_mpls_loopback_fabric
      - ibgp_all_network_vlan_device
      - ibgp_all_object_tracking_device
