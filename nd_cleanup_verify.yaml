      - nd_manage_policy
      - nd_manage_policy_group
      - nd_vpc_pair
      - nd_manage_prefix_list
      - nd_manage_route_map

    nd_cleanup_fabric_name: "{{ nd_test_fabric_name | default('') }}"
    nd_cleanup_switch_ip: "{{ nd_test_switch_ip | default('') }}"

    nd_cleanup_loopback_config:
