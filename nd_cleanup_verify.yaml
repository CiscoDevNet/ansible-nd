          cisco.nd.tests.integration._nd_vrf_validate:
            nd_data: "{{ item }}"
            test_data: "{{ nd_cleanup_vrf_config }}"
            present: false
          loop: "{{ nd_vrf_cleanup_gathers.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Assert VRF read-only verification did not change state
          ansible.builtin.assert:
            that:
              - item is not changed
              - item is not failed
          loop: "{{ nd_vrf_cleanup_gathers.results }}"
          loop_control:
