    nd_cleanup_vpc_access_fabric_name: >-
      {{ nd_test_vpc_access_fabric_name | default(nd_test_fabric_name | default('')) }}
    nd_cleanup_vpc_trunk_fabric_name: >-
      {{ nd_test_vpc_trunk_host_fabric_name | default(nd_test_fabric_name | default('')) }}
    nd_cleanup_vpc_peer1: "{{ nd_test_vpc_peer1_ip | default('') }}"
    nd_cleanup_vpc_peer2: "{{ nd_test_vpc_peer2_ip | default('') }}"
    nd_cleanup_vpc_access_config:
      - {switch_ip: "{{ nd_cleanup_vpc_peer1 }}", interface_name: vpc100}
      - {switch_ip: "{{ nd_cleanup_vpc_peer1 }}", interface_name: vpc101}
    nd_cleanup_vpc_trunk_config:
      - {switch_ip: "{{ nd_cleanup_vpc_peer1 }}", interface_name: vpc200}
      - {switch_ip: "{{ nd_cleanup_vpc_peer1 }}", interface_name: vpc201}

    nd_cleanup_community_fabric_name: "{{ nd_test_fabric_name | default('') }}"
    nd_cleanup_community_config:
      - {name: ANSIBLE_CL_STANDARD}
      - {name: ANSIBLE_CL_EXPANDED}
      - {name: ANSIBLE_CL_OVERRIDDEN}
    nd_cleanup_extended_community_config:
      - {name: ANSIBLE_ECL_STANDARD}
      - {name: ANSIBLE_ECL_EXPANDED}
      - {name: ANSIBLE_ECL_OVERRIDDEN}

    nd_cleanup_vrf_fabrics:
      - "{{ ansible_it_fabric | default(nd_test_fabric_name | default('')) }}"
      - "{{ ansible_msd_parent_fabric | default('') }}"
      - "{{ ansible_msd_child_fabric | default('') }}"
      - "{{ ansible_mcfg_parent_fabric | default('') }}"
      - "{{ ansible_mcfg_child_fabric | default('') }}"
    nd_cleanup_vrf_config:
      - {vrf_name: ansible-mcfg-del-parent}
      - {vrf_name: ansible-mcfg-gath-parent}
      - {vrf_name: ansible-mcfg-merged-parent}
      - {vrf_name: ansible-mcfg-repl-parent}
      - {vrf_name: ansible-mcfg-sanity-child}
