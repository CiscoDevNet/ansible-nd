# --- SETUP ---
# At this point loopback201 and loopback202 exist from overridden tests.

# --- DELETED: SINGLE INTERFACE ---

- name: "DELETED: Delete loopback201 (check mode)"
  cisco.nd.nd_interface_loopback: &delete_lb101
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback201
    state: deleted
  check_mode: true
  register: cm_deleted_101

- name: "DELETED: Delete loopback201 (normal mode)"
  cisco.nd.nd_interface_loopback: *delete_lb101
  register: nm_deleted_101

- name: "DELETED: Verify loopback201 was deleted"
  ansible.builtin.assert:
    that:
      - cm_deleted_101 is changed
      - nm_deleted_101 is changed
      - nm_deleted_101.after | selectattr('interface_name', 'equalto', 'loopback201') | list | length == 0

# --- DELETED: IDEMPOTENCY ---

- name: "DELETED IDEMPOTENT: Delete loopback201 again"
  cisco.nd.nd_interface_loopback: *delete_lb101
  register: nm_deleted_101_idem

- name: "DELETED IDEMPOTENT: Verify no change when already absent"
  ansible.builtin.assert:
    that:
      - nm_deleted_101_idem is not changed

# --- DELETED: MULTIPLE INTERFACES ---

# First recreate loopback200 and loopback201 so we can test multi-delete
- name: "SETUP: Recreate loopback200 and loopback201 for multi-delete test"
  cisco.nd.nd_interface_loopback:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ loopback_200 }}"
      - "{{ loopback_201 }}"
    state: merged

- name: "DELETED MULTI: Delete loopback200, loopback201, and loopback202 (check mode)"
  cisco.nd.nd_interface_loopback: &delete_multi
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback200
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback201
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback202
    state: deleted
  check_mode: true
  register: cm_deleted_multi

- name: "DELETED MULTI: Delete loopback200, loopback201, and loopback202 (normal mode)"
  cisco.nd.nd_interface_loopback: *delete_multi
  register: nm_deleted_multi

- name: "DELETED MULTI: Verify all test loopbacks were deleted"
  ansible.builtin.assert:
    that:
      - cm_deleted_multi is changed
      - nm_deleted_multi is changed
      - nm_deleted_multi.after | selectattr('interface_name', 'equalto', 'loopback200') | list | length == 0
      - nm_deleted_multi.after | selectattr('interface_name', 'equalto', 'loopback201') | list | length == 0
      - nm_deleted_multi.after | selectattr('interface_name', 'equalto', 'loopback202') | list | length == 0

# --- DELETED: NON-EXISTENT INTERFACE ---

- name: "DELETED NON-EXISTENT: Delete interface that does not exist"
  cisco.nd.nd_interface_loopback:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback299
    state: deleted
  register: nm_deleted_nonexistent

- name: "DELETED NON-EXISTENT: Verify no change"
  ansible.builtin.assert:
    that:
      - nm_deleted_nonexistent is not changed
