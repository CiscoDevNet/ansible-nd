---
# Demo overridden state test using the shared ND 4.x action plugin pattern.

- name: "OVERRIDDEN SAFETY: Require explicit destructive-test opt-in"
  ansible.builtin.assert:
    that:
      - nd4x_loopback_destructive_tests_enabled | bool
    fail_msg: >-
      The overridden test is fabric-wide and can delete managed loopbacks
      omitted from the desired configuration. Run only on a dedicated test
      fabric and set nd_loopback_destructive_tests_enabled=true.

- name: "OVERRIDDEN PREFLIGHT: Inspect fabric-wide loopback scope"
  cisco.nd.nd_interface_loopback:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ loopback_100_updated }}"
    state: overridden
  check_mode: true
  changed_when: false
  register: overridden_loopback_scope_probe

- name: "OVERRIDDEN PREFLIGHT: Reject loopbacks outside reserved scope"
  vars:
    existing_switch_ips: >-
      {{
        overridden_loopback_scope_probe.before
        | default([])
        | map(attribute='switch_ip')
        | unique
        | list
      }}
    existing_test_switch_loopbacks: >-
      {{
        overridden_loopback_scope_probe.before
        | default([])
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | map(attribute='interface_name')
        | list
      }}
  ansible.builtin.assert:
    that:
      - existing_switch_ips | difference([test_switch_ip]) | length == 0
      - existing_test_switch_loopbacks
        | difference(nd4x_loopback_reserved_interfaces)
        | length == 0
    fail_msg: >-
      Unsafe overridden testbed. Existing managed loopbacks were found on
      another switch or outside the reserved loopback100-loopback109 test
      range. No override was applied.

- name: Run standardized nd_interface_loopback overridden tests
  block:
    - name: "OVERRIDDEN SETUP: Create loopback100 and loopback101"
      cisco.nd.nd_interface_loopback:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ loopback_100 }}"
          - "{{ loopback_101 }}"
        state: merged

    - name: "OVERRIDDEN: Override loopbacks using standard runner"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_loopback
        state: overridden
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ loopback_100_updated }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false

        check_mode_queries:
          - name: Snapshot all managed interfaces on test switch
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            expected_status: 200
            unordered: true
            ignore_keys:
              - operData

        nd_queries:
          - name: Validate loopback100 updated after overridden
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/loopback100"
            method: get
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: "loopback100"
              - jsonpath: "$.current.configData.networkOS.policy.ip"
                equals: "10.100.100.2"
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: "Updated loopback100 description"
      register: overridden_loopbacks

    - name: "OVERRIDDEN VERIFY: Verify loopback100 updated"
      vars:
        lb100_after: >-
          {{
            overridden_loopbacks.first_run_result.after
            | selectattr('interface_name', 'equalto', 'loopback100')
            | first
          }}
      ansible.builtin.assert:
        that:
          - lb100_after.config_data.network_os.policy.ip == "10.100.100.2"
          - lb100_after.config_data.network_os.policy.description == "Updated loopback100 description"
          - lb100_after.config_data.network_os.policy.route_map_tag == "54321"

    - name: "OVERRIDDEN VERIFY: Verify loopback101 removed"
      ansible.builtin.assert:
        that:
          - overridden_loopbacks.first_run_result.after
            | selectattr('interface_name', 'equalto', 'loopback101')
            | list
            | length == 0

  always:
    - name: "OVERRIDDEN CLEANUP: Remove loopback100 and loopback101"
      cisco.nd.nd_interface_loopback:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: loopback100
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: loopback101
        state: deleted
