---
# Demo merged state test using the shared ND 4.x action plugin pattern.
#
# This file lives under the target so ansible-test copies it into the temporary
# test workdir. The proposed shared-layout copy lives under
# tests/integration/playbooks/nd4x_module_tests/.

- name: Run standardized nd_interface_loopback merged tests
  block:
    - name: "MERGED CREATE: Create loopback100 using standard runner"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_loopback
        state: merged
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ loopback_100 }}"
        expected:
          check_mode_changed: true
          apply_changed: true
          idempotency: true
          failed: false
        idempotency_retries: 6
        idempotency_delay: 10
      register: merged_create_100
      tags:
        - nd4x_demo
        - nd4x_demo_create

    - name: "MERGED CREATE: Verify loopback100 exists"
      ansible.builtin.assert:
        that:
          - merged_create_100.first_run_result.after
            | selectattr('interface_name', 'equalto', 'loopback100')
            | list
            | length == 1
      tags:
        - nd4x_demo
        - nd4x_demo_verify

  always:
    - name: "MERGED CLEANUP: Remove loopback100"
      cisco.nd.nd_interface_loopback:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: loopback100
        state: deleted
      tags:
        - nd4x_demo
        - nd4x_demo_cleanup
