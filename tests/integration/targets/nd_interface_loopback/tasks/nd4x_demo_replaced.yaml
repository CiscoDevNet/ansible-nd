#What this file does:
# Creates loopback100 with the original config.
# Calls the same nd4x_module_test action plugin with state: replaced.
# Replaces loopback100 using loopback_100_updated.
# Verifies the updated IP, description, and route_map_tag.
# Cleans up loopback100 at the end.



---
# Demo replaced state test using the shared ND 4.x action plugin pattern.

- name: Run standardized nd_interface_loopback replaced tests
  block:
    - name: "REPLACED SETUP: Create loopback100 original config"
      cisco.nd.nd_interface_loopback:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ loopback_100 }}"
        state: merged
      tags:
        - nd4x_demo
        - nd4x_demo_replaced

    - name: "REPLACED: Replace loopback100 using standard runner"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_loopback
        state: replaced
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ loopback_100_updated }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        nd_queries:
          - name: Validate loopback100 replaced in ND API
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/loopback100"
            method: get
            expect:
              - jsonpath: "$.current.configData.networkOS.policy.ip"
                equals: "10.100.100.2"
      register: replaced_loopback_100
      tags:
        - nd4x_demo
        - nd4x_demo_replaced

    - name: "REPLACED VERIFY: Verify loopback100 updated"
      vars:
        lb100_after: >-
          {{
            replaced_loopback_100.first_run_result.after
            | selectattr('interface_name', 'equalto', 'loopback100')
            | first
          }}
      tags:
        - nd4x_demo
        - nd4x_demo_replaced
      ansible.builtin.assert:
        that:
          - lb100_after.config_data.network_os.policy.ip == "10.100.100.2"
          - lb100_after.config_data.network_os.policy.description == "Updated loopback100 description"
          - lb100_after.config_data.network_os.policy.route_map_tag == "54321"

  always:
    - name: "REPLACED CLEANUP: Remove loopback100"
      cisco.nd.nd_interface_loopback:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: loopback100
        state: deleted
      tags:
        - nd4x_demo
        - nd4x_demo_replaced
