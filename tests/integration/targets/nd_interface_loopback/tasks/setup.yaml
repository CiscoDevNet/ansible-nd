# Called from main.yaml before the merged/replaced/overridden/deleted state
# blocks. Ensures no test loopback interfaces exist on the target switch
# before the state tests run.

- name: "SETUP: Remove test loopback interfaces before state tests"
  cisco.nd.nd_interface_loopback:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback100
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback101
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback102
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback103
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback199
    state: deleted
  tags: always
