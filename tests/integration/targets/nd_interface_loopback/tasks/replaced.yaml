# --- SETUP ---
# At this point loopback200 (updated), loopback201, loopback202 exist from merged tests.

# --- REPLACED: FULL REPLACE ---

- name: "REPLACED: Replace loopback200 config entirely (check mode)"
  cisco.nd.nd_interface_loopback: &replace_lb100
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback200
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              policy_type: loopback
              admin_state: true
              ip: "10.100.200.3"
              description: "Replaced loopback200"
    state: replaced
  check_mode: true
  register: cm_replaced_100

- name: "REPLACED: Replace loopback200 config entirely (normal mode)"
  cisco.nd.nd_interface_loopback: *replace_lb100
  register: nm_replaced_100

- name: "REPLACED: Verify loopback200 was replaced"
  ansible.builtin.assert:
    that:
      - cm_replaced_100 is changed
      - nm_replaced_100 is changed

- name: "REPLACED: Verify replaced values"
  vars:
    lb100_after: "{{ nm_replaced_100.after | selectattr('interface_name', 'equalto', 'loopback200') | first }}"
  ansible.builtin.assert:
    that:
      - lb100_after.config_data.network_os.policy.ip == "10.100.200.3"
      - lb100_after.config_data.network_os.policy.description == "Replaced loopback200"

# --- REPLACED: IDEMPOTENCY ---

- name: "REPLACED IDEMPOTENT: Re-apply same replaced config"
  cisco.nd.nd_interface_loopback: *replace_lb100
  register: nm_replaced_100_idem

- name: "REPLACED IDEMPOTENT: Verify no change on second run"
  ansible.builtin.assert:
    that:
      - nm_replaced_100_idem is not changed

# --- REPLACED: MULTIPLE INTERFACES ---

- name: "REPLACED MULTI: Replace loopback200 and loopback201 (check mode)"
  cisco.nd.nd_interface_loopback: &replace_lb100_101
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: loopback200
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              policy_type: loopback
              admin_state: true
              ip: "10.100.200.4"
              description: "Replaced again loopback200"
      - "{{ loopback_201_updated }}"
    state: replaced
  check_mode: true
  register: cm_replaced_multi

- name: "REPLACED MULTI: Replace loopback200 and loopback201 (normal mode)"
  cisco.nd.nd_interface_loopback: *replace_lb100_101
  register: nm_replaced_multi

- name: "REPLACED MULTI: Verify both interfaces were replaced"
  ansible.builtin.assert:
    that:
      - cm_replaced_multi is changed
      - nm_replaced_multi is changed

- name: "REPLACED MULTI: Verify replaced values for both interfaces"
  vars:
    lb100_after: "{{ nm_replaced_multi.after | selectattr('interface_name', 'equalto', 'loopback200') | first }}"
    lb101_after: "{{ nm_replaced_multi.after | selectattr('interface_name', 'equalto', 'loopback201') | first }}"
  ansible.builtin.assert:
    that:
      - lb100_after.config_data.network_os.policy.ip == "10.100.200.4"
      - lb100_after.config_data.network_os.policy.description == "Replaced again loopback200"
      - lb101_after.config_data.network_os.policy.ip == "10.100.201.2"
      - lb101_after.config_data.network_os.policy.admin_state == false
