---
# Variables for nd_interface_loopback integration tests.
#
# Override fabric_name and switch_ip in your inventory or extra-vars
# to match a real ND 4.2 testbed.

test_fabric_name: "{{ nd_test_fabric_name | default('test_fabric') }}"
test_switch_ip: "{{ nd_test_switch_ip | default('192.168.1.1') }}"

# Loopback interface configs used across tests.
# Loopback IDs 100-103 and 204 are reserved for the ND4x harness. Loopback
# IDs 200-209 (and 299 as the never-exists probe) are reserved for the legacy
# integration tests.
nd4x_loopback_destructive_tests_enabled: >-
  {{
    nd_loopback_destructive_tests_enabled
    | default(false)
    | bool
  }}

nd4x_loopback_reserved_interfaces:
  - loopback100
  - loopback101
  - loopback102
  - loopback103
  - loopback204

nd4x_loopback_overridden_allowed_interfaces:
  - loopback100
  - loopback101
  - loopback102

loopback_200:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback200
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.200.1"
        description: "Ansible integration test loopback200"
        vrf: default
        route_map_tag: "12345"

loopback_201:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback201
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.201.1"
        description: "Ansible integration test loopback201"

loopback_202:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback202
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.202.1"
        description: "Ansible integration test loopback202"

# Updated versions for merge/replace tests
loopback_200_updated:
  switch_ip: "{{ test_switch_ip }}"
