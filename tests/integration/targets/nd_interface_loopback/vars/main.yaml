---
# Variables for nd_interface_loopback integration tests.
#
# Override fabric_name and switch_ip in your inventory or extra-vars
# to match a real ND 4.2 testbed.

test_fabric_name: "{{ nd_test_fabric_name | default('test_fabric') }}"
test_switch_ip: "{{ nd_test_switch_ip | default('192.168.1.1') }}"

# Loopback interface configs used across tests.
# Loopback IDs 100-109 are reserved for these integration tests.
loopback_100:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback100
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.100.1"
        description: "Ansible integration test loopback100"
        vrf: default
        route_map_tag: "12345"

loopback_101:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback101
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.101.1"
        description: "Ansible integration test loopback101"

loopback_102:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback102
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.102.1"
        description: "Ansible integration test loopback102"

# Updated versions for merge/replace tests
loopback_100_updated:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback100
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: true
        ip: "10.100.100.2"
        description: "Updated loopback100 description"
        vrf: default
        route_map_tag: "54321"

loopback_101_updated:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: loopback101
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: loopback
        admin_state: false
        ip: "10.100.101.2"
        description: "Updated loopback101 description"

# IOS-XE coverage — set nd_test_xe_switch_ip (and optionally nd_test_xe_fabric_name)
# in inventory/extra-vars to enable; xe.yaml is skipped when unset.
test_xe_fabric_name: "{{ nd_test_xe_fabric_name | default(test_fabric_name) }}"

xe_loopback_105:
  switch_ip: "{{ nd_test_xe_switch_ip | default('') }}"
  interface_name: loopback105
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: iosXeLoopback
        admin_state: true
        ip: "10.100.105.1"
        description: "Ansible integration test loopback105"

xe_loopback_105_updated:
  switch_ip: "{{ nd_test_xe_switch_ip | default('') }}"
  interface_name: loopback105
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: iosXeLoopback
        admin_state: true
        ip: "10.100.105.2"
        description: "Updated loopback105 description"

xe_loopback_106:
  switch_ip: "{{ nd_test_xe_switch_ip | default('') }}"
  interface_name: loopback106
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: csrLoopback
        admin_state: true
        ip: "10.100.106.1"
