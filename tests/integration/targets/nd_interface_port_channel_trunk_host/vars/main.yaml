---
# Variables for nd_interface_port_channel_trunk_host integration tests.
#
# Override these in your inventory or extra-vars to match a real ND 4.2 testbed.
# Member ethernet interfaces (test_pc_member_*) MUST exist on the target switch and
# MUST NOT be members of any other port-channel before tests run, or the cleanup
# at the start of each state file will revert them to fabric defaults.

test_fabric_name: "{{ nd_test_fabric_name | default('test_fabric') }}"
test_switch_ip: "{{ nd_test_switch_ip | default('192.168.1.1') }}"

# Member ethernet interface names. Override per-testbed.
test_pc_member_a: "{{ nd_test_pc_member_a | default('Ethernet1/10') }}"
test_pc_member_b: "{{ nd_test_pc_member_b | default('Ethernet1/11') }}"
test_pc_member_c: "{{ nd_test_pc_member_c | default('Ethernet1/12') }}"
test_pc_member_d: "{{ nd_test_pc_member_d | default('Ethernet1/13') }}"

# Port-channel IDs 501-509 are reserved for these integration tests.

test_pc_501:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel501
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "100-200"
        native_vlan: 99
        ports:
          - "{{ test_pc_member_a }}"
          - "{{ test_pc_member_b }}"
        port_channel_mode: active
        lacp_rate: fast
        description: "Ansible integration test PC 501"

test_pc_502:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel502
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "300-400"
        native_vlan: 199
        ports:
          - "{{ test_pc_member_c }}"
        port_channel_mode: active
        description: "Ansible integration test PC 502"

test_pc_503:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel503
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "all"
        ports:
          - "{{ test_pc_member_d }}"
        port_channel_mode: passive
        description: "Ansible integration test PC 503"

# Updated variants for merge/replace tests

test_pc_501_updated_vlan:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel501
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "100-200,500"
        native_vlan: 88
        ports:
          - "{{ test_pc_member_a }}"
          - "{{ test_pc_member_b }}"
        port_channel_mode: active
        lacp_rate: fast
        description: "Ansible integration test PC 501 updated"

test_pc_501_added_member:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel501
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "100-200"
        native_vlan: 99
        ports:
          - "{{ test_pc_member_a }}"
          - "{{ test_pc_member_b }}"
          - "{{ test_pc_member_c }}"
        port_channel_mode: active
        lacp_rate: fast
        description: "Ansible integration test PC 501"

test_pc_501_removed_member:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel501
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "100-200"
        native_vlan: 99
        ports:
          - "{{ test_pc_member_a }}"
        port_channel_mode: active
        lacp_rate: fast
        description: "Ansible integration test PC 501"

# vlan_mapping fixture for non-9000v testbeds (used by tasks/vlan_mapping.yaml).

test_pc_501_with_vlan_mapping:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: port-channel501
  config_data:
    network_os:
      policy:
        admin_state: true
        allowed_vlans: "100-200"
        native_vlan: 99
        ports:
          - "{{ test_pc_member_a }}"
        port_channel_mode: active
        description: "Ansible integration test PC 501 vlan-mapping"
        vlan_mapping: true
        vlan_mapping_entries:
          - customer_vlan_id: ["100"]
            provider_vlan_id: 1100
            dot1q_tunnel: true

# --- IOS-XE coverage (issue #537) ---
# Set nd_test_xe_switch_ip (and optionally nd_test_xe_fabric_name and nd_test_xe_pc_member_a..d) in inventory/extra-vars to
# enable; xe.yaml is skipped when nd_test_xe_switch_ip is unset. Members default to GigabitEthernet1/0/2-5 on a Catalyst leaf:
# they must exist as real ports, must not be fabric-link endpoints, and stay at the fabric default (iosXeTrunkHost) so no
# setup conversion is needed. Port-channel IDs 103-105 are reserved (Catalyst supports 1-128); 105 is a negative-test ID that
# is never actually created.
test_xe_fabric_name: "{{ nd_test_xe_fabric_name | default(test_fabric_name) }}"
test_xe_switch_ip: "{{ nd_test_xe_switch_ip | default('') }}"
test_xe_pc_member_a: "{{ nd_test_xe_pc_member_a | default('GigabitEthernet1/0/2') }}"
test_xe_pc_member_b: "{{ nd_test_xe_pc_member_b | default('GigabitEthernet1/0/3') }}"
test_xe_pc_member_c: "{{ nd_test_xe_pc_member_c | default('GigabitEthernet1/0/4') }}"
test_xe_pc_member_d: "{{ nd_test_xe_pc_member_d | default('GigabitEthernet1/0/5') }}"
# A member deliberately converted to iosXeAccess for the negative test. Reset to the fabric default (iosXeTrunkHost) after use.
test_xe_pc_member_access: "{{ nd_test_xe_pc_member_access | default('GigabitEthernet1/0/6') }}"

xe_negative_member_access:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_names:
    - "{{ test_xe_pc_member_access }}"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        admin_state: true
        access_vlan: 100
        description: "Ansible integration test XE PC negative member"

xe_pc_103:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: port-channel103   # lowercase on purpose: the module rewrites the create body to Port-channel103
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        # policy_type intentionally omitted: derived from network_os_type (iosXeTrunkPoHost); xe.yaml asserts the echo carries it.
        admin_state: true
        allowed_vlans: "10,20-30"
        port_channel_mode: active
        ports:
          - "{{ test_xe_pc_member_a }}"
          - "{{ test_xe_pc_member_b }}"
        description: "Ansible integration test XE PC 103"

xe_pc_104:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: port-channel104
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: iosXeTrunkPoHost
        admin_state: true
        allowed_vlans: "40-50"
        ports:
          - "{{ test_xe_pc_member_c }}"
        description: "Ansible integration test XE PC 104"

# No mtu: the Catalyst 9000v rejects a per-port-channel MTU at deploy time (system MTU only), so the XE scenarios never set it.
xe_pc_103_updated:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: port-channel103
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        admin_state: true
        allowed_vlans: "all"
        port_channel_mode: active
        ports:
          - "{{ test_xe_pc_member_a }}"
          - "{{ test_xe_pc_member_b }}"
        description: "Updated XE PC 103"

xe_pc_bad_member:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: port-channel105
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        allowed_vlans: "10-20"
        ports:
          - "{{ test_xe_pc_member_access }}"
