---
- name: Run port-channel trunk-host deleted harness scenarios
  block:
    - name: "DELETED SETUP: Normalize reserved port-channels"
      cisco.nd.nd_interface_port_channel_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: "{{ nd4x_port_channel_cleanup_config }}"
        state: deleted

    - name: "DELETED SETUP: Run cleanup re-query probe"
      ansible.builtin.include_tasks: nd4x_demo_setup_probe.yaml

    - name: "DELETED SINGLE SETUP: Create port-channel502"
      cisco.nd.nd_interface_port_channel_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: ["{{ test_pc_502 }}"]
        state: merged
      register: deleted_single_setup

    - name: "DELETED SINGLE: Delete port-channel502"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_port_channel_trunk_host
        state: deleted
        common_args: {output_level: "{{ nd_info.output_level }}", fabric_name: "{{ test_fabric_name }}"}
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel502
        expected:
          check_mode: {changed: true, failed: false}
          apply: {changed: true, failed: false}
          idempotency: {changed: false, failed: false}
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Validate port-channel502 is absent
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces"
            method: get
            expected_status: 200
            expect:
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel502' & @.interfaceType == 'portChannel' & @.configData.networkOS.policy.policyType == 'trunkPoHost')]", exists: false}
      register: deleted_single

    - name: "DELETED SINGLE: Verify removal and idempotency"
      ansible.builtin.assert:
        that:
          - deleted_single_setup.changed | bool
          - deleted_single.check_mode_result.changed | bool
          - deleted_single.first_run_result.changed | bool
          - deleted_single.first_run_result.after | selectattr('interface_name', 'equalto', 'port-channel502') | list | length == 0
          - not deleted_single.second_run_result.changed | bool
          - deleted_single.nd_query_results | length == 1

    - name: "DELETED MEMBER REVERT SETUP: Create port-channel501 with two members"
      cisco.nd.nd_interface_port_channel_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: ["{{ test_pc_501 }}"]
        state: merged
      register: deleted_member_setup

    - name: "DELETED MEMBER REVERT: Delete port-channel501"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_port_channel_trunk_host
        state: deleted
        common_args: {output_level: "{{ nd_info.output_level }}", fabric_name: "{{ test_fabric_name }}"}
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel501
        expected:
          check_mode: {changed: true, failed: false}
          apply: {changed: true, failed: false}
          idempotency: {changed: false, failed: false}
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Validate port-channel501 and its members were removed
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces"
            method: get
            expected_status: 200
            expect:
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel501')]", exists: false}
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == '{{ test_pc_member_a }}' & @.configData.networkOS.policy.policyType == 'poMember')]", exists: false}
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == '{{ test_pc_member_b }}' & @.configData.networkOS.policy.policyType == 'poMember')]", exists: false}
      register: deleted_member

    - name: "DELETED MEMBER REVERT: Verify port-channel501 was removed"
      ansible.builtin.assert:
        that:
          - deleted_member_setup.changed | bool
          - deleted_member.first_run_result.changed | bool
          - deleted_member.first_run_result.after | selectattr('interface_name', 'equalto', 'port-channel501') | list | length == 0
          - not deleted_member.second_run_result.changed | bool

    - name: "DELETED MULTI SETUP: Recreate port-channel501, 502, and 503"
      cisco.nd.nd_interface_port_channel_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ test_pc_501 }}"
          - "{{ test_pc_502 }}"
          - "{{ test_pc_503 }}"
        state: merged
      register: deleted_multi_setup

    - name: "DELETED MULTI: Delete port-channel501, 502, and 503"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_port_channel_trunk_host
        state: deleted
        common_args: {output_level: "{{ nd_info.output_level }}", fabric_name: "{{ test_fabric_name }}"}
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel501
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel502
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel503
        expected:
          check_mode: {changed: true, failed: false}
          apply: {changed: true, failed: false}
          idempotency: {changed: false, failed: false}
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Validate all test port-channels are absent
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces"
            method: get
            expected_status: 200
            expect:
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel501')]", exists: false}
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel502')]", exists: false}
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel503')]", exists: false}
      register: deleted_multi

    - name: "DELETED MULTI: Verify all test port-channels were removed"
      ansible.builtin.assert:
        that:
          - deleted_multi_setup.changed | bool
          - deleted_multi.check_mode_result.changed | bool
          - deleted_multi.first_run_result.changed | bool
          - deleted_multi.first_run_result.after | selectattr('interface_name', 'equalto', 'port-channel501') | list | length == 0
          - deleted_multi.first_run_result.after | selectattr('interface_name', 'equalto', 'port-channel502') | list | length == 0
          - deleted_multi.first_run_result.after | selectattr('interface_name', 'equalto', 'port-channel503') | list | length == 0
          - not deleted_multi.second_run_result.changed | bool

    - name: "DELETED NON-EXISTENT: Delete port-channel599"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_port_channel_trunk_host
        state: deleted
        common_args: {output_level: "{{ nd_info.output_level }}", fabric_name: "{{ test_fabric_name }}"}
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_name: port-channel599
        expected:
          check_mode: {changed: false, failed: false}
          apply: {changed: false, failed: false}
          idempotency: {changed: false, failed: false}
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Validate port-channel599 remains absent
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces"
            method: get
            expected_status: 200
            expect:
              - {jsonpath: "$.current.interfaces[?(@.interfaceName == 'port-channel599' & @.interfaceType == 'portChannel' & @.configData.networkOS.policy.policyType == 'trunkPoHost')]", exists: false}
      register: deleted_nonexistent

    - name: "DELETED NON-EXISTENT: Verify every phase is unchanged"
      ansible.builtin.assert:
        that:
          - not deleted_nonexistent.check_mode_result.changed | bool
          - not deleted_nonexistent.first_run_result.changed | bool
          - not deleted_nonexistent.second_run_result.changed | bool

  always:
    - name: "DELETED CLEANUP: Normalize reserved port-channels"
      cisco.nd.nd_interface_port_channel_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: "{{ nd4x_port_channel_cleanup_config }}"
        state: deleted
