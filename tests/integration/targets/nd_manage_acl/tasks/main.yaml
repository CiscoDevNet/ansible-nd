- name: Run nd_manage_acl IPv4 tests
  ansible.builtin.include_tasks: acl_ipv4.yaml

- name: Run nd_manage_acl IPv6 tests
  ansible.builtin.include_tasks: acl_ipv6.yaml

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

- name: Set shared variables for nd_manage_acl harness scenarios
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ nd_output_level | default("debug") }}'
  tags:
    - always

- name: Set nd_manage_acl harness scenario data
  ansible.builtin.include_tasks:
    file: nd4x_demo_vars.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted
        - nd4x_demo_overridden
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_preflight
    - nd4x_demo_merged
    - nd4x_demo_replaced
    - nd4x_demo_deleted
    - nd4x_demo_overridden

- name: Run ND 4.x nd_manage_acl harness preflight
  ansible.builtin.include_tasks:
    file: nd4x_demo_preflight.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted
        - nd4x_demo_overridden
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_preflight
    - nd4x_demo_merged
    - nd4x_demo_replaced
    - nd4x_demo_deleted
    - nd4x_demo_overridden

- name: Run nd_manage_acl merged harness scenarios
  ansible.builtin.include_tasks:
    file: nd4x_demo_merged.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_merged
  when: nd4x_supported | default(false) | bool

- name: Run nd_manage_acl replaced harness scenarios
  ansible.builtin.include_tasks:
    file: nd4x_demo_replaced.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_replaced
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_replaced
  when: nd4x_supported | default(false) | bool

- name: Run nd_manage_acl deleted harness scenarios
  ansible.builtin.include_tasks:
    file: nd4x_demo_deleted.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_deleted
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_deleted
  when: nd4x_supported | default(false) | bool

- name: Run nd_manage_acl overridden harness scenarios
  ansible.builtin.include_tasks:
    file: nd4x_demo_overridden.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_overridden
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_overridden
  when: nd4x_supported | default(false) | bool
