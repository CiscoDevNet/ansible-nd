---
# Test code for the cisco.nd.nd_manage_acl module - IPv6 ACL + bulk delete
# Copyright: (c) 2026, Slawomir Kaszlikowski

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ nd_output_level | default("debug") }}'

#############################################################################
# CLEANUP - ensure the IPv6 test ACL does not exist before starting
#############################################################################
- name: CLEANUP - Remove any leftover IPv6 test ACL
  cisco.nd.nd_manage_acl:
    <<: *nd_info
    fabric_name: "{{ acl_fabric }}"
    state: deleted
    config:
      - name: "{{ acl_ipv6_name }}"
  tags: always

#############################################################################
# TEST 1: STATE MERGED - create an IPv6 ACL with a port-range entry
#############################################################################
- name: "TEST 1a: Create IPv6 ACL"
  cisco.nd.nd_manage_acl:
    <<: *nd_info
    fabric_name: "{{ acl_fabric }}"
    state: merged
    config:
      - name: "{{ acl_ipv6_name }}"
        type: ipv6
        entries: &ipv6_entries
          - sequence_number: 10
            action: permit
            protocol: tcp
            src: any
            dst: "{{ acl_test_prefix_ipv6 }}"
            dst_port_action: port_range
            dst_port_range_start: 80
            dst_port_range_end: 443
          - sequence_number: 20
            action: deny
            protocol: ipv6
            src: any
            dst: any
  register: ipv6_create

- name: "TEST 1b: Create IPv6 ACL again (idempotency)"
  cisco.nd.nd_manage_acl:
    <<: *nd_info
    fabric_name: "{{ acl_fabric }}"
    state: merged
    config:
      - name: "{{ acl_ipv6_name }}"
        type: ipv6
        entries: *ipv6_entries
  register: ipv6_idempotent

- name: "TEST 1: Verify IPv6 create + idempotency"
  ansible.builtin.assert:
    that:
      - ipv6_create is changed
      - ipv6_create is not failed
      - ipv6_idempotent is not changed
      - (ipv6_create.after | selectattr('name', 'equalto', acl_ipv6_name) | list | first).type == "ipv6"
      - (ipv6_create.after | selectattr('name', 'equalto', acl_ipv6_name) | list | first).entries | length == 2
    fail_msg: "TEST 1 FAILED: IPv6 ACL create/idempotency did not behave as expected"
    success_msg: "TEST 1 PASSED: IPv6 ACL created and merged state is idempotent"

#############################################################################
# VALIDATION: query the IPv6 ACL directly from ND and assert the wire payload
#############################################################################
- name: "VALIDATION: Authenticate with ND to get a token"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/login"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      domain: "{{ ansible_httpapi_login_domain | default('local') }}"
      userName: "{{ ansible_user }}"
      userPasswd: "{{ ansible_password }}"
    validate_certs: false
    return_content: true
    status_code:
      - 200
  register: nd_auth_response_v6
  delegate_to: localhost

- name: "VALIDATION: Query the IPv6 ACL configuration from ND"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/api/v1/manage/fabrics/{{ acl_fabric }}/accessControlLists/{{ acl_ipv6_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ nd_auth_response_v6.json.jwttoken }}"
      Content-Type: "application/json"
    validate_certs: false
    return_content: true
    status_code:
      - 200
  register: ipv6_acl_query
  delegate_to: localhost

- name: "VALIDATION: Parse the IPv6 ACL response"
  ansible.builtin.set_fact:
    ipv6_acl_wire: "{{ ipv6_acl_query.json }}"

# NOTE on the persisted wire payload (verified against live ND):
#   * ND does NOT honour the ``type`` body field for IPv6 ACLs - the object is
#     always stored and returned with ``type: ipv4`` regardless of the address
#     family of its entries. The module's own ``after`` echoes the requested
#     ``ipv6`` value, but a direct ND read always reports ``ipv4``.
#   * ND returns port-range bounds as STRINGS (e.g. "80", "443"), so they are
#     coerced with ``| int`` before comparison.
- name: "VALIDATION: Verify the persisted IPv6 ACL matches the configured entries"
  ansible.builtin.assert:
    that:
      - ipv6_acl_wire.name == acl_ipv6_name
      - ipv6_acl_wire.type == "ipv4"
      - ipv6_acl_wire.entries | length == 2
      - (ipv6_acl_wire.entries | selectattr('sequenceNumber', 'equalto', 10) | list | first).dstPortAction == "portRange"
      - (ipv6_acl_wire.entries | selectattr('sequenceNumber', 'equalto', 10) | list | first).dstPortRangeStart | int == 80
      - (ipv6_acl_wire.entries | selectattr('sequenceNumber', 'equalto', 10) | list | first).dstPortRangeEnd | int == 443
    fail_msg: "VALIDATION FAILED: persisted IPv6 ACL does not match the configured entries"
    success_msg: "VALIDATION PASSED: persisted IPv6 ACL matches the configured entries"

#############################################################################
# TEST 2: STATE OVERRIDDEN with empty config - removes ALL ACLs in the fabric
#############################################################################
- name: "TEST 2a: Override fabric with empty config (remove all ACLs)"
  cisco.nd.nd_manage_acl:
    <<: *nd_info
    fabric_name: "{{ acl_fabric }}"
    state: overridden
    config: []
  register: overridden_all

- name: "TEST 2b: Override with empty config again (idempotency on empty fabric)"
  cisco.nd.nd_manage_acl:
    <<: *nd_info
    fabric_name: "{{ acl_fabric }}"
    state: overridden
    config: []
  register: overridden_idempotent

- name: "TEST 2: Verify bulk delete via overridden/empty"
  ansible.builtin.assert:
    that:
      - overridden_all is changed
      - overridden_all.before | length >= 1
      - overridden_all.after | length == 0
      - overridden_idempotent is not changed
      - overridden_idempotent.after | length == 0
    fail_msg: "TEST 2 FAILED: overridden/empty did not remove all ACLs"
    success_msg: "TEST 2 PASSED: overridden/empty removed all ACLs and is idempotent"
