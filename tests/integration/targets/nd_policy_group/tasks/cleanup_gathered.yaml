---
# Clean up all IT-GATHERED and IT-RT prefixed test policy groups.
# Uses description-based composite keys for precise cleanup.

- name: "CLEANUP GATHERED - Delete IT-GATHERED prefixed policy groups"
  cisco.nd.nd_policy_group:
    fabric_name: "{{ fabric_name }}"
    state: deleted
    deploy: true
    config:
      - name: feature_enable
        description: "IT-GATHERED-Enable LACP"
      - name: feature_enable
        description: "IT-GATHERED-Enable LLDP"
      - name: switch_freeform
        description: "IT-GATHERED-System vlan long-name"
      - name: clock_timezone
        description: "IT-GATHERED-Timezone CET"
  ignore_errors: true

- name: "CLEANUP RT - Delete IT-RT prefixed policy groups"
  cisco.nd.nd_policy_group:
    fabric_name: "{{ fabric_name }}"
    state: deleted
    deploy: true
    config:
      - name: feature_enable
        description: "IT-RT-Enable LACP"
      - name: feature_enable
        description: "IT-RT-Enable LLDP"
      - name: switch_freeform
        description: "IT-RT-System vlan long-name"
      - name: clock_timezone
        description: "IT-RT-Timezone CET"
  ignore_errors: true
