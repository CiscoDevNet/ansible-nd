- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'

#############################################################################
# PREREQUISITES - Build the fabric group and its candidate member fabrics
#
# The member module can only be exercised against fabrics that already exist, so
# this target creates them rather than assuming a prepared controller. Without
# this block an empty controller yields empty member lists and the gathered and
# idempotency assertions pass without testing anything.
#############################################################################
- name: "PREREQ: Detach leftover members from a previous run"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_1 }}"
      - member_name: "{{ test_member_2 }}"
      - member_name: "{{ test_member_3 }}"
    state: deleted
  ignore_errors: true

- name: "PREREQ: Remove leftover fabric group from a previous run"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ test_fabric_group }}"
  ignore_errors: true

- name: "PREREQ: Remove leftover member fabrics from a previous run"
  cisco.nd.nd_manage_fabric_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ test_member_1 }}"
      - fabric_name: "{{ test_member_2 }}"
      - fabric_name: "{{ test_member_3 }}"
  ignore_errors: true

- name: "PREREQ: Create the member fabrics"
  cisco.nd.nd_manage_fabric_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ item.name }}"
        management:
          bgp_asn: "{{ item.bgp_asn }}"
          anycast_gateway_mac: "{{ test_anycast_gateway_mac }}"
  loop: "{{ test_member_fabrics }}"
  loop_control:
    label: "{{ item.name }}"
  register: prereq_member_fabrics

- name: "PREREQ: Create the fabric group"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': test_fabric_group} | combine(fabric_config_group) }}"
  register: prereq_fabric_group

- name: "PREREQ: Verify the fabric group and member fabrics exist"
  ansible.builtin.assert:
    that:
      - prereq_member_fabrics is not failed
      - prereq_fabric_group is not failed
    fail_msg: "Prerequisite fabrics could not be created; member tests would not be meaningful"

#############################################################################
# CLEANUP - Ensure clean state before tests
#############################################################################
- name: Remove all test members from fabric group before test starts
  cisco.nd.nd_manage_fabric_group_members: &clean_all_members
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_1 }}"
      - member_name: "{{ test_member_2 }}"
      - member_name: "{{ test_member_3 }}"
    state: deleted

#############################################################################
# GATHERED STATE TESTS
#############################################################################
- name: "GATHERED: Retrieve current members of the fabric group"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config: []
    state: gathered
  register: gathered_result

- name: "GATHERED: Verify gathered state returns members without changes"
  ansible.builtin.assert:
    that:
      - gathered_result is not changed
      - gathered_result.gathered is defined

#############################################################################
# INPUT VALIDATION TESTS
#
# All three of these are silent failures without the surface-resolution checks:
# the members endpoint answers 200 with an empty list for a fabric, answers 500
# "Failed to check fabric type" for an unknown name, and Manage accepts a
# cluster_name only to drop it, which breaks member identity on the next run.
#############################################################################
- name: "VALIDATION: Target a fabric group that does not exist"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "ansible_no_such_fabric_group"
    config:
      - member_name: "{{ test_member_1 }}"
    state: merged
  register: unknown_group_result
  ignore_errors: true

- name: "VALIDATION: Target a fabric instead of a fabric group"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_member_1 }}"
    config:
      - member_name: "{{ test_member_2 }}"
    state: merged
  register: not_a_group_result
  ignore_errors: true

- name: "VALIDATION: Supply cluster_name for a single-cluster fabric group"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_1 }}"
        cluster_name: "some-cluster"
    state: merged
  register: unexpected_cluster_name_result
  ignore_errors: true

- name: "VALIDATION: Verify each invalid target is rejected with a specific reason"
  ansible.builtin.assert:
    that:
      - unknown_group_result is failed
      - "'was not found through the ND Manage API' in unknown_group_result.msg"
      - not_a_group_result is failed
      - "'is a fabric, not a fabric group' in not_a_group_result.msg"
      - unexpected_cluster_name_result is failed
      - "'cluster_name' in unexpected_cluster_name_result.msg"

#############################################################################
# MERGED STATE TESTS - ADD MEMBERS
#############################################################################
- name: "MERGED CREATE: Add members to fabric group (check mode)"
  cisco.nd.nd_manage_fabric_group_members: &add_members_merged
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_1 }}"
      - member_name: "{{ test_member_2 }}"
    state: merged
  check_mode: true
  register: cm_merged_add_members

- name: "MERGED CREATE: Add members to fabric group (normal mode)"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *add_members_merged
  register: nm_merged_add_members

- name: "MERGED CREATE: Verify members were added"
  ansible.builtin.assert:
    that:
      - cm_merged_add_members is changed
      - nm_merged_add_members is changed

- name: "MERGED IDEMPOTENT: Add same members again (idempotency test)"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *add_members_merged
  register: nm_merged_add_members_again

- name: "MERGED IDEMPOTENT: Verify no changes on rerun"
  ansible.builtin.assert:
    that:
      - nm_merged_add_members_again is not changed

- name: "MERGED ADD: Add a third member to fabric group"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_3 }}"
    state: merged
  register: nm_merged_add_third_member

- name: "MERGED ADD: Verify third member was added"
  ansible.builtin.assert:
    that:
      - nm_merged_add_third_member is changed

#############################################################################
# DELETED STATE TESTS - REMOVE MEMBERS
#############################################################################
- name: "DELETED: Remove one member from fabric group (check mode)"
  cisco.nd.nd_manage_fabric_group_members: &delete_member
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_3 }}"
    state: deleted
  check_mode: true
  register: cm_deleted_remove_member

- name: "DELETED: Remove one member from fabric group (normal mode)"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *delete_member
  register: nm_deleted_remove_member

- name: "DELETED: Verify member was removed"
  ansible.builtin.assert:
    that:
      - cm_deleted_remove_member is changed
      - nm_deleted_remove_member is changed

- name: "DELETED IDEMPOTENT: Remove same member again (idempotency)"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *delete_member
  register: nm_deleted_remove_member_again

- name: "DELETED IDEMPOTENT: Verify no changes on rerun"
  ansible.builtin.assert:
    that:
      - nm_deleted_remove_member_again is not changed

- name: "DELETED: Remove remaining test members"
  cisco.nd.nd_manage_fabric_group_members:
    <<: *nd_info
    fabric_name: "{{ test_fabric_group }}"
    config:
      - member_name: "{{ test_member_1 }}"
      - member_name: "{{ test_member_2 }}"
    state: deleted
  register: nm_deleted_remove_remaining

- name: "DELETED: Verify remaining members were removed"
  ansible.builtin.assert:
    that:
      - nm_deleted_remove_remaining is changed

#############################################################################
# MULTI-CLUSTER FABRIC GROUP TESTS
#
# Skipped unless the target controller has a multi-cluster fabric group and the
# inventory authenticates through its login domain, because neither can be
# created from this target: a multi-cluster fabric group only exists on a
# federated controller, and the OneManage API answers every request from a
# local-domain session with "this API is allowed only for remote user".
#
# Define `test_mcfg_group`, `test_mcfg_member` and `test_mcfg_cluster` in the
# inventory to enable them.
#############################################################################
- name: "MCFG: Run the multi-cluster fabric group member tests"
  when:
    - test_mcfg_group is defined
    - test_mcfg_member is defined
    - test_mcfg_cluster is defined
  block:
    - name: "MCFG CLEANUP: Remove the test member before the test starts"
      cisco.nd.nd_manage_fabric_group_members: &mcfg_member_absent
        <<: *nd_info
        fabric_name: "{{ test_mcfg_group }}"
        config:
          - member_name: "{{ test_mcfg_member }}"
            cluster_name: "{{ test_mcfg_cluster }}"
        state: deleted

    - name: "MCFG VALIDATION: Omit cluster_name for a multi-cluster member"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *nd_info
        fabric_name: "{{ test_mcfg_group }}"
        config:
          - member_name: "{{ test_mcfg_member }}"
        state: merged
      register: mcfg_missing_cluster_name
      ignore_errors: true

    - name: "MCFG VALIDATION: Verify a member without cluster_name is rejected"
      ansible.builtin.assert:
        that:
          - mcfg_missing_cluster_name is failed
          - "'cluster_name' is in mcfg_missing_cluster_name.msg"
        fail_msg: "OneManage answers an unexplained HTTP 500 for a member without clusterName, so it must be caught first"

    - name: "MCFG MERGED: Add the member (check mode)"
      cisco.nd.nd_manage_fabric_group_members: &mcfg_member_present
        <<: *nd_info
        fabric_name: "{{ test_mcfg_group }}"
        config:
          - member_name: "{{ test_mcfg_member }}"
            cluster_name: "{{ test_mcfg_cluster }}"
        state: merged
      check_mode: true
      register: cm_mcfg_add

    - name: "MCFG MERGED: Add the member (normal mode)"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *mcfg_member_present
      register: nm_mcfg_add

    - name: "MCFG MERGED: Verify the member was added"
      ansible.builtin.assert:
        that:
          - cm_mcfg_add is changed
          - nm_mcfg_add is changed

    - name: "MCFG IDEMPOTENT: Add the same member again"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *mcfg_member_present
      register: nm_mcfg_add_again

    - name: "MCFG IDEMPOTENT: Verify no change on rerun"
      ansible.builtin.assert:
        that:
          - nm_mcfg_add_again is not changed
        fail_msg: "A re-add is rejected by ND with 'already assigned to Fabric Group', so identity must match on the second run"

    - name: "MCFG GATHERED: Retrieve the members"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *nd_info
        fabric_name: "{{ test_mcfg_group }}"
        config: []
        state: gathered
      register: mcfg_gathered

    - name: "MCFG GATHERED: Verify the member is reported with its cluster"
      ansible.builtin.assert:
        that:
          - mcfg_gathered is not changed
          - test_mcfg_member in (mcfg_gathered.gathered | map(attribute='member_name') | list)
          - test_mcfg_cluster in (mcfg_gathered.gathered | map(attribute='cluster_name') | list)

    - name: "MCFG DELETED: Remove the member"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *mcfg_member_absent
      register: nm_mcfg_remove

    - name: "MCFG DELETED IDEMPOTENT: Remove the same member again"
      cisco.nd.nd_manage_fabric_group_members:
        <<: *mcfg_member_absent
      register: nm_mcfg_remove_again

    - name: "MCFG DELETED: Verify the member was removed exactly once"
      ansible.builtin.assert:
        that:
          - nm_mcfg_remove is changed
          - nm_mcfg_remove_again is not changed

#############################################################################
# CLEANUP
#
# Order matters: a fabric that is still a group member cannot be deleted, and a
# group with members cannot be removed, so unwind membership first.
#############################################################################
- name: Final cleanup - remove all test members
  cisco.nd.nd_manage_fabric_group_members:
    <<: *clean_all_members
  ignore_errors: true

- name: "TEARDOWN: Delete the fabric group"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ test_fabric_group }}"
  ignore_errors: true

- name: "TEARDOWN: Delete the member fabrics"
  cisco.nd.nd_manage_fabric_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ test_member_1 }}"
      - fabric_name: "{{ test_member_2 }}"
      - fabric_name: "{{ test_member_3 }}"
  ignore_errors: true
