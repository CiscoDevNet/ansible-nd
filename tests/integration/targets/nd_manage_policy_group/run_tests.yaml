---
# Runner playbook for nd_policy_group integration tests.
#
# Usage:
#   ansible-playbook -i tests/integration/inventory.networking \
#     tests/integration/targets/nd_policy_group/run_tests.yaml \
#     -e testcase=merged \
#     -e @tests/integration/integration_config.yml
#
# To override fabric/switch at runtime:
#   ansible-playbook -i tests/integration/inventory.networking \
#     tests/integration/targets/nd_policy_group/run_tests.yaml \
#     -e testcase=merged \
#     -e ansible_it_fabric=my_fabric \
#     -e ansible_switch1=FDO12345678

- name: ND Policy Group Integration Tests
  hosts: nd
  gather_facts: false
  roles:
    - role: "{{ playbook_dir }}"
