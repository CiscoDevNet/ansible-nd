---
##############################################
##               SETUP                      ##
##############################################

- name: "MERGED - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: merged

- block:

    ##############################################
    ##          MERGE - Create                  ##
    ##############################################

    # TC-1: Create a single policy group
    - name: "MERGED TC1 - Preview switch_freeform policy group creation"
      cisco.nd.nd_manage_policy_group: &merged_freeform
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            priority: 110
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "system vlan long-name"
      check_mode: true
      register: create_preview
      tags: merged

    - name: "MERGED TC1 - Verify effective creation preview"
      vars:
        target_before: "{{ create_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ create_preview.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - create_preview.changed == true
          - target_before == []
          - target_after | length == 1
          - target_after[0].policy_id is not defined
          - target_after[0].priority == 110
          - target_after[0].switch_ids == [switch_serial_1]
          - target_after[0].template_inputs.CONF == 'system vlan long-name'
      tags: merged

    - name: "MERGED TC1 - Gather after creation preview"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: create_preview_readback
      tags: merged

    - name: "MERGED TC1 - Verify creation preview did not persist"
      ansible.builtin.assert:
        that:
          - create_preview_readback.changed == false
          - create_preview_readback.gathered == []
      tags: merged

    - name: "MERGED TC1 - Create switch_freeform policy group"
      cisco.nd.nd_manage_policy_group: *merged_freeform
      register: result
      tags: merged

    - name: "MERGED TC1 - Verify creation"
      vars:
        target_before: "{{ result.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ result.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target_before == []
          - target_after | length == 1
          - target_after[0].policy_id is match('^POLICY-GROUP-')
          - target_after[0].priority == 110
          - target_after[0].template_inputs.CONF == 'system vlan long-name'
      tags: merged


    # TC-2: Idempotence - Re-run the same task
    - name: "MERGED TC2 - Idempotence in real and check modes"
      cisco.nd.nd_manage_policy_group: *merged_freeform
      check_mode: "{{ item }}"
      loop: [false, true]
      loop_control:
        label: "check_mode={{ item }}"
      register: result
      tags: merged

    - name: "MERGED TC2 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.results | length == 2
          - result.results[0].changed == false
          - result.results[1].changed == false
          - result.results[0].before == result.results[0].after
          - result.results[1].before == result.results[1].after
      tags: merged

    ##############################################
    ##   MERGE - Same template, different desc  ##
    ##############################################

    # TC-3 PRE: BFD freeform requires 'feature bfd' to be enabled on the
    # switch first, otherwise NX-OS rejects 'bfd interval ...' commands
    # and ND reports a switch-level deploy failure.
    - name: "MERGED TC3-PRE - Enable BFD feature via feature_enable template"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Enable BFD feature"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: bfd
      register: result_bfd_feature
      tags: merged

    # TC-3: Create a second group with same template but different description
    - name: "MERGED TC3 - Create second switch_freeform group (different description)"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable BFD timers"
            priority: 115
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"
      register: result
      tags: merged

    - name: "MERGED TC3 - Verify creation of second group"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    ##############################################
    ##      MERGE - Update existing group       ##
    ##############################################

    # TC-4: Update template_inputs on existing group
    - name: "MERGED TC4 - Preview sparse template-input update"
      cisco.nd.nd_manage_policy_group: &merged_freeform_update
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            template_inputs:
              CONF: "system vlan long-name\nno ip domain-lookup"
      check_mode: true
      register: update_preview
      tags: merged

    - name: "MERGED TC4 - Verify effective update preview"
      vars:
        target_before: "{{ update_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ update_preview.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - update_preview.changed == true
          - target_before | length == 1
          - target_after | length == 1
          - target_before[0].policy_id == target_after[0].policy_id
          - target_before[0].priority == 110
          - target_after[0].priority == 110
          - target_after[0].switch_ids == target_before[0].switch_ids
          - target_before[0].template_inputs.CONF == 'system vlan long-name'
          - target_after[0].template_inputs.CONF == 'system vlan long-name\nno ip domain-lookup'
      tags: merged

    - name: "MERGED TC4 - Gather after update preview"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: update_preview_readback
      tags: merged

    - name: "MERGED TC4 - Verify update preview did not persist"
      ansible.builtin.assert:
        that:
          - update_preview_readback.changed == false
          - update_preview_readback.gathered | length == 1
          - update_preview_readback.gathered[0].priority == 110
          - update_preview_readback.gathered[0].template_inputs.CONF == 'system vlan long-name'
      tags: merged

    - name: "MERGED TC4 - Update template_inputs on existing policy group"
      cisco.nd.nd_manage_policy_group: *merged_freeform_update
      register: result
      tags: merged

    - name: "MERGED TC4 - Verify update (changed)"
      vars:
        target_before: "{{ result.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ result.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target_before | length == 1
          - target_after | length == 1
          - target_before[0].priority == 110
          - target_after[0].priority == 110
          - target_after[0].template_inputs.CONF == 'system vlan long-name\nno ip domain-lookup'
      tags: merged

    - name: "MERGED TC4 - Gather updated policy group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: tc4_gathered
      tags: merged

    - name: "MERGED TC4 - Verify omitted update preserved priority"
      ansible.builtin.assert:
        that:
          - tc4_gathered.gathered | length == 1
          - tc4_gathered.gathered[0].priority == 110
      tags: merged

    # TC-5: Idempotence after update
    - name: "MERGED TC5 - Idempotence after template_inputs update"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            template_inputs:
              CONF: "system vlan long-name\nno ip domain-lookup"
      register: result
      tags: merged

    - name: "MERGED TC5 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: merged

    ##############################################
    ##    MERGE - Update template_inputs        ##
    ##############################################

    # TC-6: Update template_inputs on existing group
    - name: "MERGED TC6 - Update template_inputs"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable BFD timers"
            template_inputs:
              CONF: "bfd interval 500 min_rx 500 multiplier 5"
      register: result
      tags: merged

    - name: "MERGED TC6 - Verify template_inputs update"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    ##############################################
    ##    MERGE - Bulk create multiple groups   ##
    ##############################################

    # TC-7: Create multiple groups in a single task
    - name: "MERGED TC7 - Bulk create two feature_enable groups"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Enable LACP on leaf switches"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
          - name: feature_enable
            description: "Enable LLDP on leaf switches"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lldp
      register: result
      tags: merged

    - name: "MERGED TC7 - Verify bulk creation"
      vars:
        created: >-
          {{ result.after | selectattr('description', 'in',
             ['Enable LACP on leaf switches', 'Enable LLDP on leaf switches']) | list }}
      ansible.builtin.assert:
        that:
          - result.changed == true
          - created | length == 2
          - created | map(attribute='priority') | list == [500, 500]
          - created | map(attribute='policy_id') | unique | list | length == 2
          - created | map(attribute='template_inputs.featureName') | sort == ['lacp', 'lldp']
      tags: merged

    # TC-8: Idempotence on bulk create
    - name: "MERGED TC8 - Idempotence on bulk create"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: feature_enable
            description: "Enable LACP on leaf switches"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
          - name: feature_enable
            description: "Enable LLDP on leaf switches"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lldp
      register: result
      tags: merged

    - name: "MERGED TC8 - Verify idempotence on bulk"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: merged

    ##############################################
    ##  MERGE - Validation: missing description ##
    ##############################################

    # TC-9: Fail when description is missing for merged state
    - name: "MERGED TC9 - Expect failure when description is missing"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: switch_freeform
            switch_ids:
              - "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: merged

    - name: "MERGED TC9 - Verify failure message"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - "'description' in result.msg"
      tags: merged

    ##############################################
    ##  MERGE - Update template_inputs in place ##
    ##############################################

    # TC-10: Create clock_timezone group, then update HOUR_OFFSET
    - name: "MERGED TC10 - Create clock_timezone policy group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: clock_timezone
            description: "Set timezone to CET"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
      register: result
      tags: merged

    - name: "MERGED TC10 - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-11: Update HOUR_OFFSET from 1 → 5 (same description, same template)
    - name: "MERGED TC11 - Update clock_timezone HOUR_OFFSET"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: clock_timezone
            description: "Set timezone to CET"
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 5
              MINUTE_OFFSET: 0
      register: result
      tags: merged

    - name: "MERGED TC11 - Verify update detected (changed)"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-12: Idempotence after HOUR_OFFSET update
    - name: "MERGED TC12 - Idempotence after clock_timezone update"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: clock_timezone
            description: "Set timezone to CET"
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 5
              MINUTE_OFFSET: 0
      register: result
      tags: merged

    - name: "MERGED TC12 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: merged

    ##############################################
    ##  MERGE - Update switch_ids in place      ##
    ##############################################

    # TC-13: Add switch_serial_2, remove switch_serial_1 → should update
    # Before: switch_ids = [switch_serial_1]
    # After:  switch_ids = [switch_serial_2, switch_serial_3]
    - name: "MERGED TC13 - Update switch_ids (add new, remove old)"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Enable LACP on leaf switches"
            switch_ids:
              - "{{ switch_serial_2 }}"
              - "{{ switch_serial_3 }}"
      register: result
      tags: merged

    - name: "MERGED TC13 - Verify switch_ids update detected (changed)"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-14: Idempotence after switch_ids update
    - name: "MERGED TC14 - Idempotence after switch_ids change"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: feature_enable
            description: "Enable LACP on leaf switches"
            switch_ids:
              - "{{ switch_serial_2 }}"
              - "{{ switch_serial_3 }}"
      register: result
      tags: merged

    - name: "MERGED TC14 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: merged

    ##############################################
    ## MERGE - Mixed membership + intent update ##
    ##############################################

    # TC-15: Create a feature_enable group on one switch.
    - name: "MERGED TC15 - Create group for split membership and intent update"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Split membership and intent update"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
      register: result
      tags: merged

    - name: "MERGED TC15 - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-16: Change both switch membership and featureName in one task. The
    # module must split this into separate controller PUTs because ND rejects
    # a single policy-group PUT that changes membership and intent together.
    - name: "MERGED TC16 - Update membership and template_inputs together"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Split membership and intent update"
            switch_ids:
              - "{{ switch_serial_1 }}"
              - "{{ switch_serial_2 }}"
            template_inputs:
              featureName: lldp
      register: result
      tags: merged

    - name: "MERGED TC16 - Verify mixed update detected"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    - name: "MERGED TC16 - Gather mixed update result"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: feature_enable
            description: "Split membership and intent update"
      register: mixed_update_gathered
      tags: merged

    - name: "MERGED TC16 - Verify final mixed update state"
      ansible.builtin.assert:
        that:
          - mixed_update_gathered.gathered | length == 1
          - switch_serial_1 in mixed_update_gathered.gathered[0].switch_ids
          - switch_serial_2 in mixed_update_gathered.gathered[0].switch_ids
          - mixed_update_gathered.gathered[0].template_inputs.featureName == "lldp"
      tags: merged

  always:
    - name: "MERGED - Cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: merged
