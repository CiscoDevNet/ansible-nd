        - name: DELETED TC9 - Preview deletion of every group using the template
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                create_additional_policy: true
          register: deleted_tc9_preview
          check_mode: true

        - name: DELETED TC9 - Verify broad preview never creates a replacement
          ansible.builtin.assert:
            that:
              - deleted_tc9_preview.changed
              - deleted_tc9_preview.force_created is not defined

        - name: DELETED TC9 - Independently read every exact fixture ID after preview
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: "{{ deleted_tc9_clock_ids[0] }}"
              - name: "{{ deleted_tc9_clock_ids[1] }}"
              - name: "{{ deleted_tc9_clock_ids[2] }}"
              - name: "{{ deleted_tc9_control_id }}"
          register: deleted_tc9_after_preview

        - name: DELETED TC9 - Verify preview preserved all clock and control fixtures
          ansible.builtin.assert:
            that:
              - >-
                (deleted_tc9_after_preview.gathered | sort(attribute='policy_id')) == ((deleted_tc9_before.gathered + deleted_tc9_control_before.gathered) |
                sort(attribute='policy_id'))

        - name: DELETED TC9 - Delete all template matches while retaining the creation flag
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                create_additional_policy: true
          register: deleted_tc9_deleted

        - name: DELETED TC9 - Verify broad deletion was accepted without creation
          ansible.builtin.assert:
            that:
              - deleted_tc9_deleted.changed
              - deleted_tc9_deleted.force_created is not defined

        - name: DELETED TC9 - Independently gather the clock template and exact control
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
              - name: "{{ deleted_tc9_control_id }}"
          register: deleted_tc9_after

        - name: DELETED TC9 - Read raw parent and source identities after broad deletion
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: deleted_tc9_raw_final

        - name: DELETED TC9 - Require every clock identity absent and the control unchanged
          ansible.builtin.assert:
            that:
              - deleted_tc9_after.gathered == deleted_tc9_control_before.gathered
              - >-
                deleted_tc9_raw_final.current.policies | selectattr('policyId', 'in', deleted_tc9_clock_ids) | list == []
              - >-
                deleted_tc9_raw_final.current.policies | selectattr('source', 'defined') | selectattr('source', 'in', deleted_tc9_clock_ids) | list == []

        - name: DELETED TC9 - Refresh both clock switches after broad deletion
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: ["{{ switch_serial_1 }}", "{{ switch_serial_2 }}"]
          register: deleted_tc9_final_pending

        - name: DELETED TC9 - Require every clock removal deployed
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ deleted_tc9_final_pending.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: DELETED TC9 - Repeat the broad absent deletion in real and check modes
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                create_additional_policy: true
          register: deleted_tc9_repeat
          check_mode: "{{ item }}"
          loop: [false, true]
          loop_control:
            label: "check_mode={{ item }}"

        - name: DELETED TC9 - Verify repeated broad deletion is unchanged in both modes
          ansible.builtin.assert:
            that:
              - not deleted_tc9_repeat.changed
              - deleted_tc9_repeat.results | length == 2
              - not deleted_tc9_repeat.results[0].changed
              - not deleted_tc9_repeat.results[1].changed
              - deleted_tc9_repeat.results[0].force_created is not defined
              - deleted_tc9_repeat.results[1].force_created is not defined

        - name: DELETED TC9 - Independently gather after repeated deletion
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
              - name: "{{ deleted_tc9_control_id }}"
          register: deleted_tc9_after_repeat

        - name: DELETED TC9 - Verify no replacement appeared and the control still matches
          ansible.builtin.assert:
            that:
              - deleted_tc9_after_repeat.gathered == deleted_tc9_control_before.gathered
      always:

        - name: DELETED TC9 - Read accepted create results for exact cleanup
          ansible.builtin.set_fact:
            deleted_tc9_returned_creates: >-
              {{ (deleted_tc9_first_created.force_created if deleted_tc9_first_created is mapping and deleted_tc9_first_created.force_created is defined and
              deleted_tc9_first_created.force_created is sequence and deleted_tc9_first_created.force_created is not string and deleted_tc9_first_created.force_created
              is not mapping else []) + (deleted_tc9_created.force_created if deleted_tc9_created is mapping and deleted_tc9_created.force_created is defined
              and deleted_tc9_created.force_created is sequence and deleted_tc9_created.force_created is not string and deleted_tc9_created.force_created is
              not mapping else []) }}

        - name: DELETED TC9 - Recover every accepted exact ID and original member list
          ansible.builtin.set_fact:
            deleted_tc9_cleanup_entries: "{{ deleted_tc9_cleanup_entries + [{'name': item.policy_id, 'switch_ids': item.switch_ids}] }}"
          loop: "{{ deleted_tc9_returned_creates }}"
          loop_control:
            label: "{{ item.policy_id | default('unusable create result') }}"
          when:
            - item is mapping
            - item.policy_id is defined
            - item.policy_id is string
            - item.policy_id is match('^POLICY-GROUP-.+')
            - item.switch_ids is defined
            - item.switch_ids is sequence
            - item.switch_ids is not string
            - item.switch_ids is not mapping
            - item.switch_ids | length > 0

        - name: DELETED TC9 - Clean up only captured exact IDs with full original members
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config: "{{ deleted_tc9_cleanup_entries }}"
          register: deleted_tc9_cleanup_result
          when: deleted_tc9_cleanup_entries | length > 0

    - name: DELETED TC10 - Select deletion targets by the complete requested membership
      tags: [deleted, deleted_membership_selector]
      block:

        - name: DELETED TC10 - Reset fixture capture
          ansible.builtin.set_fact:
            deleted_tc10_cleanup_entries: []
            deleted_tc10_description: >-
              DELETED-TC10-{{ lookup('ansible.builtin.password', '/dev/null length=10 chars=ascii_lowercase,digits') }}
            deleted_tc10_old_created: {}
            deleted_tc10_new_created: {}
            deleted_tc10_third_created: {}

        - name: DELETED TC10 - Read all three switches before membership selection fixtures
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: ["{{ switch_serial_1 }}", "{{ switch_serial_2 }}", "{{ switch_serial_3 }}"]
          register: deleted_tc10_preflight

        - name: DELETED TC10 - Require all membership fixture switches clean
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ deleted_tc10_preflight.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: DELETED TC10 - Verify no clock group exists before fixture ownership
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
          register: deleted_tc10_preexisting

        - name: DELETED TC10 - Read complete raw inventory before fixture creation
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: deleted_tc10_raw_preexisting

        - name: DELETED TC10 - Require complete and empty clock ownership
          ansible.builtin.assert:
            that:
              - deleted_tc10_raw_preexisting.current.meta.counts.remaining is defined
              - deleted_tc10_raw_preexisting.current.meta.counts.remaining is integer
              - deleted_tc10_raw_preexisting.current.meta.counts.remaining == 0
              - deleted_tc10_preexisting.gathered is defined
              - deleted_tc10_preexisting.gathered == []
              - >-
                deleted_tc10_raw_preexisting.current.policies | selectattr('templateName', 'equalto', 'clock_timezone') | list == []

        - name: DELETED TC10 - Create the older two-member fixture separately
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                create_additional_policy: true
                switch_ids: ["{{ switch_serial_1 }}", "{{ switch_serial_3 }}"]
                template_inputs:
                  TIME_ZONE: CET
                  HOUR_OFFSET: 1
                  MINUTE_OFFSET: 0
          register: deleted_tc10_old_created

        - name: DELETED TC10 - Capture the older exact ID immediately
          ansible.builtin.set_fact:
            deleted_tc10_old_id: "{{ deleted_tc10_old_created.force_created[0].policy_id }}"

        - name: DELETED TC10 - Create the newer one-member duplicate separately
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                create_additional_policy: true
                switch_ids: ["{{ switch_serial_2 }}"]
                template_inputs:
                  TIME_ZONE: CET
                  HOUR_OFFSET: 1
                  MINUTE_OFFSET: 0
          register: deleted_tc10_new_created

        - name: DELETED TC10 - Capture the newer exact ID immediately
          ansible.builtin.set_fact:
            deleted_tc10_new_id: "{{ deleted_tc10_new_created.force_created[0].policy_id }}"

        - name: DELETED TC10 - Independently gather both membership candidates
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_before

        - name: DELETED TC10 - Read the existing newest composite winner without writing
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_winner
          check_mode: true

        - name: DELETED TC10 - Prove the requested older membership differs from the newest winner
          ansible.builtin.assert:
            that:
              - deleted_tc10_old_created.changed
              - deleted_tc10_new_created.changed
              - deleted_tc10_old_id != deleted_tc10_new_id
              - deleted_tc10_before.gathered | length == 2
              - >-
                deleted_tc10_before.gathered | map(attribute='policy_id') | sort == [deleted_tc10_old_id, deleted_tc10_new_id] | sort
              - >-
                (deleted_tc10_before.gathered | selectattr('policy_id', 'equalto', deleted_tc10_old_id) | first).switch_ids | sort == [switch_serial_1, switch_serial_3]
                | sort
              - >-
                (deleted_tc10_before.gathered | selectattr('policy_id', 'equalto', deleted_tc10_new_id) | first).switch_ids == [switch_serial_2]
              - not deleted_tc10_winner.changed
              - >-
                deleted_tc10_winner.before | selectattr('description', 'equalto', deleted_tc10_description) | selectattr('template_name', 'equalto', 'clock_timezone')
                | map(attribute='policy_id') | list == [deleted_tc10_new_id]

        - name: DELETED TC10 - Define only nonmatching membership selectors
          ansible.builtin.set_fact:
            deleted_tc10_invalid_members:
              - label: subset
                members:
                  - "{{ switch_serial_1 }}"
              - label: superset
                members:
                  - "{{ switch_serial_1 }}"
                  - "{{ switch_serial_2 }}"
                  - "{{ switch_serial_3 }}"
              - label: empty
                members: []

        - name: DELETED TC10 - Reject subset superset and empty membership in real and check modes
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                switch_ids: "{{ item.0.members }}"
          register: deleted_tc10_rejected
          check_mode: "{{ item.1 }}"
          loop: "{{ deleted_tc10_invalid_members | product([false, true]) | list }}"
          loop_control:
            label: "{{ item.0.label }} check_mode={{ item.1 }}"
          ignore_errors: true

        - name: DELETED TC10 - Verify every nonmatching selector failed without accepted changes
          ansible.builtin.assert:
            that:
              - deleted_tc10_rejected.failed == true
              - deleted_tc10_rejected.results | length == 6
              - deleted_tc10_rejected.results | selectattr('failed', 'equalto', true) | list | length == 6
              - deleted_tc10_rejected.results | selectattr('changed', 'equalto', true) | list == []

        - name: DELETED TC10 - Independently gather after all rejected membership requests
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_after_rejected

        - name: DELETED TC10 - Verify rejected requests preserved both complete candidates
          ansible.builtin.assert:
            that:
              - >-
                (deleted_tc10_after_rejected.gathered | sort(attribute='policy_id')) == (deleted_tc10_before.gathered | sort(attribute='policy_id'))

        - name: DELETED TC10 - Preview the older exact membership ignoring order and duplicates
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                switch_ids: ["{{ switch_serial_3 }}", "{{ switch_serial_1 }}", "{{ switch_serial_3 }}"]
          register: deleted_tc10_preview
          check_mode: true

        - name: DELETED TC10 - Verify exact-members preview removes only the older target
          ansible.builtin.assert:
            that:
              - deleted_tc10_preview.changed
              - >-
                deleted_tc10_preview.after | selectattr('description', 'equalto', deleted_tc10_description) | selectattr('template_name', 'equalto', 'clock_timezone')
                | map(attribute='policy_id') | list == [deleted_tc10_new_id]

        - name: DELETED TC10 - Independently gather after the membership deletion preview
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_after_preview

        - name: DELETED TC10 - Verify the exact-members preview did not persist
          ansible.builtin.assert:
            that:
              - >-
                (deleted_tc10_after_preview.gathered | sort(attribute='policy_id')) == (deleted_tc10_before.gathered | sort(attribute='policy_id'))

        - name: DELETED TC10 - Delete and deploy only the older exact member set
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                switch_ids: ["{{ switch_serial_3 }}", "{{ switch_serial_1 }}", "{{ switch_serial_3 }}"]
          register: deleted_tc10_deleted

        - name: DELETED TC10 - Independently gather the exact-members survivor
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_survivor

        - name: DELETED TC10 - Inspect raw older identity after exact-members deletion
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: deleted_tc10_raw_after

        - name: DELETED TC10 - Require only the older identity removed and newer configuration preserved
          ansible.builtin.assert:
            that:
              - deleted_tc10_deleted.changed
              - deleted_tc10_survivor.gathered | length == 1
              - deleted_tc10_survivor.gathered[0].policy_id == deleted_tc10_new_id
              - >-
                deleted_tc10_survivor.gathered[0] == (deleted_tc10_before.gathered | selectattr('policy_id', 'equalto', deleted_tc10_new_id) | first)
              - deleted_tc10_old_rows == []
          vars:
            deleted_tc10_old_rows: >-
              {{ (deleted_tc10_raw_after.current.policies | selectattr('policyId', 'equalto', deleted_tc10_old_id) | list) + (deleted_tc10_raw_after.current.policies
              | selectattr('source', 'defined') | selectattr('source', 'equalto', deleted_tc10_old_id) | list) }}

        - name: DELETED TC10 - Refresh the older original members after deletion
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: ["{{ switch_serial_1 }}", "{{ switch_serial_3 }}"]
          register: deleted_tc10_old_pending

        - name: DELETED TC10 - Require both older member removals deployed
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ deleted_tc10_old_pending.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: DELETED TC10 - Create a third group with the same exact surviving members
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                create_additional_policy: true
                priority: 600
                switch_ids: ["{{ switch_serial_2 }}"]
                template_inputs:
                  TIME_ZONE: CET
                  HOUR_OFFSET: 1
                  MINUTE_OFFSET: 0
          register: deleted_tc10_third_created

        - name: DELETED TC10 - Capture the third accepted exact ID immediately
          ansible.builtin.set_fact:
            deleted_tc10_third_id: "{{ deleted_tc10_third_created.force_created[0].policy_id }}"

        - name: DELETED TC10 - Independently gather both exact-members ambiguity candidates
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_ambiguous_before

        - name: DELETED TC10 - Prove the ambiguous set contains two distinct complete matches
          ansible.builtin.assert:
            that:
              - deleted_tc10_third_created.changed
              - deleted_tc10_third_id != deleted_tc10_new_id
              - deleted_tc10_ambiguous_before.gathered | length == 2
              - >-
                deleted_tc10_ambiguous_before.gathered | map(attribute='policy_id') | sort == [deleted_tc10_new_id, deleted_tc10_third_id] | sort
              - >-
                deleted_tc10_ambiguous_before.gathered | map(attribute='switch_ids') | list == [[switch_serial_2], [switch_serial_2]]

        - name: DELETED TC10 - Reject ambiguous identical membership in real and check modes
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
                switch_ids: ["{{ switch_serial_2 }}"]
          register: deleted_tc10_ambiguous
          check_mode: "{{ item }}"
          loop: [false, true]
          loop_control:
            label: "check_mode={{ item }}"
          ignore_errors: true

        - name: DELETED TC10 - Verify both ambiguous requests require an exact ID without accepted changes
          ansible.builtin.assert:
            that:
              - deleted_tc10_ambiguous.failed == true
              - deleted_tc10_ambiguous.results | length == 2
              - deleted_tc10_ambiguous.results | selectattr('failed', 'equalto', true) | list | length == 2
              - deleted_tc10_ambiguous.results | selectattr('changed', 'equalto', true) | list == []

        - name: DELETED TC10 - Independently gather after ambiguous membership rejection
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            deploy: false
            config:
              - name: clock_timezone
                description: "{{ deleted_tc10_description }}"
          register: deleted_tc10_ambiguous_after

        - name: DELETED TC10 - Verify ambiguity never chooses either matching group
          ansible.builtin.assert:
            that:
              - >-
                (deleted_tc10_ambiguous_after.gathered | sort(attribute='policy_id')) == (deleted_tc10_ambiguous_before.gathered | sort(attribute='policy_id'))
      always:

        - name: DELETED TC10 - Read accepted create results for exact cleanup
          ansible.builtin.set_fact:
            deleted_tc10_returned_creates: >-
              {{ (deleted_tc10_old_created.force_created if deleted_tc10_old_created is mapping and deleted_tc10_old_created.force_created is defined and deleted_tc10_old_created.force_created
              is sequence and deleted_tc10_old_created.force_created is not string and deleted_tc10_old_created.force_created is not mapping else []) + (deleted_tc10_new_created.force_created
              if deleted_tc10_new_created is mapping and deleted_tc10_new_created.force_created is defined and deleted_tc10_new_created.force_created is sequence
              and deleted_tc10_new_created.force_created is not string and deleted_tc10_new_created.force_created is not mapping else []) + (deleted_tc10_third_created.force_created
              if deleted_tc10_third_created is mapping and deleted_tc10_third_created.force_created is defined and deleted_tc10_third_created.force_created
              is sequence and deleted_tc10_third_created.force_created is not string and deleted_tc10_third_created.force_created is not mapping else []) }}

        - name: DELETED TC10 - Recover every accepted exact ID and original member list
          ansible.builtin.set_fact:
            deleted_tc10_cleanup_entries: "{{ deleted_tc10_cleanup_entries + [{'name': item.policy_id, 'switch_ids': item.switch_ids}] }}"
          loop: "{{ deleted_tc10_returned_creates }}"
          loop_control:
            label: "{{ item.policy_id | default('unusable create result') }}"
          when:
            - item is mapping
            - item.policy_id is defined
            - item.policy_id is string
            - item.policy_id is match('^POLICY-GROUP-.+')
            - item.switch_ids is defined
            - item.switch_ids is sequence
            - item.switch_ids is not string
            - item.switch_ids is not mapping
            - item.switch_ids | length > 0

        - name: DELETED TC10 - Clean up only captured exact IDs with full original members
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config: "{{ deleted_tc10_cleanup_entries }}"
          register: deleted_tc10_cleanup_result
          when: deleted_tc10_cleanup_entries | length > 0

  always:
    - name: "DELETED - Final cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: deleted
