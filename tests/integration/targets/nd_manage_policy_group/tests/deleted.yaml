---
##############################################
##               SETUP                      ##
##############################################

- name: "DELETED - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: deleted

- block:

    ##############################################
    ##     SETUP - Create policy group          ##
    ##############################################

    # Create a switch_freeform policy group with deploy=true
    - name: "DELETED SETUP - Create switch_freeform policy group with deploy"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            priority: 110
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "system vlan long-name"
      register: result
      tags: deleted

    - name: "DELETED SETUP - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    ##############################################
    ##     TC1 - Delete with deploy=true        ##
    ##############################################

    - name: "DELETED TC1 - Preview deletion with retained creation flag"
      cisco.nd.nd_manage_policy_group: &delete_freeform
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            create_additional_policy: true
      check_mode: true
      register: delete_preview
      tags: deleted

    - name: "DELETED TC1 - Verify deletion preview"
      vars:
        target_before: "{{ delete_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ delete_preview.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - delete_preview.changed == true
          - delete_preview.force_created is not defined
          - target_before | length == 1
          - target_before[0].priority == 110
          - target_after == []
      tags: deleted

    - name: "DELETED TC1 - Gather after deletion preview"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: delete_preview_readback
      tags: deleted

    - name: "DELETED TC1 - Verify deletion preview did not persist"
      ansible.builtin.assert:
        that:
          - delete_preview_readback.changed == false
          - delete_preview_readback.gathered | length == 1
          - delete_preview_readback.gathered[0].policy_id == (delete_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | first).policy_id
      tags: deleted

    - name: "DELETED TC1 - Delete switch_freeform policy group with deploy"
      cisco.nd.nd_manage_policy_group: *delete_freeform
      register: result
      tags: deleted

    - name: "DELETED TC1 - Verify deletion"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.force_created is not defined
      tags: deleted

    ##############################################
    ##     TC2 - Idempotence after delete       ##
    ##############################################

    - name: "DELETED TC2 - Already absent with creation flag in real and check modes"
      cisco.nd.nd_manage_policy_group: *delete_freeform
      check_mode: "{{ item }}"
      loop: [false, true]
      loop_control:
        label: "check_mode={{ item }}"
      register: result
      tags: deleted

    - name: "DELETED TC2 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.results | length == 2
          - result.results[0].changed == false
          - result.results[1].changed == false
          - result.results[0].force_created is not defined
          - result.results[1].force_created is not defined
      tags: deleted

    - name: "DELETED TC2 - Gather after repeated deletion"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: absent_readback
      tags: deleted

    - name: "DELETED TC2 - Verify no replacement group was created"
      ansible.builtin.assert:
        that:
          - absent_readback.changed == false
          - absent_readback.gathered is defined
          - absent_readback.gathered == []
      tags: deleted

    ##############################################
    ##     TC3 - Delete non-existent (no-op)    ##
    ##############################################

    - name: "DELETED TC3 - Delete a policy group that does not exist"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: switch_freeform
            description: "This does not exist"
      register: result
      tags: deleted

    - name: "DELETED TC3 - Verify no change"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: deleted

    ########################################################
    ## TC4 - normal template pending cleanup by ID         ##
    ########################################################

    # Normal policy-group templates can leave the original policy group ID
    # staged as markDeleted=true after deploy=false. The follow-up deploy=true
    # run sees no active record, validates the hidden markDeleted row through
    # policySummary, and deploys the switches reported by that summary row.

    - name: "DELETED TC4 SETUP - Create policy group for pending cleanup"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Pending cleanup Enable LACP"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
      register: pending_setup
      tags: deleted

    - name: "DELETED TC4 SETUP - Capture pending cleanup policy group ID"
      ansible.builtin.set_fact:
        pending_cleanup_policy_group_id: "{{ (pending_setup.after | selectattr('description', 'equalto', 'Pending cleanup Enable LACP') | first).policy_id }}"
      tags: deleted

    - name: "DELETED TC4 - Delete policy group with deploy=false"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: false
        config:
          - name: "{{ pending_cleanup_policy_group_id }}"
            description: "Pending cleanup Enable LACP"
      register: result
      tags: deleted

    - name: "DELETED TC4 - Verify deploy=false delete changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    - name: "DELETED TC4B - Deploy pending cleanup by policy group ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: "{{ pending_cleanup_policy_group_id }}"
            description: "Pending cleanup Enable LACP"
      register: result
      tags: deleted

    - name: "DELETED TC4B - Verify pending cleanup deploy changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    ########################################################
    ## TC5 - switch_freeform pending cleanup               ##
    ########################################################

    # switch_freeform can leave cleanup work outside the active policy-group
    # view. The cleanup run validates the generated child through policySummary
    # using the original policy group ID as source.

    - name: DELETED TC5 - Verify pending freeform source cleanup
      tags: deleted
      block:
        - name: DELETED TC5 - Reset exact-ID cleanup capture
          ansible.builtin.set_fact:
            source_cleanup_policy_group_id: ""
            source_cleanup_setup: {}

        - name: "DELETED TC5 SETUP - Create switch_freeform policy group for source cleanup"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: true
            config:
              - name: switch_freeform
                description: "Pending cleanup switch_freeform source"
                priority: 120
                switch_ids:
                  - "{{ switch_serial_1 }}"
                template_inputs:
                  CONF: |
                    line console
                      exec-timeout 5
          register: source_cleanup_setup
          tags: deleted

        - name: "DELETED TC5 SETUP - Capture switch_freeform source cleanup policy group ID"
          ansible.builtin.set_fact:
            source_cleanup_policy_group_id: "{{ (source_cleanup_setup.after | selectattr('description', 'equalto', 'Pending cleanup switch_freeform source') | selectattr('template_name', 'equalto', 'switch_freeform') | first).policy_id }}"
          tags: deleted

        - name: "DELETED TC5 - Delete switch_freeform policy group with deploy=false"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: false
            config:
              - name: "{{ source_cleanup_policy_group_id }}"
          register: result
          tags: deleted

        - name: "DELETED TC5 - Verify deploy=false switch_freeform delete changed"
          ansible.builtin.assert:
            that:
              - result.changed == true
          tags: deleted

        - name: DELETED TC5A - Read raw pending freeform identity
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: source_cleanup_raw_before
          tags: deleted

        - name: DELETED TC5A - Record the observed pending representation
          ansible.builtin.set_fact:
            source_cleanup_is_orphan: >-
              {{ (source_cleanup_raw_before.current.policies | selectattr('policyId', 'equalto', source_cleanup_policy_group_id) | list | length == 0) and (source_cleanup_raw_before.current.policies
              | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id) | list | length > 0) }}
          tags: deleted

        - name: DELETED TC5A - Record the live coverage branch
          ansible.builtin.set_fact:
            source_cleanup_observed_branch: "{{ 'orphan-source-child' if source_cleanup_is_orphan else 'known-original-root' }}"
          tags: deleted

        - name: DELETED TC5A - Require proven pending fixture ownership
          ansible.builtin.assert:
            that:
              - source_cleanup_pending_rows | length > 0
              - >-
                source_cleanup_pending_rows | map(attribute='switches') | flatten | selectattr('markDeleted', 'equalto', true) | map(attribute='switchId') | unique
                | sort == [switch_serial_1]
              - >-
                source_cleanup_is_orphan or ((source_cleanup_parent_rows | length == 1) and source_cleanup_parent_rows[0].templateName == 'switch_freeform' and not (source_cleanup_parent_rows[0].source | default('')))
          vars:
            source_cleanup_pending_rows: >-
              {{ (source_cleanup_raw_before.current.policies | selectattr('policyId', 'equalto', source_cleanup_policy_group_id) | list) + (source_cleanup_raw_before.current.policies
              | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id) | list) }}
            source_cleanup_parent_rows: >-
              {{ source_cleanup_raw_before.current.policies | selectattr('policyId', 'equalto', source_cleanup_policy_group_id) | list }}
          tags: deleted

        - name: DELETED TC5A - Try cleanup by template and description without guessing an orphan
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: switch_freeform
                description: Pending cleanup switch_freeform source
          register: source_cleanup_no_id
          tags: deleted

        - name: DELETED TC5A - Independently read pending identity after no-ID cleanup
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: source_cleanup_raw_after_no_id
          tags: deleted

        - name: DELETED TC5A - Verify the chosen orphan or known-root behavior
          ansible.builtin.assert:
            that:
              - source_cleanup_no_id.changed == (not source_cleanup_is_orphan)
              - >-
                not source_cleanup_is_orphan or (source_cleanup_no_id.pending_deleted_cleanup.skipped | selectattr('reason_code', 'defined') | selectattr('reason_code',
                'equalto', 'unresolved_original_template') | selectattr('policy_group_id', 'equalto', source_cleanup_policy_group_id) | list | length > 0)
              - >-
                not source_cleanup_is_orphan or ((source_cleanup_children_after | map(attribute='policyId') | sort | list) == (source_cleanup_children_before |
                map(attribute='policyId') | sort | list))
              - >-
                not source_cleanup_is_orphan or ((source_cleanup_children_after | map(attribute='switches') | flatten | selectattr('markDeleted', 'equalto', true)
                | map(attribute='switchId') | unique | sort) == (source_cleanup_children_before | map(attribute='switches') | flatten | selectattr('markDeleted',
                'equalto', true) | map(attribute='switchId') | unique | sort))
              - >-
                not source_cleanup_is_orphan or ((source_cleanup_children_after | sort(attribute='policyId') | map(attribute='templateInputs') | list) == (source_cleanup_children_before
                | sort(attribute='policyId') | map(attribute='templateInputs') | list))
              - source_cleanup_is_orphan or source_cleanup_remaining_rows == []
          vars:
            source_cleanup_children_before: >-
              {{ source_cleanup_raw_before.current.policies | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id)
              | list }}
            source_cleanup_children_after: >-
              {{ source_cleanup_raw_after_no_id.current.policies | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id)
              | list }}
            source_cleanup_remaining_rows: >-
              {{ (source_cleanup_raw_after_no_id.current.policies | selectattr('policyId', 'equalto', source_cleanup_policy_group_id) | list) + (source_cleanup_raw_after_no_id.current.policies
              | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id) | list) }}
          tags: deleted

        - name: "DELETED TC5B - Deploy switch_freeform pending cleanup by original policy group ID"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: "{{ source_cleanup_policy_group_id }}"
          register: result
          tags: deleted

        - name: "DELETED TC5B - Verify pending cleanup deploy changed"
          ansible.builtin.assert:
            that:
              - result.changed == source_cleanup_is_orphan
          tags: deleted

        - name: DELETED TC5B - Verify exact-ID cleanup through raw summary
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: source_cleanup_raw_final
          tags: deleted

        - name: DELETED TC5B - Require all original and generated fixture rows absent
          ansible.builtin.assert:
            that:
              - source_cleanup_final_rows == []
          vars:
            source_cleanup_final_rows: >-
              {{ (source_cleanup_raw_final.current.policies | selectattr('policyId', 'equalto', source_cleanup_policy_group_id) | list) + (source_cleanup_raw_final.current.policies
              | selectattr('source', 'defined') | selectattr('source', 'equalto', source_cleanup_policy_group_id) | list) }}
          tags: deleted

      always:
        - name: DELETED TC5 - Recover accepted ordinary-create rows for exact cleanup
          ansible.builtin.set_fact:
            source_cleanup_accepted_rows: >-
              {{ (source_cleanup_setup.after | selectattr('description', 'defined') | selectattr('description', 'equalto', 'Pending cleanup switch_freeform source') | selectattr('template_name', 'equalto', 'switch_freeform') | list)
                 if source_cleanup_setup is mapping and source_cleanup_setup.after is defined and source_cleanup_setup.after is sequence
                 and source_cleanup_setup.after is not string and source_cleanup_setup.after is not mapping else [] }}

        - name: DELETED TC5 - Retain the returned valid exact fixture ID
          ansible.builtin.set_fact:
            source_cleanup_policy_group_id: "{{ source_cleanup_policy_group_id if source_cleanup_policy_group_id | length > 0 else item.policy_id }}"
          loop: "{{ source_cleanup_accepted_rows }}"
          loop_control:
            label: "{{ item.policy_id | default('unusable accepted row') }}"
          when:
            - item is mapping
            - item.policy_id is defined
            - item.policy_id is string
            - item.policy_id is match('^POLICY-GROUP-.+')

        - name: DELETED TC5 - Clean only the captured original ID and switch
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: "{{ source_cleanup_policy_group_id }}"
                switch_ids: ["{{ switch_serial_1 }}"]
          when: source_cleanup_policy_group_id | length > 0

    - name: "DELETED TC6 - ID-only deletion deploys all anonymous members"
      tags: [deleted, deleted_members]
      vars:
        anonymous_delete_members: ["{{ switch_serial_1 }}", "{{ switch_serial_2 }}"]
      block:
        - name: "DELETED TC6 - Reset the captured fixture ID"
          ansible.builtin.set_fact:
            anonymous_delete_policy_id: ""
            anonymous_delete_created: {}

        - name: "DELETED TC6 - Read member pending configuration before the fixture"
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: "{{ anonymous_delete_members }}"
          register: anonymous_delete_initial_pending

        - name: "DELETED TC6 - Require clean member switches before deployment"
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ anonymous_delete_initial_pending.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: "DELETED TC6 - Create and deploy an anonymous timezone group"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: merged
            deploy: true
            config:
              - name: clock_timezone
                create_additional_policy: true
                switch_ids: "{{ anonymous_delete_members }}"
                template_inputs:
                  TIME_ZONE: CET
                  HOUR_OFFSET: 1
                  MINUTE_OFFSET: 0
          register: anonymous_delete_created

        - name: "DELETED TC6 - Capture the controller-generated ID immediately"
          ansible.builtin.set_fact:
            anonymous_delete_policy_id: "{{ anonymous_delete_created.force_created[0].policy_id }}"

        - name: "DELETED TC6 - Require the exact created fixture ID"
          ansible.builtin.assert:
            that:
              - anonymous_delete_created.changed
              - anonymous_delete_created.force_created | length == 1
              - anonymous_delete_policy_id is match('^POLICY-GROUP-')

        - name: "DELETED TC6 - Gather the anonymous fixture by exact ID"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            config:
              - name: "{{ anonymous_delete_policy_id }}"
          register: anonymous_delete_original

        - name: "DELETED TC6 - Verify both actual members and timezone inputs"
          ansible.builtin.assert:
            that:
              - anonymous_delete_original.gathered | length == 1
              - anonymous_delete_original.gathered[0].policy_id == anonymous_delete_policy_id
              - anonymous_delete_original.gathered[0].description == ''
              - anonymous_delete_original.gathered[0].name == 'clock_timezone'
              - anonymous_delete_original.gathered[0].switch_ids | sort == anonymous_delete_members | sort
              - anonymous_delete_original.gathered[0].template_inputs.TIME_ZONE == 'CET'
              - anonymous_delete_original.gathered[0].template_inputs.HOUR_OFFSET | string == '1'
              - anonymous_delete_original.gathered[0].template_inputs.MINUTE_OFFSET | string == '0'

        - name: "DELETED TC6 - Read pending configuration after deployed creation"
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: "{{ anonymous_delete_members }}"
          register: anonymous_delete_created_pending

        - name: "DELETED TC6 - Verify the fixture was deployed to both switches"
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ anonymous_delete_created_pending.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: "DELETED TC6 - Preview anonymous deletion with only the group ID"
          cisco.nd.nd_manage_policy_group: &anonymous_id_delete
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: "{{ anonymous_delete_policy_id }}"
          check_mode: true
          register: anonymous_delete_preview

        - name: "DELETED TC6 - Verify the preview retains both actual members"
          ansible.builtin.assert:
            that:
              - anonymous_delete_preview.changed
              - anonymous_delete_preview.direct_actions.deleted | length == 1
              - anonymous_delete_preview.direct_actions.deleted[0].policy_id == anonymous_delete_policy_id
              - anonymous_delete_preview.direct_actions.deleted[0].switch_ids | sort == anonymous_delete_members | sort

        - name: "DELETED TC6 - Independently gather after the deletion preview"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            config:
              - name: "{{ anonymous_delete_policy_id }}"
          register: anonymous_delete_after_preview

        - name: "DELETED TC6 - Verify preview preserved the complete fixture"
          ansible.builtin.assert:
            that:
              - anonymous_delete_after_preview.gathered == anonymous_delete_original.gathered

        - name: "DELETED TC6 - Delete and deploy using only the anonymous group ID"
          cisco.nd.nd_manage_policy_group: *anonymous_id_delete
          register: anonymous_delete_result

        - name: "DELETED TC6 - Verify accepted ID-only deletion"
          ansible.builtin.assert:
            that:
              - anonymous_delete_result.changed
              - anonymous_delete_result.direct_actions.deleted | length == 1
              - anonymous_delete_result.direct_actions.deleted[0].policy_id == anonymous_delete_policy_id

        - name: "DELETED TC6 - Independently gather after real deletion"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: gathered
            config:
              - name: "{{ anonymous_delete_policy_id }}"
          register: anonymous_delete_after

        - name: "DELETED TC6 - Verify the active fixture is absent"
          ansible.builtin.assert:
            that:
              - anonymous_delete_after.gathered is defined
              - anonymous_delete_after.gathered == []

        # Gathered hides markDeleted/source rows. Inspect raw summary as well
        # so staging a deletion without deployment cannot satisfy the test.
        - name: "DELETED TC6 - Read raw group summary after deletion"
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false"
          register: anonymous_delete_summary

        - name: "DELETED TC6 - Verify no hidden fixture removal remains"
          ansible.builtin.assert:
            that:
              - anonymous_delete_summary.current.policies is defined
              - anonymous_delete_summary.current.policies | selectattr('policyId', 'equalto', anonymous_delete_policy_id) | list == []
              - anonymous_delete_summary.current.policies | selectattr('source', 'defined') | selectattr('source', 'equalto', anonymous_delete_policy_id) | list == []

        - name: "DELETED TC6 - Refresh both members' pending configuration"
          cisco.nd.nd_rest:
            method: GET
            path: "/api/v1/manage/fabrics/{{ fabric_name }}/switches/{{ item }}/pendingConfig?forceShowRun=true"
          loop: "{{ anonymous_delete_members }}"
          register: anonymous_delete_final_pending

        - name: "DELETED TC6 - Verify deletion was deployed to every actual member"
          ansible.builtin.assert:
            that:
              - item.current.pendingConfigs is defined
              - item.current.pendingConfigs == []
          loop: "{{ anonymous_delete_final_pending.results }}"
          loop_control:
            label: "{{ item.item }}"

      always:
        - name: "DELETED TC6 - Recover an accepted ID after a deployment failure"
          ansible.builtin.set_fact:
            anonymous_delete_policy_id: "{{ anonymous_delete_created.force_created[0].policy_id }}"
          when:
            - anonymous_delete_policy_id | length == 0
            - anonymous_delete_created is mapping
            - anonymous_delete_created.force_created is defined
            - anonymous_delete_created.force_created is sequence
            - anonymous_delete_created.force_created is not string
            - anonymous_delete_created.force_created is not mapping
            - anonymous_delete_created.force_created | length > 0
            - anonymous_delete_created.force_created[0] is mapping
            - anonymous_delete_created.force_created[0].policy_id is defined
            - anonymous_delete_created.force_created[0].policy_id is string
            - anonymous_delete_created.force_created[0].policy_id is match('^POLICY-GROUP-.+')

        - name: "DELETED TC6 - Clean up only the captured ID with its full member list"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config:
              - name: "{{ anonymous_delete_policy_id }}"
                switch_ids: "{{ anonymous_delete_members }}"
          when: anonymous_delete_policy_id | length > 0

    - name: DELETED TC7 - Isolate pending cleanup by template and description
      tags: [deleted, deleted_template_pair]
      block:

        - name: DELETED TC7 - Reset fixture capture
          ansible.builtin.set_fact:
