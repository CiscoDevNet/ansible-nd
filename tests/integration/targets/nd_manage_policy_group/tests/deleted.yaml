---
##############################################
##               SETUP                      ##
##############################################

- name: "DELETED - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: deleted

- block:

    ##############################################
    ##     SETUP - Create policy group          ##
    ##############################################

    # Create a switch_freeform policy group with deploy=true
    - name: "DELETED SETUP - Create switch_freeform policy group with deploy"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            priority: 110
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "system vlan long-name"
      register: result
      tags: deleted

    - name: "DELETED SETUP - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    ##############################################
    ##     TC1 - Delete with deploy=true        ##
    ##############################################

    - name: "DELETED TC1 - Preview deletion with retained creation flag"
      cisco.nd.nd_manage_policy_group: &delete_freeform
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
            create_additional_policy: true
      check_mode: true
      register: delete_preview
      tags: deleted

    - name: "DELETED TC1 - Verify deletion preview"
      vars:
        target_before: "{{ delete_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
        target_after: "{{ delete_preview.after | selectattr('description', 'equalto', 'Enable system vlan long-name') | list }}"
      ansible.builtin.assert:
        that:
          - delete_preview.changed == true
          - delete_preview.force_created is not defined
          - target_before | length == 1
          - target_before[0].priority == 110
          - target_after == []
      tags: deleted

    - name: "DELETED TC1 - Gather after deletion preview"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: delete_preview_readback
      tags: deleted

    - name: "DELETED TC1 - Verify deletion preview did not persist"
      ansible.builtin.assert:
        that:
          - delete_preview_readback.changed == false
          - delete_preview_readback.gathered | length == 1
          - delete_preview_readback.gathered[0].policy_id == (delete_preview.before | selectattr('description', 'equalto', 'Enable system vlan long-name') | first).policy_id
      tags: deleted

    - name: "DELETED TC1 - Delete switch_freeform policy group with deploy"
      cisco.nd.nd_manage_policy_group: *delete_freeform
      register: result
      tags: deleted

    - name: "DELETED TC1 - Verify deletion"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.force_created is not defined
      tags: deleted

    ##############################################
    ##     TC2 - Idempotence after delete       ##
    ##############################################

    - name: "DELETED TC2 - Already absent with creation flag in real and check modes"
      cisco.nd.nd_manage_policy_group: *delete_freeform
      check_mode: "{{ item }}"
      loop: [false, true]
      loop_control:
        label: "check_mode={{ item }}"
      register: result
      tags: deleted

    - name: "DELETED TC2 - Verify idempotence (no change)"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.results | length == 2
          - result.results[0].changed == false
          - result.results[1].changed == false
          - result.results[0].force_created is not defined
          - result.results[1].force_created is not defined
      tags: deleted

    - name: "DELETED TC2 - Gather after repeated deletion"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "Enable system vlan long-name"
      register: absent_readback
      tags: deleted

    - name: "DELETED TC2 - Verify no replacement group was created"
      ansible.builtin.assert:
        that:
          - absent_readback.changed == false
          - absent_readback.gathered is defined
          - absent_readback.gathered == []
      tags: deleted

    ##############################################
    ##     TC3 - Delete non-existent (no-op)    ##
    ##############################################

    - name: "DELETED TC3 - Delete a policy group that does not exist"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: switch_freeform
            description: "This does not exist"
      register: result
      tags: deleted

    - name: "DELETED TC3 - Verify no change"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: deleted

    ########################################################
    ## TC4 - normal template pending cleanup by ID         ##
    ########################################################

    # Normal policy-group templates can leave the original policy group ID
    # staged as markDeleted=true after deploy=false. The follow-up deploy=true
    # run sees no active record, validates the hidden markDeleted row through
    # policySummary, and deploys the switches reported by that summary row.

    - name: "DELETED TC4 SETUP - Create policy group for pending cleanup"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "Pending cleanup Enable LACP"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
      register: pending_setup
      tags: deleted

    - name: "DELETED TC4 SETUP - Capture pending cleanup policy group ID"
      ansible.builtin.set_fact:
        pending_cleanup_policy_group_id: "{{ (pending_setup.after | selectattr('description', 'equalto', 'Pending cleanup Enable LACP') | first).policy_id }}"
      tags: deleted

    - name: "DELETED TC4 - Delete policy group with deploy=false"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: false
        config:
          - name: "{{ pending_cleanup_policy_group_id }}"
            description: "Pending cleanup Enable LACP"
      register: result
      tags: deleted

    - name: "DELETED TC4 - Verify deploy=false delete changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    - name: "DELETED TC4B - Deploy pending cleanup by policy group ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: "{{ pending_cleanup_policy_group_id }}"
            description: "Pending cleanup Enable LACP"
      register: result
      tags: deleted

    - name: "DELETED TC4B - Verify pending cleanup deploy changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    ########################################################
    ## TC5 - switch_freeform pending cleanup               ##
    ########################################################

    # switch_freeform can leave cleanup work outside the active policy-group
    # view. The cleanup run validates the generated child through policySummary
    # using the original policy group ID as source.

    - name: "DELETED TC5 SETUP - Create switch_freeform policy group for source cleanup"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "Pending cleanup switch_freeform source"
            priority: 120
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: |
                line console
                  exec-timeout 5
      register: source_cleanup_setup
      tags: deleted

    - name: "DELETED TC5 SETUP - Capture switch_freeform source cleanup policy group ID"
      ansible.builtin.set_fact:
        source_cleanup_policy_group_id: "{{ (source_cleanup_setup.after | selectattr('description', 'equalto', 'Pending cleanup switch_freeform source') | first).policy_id }}"
      tags: deleted

    - name: "DELETED TC5 - Delete switch_freeform policy group with deploy=false"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: false
        config:
          - name: "{{ source_cleanup_policy_group_id }}"
      register: result
      tags: deleted

    - name: "DELETED TC5 - Verify deploy=false switch_freeform delete changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

    - name: "DELETED TC5B - Deploy switch_freeform pending cleanup by original policy group ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: "{{ source_cleanup_policy_group_id }}"
      register: result
      tags: deleted

    - name: "DELETED TC5B - Verify pending cleanup deploy changed"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: deleted

  always:
    - name: "DELETED - Final cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: deleted
