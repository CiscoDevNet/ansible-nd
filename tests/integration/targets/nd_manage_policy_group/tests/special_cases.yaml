---
##################################################################
##  nd_policy_group — Special-case test scenarios               ##
##################################################################
#
# Consolidated file covering scenarios that don't fit cleanly in
# merged.yaml / deleted.yaml / gathered.yaml:
#
#   A. FORCE_CREATE     create_additional_policy=true (Fix C)
#   B. CHECK_MODE       --check / check_mode=true on merged/deleted
#   C. NO_DEPLOY        deploy=false (markDelete-only / no push)
#   D. POLICY_ID        identification via POLICY-GROUP-* IDs
#   E. VALIDATION       expected module failures (bad input)
#   F. BFD_PREREQ       feature_enable bfd → switch_freeform BFD timers
#   G. EXACT_ID         duplicate identity, previews and partial progress
#   H. ID_PREFLIGHT     invalid IDs cannot create or broaden deletion
#
# All test policy groups use description prefix "SPC-" to isolate
# from other test files. cleanup.yaml deletes all SPC- groups.


- name: "SPECIAL - Import cleanup tasks (pre)"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: special

- block:

    # Run before other special fixtures so a broken empty-ID request can only
    # reach the two owned clock groups. These fixtures are never deployed.
    - name: "SPECIAL H - Validate effective IDs before any progress"
      tags: [special, special_id_preflight]
      vars:
        spc_guard_options: &spc_guard_options
          fabric_name: "{{ fabric_name }}"
          deploy: false
      block:
        - name: "SPECIAL H - Reset exact-ID fixture captures"
          ansible.builtin.set_fact:
            spc_guard_description: "SPC-ID-GUARD-{{ lookup('ansible.builtin.password', '/dev/null length=10 chars=ascii_lowercase,digits') }}"
            spc_guard_created: {}
            spc_guard_mixed: {}
            spc_guard_cleanup_entries: []

        - name: "SPECIAL H - Inspect complete clock inventory before owning deletion sentinels"
          cisco.nd.nd_rest:
            method: GET
            path: >-
              /api/v1/manage/fabrics/{{ fabric_name }}/policySummary?filter=policyId:*POLICY-GROUP-*&max=10000&pushConfigPreview=false
          register: spc_guard_raw_before

        - name: "SPECIAL H - Require complete absent clock inventory before fixtures"
          ansible.builtin.assert:
            that:
              - spc_guard_raw_before.current.meta.counts.remaining is integer
              - spc_guard_raw_before.current.meta.counts.remaining == 0
              - spc_guard_raw_before.current.policies | selectattr('templateName', 'equalto', 'clock_timezone') | list | length == 0

        - name: "SPECIAL H - Create two uniquely described undeployed sentinels"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: merged
            config:
              - name: clock_timezone
                description: "{{ spc_guard_description }}-first"
                create_additional_policy: true
                priority: 425
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs: {TIME_ZONE: CET, HOUR_OFFSET: 1, MINUTE_OFFSET: 0}
              - name: clock_timezone
                description: "{{ spc_guard_description }}-second"
                create_additional_policy: true
                priority: 500
                switch_ids: ["{{ switch_serial_2 }}"]
                template_inputs: {TIME_ZONE: CET, HOUR_OFFSET: 1, MINUTE_OFFSET: 0}
          register: spc_guard_created

        - name: "SPECIAL H - Capture actual sentinel IDs immediately"
          ansible.builtin.set_fact:
            spc_guard_first_id: "{{ spc_guard_created.force_created[0].policy_id }}"
            spc_guard_second_id: "{{ spc_guard_created.force_created[1].policy_id }}"

        - name: "SPECIAL H - Independently gather both sentinels"
          cisco.nd.nd_manage_policy_group: &spc_guard_gather
            <<: *spc_guard_options
            state: gathered
            config:
              - name: clock_timezone
                description: "{{ spc_guard_description }}-first"
              - name: clock_timezone
                description: "{{ spc_guard_description }}-second"
              - name: clock_timezone
                description: "{{ spc_guard_description }}-must-stay-absent"
          register: spc_guard_original

        - name: "SPECIAL H - Verify two distinct owned sentinel configurations"
          ansible.builtin.assert:
            that:
              - spc_guard_original.gathered | length == 2
              - spc_guard_first_id != spc_guard_second_id
              - spc_guard_original.gathered | map(attribute='policy_id') | sort == [spc_guard_first_id, spc_guard_second_id] | sort
              - "(spc_guard_original.gathered | selectattr('policy_id', 'equalto', spc_guard_first_id) | first).priority == 425"
              - "(spc_guard_original.gathered | selectattr('policy_id', 'equalto', spc_guard_second_id) | first).switch_ids == [switch_serial_2]"

        # No description deliberately exercises the empty-ID broad-delete hazard.
        - name: "SPECIAL H - Reject invalid effective policy IDs in real and check modes"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: "{{ item[1] }}"
            config:
              - name: clock_timezone
                policy_id: "{{ item[0] }}"
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs: {TIME_ZONE: CET, HOUR_OFFSET: 1, MINUTE_OFFSET: 0}
          check_mode: "{{ item[2] }}"
          loop: "{{ ['', '   ', 'POLICY-INVALID', 'POLICY-GROUP-'] | product(['deleted', 'merged'], [false, true]) | list }}"
          loop_control:
            label: "policy_id={{ item[0] | to_json }} state={{ item[1] }} check_mode={{ item[2] }}"
          register: spc_guard_invalid
          ignore_errors: true

        - name: "SPECIAL H - Verify every invalid ID failed without confirmed changes"
          ansible.builtin.assert:
            that:
              - spc_guard_invalid.failed == true
              - spc_guard_invalid.results | length == 16
              - spc_guard_invalid.results | selectattr('failed', 'defined') | selectattr('failed', 'equalto', true) | list | length == 16
              - spc_guard_invalid.results | selectattr('changed', 'equalto', false) | list | length == 16
              - spc_guard_invalid.results | selectattr('msg', 'defined') | list | length == 16
              - spc_guard_invalid.results | selectattr('force_created', 'defined') | list | length == 0

        - name: "SPECIAL H - Read back sentinels after invalid ID requests"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_after_invalid

        - name: "SPECIAL H - Verify invalid IDs did not update create or broaden deletion"
          ansible.builtin.assert:
            that:
              - spc_guard_after_invalid.gathered | sort(attribute='policy_id') == spc_guard_original.gathered | sort(attribute='policy_id')

        - name: "SPECIAL H - Reject a later invalid ID before an earlier forced create"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: merged
            config:
              - name: clock_timezone
                description: "{{ spc_guard_description }}-must-stay-absent"
                create_additional_policy: true
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs: {TIME_ZONE: CET, HOUR_OFFSET: 1, MINUTE_OFFSET: 0}
              - name: clock_timezone
                policy_id: NOT-A-POLICY-GROUP
          check_mode: "{{ item }}"
          loop: [false, true]
          register: spc_guard_mixed
          ignore_errors: true

        - name: "SPECIAL H - Verify invalid mixed batches retain no accepted or previewed create"
          ansible.builtin.assert:
            that:
              - spc_guard_mixed.failed == true
              - spc_guard_mixed.results | length == 2
              - spc_guard_mixed.results | selectattr('failed', 'defined') | selectattr('failed', 'equalto', true) | list | length == 2
              - spc_guard_mixed.results | selectattr('changed', 'equalto', false) | list | length == 2
              - spc_guard_mixed.results | selectattr('force_created', 'defined') | list | length == 0

        - name: "SPECIAL H - Read back after rejected mixed batches"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_after_mixed

        - name: "SPECIAL H - Verify no earlier forced create escaped ID preflight"
          ansible.builtin.assert:
            that:
              - spc_guard_after_mixed.gathered | sort(attribute='policy_id') == spc_guard_original.gathered | sort(attribute='policy_id')

        - name: "SPECIAL H - Define equivalent effective IDs and ignored conflicting fields"
          ansible.builtin.set_fact:
            spc_guard_valid_forms:
              - {name: "{{ spc_guard_first_id }}", policy_id: "", priority: 425}
              - {name: "  {{ spc_guard_first_id }}  ", policy_id: IGNORED-INVALID-ID, priority: 425}
              - {name: clock_timezone, policy_id: "  {{ spc_guard_first_id }}  ", priority: 425}

        - name: "SPECIAL H - Reapply equivalent effective IDs without descriptions"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: merged
            config: "{{ [item[0]] }}"
          check_mode: "{{ item[1] }}"
          loop: "{{ spc_guard_valid_forms | product([false, true]) | list }}"
          register: spc_guard_equivalent

        - name: "SPECIAL H - Verify canonical precedence and padded ID noops"
          ansible.builtin.assert:
            that:
              - not item.changed
              - item.before == item.after
          loop: "{{ spc_guard_equivalent.results }}"
          loop_control:
            label: "check_mode={{ item.item[1] }}"

        - name: "SPECIAL H - Independently gather after equivalent merged requests"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_after_equivalent

        - name: "SPECIAL H - Verify equivalent IDs retained both complete configurations"
          ansible.builtin.assert:
            that:
              - spc_guard_after_equivalent.gathered | sort(attribute='policy_id') == spc_guard_original.gathered | sort(attribute='policy_id')

        - name: "SPECIAL H - Preview deletion through each equivalent effective ID"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: deleted
            config: "{{ [item] }}"
          check_mode: true
          loop: "{{ spc_guard_valid_forms }}"
          register: spc_guard_delete_previews

        - name: "SPECIAL H - Verify equivalent previews select only the first sentinel"
          ansible.builtin.assert:
            that:
              - item.changed
              - "'force_created' not in item"
              - >-
                item.after | selectattr('policy_id', 'in', [spc_guard_first_id, spc_guard_second_id]) | map(attribute='policy_id') | list == [spc_guard_second_id]
          loop: "{{ spc_guard_delete_previews.results }}"

        - name: "SPECIAL H - Read back sentinels after padded deletion previews"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_after_preview

        - name: "SPECIAL H - Verify padded deletion previews did not persist"
          ansible.builtin.assert:
            that:
              - spc_guard_after_preview.gathered | sort(attribute='policy_id') == spc_guard_original.gathered | sort(attribute='policy_id')

        - name: "SPECIAL H - Delete both sentinels through padded canonical IDs"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_guard_options
            state: deleted
            config:
              - name: "  {{ spc_guard_first_id }}  "
                policy_id: IGNORED-INVALID-ID
              - name: clock_timezone
                policy_id: "  {{ spc_guard_second_id }}  "
          register: spc_guard_deleted

        - name: "SPECIAL H - Independently gather after padded real deletion"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_after_delete

        - name: "SPECIAL H - Verify both padded real targets were removed from active state"
          ansible.builtin.assert:
            that:
              - spc_guard_deleted.changed
              - spc_guard_after_delete.gathered is defined
              - spc_guard_after_delete.gathered == []

      always:
        - name: "SPECIAL H - Recover accepted fixture and mixed-create results"
          ansible.builtin.set_fact:
            spc_guard_accepted_creates: >-
              {{ (spc_guard_created.force_created | default([])) + ((spc_guard_mixed.results | default([])) | selectattr('force_created', 'defined')
              | map(attribute='force_created') | flatten) }}

        - name: "SPECIAL H - Independently find only the owned descriptions for cleanup"
          cisco.nd.nd_manage_policy_group: *spc_guard_gather
          register: spc_guard_cleanup_found

        - name: "SPECIAL H - Retain each captured exact ID with its original members"
          ansible.builtin.set_fact:
            spc_guard_cleanup_entries: "{{ spc_guard_cleanup_entries + [{'name': item.policy_id, 'switch_ids': item.switch_ids}] }}"
          loop: >-
            {{ (spc_guard_accepted_creates + spc_guard_cleanup_found.gathered) | select('mapping') | selectattr('policy_id', 'defined')
            | selectattr('policy_id', 'string') | selectattr('policy_id', 'match', '^POLICY-GROUP-.+') | unique(attribute='policy_id') | list }}
          loop_control:
            label: "{{ item.policy_id }}"

        - name: "SPECIAL H - Clean up only captured IDs including staged removals"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: true
            config: "{{ spc_guard_cleanup_entries }}"
          when: spc_guard_cleanup_entries | length > 0

    ##############################################################
    ##  A. FORCE_CREATE — create_additional_policy: true        ##
    ##############################################################

    # SETUP: Create a baseline switch_freeform group so force-create
    # has an existing (description, template_name) collision.
    - name: "SPECIAL A.SETUP - Baseline switch_freeform group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "SPC-FORCE-baseline freeform"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "spanning-tree mode rapid-pvst"
      register: result
      tags: special

    - name: "SPECIAL A.SETUP - Verify baseline present"
      vars:
        baseline: "{{ result.after | selectattr('description', 'equalto', 'SPC-FORCE-baseline freeform') | list }}"
      ansible.builtin.assert:
        that:
          - baseline | length == 1
          - baseline[0].template_name == "switch_freeform"
          - baseline[0].template_inputs.CONF is search("rapid-pvst")
      tags: special

    # ---- TC1: force_create WITH description (duplicate by intent) ----
    - name: "SPECIAL A.TC1 - Force-create duplicate (same desc, different CONF)"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "SPC-FORCE-baseline freeform"
            create_additional_policy: true
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "spanning-tree vlan 1-100 priority 4096"
      register: result
      tags: special

    - name: "SPECIAL A.TC1 - Verify force_created surfaced (with description)"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.force_created is defined
          - result.force_created | length == 1
          - result.force_created[0].template_name == "switch_freeform"
          - result.force_created[0].description == "SPC-FORCE-baseline freeform"
          - result.force_created[0].create_additional_policy == true
          - result.force_created[0].template_inputs.CONF is search("priority 4096")
      tags: special

    # Capture force-created duplicate's policy_id (shares composite key
    # with baseline → shared cleanup can only remove one of them).
    - name: "SPECIAL A.TC1 - Pin force-created duplicate policy_id for cleanup"
      ansible.builtin.set_fact:
        spc_dup_force_policy_id: "{{ result.force_created[0].policy_id | default('') }}"
      tags: special

    # ---- TC2: force_create WITHOUT description ----
    - name: "SPECIAL A.TC2 - Force-create without description"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: true
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "as-format asdot"
      register: result
      tags: special

    - name: "SPECIAL A.TC2 - Verify force_created surfaced (no description)"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.force_created is defined
          - result.force_created | length == 1
          - result.force_created[0].template_name == "switch_freeform"
          - "'description' not in result.force_created[0]"
          - result.force_created[0].create_additional_policy == true
          - result.force_created[0].template_inputs.CONF == "as-format asdot"
      tags: special

    - name: "SPECIAL A.TC2 - Pin anonymous force-created policy_id for cleanup"
      ansible.builtin.set_fact:
        spc_anon_force_policy_id: "{{ result.force_created[0].policy_id | default('') }}"
      tags: special

    ##############################################################
    ##  B. CHECK_MODE                                            ##
    ##############################################################

    # ---- TC3: check_mode merged (no real create) ----
    - name: "SPECIAL B.TC3 - check_mode merged on non-existent group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: clock_timezone
            description: "SPC-CHECK-Timezone PST"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              TIME_ZONE: PST
              HOUR_OFFSET: -8
              MINUTE_OFFSET: 0
      check_mode: true
      register: result
      tags: special

    - name: "SPECIAL B.TC3 - Verify check_mode reports change, target NOT in before"
      vars:
        target_before: "{{ result.before | selectattr('description', 'equalto', 'SPC-CHECK-Timezone PST') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target_before | length == 0
      tags: special

    - name: "SPECIAL B.TC3.verify - Confirm nothing was actually created"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
            description: "SPC-CHECK-Timezone PST"
      register: result
      tags: special

    - name: "SPECIAL B.TC3.verify - Gathered confirms no real creation"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered == []
      tags: special

    # SETUP for TC4: create a real group to delete in check_mode
    - name: "SPECIAL B.TC4.setup - Create group for check_mode delete"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: clock_summertime
            description: "SPC-CHECK-MD-Summertime CEST"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              SUMMER_TIME: "CEST 5 SUNDAY MARCH 02:00 5 SUNDAY OCTOBER 03:00 60"
      register: result
      tags: special

    - name: "SPECIAL B.TC4.setup - Verify setup created"
      vars:
        target: "{{ result.after | selectattr('description', 'equalto', 'SPC-CHECK-MD-Summertime CEST') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target | length == 1
      tags: special

    # ---- TC4: check_mode deleted (no real delete) ----
    - name: "SPECIAL B.TC4 - check_mode deleted on existing group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: clock_summertime
            description: "SPC-CHECK-MD-Summertime CEST"
      check_mode: true
      register: result
      tags: special

    - name: "SPECIAL B.TC4 - Verify check_mode reports change, target IS in before"
      vars:
        target_before: "{{ result.before | selectattr('description', 'equalto', 'SPC-CHECK-MD-Summertime CEST') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target_before | length == 1
          - target_before[0].template_name == "clock_summertime"
      tags: special

    - name: "SPECIAL B.TC4.verify - Confirm group still exists after check_mode"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_summertime
            description: "SPC-CHECK-MD-Summertime CEST"
      register: result
      tags: special

    - name: "SPECIAL B.TC4.verify - Gathered confirms group not deleted"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | length == 1
          - result.gathered[0].description == "SPC-CHECK-MD-Summertime CEST"
      tags: special

    ##############################################################
    ##  C. NO_DEPLOY — deploy: false                             ##
    ##############################################################

    # ---- TC5: deploy=false on create ----
    - name: "SPECIAL C.TC5 - Create with deploy=false"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: switch_freeform
            description: "SPC-NODEPLOY-as-format asdot"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "as-format asdot"
      register: result
      tags: special

    - name: "SPECIAL C.TC5 - Verify policy created (controller-side state)"
      vars:
        target: "{{ result.after | selectattr('description', 'equalto', 'SPC-NODEPLOY-as-format asdot') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target | length == 1
          - target[0].template_name == "switch_freeform"
          - target[0].switch_ids | length == 1
          - switch_serial_1 in target[0].switch_ids
      tags: special

    - name: "SPECIAL C.TC5 - MANUAL VERIFICATION REQUIRED"
      ansible.builtin.debug:
        msg:
          - "MANUAL CHECK: ND UI should show policy group 'SPC-NODEPLOY-as-format asdot'"
          - "in NOT_DEPLOYED state (config exists but not pushed to switch)."
          - "Switch {{ switch_serial_1 }} should NOT have 'as-format asdot' in running-config."
      tags: special

    # SETUP for TC6: create a multi-switch group, then remove one switch with deploy=false
    - name: "SPECIAL C.TC6.setup - Create multi-switch group"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "SPC-NODEPLOY-Enable LACP"
            switch_ids:
              - "{{ switch_serial_1 }}"
              - "{{ switch_serial_2 }}"
            template_inputs:
              featureName: lacp
      register: result
      tags: special

    - name: "SPECIAL C.TC6.setup - Verify both switches attached"
      vars:
        target: "{{ result.after | selectattr('description', 'equalto', 'SPC-NODEPLOY-Enable LACP') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target | length == 1
          - target[0].switch_ids | length == 2
      tags: special

    # ---- TC6: deploy=false on update with switch removal ----
    - name: "SPECIAL C.TC6 - Update with switch removal, deploy=false"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: feature_enable
            description: "SPC-NODEPLOY-Enable LACP"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lacp
      register: result
      tags: special

    - name: "SPECIAL C.TC6 - Verify switch removed in controller state"
      vars:
        before_t: "{{ result.before | selectattr('description', 'equalto', 'SPC-NODEPLOY-Enable LACP') | list }}"
        after_t: "{{ result.after | selectattr('description', 'equalto', 'SPC-NODEPLOY-Enable LACP') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - before_t | length == 1
          - before_t[0].switch_ids | length == 2
          - after_t | length == 1
          - after_t[0].switch_ids | length == 1
          - switch_serial_1 in after_t[0].switch_ids
          - switch_serial_2 not in after_t[0].switch_ids
      tags: special

    - name: "SPECIAL C.TC6 - MANUAL VERIFICATION REQUIRED"
      ansible.builtin.debug:
        msg:
          - "MANUAL CHECK: switch {{ switch_serial_2 }} was removed from the policy group"
          - "with deploy=false. Verify on the switch that the lacp feature is still"
          - "configured (not yet undeployed)."
      tags: special

    ##############################################################
    ##  D. POLICY_ID — identification via POLICY-GROUP-* IDs    ##
    ##############################################################

    # SETUP: Create a known group and capture its policy_id
    - name: "SPECIAL D.SETUP - Create group for ID-based tests"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "SPC-ID-Enable LLDP"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lldp
      register: result
      tags: special

    - name: "SPECIAL D.SETUP - Verify created and capture policy_id"
      vars:
        target: "{{ result.after | selectattr('description', 'equalto', 'SPC-ID-Enable LLDP') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - target | length == 1
          - target[0].policy_id is match('^POLICY-GROUP-')
      tags: special

    - name: "SPECIAL D.SETUP - Pin policy_id for subsequent TCs"
      ansible.builtin.set_fact:
        spc_policy_id: "{{ (result.after | selectattr('description', 'equalto', 'SPC-ID-Enable LLDP') | list)[0].policy_id }}"
      tags: special

    # ---- TC7: gather by ID ----
    - name: "SPECIAL D.TC7 - Gather policy group by POLICY-GROUP-* ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: "{{ spc_policy_id }}"
      register: result
      tags: special

    - name: "SPECIAL D.TC7 - Verify gather-by-ID returns the right group"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | length == 1
          - result.gathered[0].policy_id == spc_policy_id
          - result.gathered[0].description == "SPC-ID-Enable LLDP"
          - result.gathered[0].name == "feature_enable"
      tags: special

    # ---- TC8: update by ID (no description provided) ----
    - name: "SPECIAL D.TC8 - Update existing group by ID only"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: "{{ spc_policy_id }}"
            switch_ids:
              - "{{ switch_serial_1 }}"
              - "{{ switch_serial_2 }}"
            template_inputs:
              featureName: lldp
      register: result
      tags: special

    - name: "SPECIAL D.TC8 - Verify update-by-ID applied correctly"
      vars:
        before_t: "{{ result.before | selectattr('policy_id', 'equalto', spc_policy_id) | list }}"
        after_t: "{{ result.after | selectattr('policy_id', 'equalto', spc_policy_id) | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - before_t | length == 1
          - before_t[0].switch_ids | length == 1
          - after_t | length == 1
          - after_t[0].switch_ids | length == 2
      tags: special

    # ---- TC10: merged with unknown POLICY-GROUP-* ID → fail ----
    # (TC9 — delete by ID — moved after TC10/11/12 to keep spc_policy_id alive)
    - name: "SPECIAL D.TC10 - Merged with unknown POLICY-GROUP-* ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: POLICY-GROUP-FAKE999
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lldp
      register: result
      ignore_errors: true
      tags: special

    - name: "SPECIAL D.TC10 - Verify failure with helpful message"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - result.msg is search('POLICY-GROUP-FAKE999')
      tags: special

    - name: "SPECIAL D.TC10 - Reset connection after expected module failure"
      ansible.builtin.meta: reset_connection
      tags: special

    # ---- TC11: deleted with unknown POLICY-GROUP-* ID → skip silently ----
    - name: "SPECIAL D.TC11 - Deleted with unknown POLICY-GROUP-* ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: POLICY-GROUP-FAKE998
      register: result
      tags: special

    - name: "SPECIAL D.TC11 - Verify silent skip (no failure)"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: special

    # ---- TC12: mixed config — update-by-ID + new create-by-desc ----
    - name: "SPECIAL D.TC12 - Mixed: update by ID + create by description"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: "{{ spc_policy_id }}"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: lldp
          - name: clock_timezone
            description: "SPC-ID-Timezone EST"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              TIME_ZONE: EST
              HOUR_OFFSET: -5
              MINUTE_OFFSET: 0
      register: result
      tags: special

    - name: "SPECIAL D.TC12 - Verify mixed update + create"
      vars:
        updated: "{{ result.after | selectattr('policy_id', 'equalto', spc_policy_id) | list }}"
        new_grp: "{{ result.after | selectattr('description', 'equalto', 'SPC-ID-Timezone EST') | list }}"
        new_before: "{{ result.before | selectattr('description', 'equalto', 'SPC-ID-Timezone EST') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - updated | length == 1
          - updated[0].switch_ids | length == 1
          - new_grp | length == 1
          - new_grp[0].template_name == "clock_timezone"
          - new_before | length == 0
      tags: special

    # ---- TC9: delete by ID ----
    - name: "SPECIAL D.TC9 - Delete policy group by POLICY-GROUP-* ID"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: "{{ spc_policy_id }}"
      register: result
      tags: special

    - name: "SPECIAL D.TC9 - Verify delete-by-ID succeeded"
      vars:
        before_t: "{{ result.before | selectattr('policy_id', 'equalto', spc_policy_id) | list }}"
        after_t: "{{ result.after | selectattr('policy_id', 'equalto', spc_policy_id) | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - before_t | length == 1
          - after_t | length == 0
      tags: special

    ##############################################################
    ##  E. VALIDATION — expected failures                        ##
    ##############################################################

    # ---- TC13: missing template_name (no `name` field) ----
    - name: "SPECIAL E.TC13 - Missing `name` field in merged config"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - description: "SPC-VAL-no-name"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "ip pim sparse-mode"
      register: result
      ignore_errors: true
      tags: special

    - name: "SPECIAL E.TC13 - Verify failure on missing name"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - result.msg is search("'name' is required")
      tags: special

    # ---- TC14: cross-entry duplicate (description, name) ----
    - name: "SPECIAL E.TC14 - Duplicate (description, name) across config entries"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "SPC-VAL-duplicate-key"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "no ip domain-lookup"
          - name: switch_freeform
            description: "SPC-VAL-duplicate-key"
            switch_ids:
              - "{{ switch_serial_2 }}"
            template_inputs:
              CONF: "ip domain-name example.com"
      register: result
      ignore_errors: true
      tags: special

    - name: "SPECIAL E.TC14 - Verify duplicate detection"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - result.msg is search('Duplicate')
          - result.msg is search('SPC-VAL-duplicate-key')
      tags: special

    ##############################################################
    ##  F. BFD_PREREQ — feature_enable bfd → BFD timers          ##
    ##############################################################
    #
    # switch_freeform "bfd interval ..." requires `feature bfd` to be
    # enabled first on the switch. Verify the module correctly handles
    # both policies in a single bulk-create call.

    - name: "SPECIAL F.TC15 - Bulk: feature_enable bfd + BFD timers freeform"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "SPC-BFD-Enable BFD feature"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: bfd
          - name: switch_freeform
            description: "SPC-BFD-BFD timers"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"
      register: result
      tags: special

    - name: "SPECIAL F.TC15 - Verify both BFD policies created"
      vars:
        feat: "{{ result.after | selectattr('description', 'equalto', 'SPC-BFD-Enable BFD feature') | list }}"
        timers: "{{ result.after | selectattr('description', 'equalto', 'SPC-BFD-BFD timers') | list }}"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - feat | length == 1
          - feat[0].template_name == "feature_enable"
          - feat[0].template_inputs.featureName == "bfd"
          - timers | length == 1
          - timers[0].template_name == "switch_freeform"
          - timers[0].template_inputs.CONF is search("bfd interval 250")
      tags: special

    # Idempotence on BFD chain
    - name: "SPECIAL F.TC15b - Idempotence on BFD bulk create"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            description: "SPC-BFD-Enable BFD feature"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              featureName: bfd
          - name: switch_freeform
            description: "SPC-BFD-BFD timers"
            switch_ids:
              - "{{ switch_serial_1 }}"
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"
      register: result
      tags: special

    - name: "SPECIAL F.TC15b - Verify idempotence on BFD chain"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: special

    # Unique comment-only fixtures stay undeployed and are cleaned by captured ID.
    - name: "SPECIAL G - Initialize isolated identity fixtures"
      ansible.builtin.set_fact:
        spc_identity_description: "SPC-EXACT-{{ lookup('ansible.builtin.password', '/dev/null length=10 chars=ascii_lowercase,digits') }}"
        spc_identity_first_id: ""
        spc_identity_second_id: ""
      tags: special

    - name: "SPECIAL G - Verify duplicate exact-ID workflows"
      tags: special
      vars:
        spc_identity_common: &spc_identity_options
          fabric_name: "{{ fabric_name }}"
          deploy: false
      block:
        - name: "SPECIAL G - Create first duplicate fixture"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: merged
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
                create_additional_policy: true
                priority: 425
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs:
                  CONF: "! {{ spc_identity_description }} first"
          register: spc_identity_first

        - name: "SPECIAL G - Capture first ID before later operations"
          ansible.builtin.set_fact:
            spc_identity_first_id: "{{ spc_identity_first.force_created[0].policy_id }}"

        - name: "SPECIAL G - Preview a forced duplicate from the existing ID"
          cisco.nd.nd_manage_policy_group: &spc_identity_second_options
            <<: *spc_identity_options
            state: merged
            config:
              - name: "{{ spc_identity_first_id }}"
                create_additional_policy: true
                switch_ids: ["{{ switch_serial_2 }}"]
                template_inputs:
                  CONF: "! {{ spc_identity_description }} second"
          check_mode: true
          register: spc_identity_preview

        - name: "SPECIAL G - Verify effective forced-create preview without copied ID"
          ansible.builtin.assert:
            that:
              - spc_identity_preview.changed
              - spc_identity_preview.force_created | length == 1
              - spc_identity_preview.force_created[0].priority == 500
              - "'policy_id' not in spc_identity_preview.force_created[0]"

        - name: "SPECIAL G - Independently gather after the preview"
          cisco.nd.nd_manage_policy_group: &spc_identity_gather_options
            <<: *spc_identity_options
            state: gathered
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
          register: spc_identity_after_preview

        - name: "SPECIAL G - Verify preview preserved the first fixture only"
          ansible.builtin.assert:
            that:
              - spc_identity_after_preview.gathered | map(attribute='policy_id') | list == [spc_identity_first_id]
              - spc_identity_after_preview.gathered[0].priority == 425
              - spc_identity_after_preview.gathered[0].switch_ids == [switch_serial_1]
              - spc_identity_after_preview.gathered[0].template_inputs.CONF == '! ' ~ spc_identity_description ~ ' first'

        - name: "SPECIAL G - Create the second duplicate with the previewed arguments"
          cisco.nd.nd_manage_policy_group: *spc_identity_second_options
          register: spc_identity_second

        - name: "SPECIAL G - Capture second ID before later operations"
          ansible.builtin.set_fact:
            spc_identity_second_id: "{{ spc_identity_second.force_created[0].policy_id }}"

        - name: "SPECIAL G - Independently gather both duplicate records"
          cisco.nd.nd_manage_policy_group: *spc_identity_gather_options
          register: spc_identity_original

        # Read the legacy winner rather than assuming controller timestamp granularity.
        - name: "SPECIAL G - Find the current composite winner without writing"
          cisco.nd.nd_manage_policy_group: &spc_identity_winner_options
            <<: *spc_identity_options
            state: merged
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
          check_mode: true
          register: spc_identity_winner

        - name: "SPECIAL G - Verify distinct fixtures and legacy winner selection"
          vars:
            first: "{{ spc_identity_original.gathered | selectattr('policy_id', 'equalto', spc_identity_first_id) | first }}"
            second: "{{ spc_identity_original.gathered | selectattr('policy_id', 'equalto', spc_identity_second_id) | first }}"
            winners: "{{ spc_identity_winner.before | selectattr('description', 'equalto', spc_identity_description) | list }}"
          ansible.builtin.assert:
            that:
              - spc_identity_original.gathered | length == 2
              - spc_identity_first_id != spc_identity_second_id
              - first.priority == 425 and first.switch_ids == [switch_serial_1]
              - second.priority == 500 and second.switch_ids == [switch_serial_2]
              - first.template_inputs.CONF != second.template_inputs.CONF
              - not spc_identity_winner.changed
              - winners | length == 1
              - winners[0].policy_id in [spc_identity_first_id, spc_identity_second_id]

        - name: "SPECIAL G - Select the duplicate excluded by composite matching"
          vars:
            winner_id: "{{ (spc_identity_winner.before | selectattr('description', 'equalto', spc_identity_description) | first).policy_id }}"
          ansible.builtin.set_fact:
            spc_identity_target: "{{ spc_identity_original.gathered | rejectattr('policy_id', 'equalto', winner_id) | first }}"
            spc_identity_sibling: "{{ spc_identity_original.gathered | selectattr('policy_id', 'equalto', winner_id) | first }}"

        - name: "SPECIAL G - Accept an exact-ID update while rejecting invalid sibling input"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: merged
            config:
              - name: "{{ spc_identity_target.policy_id }}"
                priority: 600
              - name: switch_freeform
                description: "{{ spc_identity_description }}-invalid"
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs:
                  UNSUPPORTED_IDENTITY_INPUT: "must not create a policy group"
          register: spc_identity_partial
          ignore_errors: true

        - name: "SPECIAL G - Verify accepted progress retains original and omitted fields"
          vars:
            original: "{{ spc_identity_partial.before | selectattr('policy_id', 'equalto', spc_identity_target.policy_id) | first }}"
            accepted: "{{ spc_identity_partial.after | selectattr('policy_id', 'equalto', spc_identity_target.policy_id) | first }}"
          ansible.builtin.assert:
            that:
              - spc_identity_partial.failed and spc_identity_partial.changed
              - spc_identity_partial.template_input_validation_failed | length == 1
              - original.priority == spc_identity_target.priority
              - original.switch_ids == spc_identity_target.switch_ids
              - original.template_inputs.CONF == spc_identity_target.template_inputs.CONF
              - accepted.priority == 600
              - accepted.switch_ids == spc_identity_target.switch_ids
              - accepted.template_inputs.CONF == spc_identity_target.template_inputs.CONF

        - name: "SPECIAL G - Independently gather accepted and invalid-entry results"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: gathered
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
              - name: switch_freeform
                description: "{{ spc_identity_description }}-invalid"
          register: spc_identity_accepted

        - name: "SPECIAL G - Verify persistence and unchanged sibling without an invalid group"
          vars:
            accepted: "{{ spc_identity_accepted.gathered | selectattr('policy_id', 'equalto', spc_identity_target.policy_id) | first }}"
            sibling: "{{ spc_identity_accepted.gathered | selectattr('policy_id', 'equalto', spc_identity_sibling.policy_id) | first }}"
          ansible.builtin.assert:
            that:
              - spc_identity_accepted.gathered | map(attribute='policy_id') | sort == [spc_identity_first_id, spc_identity_second_id] | sort
              - "accepted == spc_identity_target | combine({'priority': 600})"
              - sibling == spc_identity_sibling

        - name: "SPECIAL G - Repeat the exact-ID sparse update in real and check modes"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: merged
            config:
              - name: "{{ spc_identity_target.policy_id }}"
                priority: 600
          check_mode: "{{ item }}"
          loop: [false, true]
          register: spc_identity_noops

        - name: "SPECIAL G - Verify identical exact-ID updates remain unchanged"
          ansible.builtin.assert:
            that:
              - not item.changed
              - item.before == item.after
          loop: "{{ spc_identity_noops.results }}"
          loop_control:
            label: "check_mode={{ item.item }}"

        - name: "SPECIAL G - Read the winner before renaming its excluded sibling"
          cisco.nd.nd_manage_policy_group: *spc_identity_winner_options
          check_mode: true
          register: spc_identity_winner

        - name: "SPECIAL G - Capture the original non-winning rename target"
          vars:
            winner_id: "{{ (spc_identity_winner.before | selectattr('description', 'equalto', spc_identity_description) | first).policy_id }}"
          ansible.builtin.set_fact:
            spc_identity_rename_target: "{{ spc_identity_accepted.gathered | rejectattr('policy_id', 'equalto', winner_id) | first }}"

        - name: "SPECIAL G - Rename the excluded duplicate and restore its description"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: merged
            config:
              - name: "{{ spc_identity_rename_target.policy_id }}"
                description: "{{ item }}"
                switch_ids: "{{ spc_identity_rename_target.switch_ids }}"
                template_inputs: "{{ spc_identity_rename_target.template_inputs }}"
          loop: ["{{ spc_identity_description }}-renamed", "{{ spc_identity_description }}"]
          register: spc_identity_renames

        - name: "SPECIAL G - Verify rename snapshots include the exact original target"
          vars:
            original: "{{ spc_identity_renames.results[0].before | selectattr('policy_id', 'equalto', spc_identity_rename_target.policy_id) | first }}"
            renamed: "{{ spc_identity_renames.results[0].after | selectattr('policy_id', 'equalto', spc_identity_rename_target.policy_id) | first }}"
            restored: "{{ spc_identity_renames.results[1].after | selectattr('policy_id', 'equalto', spc_identity_rename_target.policy_id) | first }}"
          ansible.builtin.assert:
            that:
              - spc_identity_renames.results | selectattr('changed') | list | length == 2
              - spc_identity_rename_target.policy_id in (spc_identity_renames.results[0].before | map(attribute='policy_id') | list)
              - spc_identity_rename_target.policy_id in (spc_identity_renames.results[0].after | map(attribute='policy_id') | list)
              - original.description == spc_identity_description
              - original.priority == spc_identity_rename_target.priority
              - renamed.description == spc_identity_description ~ '-renamed'
              - renamed.priority == spc_identity_rename_target.priority
              - renamed.switch_ids == spc_identity_rename_target.switch_ids
              - renamed.template_inputs.CONF == spc_identity_rename_target.template_inputs.CONF
              - restored.description == spc_identity_description

        - name: "SPECIAL G - Independently gather after restoring the duplicate description"
          cisco.nd.nd_manage_policy_group: *spc_identity_gather_options
          register: spc_identity_before_delete

        - name: "SPECIAL G - Verify rename preserved both records' writable configuration"
          ansible.builtin.assert:
            that:
              - spc_identity_before_delete.gathered | sort(attribute='policy_id') == spc_identity_accepted.gathered | sort(attribute='policy_id')

        - name: "SPECIAL G - Read the winner before exact-ID deletion"
          cisco.nd.nd_manage_policy_group: *spc_identity_winner_options
          check_mode: true
          register: spc_identity_winner

        - name: "SPECIAL G - Select the excluded deletion target and expected survivor"
          vars:
            winner_id: "{{ (spc_identity_winner.before | selectattr('description', 'equalto', spc_identity_description) | first).policy_id }}"
          ansible.builtin.set_fact:
            spc_identity_delete_target: "{{ spc_identity_before_delete.gathered | rejectattr('policy_id', 'equalto', winner_id) | first }}"
            spc_identity_survivor: "{{ spc_identity_before_delete.gathered | selectattr('policy_id', 'equalto', winner_id) | first }}"

        - name: "SPECIAL G - Delete the excluded ID while retaining its creation flag"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: deleted
            config:
              - name: "{{ spc_identity_delete_target.policy_id }}"
                create_additional_policy: true
                switch_ids: "{{ spc_identity_delete_target.switch_ids }}"
                template_inputs: "{{ spc_identity_delete_target.template_inputs }}"
          register: spc_identity_deleted

        - name: "SPECIAL G - Gather after deletion to detect a wrong target or unexpected create"
          cisco.nd.nd_manage_policy_group: *spc_identity_gather_options
          register: spc_identity_after_delete

        - name: "SPECIAL G - Verify only the selected ID was removed"
          ansible.builtin.assert:
            that:
              - spc_identity_deleted.changed
              - "'force_created' not in spc_identity_deleted"
              - spc_identity_after_delete.gathered == [spc_identity_survivor]

        - name: "SPECIAL G - Delete an absent combination with its creation flag in real and check modes"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: deleted
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}-absent"
                create_additional_policy: true
                switch_ids: ["{{ switch_serial_1 }}"]
                template_inputs:
                  CONF: "! {{ spc_identity_description }} must stay absent"
          check_mode: "{{ item }}"
          loop: [false, true]
          register: spc_identity_absent

        - name: "SPECIAL G - Verify absent deletion never enters forced creation"
          ansible.builtin.assert:
            that:
              - not item.changed
              - "'force_created' not in item"
          loop: "{{ spc_identity_absent.results }}"
          loop_control:
            label: "check_mode={{ item.item }}"

        - name: "SPECIAL G - Independently gather the survivor and absent description"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: gathered
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
              - name: switch_freeform
                description: "{{ spc_identity_description }}-absent"
          register: spc_identity_after_absent

        - name: "SPECIAL G - Verify absent deletion created nothing and preserved the survivor"
          ansible.builtin.assert:
            that:
              - spc_identity_after_absent.gathered == [spc_identity_survivor]

      always:
        - name: "SPECIAL G - Capture any unexpected fixture IDs before cleanup"
          cisco.nd.nd_manage_policy_group:
            <<: *spc_identity_options
            state: gathered
            config:
              - name: switch_freeform
                description: "{{ spc_identity_description }}"
              - name: switch_freeform
                description: "{{ spc_identity_description }}-renamed"
              - name: switch_freeform
                description: "{{ spc_identity_description }}-invalid"
              - name: switch_freeform
                description: "{{ spc_identity_description }}-absent"
          register: spc_identity_cleanup

        - name: "SPECIAL G - Clean up only captured fixture IDs without deployment"
          cisco.nd.nd_manage_policy_group:
            fabric_name: "{{ fabric_name }}"
            state: deleted
            deploy: false
            config:
              - name: "{{ item }}"
          loop: "{{ ([spc_identity_first_id, spc_identity_second_id] + (spc_identity_cleanup.gathered | map(attribute='policy_id') | list)) | unique }}"
          when: item | length > 0

  always:
    # The shared cleanup deletes by (description, name) which collapses
    # force-create duplicates. Target the captured policy_ids first.
    - name: "SPECIAL - Cleanup force-created policies by policy_id"
      cisco.nd.nd_manage_policy_group:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: "{{ item }}"
      loop:
        - "{{ spc_dup_force_policy_id | default('') }}"
        - "{{ spc_anon_force_policy_id | default('') }}"
      when: item != ''
      ignore_errors: true
      tags: special

    - name: "SPECIAL - Final cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: special
