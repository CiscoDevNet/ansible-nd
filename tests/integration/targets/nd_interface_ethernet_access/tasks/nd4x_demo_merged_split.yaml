---
- name: Run nd_interface_ethernet_access merged split-config harness tests
  block:
    - name: "MERGED SPLIT SETUP: Normalize Ethernet1/49 and Ethernet1/50"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/49
              - Ethernet1/50
        state: deleted

    - name: "MERGED SPLIT: Configure different settings in one invocation"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: merged
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ ethernet_split_49 }}"
          - "{{ ethernet_split_50 }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Validate Ethernet1/49
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id
              }}/interfaces/Ethernet1%2F49
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.configData.networkOS.policy.policyType"
                equals: accessHost
              - jsonpath: "$.current.configData.networkOS.policy.accessVlan"
                equals: 500
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: Split config item A
          - name: Validate Ethernet1/50
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id
              }}/interfaces/Ethernet1%2F50
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.configData.networkOS.policy.policyType"
                equals: accessHost
              - jsonpath: "$.current.configData.networkOS.policy.accessVlan"
                equals: 600
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: Split config item B
      register: merged_split

    - name: "MERGED SPLIT: Verify independent returned configurations"
      vars:
        ethernet_49_after: >-
          {{
            merged_split.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/49')
            | first
          }}
        ethernet_50_after: >-
          {{
            merged_split.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/50')
            | first
          }}
      ansible.builtin.assert:
        that:
          - ethernet_49_after.config_data.network_os.policy.access_vlan == 500
          - ethernet_49_after.config_data.network_os.policy.description
            == "Split config item A"
          - ethernet_50_after.config_data.network_os.policy.access_vlan == 600
          - ethernet_50_after.config_data.network_os.policy.description
            == "Split config item B"
          - merged_split.idempotency_attempts == 1
          - not merged_split.second_run_result.changed | bool
          - merged_split.nd_query_results | length == 2

  always:
    - name: "MERGED SPLIT CLEANUP: Normalize Ethernet1/49 and Ethernet1/50"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/49
              - Ethernet1/50
        state: deleted
