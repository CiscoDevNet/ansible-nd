---
- name: Run standardized nd_interface_ethernet_access merged fan-out test
  block:
    - name: "MERGED FAN-OUT SETUP: Reset Ethernet1/42 and Ethernet1/43"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/42
              - Ethernet1/43
        state: deleted

    - name: "MERGED FAN-OUT: Configure Ethernet1/42 and Ethernet1/43"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: merged

        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
          timeout: 300

        config:
          - "{{ ethernet_42_43 }}"

        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false

        check_mode_queries:
          - name: Snapshot all managed interfaces on test switch
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            expected_status: 200
            unordered: true
            ignore_keys:
              - operData

        nd_queries:
          - name: Validate Ethernet1/42
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/Ethernet1%2F42"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: Ethernet1/42
              - jsonpath: "$.current.configData.networkOS.policy.policyType"
                equals: accessHost
              - jsonpath: "$.current.configData.networkOS.policy.accessVlan"
                equals: 200
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: "Ansible integration test access ports"

          - name: Validate Ethernet1/43
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/Ethernet1%2F43"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: Ethernet1/43
              - jsonpath: "$.current.configData.networkOS.policy.policyType"
                equals: accessHost
              - jsonpath: "$.current.configData.networkOS.policy.accessVlan"
                equals: 200
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: "Ansible integration test access ports"

      register: merged_fanout

    - name: "MERGED FAN-OUT VERIFY: Verify both interfaces exist"
      ansible.builtin.assert:
        that:
          - merged_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/42')
            | list
            | length == 1
          - merged_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/43')
            | list
            | length == 1

    - name: "MERGED FAN-OUT VERIFY: Verify both interface configurations"
      vars:
        ethernet_42_after: >-
          {{
            merged_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/42')
            | first
          }}
        ethernet_43_after: >-
          {{
            merged_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/43')
            | first
          }}
      ansible.builtin.assert:
        that:
          - ethernet_42_after.config_data.network_os.policy.access_vlan == 200
          - ethernet_42_after.config_data.network_os.policy.description
            == "Ansible integration test access ports"
          - ethernet_43_after.config_data.network_os.policy.access_vlan == 200
          - ethernet_43_after.config_data.network_os.policy.description
            == "Ansible integration test access ports"

    - name: "MERGED FAN-OUT VERIFY: Verify harness idempotency"
      ansible.builtin.assert:
        that:
          - merged_fanout.idempotency_attempts == 1
          - merged_fanout.second_run_result is defined
          - merged_fanout.second_run_result.changed == false
          - merged_fanout.second_run_result.failed
            | default(false)
            | bool == false

    - name: "MERGED FAN-OUT VERIFY: Verify both REST queries"
      vars:
        ethernet_42_query: "{{ merged_fanout.nd_query_results[0] }}"
        ethernet_43_query: "{{ merged_fanout.nd_query_results[1] }}"
      ansible.builtin.assert:
        that:
          - merged_fanout.nd_query_results | length == 2
          - ethernet_42_query.status | int == 200
          - ethernet_42_query.failed == false
          - ethernet_42_query.result.current.interfaceName == "Ethernet1/42"
          - ethernet_43_query.status | int == 200
          - ethernet_43_query.failed == false
          - ethernet_43_query.result.current.interfaceName == "Ethernet1/43"

  always:
    - name: "MERGED FAN-OUT CLEANUP: Reset Ethernet1/42 and Ethernet1/43"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/42
              - Ethernet1/43
        state: deleted
