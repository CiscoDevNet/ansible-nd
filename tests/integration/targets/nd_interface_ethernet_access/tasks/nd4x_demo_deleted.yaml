---
- name: Run standardized nd_interface_ethernet_access deleted test
  block:
    - name: "DELETED SETUP: Reset Ethernet1/41"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41
        state: deleted

    - name: "DELETED SETUP: Create Ethernet1/41 access configuration"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - "{{ ethernet_41 }}"
        state: merged
      register: deleted_setup_ethernet_41

    - name: "DELETED SETUP VERIFY: Verify access configuration was created"
      vars:
        original_ethernet_41: >-
          {{
            deleted_setup_ethernet_41.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | first
          }}
      ansible.builtin.assert:
        that:
          - deleted_setup_ethernet_41 is changed
          - original_ethernet_41.config_data.network_os.policy.access_vlan
            == 100
          - original_ethernet_41.config_data.network_os.policy.description
            == "Ansible integration test Ethernet1/41"

    - name: "DELETED: Normalize Ethernet1/41 using standard runner"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: deleted

        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
          timeout: 300

        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41

        expected:
          check_mode_changed: true
          apply_changed: true
          idempotency: true
          failed: false

        nd_queries:
          - name: Verify physical Ethernet1/41 remains queryable
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/Ethernet1%2F41"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: Ethernet1/41
              - jsonpath: "$.current.interfaceType"
                equals: ethernet

        idempotency_retries: 1
      register: deleted_ethernet_41

    - name: "DELETED VERIFY: Verify interface left managed accessHost state"
      ansible.builtin.assert:
        that:
          - deleted_ethernet_41.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | list
            | length == 0

    - name: "DELETED VERIFY: Verify harness idempotency result"
      ansible.builtin.assert:
        that:
          - deleted_ethernet_41.idempotency_attempts == 1
          - deleted_ethernet_41.second_run_result is defined
          - deleted_ethernet_41.second_run_result.changed == false
          - deleted_ethernet_41.second_run_result.failed
            | default(false)
            | bool == false

    - name: "DELETED VERIFY: Verify REST query result"
      ansible.builtin.assert:
        that:
          - deleted_ethernet_41.nd_query_results | length == 1
          - deleted_ethernet_41.nd_query_results[0].status | int == 200
          - deleted_ethernet_41.nd_query_results[0].failed == false
          - >-
            deleted_ethernet_41.nd_query_results[0]
            .result.current.interfaceName == "Ethernet1/41"
          - >-
            deleted_ethernet_41.nd_query_results[0]
            .result.current.interfaceType == "ethernet"

  always:
    - name: "DELETED CLEANUP: Ensure Ethernet1/41 is normalized"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41
        state: deleted