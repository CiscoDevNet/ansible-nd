---
- name: Run nd_interface_ethernet_access deleted harness tests
  block:
    - name: "DELETED SETUP: Normalize all reserved Ethernet ports"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names: "{{ nd4x_ethernet_reserved_interfaces }}"
        state: deleted

    - name: "DELETED SETUP: Recreate post-overridden fan-out state"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ ethernet_45_46_47 }}"
        state: merged
      register: deleted_setup_fanout

    - name: "DELETED SETUP: Verify Ethernet1/45 through Ethernet1/47"
      ansible.builtin.assert:
        that:
          - deleted_setup_fanout.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/45')
            | list
            | length == 1
          - deleted_setup_fanout.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/46')
            | list
            | length == 1
          - deleted_setup_fanout.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/47')
            | list
            | length == 1

    - name: "DELETED SINGLE: Normalize Ethernet1/45"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: deleted
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/45
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Verify physical Ethernet1/45 remains queryable
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id
              }}/interfaces/Ethernet1%2F45
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: Ethernet1/45
              - jsonpath: "$.current.interfaceType"
                equals: ethernet
          - name: Verify Ethernet1/45 left accessHost scope
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/45' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
      register: deleted_single_45

    - name: "DELETED SINGLE: Verify deletion and idempotency"
      ansible.builtin.assert:
        that:
          - deleted_single_45.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/45')
            | list
            | length == 0
          - deleted_single_45.idempotency_attempts == 1
          - not deleted_single_45.second_run_result.changed | bool
          - deleted_single_45.nd_query_results | length == 2

    - name: "DELETED FAN-OUT: Normalize Ethernet1/46 and Ethernet1/47"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: deleted
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/46
              - Ethernet1/47
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Verify fan-out interfaces left accessHost scope
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/46' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/47' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
      register: deleted_fanout

    - name: "DELETED FAN-OUT: Verify both interfaces"
      ansible.builtin.assert:
        that:
          - deleted_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/46')
            | list
            | length == 0
          - deleted_fanout.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/47')
            | list
            | length == 0
          - not deleted_fanout.second_run_result.changed | bool

    - name: "DELETED MULTI SETUP: Create Ethernet1/41 through Ethernet1/43"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ ethernet_41 }}"
          - "{{ ethernet_42_43 }}"
        state: merged
      register: deleted_multi_setup

    - name: "DELETED MULTI SETUP: Verify all three interfaces"
      ansible.builtin.assert:
        that:
          - deleted_multi_setup.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | list
            | length == 1
          - deleted_multi_setup.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/42')
            | list
            | length == 1
          - deleted_multi_setup.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/43')
            | list
            | length == 1

    - name: "DELETED MULTI: Normalize multiple config groups"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: deleted
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/42
              - Ethernet1/43
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Verify multi-group interfaces left accessHost scope
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/41' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/42' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/43' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
      register: deleted_multi

    - name: "DELETED MULTI: Verify all three interfaces"
      ansible.builtin.assert:
        that:
          - deleted_multi.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | list
            | length == 0
          - deleted_multi.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/42')
            | list
            | length == 0
          - deleted_multi.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/43')
            | list
            | length == 0
          - not deleted_multi.second_run_result.changed | bool

    - name: "DELETED NON-EXISTENT: Normalize Ethernet1/48 again"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: deleted
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/48
        expected:
          check_mode:
            changed: false
            failed: false
          apply:
            changed: false
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        nd_queries:
          - name: Verify Ethernet1/48 remains outside accessHost scope
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'Ethernet1/48' &
                  @.configData.networkOS.policy.policyType == 'accessHost'
                  )]
                exists: false
      register: deleted_nonexistent_48

    - name: "DELETED NON-EXISTENT: Verify every phase is unchanged"
      ansible.builtin.assert:
        that:
          - not deleted_nonexistent_48.check_mode_result.changed | bool
          - not deleted_nonexistent_48.first_run_result.changed | bool
          - not deleted_nonexistent_48.second_run_result.changed | bool

  always:
    - name: "DELETED CLEANUP: Normalize all reserved Ethernet ports"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names: "{{ nd4x_ethernet_reserved_interfaces }}"
        state: deleted
