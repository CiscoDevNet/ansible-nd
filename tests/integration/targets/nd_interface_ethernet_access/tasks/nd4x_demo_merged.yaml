---
- name: Run standardized nd_interface_ethernet_access merged test
  block:
    - name: "MERGED SETUP: Reset Ethernet1/41"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41
        state: deleted

    - name: "MERGED: Configure Ethernet1/41 using standard runner"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_ethernet_access
        state: merged

        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
          timeout: 300

        config:
          - "{{ ethernet_41 }}"

        expected:
          check_mode_changed: true
          apply_changed: true
          idempotency: true
          failed: false

        nd_queries:
          - name: Validate Ethernet1/41 from ND API
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ test_switch_id }}/interfaces/Ethernet1%2F41"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.interfaceName"
                equals: Ethernet1/41
              - jsonpath: "$.current.configData.networkOS.policy.policyType"
                equals: accessHost
              - jsonpath: "$.current.configData.networkOS.policy.accessVlan"
                equals: 100
              - jsonpath: "$.current.configData.networkOS.policy.description"
                equals: "Ansible integration test Ethernet1/41"

        idempotency_retries: 1
      register: merged_ethernet_41

    - name: "MERGED VERIFY: Verify Ethernet1/41 exists"
      ansible.builtin.assert:
        that:
          - merged_ethernet_41.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | list
            | length == 1

    - name: "MERGED VERIFY: Verify Ethernet1/41 configuration"
      vars:
        ethernet_41_after: >-
          {{
            merged_ethernet_41.first_run_result.after
            | selectattr('interface_name', 'equalto', 'Ethernet1/41')
            | first
          }}
      ansible.builtin.assert:
        that:
          - ethernet_41_after.config_data.network_os.policy.access_vlan == 100
          - ethernet_41_after.config_data.network_os.policy.description
            == "Ansible integration test Ethernet1/41"

  always:
    - name: "MERGED CLEANUP: Reset Ethernet1/41"
      cisco.nd.nd_interface_ethernet_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        timeout: 300
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/41
        state: deleted