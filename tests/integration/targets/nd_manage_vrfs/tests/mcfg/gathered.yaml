---
- name: Test Entry Point - [nd_manage_vrfs - mcfg - gathered]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MCFG Gathered Tests - [nd_manage_vrfs]                 +"
      - "----------------------------------------------------------------"
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered - Build Parent and Child Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    target_vrf_names:
      - ansible-nd-vrf-mcfg-gathered
      - ansible-mcfg-gath-parent
    nd_vrf_mcfg_gathered_config:
      - vrf_name: ansible-nd-vrf-mcfg-gathered
        vrf_id: "{{ nd_vrf_base_id + 35 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 35 }}"
        vrf_description: Ansible ND VRF MCFG gathered test
        max_bgp_paths: 2
        max_ibgp_paths: 2
        deploy: false
        child_fabric_config:
          - fabric_name: "{{ nd_vrf_mcfg_child_fabric }}"
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
      - vrf_name: ansible-mcfg-gath-parent
        vrf_id: "{{ nd_vrf_base_id + 36 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 36 }}"
        vrf_description: Ansible ND VRF MCFG gathered parent-only test
        ipv6_linklocal_enable: true
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        deploy: false
  delegate_to: localhost
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered - Import Setup
  ansible.builtin.import_tasks: ../../../tasks/setup.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered - Prepare Configuration
  vars:
    file: mcfg_gathered
    vrf_conf: "{{ nd_vrf_mcfg_gathered_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC1 - Seed VRF
  cisco.nd.nd_manage_vrfs:
    fabric_name: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: merged
    config: "{{ nd_vrf_mcfg_gathered_conf }}"
  register: mcfg_gathered_seed_result
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC2 - Gather Parent VRFs
  cisco.nd.nd_manage_vrfs:
    fabric_name: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: gathered
    config: []
  register: mcfg_parent_gathered
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC2 - Validate Parent VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_parent_gathered }}"
    test_data:
      - vrf_name: ansible-nd-vrf-mcfg-gathered
        vrf_id: "{{ nd_vrf_base_id + 35 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 35 }}"
        vrf_description: Ansible ND VRF MCFG gathered test
        max_bgp_paths: 2
        max_ibgp_paths: 2
      - vrf_name: ansible-mcfg-gath-parent
        vrf_id: "{{ nd_vrf_base_id + 36 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 36 }}"
        vrf_description: Ansible ND VRF MCFG gathered parent-only test
        ipv6_linklocal_enable: true
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC3 - Gather Child VRFs Directly
  cisco.nd.nd_manage_vrfs:
    fabric_name: "{{ nd_vrf_mcfg_child_fabric }}"
    state: gathered
    config: []
  register: mcfg_child_gathered
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC3 - Validate Child VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_child_gathered }}"
    test_data:
      - vrf_name: ansible-nd-vrf-mcfg-gathered
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered

- name: MCFG Gathered TC3 - Validate Parent VRF Propagated To Child
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_child_gathered }}"
    test_data:
      - vrf_name: ansible-mcfg-gath-parent
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - gathered
