---
- name: Test Entry Point - [nd_manage_vrfs - msd - sanity]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MSD Sanity Tests - [nd_manage_vrfs]                    +"
      - "----------------------------------------------------------------"
  tags:
    - msd
    - sanity

- name: MSD Sanity - Build Parent and Child Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_msd_parent_fabric }}"
    target_vrf_names:
      - ansible-msd-sanity-a
      - ansible-msd-sanity-b
      - ansible-msd-sanity-c
    nd_vrf_msd_sanity_merge_config:
      - vrf_name: ansible-msd-sanity-a
        vrf_id: "{{ nd_vrf_base_id + 50 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 50 }}"
        vrf_description: Ansible ND VRF MSD sanity merged
        max_bgp_paths: 2
        max_ibgp_paths: 2
        disable_rt_auto: true
        import_vpn_rt:
          - "65000:50550"
        export_vpn_rt:
          - "65000:50550"
        import_evpn_rt:
          - "65000:50550"
        export_evpn_rt:
          - "65000:50550"
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
            bgp_password: abcdef12
            bgp_passwd_encrypt: 3
      - vrf_name: ansible-msd-sanity-b
        vrf_id: "{{ nd_vrf_base_id + 51 }}"
        l3vni_wo_vlan: true
        vrf_description: Ansible ND VRF MSD sanity L3VNI without VLAN
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            l3vni_wo_vlan: true
            adv_host_routes: false
            adv_default_routes: true
            static_default_route: true
    nd_vrf_msd_sanity_replace_config:
      - vrf_name: ansible-msd-sanity-a
        vrf_id: "{{ nd_vrf_base_id + 50 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 50 }}"
        vrf_description: Ansible ND VRF MSD sanity replaced
        max_bgp_paths: 4
        max_ibgp_paths: 4
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            adv_host_routes: false
            adv_default_routes: true
            static_default_route: true
    nd_vrf_msd_sanity_override_config:
      - vrf_name: ansible-msd-sanity-c
        vrf_id: "{{ nd_vrf_base_id + 52 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 52 }}"
        vrf_description: Ansible ND VRF MSD sanity overridden
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
    nd_vrf_msd_sanity_delete_config:
      - vrf_name: ansible-msd-sanity-c
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            adv_host_routes: true
  delegate_to: localhost
  tags:
    - msd
    - sanity

- name: MSD Sanity - Import Setup
  ansible.builtin.import_tasks: ../../../tasks/setup.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity - Prepare Merge Configuration
  vars:
    file: msd_sanity_merge
    vrf_conf: "{{ nd_vrf_msd_sanity_merge_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity - Prepare Replace Configuration
  vars:
    file: msd_sanity_replace
    vrf_conf: "{{ nd_vrf_msd_sanity_replace_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity - Prepare Override Configuration
  vars:
    file: msd_sanity_override
    vrf_conf: "{{ nd_vrf_msd_sanity_override_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity - Prepare Delete Configuration
  vars:
    file: msd_sanity_delete
    vrf_conf: "{{ nd_vrf_msd_sanity_delete_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC1 - Merged
  cisco.nd.nd_manage_vrfs: &msd_sanity_merge
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: merged
    config: "{{ nd_vrf_msd_sanity_merge_conf }}"
    output_level: debug
  register: msd_sanity_merged
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC1 - Gather Parent After Merged
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: gathered
    config: []
  register: msd_sanity_parent_gathered
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC1 - Validate Parent Merged
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_sanity_parent_gathered }}"
    test_data: "{{ nd_vrf_msd_sanity_merge_conf }}"
    changed: "{{ msd_sanity_merged.changed }}"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC1 - Merged Idempotence
  cisco.nd.nd_manage_vrfs: *msd_sanity_merge
  register: msd_sanity_merged_idempotent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC1 - Assert Merged Idempotence
  ansible.builtin.assert:
    that:
      - msd_sanity_merged_idempotent.changed == false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC2 - Replaced
  cisco.nd.nd_manage_vrfs: &msd_sanity_replace
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: replaced
    config: "{{ nd_vrf_msd_sanity_replace_conf }}"
    output_level: debug
  register: msd_sanity_replaced
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC2 - Gather Parent After Replaced
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: gathered
    config: []
  register: msd_sanity_replaced_gathered
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC2 - Validate Replaced
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_sanity_replaced_gathered }}"
    test_data: "{{ nd_vrf_msd_sanity_replace_conf }}"
    changed: "{{ msd_sanity_replaced.changed }}"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC2 - Replaced Idempotence
  cisco.nd.nd_manage_vrfs: *msd_sanity_replace
  register: msd_sanity_replaced_idempotent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC2 - Assert Replaced Idempotence
  ansible.builtin.assert:
    that:
      - msd_sanity_replaced_idempotent.changed == false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Overridden
  cisco.nd.nd_manage_vrfs: &msd_sanity_override
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: overridden
    config: "{{ nd_vrf_msd_sanity_override_conf }}"
    output_level: debug
  register: msd_sanity_overridden
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Gather Parent After Overridden
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: gathered
    config: []
  register: msd_sanity_overridden_gathered
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Validate Override Created VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_sanity_overridden_gathered }}"
    test_data: "{{ nd_vrf_msd_sanity_override_conf }}"
    changed: "{{ msd_sanity_overridden.changed }}"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Validate Override Removed Old VRFs
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_sanity_overridden_gathered }}"
    test_data:
      - vrf_name: ansible-msd-sanity-a
      - vrf_name: ansible-msd-sanity-b
    present: false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Overridden Idempotence
  cisco.nd.nd_manage_vrfs: *msd_sanity_override
  register: msd_sanity_overridden_idempotent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC3 - Assert Overridden Idempotence
  ansible.builtin.assert:
    that:
      - msd_sanity_overridden_idempotent.changed == false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC4 - Deleted
  cisco.nd.nd_manage_vrfs: &msd_sanity_delete
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: deleted
    config: "{{ nd_vrf_msd_sanity_delete_conf }}"
    output_level: debug
  register: msd_sanity_deleted
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC4 - Assert Deleted Ignores Child Tasks
  ansible.builtin.assert:
    that:
      - msd_sanity_deleted.changed == true
      - msd_sanity_deleted.fabric_type == "multisite_parent"
      - msd_sanity_deleted.child_fabrics is not defined
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC4 - Deleted Idempotence
  cisco.nd.nd_manage_vrfs: *msd_sanity_delete
  register: msd_sanity_deleted_idempotent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC4 - Assert Deleted Idempotence
  ansible.builtin.assert:
    that:
      - msd_sanity_deleted_idempotent.changed == false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC5 - Reject Write Operation on Child Fabric
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_child_fabric }}"
    state: merged
    config:
      - vrf_name: ansible-msd-sanity-child-write
        vrf_id: "{{ nd_vrf_base_id + 53 }}"
  register: msd_child_write_result
  ignore_errors: true
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity

- name: MSD Sanity TC5 - Assert Child Write Rejection
  ansible.builtin.assert:
    that:
      - msd_child_write_result.failed == true
      - "'Only state=' in msd_child_write_result.msg"
      - "'gathered' in msd_child_write_result.msg"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - sanity
