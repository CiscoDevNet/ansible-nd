---
- name: Build VRF Config Data
  ansible.builtin.template:
    src: nd_vrf_conf.j2
    dest: "{{ role_path }}/files/nd_vrf_{{ file }}_conf.yaml"
  delegate_to: localhost

- name: Access VRF Configuration Data and Save to Local Variable
  ansible.builtin.set_fact:
    "{{ 'nd_vrf_' + file + '_conf' }}": "{{ lookup('file', '{{ role_path }}/files/nd_vrf_{{ file }}_conf.yaml') | from_yaml }}"
  delegate_to: localhost
