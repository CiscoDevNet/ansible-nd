---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "STAGED SEED: Create two resources without deployment"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [nd4x_vrf_seed, nd4x_vrf_extra]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"

- name: Verify the full attachment scope immediately before staged
  ansible.builtin.include_tasks: nd4x_scope_preflight.yaml

- name: "STAGED: Apply replacement defaults without deleting omitted definitions"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: staged
    common_args: "{{ nd4x_vrf_common_args }}"
    module_args:
      config_actions: {type: resource, deploy: true}
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [{'vrf_name': nd4x_vrf_names[0], 'max_bgp_paths': 3, 'deploy': true}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
    nd_queries:
      - name: Verify the omitted definition remains present
        path: "{{ nd4x_vrf_api }}/vrfs/{{ nd4x_vrf_names[1] }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.vrfName', equals: "{{ nd4x_vrf_names[1] }}"}

  register: nd4x_vrf_staged

- name: Select every standalone, parent and child API trace for staged verification
  ansible.builtin.set_fact:
    nd4x_vrf_staged_owner: "{{ nd4x_vrf_staged.first_run_result.parent_fabric | default(nd4x_vrf_staged.first_run_result) }}"
    nd4x_vrf_staged_scopes: >-
      {{ [nd4x_vrf_staged.first_run_result.parent_fabric | default(nd4x_vrf_staged.first_run_result)]
         + (nd4x_vrf_staged.first_run_result.child_fabrics | default([])) }}

- name: Verify staged did not deploy despite explicit deployment requests
  ansible.builtin.assert:
    that:
      - nd4x_vrf_staged_owner.api_paths is defined
      - nd4x_vrf_staged_scopes | map(attribute='api_paths', default=[]) | flatten | select('search', '/deploy') | list | length == 0
      - nd4x_vrf_staged.first_run_result.config_actions | selectattr('reason', 'equalto', 'staged_state') | list | length == 1
