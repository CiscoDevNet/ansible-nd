---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "OVERRIDDEN SEED: Create the retained and omitted resources"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [nd4x_vrf_seed, nd4x_vrf_extra]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"

- name: Verify the full destructive scope immediately before overridden
  ansible.builtin.include_tasks: nd4x_scope_preflight.yaml

- name: "OVERRIDDEN: Keep one resource and remove the omitted owned resource"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: overridden
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [{'vrf_name': nd4x_vrf_names[0], 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
    nd_queries:
      - name: Verify reset core fields and cleared lists on the retained VRF
        path: "{{ nd4x_vrf_definition_scope.api }}/vrfs/{{ nd4x_vrf_names[0] }}{{ nd4x_vrf_definition_scope.suffix }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.coreData.mtu', equals: 9216}
          - {jsonpath: '$.current.coreData.maxBgpPaths', equals: 1}
      - name: Verify the omitted resource was removed
        path: "{{ nd4x_vrf_api }}/vrfs/{{ nd4x_vrf_names[1] if 'vrf' == 'vrf' else nd4x_vrf_names[2] }}"
        expected_status: 404
        expected_failed: true
  register: nd4x_vrf_overridden

- name: Require retained identity and cleared route-target lists after overridden
  ansible.builtin.assert:
    that:
      - nd4x_vrf_overridden.nd_query_results[0].result.current.vrfId | int == nd_vrf_base_id | int + 80
      - nd4x_vrf_overridden.nd_query_results[0].result.current.vlanId | int == nd_vrf_base_vlan | int + 80
      - nd4x_vrf_overridden.nd_query_results[0].result.current.coreData.routeTargetImport | default([]) == []
      - nd4x_vrf_overridden.nd_query_results[0].result.current.coreData.routeTargetExport | default([]) == []
      - nd4x_vrf_overridden.nd_query_results[0].result.current.coreData.evpnRouteTargetImport | default([]) == []
      - nd4x_vrf_overridden.nd_query_results[0].result.current.coreData.evpnRouteTargetExport | default([]) == []

- name: Verify omitted MVPN lists reset without disabling active TRM
  ansible.builtin.include_tasks: nd4x_trm_state.yaml
  vars:
    nd4x_definition_state: overridden
  when: "'trm' in nd_vrf_harness_features"

- name: Verify omitted no-VLAN mode survives override
  ansible.builtin.include_tasks: nd4x_mode_state.yaml
  vars:
    nd4x_definition_state: overridden
  when: "'no_vlan' in nd_vrf_harness_features"
