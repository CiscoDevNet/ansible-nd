---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "REPLACED SEED: Create non-default values before replacement"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [nd4x_vrf_seed]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"

- name: "REPLACED: Omitted identifiers and VLANs retain their existing allocation"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: replaced
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [{'vrf_name': nd4x_vrf_names[0], 'max_bgp_paths': 2, 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
    nd_queries:
      - name: Verify retained identity and applied replacement
        path: "{{ nd4x_vrf_definition_scope.api }}/vrfs/{{ nd4x_vrf_names[0] }}{{ nd4x_vrf_definition_scope.suffix }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.vrfId', exists: true}
          - {jsonpath: '$.current.coreData.maxBgpPaths', equals: 2}
  register: nd4x_vrf_replaced

- name: Verify omitted VRF and VLAN IDs retained their allocation
  ansible.builtin.assert:
    that:
      - nd4x_vrf_replaced.nd_query_results[0].result.current.vrfId | int == nd_vrf_base_id | int + 80
      - nd4x_vrf_replaced.nd_query_results[0].result.current.vlanId | int == nd_vrf_base_vlan | int + 80

- name: "REPLACED DEFAULTS: Name-only replacement restores documented defaults"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: replaced
    common_args: "{{ nd4x_vrf_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_vrf_conf.j2', template_vars={'vrf_conf': [{'vrf_name': nd4x_vrf_names[0], 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
    nd_queries:
      - name: Verify default path count and preserved allocations
        path: "{{ nd4x_vrf_definition_scope.api }}/vrfs/{{ nd4x_vrf_names[0] }}{{ nd4x_vrf_definition_scope.suffix }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.coreData.maxBgpPaths', equals: 1}
          - {jsonpath: '$.current.vrfId', exists: true}
          - {jsonpath: '$.current.vlanId', exists: true}
  register: nd4x_vrf_reset_defaults

- name: Verify name-only replacement still preserves both allocations
  ansible.builtin.assert:
    that:
      - nd4x_vrf_reset_defaults.nd_query_results[0].result.current.vrfId | int == nd_vrf_base_id | int + 80
      - nd4x_vrf_reset_defaults.nd_query_results[0].result.current.vlanId | int == nd_vrf_base_vlan | int + 80
