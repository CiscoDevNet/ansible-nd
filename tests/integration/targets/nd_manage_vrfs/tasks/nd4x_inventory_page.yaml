---
- name: Read one bounded vrf inventory page
  cisco.nd.nd_rest:
    path: >-
      {{ nd4x_vrf_scope.api }}/vrfs{{ nd4x_vrf_scope.suffix }}{{ '&' if nd4x_vrf_scope.suffix else '?' }}max={{ nd_vrf_harness_page_size | int }}&offset={{ nd4x_vrf_offset }}&sort=vrfName:asc
    method: get
  register: nd4x_vrf_page

- name: Validate collection shape and reject repeated or non-progressing pages
  ansible.builtin.assert:
    that:
      - nd4x_vrf_page.status | int == 200
      - nd4x_vrf_page.current.vrfs is sequence
      - nd4x_vrf_page.current.vrfs is not string
      - nd4x_vrf_page.current.vrfs is not mapping
      - nd4x_vrf_page_count | int < 1000
      - >-
        nd4x_vrf_page.current.vrfs | map(attribute='vrfName') | unique | length
        == nd4x_vrf_page.current.vrfs | length
      - >-
        nd4x_vrf_rows | map(attribute='vrfName')
        | intersect(nd4x_vrf_page.current.vrfs | map(attribute='vrfName')) | length == 0

- name: Retain rows and pagination metadata
  ansible.builtin.set_fact:
    nd4x_vrf_rows: "{{ nd4x_vrf_rows + nd4x_vrf_page.current.vrfs }}"
    nd4x_vrf_offset: "{{ nd4x_vrf_offset | int + nd4x_vrf_page.current.vrfs | length }}"
    nd4x_vrf_page_count: "{{ nd4x_vrf_page_count | int + 1 }}"
    nd4x_vrf_meta: "{{ nd4x_vrf_page.current.meta | default(nd4x_vrf_page.current.metadata | default({})) }}"

- name: Reject contradictory collection counts
  ansible.builtin.assert:
    that:
      - nd4x_vrf_meta.counts.total is not defined or nd4x_vrf_meta.counts.total | int >= nd4x_vrf_offset | int
      - >-
        nd4x_vrf_meta.counts.total is not defined or nd4x_vrf_meta.counts.remaining is not defined or
        nd4x_vrf_offset | int + nd4x_vrf_meta.counts.remaining | int == nd4x_vrf_meta.counts.total | int

- name: Determine whether the next page is required
  ansible.builtin.set_fact:
    nd4x_vrf_more: >-
      {{ (nd4x_vrf_meta.counts.remaining | int > 0) if nd4x_vrf_meta.counts.remaining is defined else
         ((nd4x_vrf_offset | int < nd4x_vrf_meta.counts.total | int) if nd4x_vrf_meta.counts.total is defined else
          ((nd4x_vrf_meta.links.next | default('', true) | length > 0) or (nd4x_vrf_page.current.vrfs | length == nd_vrf_harness_page_size | int))) }}

- name: Reject an empty page that advertises more data
  ansible.builtin.assert:
    that:
      - not nd4x_vrf_more | bool or nd4x_vrf_page.current.vrfs | length > 0

- name: Read the next page without a fixed-size inventory cutoff
  ansible.builtin.include_tasks: nd4x_inventory_page.yaml
  when: nd4x_vrf_more | bool
