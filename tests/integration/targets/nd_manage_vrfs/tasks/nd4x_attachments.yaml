---
- name: Require an explicitly reserved switch and its controller identity
  ansible.builtin.assert:
    that:
      - nd4x_vrf_switch | length > 0
      - nd_vrf_harness_switch_id | default('') | length > 0
    fail_msg: Configure the reserved switch IP and nd_vrf_harness_switch_id.

- name: Establish an empty owned attachment baseline
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: Create and attach a fresh resource in one module call
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    config: >-
      {{ [nd4x_vrf_seed | combine({'attach': [{
           'ip_address': nd4x_vrf_switch
         }]})] }}
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"

- name: Read the saved binding independently through the query endpoint
  cisco.nd.nd_rest:
    path: "{{ nd4x_vrf_api }}/vrfAttachments/query?includeAll=true&max=100&offset=0"
    method: post
    content:
      vrfNames: ["{{ nd4x_vrf_names[0] }}"]
      switchIds: ["{{ nd_vrf_harness_switch_id }}"]
  register: nd4x_vrf_attachment_readback

- name: Verify the requested resource and switch really are bound
  ansible.builtin.assert:
    that:
      - nd4x_vrf_attachment_readback.status | int == 200
      - >-
        nd4x_vrf_attachment_readback.current.attachments
        | selectattr('vrfName', 'equalto', nd4x_vrf_names[0])
        | selectattr('switchId', 'equalto', nd_vrf_harness_switch_id)
        | selectattr('attach', 'equalto', true) | list | length == 1
      - nd4x_vrf_attachment_readback.current.meta.counts.remaining | default(0) | int == 0

- name: Repeat an attachment-only task without changing the definition
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    config:
      - vrf_name: "{{ nd4x_vrf_names[0] }}"
        deploy: false
        attach:
          - ip_address: "{{ nd4x_vrf_switch }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_no_change }}"

- name: Verify attachment option preservation and authoritative resets
  ansible.builtin.include_tasks: nd4x_attachment_state.yaml
  loop: "{{ ['replaced', 'overridden'] if nd4x_vrf_destructive_enabled | bool else ['replaced'] }}"
  loop_control:
    loop_var: nd4x_attachment_state

- name: Deploy only the owned resource when device testing is explicitly enabled
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: merged
    common_args: "{{ nd4x_vrf_common_args }}"
    module_args:
      config_actions: {type: resource, deploy: true}
    config:
      - vrf_name: "{{ nd4x_vrf_names[0] }}"
        attach:
          - ip_address: "{{ nd4x_vrf_switch }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
    idempotency_retries: 3
    idempotency_delay: 5
  register: nd4x_vrf_deploy_result
  when: nd_vrf_harness_deploy_tests_enabled | default(false) | bool

- name: Select deployment reports from the owning standalone or parent scope
  ansible.builtin.set_fact:
    nd4x_vrf_deploy_check: >-
      {{ nd4x_vrf_deploy_result.check_mode_result.parent_fabric | default(nd4x_vrf_deploy_result.check_mode_result) }}
    nd4x_vrf_deploy_apply: >-
      {{ nd4x_vrf_deploy_result.first_run_result.parent_fabric | default(nd4x_vrf_deploy_result.first_run_result) }}
  when: nd_vrf_harness_deploy_tests_enabled | default(false) | bool

- name: Require resource-scoped predictive and applied deployment targets
  ansible.builtin.assert:
    that:
      - nd4x_vrf_deploy_check.config_actions | selectattr('status', 'equalto', 'planned') | list | length == 1
      - nd4x_vrf_deploy_apply.config_actions | selectattr('status', 'equalto', 'completed') | list | length == 1
      - nd4x_vrf_deploy_check.config_actions[0].effective.type == 'resource'
      - nd4x_vrf_deploy_check.config_actions[0].targets.resources == [nd4x_vrf_names[0]]
      - nd4x_vrf_deploy_check.config_actions[0].targets.switches == [nd_vrf_harness_switch_id]
      - nd4x_vrf_deploy_apply.config_actions[0].targets == nd4x_vrf_deploy_check.config_actions[0].targets
      - nd4x_vrf_deploy_apply.api_paths | select('search', '/switchActions/deploy') | list | length == 0
  when: nd_vrf_harness_deploy_tests_enabled | default(false) | bool

- name: Verify deployment completion rather than request acceptance
  cisco.nd.nd_rest:
    path: "{{ nd4x_vrf_api }}/vrfAttachments/query?includeAll=true&max=100&offset=0"
    method: post
    content:
      vrfNames: ["{{ nd4x_vrf_names[0] }}"]
      switchIds: ["{{ nd_vrf_harness_switch_id }}"]
  register: nd4x_vrf_deploy_readback
  until: >-
    nd4x_vrf_deploy_readback.current.attachments | default([]) | length == 1 and
    nd4x_vrf_deploy_readback.current.attachments[0].status in ['deployed', 'inSync']
  retries: 12
  delay: 5
  when: nd_vrf_harness_deploy_tests_enabled | default(false) | bool

- name: Delete the attached resource using module-managed scoped cleanup
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_vrfs
    state: deleted
    common_args: "{{ nd4x_vrf_common_args }}"
    config:
      - vrf_name: "{{ nd4x_vrf_names[0] }}"
    check_mode_queries: "{{ nd4x_vrf_snapshots }}"
    expected: "{{ nd4x_vrf_expected_change }}"
