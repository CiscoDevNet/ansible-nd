---
# Variables for nd_interface_subinterface_managed integration tests.
#
# Override fabric_name, switch_ip, ethernet_parent and port_channel_parent in your
# inventory or extra-vars to match a real ND 4.2 testbed.
#
# The parent interfaces must exist and (for Ethernet parents) must be free of any
# L2 mode conflicts before subinterfaces can be created on them.

test_fabric_name: "{{ nd_test_fabric_name | default('test_fabric') }}"
test_switch_ip: "{{ nd_test_switch_ip | default('192.168.1.1') }}"
ethernet_parent: "{{ nd_test_ethernet_parent | default('Ethernet1/3') }}"
port_channel_parent: "{{ nd_test_port_channel_parent | default('Port-channel10') }}"

# --- Base configs ---

subif_eth_2:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.2"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "Ansible integration test subif Eth.2"
        vlan_id: 2
        vrf_interface: default
        ip: 192.168.50.50
        prefix: 24
        ipv6: "2001:192:168:50::50"
        ipv6_prefix: 64
        mtu: 9216
        ip_redirects: true
        pim_sparse: false
        pim_dr_priority: 1
        netflow: false

subif_eth_3:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.3"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "Ansible integration test subif Eth.3"
        vlan_id: 3
        vrf_interface: default
        ip: 192.168.51.50
        prefix: 24

subif_eth_4:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.4"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "Ansible integration test subif Eth.4"
        vlan_id: 4
        vrf_interface: default
        ip: 192.168.52.50
        prefix: 24

subif_pc_5:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ port_channel_parent }}.5"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "Ansible integration test subif PC.5"
        vlan_id: 5
        vrf_interface: default
        ip: 192.168.55.1
        prefix: 24

# --- Updated configs for merge/replace tests ---

subif_eth_2_updated:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.2"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "Updated subif Eth.2"
        vlan_id: 2
        vrf_interface: default
        ip: 192.168.50.51
        prefix: 24
        ip_redirects: false
        pim_sparse: true
        pim_dr_priority: 50
        routing_tag: "12345"
        netflow: false

# --- Cleanup helper: all test subinterfaces to remove before tests run ---

cleanup_config:
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.2"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.3"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.4"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ port_channel_parent }}.5"

# --- IOS-XE coverage (issue #541) ---
# Set nd_test_xe_switch_ip (and optionally nd_test_xe_fabric_name / nd_test_xe_parent_interface) in inventory/extra-vars to enable;
# xe.yaml is skipped when nd_test_xe_switch_ip is unset. The parent port is converted to a routed host for the run and reset to the
# fabric-default trunk host afterwards; sub-ids 100-103 on it are reserved. Lab-verified on CAMPUS1 Catalyst 9000v leaves against
# ND 4.2.1.10 and 4.3.1.175.
# The ND 4.x harness XE scenarios additionally require nd_subinterface_managed_xe_tests_enabled=true; setting it confirms that
# nd_test_xe_parent_interface is the dedicated test host port (default GigabitEthernet1/0/2). The port must begin as plain,
# unbundled, and not a fabric-link endpoint, and in the exact IOS-XE fabric-default trunk-host state.
# Harness sub-IDs 200-204 on that parent are reserved and must
# be absent from both ND's interface inventory and running configuration. Teardown verifies the parent is still either this
# documented default or the routed-host policy created by the harness before changing it.
test_xe_fabric_name: "{{ nd_test_xe_fabric_name | default(test_fabric_name) }}"
test_xe_switch_ip: "{{ nd_test_xe_switch_ip | default('') }}"
xe_parent: "{{ nd_test_xe_parent_interface | default('GigabitEthernet1/0/2') }}"
nd4x_subinterface_managed_xe_tests_enabled: >-
  {{ nd_subinterface_managed_xe_tests_enabled | default(false) | bool }}
nd4x_xe_reserved_subinterface_ids:
  - 200
  - 201
  - 202
  - 203
  - 204

# The routed parent, applied with nd_interface_ethernet_routed before the subinterfaces are created (ND checks the parent's
# DISCOVERED mode, so the parent is deployed and xe.yaml waits for discovery before the first create).
xe_parent_routed:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        admin_state: true
        description: "Ansible integration test XE subinterface parent"

xe_subif_100:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}.100"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        # policy_type intentionally omitted: derived from network_os_type (iosXeSubinterface); xe.yaml asserts the echo carries it.
        admin_state: true
        description: "Ansible integration test XE subif 100"
        vlan_id: 100
        # vrf_interface intentionally omitted: the Catalyst has no VRF named default; omit it for the global routing table.
        ip: 10.99.100.1
        prefix: 24
        ipv6: "2001:db8:100::1"
        ipv6_prefix: 64

xe_subif_101_shut:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}.101"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: iosXeSubinterfaceShutNoshut
        admin_state: false

xe_subif_102:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}.102"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        policy_type: iosXeSubinterface
        admin_state: true
        description: "Ansible integration test XE subif 102"
        vlan_id: 102
        ip: 10.99.102.1
        prefix: 24

xe_subif_100_updated:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}.100"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        admin_state: true
        description: "Updated XE subif 100"
        vlan_id: 100
        # vrf_interface intentionally omitted: the Catalyst has no VRF named default; omit it for the global routing table.
        ip: 10.99.100.2
        prefix: 24
        ipv6: "2001:db8:100::1"
        ipv6_prefix: 64

# NX-OS-only field on the IOS-XE branch: must fail argument/model validation before any controller call.
xe_subif_bad_mtu:
  switch_ip: "{{ test_xe_switch_ip }}"
  interface_name: "{{ xe_parent }}.103"
  config_data:
    network_os:
      network_os_type: ios-xe
      policy:
        vlan_id: 103
        ip: 10.99.103.1
        prefix: 24
        mtu: 9216

xe_cleanup_config:
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.100"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.101"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.102"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.103"

# --- ND 4.x harness coverage ---
# These IDs do not overlap the legacy NX-OS (.2-.5) or IOS-XE (.100-.103) suite.
# NX-OS harness scenarios require .20-.22 and .24 on the Ethernet parent and .23 on the Port-channel parent to be free in both
# ND's interface inventory and running configuration before setup. An occupied ID fails preflight; the harness does not try to
# infer that an existing resource is stale harness data or delete it before starting.
nd4x_subinterface_managed_destructive_tests_enabled: >-
  {{
    nd_subinterface_managed_destructive_tests_enabled
    | default(false)
    | bool
  }}

nd4x_subif_eth_20:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.20"
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: subinterface
        admin_state: true
        description: "ND4X harness managed subinterface 20"
        vlan_id: 20
        vrf_interface: default
        ip: 192.168.60.20
        prefix: 24
        ipv6: "2001:192:168:60::20"
        ipv6_prefix: 64
        mtu: 9216
        ip_redirects: true
        pim_sparse: false
        pim_dr_priority: 1
        netflow: false

nd4x_subif_eth_20_updated:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.20"
  config_data:
    network_os:
      network_os_type: nx-os
      policy:
        policy_type: subinterface
        admin_state: true
        description: "ND4X harness updated subinterface 20"
        vlan_id: 20
        vrf_interface: default
        ip: 192.168.60.21
        prefix: 24
        ipv6: "2001:192:168:60::21"
        ipv6_prefix: 64
        mtu: 9000
        ip_redirects: false
        pim_sparse: true
        pim_dr_priority: 50
        routing_tag: "12345"
        netflow: false

nd4x_subif_eth_21:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.21"
  config_data:
    network_os:
      network_os_type: nx-os
