        policy_type: subinterface
        admin_state: true
        description: "ND4X harness updated subinterface 21"
        vlan_id: 21
        vrf_interface: default
        ip: 192.168.61.21
        prefix: 24
        ip_redirects: true

nd4x_subif_eth_22:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.22"
  config_data:
    network_os:
      network_os_type: nx-os
