  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.201"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.202"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.203"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.204"

nd4x_override_reserved_xe_pairs:
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.200"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.201"
  - switch_ip: "{{ test_xe_switch_ip }}"
    interface_name: "{{ xe_parent }}.202"
  - switch_ip: "{{ test_xe_switch_ip }}"
