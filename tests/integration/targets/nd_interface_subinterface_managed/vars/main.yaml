        prefix: 24

nd4x_subif_eth_cleanup:
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.20"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.21"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.22"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.24"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ port_channel_parent }}.23"

# Fabric-wide state: overridden safety scope. Each entry is a composite
# (switch management IP, interface name) pair; the harness resolves the current
# switch ID from the fabric inventory before comparing it with live resources.
# Keep the reserved set limited to interfaces owned by this scenario.
nd4x_override_reserved_nxos_pairs:
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.20"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.21"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.22"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.24"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ port_channel_parent }}.23"

nd4x_override_intended_nxos_pairs:
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ ethernet_parent }}.20"
  - switch_ip: "{{ test_switch_ip }}"
    interface_name: "{{ port_channel_parent }}.23"

nd4x_subif_xe_200:
