        policy_type: subinterface
        admin_state: true
        description: "ND4X harness managed subinterface 22"
        vlan_id: 22
        vrf_interface: default
        ip: 192.168.62.20
        prefix: 24

# Intentionally omits network_os_type and policy_type to exercise NX-OS defaults.
nd4x_subif_eth_24_inferred:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ ethernet_parent }}.24"
  config_data:
    network_os:
      policy:
        admin_state: true
        description: "ND4X inferred NX-OS subinterface 24"
        vlan_id: 24
        vrf_interface: default
        ip: 192.168.64.20
        prefix: 24

nd4x_subif_pc_23:
  switch_ip: "{{ test_switch_ip }}"
  interface_name: "{{ port_channel_parent }}.23"
  config_data:
    network_os:
      network_os_type: nx-os
