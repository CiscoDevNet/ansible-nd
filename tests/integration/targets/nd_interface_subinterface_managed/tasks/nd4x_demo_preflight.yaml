---
- name: "ND4X PREFLIGHT: Require Nexus Dashboard connection variables"
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_user is defined
      - ansible_password is defined
    fail_msg: "Define ansible_host, ansible_user, and ansible_password for the ND integration test target."

- name: "ND4X PREFLIGHT: Set harness output level"
  ansible.builtin.set_fact:
    nd4x_output_level: "{{ api_key_output_level | default('debug') }}"

- name: "ND4X PREFLIGHT: Query Nexus Dashboard version"
  cisco.nd.nd_version:
    output_level: "{{ nd4x_output_level }}"
  register: nd4x_version

- name: "ND4X PREFLIGHT: Record ND 4.x support"
  ansible.builtin.set_fact:
    nd4x_supported: "{{ nd4x_version.current.platformVersion is version('4.0.0', '>=') }}"

- name: "ND4X PREFLIGHT: Explain unsupported controller skip"
  ansible.builtin.debug:
    msg: >-
      Skipping ND 4.x managed-subinterface harness scenarios because controller version
      {{ nd4x_version.current.platformVersion }} is older than 4.0.0.
  when: not nd4x_supported | bool

- name: "ND4X PREFLIGHT: Query switches in the test fabric"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches"
    method: get
  register: nd4x_switch_inventory
  changed_when: false
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Initialize fabric snapshot queries"
  ansible.builtin.set_fact:
    nd4x_fabric_check_mode_queries: []
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Build a full interface snapshot for every fabric switch"
  ansible.builtin.set_fact:
    nd4x_fabric_check_mode_queries: >-
      {{
        nd4x_fabric_check_mode_queries
        + [
            {
              'name': 'Snapshot managed interfaces on switch '
                ~ (item.fabricManagementIp | default(item.switchId)),
              'path': '/api/v1/manage/fabrics/'
                ~ test_fabric_name
                ~ '/switches/'
                ~ item.switchId
                ~ '/interfaces?max=500&offset=0&sort=interfaceName:asc',
              'expected_status': 200,
              'unordered_paths': ['/interfaces'],
              'ignore_keys': ['operData']
            }
          ]
      }}
  loop: "{{ nd4x_switch_inventory.current.switches | default([]) }}"
  loop_control:
    label: "{{ item.fabricManagementIp | default(item.switchId) }}"
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Verify fabric snapshot coverage"
  ansible.builtin.assert:
    that:
      - nd4x_fabric_check_mode_queries | length > 0
      - nd4x_fabric_check_mode_queries | length == nd4x_switch_inventory.current.switches | default([]) | length
    fail_msg: >-
      Could not prepare one predictive snapshot query for every switch in fabric {{ test_fabric_name }}.
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Select the configured test switch"
  ansible.builtin.set_fact:
    nd4x_switch_matches: >-
      {{
        nd4x_switch_inventory.current.switches
        | default([])
        | selectattr('fabricManagementIp', 'equalto', test_switch_ip)
        | list
      }}
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Require exactly one matching switch"
  ansible.builtin.assert:
    that:
      - nd4x_switch_matches | length == 1
    fail_msg: >-
      Expected exactly one switch with fabricManagementIp {{ test_switch_ip }} in fabric
      {{ test_fabric_name }}, but found {{ nd4x_switch_matches | length }}.
  when: nd4x_supported | bool

- name: "ND4X PREFLIGHT: Record current switch ID"
  ansible.builtin.set_fact:
    test_switch_id: "{{ nd4x_switch_matches[0].switchId }}"
  when: nd4x_supported | bool
