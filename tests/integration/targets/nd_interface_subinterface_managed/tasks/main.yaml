---
# Test code for the nd_interface_subinterface_managed module
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# --- Usage ---
#
# Run the test suite with ansible-test:
#   ansible-test network-integration nd_interface_subinterface_managed
#
# --- Optional IOS-XE testbed configuration (issue #541) ---
#
#   nd_test_xe_fabric_name=<Catalyst fabric, defaults to nd_test_fabric_name>
#   nd_test_xe_switch_ip=<Catalyst leaf switch IP; unset skips xe.yaml>
#   nd_test_xe_parent_interface=<Catalyst front-panel port used as the routed parent, default GigabitEthernet1/0/2>
#   nd_subinterface_managed_xe_tests_enabled=true (required to opt in to either ND 4.x harness XE scenario)
#
# The parent port must be a plain host port (not a port-channel member or a fabric link); xe.yaml converts it to a routed port for
# the duration of the run and xe_teardown.yaml resets it to the fabric-default trunk host afterwards, also when the run fails.
# Sub-ids 100-103 on it must be free for the legacy suite; harness IOS-XE scenarios reserve .200-.204.
#
# --- Optional test variables ---
#
# Set the variables below in the [nd:vars] section of tests/integration/inventory.networking
#
# nd_logging_config (str, default: "")
#   Path to a JSON file conforming to logging.config.dictConfig (see
#   plugins/module_utils/common/log.py for an example). When set, the path is
#   forwarded to the module subprocess via the ND_LOGGING_CONFIG environment
#   variable.

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'

- name: Run nd_interface_subinterface_managed state tests with optional logging env
  block:
    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    # xe.yaml converts a Catalyst front-panel port to a routed port and creates subinterfaces on it. The teardown runs from `always`
    # so a failed scenario still leaves the testbed as it found it; Ansible reports the scenario's failure after the teardown.
    - name: Run IOS-XE tests (requires nd_test_xe_switch_ip)
      when: nd_test_xe_switch_ip is defined and nd_test_xe_switch_ip | length > 0
      block:
        - name: Run the IOS-XE scenario
          ansible.builtin.include_tasks: xe.yaml
      always:
        - name: Remove the IOS-XE test subinterfaces and reset the parent port
          ansible.builtin.include_tasks: xe_teardown.yaml

    # Harness scenarios are opt-in. Their task tags do not select or alter the legacy suite above.
    - name: Run ND 4.x harness preflight discovery
      ansible.builtin.include_tasks:
        file: nd4x_demo_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_preflight
            - nd4x_demo_merged
            - nd4x_demo_replaced
            - nd4x_demo_deleted
            - nd4x_demo_overridden
            - nd4x_demo_override_scope
            - nd4x_demo_negative
            - nd4x_demo_xe
            - nd4x_demo_xe_overridden
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted
        - nd4x_demo_overridden
        - nd4x_demo_override_scope
        - nd4x_demo_negative
        - nd4x_demo_xe
        - nd4x_demo_xe_overridden

    - name: Run merged state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_merged.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
      when: nd4x_supported | default(false) | bool

    - name: Run replaced state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_replaced.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_replaced
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_replaced
      when: nd4x_supported | default(false) | bool

    - name: Run deleted state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_deleted.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_deleted
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_deleted
      when: nd4x_supported | default(false) | bool

    - name: Run overridden state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_overridden.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_overridden
            - nd4x_demo_override_scope
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_overridden
        - nd4x_demo_override_scope
      when: nd4x_supported | default(false) | bool

    - name: Run negative validation tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_negative.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_negative
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_negative
      when: nd4x_supported | default(false) | bool

    - name: Run IOS-XE tests using the ND 4.x harness (requires explicit opt-in and nd_test_xe_switch_ip)
      when:
        - nd4x_supported | default(false) | bool
        - nd4x_subinterface_managed_xe_tests_enabled | bool
        - nd_test_xe_switch_ip is defined
        - nd_test_xe_switch_ip | length > 0
      block:
        - name: Run the IOS-XE harness scenario
          ansible.builtin.include_tasks:
            file: nd4x_demo_xe.yaml
            apply:
              tags:
                - never
                - nd4x_demo
                - nd4x_demo_xe
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_xe
      always:
        - name: Remove the IOS-XE harness subinterfaces and reset the parent port
          ansible.builtin.include_tasks:
            file: nd4x_demo_xe_teardown.yaml
            apply:
              tags:
                - never
                - nd4x_demo
                - nd4x_demo_xe
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_xe
          when: nd4x_xe_setup_started | default(false) | bool

    - name: Run IOS-XE overridden state tests using the ND 4.x harness (requires explicit opt-in and nd_test_xe_switch_ip)
      when:
        - nd4x_supported | default(false) | bool
        - nd4x_subinterface_managed_xe_tests_enabled | bool
        - nd4x_subinterface_managed_destructive_tests_enabled | bool
        - nd_test_xe_switch_ip is defined
        - nd_test_xe_switch_ip | length > 0
      block:
        - name: Run the IOS-XE overridden harness scenario
          ansible.builtin.include_tasks:
            file: nd4x_demo_xe_overridden.yaml
            apply:
              tags:
                - never
                - nd4x_demo
                - nd4x_demo_xe_overridden
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_xe_overridden
      always:
        - name: Remove IOS-XE overridden harness resources and restore the parent port
          ansible.builtin.include_tasks:
            file: nd4x_demo_xe_teardown.yaml
            apply:
              tags:
                - never
                - nd4x_demo
                - nd4x_demo_xe_overridden
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_xe_overridden
          when: nd4x_xe_override_setup_started | default(false) | bool
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
