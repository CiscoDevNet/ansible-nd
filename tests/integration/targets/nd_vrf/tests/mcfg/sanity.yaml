---
- name: Test Entry Point - [nd_vrf - mcfg - sanity]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MCFG Sanity Tests - [nd_vrf]                   +"
      - "----------------------------------------------------------------"
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Build Parent and Child Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    target_vrf_names:
      - ansible-nd-vrf-mcfg-sanity-a
      - ansible-nd-vrf-mcfg-sanity-b
      - ansible-nd-vrf-mcfg-sanity-c
    nd_vrf_mcfg_sanity_merge_config:
      - vrf_name: ansible-nd-vrf-mcfg-sanity-a
        vrf_id: "{{ nd_vrf_base_id + 60 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 60 }}"
        vrf_description: Ansible ND VRF MCFG sanity merged
        max_bgp_paths: 2
        max_ibgp_paths: 2
        disable_rt_auto: true
        import_vpn_rt:
          - "65000:50660"
        export_vpn_rt:
          - "65000:50660"
        import_evpn_rt:
          - "65000:50660"
        export_evpn_rt:
          - "65000:50660"
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_mcfg_child_fabric }}"
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
            bgp_password: abcdef12
            bgp_passwd_encrypt: 3
      - vrf_name: ansible-nd-vrf-mcfg-sanity-b
        vrf_id: "{{ nd_vrf_base_id + 61 }}"
        l3vni_wo_vlan: true
        vrf_description: Ansible ND VRF MCFG sanity L3VNI without VLAN
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_mcfg_child_fabric }}"
            l3vni_wo_vlan: true
            adv_host_routes: false
            adv_default_routes: true
            static_default_route: true
    nd_vrf_mcfg_sanity_replace_config:
      - vrf_name: ansible-nd-vrf-mcfg-sanity-a
        vrf_id: "{{ nd_vrf_base_id + 60 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 60 }}"
        vrf_description: Ansible ND VRF MCFG sanity replaced
        max_bgp_paths: 4
        max_ibgp_paths: 4
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_mcfg_child_fabric }}"
            adv_host_routes: false
            adv_default_routes: true
            static_default_route: true
    nd_vrf_mcfg_sanity_override_config:
      - vrf_name: ansible-nd-vrf-mcfg-sanity-c
        vrf_id: "{{ nd_vrf_base_id + 62 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 62 }}"
        vrf_description: Ansible ND VRF MCFG sanity overridden
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_mcfg_child_fabric }}"
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
    nd_vrf_mcfg_sanity_delete_config:
      - vrf_name: ansible-nd-vrf-mcfg-sanity-c
        child_fabric_config:
          - fabric: "{{ nd_vrf_mcfg_child_fabric }}"
            adv_host_routes: true
  delegate_to: localhost
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Import Setup
  ansible.builtin.import_tasks: ../../../tasks/setup.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Prepare Merge Configuration
  vars:
    file: mcfg_sanity_merge
    vrf_conf: "{{ nd_vrf_mcfg_sanity_merge_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Prepare Replace Configuration
  vars:
    file: mcfg_sanity_replace
    vrf_conf: "{{ nd_vrf_mcfg_sanity_replace_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Prepare Override Configuration
  vars:
    file: mcfg_sanity_override
    vrf_conf: "{{ nd_vrf_mcfg_sanity_override_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity - Prepare Delete Configuration
  vars:
    file: mcfg_sanity_delete
    vrf_conf: "{{ nd_vrf_mcfg_sanity_delete_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC1 - Merged
  cisco.nd.nd_vrf: &mcfg_sanity_merge
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: merged
    config: "{{ nd_vrf_mcfg_sanity_merge_conf }}"
    output_level: debug
  register: mcfg_sanity_merged
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC1 - Gather Parent After Merged
  cisco.nd.nd_vrf:
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: gathered
    config: []
  register: mcfg_sanity_parent_gathered
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC1 - Validate Parent Merged
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_sanity_parent_gathered }}"
    test_data: "{{ nd_vrf_mcfg_sanity_merge_conf }}"
    changed: "{{ mcfg_sanity_merged.changed }}"
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC1 - Merged Idempotence
  cisco.nd.nd_vrf: *mcfg_sanity_merge
  register: mcfg_sanity_merged_idempotent
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC1 - Assert Merged Idempotence
  ansible.builtin.assert:
    that:
      - mcfg_sanity_merged_idempotent.changed == false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC2 - Replaced
  cisco.nd.nd_vrf: &mcfg_sanity_replace
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: replaced
    config: "{{ nd_vrf_mcfg_sanity_replace_conf }}"
    output_level: debug
  register: mcfg_sanity_replaced
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC2 - Gather Parent After Replaced
  cisco.nd.nd_vrf:
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: gathered
    config: []
  register: mcfg_sanity_replaced_gathered
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC2 - Validate Replaced
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_sanity_replaced_gathered }}"
    test_data: "{{ nd_vrf_mcfg_sanity_replace_conf }}"
    changed: "{{ mcfg_sanity_replaced.changed }}"
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC2 - Replaced Idempotence
  cisco.nd.nd_vrf: *mcfg_sanity_replace
  register: mcfg_sanity_replaced_idempotent
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC2 - Assert Replaced Idempotence
  ansible.builtin.assert:
    that:
      - mcfg_sanity_replaced_idempotent.changed == false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Overridden
  cisco.nd.nd_vrf: &mcfg_sanity_override
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: overridden
    config: "{{ nd_vrf_mcfg_sanity_override_conf }}"
    output_level: debug
  register: mcfg_sanity_overridden
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Gather Parent After Overridden
  cisco.nd.nd_vrf:
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: gathered
    config: []
  register: mcfg_sanity_overridden_gathered
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Validate Override Created VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_sanity_overridden_gathered }}"
    test_data: "{{ nd_vrf_mcfg_sanity_override_conf }}"
    changed: "{{ mcfg_sanity_overridden.changed }}"
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Validate Override Removed Old VRFs
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ mcfg_sanity_overridden_gathered }}"
    test_data:
      - vrf_name: ansible-nd-vrf-mcfg-sanity-a
      - vrf_name: ansible-nd-vrf-mcfg-sanity-b
    present: false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Overridden Idempotence
  cisco.nd.nd_vrf: *mcfg_sanity_override
  register: mcfg_sanity_overridden_idempotent
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC3 - Assert Overridden Idempotence
  ansible.builtin.assert:
    that:
      - mcfg_sanity_overridden_idempotent.changed == false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC4 - Deleted
  cisco.nd.nd_vrf: &mcfg_sanity_delete
    fabric: "{{ nd_vrf_mcfg_parent_fabric }}"
    state: deleted
    config: "{{ nd_vrf_mcfg_sanity_delete_conf }}"
    output_level: debug
  register: mcfg_sanity_deleted
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC4 - Assert Deleted Ignores Child Tasks
  ansible.builtin.assert:
    that:
      - mcfg_sanity_deleted.changed == true
      - mcfg_sanity_deleted.fabric_type == "multicluster_parent"
      - mcfg_sanity_deleted.child_fabrics is not defined
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC4 - Deleted Idempotence
  cisco.nd.nd_vrf: *mcfg_sanity_delete
  register: mcfg_sanity_deleted_idempotent
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC4 - Assert Deleted Idempotence
  ansible.builtin.assert:
    that:
      - mcfg_sanity_deleted_idempotent.changed == false
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC5 - Reject Write Operation on Child Fabric
  cisco.nd.nd_vrf:
    fabric: "{{ nd_vrf_mcfg_child_fabric }}"
    state: merged
    config:
      - vrf_name: ansible-mcfg-sanity-child
        vrf_id: "{{ nd_vrf_base_id + 63 }}"
  register: mcfg_child_write_result
  ignore_errors: true
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity

- name: MCFG Sanity TC5 - Assert Child Write Rejection
  ansible.builtin.assert:
    that:
      - mcfg_child_write_result.failed == true
      - "'Only state=' in mcfg_child_write_result.msg"
      - "'gathered' in mcfg_child_write_result.msg"
  when: nd_vrf_run_mcfg | bool
  tags:
    - mcfg
    - sanity
