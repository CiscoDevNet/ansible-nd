---
- name: Test Entry Point - [nd_manage_vrfs - msd - merged]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MSD Merged Tests - [nd_manage_vrfs]                    +"
      - "----------------------------------------------------------------"
  tags:
    - msd
    - merged

- name: MSD Merged - Build Parent and Child Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_msd_parent_fabric }}"
    target_vrf_names:
      - ansible-msd-merged
      - ansible-msd-merged-l3vni
      - ansible-msd-merged-parent
    nd_vrf_msd_attach_block: >-
      {{
        [
          {
            'ip_address': nd_vrf_msd_switch,
            'attachment_options': {
              'loopback_id': 102,
              'loopback_ipv4_address': '10.255.102.1',
              'loopback_ipv6_address': '2001:db8:102::1'
            }
          }
        ] if nd_vrf_msd_switch | length > 0 else []
      }}
  delegate_to: localhost
  tags:
    - msd
    - merged

- name: MSD Merged - Build Parent and Child VRF Config
  ansible.builtin.set_fact:
    nd_vrf_msd_merged_config:
      - vrf_name: ansible-msd-merged
        vrf_id: "{{ nd_vrf_base_id + 20 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 20 }}"
        vrf_vlan_name: ansible_nd_vrf_msd_merged_vlan
        vrf_intf_desc: Ansible ND VRF MSD merged parent SVI
        vrf_description: Ansible ND VRF MSD merged integration test
        loopback_route_tag: 12345
        redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
        v6_redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
        ipv6_linklocal_enable: true
        disable_rt_auto: true
        trm_enable: false
        netflow_enable: false
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        max_bgp_paths: 2
        max_ibgp_paths: 2
        import_vpn_rt:
          - "65000:50020"
        export_vpn_rt:
          - "65000:50020"
        import_evpn_rt:
          - "65000:50020"
        export_evpn_rt:
          - "65000:50020"
        attach: "{{ nd_vrf_msd_attach_block }}"
        deploy: "{{ nd_vrf_msd_attach_block | length > 0 }}"
        deploy_type: vrf
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            l3vni_wo_vlan: false
            adv_host_routes: true
            adv_default_routes: false
            static_default_route: false
            bgp_password: abcdef12
            bgp_passwd_encrypt: 3
            trm_enable: false
            netflow_enable: false
      - vrf_name: ansible-msd-merged-l3vni
        vrf_id: "{{ nd_vrf_base_id + 27 }}"
        l3vni_wo_vlan: true
        vrf_description: Ansible ND VRF MSD merged L3VNI without VLAN
        loopback_route_tag: 12347
        max_bgp_paths: 1
        max_ibgp_paths: 2
        ipv6_linklocal_enable: true
        disable_rt_auto: false
        import_vpn_rt:
          - "65000:50027"
        export_vpn_rt:
          - "65000:50027"
        import_evpn_rt:
          - "65000:50027"
        export_evpn_rt:
          - "65000:50027"
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
        trm_enable: false
        netflow_enable: false
        deploy: false
        child_fabric_config:
          - fabric: "{{ nd_vrf_msd_child_fabric }}"
            l3vni_wo_vlan: true
            adv_host_routes: false
            adv_default_routes: true
            static_default_route: true
      - vrf_name: ansible-msd-merged-parent
        vrf_id: "{{ nd_vrf_base_id + 28 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 28 }}"
        vrf_description: Ansible ND VRF MSD merged parent-only integration test
        loopback_route_tag: 12350
        redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
        v6_redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
        max_bgp_paths: 3
        max_ibgp_paths: 3
        ipv6_linklocal_enable: true
        disable_rt_auto: false
        adv_host_routes: true
        adv_default_routes: true
        static_default_route: true
        deploy: false
  delegate_to: localhost
  tags:
    - msd
    - merged

- name: MSD Merged - Import Setup
  ansible.builtin.import_tasks: ../../../tasks/setup.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged - Prepare Configuration
  vars:
    file: msd_merged
    vrf_conf: "{{ nd_vrf_msd_merged_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Merge Parent and Child VRF
  cisco.nd.nd_manage_vrfs: &msd_merged_conf
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: merged
    config: "{{ nd_vrf_msd_merged_conf }}"
    output_level: debug
  register: msd_merged_result
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Assert Structured Result
  ansible.builtin.assert:
    that:
      - msd_merged_result.changed == true
      - msd_merged_result.fabric_type == "multisite_parent"
      - msd_merged_result.workflow == "Multisite Parent with Child Fabric Processing"
      - msd_merged_result.parent_fabric.fabric_type == "multisite_parent"
      - msd_merged_result.child_fabrics | length == 1
      - msd_merged_result.child_fabrics[0].fabric == nd_vrf_msd_child_fabric
      - msd_merged_result.child_fabrics[0].fabric_type == "multisite_child"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Gather Parent VRFs
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_parent_fabric }}"
    state: gathered
    config: []
  register: msd_parent_gathered
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Validate Parent VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_parent_gathered }}"
    test_data: "{{ nd_vrf_msd_merged_conf }}"
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Gather Child VRFs
  cisco.nd.nd_manage_vrfs:
    fabric: "{{ nd_vrf_msd_child_fabric }}"
    state: gathered
    config: []
  register: msd_child_gathered
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Validate Child VRF
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_child_gathered }}"
    test_data:
      - vrf_name: ansible-msd-merged
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
      - vrf_name: ansible-msd-merged-l3vni
        l3vni_wo_vlan: true
        adv_host_routes: false
        adv_default_routes: true
        static_default_route: true
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Validate Parent-Only VRF On Child
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ msd_child_gathered }}"
    test_data:
      - vrf_name: ansible-msd-merged-parent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC2 - Idempotence
  cisco.nd.nd_manage_vrfs: *msd_merged_conf
  register: msd_merged_idempotent
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC2 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - msd_merged_idempotent.changed == false
  when: nd_vrf_run_msd | bool
  tags:
    - msd
    - merged
