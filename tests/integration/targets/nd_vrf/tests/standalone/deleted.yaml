---
- name: Test Entry Point - [nd_vrf - deleted]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing Deleted Tests - [nd_vrf]                        +"
      - "----------------------------------------------------------------"
  tags: deleted

- name: Deleted - Build Standalone Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_standalone_fabric }}"
    target_vrf_names:
      - ansible-nd-vrf-deleted
      - ansible-nd-vrf-deleted-extra
    nd_vrf_delete_config:
      - vrf_name: ansible-nd-vrf-deleted
        vrf_id: "{{ nd_vrf_base_id + 3 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 3 }}"
        vrf_description: Ansible ND VRF deleted test
        adv_host_routes: true
        adv_default_routes: false
        static_default_route: false
        deploy: false
      - vrf_name: ansible-nd-vrf-deleted-extra
        vrf_id: "{{ nd_vrf_base_id + 13 }}"
        vlan_id: "{{ nd_vrf_base_vlan + 13 }}"
        vrf_description: Ansible ND VRF deleted extra test
        max_bgp_paths: 2
        max_ibgp_paths: 2
        ipv6_linklocal_enable: true
        deploy: false
    nd_vrf_delete_request:
      - vrf_name: ansible-nd-vrf-deleted
      - vrf_name: ansible-nd-vrf-deleted-extra
  delegate_to: localhost
  tags: deleted

- name: Deleted - Import Setup
  ansible.builtin.import_tasks: ../../../tasks/setup.yaml
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted - Prepare Seed Configuration
  vars:
    file: standalone_delete_seed
    vrf_conf: "{{ nd_vrf_delete_config }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted - Prepare Delete Configuration
  vars:
    file: standalone_delete
    vrf_conf: "{{ nd_vrf_delete_request }}"
  ansible.builtin.import_tasks: ../../../tasks/conf_prep_tasks.yaml
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC1 - Create VRF
  cisco.nd.nd_vrf:
    fabric: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_vrf_standalone_delete_seed_conf }}"
  register: delete_base_result
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Delete VRF
  cisco.nd.nd_vrf: &delete_conf
    fabric: "{{ target_fabric }}"
    state: deleted
    config: "{{ nd_vrf_standalone_delete_conf }}"
    output_level: debug
  register: delete_result
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Assert Changed
  ansible.builtin.assert:
    that:
      - delete_result.changed == true
      - delete_result.fabric_type == "standalone"
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Gather VRFs
  cisco.nd.nd_vrf:
    fabric: "{{ target_fabric }}"
    state: gathered
    config: []
  register: gathered_result
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Validate VRF Removed
  cisco.nd.tests.integration._nd_vrf_validate:
    nd_data: "{{ gathered_result }}"
    test_data: "{{ nd_vrf_standalone_delete_seed_conf }}"
    present: false
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC3 - Idempotence
  cisco.nd.nd_vrf: *delete_conf
  register: delete_idempotent
  when: nd_vrf_run_standalone | bool
  tags: deleted

- name: Deleted TC3 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - delete_idempotent.changed == false
  when: nd_vrf_run_standalone | bool
  tags: deleted
