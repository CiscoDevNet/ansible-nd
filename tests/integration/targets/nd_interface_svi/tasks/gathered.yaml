---
# Gathered state tests for nd_interface_svi
# Copyright: (c) 2026, Deeksha Pandey (@deekpand)
#
# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# These tests run after merged.yaml, which creates the SVI test
# interfaces defined in vars/main.yaml.

- name: "GATHERED: Gather all managed SVI interfaces"
  cisco.nd.nd_interface_svi:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
  register: nm_gathered_all

- name: "GATHERED: Verify read-only gather-all output"
  ansible.builtin.assert:
    that:
      - nm_gathered_all is not changed
      - nm_gathered_all.gathered is defined
      - nm_gathered_all.gathered | type_debug == "list"
      - nm_gathered_all.gathered | length > 0
      - nm_gathered_all.before == []
      - nm_gathered_all.after == []
      - nm_gathered_all.diff is not defined
      - nm_gathered_all.proposed is not defined

- name: "GATHERED: Select the known vlan333 test SVI"
  ansible.builtin.set_fact:
    gathered_vlan333: >-
      {{
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan333'
          )
        | list
      }}

- name: "GATHERED: Verify known test SVIs were gathered"
  ansible.builtin.assert:
    that:
      - gathered_vlan333 | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan334'
          )
        | list
        | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan335'
          )
        | list
        | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan336'
          )
        | list
        | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan337'
          )
        | list
        | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr(
            'interface_name',
            'equalto',
            'vlan338'
          )
        | list
        | length == 1

- name: "GATHERED: Verify gathered vlan333 policy values"
  ansible.builtin.assert:
    that:
      - >-
        gathered_vlan333[0].config_data.network_os.policy.description
        == "Updated vlan333 description"
      - >-
        gathered_vlan333[0].config_data.network_os.policy.ip
        == "10.99.99.2"
      - gathered_vlan333[0].config_data.network_os.policy.prefix == 24
      - >-
        gathered_vlan333[0].config_data.network_os.policy.admin_state
        == true
      - >-
        gathered_vlan333[0].config_data.network_os.policy.ip_redirects
        == false
      - >-
        gathered_vlan333[0].config_data.network_os.policy.pim_sparse
        == true
      - >-
        gathered_vlan333[0].config_data.network_os.policy.pim_dr_priority
        == 50
      - >-
        gathered_vlan333[0].config_data.network_os.policy.advertise_subnet_in_underlay
        == true
      - >-
        gathered_vlan333[0].config_data.network_os.policy.netflow
        == false

- name: "GATHERED: Verify every item has its composite identifier"
  ansible.builtin.assert:
    that:
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'defined')
        | list
        | length == nm_gathered_all.gathered | length
      - >-
        nm_gathered_all.gathered
        | selectattr('interface_name', 'defined')
        | list
        | length == nm_gathered_all.gathered | length

- name: "GATHERED: Gather all with explicit empty config"
  cisco.nd.nd_interface_svi:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: []
    state: gathered
  register: nm_gathered_empty_config

- name: "GATHERED: Verify empty config is equivalent to omitted config"
  ansible.builtin.assert:
    that:
      - nm_gathered_empty_config is not changed
      - nm_gathered_empty_config.gathered == nm_gathered_all.gathered

- name: "GATHERED: Gather all in check mode"
  cisco.nd.nd_interface_svi:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
  check_mode: true
  register: cm_gathered_all

- name: "GATHERED: Verify check mode is identical and read-only"
  ansible.builtin.assert:
    that:
      - cm_gathered_all is not changed
      - cm_gathered_all.gathered == nm_gathered_all.gathered

- name: "GATHERED: Reuse gathered vlan333 as merged config in check mode"
  cisco.nd.nd_interface_svi:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: "{{ gathered_vlan333 }}"
    state: merged
  check_mode: true
  register: cm_reuse_gathered

- name: "GATHERED: Verify gathered output is reusable"
  ansible.builtin.assert:
    that:
      - cm_reuse_gathered is not changed

- name: "GATHERED: Reject nonempty config because filtering is unsupported"
  cisco.nd.nd_interface_svi:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: vlan333
    state: gathered
  register: nm_gathered_with_config
  ignore_errors: true

- name: "GATHERED: Verify nonempty config is rejected"
  ansible.builtin.assert:
    that:
      - nm_gathered_with_config is failed
      - >-
        'currently supports gather-all only'
        in nm_gathered_with_config.msg
