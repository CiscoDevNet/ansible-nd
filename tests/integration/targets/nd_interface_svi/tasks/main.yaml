---
# Test code for the nd_interface_svi module
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# --- Usage ---
#
# Run the test suite with ansible-test:
#   ansible-test integration nd_interface_svi
#
# --- Optional IOS-XE testbed configuration (issue #540) ---
#
#   nd_test_xe_fabric_name=<Catalyst fabric, defaults to nd_test_fabric_name>
#   nd_test_xe_switch_ip=<Catalyst leaf switch IP; unset skips xe.yaml>
#
# VLAN IDs 980-983 on that switch must be free of SVIs at the start of the run.
#
# --- Optional test variables ---
#
# Set the variables below in the [nd:vars] section of tests/integration/inventory.networking
#
# nd_logging_config (str, default: "")
#   Path to a JSON file conforming to logging.config.dictConfig (see
#   plugins/module_utils/common/log.py for an example). When set, the path is
#   forwarded to the module subprocess via the ND_LOGGING_CONFIG environment
#   variable, enabling file-based logging from the nd collection. Empty (the
#   default) disables logging. ansible-test strips the controller's shell env,
#   so the variable cannot be inherited from the user's shell. Add to
#   inventory.networking [nd:vars]:
#     nd_logging_config=/absolute/path/to/logging_config.json

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'
  tags:
    - always

- name: Run nd_interface_svi state tests with optional logging env
  block:
    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run nd_interface_svi merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run nd_interface_svi replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run nd_interface_svi overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run nd_interface_svi deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Run nd_interface_svi HSRP and DHCP-relay tests
      ansible.builtin.include_tasks: hsrp_dhcp.yaml

    - name: Run IOS-XE tests (requires nd_test_xe_switch_ip)
      ansible.builtin.include_tasks: xe.yaml
      when: nd_test_xe_switch_ip is defined and nd_test_xe_switch_ip | length > 0

    - name: Run ND 4.x harness preflight discovery
      ansible.builtin.include_tasks:
        file: nd4x_demo_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_preflight
            - nd4x_demo_merged
            - nd4x_demo_replaced
            - nd4x_demo_overridden
            - nd4x_demo_deleted
            - nd4x_demo_hsrp_dhcp
            - nd4x_demo_negative
            - nd4x_demo_xe
            - nd4x_demo_xe_overridden
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_overridden
        - nd4x_demo_deleted
        - nd4x_demo_hsrp_dhcp
        - nd4x_demo_negative
        - nd4x_demo_xe
        - nd4x_demo_xe_overridden

    - name: Run merged state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_merged.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
      when: nd4x_supported | default(false) | bool

    - name: Run replaced state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_replaced.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_replaced
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_replaced
      when: nd4x_supported | default(false) | bool

    - name: Run overridden state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_overridden.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_overridden
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_overridden
      when: nd4x_supported | default(false) | bool

    - name: Run deleted state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_deleted.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_deleted
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_deleted
      when: nd4x_supported | default(false) | bool

    - name: Run HSRP and DHCP-relay tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_hsrp_dhcp.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_hsrp_dhcp
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_hsrp_dhcp
      when: nd4x_supported | default(false) | bool

    - name: Run IOS-XE harness preflight
      ansible.builtin.include_tasks:
        file: nd4x_demo_xe_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo_xe
            - nd4x_demo_xe_overridden
      tags:
        - never
        - nd4x_demo_xe
        - nd4x_demo_xe_overridden
      when: test_xe_switch_ip | default('') | length > 0

    - name: Run IOS-XE tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_xe.yaml
        apply:
          tags:
            - never
            - nd4x_demo_xe
      tags:
        - never
        - nd4x_demo_xe
      when: nd4x_xe_supported | default(false) | bool

    - name: Run destructive IOS-XE overridden and deleted tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_xe_overridden.yaml
        apply:
          tags:
            - never
            - nd4x_demo_xe_overridden
      tags:
        - never
        - nd4x_demo_xe_overridden
      when: nd4x_xe_supported | default(false) | bool

    - name: Run negative validation tests using the ND 4.x harness target
      ansible.builtin.include_tasks:
        file: nd4x_demo_negative.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_negative
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_negative
      when: nd4x_supported | default(false) | bool
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
  vars:
    ansible_command_timeout: 300
