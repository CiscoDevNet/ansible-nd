---
- name: "ND4X PAGINATION: Read switch page"
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ nd4x_switch_fabric_name }}/switches?max={{
      nd4x_switch_page_size }}&offset={{ nd4x_switch_offset }}
    method: get
  register: nd4x_switch_page_response
  changed_when: false

- name: "ND4X PAGINATION: Validate switch page"
  ansible.builtin.assert:
    that:
      - not nd4x_switch_page_response.failed | default(false) | bool
      - nd4x_switch_page_response.status | int == 200
      - nd4x_switch_page_response.jsondata is mapping
      - nd4x_switch_page_response.jsondata.switches is defined
      - nd4x_switch_page_response.jsondata.switches is sequence
      - nd4x_switch_page_response.jsondata.switches is not string
      - nd4x_switch_page_response.jsondata.switches is not mapping
      - nd4x_switch_page_response.jsondata.switches | length <= nd4x_switch_page_size
    fail_msg: >-
      Switch inventory page {{ nd4x_switch_page_number }} for fabric
      {{ nd4x_switch_fabric_name }} did not return a valid switches collection.

- name: "ND4X PAGINATION: Save the complete switch inventory"
  ansible.builtin.set_fact:
    nd4x_paginated_switch_inventory:
      - status: "{{ nd4x_switch_page_response.status }}"
        failed: false
        current:
          switches: >-
            {{ nd4x_switch_rows + nd4x_switch_page_response.jsondata.switches }}
        jsondata:
          switches: >-
            {{ nd4x_switch_rows + nd4x_switch_page_response.jsondata.switches }}
  when: nd4x_switch_page_response.jsondata.switches | length < nd4x_switch_page_size

- name: "ND4X PAGINATION: Reject an incomplete switch inventory at the page limit"
  ansible.builtin.assert:
    that:
      - false
    fail_msg: >-
      Switch inventory for fabric {{ nd4x_switch_fabric_name }} reached the
      maximum of {{ nd4x_switch_max_pages }} pages without a final short page.
  when:
    - nd4x_switch_page_response.jsondata.switches | length == nd4x_switch_page_size
    - nd4x_switch_page_number | int + 1 >= nd4x_switch_max_pages | int

# This must remain the final task in the file. Each recursive level registers
# the response under the same name; parent frames must not process it after a
# child returns.
- name: "ND4X PAGINATION: Continue to the next switch page"
  ansible.builtin.include_tasks:
    file: nd4x_demo_collect_switch_pages.yaml
  vars:
    nd4x_switch_offset: >-
      {{ nd4x_switch_offset | int + nd4x_switch_page_size | int }}
    nd4x_switch_page_number: >-
      {{ nd4x_switch_page_number | int + 1 }}
    nd4x_switch_rows: >-
      {{ nd4x_switch_rows + nd4x_switch_page_response.jsondata.switches }}
  when:
    - nd4x_switch_page_response.jsondata.switches | length == nd4x_switch_page_size
    - nd4x_switch_page_number | int + 1 < nd4x_switch_max_pages | int
