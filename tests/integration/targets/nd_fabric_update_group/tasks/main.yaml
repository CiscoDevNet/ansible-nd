# --- Usage ---
#
# Run the test suite with ansible-test:
#
#   ansible-test integration nd_fabric_update_group
#
# Override test variables in tests/integration/inventory.networking [nd:vars]:
#   nd_test_fabric_name      - fabric to use (default: SITE1)
#   nd_test_update_switch_a  - serial of first switch in fabric
#   nd_test_update_switch_b  - serial of second switch in fabric
#   nd_test_update_switch_c  - serial of a third switch, disjoint from a and b
#   nd_test_nos_image_name   - NXOS image filename in ND software repo
#   nd_test_epld_image_name  - EPLD image filename in ND software repo

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ nd_output_level | default("debug") }}'

- name: Run nd_fabric_update_group state tests
  block:
    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run gathered state tests
      ansible.builtin.include_tasks: gathered.yaml

    - name: Run replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Run auto-assign (propose) tests
      ansible.builtin.include_tasks: auto_assign.yaml
  vars:
    ansible_command_timeout: 300
