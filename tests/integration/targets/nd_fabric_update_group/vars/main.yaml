---
# Variables for nd_fabric_update_group integration tests.
#
# `update_group_switches` and `installation_order_devices` accept either switch IP addresses
# or switch serial numbers (switchIds). IPs are resolved to switchIds via the fabric
# inventory before being sent on the wire.
#
# A switch may belong to only one update group at a time. Each group below uses a disjoint
# switch set so that creating one group never moves a switch out of another (which on ND 4.2.1
# would leave the drained group in an unreadable zero-switch "ghost" state).
#
# Every group sets force_created: true. On a small fabric, attaching a switch set that covers
# all switches of a role makes ND raise a pre-flight warning and decline the attach; force_created
# acknowledges such warnings so the create applies. (force_created has no effect on settings-only
# updates, which issue no attachGroup call.)
#
# Override the following in your inventory or extra-vars to match a real ND 4.2 testbed:
#   nd_test_fabric_name      - fabric in which to create update groups
#   nd_test_update_switch_a  - IP or serial of the first switch in the fabric
#   nd_test_update_switch_b  - IP or serial of the second switch in the fabric
#   nd_test_update_switch_c  - IP or serial of a third switch, disjoint from a and b
#   nd_test_nos_image_name   - filename of an NXOS image present on the ND software repository
#   nd_test_epld_image_name  - filename of an EPLD image present on the ND software repository

test_fabric_name: "{{ nd_test_fabric_name | default('SITE1') }}"
test_switch_a: "{{ nd_test_update_switch_a | default('192.168.7.11') }}"
test_switch_b: "{{ nd_test_update_switch_b | default('192.168.7.12') }}"
test_switch_c: "{{ nd_test_update_switch_c | default('192.168.7.13') }}"
test_nos_image_name: "{{ nd_test_nos_image_name | default('nxos.9.3.13.bin') }}"
test_epld_image_name: "{{ nd_test_epld_image_name | default('n9000-epld.9.3.13.img') }}"

# Update group configs used across tests.
update_group_leaf:
  update_group_name: ansible_leaf_group
  execution: serial
  contingency: continue
  analysis: snapshot
  is_maintenance: true
  is_disruptive_update: false
  update_group_switches:
    - "{{ test_switch_a }}"
    - "{{ test_switch_b }}"
  force_created: true
  installation_order_devices:
    - "{{ test_switch_a }}"
    - "{{ test_switch_b }}"
  report_selection: basic
  reports: noReport

update_group_leaf_updated:
  update_group_name: ansible_leaf_group
  execution: parallel
  contingency: pause
  analysis: snapshot
  is_maintenance: true
  is_disruptive_update: false
  update_group_switches:
    - "{{ test_switch_a }}"
    - "{{ test_switch_b }}"
  force_created: true
  installation_order_devices:
    - "{{ test_switch_a }}"
    - "{{ test_switch_b }}"
  report_selection: advanced
  reports: noReport

# Disjoint from update_group_leaf (uses switch_c only).
update_group_spine:
  update_group_name: ansible_spine_group
  execution: parallel
  contingency: continue
  analysis: noAnalysis
  is_maintenance: false
  is_disruptive_update: false
  update_group_switches:
    - "{{ test_switch_c }}"
  force_created: true
  report_selection: noReport
  reports: noReport
