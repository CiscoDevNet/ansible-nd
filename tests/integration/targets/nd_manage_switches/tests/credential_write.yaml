---
- name: Test Entry Point - [nd_manage_switches - credential write]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+ Executing use_credential_for_write coverage                  +"
      - "----------------------------------------------------------------"
  tags: credential_write

- name: Credential write - Prepare the shared switch test context
  ansible.builtin.import_tasks: ../../tasks/base_tasks.yaml
  tags: credential_write

- name: Credential write - Prepare a cross-release normal-add request
  ansible.builtin.set_fact:
    switch_conf:
      - seed_ip: "{{ test_data.sw1 }}"
        auth_proto: MD5
        role: leaf
        use_credential_for_write: true
  delegate_to: localhost
  tags: credential_write

- name: Credential write - Render the request
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  vars:
    file: credential_write
  tags: credential_write

- name: Credential write - Create the switch with write-credential selection
  cisco.nd.nd_manage_switches:
    fabric: "{{ test_data.test_fabric }}"
    state: merged
    config: "{{ nd_switches_credential_write_conf }}"
    config_actions: "{{ test_data.config_actions }}"
  register: credential_write_create
  tags: credential_write

- name: Credential write - Verify the first request changed state
  ansible.builtin.assert:
    that:
      - credential_write_create.failed | default(false) | bool == false
      - credential_write_create.changed | bool
  tags: credential_write

- name: Credential write - Repeat the identical request
  cisco.nd.nd_manage_switches:
    fabric: "{{ test_data.test_fabric }}"
    state: merged
    config: "{{ nd_switches_credential_write_conf }}"
    config_actions: "{{ test_data.config_actions }}"
  register: credential_write_repeat
  tags: credential_write

- name: Credential write - Verify repeat idempotence
  ansible.builtin.assert:
    that:
      - credential_write_repeat.failed | default(false) | bool == false
      - not credential_write_repeat.changed | bool
  tags: credential_write

- name: Credential write - Clean up the test switch
  cisco.nd.nd_manage_switches:
    fabric: "{{ test_data.test_fabric }}"
    state: deleted
  register: credential_write_cleanup
  tags: credential_write

- name: Credential write - Verify cleanup succeeded
  ansible.builtin.assert:
    that:
      - credential_write_cleanup.failed | default(false) | bool == false
  tags: credential_write
