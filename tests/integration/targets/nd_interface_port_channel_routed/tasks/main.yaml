#
# --- Usage ---
#
# Run the test suite with ansible-test:
#
#   ansible-test network-integration nd_interface_port_channel_routed
#
# --- Required testbed configuration ---
#
# In tests/integration/inventory.networking [nd:vars]:
#
#   nd_test_fabric_name=<your fabric>
#   nd_test_switch_ip=<NX-OS switch IP within that fabric>
#   nd_test_pc_member_a=Ethernet1/10
#   nd_test_pc_member_b=Ethernet1/11
#   nd_test_pc_member_c=Ethernet1/12
#   nd_test_pc_member_d=Ethernet1/13
#
# Members must exist on the target switch and must not already be in another
# port-channel. Port-channel IDs 520-523 are reserved for this target.
#
# The overridden scenario is fabric-wide. Routed port-channels that exist outside
# the reserved range are read first and replayed in the overridden config, so they
# are retained (see overridden.yaml).
#
# --- Optional IOS-XE testbed configuration ---
#
#   nd_test_xe_fabric_name=<Catalyst fabric, defaults to nd_test_fabric_name>
#   nd_test_xe_switch_ip=<Catalyst leaf switch IP; unset skips xe.yaml>
#   nd_test_xe_pc_member_a=GigabitEthernet1/0/2
#   nd_test_xe_pc_member_b=GigabitEthernet1/0/3
#   nd_test_xe_pc_member_c=GigabitEthernet1/0/4
#   nd_test_xe_pc_member_trunk=GigabitEthernet1/0/6
#
# --- Optional test variables ---
#
# nd_logging_config (str, default: "")
#   Path to a JSON file conforming to logging.config.dictConfig (see
#   plugins/module_utils/common/log.py for an example).

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info:
      output_level: '{{ api_key_output_level | default("debug") }}'

- name: Run nd_interface_port_channel_routed state tests with optional logging env
  # 300s gives the switch enough time to build the PC bundle, pull members,
  # and apply LACP on slow testbeds (e.g. 9000v) where the default 30s is too
  # short. The native Ansible connection variable is scoped to this block.
  vars:
    ansible_command_timeout: 300
  block:
    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run nd_interface_port_channel_routed merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run nd_interface_port_channel_routed replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run nd_interface_port_channel_routed overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run nd_interface_port_channel_routed deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Run the subinterface-on-routed-port-channel tests
      ansible.builtin.include_tasks: subinterface.yaml

    - name: Run IOS-XE tests (requires nd_test_xe_switch_ip)
      ansible.builtin.include_tasks: xe.yaml
      when: nd_test_xe_switch_ip is defined and nd_test_xe_switch_ip | length > 0
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
