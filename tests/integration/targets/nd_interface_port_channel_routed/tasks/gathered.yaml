---
# Gathered state tests for nd_interface_port_channel_routed
# Copyright: (c) 2026, Deeksha Pandey (@deekpand)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# Pre-condition: merged.yaml has created port-channel520, port-channel521,
# and port-channel522 on test_switch_ip. This module supports gather-all only;
# nonempty config is rejected because gathered filtering is not supported.

# --- GATHERED: no config (fetch everything) ---

- name: "GATHERED: Gather all routed port-channels"
  cisco.nd.nd_interface_port_channel_routed:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
  register: nm_gathered_all

- name: "GATHERED: Verify gather-all output is read-only"
  ansible.builtin.assert:
    that:
      - nm_gathered_all is not changed
      - nm_gathered_all.gathered is defined
      - nm_gathered_all.gathered | type_debug == "list"
      - nm_gathered_all.before == []
      - nm_gathered_all.after == []
      - nm_gathered_all.diff is not defined
      - nm_gathered_all.proposed is not defined

- name: "GATHERED: Select the known port-channel520 test interface"
  ansible.builtin.set_fact:
    gathered_pc_520: >-
      {{
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr('interface_name', 'equalto', 'port-channel520')
        | list
      }}

- name: "GATHERED: Verify known routed port-channels are included"
  ansible.builtin.assert:
    that:
      - gathered_pc_520 | length == 1
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'equalto', test_switch_ip)
        | selectattr('interface_name', 'equalto', 'port-channel521')
        | list
        | length == 1

- name: "GATHERED: Verify port-channel520 policy values"
  ansible.builtin.assert:
    that:
      - gathered_pc_520[0].config_data.network_os.network_os_type == "nx-os"
      - gathered_pc_520[0].config_data.network_os.policy.policy_type == "l3Po"
      - gathered_pc_520[0].config_data.network_os.policy.ip == "10.49.20.1"
      - gathered_pc_520[0].config_data.network_os.policy.prefix == 30
      - gathered_pc_520[0].config_data.network_os.policy.ports == [test_pc_member_a]
      - gathered_pc_520[0].config_data.network_os.policy.port_channel_mode == "active"

- name: "GATHERED: Verify every item has its composite identifier"
  ansible.builtin.assert:
    that:
      - >-
        nm_gathered_all.gathered
        | selectattr('switch_ip', 'defined')
        | list
        | length == nm_gathered_all.gathered | length
      - >-
        nm_gathered_all.gathered
        | selectattr('interface_name', 'defined')
        | list
        | length == nm_gathered_all.gathered | length

# --- GATHERED: explicit empty config ---

- name: "GATHERED: Gather all with explicit empty config"
  cisco.nd.nd_interface_port_channel_routed:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: []
    state: gathered
  register: nm_gathered_empty_config

- name: "GATHERED: Verify empty config is equivalent to omitted config"
  ansible.builtin.assert:
    that:
      - nm_gathered_empty_config is not changed
      - nm_gathered_empty_config.gathered == nm_gathered_all.gathered

# --- GATHERED: check mode ---

- name: "GATHERED: Gather all in check mode"
  cisco.nd.nd_interface_port_channel_routed:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
  check_mode: true
  register: cm_gathered_all

- name: "GATHERED: Verify check mode is identical and read-only"
  ansible.builtin.assert:
    that:
      - cm_gathered_all is not changed
      - cm_gathered_all.gathered == nm_gathered_all.gathered

# --- GATHERED: round-trip ---

- name: "GATHERED: Reuse gathered port-channel520 as merged config in check mode"
  cisco.nd.nd_interface_port_channel_routed:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: "{{ gathered_pc_520 }}"
    state: merged
  check_mode: true
  register: cm_reuse_gathered

- name: "GATHERED: Verify gathered output is reusable"
  ansible.builtin.assert:
    that:
      - cm_reuse_gathered is not changed

# --- GATHERED: unsupported filtering ---

- name: "GATHERED: Reject nonempty config because filtering is unsupported"
  cisco.nd.nd_interface_port_channel_routed:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: port-channel520
    state: gathered
  register: nm_gathered_with_config
  ignore_errors: true

- name: "GATHERED: Verify nonempty config is rejected"
  ansible.builtin.assert:
    that:
      - nm_gathered_with_config is failed
      - "'currently supports gather-all only' in nm_gathered_with_config.msg"
