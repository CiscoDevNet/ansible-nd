---
- name: Associate valid members with every non-port-channel group type
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_interface_group
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
      fabric_name: "{{ test_fabric_name }}"
    module_args:
      config_actions:
        deploy: false
        type: resource
    config: "{{ interface_group_initial_member_config }}"
    check_mode: false
    idempotency: false
    expected:
      apply:
        changed: true
        failed: false
    nd_queries:
      - name: Fetch all Interface Groups after type-specific membership
        path: >-
          /api/v1/manage/fabrics/{{ test_fabric_name
          }}/interfaceGroups?max=10000
        method: get
        expected_status: 200
  register: interface_group_type_members

- name: Validate all initial type-specific member associations
  cisco.nd.tests.integration._nd_interface_group_validate:
    nd_data: "{{ interface_group_type_members.nd_query_results[0].result }}"
    test_data: "{{ interface_group_initial_member_expected }}"
    mode: exact
    scope_prefix: "{{ interface_group_test_prefix }}"
    vpc_peer_switch_ids: "{{ interface_group_vpc_peer_switch_ids }}"
    invariants:
      total_count: "{{ interface_group_all_types | length }}"
      required_types: >-
        {{ interface_group_all_types | map(attribute='type') | list }}
      unique_group_names: true
      unique_members: true
      consistent_counts: true
  when: not ansible_check_mode
