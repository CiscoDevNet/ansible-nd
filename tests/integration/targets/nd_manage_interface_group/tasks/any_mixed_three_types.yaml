---
- name: Reject an any group mixing Ethernet, port-channel, and vPC atomically
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_interface_group
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
      fabric_name: "{{ test_fabric_name }}"
    module_args:
      config_actions:
        deploy: false
        type: resource
    config:
      - "{{ interface_group_any_mixed_three_types }}"
    idempotency: false
    expected:
      check_mode:
        changed: false
        failed: true
      apply:
        changed: false
        failed: true
  register: interface_group_any_mixed_three_types_result

- name: Verify the unsupported mixed group failed before mutation
  ansible.builtin.assert:
    that:
      - >-
        interface_group_any_mixed_three_types_result
        .check_mode_result.before
        ==
        interface_group_any_mixed_three_types_result
        .check_mode_result.after
      - >-
        interface_group_any_mixed_three_types_result
        .first_run_result.before
        ==
        interface_group_any_mixed_three_types_result
        .first_run_result.after
      - >-
        interface_group_any_mixed_three_types_result
        .first_run_result.changed == false
      - >-
        'cannot combine vPC members with Ethernet or port-channel members'
        in interface_group_any_mixed_three_types_result.first_run_result.msg
      - >-
        interface_group_any_mixed_three_types_result
        .first_run_result.api_verbs
        | default([])
        | difference(['GET'])
        | length == 0
    fail_msg: >-
      The unsupported vPC/non-vPC combination was not rejected atomically
      before a controller write.
  when: not ansible_check_mode

- name: Fetch Interface Groups after the mixed-member rejection
  cisco.nd.nd_rest:
    method: GET
    path: >-
      /api/v1/manage/fabrics/{{ test_fabric_name
      }}/interfaceGroups?max=10000
  register: interface_group_any_mixed_three_types_live
  when: not ansible_check_mode

- name: Confirm the rejected mixed group does not exist
  cisco.nd.tests.integration.nd_interface_group_validate:
    nd_data: "{{ interface_group_any_mixed_three_types_live }}"
    absent:
      - "{{ interface_group_names.any_mixed_three_types }}"
  when: not ansible_check_mode
