      - nm_merged_update_fanout is changed

- name: "MERGED UPDATE: Verify fan-out updated values"
  vars:
    eth42_after: "{{ nm_merged_update_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/42') | first }}"
    eth43_after: "{{ nm_merged_update_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/43') | first }}"
  ansible.builtin.assert:
    that:
      - eth42_after.config_data.network_os.policy.allowed_vlans == "250-350"
      - eth42_after.config_data.network_os.policy.native_vlan == 250
      - eth42_after.config_data.network_os.policy.description == "Updated trunk ports description"
      - eth42_after.config_data.network_os.policy.admin_state == false
      - eth43_after.config_data.network_os.policy.allowed_vlans == "250-350"
      - eth43_after.config_data.network_os.policy.native_vlan == 250
      - eth43_after.config_data.network_os.policy.description == "Updated trunk ports description"
      - eth43_after.config_data.network_os.policy.admin_state == false

# --- MERGED CREATE: VLAN MAPPING ---
# Skipped by default because Nexus 9000v virtual switches reject
# `switchport vlan mapping ... dot1q-tunnel ...` ("not supported in the
# current switchport mode"), which surfaces as HTTP 400 from ND on PUT.
# Enable on a hardware-backed testbed by adding to the [nd:vars] section of
# tests/integration/inventory.networking:
#   supports_vlan_mapping=true
# (ansible-test strips the controller's shell env / --extra-vars, so the flag
# must come from inventory vars -- see the header note in tasks/main.yaml.)

- name: "MERGED VLAN-MAPPING block (gated on supports_vlan_mapping)"
  when: supports_vlan_mapping | default(false) | bool
  block:
    - name: "MERGED VLAN-MAPPING: Create Ethernet1/48 with vlan_mapping enabled (check mode)"
      cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth48_vlan_mapping
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ ethernet_48_vlan_mapping }}"
        state: merged
      check_mode: true
      register: cm_merged_vlan_mapping

    - name: "MERGED VLAN-MAPPING: Create Ethernet1/48 with vlan_mapping enabled (normal mode)"
      cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_vlan_mapping
      register: nm_merged_vlan_mapping

    - name: "MERGED VLAN-MAPPING: Verify Ethernet1/48 vlan_mapping creation"
      vars:
        eth48_after: "{{ nm_merged_vlan_mapping.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/48') | first }}"
      ansible.builtin.assert:
        that:
          - cm_merged_vlan_mapping is changed
          - nm_merged_vlan_mapping is changed
          - eth48_after.config_data.network_os.policy.vlan_mapping == true
          - eth48_after.config_data.network_os.policy.vlan_mapping_entries | length == 2

    - name: "MERGED VLAN-MAPPING: Re-apply for idempotency"
      cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_vlan_mapping
      register: nm_merged_vlan_mapping_idem

    - name: "MERGED VLAN-MAPPING: Verify idempotency"
      ansible.builtin.assert:
        that:
          - nm_merged_vlan_mapping_idem is not changed

    # Clean up the VLAN mapping test interface before the fan-out large test
    - name: "CLEANUP: Remove Ethernet1/48 after vlan mapping test"
      cisco.nd.nd_interface_ethernet_trunk_host:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip }}"
            interface_names:
              - Ethernet1/48
        state: deleted

# --- MERGED WITH deploy: false ---

- name: "MERGED NO-DEPLOY: Create Ethernet1/48 with deploy disabled"
  cisco.nd.nd_interface_ethernet_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_names:
          - Ethernet1/48
        config_data:
          network_os:
            policy:
              admin_state: true
              allowed_vlans: "999"
              description: "No-deploy test Ethernet1/48"
    config_actions:
      deploy: false
    state: merged
  register: nm_merged_no_deploy

- name: "DEBUG: Show no-deploy result"
  ansible.builtin.debug:
    var: nm_merged_no_deploy

- name: "MERGED NO-DEPLOY: Verify change was staged"
  ansible.builtin.assert:
    that:
      - nm_merged_no_deploy is changed

# Clean up the no-deploy test interface
- name: "CLEANUP: Remove Ethernet1/48"
  cisco.nd.nd_interface_ethernet_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_names:
          - Ethernet1/48
    state: deleted

# --- MERGED CREATE: LARGE FAN-OUT ---

- name: "MERGED CREATE: Create three interfaces via fan-out (normal mode)"
  cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth45_46_47
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ ethernet_45_46_47 }}"
    state: merged
  register: nm_merged_create_large_fanout

- name: "MERGED CREATE: Verify large fan-out creation"
  ansible.builtin.assert:
    that:
      - nm_merged_create_large_fanout is changed
      - nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/45') | list | length == 1
      - nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/46') | list | length == 1
      - nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/47') | list | length == 1

- name: "MERGED CREATE: Verify all three fan-out interfaces have the same config"
  vars:
    eth45_after: "{{ nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/45') | first }}"
    eth46_after: "{{ nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/46') | first }}"
    eth47_after: "{{ nm_merged_create_large_fanout.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/47') | first }}"
  ansible.builtin.assert:
    that:
      - eth45_after.config_data.network_os.policy.allowed_vlans == "400-500"
      - eth45_after.config_data.network_os.policy.description == "Fan-out test trunk ports"
      - eth46_after.config_data.network_os.policy.allowed_vlans == "400-500"
      - eth46_after.config_data.network_os.policy.description == "Fan-out test trunk ports"
      - eth47_after.config_data.network_os.policy.allowed_vlans == "400-500"
      - eth47_after.config_data.network_os.policy.description == "Fan-out test trunk ports"

- name: "MERGED IDEMPOTENT: Re-apply large fan-out"
  cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth45_46_47
  register: nm_merged_idem_large_fanout

- name: "MERGED IDEMPOTENT: Verify large fan-out idempotency"
  ansible.builtin.assert:
    that:
      - nm_merged_idem_large_fanout is not changed

# --- MERGED STORM-CONTROL READ-BACK (PR #265 validator coverage) ---
# Creates an interface with a single storm-control level (percentage variant only),
# then re-applies the same config. The re-apply forces from_response() to parse the
# storm-control field on the GET. If ND echoed both the percentage and PPS variant
# for the class, the new mutual-exclusion validator would raise during from_response
# and this re-apply would error -- so a clean "not changed" proves both that the GET
# shape is accepted and that the field round-trips idempotently.

- name: "MERGED STORM-CONTROL: Create Ethernet1/48 with a broadcast storm-control level"
  cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth48_storm
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ ethernet_48_storm_control }}"
    state: merged
  register: nm_merged_storm_create

- name: "DEBUG: Show storm-control create read-back (after-state)"
  ansible.builtin.debug:
    var: nm_merged_storm_create.after

- name: "MERGED STORM-CONTROL: Verify create reported the new interface"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_create is changed
      - nm_merged_storm_create.after | selectattr('switch_ip', 'equalto', test_switch_ip) | selectattr('interface_name', 'equalto', 'Ethernet1/48') | list | length == 1

- name: "MERGED STORM-CONTROL: Re-apply to exercise from_response on the storm-control GET"
  cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_storm
  register: nm_merged_storm_idem

- name: "MERGED STORM-CONTROL: Verify no change on read-back (GET shape accepted, field round-trips)"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_idem is not changed

# --- MERGED STORM-CONTROL LIFECYCLE (PR #360 review) ---
# Percentage and pps are two representations of one NX-OS threshold. state:merged must
# treat each pair as one logical setting: explicitly selecting one variant clears an
# existing counterpart (reported as a change), and the follow-up idempotency re-apply
# proves the counterpart was actually cleared on the wire -- if ND still echoed it, the
# re-apply would classify the merge as a change and fail the "not changed" assert.

- name: "MERGED STORM-CONTROL PCT->PPS: Switch broadcast storm control from percentage to pps"
  cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth48_storm_pps
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ ethernet_48_storm_control_pps }}"
    state: merged
  register: nm_merged_storm_pct_to_pps

- name: "MERGED STORM-CONTROL PCT->PPS: Extract Ethernet1/48 after-state"
  ansible.builtin.set_fact:
    eth48_pps_after: >-
      {{ nm_merged_storm_pct_to_pps.after | selectattr('switch_ip', 'equalto', test_switch_ip)
         | selectattr('interface_name', 'equalto', 'Ethernet1/48') | first }}

- name: "MERGED STORM-CONTROL PCT->PPS: Verify change reported, pps set, percentage cleared"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_pct_to_pps is changed
      - eth48_pps_after.config_data.network_os.policy.storm_control_broadcast_level_pps == 1000
      - "'storm_control_broadcast_level' not in eth48_pps_after.config_data.network_os.policy"

- name: "MERGED STORM-CONTROL PCT->PPS: Re-apply pps intent (proves ND cleared the percentage)"
  cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_storm_pps
  register: nm_merged_storm_pps_idem

- name: "MERGED STORM-CONTROL PCT->PPS: Verify idempotency"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_pps_idem is not changed

- name: "MERGED STORM-CONTROL PPS->PCT: Switch broadcast storm control back to percentage"
  cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth48_storm_pct_back
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ ethernet_48_storm_control_pct_switch_back }}"
    state: merged
  register: nm_merged_storm_pps_to_pct

- name: "MERGED STORM-CONTROL PPS->PCT: Extract Ethernet1/48 after-state"
  ansible.builtin.set_fact:
    eth48_pct_after: >-
      {{ nm_merged_storm_pps_to_pct.after | selectattr('switch_ip', 'equalto', test_switch_ip)
         | selectattr('interface_name', 'equalto', 'Ethernet1/48') | first }}

- name: "MERGED STORM-CONTROL PPS->PCT: Verify change reported, percentage set, pps cleared"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_pps_to_pct is changed
      - eth48_pct_after.config_data.network_os.policy.storm_control_broadcast_level == 42.5
      - "'storm_control_broadcast_level_pps' not in eth48_pct_after.config_data.network_os.policy"

- name: "MERGED STORM-CONTROL PPS->PCT: Re-apply percentage intent (proves ND cleared the pps)"
  cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_storm_pct_back
  register: nm_merged_storm_pct_idem

- name: "MERGED STORM-CONTROL PPS->PCT: Verify idempotency"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_pct_idem is not changed

# --- MERGED STORM-CONTROL DUAL-STATE REMEDIATION (issue #351 / PR #360 review) ---
# Seed the exact controller state from issue #351 (both variants set for one class) via
# raw nd_rest intent -- the module refuses to create it -- then verify the module can
# read it, classifies matching single-variant intent as a change (the one-way subset
# comparison alone would report no_diff), and remediates by clearing the percentage.

- name: "MERGED STORM-CONTROL DUAL: Resolve test switch serial number"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches"
    method: get
  register: sc360_switches

- name: "MERGED STORM-CONTROL DUAL: Extract switch id for {{ test_switch_ip }}"
  ansible.builtin.set_fact:
    sc360_switch_id: >-
      {{ (sc360_switches.current.switches | selectattr('fabricManagementIp', 'equalto', test_switch_ip)
         | first).switchId }}

# The PUT body must carry a switchId matching the path segment -- ND rejects the request with
# 400 "Invalid switch ID" otherwise (the module's update path injects it the same way). The id is
# resolved at runtime from test_switch_ip above; never hardcode it (9000v serials change on reload).
- name: "MERGED STORM-CONTROL DUAL: Seed dual-valued broadcast storm-control intent via raw PUT"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ sc360_switch_id }}/interfaces/Ethernet1%2F48"
    method: put
    content: "{{ ethernet_48_dual_seed_payload | combine({'switchId': sc360_switch_id}) }}"
  register: sc360_dual_seed

- name: "MERGED STORM-CONTROL DUAL: Read back seeded intent"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ sc360_switch_id }}/interfaces/Ethernet1%2F48"
    method: get
  register: sc360_dual_readback

- name: "MERGED STORM-CONTROL DUAL: Verify ND accepted and echoes both variants (issue #351 behavior)"
  ansible.builtin.assert:
    that:
      - sc360_dual_readback.current.configData.networkOS.policy.stormControlBroadcastLevel == 50.0
      - sc360_dual_readback.current.configData.networkOS.policy.stormControlBroadcastLevelPps == 12345

- name: "MERGED STORM-CONTROL DUAL: Apply pps intent matching the value ND already echoes"
  cisco.nd.nd_interface_ethernet_trunk_host: &merge_eth48_storm_remediate
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ ethernet_48_storm_control_pps_remediate }}"
    state: merged
  register: nm_merged_storm_remediate

- name: "MERGED STORM-CONTROL DUAL: Extract Ethernet1/48 after-state"
  ansible.builtin.set_fact:
    eth48_remediate_after: >-
      {{ nm_merged_storm_remediate.after | selectattr('switch_ip', 'equalto', test_switch_ip)
         | selectattr('interface_name', 'equalto', 'Ethernet1/48') | first }}

- name: "MERGED STORM-CONTROL DUAL: Verify matching pps intent is a change and the percentage is cleared"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_remediate is changed
      - eth48_remediate_after.config_data.network_os.policy.storm_control_broadcast_level_pps == 12345
      - "'storm_control_broadcast_level' not in eth48_remediate_after.config_data.network_os.policy"

- name: "MERGED STORM-CONTROL DUAL: Re-apply pps intent (remediated state is stable)"
  cisco.nd.nd_interface_ethernet_trunk_host: *merge_eth48_storm_remediate
  register: nm_merged_storm_remediate_idem

- name: "MERGED STORM-CONTROL DUAL: Verify idempotency after remediation"
  ansible.builtin.assert:
    that:
      - nm_merged_storm_remediate_idem is not changed

# Clean up the storm-control test interface
- name: "CLEANUP: Remove Ethernet1/48 (storm-control)"
  cisco.nd.nd_interface_ethernet_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_names:
          - Ethernet1/48
    state: deleted
