---
# Test code for the nd_interface_ethernet_trunk_host module
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# --- Usage ---
#
# Run the test suite with ansible-test:
#   ansible-test network-integration nd_interface_ethernet_trunk_host
#
# --- Optional test variables ---
#
# Set the variables below in the [nd:vars] section of tests/integration/inventory.networking
#
# TODO: Modify the above (and below) if the team decides to use tests/integration/integration_config.yml instead.
#
# supports_vlan_mapping (bool, default: false)
#   Enables the VLAN-mapping / dot1q-tunnel test workflow in
#   nd4x_demo_vlan_mapping.yaml. Skipped by
#   default because Nexus 9000v virtual switches reject
#   `switchport vlan mapping ... dot1q-tunnel ...` (ND returns HTTP 400).
#   On a hardware-backed testbed, add to inventory.networking [nd:vars]:
#     supports_vlan_mapping=true
#
# nd_logging_config (str, default: "")
#   Path to a JSON file conforming to logging.config.dictConfig (see
#   plugins/module_utils/common/log.py for an example). When set, the path is
#   forwarded to the module subprocess via the ND_LOGGING_CONFIG environment
#   variable, enabling file-based logging from the nd collection. Empty (the
#   default) disables logging. ansible-test strips the controller's shell env,
#   so the variable cannot be inherited from the user's shell. Add to
#   inventory.networking [nd:vars]:
#     nd_logging_config=/absolute/path/to/logging_config.json

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'
  tags:
    - always

- name: Run nd_interface_ethernet_trunk_host state tests with optional logging env
  vars:
    ansible_command_timeout: 300
  block:
    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run nd_interface_ethernet_trunk_host merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run nd_interface_ethernet_trunk_host replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run nd_interface_ethernet_trunk_host overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run nd_interface_ethernet_trunk_host deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Run ND 4.x trunk-host harness preflight
      ansible.builtin.include_tasks:
        file: nd4x_demo_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
            - nd4x_demo_replaced
            - nd4x_demo_deleted
            - nd4x_demo_overridden
            - nd4x_demo_destructive
            - nd4x_demo_negative
            - nd4x_demo_vlan_mapping
            - nd4x_demo_storm_control
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted
        - nd4x_demo_overridden
        - nd4x_demo_destructive
        - nd4x_demo_negative
        - nd4x_demo_vlan_mapping
        - nd4x_demo_storm_control

    - name: Run trunk-host merged harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_merged.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_merged]
      tags: [never, nd4x_demo, nd4x_demo_merged]
      when: nd4x_supported | default(false) | bool

    - name: Run trunk-host replaced harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_replaced.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_replaced]
      tags: [never, nd4x_demo, nd4x_demo_replaced]
      when: nd4x_supported | default(false) | bool

    - name: Run trunk-host deleted harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_deleted.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_deleted]
      tags: [never, nd4x_demo, nd4x_demo_deleted]
      when: nd4x_supported | default(false) | bool

    - name: Run trunk-host negative harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_negative.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_negative]
      tags: [never, nd4x_demo, nd4x_demo_negative]
      when: nd4x_supported | default(false) | bool

    - name: Run trunk-host VLAN-mapping harness scenario
      ansible.builtin.include_tasks:
        file: nd4x_demo_vlan_mapping.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_vlan_mapping]
      tags: [never, nd4x_demo, nd4x_demo_vlan_mapping]
      when:
        - nd4x_supported | default(false) | bool
        - supports_vlan_mapping | default(false) | bool

    - name: Run trunk-host storm-control harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_storm_control.yaml
        apply:
          tags: [never, nd4x_demo, nd4x_demo_storm_control]
      tags: [never, nd4x_demo, nd4x_demo_storm_control]
      when: nd4x_supported | default(false) | bool

    - name: Run trunk-host overridden harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_overridden.yaml
        apply:
          tags: [never, nd4x_demo_overridden, nd4x_demo_destructive]
      tags: [never, nd4x_demo_overridden, nd4x_demo_destructive]
      when: nd4x_supported | default(false) | bool
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
