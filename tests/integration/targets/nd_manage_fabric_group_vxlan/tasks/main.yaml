- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'

#############################################################################
# CLEANUP - Ensure clean state before tests
#############################################################################
- name: Clean up any existing test fabric groups before starting tests
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ fg_vxlan_test_merged }}"
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
  tags: always
  ignore_errors: true

#############################################################################
# TEST 1: STATE MERGED - Create fabric group using merged state
#############################################################################
- name: "TEST 1a: Create fabric group using state merged (first run)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': fg_vxlan_test_merged} | combine(fabric_config_fg_vxlan) }}"
  register: fg_merged_result_1
  tags: [test_fg_merged, test_fg_merged_create]

- name: "TEST 1a: Verify fabric group was created using merged state"
  assert:
    that:
      - fg_merged_result_1 is changed
      - fg_merged_result_1 is not failed
    fail_msg: "Fabric group creation with state merged failed"
    success_msg: "Fabric group successfully created with state merged"
  tags: [test_fg_merged, test_fg_merged_create]

- name: "TEST 1b: Create fabric group using state merged (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': fg_vxlan_test_merged} | combine(fabric_config_fg_vxlan) }}"
  register: fg_merged_result_2
  tags: [test_fg_merged, test_fg_merged_idempotent]

- name: "TEST 1b: Verify merged state is idempotent"
  assert:
    that:
      - fg_merged_result_2 is not changed
      - fg_merged_result_2 is not failed
    fail_msg: "Merged state is not idempotent - should not change when run twice with same config"
    success_msg: "Merged state is idempotent - no changes on second run"
  tags: [test_fg_merged, test_fg_merged_idempotent]

- name: "TEST 1c: Update fabric group using state merged (modify existing)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ fg_vxlan_test_merged }}"
        management:
          anycast_gateway_mac: "2020.0000.00bb"
          multisite_delay_restore: 600
          auto_multisite_underlay_inter_connect: true
          bgp_bfd: true
          downstream_vni: true
          downstream_l2_vni_range: "70000-79000"
          downstream_l3_vni_range: "90000-99000"
  register: fg_merged_result_3
  tags: [test_fg_merged, test_fg_merged_update]

- name: "TEST 1c: Verify fabric group was updated using merged state"
  assert:
    that:
      - fg_merged_result_3 is changed
      - fg_merged_result_3 is not failed
    fail_msg: "Fabric group update with state merged failed"
    success_msg: "Fabric group successfully updated with state merged"
  tags: [test_fg_merged, test_fg_merged_update]

#############################################################################
# VALIDATION: Validate expected changes from the module's own resulting configuration.
#
# Asserting on the module result rather than a raw ND GET: ND only returns fields
# relevant to currently-enabled features (for example `security_group_tag: off`
# suppresses the security_group_tag_* sub-settings, and enabling `downstream_vni`
# replaces l2VniRange/l3VniRange with the downstream pair). Verified identical on
# ND 4.2.1 and 4.3.1. The module result carries the full resolved configuration.
#############################################################################
- name: "VALIDATION 1: Capture resulting fabric group configuration from module output"
  set_fact:
    fg_merged_config: "{{ fg_merged_result_3.after | selectattr('fabric_name', 'equalto', fg_vxlan_test_merged) | first }}"
  tags: [test_fg_merged, test_fg_merged_validation]

#
# Category 1: Properties CHANGED by TEST 1c merge
#
- name: "VALIDATION 1a: Verify changed properties after merge"
  assert:
    that:
      - fg_merged_config.management.anycast_gateway_mac == "2020.0000.00bb"
      - fg_merged_config.management.multisite_delay_restore == 600
      - fg_merged_config.management.auto_multisite_underlay_inter_connect == true
      - fg_merged_config.management.bgp_bfd == true
      - fg_merged_config.management.downstream_vni == true
      - fg_merged_config.management.downstream_l2_vni_range == "70000-79000"
      - fg_merged_config.management.downstream_l3_vni_range == "90000-99000"
    fail_msg: >-
      Changed properties validation failed.
    success_msg: "All 7 changed properties updated correctly"
  tags: [test_fg_merged, test_fg_merged_validation]

#
# Category 2: Properties NOT in TEST 1c - MUST be preserved from original create
#
# TEST 1c enables downstream_vni, and ND stops returning l2VniRange/l3VniRange once
# downstream VNI is on - the downstream ranges supersede them. Verified on 4.2.1 and 4.3.1.
# The module result still carries the resolved values, so preservation is assertable here.
- name: "VALIDATION 1b: Verify preserved VNI ranges (not in merge task)"
  assert:
    that:
      - fg_merged_config.management.l2_vni_range == "30000-49000"
      - fg_merged_config.management.l3_vni_range == "50000-59000"
    fail_msg: "Preserved VNI ranges validation failed"
    success_msg: "Preserved VNI ranges retained correctly"
  tags: [test_fg_merged, test_fg_merged_validation]

- name: "VALIDATION 1b: Verify preserved templates (not in merge task)"
  assert:
    that:
      - fg_merged_config.management.vrf_template == "Default_VRF_Universal"
      - fg_merged_config.management.network_template == "Default_Network_Universal"
      - fg_merged_config.management.vrf_extension_template == "Default_VRF_Extension_Universal"
      - fg_merged_config.management.network_extension_template == "Default_Network_Extension_Universal"
    fail_msg: "Preserved template settings validation failed"
    success_msg: "Preserved template settings retained correctly"
  tags: [test_fg_merged, test_fg_merged_validation]

- name: "VALIDATION 1b: Verify preserved multi-site overlay settings (not in merge task)"
  assert:
    that:
      - fg_merged_config.management.multisite_overlay_inter_connect_type == "manual"
      - fg_merged_config.management.enable_ms_overlay_ifc_bgp_desc == true
      - fg_merged_config.management.multisite_loopback_id == 100
      - fg_merged_config.management.border_gateway_routing_tag == 54321
      - fg_merged_config.management.multisite_loopback_ip_range == "10.10.0.0/24"
      - fg_merged_config.management.multisite_underlay_subnet_range == "10.10.1.0/24"
      - fg_merged_config.management.multisite_underlay_subnet_target_mask == 30
    fail_msg: "Preserved multi-site settings validation failed"
    success_msg: "Preserved multi-site settings retained correctly"
  tags: [test_fg_merged, test_fg_merged_validation]

- name: "VALIDATION 1b: Verify preserved security/CloudSec settings (not in merge task)"
  assert:
    that:
      - fg_merged_config.management.security_group_tag == "off"
      - fg_merged_config.management.auto_configure_cloud_sec == false
      - fg_merged_config.management.tenant_routed_multicast_v4_v6 == false
    fail_msg: "Preserved security/CloudSec settings validation failed"
    success_msg: "Preserved security/CloudSec settings retained correctly"
  tags: [test_fg_merged, test_fg_merged_validation]

#############################################################################
# TEST 2: STATE REPLACED - Create and manage fabric group using replaced state
#############################################################################
- name: "TEST 2a: Create fabric group using state replaced (first run)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
        management:
          l2_vni_range: "40000-59000"
          l3_vni_range: "60000-69000"
          anycast_gateway_mac: "2020.0000.00cc"
          multisite_overlay_inter_connect_type: directPeering
          auto_multisite_underlay_inter_connect: true
          multisite_delay_restore: 500
          multisite_loopback_ip_range: "10.20.0.0/24"
          multisite_underlay_subnet_range: "10.20.1.0/24"
          multisite_underlay_subnet_target_mask: 28
          border_gateway_routing_tag: 12345
          security_group_tag: strict
  register: fg_replaced_result_1
  tags: [test_fg_replaced, test_fg_replaced_create]

- name: "TEST 2a: Verify fabric group was created using replaced state"
  assert:
    that:
      - fg_replaced_result_1 is changed
      - fg_replaced_result_1 is not failed
    fail_msg: "Fabric group creation with state replaced failed"
    success_msg: "Fabric group successfully created with state replaced"
  tags: [test_fg_replaced, test_fg_replaced_create]

- name: "TEST 2b: Create fabric group using state replaced (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
        management:
          l2_vni_range: "40000-59000"
          l3_vni_range: "60000-69000"
          anycast_gateway_mac: "2020.0000.00cc"
          multisite_overlay_inter_connect_type: directPeering
          auto_multisite_underlay_inter_connect: true
          multisite_delay_restore: 500
          multisite_loopback_ip_range: "10.20.0.0/24"
          multisite_underlay_subnet_range: "10.20.1.0/24"
          multisite_underlay_subnet_target_mask: 28
          border_gateway_routing_tag: 12345
          security_group_tag: strict
  register: fg_replaced_result_2
  tags: [test_fg_replaced, test_fg_replaced_idempotent]

- name: "TEST 2b: Verify replaced state is idempotent"
  assert:
    that:
      - fg_replaced_result_2 is not changed
      - fg_replaced_result_2 is not failed
    fail_msg: "Replaced state is not idempotent - should not change when run twice with same config"
    success_msg: "Replaced state is idempotent - no changes on second run"
  tags: [test_fg_replaced, test_fg_replaced_idempotent]

- name: "TEST 2c: Update fabric group using state replaced (complete replacement with minimal fields)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
        management:
  register: fg_replaced_result_3
  tags: [test_fg_replaced, test_fg_replaced_update]

- name: "TEST 2c: Verify fabric group was completely replaced"
  assert:
    that:
      - fg_replaced_result_3 is changed
      - fg_replaced_result_3 is not failed
    fail_msg: "Fabric group replace with minimal fields failed"
    success_msg: "Fabric group successfully replaced with minimal fields"
  tags: [test_fg_replaced, test_fg_replaced_update]

#############################################################################
# VALIDATION: Validate defaults from the module's own resulting configuration.
# See the note on VALIDATION 1 for why this asserts on module output, not a raw ND GET.
#############################################################################
- name: "VALIDATION 2: Capture resulting fabric group configuration from module output"
  set_fact:
    fg_replaced_config: "{{ fg_replaced_result_3.after | selectattr('fabric_name', 'equalto', fg_vxlan_test_replaced) | first }}"
  tags: [test_fg_replaced, test_fg_replaced_validation]

#
# After replacing with minimal fields, all optional settings should revert to defaults
#
- name: "VALIDATION 2a: Verify VNI ranges reverted to defaults after replace"
  assert:
    that:
      - fg_replaced_config.management.l2_vni_range == "30000-49000"
      - fg_replaced_config.management.l3_vni_range == "50000-59000"
    fail_msg: "VNI ranges did not revert to defaults after replace"
    success_msg: "VNI ranges reverted to defaults correctly"
  tags: [test_fg_replaced, test_fg_replaced_validation]

- name: "VALIDATION 2a: Verify multi-site settings reverted to defaults after replace"
  assert:
    that:
      - fg_replaced_config.management.multisite_overlay_inter_connect_type == "manual"
      - fg_replaced_config.management.auto_multisite_underlay_inter_connect == false
      - fg_replaced_config.management.multisite_delay_restore == 300
      - fg_replaced_config.management.multisite_loopback_ip_range == "10.10.0.0/24"
      - fg_replaced_config.management.multisite_underlay_subnet_range == "10.10.1.0/24"
      - fg_replaced_config.management.multisite_underlay_subnet_target_mask == 30
      - fg_replaced_config.management.border_gateway_routing_tag == 54321
    fail_msg: "Multi-site settings did not revert to defaults after replace"
    success_msg: "Multi-site settings reverted to defaults correctly"
  tags: [test_fg_replaced, test_fg_replaced_validation]

- name: "VALIDATION 2a: Verify security settings reverted to defaults after replace"
  assert:
    that:
      - fg_replaced_config.management.security_group_tag == "off"
      - fg_replaced_config.management.anycast_gateway_mac == "2020.0000.00aa"
    fail_msg: "Security settings did not revert to defaults after replace"
    success_msg: "Security settings reverted to defaults correctly"
  tags: [test_fg_replaced, test_fg_replaced_validation]

#############################################################################
# TEST 3: STATE DELETED - Delete fabric groups
#############################################################################
- name: "TEST 3a: Delete fabric group using state deleted"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
  register: fg_deleted_result_1
  tags: [test_fg_deleted, test_fg_deleted_delete]

- name: "TEST 3a: Verify fabric group was deleted"
  assert:
    that:
      - fg_deleted_result_1 is changed
      - fg_deleted_result_1 is not failed
    fail_msg: "Fabric group deletion with state deleted failed"
    success_msg: "Fabric group successfully deleted with state deleted"
  tags: [test_fg_deleted, test_fg_deleted_delete]

- name: "TEST 3b: Delete fabric group using state deleted (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
  register: fg_deleted_result_2
  tags: [test_fg_deleted, test_fg_deleted_idempotent]

- name: "TEST 3b: Verify deleted state is idempotent"
  assert:
    that:
      - fg_deleted_result_2 is not changed
      - fg_deleted_result_2 is not failed
    fail_msg: "Deleted state is not idempotent - should not change when deleting non-existent fabric group"
    success_msg: "Deleted state is idempotent - no changes when deleting non-existent fabric group"
  tags: [test_fg_deleted, test_fg_deleted_idempotent]

#############################################################################
# TEST 4: STATE OVERRIDDEN - Prune fabric groups not present in the config
#
# NOTE: For this resource `overridden` is cluster-wide - it deletes EVERY
# VXLAN fabric group that is not listed in the config. To avoid destroying
# unrelated fabric groups on a shared controller, the pruning behaviour is
# validated in CHECK MODE: the state machine still computes `after` (with the
# unlisted group removed) but issues no real DELETE calls, so the delete
# semantics can be asserted safely. TEST 4c then confirms, against live ND,
# that the unlisted group was not actually removed.
#############################################################################
- name: "TEST 4a: Seed two fabric groups for the overridden prune test"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': 'fg_vxlan_override_keep'} | combine(fabric_config_fg_vxlan) }}"
      - "{{ {'fabric_name': 'fg_vxlan_override_prune'} | combine(fabric_config_fg_vxlan) }}"
  register: fg_override_seed
  tags: [test_fg_overridden]

- name: "TEST 4a: Verify both fabric groups were seeded"
  assert:
    that:
      - fg_override_seed is not failed
      - fg_override_seed is changed
    fail_msg: "Seeding fabric groups for the overridden test failed"
    success_msg: "Both fabric groups seeded for the overridden test"
  tags: [test_fg_overridden]

- name: "TEST 4b: Overridden with only the keep group listed (check mode - safe prune)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: overridden
    config:
      - "{{ {'fabric_name': 'fg_vxlan_override_keep'} | combine(fabric_config_fg_vxlan) }}"
  check_mode: true
  register: fg_override_prune
  tags: [test_fg_overridden]

- name: "TEST 4b: Verify overridden prunes the unlisted fabric group"
  assert:
    that:
      - fg_override_prune is not failed
      - fg_override_prune is changed
      - "'fg_vxlan_override_keep' in (fg_override_prune.after | to_json)"
      - "'fg_vxlan_override_prune' not in (fg_override_prune.after | to_json)"
    fail_msg: "Overridden state did not prune the unlisted fabric group from the resulting config"
    success_msg: "Overridden state prunes fabric groups that are not present in the config"
  tags: [test_fg_overridden]

- name: "TEST 4c: Authenticate with ND to verify check mode did not delete the pruned group"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/login"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      domain: "{{ ansible_httpapi_login_domain | default('local') }}"
      userName: "{{ ansible_user }}"
      userPasswd: "{{ ansible_password }}"
    validate_certs: false
    return_content: true
    status_code:
      - 200
  register: nd_override_auth
  tags: [test_fg_overridden]
  delegate_to: localhost

- name: "TEST 4c: Query the pruned group from ND (check mode must be non-destructive)"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/api/v1/manage/fabrics/fg_vxlan_override_prune"
    method: GET
    headers:
      Authorization: "Bearer {{ nd_override_auth.json.jwttoken }}"
      Content-Type: "application/json"
    validate_certs: false
    return_content: true
    status_code:
      - 200
      - 404
  register: fg_override_prune_live
  tags: [test_fg_overridden]
  delegate_to: localhost

- name: "TEST 4c: Assert the pruned group was not actually deleted in check mode"
  assert:
    that:
      - fg_override_prune_live.status == 200
    fail_msg: "Check mode overridden unexpectedly deleted the fabric group on ND"
    success_msg: "Check mode overridden did not delete the fabric group on ND"
  tags: [test_fg_overridden]

#############################################################################
# TEST 5: Multiple fabric group operations in single task
#############################################################################
- name: "TEST 5: Create multiple fabric groups in single task"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "multi_fg_1"
        management:
          l2_vni_range: "30000-49000"
          l3_vni_range: "50000-59000"
          anycast_gateway_mac: "2020.0000.0001"
          multisite_loopback_ip_range: "10.10.0.0/24"
          multisite_underlay_subnet_range: "10.10.1.0/24"
      - fabric_name: "multi_fg_2"
        management:
          l2_vni_range: "30000-49000"
          l3_vni_range: "50000-59000"
          anycast_gateway_mac: "2020.0000.0002"
          multisite_loopback_ip_range: "10.20.0.0/24"
          multisite_underlay_subnet_range: "10.20.1.0/24"
  register: fg_multi_result
  tags: [test_fg_multi]

- name: "TEST 5: Verify multiple fabric groups were created"
  assert:
    that:
      - fg_multi_result is changed
      - fg_multi_result is not failed
    fail_msg: "Multiple fabric group creation failed"
    success_msg: "Multiple fabric groups successfully created"
  tags: [test_fg_multi]

#############################################################################
# TEST 6: SECURITY - Secret keys must be masked in module output
#############################################################################
- name: "TEST 6: Create fabric group with secret keys (check mode)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "fg_vxlan_secret_check"
        management:
          multisite_inter_connect_bgp_authentication: true
          multisite_inter_connect_bgp_key: "0123456789abcdef"
          auto_configure_cloud_sec: true
          cloud_sec_key: "abcdef0123"
  check_mode: true
  register: fg_secret_result
  tags: [test_fg_security]

- name: "TEST 6: Verify secret values never appear in module output"
  assert:
    that:
      - fg_secret_result is not failed
      - "'0123456789abcdef' not in (fg_secret_result | to_json)"
      - "'abcdef0123' not in (fg_secret_result | to_json)"
      - "'VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in (fg_secret_result | to_json)"
    fail_msg: "Secret key values leaked into module output"
    success_msg: "Secret key values are masked in module output"
  tags: [test_fg_security]

#############################################################################
# TEST 7: Downstream VNI ranges default to documented values
#############################################################################
- name: "TEST 7: Enable downstream VNI without explicit ranges (check mode)"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "fg_vxlan_downstream_check"
        management:
          downstream_vni: true
  check_mode: true
  register: fg_downstream_result
  tags: [test_fg_downstream]

- name: "TEST 7: Verify documented downstream VNI defaults are used"
  assert:
    that:
      - fg_downstream_result is not failed
      - "'10030000-10049000' in (fg_downstream_result | to_json)"
      - "'10050000-10059000' in (fg_downstream_result | to_json)"
    fail_msg: "Downstream VNI ranges did not default to the documented values"
    success_msg: "Downstream VNI ranges default to the documented values"
  tags: [test_fg_downstream]

#############################################################################
# TEST 8: Format validation rejects malformed input (client-side)
#############################################################################
- name: "TEST 8a: Reject invalid IPv4 CIDR range"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "fg_vxlan_invalid"
        management:
          multisite_loopback_ip_range: "not-an-ip"
  register: fg_bad_ip
  ignore_errors: true
  tags: [test_fg_validation]

- name: "TEST 8b: Reject invalid scheduled backup time"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "fg_vxlan_invalid"
        management:
          scheduled_backup: true
          scheduled_backup_time: "24:00"
  register: fg_bad_time
  ignore_errors: true
  tags: [test_fg_validation]

- name: "TEST 8c: Reject non-hex CloudSec key without leaking its value"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "fg_vxlan_invalid"
        management:
          auto_configure_cloud_sec: true
          cloud_sec_key: "LEAK_ME_zz"
  register: fg_bad_key
  ignore_errors: true
  tags: [test_fg_validation]

- name: "TEST 8: Verify malformed input is rejected and secrets are not leaked"
  assert:
    that:
      - fg_bad_ip is failed
      - fg_bad_time is failed
      - fg_bad_key is failed
      - "'LEAK_ME_zz' not in (fg_bad_key | to_json)"
    fail_msg: "Format validation did not reject malformed input as expected"
    success_msg: "Format validation rejects malformed input and does not leak secrets"
  tags: [test_fg_validation]

#############################################################################
# FINAL CLEANUP - Clean up all test fabric groups
#############################################################################
- name: "CLEANUP: Delete all test fabric groups"
  cisco.nd.nd_manage_fabric_group_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ fg_vxlan_test_merged }}"
      - fabric_name: "{{ fg_vxlan_test_replaced }}"
      - fabric_name: "multi_fg_1"
      - fabric_name: "multi_fg_2"
