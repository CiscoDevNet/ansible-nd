- name: Verify one workflow planned all fifteen interface families
  vars:
    nd_iw_expected_fifteen_families:
      - ethernet_access
      - ethernet_dot1q_tunnel_host
      - ethernet_routed
      - ethernet_trunk_host
      - loopback
      - port_channel_access
      - port_channel_dot1q_tunnel_host
      - port_channel_routed
      - port_channel_trunk_host
      - subinterface_managed
      - subinterface_unmanaged
      - svi
      - vpc_access
      - vpc_dot1q_tunnel
      - vpc_trunk_host
    nd_iw_observed_mixed_families: "{{ nd_iw_batch_create_preview.resources | map(attribute='type') | list }}"
  ansible.builtin.assert:
    that:
      - nd_iw_batch_create_preview.resources | length == 15
      - nd_iw_observed_mixed_families | unique | length == 15
      - nd_iw_observed_mixed_families | difference(nd_iw_expected_fifteen_families) | length == 0
      - nd_iw_expected_fifteen_families | difference(nd_iw_observed_mixed_families) | length == 0
      - nd_iw_batch_create_preview.resources | map(attribute='resource_index') | list == range(0, 15) | list
      - nd_iw_batch_create_preview.execution.mutations_sent == 0
      - nd_iw_batch_create_preview.execution.deployments_sent == 0
  when: nd_iw_active_cases | length == 15

- name: Record why fifteen-family coverage is unavailable on this fabric
  ansible.builtin.debug:
    msg: >-
      {{ nd_iw_current_fabric.discriminator }} exposes {{ nd_iw_active_cases | length }} supported
      interface families; the all-fifteen assertion is covered on a fabric where all fifteen are supported.
  when: nd_iw_active_cases | length != 15
