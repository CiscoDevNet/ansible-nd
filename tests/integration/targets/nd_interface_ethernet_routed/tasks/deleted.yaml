# Entry state (from overridden.yaml): Ethernet1/31 and Ethernet1/32 carry
# routed configs; Ethernet1/33 is already at the fabric default.
#
# state: deleted resets the interfaces to the fabric default configuration,
# which takes them out of routed mode and out of this module's managed scope.

# --- DELETED ---

- name: "DELETED: Reset Ethernet1/31 and Ethernet1/32 (check mode)"
  cisco.nd.nd_interface_ethernet_routed: &delete_31_32
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: Ethernet1/31
      - switch_ip: "{{ test_switch_ip }}"
        interface_name: Ethernet1/32
    state: deleted
  check_mode: true
  register: cm_deleted

- name: "DELETED: Reset Ethernet1/31 and Ethernet1/32 (normal mode)"
  cisco.nd.nd_interface_ethernet_routed: *delete_31_32
  register: nm_deleted

- name: "DELETED: Verify Ethernet1/31 and Ethernet1/32 left managed scope"
  ansible.builtin.assert:
    that:
      - cm_deleted is changed
      - nm_deleted is changed
      - nm_deleted.after | selectattr('interface_name', 'equalto', 'Ethernet1/31') | list | length == 0
      - nm_deleted.after | selectattr('interface_name', 'equalto', 'Ethernet1/32') | list | length == 0

# --- DELETED IDEMPOTENCY ---

- name: "DELETED IDEMPOTENT: Re-reset Ethernet1/31 and Ethernet1/32 (check mode)"
  cisco.nd.nd_interface_ethernet_routed: *delete_31_32
  check_mode: true
  register: cm_deleted_idem

- name: "DELETED IDEMPOTENT: Re-reset Ethernet1/31 and Ethernet1/32 (normal mode)"
  cisco.nd.nd_interface_ethernet_routed: *delete_31_32
  register: nm_deleted_idem

- name: "DELETED IDEMPOTENT: Verify no change when already at fabric default"
  ansible.builtin.assert:
    that:
      - cm_deleted_idem is not changed
      - nm_deleted_idem is not changed
