# Entry state (from replaced.yaml): Ethernet1/31 carries routed_31;
# Ethernet1/32 and Ethernet1/33 carry their base configs.
#
# Overriding to {Ethernet1/31, Ethernet1/32} must reset Ethernet1/33 to the
# fabric default, which takes it out of routed mode and out of this module's
# managed scope. Fabric underlay interfaces (system routed policy types) are
# never part of the managed scope, so this fabric-wide operation cannot
# touch them - that safety property is pinned by the orchestrator unit tests.

# --- OVERRIDDEN ---

- name: "OVERRIDDEN: Converge to Ethernet1/31 and Ethernet1/32 only (check mode)"
  cisco.nd.nd_interface_ethernet_routed: &override_31_32
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ routed_31 }}"
      - "{{ routed_32 }}"
    state: overridden
  check_mode: true
  register: cm_overridden

- name: "OVERRIDDEN: Converge to Ethernet1/31 and Ethernet1/32 only (normal mode)"
  cisco.nd.nd_interface_ethernet_routed: *override_31_32
  register: nm_overridden

- name: "OVERRIDDEN: Verify convergence removed Ethernet1/33 from managed scope"
  ansible.builtin.assert:
    that:
      - cm_overridden is changed
      - nm_overridden is changed
      - nm_overridden.after | selectattr('interface_name', 'equalto', 'Ethernet1/31') | list | length == 1
      - nm_overridden.after | selectattr('interface_name', 'equalto', 'Ethernet1/32') | list | length == 1
      - nm_overridden.after | selectattr('interface_name', 'equalto', 'Ethernet1/33') | list | length == 0

# --- OVERRIDDEN IDEMPOTENCY ---
# Ethernet1/33 is now at the fabric default and therefore invisible to this
# module's managed scope; a second overridden run must see nothing to change.

- name: "OVERRIDDEN IDEMPOTENT: Re-apply convergence (check mode)"
  cisco.nd.nd_interface_ethernet_routed: *override_31_32
  check_mode: true
  register: cm_overridden_idem

- name: "OVERRIDDEN IDEMPOTENT: Re-apply convergence (normal mode)"
  cisco.nd.nd_interface_ethernet_routed: *override_31_32
  register: nm_overridden_idem

- name: "OVERRIDDEN IDEMPOTENT: Verify no change on second run"
  ansible.builtin.assert:
    that:
      - cm_overridden_idem is not changed
      - nm_overridden_idem is not changed
