---
# Pre-test setup for nd_fabric_prepare_update.
# Copyright: (c) 2026, Allen Robel (@allenrobel)
#
# Remove any update groups left over from a prior run, then create the single-role (leaf) and
# mixed-role (leaf + spine) update groups the prepare tests operate on.

- name: "SETUP: Remove leftover update groups if present"
  cisco.nd.nd_fabric_update_group:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - update_group_name: "{{ test_leaf_group_name }}"
      - update_group_name: "{{ test_mixed_group_name }}"
    state: deleted
  failed_when: false

- name: "SETUP: Create the single-role (leaf) update group"
  cisco.nd.nd_fabric_update_group:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ prepare_leaf_group }}"
    state: merged

- name: "SETUP: Create the mixed-role (leaf + spine) update group"
  cisco.nd.nd_fabric_update_group:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ prepare_mixed_group }}"
    state: merged
