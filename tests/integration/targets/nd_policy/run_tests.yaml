---
# Runner playbook for nd_policy integration tests.
#
# Usage:
#   ansible-playbook -i tests/integration/inventory.networking \
#     tests/integration/targets/nd_policy/run_tests.yaml \
#     -e testcase=merged \
#     -e @tests/integration/integration_config.yml
#
# To override fabric/switch at runtime:
#   ansible-playbook -i tests/integration/inventory.networking \
#     tests/integration/targets/nd_policy/run_tests.yaml \
#     -e testcase=merged \
#     -e fabric_name=my_fabric \
#     -e switch_serial_1=FDO12345678

- name: ND Policy Integration Tests
  hosts: nd
  gather_facts: false
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
  pre_tasks:
    - name: Truncate log file for fresh run
      ansible.builtin.copy:
        content: ""
        dest: "{{ nd_logging_config | default('') | dirname }}/../nd_policy.log"
      delegate_to: localhost
      when: nd_logging_config is defined and nd_logging_config != ''
      ignore_errors: true
  roles:
    - role: "{{ playbook_dir }}"
