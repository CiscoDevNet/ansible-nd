---
- name: Exercise exact-pair and empty deletion
  vars:
    ss_ha_reversed_vpc:
      - switch_id: "{{ ss_ha_vpc_pair.peer_switch_id }}"
        peer_switch_id: "{{ ss_ha_vpc_pair.switch_id }}"
  block:
    - name: Establish an unpaired baseline for the reserved fixture
      ansible.builtin.include_tasks: cleanup.yaml
      when: ss_ha_baseline_cleanup_needed

    - name: Reserve the peers used for setup
      ansible.builtin.set_fact:
        ss_ha_cleanup_pending_ids: "{{ ss_ha_owned_ids }}"

    - name: Establish both deployed fixture associations
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_smart_switches_ha_pair
        state: replaced
        config: "{{ ss_ha_fixture_pairs }}"
        common_args: "{{ ss_ha_common_args }}"
        module_args: "{{ ss_ha_switch_deploy_args }}"
        check_mode: false
        idempotency: false
        expected:
          apply: {changed: true, failed: false}

    - name: Wait for the prerequisite associations to be deployed
      ansible.builtin.include_tasks: confirm_deployment.yaml
      vars:
        ss_ha_confirm_pairs: "{{ ss_ha_fixture_pairs }}"
        ss_ha_confirm_ids: "{{ ss_ha_owned_ids }}"

    - name: Leave both associations untouched for an empty or absent exact pair
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_smart_switches_ha_pair
        state: deleted
        config: "{{ item.config }}"
        common_args: "{{ ss_ha_common_args }}"
        module_args: "{{ ss_ha_switch_deploy_args }}"
        check_mode_queries: "{{ ss_ha_check_mode_queries }}"
        expected:
          check_mode: {changed: false, failed: false}
          apply: {changed: false, failed: false}
          idempotency: {changed: false, failed: false}
        nd_queries:
          - name: Verify the independent HA read is available
            path: "{{ ss_ha_inventory_path }}"
            expected_status: 200
      loop:
        - {label: empty list, config: []}
        - {label: absent cross-pair, config: ["{{ ss_ha_cross_pair }}"]}
      loop_control:
        label: "{{ item.label }}"
      register: ss_ha_delete_noops

    - name: Verify the first and repeated deletions made no changes
      ansible.builtin.assert:
        that:
          - item.first_run_result.after | sort(attribute='switch_id', case_sensitive=true) == ss_ha_fixture_pairs
          - item.second_run_result.after | sort(attribute='switch_id', case_sensitive=true) == ss_ha_fixture_pairs
          - item.first_run_result.action_results == []
          - item.second_run_result.action_results == []
          - item.first_run_result.config_actions_result is not defined
          - item.second_run_result.config_actions_result is not defined
      loop: "{{ ss_ha_delete_noops.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Verify the controller still holds both exact associations before removal
      ansible.builtin.include_tasks: wait_for_intent.yaml
      vars:
        ss_ha_intent_pairs: "{{ ss_ha_fixture_pairs }}"

    - name: Reserve the vPC peers for cleanup
      ansible.builtin.set_fact:
        ss_ha_cleanup_pending_ids: "{{ ss_ha_vpc_ids }}"

    - name: Delete the vPC association in reverse serial order and retain standalone HA
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_smart_switches_ha_pair
        state: deleted
        config: "{{ ss_ha_reversed_vpc }}"
        common_args: "{{ ss_ha_common_args }}"
        module_args: "{{ ss_ha_switch_deploy_args }}"
        check_mode_queries: "{{ ss_ha_check_mode_queries }}"
        idempotency: false
        expected:
          check_mode: {changed: true, failed: false}
          apply: {changed: true, failed: false}
      register: ss_ha_selective_delete

    - name: Verify the exact predicted operations and configuration actions
      ansible.builtin.include_tasks: assert_transition.yaml
      vars:
        ss_ha_result: "{{ ss_ha_selective_delete.check_mode_result }}"
        ss_ha_result_status: planned
        ss_ha_expected_before: "{{ ss_ha_fixture_pairs }}"
        ss_ha_expected_after: ["{{ ss_ha_standalone_pair }}"]
        ss_ha_expected_config_steps: [save, deploy]

    - name: Check the accepted HA operations and save and deploy steps
      ansible.builtin.include_tasks: assert_transition.yaml
      vars:
        ss_ha_result: "{{ ss_ha_selective_delete.first_run_result }}"
        ss_ha_result_status: confirmed
        ss_ha_expected_before: "{{ ss_ha_fixture_pairs }}"
        ss_ha_expected_after: ["{{ ss_ha_standalone_pair }}"]
        ss_ha_expected_config_steps: [save, deploy]

    - name: Verify one deployment result per affected switch
      ansible.builtin.include_tasks: assert_switch_deployment.yaml
      vars:
        ss_ha_deployment_ids: "{{ ss_ha_vpc_ids }}"
        ss_ha_deployment_rows: "{{ ss_ha_selective_delete.first_run_result.config_actions_result.actions[-1].response.switchIds }}"

    - name: Wait for the intended associations and switch synchronization
      ansible.builtin.include_tasks: confirm_deployment.yaml
      vars:
        ss_ha_confirm_pairs: ["{{ ss_ha_standalone_pair }}"]
        ss_ha_confirm_ids: "{{ ss_ha_vpc_ids }}"

    - name: Repeat exact-pair deletion after the device state has converged
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_smart_switches_ha_pair
        state: deleted
        config: "{{ ss_ha_reversed_vpc }}"
        common_args: "{{ ss_ha_common_args }}"
        module_args: "{{ ss_ha_switch_deploy_args }}"
        check_mode: false
        idempotency: false
        expected:
          apply: {changed: false, failed: false}
      register: ss_ha_repeated

    - name: Check the repeat preserved intent and triggered no actions
      ansible.builtin.include_tasks: assert_transition.yaml
      vars:
        ss_ha_result: "{{ ss_ha_repeated.first_run_result }}"
        ss_ha_result_status: confirmed
        ss_ha_expected_before: ["{{ ss_ha_standalone_pair }}"]
        ss_ha_expected_after: ["{{ ss_ha_standalone_pair }}"]
  always:
    - name: Restore the owned fixture
      ansible.builtin.include_tasks: cleanup.yaml
