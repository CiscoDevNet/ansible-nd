---
# Variables for nd_interface_vpc_access integration tests.
#
# Override the original SITE1 fixture defaults in inventory or extra-vars to
# match the approved ND 4.x testbed. PARITY.md records the exact overrides used
# by the current VXLAN_Fabric parity runs.

test_fabric_name: "{{ nd_test_vpc_access_fabric_name | default(nd_test_fabric_name | default('SITE1')) }}"
test_switch_ip_peer1: "{{ nd_test_vpc_peer1_ip | default('192.168.12.151') }}"
test_switch_ip_peer2: "{{ nd_test_vpc_peer2_ip | default('192.168.12.152') }}"

# ND 4.x harness safety and discovery inputs.
nd4x_vpc_access_minimum_version: "4.0.0"

nd4x_vpc_access_reserved_resources_confirmed: >-
  {{
    nd_vpc_access_reserved_resources_confirmed
    | default(false)
    | bool
  }}

nd4x_vpc_access_pair_reset_enabled: >-
  {{
    nd_vpc_access_pair_reset_enabled
    | default(false)
    | bool
  }}

nd4x_vpc_access_destructive_tests_enabled: >-
  {{
    nd_vpc_access_destructive_tests_enabled
    | default(false)
    | bool
  }}

nd4x_vpc_access_reserved_interfaces:
  - vpc100
  - vpc101

nd4x_vpc_access_reserved_port_channel_ids:
  - 100
  - 101

nd4x_vpc_access_peer1_reserved_ports:
  - Ethernet1/5
  - Ethernet1/8
  - Ethernet1/7

nd4x_vpc_access_peer2_reserved_ports:
  - Ethernet1/5
  - Ethernet1/7

nd4x_vpc_access_cleanup_config:
  - switch_ip: "{{ test_switch_ip_peer1 }}"
    interface_name: vpc100
  - switch_ip: "{{ test_switch_ip_peer1 }}"
    interface_name: vpc101

# vPC pair substrate created by setup via M(cisco.nd.nd_manage_vpc_pair).
# peer1_switch_id / peer2_switch_id accept management IPs (or serials).
# iBGP/eBGP VXLAN fabrics reject vpc_pair_details; for those fabrics the pair
# request must contain only the peer identifiers and use_virtual_peer_link.
# The approved parity environment therefore uses its discovered physical
# peer-link. The historical fixture used a virtual peer-link; this substitution
# is recorded in PARITY.md and does not change the vPC-access interface state
# transitions.
vpc_pair_setup:
  peer1_switch_id: "{{ test_switch_ip_peer1 }}"
  peer2_switch_id: "{{ test_switch_ip_peer2 }}"
  use_virtual_peer_link: false

# When false, the test run treats the vPC pair as pre-existing lab substrate: setup does not
# create/modify the pair and teardown does not unpair it. Default true preserves the original
# self-contained behavior (setup creates the pair, teardown unpairs it).
test_manage_vpc_pairs: "{{ nd_test_manage_vpc_pairs | default(true) | bool }}"

# Baseline vPC access interface used by merged + idempotency tests.
vpc_access_baseline:
  switch_ip: "{{ test_switch_ip_peer1 }}"
  interface_name: vpc100
  config_data:
    network_os:
      policy:
        admin_state: true
        access_vlan: 10
        peer1_port_channel_id: 100
        peer1_member_ports:
          - Ethernet1/5
        peer2_port_channel_id: 100
        peer2_member_ports:
          - Ethernet1/5
        port_channel_mode: active
        lacp_rate: fast

# Updated config for replaced tests (different access VLAN + add a member on peer1).
# Ethernet1/8 substitutes for the historical Ethernet1/6 because Ethernet1/8
# is the dedicated, ND-discovered member available in the current testbed.
vpc_access_updated:
  switch_ip: "{{ test_switch_ip_peer1 }}"
  interface_name: vpc100
  config_data:
    network_os:
      policy:
        admin_state: true
        access_vlan: 20
        peer1_port_channel_id: 100
        peer1_member_ports:
          - Ethernet1/5
          - Ethernet1/8
        peer2_port_channel_id: 100
        peer2_member_ports:
          - Ethernet1/5
        port_channel_mode: active
        lacp_rate: fast

# Second vPC for overridden test: define only this one, expect vpc100 to be removed.
vpc_access_overridden:
  switch_ip: "{{ test_switch_ip_peer1 }}"
  interface_name: vpc101
  config_data:
    network_os:
      policy:
        admin_state: true
        access_vlan: 30
        peer1_port_channel_id: 101
        peer1_member_ports:
          - Ethernet1/7
        peer2_port_channel_id: 101
        peer2_member_ports:
          - Ethernet1/7
        port_channel_mode: active

# --- Multi-pair scenario (#356): second vPC pair + same-name interfaces on both pairs ---
# Requires a SECOND vPC pair in the fabric (SITE1: S1_LE3/S1_LE4, added 2026-07-20). The scenario asserts the
# pair exists and fails with a clear message if not — it never creates or mutates vPC pairs.
test_switch_ip_pair2_peer1: "{{ nd_test_vpc_pair2_peer1_ip | default('192.168.12.154') }}"
test_switch_ip_pair2_peer2: "{{ nd_test_vpc_pair2_peer2_ip | default('192.168.12.155') }}"

# Same interface name and id on BOTH pairs — legal on ND (devicePair-scoped vpcId pool, issue #356).
# Uses vpc211 / Ethernet1/10 (distinct from the trunk_host target's vpc210 / Ethernet1/9) so the two
# targets' multi-pair scenarios never collide if run back-to-back against the same pair-2 switches.
vpc_multi_pair_name: vpc211
vpc_multi_pair_pair1:
  switch_ip: "{{ test_switch_ip_peer1 }}"
  interface_name: "{{ vpc_multi_pair_name }}"
  config_data:
    network_os:
      policy:
        admin_state: true
        access_vlan: 10
        peer1_port_channel_id: 211
        peer1_member_ports:
          - Ethernet1/10
        peer2_port_channel_id: 211
        peer2_member_ports:
          - Ethernet1/10
        port_channel_mode: active
vpc_multi_pair_pair2:
  switch_ip: "{{ test_switch_ip_pair2_peer1 }}"
  interface_name: "{{ vpc_multi_pair_name }}"
  config_data:
    network_os:
      policy:
        admin_state: true
        access_vlan: 10
        peer1_port_channel_id: 211
        peer1_member_ports:
          - Ethernet1/10
        peer2_port_channel_id: 211
        peer2_member_ports:
          - Ethernet1/10
        port_channel_mode: active
