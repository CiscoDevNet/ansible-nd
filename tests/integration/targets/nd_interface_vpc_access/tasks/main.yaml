#
# --- Usage ---
#
# Run the test suite with ansible-test:
#
#   ansible-test network-integration nd_interface_vpc_access
#
# Original fixture defaults (override these in inventory for another approved
# lab):
#   - SITE1 fabric with peer1 (192.168.12.151) and peer2 (192.168.12.152) reachable
#   - Peer 1 Ethernet1/5, Ethernet1/7, and Ethernet1/8 are reserved for this test
#   - Peer 2 Ethernet1/5 and Ethernet1/7 are reserved for this test
#   - The approved parity environment uses a physical peer-link discovered and
#     managed by Nexus Dashboard
#
# Setup resets and recreates the vPC pair; teardown unpairs it, which also
# removes its vPC interfaces. Set nd_test_manage_vpc_pairs=false to use an
# existing pair without changing or removing it.

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'
  tags:
    - always

- name: Run original nd_interface_vpc_access state tests
  block:
    - name: Pre-test setup (create vPC pair, clean any prior vPC interfaces)
      ansible.builtin.include_tasks: setup.yaml

    - name: Run nd_interface_vpc_access merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run nd_interface_vpc_access replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run nd_interface_vpc_access overridden state tests
      ansible.builtin.include_tasks: overridden.yaml

    - name: Run nd_interface_vpc_access deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Include multi-pair same-vPC-id tests (issue 356)
      ansible.builtin.include_tasks: multi_pair.yaml
  always:
    - name: Teardown (unpair vPC, cascades to remove any remaining vPC interfaces)
      cisco.nd.nd_manage_vpc_pair:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - peer1_switch_id: "{{ test_switch_ip_peer1 }}"
            peer2_switch_id: "{{ test_switch_ip_peer2 }}"
        state: deleted
      ignore_errors: true
      when: test_manage_vpc_pairs
  vars:
    ansible_command_timeout: 300
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"

- name: Run nd_interface_vpc_access ND 4.x harness tests
  block:
    - name: Run ND 4.x vPC-access harness preflight
      ansible.builtin.include_tasks:
        file: nd4x_demo_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
            - nd4x_demo_replaced
            - nd4x_demo_deleted
            - nd4x_demo_negative
            - nd4x_demo_overridden
            - nd4x_demo_destructive
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted
        - nd4x_demo_negative
        - nd4x_demo_overridden
        - nd4x_demo_destructive

    - name: Run merged state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_merged.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
      when: nd4x_supported | default(false) | bool

    - name: Run replaced state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_replaced.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_replaced
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_replaced
      when: nd4x_supported | default(false) | bool

    - name: Run deleted state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_deleted.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_deleted
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_deleted
      when: nd4x_supported | default(false) | bool

    - name: Run negative validation tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_negative.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_negative
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_negative
      when: nd4x_supported | default(false) | bool

    - name: Run overridden state tests using the ND 4.x harness
      ansible.builtin.include_tasks:
        file: nd4x_demo_overridden.yaml
        apply:
          tags:
            - never
            - nd4x_demo_overridden
            - nd4x_demo_destructive
      tags:
        - never
        - nd4x_demo_overridden
        - nd4x_demo_destructive
      when: nd4x_supported | default(false) | bool
  vars:
    ansible_command_timeout: 300
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
