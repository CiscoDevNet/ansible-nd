# After overridden.yaml, only vpc101 exists. Remove it explicitly and verify idempotency.

- name: "DELETED RECONCILE SETUP: Deploy vpc101 before staging its deletion"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_access_overridden }}"
    config_actions:
      deploy: true
    state: merged

- name: "DELETED: Remove vpc101 (check mode)"
  cisco.nd.nd_interface_vpc_access: &delete_vpc
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc101
    config_actions:
      deploy: false
    state: deleted
  check_mode: true
  register: cm_deleted

- name: "DELETED: Remove vpc101 (normal mode)"
  cisco.nd.nd_interface_vpc_access: *delete_vpc
  register: nm_deleted

- name: "DELETED: Verify delete produced a change"
  ansible.builtin.assert:
    that:
      - cm_deleted is changed
      - nm_deleted is changed

- name: "DELETED RECONCILE: Check exact staged delete with deployment enabled"
  cisco.nd.nd_interface_vpc_access: &delete_vpc_deploy
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc101
    config_actions:
      deploy: true
    state: deleted
  check_mode: true
  register: cm_deleted_reconcile

- name: "DELETED RECONCILE: Deploy exact staged delete"
  cisco.nd.nd_interface_vpc_access: *delete_vpc_deploy
  register: nm_deleted_reconcile

- name: "DELETED RECONCILE: Replay deployed delete"
  cisco.nd.nd_interface_vpc_access: *delete_vpc_deploy
  register: nm_deleted_idem

- name: "DELETED RECONCILE: Verify pending delete deployed once"
  ansible.builtin.assert:
    that:
      - cm_deleted_reconcile is changed
      - nm_deleted_reconcile is changed
      - nm_deleted_idem is not changed
