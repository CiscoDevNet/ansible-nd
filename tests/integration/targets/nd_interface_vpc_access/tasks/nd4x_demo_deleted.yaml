---
- name: Run nd_interface_vpc_access deleted harness tests
  block:
    - name: "DELETED SETUP: Reset and verify the test vPC pair"
      ansible.builtin.include_tasks:
        file: nd4x_demo_pair_setup.yaml
        apply:
          tags:
            - always
      tags:
        - always

    - name: "DELETED SETUP: Remove reserved vPC interfaces"
      cisco.nd.nd_interface_vpc_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: "{{ nd4x_vpc_access_cleanup_config }}"
        state: deleted

    - name: "DELETED SETUP: Create exact vpc101 pre-state"
      cisco.nd.nd_interface_vpc_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ vpc_access_overridden }}"
        state: merged
      register: nd4x_deleted_setup

    - name: "DELETED SETUP: Wait for vpc101 convergence"
      ansible.builtin.pause:
        seconds: 30

    - name: "DELETED SETUP: Verify exact vpc101 pre-state"
      vars:
        vpc101_before: >-
          {{
            nd4x_deleted_setup.after
            | selectattr('interface_name', 'equalto', 'vpc101')
            | first
          }}
      ansible.builtin.assert:
        that:
          - nd4x_deleted_setup.changed | bool
          - vpc101_before.config_data.network_os.policy.access_vlan == 30
          - >-
            vpc101_before.config_data.network_os.policy.peer1_port_channel_id
            == 101
          - >-
            vpc101_before.config_data.network_os.policy.peer2_port_channel_id
            == 101
          - >-
            vpc101_before.config_data.network_os.policy.peer1_member_ports
            == ['Ethernet1/7']
          - >-
            vpc101_before.config_data.network_os.policy.peer2_member_ports
            == ['Ethernet1/7']
          - >-
            nd4x_deleted_setup.after
            | selectattr('interface_name', 'equalto', 'vpc100')
            | list
            | length == 0

    - name: "DELETED SINGLE: Delete vpc101"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_vpc_access
        state: deleted
        idempotency: false
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc101
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
        check_mode_queries: "{{ nd4x_vpc_pair_check_mode_queries }}"
      register: nd4x_deleted_single

    - name: "DELETED SINGLE: Verify returned deletion state"
      ansible.builtin.assert:
        that:
          - nd4x_deleted_single.check_mode_result.changed | bool
          - nd4x_deleted_single.first_run_result.changed | bool
          - >-
            nd4x_deleted_single.first_run_result.after
            | selectattr('interface_name', 'equalto', 'vpc101')
            | list
            | length == 0

    - name: "DELETED IDEMPOTENT: Wait for convergence"
      ansible.builtin.pause:
        seconds: 30

    - name: "DELETED IDEMPOTENT: Delete vpc101 again in normal mode"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_interface_vpc_access
        state: deleted
        check_mode: false
        common_args:
          output_level: "{{ nd_info.output_level }}"
          fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc101
        expected:
          apply:
            changed: false
            failed: false
          idempotency:
            changed: false
            failed: false
        nd_queries:
          - name: Validate vpc101 absence on peer 1
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id_peer1 }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'vpc101' &
                  @.interfaceType == 'vpc' &
                  @.configData.networkOS.policy.policyType == 'accessVpcHost'
                  )]
                exists: false
          - name: Validate vpc101 absence on peer 2
            path: >-
              /api/v1/manage/fabrics/{{ test_fabric_name
              }}/switches/{{ test_switch_id_peer2 }}/interfaces
            method: get
            expected_status: 200
            expect:
              - jsonpath: >-
                  $.current.interfaces[?(
                  @.interfaceName == 'vpc101' &
                  @.interfaceType == 'vpc' &
                  @.configData.networkOS.policy.policyType == 'accessVpcHost'
                  )]
                exists: false
      register: nd4x_deleted_idempotent

    - name: "DELETED IDEMPOTENT: Verify real no-change result"
      ansible.builtin.assert:
        that:
          - not nd4x_deleted_idempotent.first_run_result.changed | bool
          - not nd4x_deleted_idempotent.second_run_result.changed | bool
          - nd4x_deleted_idempotent.check_mode_result is none
          - nd4x_deleted_idempotent.idempotency_attempts == 1
          - nd4x_deleted_idempotent.nd_query_results | length == 2

  always:
    - name: "DELETED CLEANUP: Remove reserved vPC interfaces"
      cisco.nd.nd_interface_vpc_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config: "{{ nd4x_vpc_access_cleanup_config }}"
        state: deleted
      ignore_errors: true
      tags:
        - always

    - name: "DELETED CLEANUP: Remove test vPC pair"
      cisco.nd.nd_manage_vpc_pair:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - peer1_switch_id: "{{ test_switch_ip_peer1 }}"
            peer2_switch_id: "{{ test_switch_ip_peer2 }}"
        state: deleted
      ignore_errors: true
      tags:
        - always
