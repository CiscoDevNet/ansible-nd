---
# Multi-pair same-vPC-id tests for nd_interface_vpc_access (issue #356)
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)

# --- PRECONDITION: second vPC pair must exist (never created here) ---
#
# Resolve management IPs through the fabric inventory and require reciprocal
# authoritative vpcPair records. This avoids depending on nd_manage_vpc_pair's
# unrelated gathered-result assembly while proving the exact pair identity.

- name: "MULTI-PAIR PRECONDITION: Read fabric switch inventory"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches"
    method: get
  register: pair2_switches

- name: "MULTI-PAIR PRECONDITION: Resolve pair-2 switch ids"
  ansible.builtin.set_fact:
    pair2_peer1_id: >-
      {{ (pair2_switches.current.switches | selectattr('fabricManagementIp', 'equalto', test_switch_ip_pair2_peer1)
         | map(attribute='switchId') | list + ['']) | first }}
    pair2_peer2_id: >-
      {{ (pair2_switches.current.switches | selectattr('fabricManagementIp', 'equalto', test_switch_ip_pair2_peer2)
         | map(attribute='switchId') | list + ['']) | first }}

- name: "MULTI-PAIR PRECONDITION: Assert both pair-2 switches exist"
  ansible.builtin.assert:
    that:
      - pair2_peer1_id | length > 0
      - pair2_peer2_id | length > 0

- name: "MULTI-PAIR PRECONDITION: Read pair-2 peer 1 relation"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ pair2_peer1_id }}/vpcPair"
    method: get
  register: pair2_peer1_relation

- name: "MULTI-PAIR PRECONDITION: Read pair-2 peer 2 relation"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/switches/{{ pair2_peer2_id }}/vpcPair"
    method: get
  register: pair2_peer2_relation

- name: "MULTI-PAIR PRECONDITION: Assert the second vPC pair is reciprocal"
  ansible.builtin.assert:
    that:
      - pair2_peer1_relation.current.switchId == pair2_peer1_id
      - pair2_peer1_relation.current.peerSwitchId == pair2_peer2_id
      - pair2_peer2_relation.current.switchId == pair2_peer2_id
      - pair2_peer2_relation.current.peerSwitchId == pair2_peer1_id
    fail_msg: >-
      The multi-pair scenario requires a second vPC pair ({{ test_switch_ip_pair2_peer1 }}/{{ test_switch_ip_pair2_peer2 }})
      in fabric {{ test_fabric_name }}. Create it first (nd_manage_vpc_pair) or override nd_test_vpc_pair2_peer*_ip.

- name: "MULTI-PAIR SETUP: Remove prior pair-scoped test objects"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: "{{ vpc_multi_pair_name }}"
      - switch_ip: "{{ test_switch_ip_pair2_peer1 }}"
        interface_name: "{{ vpc_multi_pair_name }}"
    config_actions:
      deploy: true
    state: deleted
  register: mp_setup_cleanup

- name: "MULTI-PAIR SETUP: Verify no pair-scoped test object remains"
  ansible.builtin.assert:
    that:
      - mp_setup_cleanup.after | selectattr('interface_name', 'equalto', vpc_multi_pair_name) | list | length == 0

# --- MERGED: same name + id on both pairs in ONE task (the #356 CONFIRMED failure) ---

- name: "MULTI-PAIR MERGED: Create {{ vpc_multi_pair_name }} on both pairs (check mode)"
  cisco.nd.nd_interface_vpc_access: &multi_pair_merge
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_multi_pair_pair1 }}"
      - "{{ vpc_multi_pair_pair2 }}"
    config_actions:
      deploy: true
    state: merged
  check_mode: true
  register: cm_mp_merged

- name: "MULTI-PAIR MERGED: Create {{ vpc_multi_pair_name }} on both pairs (normal mode)"
  cisco.nd.nd_interface_vpc_access: *multi_pair_merge
  register: nm_mp_merged

- name: "MULTI-PAIR MERGED: Verify two pair-scoped objects and their exact intent"
  vars:
    mp_records: "{{ nm_mp_merged.after | selectattr('interface_name', 'equalto', vpc_multi_pair_name) | list }}"
    mp_pair1_records: "{{ mp_records | selectattr('switch_ip', 'equalto', test_switch_ip_peer1) | list }}"
    mp_pair2_records: "{{ mp_records | selectattr('switch_ip', 'equalto', test_switch_ip_pair2_peer1) | list }}"
  ansible.builtin.assert:
    that:
      - cm_mp_merged is changed
      - nm_mp_merged is changed
      - mp_records | length == 2
      - mp_pair1_records | length == 1
      - mp_pair2_records | length == 1
      - mp_pair1_records[0].config_data.network_os.policy.access_vlan == 10
      - mp_pair2_records[0].config_data.network_os.policy.access_vlan == 11
      - mp_pair1_records[0].config_data.network_os.policy.peer1_member_ports == [vpc_access_member_multi_pair]
      - mp_pair1_records[0].config_data.network_os.policy.peer2_member_ports == [vpc_access_member_multi_pair]
      - mp_pair2_records[0].config_data.network_os.policy.peer1_member_ports == [vpc_access_member_multi_pair]
      - mp_pair2_records[0].config_data.network_os.policy.peer2_member_ports == [vpc_access_member_multi_pair]

- name: "MULTI-PAIR IDEMPOTENT: Pause for convergence"
  ansible.builtin.pause:
    seconds: 30

- name: "MULTI-PAIR IDEMPOTENT: Re-apply both (normal mode)"
  cisco.nd.nd_interface_vpc_access: *multi_pair_merge
  register: nm_mp_idem

- name: "MULTI-PAIR IDEMPOTENT: Verify no change on second run"
  ansible.builtin.assert:
    that:
      - nm_mp_idem is not changed

# --- GUARD: same name under both peers of ONE pair must fail fast ---

- name: "MULTI-PAIR GUARD: Same name under both peers of pair 1 (must fail)"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_multi_pair_pair1 }}"
      - "{{ vpc_multi_pair_pair1 | combine({'switch_ip': test_switch_ip_peer2}) }}"
    state: merged
  register: mp_guard
  failed_when: false

- name: "MULTI-PAIR GUARD: Verify the fail-fast error names the pair"
  ansible.builtin.assert:
    that:
      - mp_guard is failed or (mp_guard.msg is defined and 'same vPC pair' in mp_guard.msg | string)
      - "'same vPC pair' in (mp_guard.msg | default(mp_guard) | string)"

# --- OVERRIDDEN: config holds only pair 1's interface -> pair 2's must be deleted (the #356 override gap) ---

- name: "MULTI-PAIR OVERRIDDEN: Keep only pair 1's {{ vpc_multi_pair_name }} (normal mode)"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: "{{ [vpc_multi_pair_pair1] + vpc_access_bystanders }}"
    config_actions:
      deploy: true
    state: overridden
  register: nm_mp_overridden

- name: "MULTI-PAIR OVERRIDDEN: Verify exactly pair 1 remains"
  vars:
    mp_records: "{{ nm_mp_overridden.after | selectattr('interface_name', 'equalto', vpc_multi_pair_name) | list }}"
    after_keys: >-
      {%- set keys = [] -%}
      {%- for item in nm_mp_overridden.after -%}
      {%- set appended = keys.append(item.switch_ip ~ '/' ~ item.interface_name) -%}
      {%- endfor -%}
      {{ keys }}
  ansible.builtin.assert:
    that:
      - nm_mp_overridden is changed
      - mp_records | length == 1
      - mp_records[0].switch_ip == test_switch_ip_peer1
      - mp_records[0].config_data.network_os.policy.access_vlan == 10
      - mp_records[0].config_data.network_os.policy.peer1_member_ports == [vpc_access_member_multi_pair]
      - mp_records[0].config_data.network_os.policy.peer2_member_ports == [vpc_access_member_multi_pair]
      - vpc_access_bystander_keys | difference(after_keys) | length == 0
      - nm_mp_overridden.after | length == 1 + (vpc_access_bystanders | length)

- name: "MULTI-PAIR OVERRIDDEN IDEMPOTENT: Pause for convergence"
  ansible.builtin.pause:
    seconds: 30

- name: "MULTI-PAIR OVERRIDDEN IDEMPOTENT: Re-apply (normal mode)"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: "{{ [vpc_multi_pair_pair1] + vpc_access_bystanders }}"
    config_actions:
      deploy: true
    state: overridden
  register: nm_mp_overridden_idem

- name: "MULTI-PAIR OVERRIDDEN IDEMPOTENT: Verify stable (pair 1 untouched, nothing re-deleted)"
  ansible.builtin.assert:
    that:
      - nm_mp_overridden_idem is not changed

# --- CLEANUP ---

- name: "MULTI-PAIR CLEANUP: Delete pair 1's {{ vpc_multi_pair_name }}"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: "{{ vpc_multi_pair_name }}"
    config_actions:
      deploy: true
    state: deleted
  register: mp_cleanup

- name: "MULTI-PAIR CLEANUP: Verify deletion"
  ansible.builtin.assert:
    that:
      - mp_cleanup is changed

# Pair 2's copy is normally removed by the OVERRIDDEN step above. The exact delete remains mandatory
# so an aborted run cannot silently leave residue.
- name: "MULTI-PAIR CLEANUP: Ensure pair 2's {{ vpc_multi_pair_name }} is absent"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_pair2_peer1 }}"
        interface_name: "{{ vpc_multi_pair_name }}"
    config_actions:
      deploy: true
    state: deleted
  register: mp_cleanup_pair2

- name: "MULTI-PAIR CLEANUP: Verify both pair-scoped objects are absent"
  ansible.builtin.assert:
    that:
      - mp_cleanup.after | selectattr('interface_name', 'equalto', vpc_multi_pair_name) | list | length == 0
      - mp_cleanup_pair2.after | selectattr('interface_name', 'equalto', vpc_multi_pair_name) | list | length == 0
