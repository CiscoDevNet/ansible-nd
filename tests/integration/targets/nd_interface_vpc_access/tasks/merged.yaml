# --- MERGED CREATE ---

- name: "MERGED CREATE: Create vpc100 (check mode)"
  cisco.nd.nd_interface_vpc_access: &merge_vpc
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_access_baseline }}"
    config_actions:
      deploy: true
    state: merged
  check_mode: true
  register: cm_merged_create

- name: "MERGED CREATE: Create vpc100 (normal mode)"
  cisco.nd.nd_interface_vpc_access: *merge_vpc
  register: nm_merged_create

- name: "MERGED CREATE: Verify creation produced a change"
  ansible.builtin.assert:
    that:
      - cm_merged_create is changed
      - nm_merged_create is changed

# --- MERGED IDEMPOTENCY ---

- name: "MERGED IDEMPOTENT: Pause for switch convergence"
  ansible.builtin.pause:
    seconds: 30

- name: "MERGED IDEMPOTENT: Re-apply vpc100 (check mode)"
  cisco.nd.nd_interface_vpc_access: *merge_vpc
  check_mode: true
  register: cm_merged_idem

- name: "MERGED IDEMPOTENT: Re-apply vpc100 (normal mode)"
  cisco.nd.nd_interface_vpc_access: *merge_vpc
  register: nm_merged_idem

- name: "MERGED IDEMPOTENT: Verify no change on second run"
  ansible.builtin.assert:
    that:
      - cm_merged_idem is not changed
      - nm_merged_idem is not changed

# --- OWNERSHIP PREFLIGHT: conflicting parents must never reach ND ---

- name: "MERGED OWNERSHIP GUARD: Reject one-sided and two-sided conflicting members"
  block:
    - name: "MERGED OWNERSHIP GUARD: Check one-sided conflict without deployment"
      cisco.nd.nd_interface_vpc_access: &vpc_access_one_sided_conflict
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc198
            config_data:
              network_os:
                policy:
                  access_vlan: 198
                  peer1_port_channel_id: 198
                  peer1_member_ports:
                    - "{{ vpc_access_member_primary }}"
                  peer2_port_channel_id: 198
                  peer2_member_ports: []
        config_actions:
          deploy: false
        state: merged
      check_mode: true
      register: cm_vpc_access_one_sided_conflict
      ignore_errors: true

    - name: "MERGED OWNERSHIP GUARD: Apply one-sided conflict without deployment"
      cisco.nd.nd_interface_vpc_access: *vpc_access_one_sided_conflict
      register: nm_vpc_access_one_sided_conflict
      ignore_errors: true

    - name: "MERGED OWNERSHIP GUARD: Check two-sided conflict with deployment"
      cisco.nd.nd_interface_vpc_access: &vpc_access_two_sided_conflict
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc199
            config_data:
              network_os:
                policy:
                  access_vlan: 199
                  peer1_port_channel_id: 199
                  peer1_member_ports:
                    - "{{ vpc_access_member_primary }}"
                  peer2_port_channel_id: 199
                  peer2_member_ports:
                    - "{{ vpc_access_member_primary }}"
        config_actions:
          deploy: true
        state: merged
      check_mode: true
      register: cm_vpc_access_two_sided_conflict
      ignore_errors: true

    - name: "MERGED OWNERSHIP GUARD: Apply two-sided conflict with deployment"
      cisco.nd.nd_interface_vpc_access: *vpc_access_two_sided_conflict
      register: nm_vpc_access_two_sided_conflict
      ignore_errors: true

    - name: "MERGED OWNERSHIP GUARD: Verify all conflicts failed locally"
      ansible.builtin.assert:
        that:
          - cm_vpc_access_one_sided_conflict is failed
          - cm_vpc_access_one_sided_conflict is not changed
          - "'Preflight failed: Cannot configure vPC member(s)' in cm_vpc_access_one_sided_conflict.msg"
          - nm_vpc_access_one_sided_conflict is failed
          - nm_vpc_access_one_sided_conflict is not changed
          - "'Preflight failed: Cannot configure vPC member(s)' in nm_vpc_access_one_sided_conflict.msg"
          - cm_vpc_access_two_sided_conflict is failed
          - cm_vpc_access_two_sided_conflict is not changed
          - "'Preflight failed: Cannot configure vPC member(s)' in cm_vpc_access_two_sided_conflict.msg"
          - nm_vpc_access_two_sided_conflict is failed
          - nm_vpc_access_two_sided_conflict is not changed
          - "'Preflight failed: Cannot configure vPC member(s)' in nm_vpc_access_two_sided_conflict.msg"
  always:
    - name: "MERGED OWNERSHIP GUARD: Remove any unexpected candidate residue"
      cisco.nd.nd_interface_vpc_access:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc198
          - switch_ip: "{{ test_switch_ip_peer1 }}"
            interface_name: vpc199
        config_actions:
          deploy: true
        state: deleted
      ignore_errors: true

# --- ONE-SIDED MEMBERSHIP: update the populated peer safely ---

- name: "MERGED ONE-SIDED MEMBER: Deploy peer2 membership removal"
  cisco.nd.nd_interface_vpc_access: &vpc_access_peer2_empty
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc100
        config_data:
          network_os:
            policy:
              peer2_member_ports: []
    config_actions:
      deploy: true
    state: merged
  register: nm_peer2_empty

- name: "MERGED ONE-SIDED MEMBER: Update the populated peer1 member"
  cisco.nd.nd_interface_ethernet_access: &vpc_access_peer1_member_down
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_names:
          - "{{ vpc_access_member_primary }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              admin_state: false
    config_actions:
      deploy: true
    state: merged
  register: nm_peer1_member_down

- name: "MERGED ONE-SIDED MEMBER: Replay the populated peer1 member update"
  cisco.nd.nd_interface_ethernet_access: *vpc_access_peer1_member_down
  register: nm_peer1_member_down_idem

- name: "MERGED ONE-SIDED MEMBER: Restore the populated peer1 member"
  cisco.nd.nd_interface_ethernet_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_names:
          - "{{ vpc_access_member_primary }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              admin_state: true
    config_actions:
      deploy: true
    state: merged
  register: nm_peer1_member_restore

- name: "MERGED ONE-SIDED MEMBER: Restore both parent member lists"
  cisco.nd.nd_interface_vpc_access:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_access_baseline }}"
    config_actions:
      deploy: true
    state: merged
  register: nm_peer2_members_restore

- name: "MERGED ONE-SIDED MEMBER: Verify update, replay, and restoration"
  vars:
    one_sided_parent: "{{ nm_peer2_empty.after | selectattr('interface_name', 'equalto', 'vpc100') | first }}"
    one_sided_member: "{{ nm_peer1_member_down.after | selectattr('interface_name', 'equalto', vpc_access_member_primary) | first }}"
  ansible.builtin.assert:
    that:
      - nm_peer2_empty is changed
      - one_sided_parent.config_data.network_os.policy.peer1_member_ports == [vpc_access_member_primary]
      - one_sided_parent.config_data.network_os.policy.peer2_member_ports == []
      - nm_peer1_member_down is changed
      - one_sided_member.config_data.network_os.policy.admin_state is false
      - nm_peer1_member_down_idem is not changed
      - nm_peer1_member_restore is changed
      - nm_peer2_members_restore is changed

# --- EXPLICIT EMPTY MEMBERSHIP: populated -> empty -> idempotent replay ---

- name: "MERGED EMPTY MEMBERS: Stage both peer lists empty without deployment"
  cisco.nd.nd_interface_vpc_access: &vpc_access_empty_no_deploy
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc100
        config_data:
          network_os:
            policy:
              peer1_member_ports: []
              peer2_member_ports: []
    config_actions:
      deploy: false
    state: merged
  register: nm_empty_no_deploy

- name: "MERGED EMPTY MEMBERS: Replay staged empty peer lists"
  cisco.nd.nd_interface_vpc_access: *vpc_access_empty_no_deploy
  register: nm_empty_no_deploy_idem

- name: "MERGED EMPTY MEMBERS: Verify staged clear and replay"
  vars:
    cleared: "{{ nm_empty_no_deploy.after | selectattr('interface_name', 'equalto', 'vpc100') | first }}"
  ansible.builtin.assert:
    that:
      - nm_empty_no_deploy is changed
      - cleared.config_data.network_os.policy.peer1_member_ports == []
      - cleared.config_data.network_os.policy.peer2_member_ports == []
      - nm_empty_no_deploy_idem is not changed

- name: "MERGED EMPTY MEMBERS: Check exact staged peer intent with deployment enabled"
  cisco.nd.nd_interface_vpc_access: &vpc_access_empty_reconcile_deploy
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc100
        config_data:
          network_os:
            policy:
              peer1_member_ports: []
              peer2_member_ports: []
    config_actions:
      deploy: true
    state: merged
  check_mode: true
  register: cm_empty_reconcile_deploy

- name: "MERGED EMPTY MEMBERS: Deploy exact staged peer intent"
  cisco.nd.nd_interface_vpc_access: *vpc_access_empty_reconcile_deploy
  register: nm_empty_reconcile_deploy

- name: "MERGED EMPTY MEMBERS: Replay deployed exact staged peer intent"
  cisco.nd.nd_interface_vpc_access: *vpc_access_empty_reconcile_deploy
  register: nm_empty_reconcile_deploy_idem

- name: "MERGED EMPTY MEMBERS: Verify peer no-diff deployment reconciliation"
  vars:
    cleared: "{{ nm_empty_reconcile_deploy.after | selectattr('interface_name', 'equalto', 'vpc100') | first }}"
  ansible.builtin.assert:
    that:
      - cm_empty_reconcile_deploy is changed
      - nm_empty_reconcile_deploy is changed
      - cleared.config_data.network_os.policy.peer1_member_ports == []
      - cleared.config_data.network_os.policy.peer2_member_ports == []
      - nm_empty_reconcile_deploy_idem is not changed

- name: "MERGED EMPTY MEMBERS: Restore populated peer lists with deployment"
  cisco.nd.nd_interface_vpc_access: &vpc_access_restore_deploy
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_access_baseline }}"
    config_actions:
      deploy: true
    state: merged
  register: nm_empty_no_deploy_restore

- name: "MERGED EMPTY MEMBERS: Clear populated peer lists with deployment"
  cisco.nd.nd_interface_vpc_access: &vpc_access_empty_deploy
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc100
        config_data:
          network_os:
            policy:
              peer1_member_ports: []
              peer2_member_ports: []
    config_actions:
      deploy: true
    state: merged
  register: nm_empty_deploy

- name: "MERGED EMPTY MEMBERS: Replay deployed empty peer lists"
  cisco.nd.nd_interface_vpc_access: *vpc_access_empty_deploy
  register: nm_empty_deploy_idem

- name: "MERGED EMPTY MEMBERS: Verify deployed clear and replay"
  vars:
    cleared: "{{ nm_empty_deploy.after | selectattr('interface_name', 'equalto', 'vpc100') | first }}"
  ansible.builtin.assert:
    that:
      - nm_empty_no_deploy_restore is changed
      - nm_empty_deploy is changed
      - cleared.config_data.network_os.policy.peer1_member_ports == []
      - cleared.config_data.network_os.policy.peer2_member_ports == []
      - nm_empty_deploy_idem is not changed

- name: "MERGED EMPTY MEMBERS: Restore baseline after deployed clear"
  cisco.nd.nd_interface_vpc_access: *vpc_access_restore_deploy
  register: nm_empty_deploy_restore

- name: "MERGED EMPTY MEMBERS: Verify final baseline restoration"
  ansible.builtin.assert:
    that:
      - nm_empty_deploy_restore is changed
