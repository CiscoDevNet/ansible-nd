---
# Overridden state tests for nd_interface_vpc_trunk_host
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)

# After replaced.yaml, vpc200 exists. State overridden should remove vpc200 and create vpc201.
# Because overridden is fabric-wide, preserve every non-test trunk-host vPC discovered by a
# read-only probe so this target is safe on a shared test fabric.

- name: "OVERRIDDEN SETUP: Read the fabric's trunk-host vPCs (check mode, nothing is changed)"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_trunk_host_overridden }}"
    state: overridden
  check_mode: true
  register: cm_overridden_probe

# `before` items also carry frozen discriminator fields that are not module options, so replay
# only the identifier and network_os container. The reserved names are owned by this target.
- name: "OVERRIDDEN SETUP: Collect non-test trunk-host vPC bystanders"
  ansible.builtin.set_fact:
    vpc_trunk_host_bystanders: >-
      {%- set collected = [] -%}
      {%- for item in cm_overridden_probe.before
            if item.interface_name not in ['vpc200', 'vpc201', 'vpc298', 'vpc299', vpc_multi_pair_name] -%}
      {%- set appended = collected.append({
            'switch_ip': item.switch_ip,
            'interface_name': item.interface_name,
            'config_data': {'network_os': item.config_data.network_os}}) -%}
      {%- endfor -%}
      {{ collected }}

- name: "OVERRIDDEN SETUP: Record exact trunk-host vPC bystander identities"
  ansible.builtin.set_fact:
    vpc_trunk_host_bystander_keys: >-
      {%- set keys = [] -%}
      {%- for item in vpc_trunk_host_bystanders -%}
      {%- set appended = keys.append(item.switch_ip ~ '/' ~ item.interface_name) -%}
      {%- endfor -%}
      {{ keys }}

- name: "OVERRIDDEN: Single source of truth = vpc201 only (check mode)"
  cisco.nd.nd_interface_vpc_trunk_host: &override_vpc
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config: "{{ [vpc_trunk_host_overridden] + vpc_trunk_host_bystanders }}"
    config_actions:
      deploy: true
    state: overridden
  check_mode: true
  register: cm_overridden

- name: "OVERRIDDEN: Single source of truth = vpc201 only (normal mode)"
  cisco.nd.nd_interface_vpc_trunk_host: *override_vpc
  register: nm_overridden

- name: "OVERRIDDEN: Verify override produced a change"
  vars:
    after_keys: >-
      {%- set keys = [] -%}
      {%- for item in nm_overridden.after -%}
      {%- set appended = keys.append(item.switch_ip ~ '/' ~ item.interface_name) -%}
      {%- endfor -%}
      {{ keys }}
  ansible.builtin.assert:
    that:
      - cm_overridden is changed
      - nm_overridden is changed
      - vpc_trunk_host_bystander_keys | difference(after_keys) | length == 0
      - nm_overridden.after | length == 1 + (vpc_trunk_host_bystanders | length)

- name: "OVERRIDDEN IDEMPOTENT: Re-apply immediately (normal mode)"
  cisco.nd.nd_interface_vpc_trunk_host: *override_vpc
  register: nm_overridden_idem

- name: "OVERRIDDEN IDEMPOTENT: Verify no change on re-apply"
  ansible.builtin.assert:
    that:
      - nm_overridden_idem is not changed
