---
# Pre-test setup for nd_interface_vpc_trunk_host
# Copyright: (c) 2026, Allen Robel (@allenrobel)

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)

# Ensures:
#   1. Any pre-existing vPC pair on the test peers is removed (clears any stale vPC interfaces).
#   2. A fresh vPC pair is created so the trunk-host tests have a stable substrate.
#   3. ND switch poller has time to discover the new pair before tests start.

- name: "SETUP: Tear down any existing vPC pair on test peers"
  cisco.nd.nd_manage_vpc_pair:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - peer1_switch_id: "{{ test_switch_ip_peer1 }}"
        peer2_switch_id: "{{ test_switch_ip_peer2 }}"
    state: deleted
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Pause for unpair convergence"
  ansible.builtin.pause:
    seconds: 30
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Verify prior vPC pair is absent"
  cisco.nd.nd_manage_vpc_pair:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - peer1_switch_id: "{{ test_switch_ip_peer1 }}"
        peer2_switch_id: "{{ test_switch_ip_peer2 }}"
    state: gathered
  register: setup_pair_absent
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Assert prior vPC pair is absent"
  ansible.builtin.assert:
    that:
      - setup_pair_absent.gathered.vpc_pairs | default([]) | length == 0
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Create vPC pair"
  cisco.nd.nd_manage_vpc_pair:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ vpc_pair_setup }}"
    state: merged
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Pause for pair-establishment convergence"
  ansible.builtin.pause:
    seconds: 30
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Verify fresh vPC pair exists"
  cisco.nd.nd_manage_vpc_pair:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - peer1_switch_id: "{{ test_switch_ip_peer1 }}"
        peer2_switch_id: "{{ test_switch_ip_peer2 }}"
    state: gathered
  register: setup_pair_present
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Assert fresh vPC pair exists exactly once"
  ansible.builtin.assert:
    that:
      - setup_pair_present.gathered.vpc_pairs | default([]) | length == 1
  when: test_manage_vpc_pairs
  tags: always

- name: "SETUP: Remove test trunk-host vPC interfaces from pair 1"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc200
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc201
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc298
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc299
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: "{{ vpc_multi_pair_name }}"
    config_actions:
      deploy: true
    state: deleted
  register: setup_vpc_trunk_delete
  tags: always

- name: "SETUP: Verify test trunk-host vPC interfaces are absent from pair 1"
  ansible.builtin.assert:
    that:
      - >-
        setup_vpc_trunk_delete.after
        | selectattr('interface_name', 'in', ['vpc200', 'vpc201', 'vpc298', 'vpc299', vpc_multi_pair_name])
        | list | length == 0
  tags: always
