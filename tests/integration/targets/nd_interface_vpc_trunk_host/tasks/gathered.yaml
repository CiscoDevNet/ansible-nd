# --- GATHERED: combine server + local criteria (AND semantics) ---

- name: "GATHERED: Combine server and local criteria (AND semantics)"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - interface_name: vpc200
        config_data:
          network_os:
            policy:
              admin_state: true
  register: nm_gathered_mixed_and

- name: "GATHERED: Verify server and local criteria use AND semantics"
  ansible.builtin.assert:
    that:
      - nm_gathered_mixed_and is not changed
      - nm_gathered_mixed_and.gathered | length == 1
      - nm_gathered_mixed_and.gathered[0].interface_name == "vpc200"

# --- GATHERED: AND semantics with non-matching local criterion ---

- name: "GATHERED: AND filter with non-matching local value"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - interface_name: vpc200
        config_data:
          network_os:
            policy:
              native_vlan: 9999
  register: nm_gathered_and_mismatch

- name: "GATHERED: Verify AND mismatch returns empty"
  ansible.builtin.assert:
    that:
      - nm_gathered_and_mismatch is not changed
      - nm_gathered_and_mismatch.gathered == []

