- name: "GATHERED: Verify case-insensitive interface name normalization"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - interface_name: VPC200
  register: nm_gathered_case

- name: "GATHERED: Verify VPC200 resolved to vpc200"
  ansible.builtin.assert:
    that:
      - nm_gathered_case is not changed
      - nm_gathered_case.gathered | length == 1
      - nm_gathered_case.gathered[0].interface_name == "vpc200"

# --- GATHERED: reject unsupported filter property ---

- name: "GATHERED: Reject unsupported filter property"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - config_data:
          network_os:
            policy:
              lacp_rate: fast
  register: nm_gathered_unsupported
  ignore_errors: true

- name: "GATHERED: Verify unsupported property is rejected"
  ansible.builtin.assert:
    that:
      - nm_gathered_unsupported is failed
      - "'lacp_rate' in nm_gathered_unsupported.msg"