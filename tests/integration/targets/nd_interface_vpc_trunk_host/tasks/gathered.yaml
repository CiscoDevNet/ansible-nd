# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# Pre-condition: merged.yaml has already created vpc200 via vpc_trunk_host_baseline
#   (switch_ip=peer1, allowed_vlans="100-200", native_vlan=99,
#    peer1_port_channel_id=200, peer2_port_channel_id=200, admin_state=true).

# --- GATHERED: no config (fetch everything) ---

- name: "GATHERED: Read all trunkVpcHost interfaces in the fabric"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
  register: nm_gathered_all

- name: "GATHERED: Verify read-only behavior"
  ansible.builtin.assert:
    that:
      - nm_gathered_all is not changed
      - nm_gathered_all.gathered is defined
      - nm_gathered_all.gathered | type_debug == "list"
      - nm_gathered_all.gathered | length >= 1
      - nm_gathered_all.before is not defined
      - nm_gathered_all.after is not defined
      - nm_gathered_all.diff is not defined
      - nm_gathered_all.proposed is not defined

# --- GATHERED: explicit empty config ---

- name: "GATHERED: Read all interfaces with explicit empty config"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config: []
  register: nm_gathered_empty_config

- name: "GATHERED: Verify explicit empty config gathers all"
  ansible.builtin.assert:
    that:
      - nm_gathered_empty_config is not changed
      - nm_gathered_empty_config.gathered == nm_gathered_all.gathered

# --- GATHERED: filter by peer1 switch_ip ---

- name: "GATHERED: Filter by peer1 switch IP"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
  register: nm_gathered_peer1

- name: "GATHERED: Verify peer1 switch filter returns vpc200"
  ansible.builtin.assert:
    that:
      - nm_gathered_peer1 is not changed
      - nm_gathered_peer1.gathered | length >= 1
      - nm_gathered_peer1.gathered | selectattr('interface_name', 'equalto', 'vpc200') | list | length == 1

# --- GATHERED: filter by peer2 switch_ip (vPC spans both peers) ---

- name: "GATHERED: Filter by peer2 switch IP"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - switch_ip: "{{ test_switch_ip_peer2 }}"
  register: nm_gathered_peer2

- name: "GATHERED: Verify peer2 switch filter also returns vpc200"
  ansible.builtin.assert:
    that:
      - nm_gathered_peer2 is not changed
      - nm_gathered_peer2.gathered | length >= 1
      - nm_gathered_peer2.gathered | selectattr('interface_name', 'equalto', 'vpc200') | list | length == 1

# --- GATHERED: filter by interface_name only ---

- name: "GATHERED: Filter by interface name only"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - interface_name: vpc200
  register: nm_gathered_name

- name: "GATHERED: Verify interface name filter"
  ansible.builtin.assert:
    that:
      - nm_gathered_name is not changed
      - nm_gathered_name.gathered | length == 1
      - nm_gathered_name.gathered[0].interface_name == "vpc200"

# --- GATHERED: filter by switch_ip + interface_name ---

- name: "GATHERED: Filter by switch and interface name"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - switch_ip: "{{ test_switch_ip_peer1 }}"
        interface_name: vpc200
  register: nm_gathered_exact

- name: "GATHERED: Verify exact switch and interface filter"
  ansible.builtin.assert:
    that:
      - nm_gathered_exact is not changed
      - nm_gathered_exact.gathered | length == 1
      - nm_gathered_exact.gathered[0].interface_name == "vpc200"

# --- GATHERED: round-trip (gathered output used as merged config) ---

- name: "GATHERED: Reuse gathered output as config in check mode"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: merged
    config: "{{ nm_gathered_exact.gathered }}"
  check_mode: true
  register: cm_reuse_gathered

- name: "GATHERED: Verify gathered output round-trips as config"
  ansible.builtin.assert:
    that:
      - cm_reuse_gathered is not changed

# --- GATHERED: filter by allowed_vlans (local post-filter) ---

- name: "GATHERED: Filter by allowed_vlans"
  cisco.nd.nd_interface_vpc_trunk_host:
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    state: gathered
    config:
      - config_data:
          network_os:
            policy:
              allowed_vlans: "100-200"
  register: nm_gathered_vlans

- name: "GATHERED: Verify allowed_vlans filter"
  ansible.builtin.assert:
    that:
      - nm_gathered_vlans is not changed
      - nm_gathered_vlans.gathered | length >= 1
      - nm_gathered_vlans.gathered | map(attribute='config_data') | map(attribute='network_os') | map(attribute='policy') | map(attribute='allowed_vlans') | reject('equalto', '100-200') | list | length == 0

