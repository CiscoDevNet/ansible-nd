      - result.deployment is not defined
  tags: delete

- name: DELETE - TC4 - GATHER - Verify force-accepted deletion result in ND
  cisco.nd.nd_manage_vrf_lite:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: gathered
    config_actions:
      save: false
      deploy: false
      type: switch
    config:
      - vrf_name: "{{ test_vrf }}"
