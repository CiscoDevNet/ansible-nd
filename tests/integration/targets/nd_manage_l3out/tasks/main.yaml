# Test code for the nd_manage_l3out module
# Copyright: (c) 2026, Cisco Systems, Inc.

# GNU General Public License v3.0+ (see LICENSE or https://www.gnu.org/licenses/gpl-3.0.txt)
#
# --- Usage ---
#
# Run the test suite with ansible-test:
#
#   ansible-test integration nd_manage_l3out
#
# --- Optional test variables ---
#
# Set the variables below in the [nd:vars] section of tests/integration/inventory.networking
#
# nd_logging_config (str, default: "")
#   Path to a JSON file conforming to logging.config.dictConfig (see
#   plugins/module_utils/common/log.py for an example). When set, the path is
#   forwarded to the module subprocess via the ND_LOGGING_CONFIG environment
#   variable, enabling file-based logging from the nd collection. Empty (the
#   default) disables logging. ansible-test strips the controller's shell env,
#   so the variable cannot be inherited from the user's shell. Add to
#   inventory.networking [nd:vars]:
#     nd_logging_config=/absolute/path/to/logging_config.json
#
# nd_test_l3out_run_id (required for ND 4.x harness scenarios)
#   Unique per-run identifier embedded in harness-created L3Out names. The
#   harness refuses to run without it and never deletes a pre-existing name.

- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'

- name: Run nd_manage_l3out state tests with optional logging env
  block:
    - name: Run ND 4.x nd_manage_l3out harness preflight
      ansible.builtin.include_tasks:
        file: nd4x_demo_preflight.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_preflight
            - nd4x_demo_merged
            - nd4x_demo_replaced
            - nd4x_demo_deleted
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_replaced
        - nd4x_demo_deleted

    - name: Pre-test cleanup
      ansible.builtin.include_tasks: setup.yaml

    - name: Run nd_manage_l3out merged state tests
      ansible.builtin.include_tasks: merged.yaml

    - name: Run nd_manage_l3out replaced state tests
      ansible.builtin.include_tasks: replaced.yaml

    - name: Run nd_manage_l3out deleted state tests
      ansible.builtin.include_tasks: deleted.yaml

    - name: Run nd_manage_l3out merged harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_merged.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_merged
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
      when: nd4x_supported | default(false) | bool

    - name: Run nd_manage_l3out replaced harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_replaced.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_replaced
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_replaced
      when: nd4x_supported | default(false) | bool

    - name: Run nd_manage_l3out deleted harness scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_deleted.yaml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_deleted
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_deleted
      when: nd4x_supported | default(false) | bool
  always:
    - name: Release controller-side ND4X nd_manage_l3out harness marker
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        state: deleted
        config:
          - name: "{{ nd4x_l3out_marker_name }}"
      when:
        - nd4x_l3out_marker_acquired | default(false) | bool
      tags:
        - always
  vars:
    ansible_command_timeout: 300
  environment:
    ND_LOGGING_CONFIG: "{{ nd_logging_config | default('') }}"
