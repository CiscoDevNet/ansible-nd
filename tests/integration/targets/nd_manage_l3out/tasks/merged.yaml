# --- MERGED CREATE: BGP L3Out ---

- name: "MERGED CREATE: Create BGP L3Out with routed interfaces (check mode)"
  cisco.nd.nd_manage_l3out: &merge_l3out_bgp
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ l3out_bgp }}"
    state: merged
  check_mode: true
  register: cm_merged_create_bgp

- name: "MERGED CREATE: Create BGP L3Out with routed interfaces (normal mode)"
  cisco.nd.nd_manage_l3out: *merge_l3out_bgp
  register: nm_merged_create_bgp

- name: "MERGED CREATE: Verify BGP L3Out creation"
  ansible.builtin.assert:
    that:
      - cm_merged_create_bgp is changed
      - nm_merged_create_bgp is changed
      - nm_merged_create_bgp.after | length >= 1

# --- MERGED IDEMPOTENCY ---

- name: "MERGED IDEMPOTENT: Re-apply BGP L3Out creation (check mode)"
  cisco.nd.nd_manage_l3out: *merge_l3out_bgp
  check_mode: true
  register: cm_merged_idem_bgp

- name: "MERGED IDEMPOTENT: Re-apply BGP L3Out creation (normal mode)"
  cisco.nd.nd_manage_l3out: *merge_l3out_bgp
  register: nm_merged_idem_bgp

- name: "MERGED IDEMPOTENT: Verify no change on second run"
  ansible.builtin.assert:
    that:
      - cm_merged_idem_bgp is not changed
      - nm_merged_idem_bgp is not changed

