# --- MERGED UPDATE ---

- name: "MERGED UPDATE: Update BGP L3Out hold_interval (check mode)"
  cisco.nd.nd_manage_l3out: &merge_l3out_bgp_updated
    output_level: "{{ nd_info.output_level }}"
    fabric_name: "{{ test_fabric_name }}"
    config:
      - "{{ l3out_bgp_updated }}"
    state: merged
  check_mode: true
  register: cm_merged_update_bgp

- name: "MERGED UPDATE: Update BGP L3Out hold_interval (normal mode)"
  cisco.nd.nd_manage_l3out: *merge_l3out_bgp_updated
  register: nm_merged_update_bgp

- name: "MERGED UPDATE: Verify BGP L3Out was updated"
  ansible.builtin.assert:
    that:
      - cm_merged_update_bgp is changed
      - nm_merged_update_bgp is changed

- name: "MERGED UPDATE: Re-apply update for idempotency"
  cisco.nd.nd_manage_l3out: *merge_l3out_bgp_updated
  register: nm_merged_update_bgp_idem

- name: "MERGED UPDATE: Verify idempotency after update"
  ansible.builtin.assert:
    that:
      - nm_merged_update_bgp_idem is not changed
