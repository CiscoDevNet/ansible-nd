---
- name: "ND4X PREFLIGHT: Require an explicit test fabric"
  ansible.builtin.assert:
    that:
      - nd_test_fabric_name is defined
      - nd_test_fabric_name | string | trim | length > 0
    fail_msg: >-
      Define nd_test_fabric_name with an existing dedicated Nexus Dashboard
      fabric before running the nd_manage_prefix_list harness.
  tags:
    - always

- name: "ND4X PREFLIGHT: Query Nexus Dashboard version"
  cisco.nd.nd_version:
    output_level: "{{ nd_info.output_level }}"
  register: nd4x_version
  tags:
    - always
- name: "ND4X PREFLIGHT: Record support for nd_manage_prefix_list harness tests"
  ansible.builtin.set_fact:
    nd4x_supported: >-
      {{
        nd4x_version.current.platformVersion
        is version('4.2.1', '>=')
      }}
  tags:
    - always

- name: "ND4X PREFLIGHT: Explain unsupported controller skip"
  ansible.builtin.debug:
    msg: >-
      Skipping ND 4.x nd_manage_prefix_list harness scenarios because
      controller version {{ nd4x_version.current.platformVersion }} is older
      than 4.2.1.
  when: not nd4x_supported | bool
  tags:
    - always

- name: "ND4X PREFLIGHT: Build fabric-wide prefix-list snapshot queries"
  ansible.builtin.set_fact:
    nd4x_prefix_list_check_mode_queries:
      - name: Snapshot all IPv4 prefix lists in the test fabric
        path: >-
          /api/v1/manage/fabrics/{{ test_fabric_name }}/ipv4PrefixLists?max=100
        expected_status: 200
        pagination:
          page_size: 100
          collection_key: ipv4PrefixLists
          max_pages: 10000
        unordered_paths: [/ipv4PrefixLists]
        ignore_keys:
          - lastUpdateTimestamp
      - name: Snapshot all IPv6 prefix lists in the test fabric
        path: >-
          /api/v1/manage/fabrics/{{ test_fabric_name }}/ipv6PrefixLists?max=100
        expected_status: 200
        pagination:
          page_size: 100
          collection_key: ipv6PrefixLists
          max_pages: 10000
        unordered_paths: [/ipv6PrefixLists]
        ignore_keys:
          - lastUpdateTimestamp
  when: nd4x_supported | bool
  tags:
    - always

- name: "ND4X PREFLIGHT: Verify both address-family snapshots exist"
  ansible.builtin.assert:
    that:
      - nd4x_prefix_list_check_mode_queries | length == 2
    fail_msg: >-
      The prefix-list harness requires one predictive snapshot for each
      address-family collection.
  when: nd4x_supported | bool
  tags:
    - always
