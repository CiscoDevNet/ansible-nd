---
- name: "OVERRIDDEN SAFETY: Fetch {{ nd4x_prefix_list_inventory_family }} prefix-list inventory page {{ nd4x_prefix_list_inventory_offset }}"
  cisco.nd.nd_rest:
    path: >-
      {{ nd4x_prefix_list_inventory_endpoint }}?max={{ nd4x_prefix_list_inventory_page_size }}&offset={{ nd4x_prefix_list_inventory_offset }}
    method: get
  register: nd4x_prefix_list_inventory_page
  changed_when: false

- name: "OVERRIDDEN SAFETY: Validate {{ nd4x_prefix_list_inventory_family }} prefix-list inventory page"
  ansible.builtin.assert:
    that:
      - nd4x_prefix_list_inventory_page.status | int == 200
      - nd4x_prefix_list_inventory_page.current is mapping
      - nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key] is defined
      - >-
        nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
        is sequence
      - >-
        nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
        is not string
      - >-
        nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
        | length <= nd4x_prefix_list_inventory_page_size
    fail_msg: >-
      Could not verify {{ nd4x_prefix_list_inventory_family }} prefix-list
      inventory page at offset {{ nd4x_prefix_list_inventory_offset }}.
      Refusing the fabric-wide overridden test.

- name: "OVERRIDDEN SAFETY: Accumulate {{ nd4x_prefix_list_inventory_family }} prefix-list inventory page"
  ansible.builtin.set_fact:
    nd4x_prefix_list_inventory: >-
      {{
        nd4x_prefix_list_inventory
        + nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
      }}
    nd4x_prefix_list_inventory_offset: >-
      {{ nd4x_prefix_list_inventory_offset + nd4x_prefix_list_inventory_page_size }}
    nd4x_prefix_list_inventory_pages: >-
      {{ nd4x_prefix_list_inventory_pages + 1 }}

- name: "OVERRIDDEN SAFETY: Require a final {{ nd4x_prefix_list_inventory_family }} prefix-list inventory page"
  ansible.builtin.assert:
    that:
      - nd4x_prefix_list_inventory_pages < nd4x_prefix_list_inventory_max_pages
    fail_msg: >-
      {{ nd4x_prefix_list_inventory_family }} prefix-list inventory exceeded
      {{ nd4x_prefix_list_inventory_max_pages }} pages. Refusing the
      fabric-wide overridden test.
  when: >-
    nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
    | length == nd4x_prefix_list_inventory_page_size

- name: "OVERRIDDEN SAFETY: Fetch the next {{ nd4x_prefix_list_inventory_family }} prefix-list inventory page"
  ansible.builtin.include_tasks: nd4x_demo_prefix_list_inventory_page.yaml
  when: >-
    nd4x_prefix_list_inventory_page.current[nd4x_prefix_list_inventory_collection_key]
    | length == nd4x_prefix_list_inventory_page_size
