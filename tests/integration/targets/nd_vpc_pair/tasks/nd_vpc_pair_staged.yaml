##############################################
##                 SETUP                    ##
##############################################
# Staged-config + idempotence coverage with per-switch configSyncStatus capture.
#
# Covers the staged "create-now, save/deploy-later" workflow for issue #467:
#   - Atomic create+save+deploy converges and repeats are idempotent (TC3/TC4).
#   - G-A: merged(save=true, deploy=false) on an existing, never-deployed pair
#     saves (configSave) without deploying (TC5 G-A).
#   - G-B: a later merged(save=true, deploy=true) on that saved-but-undeployed
#     pair deploys it and converges the switches to inSync (TC5 G-B).
# Background and root-cause analysis: delete_temp/docs/nd_vpc_pair_467_report.md.

- name: Import nd_vpc_pair Base Tasks
  ansible.builtin.import_tasks: base_tasks.yaml
  tags: staged

- name: STAGED - Set nd_info defaults
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'
      timeout: "{{ nd_vpc_pair_module_timeout | default(600) }}"
  tags: staged

- name: STAGED - Setup config
  ansible.builtin.set_fact:
    vpc_pair_conf:
      - peer1_switch_id: "{{ test_switch1 }}"
        peer2_switch_id: "{{ test_switch2 }}"
        use_virtual_peer_link: true
  delegate_to: localhost
  tags: staged

- name: STAGED - Ensure clean before test
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: deleted
    config_actions: {save: false, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  failed_when: false
  tags: staged

##############################################
##      TC1 - Controller-only create        ##
##############################################

- name: STAGED - TC1 - merged(save=false, deploy=false) creates pair intent
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: false, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result
  tags: staged

- name: STAGED - TC1 - ASSERT - pair created, no deploy performed
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
      - result.deployment is not defined
    fail_msg: "merged(F,F) should create the pair intent without deploying."
  tags: staged

- name: STAGED - TC1 - Capture per-switch configSyncStatus after create
  cisco.nd.nd_rest:
    method: GET
    path: "/api/v1/manage/fabrics/{{ test_fabric }}/switches"
  register: staged_switches
  failed_when: false
  tags: staged

- name: STAGED - TC1 - Show captured sync status
  ansible.builtin.debug:
    msg: >-
      configSyncStatus after create =
      {{ staged_switches.current.switches | default([])
         | map(attribute='additionalData') | map('default', {})
         | map(attribute='configSyncStatus') | list }}
  tags: staged

##############################################
##      TC2 - Idempotence of create         ##
##############################################

- name: STAGED - TC2 - repeat merged(F,F) is idempotent
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: false, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result
  tags: staged

- name: STAGED - TC2 - ASSERT - no change on repeat
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
  tags: staged

##############################################
##   TC3 - Atomic create+save+deploy path   ##
##############################################

- name: STAGED - TC3 - Reset to clean before atomic deploy
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: deleted
    config_actions: {save: false, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  failed_when: false
  tags: staged

- name: STAGED - TC3 - reset connection
  ansible.builtin.meta: reset_connection
  tags: staged

- name: STAGED - TC3 - Atomic merged(save=true, deploy=true) converges
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: true, deploy: true, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result_atomic
  tags: staged

- name: STAGED - TC3 - ASSERT - configSave + deploy fired
  ansible.builtin.assert:
    that:
      - result_atomic.failed == false
      - result_atomic.changed == true
      - result_atomic.deployment is defined
      - >
        (result_atomic.deployment.response
         | selectattr('REQUEST_PATH', 'search', '/actions/configSave')
         | list | length) > 0
      - >
        (result_atomic.deployment.response
         | selectattr('REQUEST_PATH', 'search', '/switchActions/deploy')
         | list | length) > 0
    fail_msg: "Atomic create+save+deploy should call configSave and deploy."
  tags: staged

- name: STAGED - TC3 - Capture per-switch configSyncStatus after deploy
  cisco.nd.nd_rest:
    method: GET
    path: "/api/v1/manage/fabrics/{{ test_fabric }}/switches"
  register: staged_switches_after
  failed_when: false
  tags: staged

- name: STAGED - TC3 - ASSERT - switches converged to inSync
  ansible.builtin.assert:
    that:
      - >
        (staged_switches_after.current.switches | default([])
         | map(attribute='additionalData') | map('default', {})
         | map(attribute='configSyncStatus') | map('default', '')
         | select('equalto', 'pending') | list | length) == 0
    fail_msg: "After atomic deploy, no switch should remain in configSyncStatus=pending."
  tags: staged

##############################################
##   TC4 - Idempotence after convergence    ##
##############################################

- name: STAGED - TC4 - repeat atomic merged(T,T) is idempotent
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: true, deploy: true, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result
  tags: staged

- name: STAGED - TC4 - ASSERT - no change / no deploy when already in-sync
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
  tags: staged

####################################################
##  TC5 (G-A/G-B) - staged save-then-later-deploy  ##
####################################################
# Regression coverage for the staged workflow fixed for issue #467:
#   G-A: merged(save=true, deploy=false) on an existing, never-deployed pair
#        must save (configSave) WITHOUT deploying.
#   G-B: a later merged(save=true, deploy=true) on that saved-but-undeployed
#        pair must actually deploy and converge the switches to inSync.

- name: STAGED - TC5 - Reset to a clean, never-deployed pair
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: deleted
    config_actions: {save: true, deploy: true, type: switch}
    config: "{{ vpc_pair_conf }}"
  failed_when: false
  tags: staged

- name: STAGED - TC5 - reset connection
  ansible.builtin.meta: reset_connection
  tags: staged

- name: STAGED - TC5 - Create controller-only pair (save=false, deploy=false)
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: false, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result
  tags: staged

- name: STAGED - TC5 - ASSERT - pair created, not deployed
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
  tags: staged

# ---- G-A: save without deploy on the existing pending pair ----
- name: STAGED - TC5 (G-A) - merged(save=true, deploy=false) saves pending pair
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: true, deploy: false, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result_ga
  tags: staged

- name: STAGED - TC5 (G-A) - ASSERT - configSave fired, deploy did NOT
  ansible.builtin.assert:
    that:
      - result_ga.failed == false
      - result_ga.changed == true
      - result_ga.deployment is defined
      - >
        (result_ga.deployment.response
         | selectattr('REQUEST_PATH', 'search', '/actions/configSave')
         | list | length) > 0
      - >
        (result_ga.deployment.response
         | selectattr('REQUEST_PATH', 'search', '/switchActions/deploy')
         | list | length) == 0
    fail_msg: >-
      G-A regression (#467): merged(save=true, deploy=false) on an existing
      pending pair must call configSave and must NOT deploy.
  tags: staged

# ---- G-B: later deploy converges the saved-but-undeployed pair ----
- name: STAGED - TC5 (G-B) - reset connection
  ansible.builtin.meta: reset_connection
  tags: staged

- name: STAGED - TC5 (G-B) - later merged(save=true, deploy=true) deploys pair
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions: {save: true, deploy: true, type: switch}
    config: "{{ vpc_pair_conf }}"
  register: result_gb
  tags: staged

- name: STAGED - TC5 (G-B) - ASSERT - deploy fired
  ansible.builtin.assert:
    that:
      - result_gb.failed == false
      - result_gb.changed == true
      - result_gb.deployment is defined
      - >
        (result_gb.deployment.response
         | selectattr('REQUEST_PATH', 'search', '/switchActions/deploy')
         | list | length) > 0
    fail_msg: >-
      G-B regression (#467): a later merged(save=true, deploy=true) on a
      never-deployed pair must deploy it.
  tags: staged

- name: STAGED - TC5 (G-B) - Capture per-switch configSyncStatus after later deploy
  cisco.nd.nd_rest:
    method: GET
    path: "/api/v1/manage/fabrics/{{ test_fabric }}/switches"
  register: staged_switches_gb
  failed_when: false
  tags: staged

- name: STAGED - TC5 (G-B) - ASSERT - switches converged to inSync
  ansible.builtin.assert:
    that:
      - >
        (staged_switches_gb.current.switches | default([])
         | map(attribute='additionalData') | map('default', {})
         | map(attribute='configSyncStatus') | map('default', '')
         | select('equalto', 'pending') | list | length) == 0
    fail_msg: >-
      G-B regression (#467): after the later deploy, no switch should remain
      in configSyncStatus=pending.
  tags: staged

##############################################
##                CLEANUP                  ##
##############################################

- name: STAGED - CLEANUP - Remove vPC pair and deploy removal
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: deleted
    config_actions: {save: true, deploy: true, type: switch}
    config: "{{ vpc_pair_conf }}"
  failed_when: false
  tags: staged
