##############################################
##                 SETUP                    ##
##############################################
# check_mode coverage for nd_manage_vpc_pair: the module must PREDICT a change
# (changed=true) without persisting anything to the controller or switches.

- name: Import nd_vpc_pair Base Tasks
  ansible.builtin.import_tasks: base_tasks.yaml
  tags: checkmode

- name: CHECKMODE - Set nd_info defaults
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'
      timeout: "{{ nd_vpc_pair_module_timeout | default(600) }}"
  tags: checkmode

- name: CHECKMODE - Setup config
  ansible.builtin.set_fact:
    vpc_pair_conf:
      - peer1_switch_id: "{{ test_switch1 }}"
        peer2_switch_id: "{{ test_switch2 }}"
        use_virtual_peer_link: true
  delegate_to: localhost
  tags: checkmode

##############################################
##               CHECK MODE                ##
##############################################

# TC1 - merged in check_mode predicts change but must not persist
- name: CHECKMODE - TC1 - merged create (check_mode) predicts change
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions:
      save: false
      deploy: false
      type: switch
    config: "{{ vpc_pair_conf }}"
  check_mode: true
  register: result
  tags: checkmode

- name: CHECKMODE - TC1 - ASSERT - change predicted, nothing failed
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
    fail_msg: "check_mode merged should predict changed=true without failing."
  tags: checkmode

- name: CHECKMODE - TC1 - GATHER - confirm nothing was persisted
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    state: gathered
    fabric_name: "{{ test_fabric }}"
    config_actions:
      save: false
      deploy: false
      type: switch
    config: "{{ vpc_pair_conf }}"
  register: verify_result
  tags: checkmode

- name: CHECKMODE - TC1 - ASSERT - no pair created by check_mode
  ansible.builtin.assert:
    that:
      - verify_result.failed == false
      - (verify_result.gathered.vpc_pairs | default([]) | length) == 0
    fail_msg: "check_mode must not create a vPC pair on the controller."
  tags: checkmode

# TC2 - repeated check_mode is stable (still predicts change, still no persist)
- name: CHECKMODE - TC2 - repeat merged (check_mode) still predicts change
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: merged
    config_actions:
      save: false
      deploy: false
      type: switch
    config: "{{ vpc_pair_conf }}"
  check_mode: true
  register: result
  tags: checkmode

- name: CHECKMODE - TC2 - ASSERT - still predicted, still no persist
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == true
  tags: checkmode

##############################################
##                CLEANUP                  ##
##############################################

- name: CHECKMODE - CLEANUP - Ensure no vPC pair remains
  cisco.nd.nd_manage_vpc_pair:
    <<: *nd_info
    fabric_name: "{{ test_fabric }}"
    state: deleted
    config_actions:
      save: false
      deploy: false
      type: switch
    config: "{{ vpc_pair_conf }}"
  failed_when: false
  tags: checkmode
