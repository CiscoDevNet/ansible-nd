##############################################
##               SETUP                      ##
##############################################

- name: Delete Resources
  cisco.nd.nd_manage_resource_manager: &rm_delete
    state: deleted                                 # choose form [merged, deleted, gathered]
    fabric_name: "{{ ansible_it_fabric }}"
    config:
      - entity_name: "l3_vni_fabric"               # A unique name to identify the resource
        pool_type: "ID"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "L3_VNI"                        # Based on the 'poolType', select appropriate name
        scope_type: "fabric"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']

      - entity_name: "l2_vni_fabric"               # A unique name to identify the resource
        pool_type: "ID"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "L2_VNI"                        # Based on the 'poolType', select appropriate name
        scope_type: "fabric"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']

      - entity_name: "loopback_dev"                # A unique name to identify the resource
        pool_type: "ID"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "LOOPBACK_ID"                   # Based on the 'poolType', select appropriate name
        scope_type: "device"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
        switches: # provide the switch information to which the given resource is attached
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"

      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}" # A unique name to identify the resource
        pool_type: "ID"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "VPC_ID"                        # Based on the 'poolType', select appropriate name
        scope_type: "device_pair"                  # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
        switches: # provide the switch information to which the given resource is attached
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"

      - entity_name: "mmudigon-2"                  # A unique name to identify the resource
        pool_type: "IP"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "LOOPBACK0_IP_POOL"             # Based on the 'poolType', select appropriate name
        scope_type: "fabric"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}" # A unique name to identify the resource
        pool_type: "IP"                            # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "LOOPBACK1_IP_POOL"             # Based on the 'poolType', select appropriate name
        scope_type: "device_interface"             # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
        switches: # provide the switch information to which the given resource is attached
          - "{{ ansible_switch1 }}"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_3 }}"  # A unique name to identify the resource
        pool_type: "SUBNET"                        # choose from ['ID', 'IP', 'SUBNET']
        pool_name: "SUBNET"                        # Based on the 'poolType', select appropriate name
        scope_type: "link"                         # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
        switches: # provide the switch information to which the given resource is attached
          - "{{ ansible_switch1 }}"
  register: result

- name: Assert
  ansible.builtin.assert:
    that:
      - 'result.failed | default(false) == false'

- name: Assert API response codes
  ansible.builtin.assert:
    that:
      - result.api_response | default([]) | rejectattr('RETURN_CODE', 'equalto', 200) | list | length == 0
  when: result.api_response is defined

- name: Run resource manager gathered tests
  block:
    ##############################################
    ##                MERGE                     ##
    ##############################################

    - name: Create Resources
      cisco.nd.nd_manage_resource_manager:
        state: merged                                # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - entity_name: "l3_vni_fabric"             # A unique name to identify the resource
            pool_type: "ID"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "L3_VNI"                      # Based on the 'poolType', select appropriate name
            scope_type: "fabric"                     # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            resource: "101"                          # The value of the resource being created

          - entity_name: "l2_vni_fabric"             # A unique name to identify the resource
            pool_type: "ID"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "L2_VNI"                      # Based on the 'poolType', select appropriate name
            scope_type: "fabric"                     # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            resource: "102"                          # The value of the resource being created

          - entity_name: "loopback_dev"              # A unique name to identify the resource
            pool_type: "ID"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "LOOPBACK_ID"                 # Based on the 'poolType', select appropriate name
            scope_type: "device"                     # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            switches: # provide the switch information to which the given resource is to be attached
              - "{{ ansible_switch1 }}"
              - "{{ ansible_switch2 }}"
            resource: "200"                          # The value of the resource being created

          - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}"  # A unique name to identify the resource
            pool_type: "ID"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "VPC_ID"                      # Based on the 'poolType', select appropriate name
            scope_type: "device_pair"                # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            switches: # provide the switch information to which the given resource is to be attached
              - "{{ ansible_switch1 }}"
              - "{{ ansible_switch2 }}"
            resource: "500"                          # The value of the resource being created

          - entity_name: "mmudigon-2"                # A unique name to identify the resource
            pool_type: "IP"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "LOOPBACK0_IP_POOL"           # Based on the 'poolType', select appropriate name
            scope_type: "fabric"                     # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            resource: "110.1.1.1"                    # The value of the resource being created

          - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}"  # A unique name to identify the resource
            pool_type: "IP"                          # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "LOOPBACK1_IP_POOL"           # Based on the 'poolType', select appropriate name
            scope_type: "device_interface"           # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            switches: # provide the switch information to which the given resource is to be attached
              - "{{ ansible_switch1 }}"
            resource: "fe:80::04"                    # The value of the resource being created

          - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_3 }}"  # A unique name to identify the resource
            pool_type: "SUBNET"                      # choose from ['ID', 'IP', 'SUBNET']
            pool_name: "SUBNET"                      # Based on the 'poolType', select appropriate name
            scope_type: "link"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
            switches: # provide the switch information to which the given resource is to be attached
              - "{{ ansible_switch1 }}"
            resource: "fe:80:0505::05/64"            # The value of the resource being created
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'result.changed == true'
          - '(result["diff"][0]["merged"] | length) == 8'
          - '(result["diff"][0]["deleted"] | length) == 0'
          - 'result.failed | default(false) == false'

    - name: ASSERT - Check API result details
      ansible.builtin.assert:
        that:
          - '(result["api_response"] | length) == 1'
          - 'result["api_result"][0]["success"] == true'
          - '(result["api_diff"][0]["merged"] | length) == (result["diff"][0]["merged"] | length)'
          - '(result["api_payload"][0]["resources"] | length) == (result["diff"][0]["merged"] | length)'
      when: result.api_response is defined

    - name: Assert output fields when API response is absent
      ansible.builtin.assert:
        that:
          - 'result.changed == true'
          - '(result["after"] | length) == 7' # This is 7 as we are creating 2 diff resources for entity loopback_dev but while returning we are combining like while creating we are passing in single config
      when: result.api_response is not defined


    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'item["RETURN_CODE"] == 200'
      loop: '{{ result.api_response | default([]) }}'
      when: result.api_response is defined

    ##############################################
    ##               GATHERED                      ##
    ##############################################

    - name: Gathered all Resources - false filters
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

    - name: Creating entity_names
      ansible.builtin.set_fact:
        entity_names:
          - "l3_vni_fabric"
          - "l2_vni_fabric"
          - "loopback_dev"
          - "{{ ansible_sno_2 }}~{{ ansible_sno_1 }}"
          - "{{ ansible_sno_1 }}~{{ intf_1_10 }}"
          - "{{ ansible_sno_2 }}~{{ intf_1_3 }}~{{ ansible_sno_1 }}~{{ intf_1_3 }}"
          - "mmudigon-2"

    - name: Gathered Resources - filter by entity name
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - entity_name: "l3_vni_fabric"             # A unique name to identify the resource
          - entity_name: "l2_vni_fabric"             # A unique name to identify the resource
          - entity_name: "loopback_dev"              # A unique name to identify the resource
          - entity_name: "{{ ansible_sno_2 }}~{{ ansible_sno_1 }}"  # A unique name to identify the resource
          - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}"  # A unique name to identify the resource
          - entity_name: "mmudigon-2"  # A unique name to identify the resource
          - entity_name: "{{ ansible_sno_2 }}~{{ intf_1_3 }}~{{ ansible_sno_1 }}~{{ intf_1_3 }}"  # A unique name to identify the resource

      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) == (entity_names | length)'
          - '(result["gathered"] | map(attribute="entity_name") | sort | list) == (entity_names | sort | list)'

    - name: Gathered Resources - filter by switch 1
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
      register: result

    - name: ASSERT - Check switch 1 filter returned resources
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'ansible_switch1 in (item["switches"] | default([]))'
      loop: '{{ result.gathered }}'

    - name: Gathered Resources - filter by switch 2
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch2 }}"
      register: result

    - name: ASSERT - Check switch 2 filter returned resources
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'ansible_switch2 in (item["switches"] | default([]))'
      loop: '{{ result.gathered }}'

    - name: Gathered Resources - filter by fabric and pool name
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - pool_name: "BGP_ASN_ID"                  # Based on the 'poolType', select appropriate name
          - pool_name: "L3_VNI"                      # Based on the 'poolType', select appropriate name
          - pool_name: "L2_VNI"                      # Based on the 'poolType', select appropriate name
          - pool_name: "LOOPBACK_ID"                 # Based on the 'poolType', select appropriate name
          - pool_name: "VPC_PEER_LINK_VLAN"          # Based on the 'poolType', select appropriate name
          - pool_name: "VPC_ID"                      # Based on the 'poolType', select appropriate name
          - pool_name: "LOOPBACK0_IP_POOL"           # Based on the 'poolType', select appropriate name
          - pool_name: "LOOPBACK1_IP_POOL"           # Based on the 'poolType', select appropriate name
          - pool_name: "SUBNET"                      # Based on the 'poolType', select appropriate name
      register: result

    - name: ASSERT - Check pool name filter returned resources
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'item["pool_name"] in ["BGP_ASN_ID",
                                    "L3_VNI",
                                    "L2_VNI",
                                    "LOOPBACK_ID",
                                    "VPC_PEER_LINK_VLAN",
                                    "VPC_ID",
                                    "LOOPBACK0_IP_POOL",
                                    "LOOPBACK1_IP_POOL",
                                    "SUBNET"]'
      loop: '{{ result.gathered }}'

    - name: Gathered Resources - filter by resource
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - resource: "102"                            # The value of the created L2_VNI resource
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'
          - '(result["gathered"] | map(attribute="resource") | unique | list) == ["102"]'

    - name: Gathered Resources - filter by scope type
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - scope_type: "fabric"                       # choose from ['fabric', 'device', device_interface', 'device_pair', 'link']
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'
          - '(result["gathered"] | map(attribute="scope_type") | unique | list) == ["fabric"]'

    - name: Gathered Resources - filter by pool type
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - pool_type: "ID"                            # choose from ['ID', 'IP', 'SUBNET']
      register: result

    - name: Set loopback device gathered resource from pool type filter
      ansible.builtin.set_fact:
        loopback_dev_gathered: >-
          {{ result.gathered
             | selectattr("entity_name", "equalto", "loopback_dev")
             | selectattr("pool_name", "equalto", "LOOPBACK_ID")
             | selectattr("resource", "equalto", "200")
             | list }}

    - name: ASSERT - Check separate switch entries after pool type filter
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'
          - '(result["gathered"] | map(attribute="pool_type") | unique | list) == ["ID"]'
          - '(loopback_dev_gathered | length) == 1'
          - '(loopback_dev_gathered | map(attribute="switches") | flatten | sort) == ([ansible_switch1, ansible_switch2] | sort)'

    - name: Gathered Resources - filter by pool name and resource
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - pool_name: "L2_VNI"                       # Based on the 'poolType', select appropriate name
            resource: "102"                           # The value of the created L2_VNI resource
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) == 1'
          - 'result["gathered"][0]["pool_name"] == "L2_VNI"'
          - 'result["gathered"][0]["resource"] == "102"'

    - name: Gathered Resources - filter by switch and pool name
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - pool_name: "BGP_ASN_ID"                  # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "L3_VNI"                      # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "L2_VNI"                      # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "LOOPBACK_ID"                 # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "VPC_PEER_LINK_VLAN"          # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "VPC_ID"                      # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "LOOPBACK0_IP_POOL"           # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "LOOPBACK1_IP_POOL"           # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - pool_name: "SUBNET"                      # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
      register: result

    - name: ASSERT - Check switch and pool name filter returned resources
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'ansible_switch1 in (item["switches"] | default([])) or
             item["pool_name"] in ["BGP_ASN_ID",
                                   "L3_VNI",
                                   "L2_VNI",
                                   "LOOPBACK_ID",
                                   "VPC_PEER_LINK_VLAN",
                                   "VPC_ID",
                                   "LOOPBACK0_IP_POOL",
                                   "LOOPBACK1_IP_POOL",
                                   "SUBNET"]'
      loop: '{{ result.gathered }}'

    - name: Gathered Resources - filter by combined switch and pool name
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - pool_name: "LOOPBACK_ID"                 # Based on the 'poolType', select appropriate name
            switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
      register: result

    - name: ASSERT - Check combined switch and pool name condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) == 1'
          - 'result["gathered"][0]["entity_name"] == "loopback_dev"'
          - 'result["gathered"][0]["pool_name"] == "LOOPBACK_ID"'
          - 'ansible_switch1 in (result["gathered"][0]["switches"] | default([]))'
          - '(result["gathered"][0]["switches"] | length) == 1'

    - name: Gathered Resources - mixed gathered
      cisco.nd.nd_manage_resource_manager:
        state: gathered                                 # choose form [merged, deleted, gathered]
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - entity_name: "l2_vni_fabric"             # A unique name to identify the resource
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch2 }}"
          - pool_name: "LOOPBACK_ID"                 # Based on the 'poolType', select appropriate name
          - pool_name: "VPC_ID"                      # Based on the 'poolType', select appropriate name
          - switches: # provide the switch information to which the given resource is attached
              - "{{ ansible_switch1 }}"
      register: result

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | length) != 0'

  ##############################################
  ##             CLEANUP                      ##
  ##############################################

  always:

    - name: Delete Resources
      cisco.nd.nd_manage_resource_manager: *rm_delete
      register: result
      when: it_context is not defined

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'result.failed | default(false) == false'
          - 'result.changed == true'
          - '(result["diff"][0]["merged"] | length) == 0'
          - '(result["diff"][0]["deleted"] | length) == 8'
          - '(result["diff"][0]["gathered"] | length) == 0'
      when: it_context is not defined

    - name: ASSERT - Check API result details
      ansible.builtin.assert:
        that:
          - '(result["api_response"] | length) == 1'
          - 'result["api_result"][0]["success"] == true'
          - '(result["api_diff"][0]["deleted"] | length) == (result["diff"][0]["deleted"] | length)'
          - '(result["api_payload"][0]["resourceIds"] | length) == (result["diff"][0]["deleted"] | length)'
      when:
        - it_context is not defined
        - result.api_response is defined

    - name: ASSERT - Check output fields when API response is absent
      ansible.builtin.assert:
        that:
          - 'result["output_level"] == "normal"'
          - '(result["before"] | length) == 7' # This is 7 as we are creating 2 diff resources for entity loopback_dev but while returning we are combining like while creating we are passing in single config
          - 'result["after"] == []'
          - 'result.changed == true'
      when:
        - it_context is not defined
        - result.api_response is not defined

    - name: ASSERT - Check condition
      ansible.builtin.assert:
        that:
          - 'item["RETURN_CODE"] == 200'
      loop: '{{ result.api_response | default([]) }}'
      when:
        - it_context is not defined
        - result.api_response is defined
