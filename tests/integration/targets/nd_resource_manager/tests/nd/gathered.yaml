---
- name: Set VXLAN iBGP all-pool resource config
  ansible.builtin.set_fact:
    rm_expected_resource_count: 26
    rm_ibgp_all_pools_config:
      - entity_name: "ibgp_all_l3_vni_fabric"
        pool_type: "ID"
        pool_name: "L3_VNI"
        scope_type: "fabric"
        resource: "50061"
      - entity_name: "ibgp_all_l2_vni_fabric"
        pool_type: "ID"
        pool_name: "L2_VNI"
        scope_type: "fabric"
        resource: "30061"
      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2}}"
        pool_type: "ID"
        pool_name: "VPC_DOMAIN_ID"
        scope_type: "fabric"
        resource: "61"
      - entity_name: "ibgp_all_bgp_asn_fabric"
        pool_type: "ID"
        pool_name: "BGP_ASN_ID"
        scope_type: "fabric"
        resource: "10061"
      - entity_name: "ibgp_all_anycast_rp_fabric"
        pool_type: "IP"
        pool_name: "ANYCAST_RP_IP_POOL"
        scope_type: "fabric"
        resource: "10.254.254.61"
      - entity_name: "ibgp_all_mcast_fabric"
        pool_type: "IP"
        pool_name: "MCAST_IP_POOL"
        scope_type: "fabric"
        resource: "239.1.1.61"
      - entity_name: "ibgp_all_mpls_loopback_fabric"
        pool_type: "IP"
        pool_name: "MPLS_LOOPBACK_IP_POOL"
        scope_type: "fabric"
        resource: "10.255.0.61"
      - entity_name: "ibgp_all_hypershield_ha_source_fabric"
        pool_type: "IP"
        pool_name: "HYPERSHIELD_HA_SOURCE_IP_POOL"
        scope_type: "fabric"
        resource: "10.255.60.1"
      - entity_name: "ibgp_all_loopback0_fabric"
        pool_type: "IP"
        pool_name: "LOOPBACK0_IP_POOL"
        scope_type: "fabric"
        resource: "10.2.0.61"
      - entity_name: "ibgp_all_fex_device"
        pool_type: "ID"
        pool_name: "fexId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "161"
      - entity_name: "ibgp_all_loopback_device"
        pool_type: "ID"
        pool_name: "loopbackId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "162"
      - entity_name: "ibgp_all_port_channel_device"
        pool_type: "ID"
        pool_name: "portChannelId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "661"
      - entity_name: "ibgp_all_route_map_device"
        pool_type: "ID"
        pool_name: "ROUTE_MAP_SEQUENCE_NUMBER_POOL"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "163"
      - entity_name: "ibgp_all_network_vlan_device"
        pool_type: "ID"
        pool_name: "networkVlan"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "2461"
      - entity_name: "ibgp_all_object_tracking_device"
        pool_type: "ID"
        pool_name: "OBJECT_TRACKING_NUMBER_POOL"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "164"
      - entity_name: "ibgp_all_sla_device"
        pool_type: "ID"
        pool_name: "SLA_ID"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10061"
      - entity_name: "ibgp_all_service_network_vlan_device"
        pool_type: "ID"
        pool_name: "serviceNetworkVlan"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "3061"
      - entity_name: "ibgp_all_vrf_vlan_device"
        pool_type: "ID"
        pool_name: "vrfVlan"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "2061"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}"
        pool_type: "IP"
        pool_name: "LOOPBACK1_IP_POOL"
        scope_type: "device_interface"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.3.0.61"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_2 }}"
        pool_type: "ID"
        pool_name: "topDownL3Dot1q"
        scope_type: "device_interface"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "161"
      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}~ibgp_all_vpc_id_pair"
        pool_type: "ID"
        pool_name: "vpcId"
        scope_type: "device_pair"
        switches:
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"
        resource: "61"
      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}"
        pool_type: "ID"
        pool_name: "vpcPeerLinkVlan"
        scope_type: "device_pair"
        switches:
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"
        resource: "3600"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_3 }}"
        pool_type: "SUBNET"
        pool_name: "DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.33.61.0/30"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_2 }}~{{ ansible_sno_2 }}~{{ intf_1_2 }}"
        pool_type: "SUBNET"
        pool_name: "IPv6 DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "fd00::a61:10/126"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}~{{ ansible_sno_2 }}~{{ intf_1_10 }}"
        pool_type: "SUBNET"
        pool_name: "HYPERSHIELD_HA_PEER_LINK_SUBNET_POOL"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.255.61.0/30"
      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_2 }}"
        pool_type: "SUBNET"
        pool_name: "SUBNET"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.4.61.0/30"

- name: Set expected VXLAN iBGP entity and pool lists
  ansible.builtin.set_fact:
    rm_expected_entity_names: "{{ rm_ibgp_all_pools_config | map(attribute='entity_name') | list }}"
    rm_expected_pool_names: "{{ rm_ibgp_all_pools_config | map(attribute='pool_name') | list }}"
    rm_ibgp_all_pools_entity_filter: []

- name: Build VXLAN iBGP gathered entity filter
  ansible.builtin.set_fact:
    rm_ibgp_all_pools_entity_filter: "{{ rm_ibgp_all_pools_entity_filter + [{'entity_name': item}] }}"
  loop: "{{ rm_expected_entity_names }}"

- name: Print rm_ibgp_all_pools_entity_filter
  ansible.builtin.debug:
    var: rm_ibgp_all_pools_entity_filter

