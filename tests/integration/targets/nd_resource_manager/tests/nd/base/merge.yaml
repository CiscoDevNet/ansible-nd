---
- name: BASE common pools - Set resource config
  ansible.builtin.set_fact:
    rm_test_config:
      - entity_name: "base_l3_vni_fabric"
        pool_type: "ID"
        pool_name: "L3_VNI"
        scope_type: "fabric"
        resource: "50051"

      - entity_name: "base_l2_vni_fabric"
        pool_type: "ID"
        pool_name: "L2_VNI"
        scope_type: "fabric"
        resource: "30051"

      - entity_name: "base_vpc_domain_fabric"
        pool_type: "ID"
        pool_name: "VPC_DOMAIN_ID"
        scope_type: "fabric"
        resource: "51"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_3 }}"
        pool_type: "SUBNET"
        pool_name: "DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.33.10.0/30"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_2 }}~{{ ansible_sno_2 }}~{{ intf_1_2 }}"
        pool_type: "SUBNET"
        pool_name: "IPv6 DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "fd00::a33:10/126"

      - entity_name: "base_hypershield_ha_source_fabric"
        pool_type: "IP"
        pool_name: "HYPERSHIELD_HA_SOURCE_IP_POOL"
        scope_type: "fabric"
        resource: "10.255.50.1"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}~{{ ansible_sno_2 }}~{{ intf_1_10 }}"
        pool_type: "SUBNET"
        pool_name: "HYPERSHIELD_HA_PEER_LINK_SUBNET_POOL"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "10.255.51.0/30"

      - entity_name: "base_fex_device"
        pool_type: "ID"
        pool_name: "fexId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "151"

      - entity_name: "base_loopback_device"
        pool_type: "ID"
        pool_name: "loopbackId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "151"

      - entity_name: "base_port_channel_device"
        pool_type: "ID"
        pool_name: "portChannelId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "651"

      - entity_name: "base_route_map_device"
        pool_type: "ID"
        pool_name: "ROUTE_MAP_SEQUENCE_NUMBER_POOL"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "151"

      - entity_name: "base_network_vlan_device"
        pool_type: "ID"
        pool_name: "networkVlan"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "2451"

      - entity_name: "base_loopback0_fabric"
        pool_type: "IP"
        pool_name: "LOOPBACK0_IP_POOL"
        scope_type: "fabric"
        resource: "10.2.0.51"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}"
        pool_type: "ID"
        pool_name: "topDownL3Dot1q"
        scope_type: "device_interface"
        switches:
          - "{{ ansible_switch1 }}"
        resource: "151"

      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}~base_vpc_id_pair"
        pool_type: "ID"
        pool_name: "vpcId"
        scope_type: "device_pair"
        switches:
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"
        resource: "51"
    rm_test_delete_config:
      - entity_name: "base_l3_vni_fabric"
        pool_type: "ID"
        pool_name: "L3_VNI"
        scope_type: "fabric"

      - entity_name: "base_l2_vni_fabric"
        pool_type: "ID"
        pool_name: "L2_VNI"
        scope_type: "fabric"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_3 }}~{{ ansible_sno_2 }}~{{ intf_1_3 }}"
        pool_type: "SUBNET"
        pool_name: "DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_2 }}~{{ ansible_sno_2 }}~{{ intf_1_2 }}"
        pool_type: "SUBNET"
        pool_name: "IPv6 DCI subnet pool"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_hypershield_ha_source_fabric"
        pool_type: "IP"
        pool_name: "HYPERSHIELD_HA_SOURCE_IP_POOL"
        scope_type: "fabric"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}~{{ ansible_sno_2 }}~{{ intf_1_10 }}"
        pool_type: "SUBNET"
        pool_name: "HYPERSHIELD_HA_PEER_LINK_SUBNET_POOL"
        scope_type: "link"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_fex_device"
        pool_type: "ID"
        pool_name: "fexId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_loopback_device"
        pool_type: "ID"
        pool_name: "loopbackId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_port_channel_device"
        pool_type: "ID"
        pool_name: "portChannelId"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_route_map_device"
        pool_type: "ID"
        pool_name: "ROUTE_MAP_SEQUENCE_NUMBER_POOL"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_network_vlan_device"
        pool_type: "ID"
        pool_name: "networkVlan"
        scope_type: "device"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "base_loopback0_fabric"
        pool_type: "IP"
        pool_name: "LOOPBACK0_IP_POOL"
        scope_type: "fabric"

      - entity_name: "{{ ansible_sno_1 }}~{{ intf_1_10 }}"
        pool_type: "ID"
        pool_name: "topDownL3Dot1q"
        scope_type: "device_interface"
        switches:
          - "{{ ansible_switch1 }}"

      - entity_name: "{{ ansible_sno_1 }}~{{ ansible_sno_2 }}~base_vpc_id_pair"
        pool_type: "ID"
        pool_name: "vpcId"
        scope_type: "device_pair"
        switches:
          - "{{ ansible_switch1 }}"
          - "{{ ansible_switch2 }}"
    rm_expected_resource_count: 15

- name: BASE common pools - Pre-clean resources
  cisco.nd.nd_manage_resource_manager: &rm_delete
    state: deleted
    fabric_name: "{{ ansible_it_fabric }}"
    config: "{{ rm_test_delete_config }}"
  register: result

- name: BASE common pools - Assert pre-clean did not fail
  ansible.builtin.assert:
    that:
      - 'result.failed | default(false) == false'
      - result.api_response | default([]) | rejectattr('RETURN_CODE', 'equalto', (207 if result.changed else 200)) | list | length == 0

- block:
    - name: BASE common pools - Create resources
      cisco.nd.nd_manage_resource_manager: &rm_merge
        state: merged
        fabric_name: "{{ ansible_it_fabric }}"
        config: "{{ rm_test_config }}"
      register: result

    - name: BASE common pools - Assert create result
      ansible.builtin.assert:
        that:
          - 'result.changed == true'
          - '(result["diff"][0]["merged"] | length) == rm_expected_resource_count'
          - '(result["diff"][0]["deleted"] | length) == 0'
          - 'result.failed | default(false) == false'

    - name: BASE common pools - Assert create API details
      ansible.builtin.assert:
        that:
          - '(result["api_response"] | length) == 1'
          - 'result["api_result"][0]["success"] == true'
          - '(result["api_diff"][0]["merged"] | length) == (result["diff"][0]["merged"] | length)'
          - '(result["api_payload"][0]["resources"] | length) == (result["diff"][0]["merged"] | length)'
          - result.api_response | rejectattr('RETURN_CODE', 'equalto', 207) | list | length == 0
      when: result.api_response is defined

    - name: BASE common pools - Create resources idempotence
      cisco.nd.nd_manage_resource_manager: *rm_merge
      register: result

    - name: BASE common pools - Assert idempotence
      ansible.builtin.assert:
        that:
          - 'result.changed == false'
          - '(result["diff"][0]["merged"] | length) == 0'
          - '(result["diff"][0]["deleted"] | length) == 0'
          - 'result.failed | default(false) == false'

    - name: BASE common pools - Assert idempotence API details
      ansible.builtin.assert:
        that:
          - '(result["api_response"] | length) == 1'
          - 'result["api_result"][0]["success"] == true'
          - 'result["api_payload"][0] is none'
          - result.api_response | rejectattr('RETURN_CODE', 'equalto', 200) | list | length == 0
      when: result.api_response is defined

    - name: BASE common pools - Set update replacement config
      ansible.builtin.set_fact:
        rm_update_config:
          - entity_name: "base_l3_vni_fabric"
            pool_type: "ID"
            pool_name: "L3_VNI"
            scope_type: "fabric"
            resource: "50052"

    - name: BASE common pools - Update existing resource allocation
      cisco.nd.nd_manage_resource_manager: &rm_update_merge
        state: merged
        fabric_name: "{{ ansible_it_fabric }}"
        config: "{{ rm_update_config }}"
      register: result

    - name: BASE common pools - Assert update replacement result
      ansible.builtin.assert:
        that:
          - 'result.changed == true'
          - '(result["diff"][0]["deleted"] | length) == 1'
          - '(result["diff"][0]["merged"] | length) == 1'
          - 'result.failed | default(false) == false'
          - result.api_response | default([]) | rejectattr('RETURN_CODE', 'equalto', 207) | list | length == 0

    - name: BASE common pools - Assert update replacement API phases
      ansible.builtin.assert:
        that:
          - '(result["api_response"] | length) == 2'
          - 'result["api_result"][0]["success"] == true'
          - 'result["api_result"][1]["success"] == true'
          - '(result["api_payload"][0]["resourceIds"] | length) == 1'
          - '(result["api_payload"][1]["resources"] | length) == 1'
      when: result.api_response is defined

    - name: BASE common pools - Gather updated resource allocation
      cisco.nd.nd_manage_resource_manager:
        state: gathered
        fabric_name: "{{ ansible_it_fabric }}"
        config:
          - entity_name: "base_l3_vni_fabric"
            pool_name: "L3_VNI"
            scope_type: "fabric"
      register: result

    - name: BASE common pools - Assert old allocation was released
      ansible.builtin.assert:
        that:
          - '(result["gathered"] | selectattr("resource", "equalto", "50051") | list | length) == 0'
          - '(result["gathered"] | selectattr("resource", "equalto", "50052") | list | length) == 1'
          - 'result.failed | default(false) == false'

    - name: BASE common pools - Update replacement idempotence
      cisco.nd.nd_manage_resource_manager: *rm_update_merge
      register: result

    - name: BASE common pools - Assert update replacement idempotence
      ansible.builtin.assert:
        that:
          - 'result.changed == false'
          - '(result["diff"][0]["merged"] | length) == 0'
          - '(result["diff"][0]["deleted"] | length) == 0'
          - 'result.failed | default(false) == false'
          - result.api_response | default([]) | rejectattr('RETURN_CODE', 'equalto', 200) | list | length == 0

  always:
    - name: BASE common pools - Cleanup resources
      cisco.nd.nd_manage_resource_manager: *rm_delete
      register: result

    - name: BASE common pools - Assert cleanup did not fail
      ansible.builtin.assert:
        that:
          - 'result.failed | default(false) == false'
          - result.api_response | default([]) | rejectattr('RETURN_CODE', 'equalto', (207 if result.changed else 200)) | list | length == 0
