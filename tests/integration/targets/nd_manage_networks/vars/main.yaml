    deploy: false
  - network_name: harness-nd-network-deleted-extra
    is_l2only: true
    network_id: "{{ nd4x_network_base_id + 7 }}"
    vlan_id: "{{ nd4x_network_base_vlan + 7 }}"
    vlan_name: harness_nd_network_deleted_extra_vlan
