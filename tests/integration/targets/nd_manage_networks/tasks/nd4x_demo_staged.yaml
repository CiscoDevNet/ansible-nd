---
- name: "STAGED PREFLIGHT: Require two distinct attachments for add/remove coverage"
  ansible.builtin.assert:
    that:
      - nd4x_network_switch_ip | length > 0
      - nd4x_network_interface | length > 0
      - nd4x_network_switch_ip2 | length > 0
      - nd4x_network_interface2 | length > 0
      - >-
        nd4x_network_switch_ip2 != nd4x_network_switch_ip
        or nd4x_network_interface2 != nd4x_network_interface
      - nd4x_network_staged_secondary_attach_config | length == 1
    fail_msg: >-
      The staged harness scenario verifies real add/remove transitions. Set
      nd_network_harness_switch_ip and nd_network_harness_interface for the
      primary attachment, and set nd_network_harness_switch_ip2 and
      nd_network_harness_interface2 for a distinct second switch/interface
      pair. The second pair may use the same switch with a different interface.

- name: Run nd_manage_networks staged harness scenarios
  block:
    - name: "STAGED SETUP: Remove reserved harness Networks"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ nd4x_network_fabric_name }}"
        state: deleted
        config: "{{ nd4x_network_staged_cleanup_config }}"

    - name: "STAGED SETUP: Seed attachment states for reconciliation"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ nd4x_network_fabric_name }}"
        state: merged
        config: "{{ nd4x_network_staged_seed_config }}"

    - name: "STAGED: Reconcile Network attachments through the harness"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_networks
        state: staged
        common_args:
          fabric_name: "{{ nd4x_network_fabric_name }}"
          output_level: debug
        config: "{{ nd4x_network_staged_config }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_network_check_mode_queries }}"
      register: nd4x_network_staged_result

    - name: "STAGED: Query attachment state"
      cisco.nd.nd_rest:
        path: "{{ nd4x_network_staged_attachment_query_path }}"
        method: post
        content:
          networkNames: "{{ nd4x_network_staged_network_names }}"
      register: nd4x_network_staged_attachment_query

    - name: "STAGED: Gather Networks to verify omitted definitions remain"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ nd4x_network_fabric_name }}"
        state: gathered
        config: "{{ nd4x_network_staged_cleanup_config }}"
      register: nd4x_network_staged_gathered

    - name: "STAGED: Normalize attachment rows"
      ansible.builtin.set_fact:
        nd4x_network_staged_attachment_rows: >-
          {{
            nd4x_network_staged_attachment_query.current.attachments
            | default(nd4x_network_staged_attachment_query.current.items | default([]))
          }}

    - name: "STAGED: Verify create, add, remove, detach, and omission behavior"
      vars:
        staged_network_names:
          - "{{ nd4x_network_staged_create_name }}"
          - "{{ nd4x_network_staged_add_name }}"
          - "{{ nd4x_network_staged_remove_name }}"
          - "{{ nd4x_network_staged_detach_name }}"
          - "{{ nd4x_network_staged_omit_name }}"
        staged_attached_names: >-
          {{
            nd4x_network_staged_attachment_rows
            | selectattr('networkName', 'in', staged_network_names)
            | selectattr('attach', 'equalto', true)
            | map(attribute='networkName')
            | list
          }}
      ansible.builtin.assert:
        that:
          - nd4x_network_staged_result.check_mode_result.changed | bool
          - nd4x_network_staged_result.first_run_result.changed | bool
          - nd4x_network_staged_result.idempotency_attempts == 1
          - not nd4x_network_staged_result.second_run_result.changed | bool
          - nd4x_network_staged_create_name in staged_attached_names
          - nd4x_network_staged_add_name in staged_attached_names
          - nd4x_network_staged_remove_name in staged_attached_names
          - nd4x_network_staged_detach_name not in staged_attached_names
          - nd4x_network_staged_omit_name not in staged_attached_names
          - >-
            nd4x_network_staged_gathered.gathered | default([])
            | selectattr('network_name', 'equalto', nd4x_network_staged_omit_name)
            | list | length == 1
          - >-
            nd4x_network_staged_attachment_rows
            | selectattr('networkName', 'in', staged_network_names)
            | selectattr('attach', 'equalto', true)
            | selectattr('status', 'equalto', 'pending')
            | list | length == 4
          - >-
            nd4x_network_staged_attachment_rows
            | selectattr('networkName', 'equalto', nd4x_network_staged_add_name)
            | selectattr('attach', 'equalto', true)
            | list | length == 2
          - >-
            nd4x_network_staged_attachment_rows
            | selectattr('networkName', 'equalto', nd4x_network_staged_remove_name)
            | selectattr('attach', 'equalto', true)
            | list | length == 1

    - name: "STAGED: Validate Network fields with the legacy Network validator"
      cisco.nd.tests.integration._nd_network_validate:
        nd_data: "{{ nd4x_network_staged_gathered }}"
        test_data: "{{ nd4x_network_staged_config }}"

  always:
    - name: "STAGED CLEANUP: Remove reserved harness Networks"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ nd4x_network_fabric_name }}"
        state: deleted
        config: "{{ nd4x_network_staged_cleanup_config }}"
