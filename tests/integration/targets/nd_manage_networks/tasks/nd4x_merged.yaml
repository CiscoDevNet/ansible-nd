---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "MERGED CREATE: Seed the primary fixture"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [nd4x_network_seed]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries: "{{ [nd4x_network_l2_query] }}"

- name: "MERGED SPARSE: Change one field without restating identity or layer"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[0], 'vlan_name': 'ND4X_L2_UPDATED', 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - path: "{{ nd4x_network_l2_query.path }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.networkMode', equals: layer2}
          - {jsonpath: '$.current.l2Data.vlanName', equals: ND4X_L2_UPDATED}

- name: "MERGED L3: Create dual-stack gateways and secondary collections"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [nd4x_network_l3]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries: "{{ [nd4x_network_l3_query] }}"

- name: "MERGED CLEAR: Clear secondary collections without changing the gateways"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[1], 'secondary_gateway_ipv4_collection': [], 'secondary_gateway_ipv6_collection': [], 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries: "{{ [nd4x_network_l3_query] }}"
  register: nd4x_network_cleared

- name: Verify omitted or empty controller readback really represents cleared lists
  ansible.builtin.assert:
    that:
      - nd4x_network_cleared.nd_query_results[0].result.current.l3Data.secondaryGatewayIpv4Collection | default([], true) == []
      - nd4x_network_cleared.nd_query_results[0].result.current.l3Data.secondaryGatewayIpv6Collection | default([], true) == []
- name: "MERGED CHILD: Apply only a child-owned override"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: >-
      {{ [{'network_name': nd4x_network_names[1], 'deploy': false,
           'child_fabric_config': [{'fabric_name': nd4x_network_child} | combine(nd4x_network_child_update)]}] }}
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - path: >-
          {{ (nd4x_network_scopes | selectattr('name', 'equalto', nd4x_network_child) | first).api }}/networks/{{ nd4x_network_names[1] }}{{ (nd4x_network_scopes | selectattr('name', 'equalto', nd4x_network_child) | first).suffix }}
        expected_status: 200
        expect:
          - {jsonpath: '$.current.l3Data.fabricData.gatewayOnBorder', equals: true}
  when: nd4x_network_topology != 'standalone'

- name: "MERGED NO TARGETS: Create an unattached resource with optional deployment enabled"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    module_args:
      config_actions: {type: resource, deploy: true}
    config:
      - network_name: "{{ nd4x_network_names[2] }}"
        network_id: "{{ nd_network_base_id | int + 82 }}"
        vlan_id: "{{ nd_network_base_vlan | int + 82 }}"
        layer: layer2
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
  register: nd4x_network_no_targets

- name: An unattached resource reports a skip without sending a deploy request
  ansible.builtin.assert:
    that:
      - (nd4x_network_no_targets.first_run_result.parent_fabric | default(nd4x_network_no_targets.first_run_result)).config_actions | selectattr('reason', 'equalto', 'no_targets') | list | length == 1
      - (nd4x_network_no_targets.first_run_result.parent_fabric | default(nd4x_network_no_targets.first_run_result)).api_paths | select('search', '/deploy') | list | length == 0

- name: "MERGED NOOP: Name-only requests preserve the existing definition"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[0], 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_no_change }}"
