---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "GATHERED SEED: Create a known resource"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [nd4x_network_seed]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"

- name: "GATHERED: Read an explicit name without definition properties"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: gathered
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[0]}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_no_change }}"
    nd_queries: "{{ [nd4x_network_l2_query] }}"
  register: nd4x_network_gathered

- name: Select the owned fixture from the gathered inventory
  ansible.builtin.set_fact:
    nd4x_network_gathered_requested: >-
      {{ (nd4x_network_gathered.first_run_result.parent_fabric | default(nd4x_network_gathered.first_run_result)).gathered
         | selectattr('network_name', 'equalto', nd4x_network_names[0]) | list }}

- name: Verify the module returned the requested resource
  ansible.builtin.assert:
    that:
      - nd4x_network_gathered_requested | length == 1

- name: Parent gathered output excludes child-owned options
  ansible.builtin.assert:
    that:
      - "'gateway_on_border' not in nd4x_network_gathered_requested[0]"
      - "'netflow_enable' not in nd4x_network_gathered_requested[0]"
  when: nd4x_network_topology != 'standalone'
