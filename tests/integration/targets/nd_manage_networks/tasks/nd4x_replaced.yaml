---
- name: Establish an empty owned-resource baseline for this case
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: "REPLACED SEED: Create non-default values before replacement"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [nd4x_network_seed]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"

- name: "REPLACED: Omitted identifiers and VLANs retain their existing allocation"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: replaced
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[0], 'layer': 'layer2', 'vlan_name': 'ND4X_L2_REPLACED', 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - name: Verify retained identity and applied replacement
        path: "{{ nd4x_network_definition_scope.api }}/networks/{{ nd4x_network_names[0] }}{{ nd4x_network_definition_scope.suffix }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.networkId', exists: true}
          - {jsonpath: '$.current.networkMode', equals: layer2}
          - {jsonpath: '$.current.l2Data.vlanName', equals: ND4X_L2_REPLACED}
  register: nd4x_network_replaced

- name: Verify omitted Network and VLAN IDs retained their allocation
  ansible.builtin.assert:
    that:
      - nd4x_network_replaced.nd_query_results[0].result.current.networkId | int == nd_network_base_id | int + 80
      - nd4x_network_replaced.nd_query_results[0].result.current.vlanId | int == nd_network_base_vlan | int + 80

- name: "REPLACED NOOP: A name-only operational entry does not replace the definition"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: replaced
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{'network_name': nd4x_network_names[0], 'deploy': false}]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_no_change }}"

- name: Verify Layer 3 scalar and list replacement
  ansible.builtin.include_tasks: nd4x_definition_state.yaml
  vars:
    nd4x_definition_state: replaced
