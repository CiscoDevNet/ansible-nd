---
- name: EMPTY OPTIONS SEED saves one target and independent freeform
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: >-
      {{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{
        'network_name': nd4x_network_names[1], 'attach': [{
          'ip_address': nd4x_network_switch, 'freeform_config': '! ND4X complete option reset',
          'attachment_options': {'switch_route_target_import': ['65000:50981']}
        }]
      }]}) | from_yaml }}
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"

- name: Read the seeded options independently
  cisco.nd.nd_rest:
    path: "{{ nd4x_network_api }}/networkAttachments/query?includeAll=true&max=100&offset=0"
    method: post
    content:
      networkNames: ["{{ nd4x_network_names[1] }}"]
      switchIds: ["{{ nd_network_harness_switch_id }}"]
  register: nd4x_network_before_empty_options

- name: Require a nonempty target without other options needing restoration
  ansible.builtin.assert:
    that:
      - nd4x_network_before_empty_options.current.attachments | length == 1
      - "nd4x_network_before_empty_options.current.attachments[0].instanceValues == {'switchRouteTargetImport': ['65000:50981']}"

- name: MERGED EMPTY OPTIONS clears the whole object without resetting freeform
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: >-
      {{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{
        'network_name': nd4x_network_names[1], 'attach': [{
          'ip_address': nd4x_network_switch, 'attachment_options': {}
        }]
      }]}) | from_yaml }}
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
  register: nd4x_network_empty_options

- name: Read the saved empty options and independent freeform
  cisco.nd.nd_rest:
    path: "{{ nd4x_network_api }}/networkAttachments/query?includeAll=true&max=100&offset=0"
    method: post
    content:
      networkNames: ["{{ nd4x_network_names[1] }}"]
      switchIds: ["{{ nd_network_harness_switch_id }}"]
  register: nd4x_network_after_empty_options

- name: Require a single attachment mutation when no options need restoration
  ansible.builtin.assert:
    that:
      - nd4x_network_after_empty_options.current.attachments | length == 1
      - nd4x_network_after_empty_options.current.attachments[0].instanceValues == {}
      - nd4x_network_after_empty_options.current.attachments[0].extraConfig == '! ND4X complete option reset'
      - nd4x_network_empty_reset_result.api_paths | select('search', '/networkAttachments$') | list | length == 1
  vars:
    nd4x_network_empty_reset_result: "{{ nd4x_network_empty_options.first_run_result.parent_fabric | default(nd4x_network_empty_options.first_run_result) }}"

- name: DEFAULT RESET SEED saves disabled SVI and a nonempty target
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: >-
      {{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{
        'network_name': nd4x_network_names[1], 'attach': [{
          'ip_address': nd4x_network_switch,
          'attachment_options': {'svi_enabled': false, 'switch_route_target_import': ['65000:50981']}
        }]
      }]}) | from_yaml }}
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"

- name: Read the disabled-SVI seed independently
  cisco.nd.nd_rest:
    path: "{{ nd4x_network_api }}/networkAttachments/query?includeAll=true&isConsolidated=true&max=100&offset=0"
    method: post
    content:
      networkNames: ["{{ nd4x_network_names[1] }}"]
      switchIds: ["{{ nd_network_harness_switch_id }}"]
  register: nd4x_network_before_default_options

- name: Require actual nondefaults before testing their reset
  ansible.builtin.assert:
    that:
      - nd4x_network_before_default_options.current.attachments | length == 1
      - not nd4x_network_before_default_options.current.attachments[0].instanceValues.sviEnabled | bool
      - nd4x_network_before_default_options.current.attachments[0].instanceValues.switchRouteTargetImport == ['65000:50981']

- name: REPLACED DEFAULT OPTIONS resets options in one write when only defaults remain
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: replaced
    common_args: "{{ nd4x_network_common_args }}"
    config: >-
      {{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [{
        'network_name': nd4x_network_names[1], 'attach': [{'ip_address': nd4x_network_switch}]
      }]}) | from_yaml }}
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
  register: nd4x_network_default_options

- name: Read the effective SVI default after the single empty-map write
  cisco.nd.nd_rest:
    path: "{{ nd4x_network_api }}/networkAttachments/query?includeAll=true&isConsolidated=true&max=100&offset=0"
    method: post
    content:
      networkNames: ["{{ nd4x_network_names[1] }}"]
      switchIds: ["{{ nd_network_harness_switch_id }}"]
  register: nd4x_network_after_default_options

- name: Require cleared targets and freeform with a single default-reset mutation
  ansible.builtin.assert:
    that:
      - nd4x_network_after_default_options.current.attachments | length == 1
      - nd4x_network_after_default_options.current.attachments[0].instanceValues.sviEnabled | bool
      - nd4x_network_after_default_options.current.attachments[0].instanceValues.switchRouteTargetImport | default([]) == []
      - nd4x_network_after_default_options.current.attachments[0].extraConfig | default('') == ''
      - nd4x_network_default_reset_result.api_paths | select('search', '/networkAttachments$') | list | length == 1
  vars:
    nd4x_network_default_reset_result: "{{ nd4x_network_default_options.first_run_result.parent_fabric | default(nd4x_network_default_options.first_run_result) }}"
