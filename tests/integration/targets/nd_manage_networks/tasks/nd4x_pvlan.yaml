---
- name: Limit PVLAN tests to supported standalone or Fabric-group targets
  ansible.builtin.assert:
    that:
      - nd4x_network_topology != 'mcfg'
    fail_msg: Multi-cluster Fabric Groups do not support PVLAN in this module.

- name: Require Data Center VXLAN with PVLAN already enabled on all members
  ansible.builtin.assert:
    that:
      - item.current.management.type | default(item.current.type | default('')) in ['vxlanIbgp', 'vxlanEbgp']
      - item.current.management.privateVlan | default(false) | bool
    fail_msg: >-
      PVLAN requires a Data Center VXLAN fabric with private VLAN enabled.
      Campus VXLAN members are not supported. This target does not change fabric settings.
  loop: "{{ nd4x_network_receiving_fabrics.results }}"

- name: Establish an empty owned PVLAN baseline
  ansible.builtin.include_tasks: nd4x_reset.yaml

- name: Create and repeat a primary PVLAN
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [nd4x_network_pvlan_primary]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - path: "{{ nd4x_network_api }}/networks/{{ nd4x_network_names[3] }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.vlanNetworkType', equals: privatePrimary}

- name: Create and repeat community and isolated secondary PVLANs
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: merged
    common_args: "{{ nd4x_network_common_args }}"
    config: "{{ lookup('ansible.builtin.template', 'nd_network_conf.j2', template_vars={'network_conf': [item]}) | from_yaml }}"
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - path: "{{ nd4x_network_api }}/networks/{{ item.network_name }}"
        expected_status: 200
  loop: "{{ nd4x_network_pvlan_secondaries }}"
  register: nd4x_network_pvlan_results

- name: Verify native secondary role and primary association
  ansible.builtin.assert:
    that:
      - item.nd_query_results[0].result.current.primaryNetworkId | int == nd_network_base_id | int + 83
      - >-
        item.nd_query_results[0].result.current.vlanNetworkType ==
        ('privateSecondaryCommunity' if item.item.vlan_network_type == 'community' else 'privateSecondaryIsolated')
  loop: "{{ nd4x_network_pvlan_results.results }}"

- name: "{{ item | upper }}: An omitted network mode preserves the primary PVLAN mode, role and VRF"
  cisco.nd.nd4x_module_test:
    module: cisco.nd.nd_manage_networks
    state: "{{ item }}"
    common_args: "{{ nd4x_network_common_args }}"
    config:
      - network_name: "{{ nd4x_network_names[3] }}"
        vlan_name: "ND4X_PVLAN_{{ item | upper }}"
        deploy: false
    check_mode_queries: "{{ nd4x_network_snapshots }}"
    expected: "{{ nd4x_network_expected_change }}"
    nd_queries:
      - path: "{{ nd4x_network_api }}/networks/{{ nd4x_network_names[3] }}"
        expected_status: 200
        expect:
          - {jsonpath: '$.current.vlanNetworkType', equals: privatePrimary}
          - {jsonpath: '$.current.networkMode', equals: layer3}
          - {jsonpath: '$.current.vrfName', equals: "{{ nd4x_network_vrf_name }}"}
          - {jsonpath: '$.current.l2Data.vlanName', equals: "ND4X_PVLAN_{{ item | upper }}"}
  loop: [merged, replaced, staged]

- name: Exercise explicitly reserved PVLAN attachment ports
  when: nd_network_harness_pvlan_attachment_tests_enabled | default(false) | bool
  block:
    - name: Require switch identity and two preconfigured PVLAN ports
      ansible.builtin.assert:
        that:
          - nd4x_network_switch | length > 0
          - nd_network_harness_switch_id | default('') | length > 0
          - nd_network_harness_pvlan_community_interface | default('') | length > 0
          - nd_network_harness_pvlan_isolated_interface | default('') | length > 0
          - nd_network_harness_pvlan_community_interface != nd_network_harness_pvlan_isolated_interface
        fail_msg: Reserve two distinct ports with the required PVLAN policy already deployed.

    - name: Attach the primary PVLAN to the reserved switch
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_networks
        state: merged
        common_args: "{{ nd4x_network_common_args }}"
        config:
          - network_name: "{{ nd4x_network_names[3] }}"
            deploy: false
            attach:
              - ip_address: "{{ nd4x_network_switch }}"
                interfaces: []
        check_mode_queries: "{{ nd4x_network_snapshots }}"
        expected: "{{ nd4x_network_expected_change }}"

    - name: Attach and repeat each secondary PVLAN on its reserved port
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_networks
        state: merged
        common_args: "{{ nd4x_network_common_args }}"
        config:
          - network_name: "{{ item.network_name }}"
            deploy: false
            attach:
              - ip_address: "{{ nd4x_network_switch }}"
                interfaces:
                  - mode: "{{ nd_network_harness_pvlan_attachment_mode | default('pvlan_host') }}"
                    interface_range: >-
                      {{ nd_network_harness_pvlan_community_interface if item.vlan_network_type == 'community'
                         else nd_network_harness_pvlan_isolated_interface }}
        check_mode_queries: "{{ nd4x_network_snapshots }}"
        expected: "{{ nd4x_network_expected_change }}"
      loop: "{{ nd4x_network_pvlan_secondaries }}"

    - name: Read primary and secondary bindings from the controller
      cisco.nd.nd_rest:
        path: "{{ nd4x_network_api }}/networkAttachments/query?includeAll=true&isConsolidated=true&max=100&offset=0"
        method: post
        content:
          networkNames: "{{ nd4x_network_names[3:6] }}"
          switchIds: ["{{ nd_network_harness_switch_id }}"]
      register: nd4x_network_pvlan_bindings

    - name: Require all PVLAN bindings and both reserved ports to persist
      ansible.builtin.assert:
        that:
          - >-
            nd4x_network_pvlan_bindings.current.attachments | selectattr('attach', 'equalto', true)
            | map(attribute='networkName') | sort == nd4x_network_names[3:6] | sort
          - >-
            (nd4x_network_pvlan_bindings.current.attachments | selectattr('networkName', 'equalto', nd4x_network_names[4])
            | first).interfaces | map(attribute='interfaceRange') | list == [nd_network_harness_pvlan_community_interface]
          - >-
            (nd4x_network_pvlan_bindings.current.attachments | selectattr('networkName', 'equalto', nd4x_network_names[5])
            | first).interfaces | map(attribute='interfaceRange') | list == [nd_network_harness_pvlan_isolated_interface]
