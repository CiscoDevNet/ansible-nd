---
- name: Network Setup - Verify Fabric is Reachable
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ target_fabric }}"
    method: get
  register: nd_network_fabric_query
  when:
    - target_fabric is defined
    - target_fabric | length > 0

- name: Network Setup - Assert Fabric Exists
  ansible.builtin.assert:
    that:
      - nd_network_fabric_query.status | int == 200
    fail_msg: "Fabric '{{ target_fabric }}' not found (HTTP {{ nd_network_fabric_query.status | default('unknown') }})."
    success_msg: "Fabric '{{ target_fabric }}' found."
  when:
    - target_fabric is defined
    - target_fabric | length > 0

- name: Network Setup - Delete Test Networks
  cisco.nd.nd_manage_networks:
    fabric: "{{ target_fabric }}"
    state: deleted
    config: "{{ target_network_delete_config }}"
  register: nd_network_cleanup_result
  failed_when: false
  when:
    - target_fabric is defined
    - target_fabric | length > 0
    - target_network_delete_config is defined
    - target_network_delete_config | length > 0
