---
- name: Test Entry Point - [nd_manage_networks - msd - deleted]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MSD Deleted Tests - [nd_manage_networks]         +"
      - "----------------------------------------------------------------"
  tags:
    - msd
    - deleted

- name: MSD Deleted - Build Parent and Child Network Config
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_network_msd_parent_fabric }}"
    nd_network_msd_delete_seed:
      - network_name: ansible-nd-net-msd-deleted
        is_l2only: true
        network_id: "{{ nd_network_base_id + 231 }}"
        vlan_id: "{{ nd_network_base_vlan + 231 }}"
        vlan_name: ansible_nd_net_msd_deleted
        deploy: false
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
    nd_network_msd_delete_request:
      - network_name: ansible-nd-net-msd-deleted
        is_l2only: true
  delegate_to: localhost
  tags:
    - msd
    - deleted

- name: MSD Deleted - Import Setup
  ansible.builtin.import_tasks: ../../tasks/setup.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted - Prepare Seed Configuration
  vars:
    file: msd_delete_seed
    network_conf: "{{ nd_network_msd_delete_seed }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted - Prepare Delete Configuration
  vars:
    file: msd_delete
    network_conf: "{{ nd_network_msd_delete_request }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC1 - Create Network
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_network_msd_delete_seed_conf }}"
  register: msd_delete_seed_result
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC2 - Delete Parent Network
  cisco.nd.nd_manage_networks: &msd_delete_conf
    fabric_name: "{{ target_fabric }}"
    state: deleted
    config: "{{ nd_network_msd_delete_conf }}"
    output_level: debug
  register: msd_delete_result
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC2 - Assert Delete
  ansible.builtin.assert:
    that:
      - msd_delete_result.changed == true
      - msd_delete_result.fabric_type == "multisite_parent"
      - msd_delete_result.child_fabrics is not defined
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC2 - Gather Parent Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: gathered
    config: "{{ nd_network_msd_delete_conf }}"
  register: msd_delete_gathered
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC2 - Validate Network Removed
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ msd_delete_gathered }}"
    test_data: "{{ nd_network_msd_delete_seed_conf }}"
    present: false
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC3 - Idempotence
  cisco.nd.nd_manage_networks: *msd_delete_conf
  register: msd_delete_idempotent
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted

- name: MSD Deleted TC3 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - msd_delete_idempotent.changed == false
  when: nd_network_run_msd | bool
  tags:
    - msd
    - deleted
