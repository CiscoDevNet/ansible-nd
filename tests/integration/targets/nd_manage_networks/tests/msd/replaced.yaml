---
- name: Test Entry Point - [nd_manage_networks - msd - replaced]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MSD Replaced Tests - [nd_manage_networks]        +"
      - "----------------------------------------------------------------"
  tags:
    - msd
    - replaced

- name: MSD Replaced - Build Parent and Child Network Config
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_network_msd_parent_fabric }}"
    target_network_delete_config:
      - network_name: ansible-nd-net-msd-replaced
        is_l2only: true
    nd_network_msd_replace_base:
      - network_name: ansible-nd-net-msd-replaced
        is_l2only: true
        network_id: "{{ nd_network_base_id + 211 }}"
        vlan_id: "{{ nd_network_base_vlan + 211 }}"
        vlan_name: ansible_nd_net_msd_replaced_base
        rt_auto: false
        enable_ir: false
        deploy: false
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            network_id: "{{ nd_network_base_id + 211 }}"
            vlan_id: "{{ nd_network_base_vlan + 211 }}"
            vlan_name: ansible_nd_net_msd_replaced_base
            enable_ir: false
    nd_network_msd_replace_config:
      - network_name: ansible-nd-net-msd-replaced
        is_l2only: true
        network_id: "{{ nd_network_base_id + 211 }}"
        vlan_id: "{{ nd_network_base_vlan + 211 }}"
        vlan_name: ansible_nd_net_msd_replaced_updated
        rt_auto: true
        enable_ir: false
        deploy: false
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            network_id: "{{ nd_network_base_id + 211 }}"
            vlan_id: "{{ nd_network_base_vlan + 211 }}"
            vlan_name: ansible_nd_net_msd_replaced_updated
            enable_ir: false
  delegate_to: localhost
  tags:
    - msd
    - replaced

- name: MSD Replaced - Import Setup
  ansible.builtin.import_tasks: ../../tasks/setup.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced - Prepare Base Configuration
  vars:
    file: msd_replace_base
    network_conf: "{{ nd_network_msd_replace_base }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced - Prepare Replacement Configuration
  vars:
    file: msd_replace
    network_conf: "{{ nd_network_msd_replace_config }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC1 - Create Base Network
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_network_msd_replace_base_conf }}"
  register: msd_replace_base_result
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Replace Parent and Child Network
  cisco.nd.nd_manage_networks: &msd_replace_conf
    fabric_name: "{{ target_fabric }}"
    state: replaced
    config: "{{ nd_network_msd_replace_conf }}"
    output_level: debug
  register: msd_replace_result
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Assert Changed
  ansible.builtin.assert:
    that:
      - msd_replace_result.changed == true
      - msd_replace_result.fabric_type == "multisite_parent"
      - msd_replace_result.child_fabrics | length == 1
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Gather Parent Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: gathered
    config: "{{ nd_network_msd_replace_conf }}"
  register: msd_replace_parent_gathered
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Validate Parent Network
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ msd_replace_parent_gathered }}"
    test_data: "{{ nd_network_msd_replace_conf }}"
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Gather Child Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ nd_network_msd_child_fabric }}"
    state: gathered
    config: []
  register: msd_replace_child_gathered
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC2 - Validate Child Network
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ msd_replace_child_gathered }}"
    test_data:
      - network_name: ansible-nd-net-msd-replaced
        network_id: "{{ nd_network_base_id + 211 }}"
        vlan_id: "{{ nd_network_base_vlan + 211 }}"
        vlan_name: ansible_nd_net_msd_replaced_updated
        enable_ir: false
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC3 - Idempotence
  cisco.nd.nd_manage_networks: *msd_replace_conf
  register: msd_replace_idempotent
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced

- name: MSD Replaced TC3 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - msd_replace_idempotent.changed == false
  when: nd_network_run_msd | bool
  tags:
    - msd
    - replaced
