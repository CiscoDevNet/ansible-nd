---
- name: Test Entry Point - [nd_manage_networks - deleted]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing Deleted Tests - [nd_manage_networks]                   +"
      - "----------------------------------------------------------------"
  tags: deleted

- name: Deleted - Build Standalone Test Data
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_network_standalone_fabric }}"
    target_network_names:
      - ansible-nd-net-deleted
      - ansible-nd-net-deleted-extra
    target_network_delete_config:
      - network_name: ansible-nd-net-deleted
        is_l2only: true
      - network_name: ansible-nd-net-deleted-extra
        is_l2only: true
    nd_network_delete_seed:
      - network_name: ansible-nd-net-deleted
        is_l2only: true
        network_id: "{{ nd_network_base_id + 6 }}"
        vlan_id: "{{ nd_network_base_vlan + 6 }}"
        vlan_name: ansible_nd_net_deleted
        enable_ir: false
        deploy: false
      - network_name: ansible-nd-net-deleted-extra
        is_l2only: true
        network_id: "{{ nd_network_base_id + 7 }}"
        vlan_id: "{{ nd_network_base_vlan + 7 }}"
        vlan_name: ansible_nd_net_deleted_extra
        enable_ir: false
        deploy: false
    nd_network_delete_request:
      - network_name: ansible-nd-net-deleted
        is_l2only: true
      - network_name: ansible-nd-net-deleted-extra
        is_l2only: true
  delegate_to: localhost
  tags: deleted

- name: Deleted - Import Setup
  ansible.builtin.import_tasks: ../../tasks/setup.yaml
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted - Prepare Seed Configuration
  vars:
    file: standalone_delete_seed
    network_conf: "{{ nd_network_delete_seed }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted - Prepare Delete Configuration
  vars:
    file: standalone_delete
    network_conf: "{{ nd_network_delete_request }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC1 - Create Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_network_standalone_delete_seed_conf }}"
  register: delete_base_result
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Delete Networks
  cisco.nd.nd_manage_networks: &delete_conf
    fabric_name: "{{ target_fabric }}"
    state: deleted
    config: "{{ nd_network_standalone_delete_conf }}"
    output_level: debug
  register: delete_result
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Assert Changed
  ansible.builtin.assert:
    that:
      - delete_result.changed == true
      - delete_result.fabric_type == "standalone"
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Gather Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: gathered
    config: "{{ nd_network_standalone_delete_conf }}"
  register: gathered_result
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC2 - Validate Networks Removed
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ gathered_result }}"
    test_data: "{{ nd_network_standalone_delete_seed_conf }}"
    present: false
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC3 - Idempotence
  cisco.nd.nd_manage_networks: *delete_conf
  register: delete_idempotent
  when: nd_network_run_standalone | bool
  tags: deleted

- name: Deleted TC3 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - delete_idempotent.changed == false
  when: nd_network_run_standalone | bool
  tags: deleted
