---
##############################################
##               SETUP                      ##
##############################################

- name: "SANITY - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: sanity

- block:

    ##############################################
    ##      SANITY / ERROR HANDLING             ##
    ##############################################

    # TC-1: Missing fabric_name should fail
    - name: "SANITY TC1 - Missing fabric_name"
      cisco.nd.nd_manage_policy:
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC1 - Verify failure for missing fabric_name"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    # TC-2: Missing config for merged state should fail
    - name: "SANITY TC2 - Merged state without config"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC2 - Verify failure for missing config"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    # TC-3: Duplicate descriptions with use_desc_as_key should fail atomically
    - name: "SANITY TC3 - Duplicate descriptions with use_desc_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_desc_as_key: true
        config:
          - name: switch_freeform
            description: "Same description"
            template_inputs:
              CONF: "system vlan long-name"
          - name: switch_freeform
            description: "Same description"
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC3 - Verify atomic failure for duplicate descriptions"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    # TC-4: Empty description with use_desc_as_key should fail
    - name: "SANITY TC4 - Empty description with use_desc_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_desc_as_key: true
        config:
          - name: switch_freeform
            description: ""
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC4 - Verify failure for empty description"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    # TC-5: Invalid template name should fail
    - name: "SANITY TC5 - Non-existent template name"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: this_template_does_not_exist_12345
            template_inputs:
              CONF: "test"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC5 - Verify failure for invalid template"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    # TC-6: Create, delete, re-create cycle (full lifecycle)
    - name: "SANITY TC6a - Create a policy"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "Lifecycle test"
            priority: 500
            template_inputs:
              CONF: "ip tcp path-mtu-discovery"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: sanity

    - name: "SANITY TC6a - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: sanity

    - name: "SANITY TC6b - Delete the policy"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: switch_freeform
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: sanity

    - name: "SANITY TC6b - Verify deletion"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: sanity

    - name: "SANITY TC6c - Re-create the policy"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "Lifecycle test - recreated"
            priority: 500
            template_inputs:
              CONF: "ip tcp path-mtu-discovery"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: sanity

    - name: "SANITY TC6c - Verify re-creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: sanity

    # TC-7: Invalid switch serial number should fail
    - name: "SANITY TC7 - Non-existent switch serial"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "INVALID_SERIAL_999"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC7 - Verify failure for invalid switch"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    ##############################################
    ##  TC8 - use_desc_as_key + non-existent    ##
    ##  POLICY-ID must FAIL (regression for B2) ##
    ##############################################
    #
    # Previously this case silently skipped (action="skip" in Case 7 of
    # _get_diff_merged_single).  Bugfix B2 changed it to a hard failure
    # so an operator typo in a POLICY-ID does not look like success.
    - name: "SANITY TC8 - use_desc_as_key with non-existent POLICY-ID must fail"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_desc_as_key: true
        config:
          - name: "POLICY-99999999"
            description: "ghost policy reference"
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC8 - Verify failure for missing POLICY-ID"
      ansible.builtin.assert:
        that:
          - result.failed == true
      tags: sanity

    ##############################################
    ##  TC9 - Mixed top-level config shapes      ##
    ##  must FAIL (regression for B11)          ##
    ##############################################
    #
    # `translate_config` rejects mixing two-level shape policy entries
    # (entries WITHOUT a `switch:` key, paired with a separate top-level
    # switch entry) and gathered output shape entries (entries WITH an embedded
    # `switch:` list).  Mixing the two shapes at the top level produces
    # ambiguous semantics and is rejected up-front before any API call.
    - name: "SANITY TC9 - Mixed two-level + gathered output shapes must fail"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          # Two-level policy entry (no switch key inside the policy entry)
          - name: switch_freeform
            description: "two-level policy entry"
            template_inputs:
              CONF: "system vlan long-name"
          # Gathered output shape entry (switch list embedded)
          - name: switch_freeform
            description: "gathered output entry"
            template_inputs:
              CONF: "no ip domain-lookup"
            switch:
              - serial_number: "{{ switch_serial_1 }}"
          # Two-level top-level switch entry (pairs with the first item)
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC9 - Verify failure for mixed config shape"
      ansible.builtin.assert:
        that:
          - result.failed == true

    ##############################################
    ##  TC10 - Policy entry + empty switch list ##
    ##         must FAIL (no silent no-op)      ##
    ##############################################
    #
    # `translate_config` rejects a config that contains one or more policy
    # entries paired with an empty top-level `switch: []` list. This
    # combination is almost always a user error (e.g. a Jinja expression
    # like `target_switches | default([])` rendering to `[]` at runtime),
    # and previously it was silently swallowed as a no-op. The module
    # now fails up-front naming the offending policy entries so the user
    # can fix their input.
    - name: "SANITY TC10a - merged: policy entry + empty switch list must fail"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            description: "policy with empty switch list"
            template_inputs:
              CONF: "system vlan long-name"
          - switch: []
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC10a - Verify failure for empty switch list (merged)"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - "'switch' in (result.msg | lower)"
          - "'switch_freeform' in result.msg"
      tags: sanity

    - name: "SANITY TC10b - deleted: policy entry + empty switch list must fail"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: true
        config:
          - name: POLICY-99999999
          - switch: []
      register: result
      ignore_errors: true
      tags: sanity

    - name: "SANITY TC10b - Verify failure for empty switch list (deleted)"
      ansible.builtin.assert:
        that:
          - result.failed == true
          - "'switch' in (result.msg | lower)"
          - "'POLICY-99999999' in result.msg"
      tags: sanity

    - name: "SANITY TC10c - empty switch list with NO policies is a no-op (not an error)"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: false
        config:
          - switch: []
      register: result
      tags: sanity

    - name: "SANITY TC10c - Verify no-op succeeds when no policy entries"
      ansible.builtin.assert:
        that:
          - result.failed is not defined or result.failed == false
          - result.changed == false
      tags: sanity

  always:
    - name: "SANITY - Cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: sanity
