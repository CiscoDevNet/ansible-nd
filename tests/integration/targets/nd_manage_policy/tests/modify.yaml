---
##############################################
##               SETUP                      ##
##############################################

- name: "MODIFY - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: modify

- block:

    ##############################################
    ##     SETUP - Create initial policies      ##
    ##############################################

    - name: "MODIFY SETUP - Enable BFD feature (prerequisite for BFD timers)"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            create_additional_policy: false
            description: "Enable BFD feature"
            priority: 100
            template_inputs:
              featureName: bfd
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      tags: modify

    - name: "MODIFY SETUP - Create initial policies for modification tests"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 101
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0

          - name: switch_freeform
            create_additional_policy: false
            description: "System vlan long-name"
            priority: 110
            template_inputs:
              CONF: "system vlan long-name"

          - name: switch_freeform
            create_additional_policy: false
            description: "BFD timers"
            priority: 115
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"

          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: setup_result
      tags: modify

    - name: "MODIFY SETUP - Verify initial creation"
      ansible.builtin.assert:
        that:
          - setup_result.changed == true
      tags: modify

    # The showCommands result endpoint requires X-Content-Type on GET. Use a
    # separate read-only URI session because nd_rest has no custom-header option.
    - name: "MODIFY SETUP - Authenticate for independent running-config readbacks"
      ansible.builtin.uri:
        url: "https://{{ hostvars[inventory_hostname].ansible_host }}:{{ hostvars[inventory_hostname].ansible_httpapi_port | default(443) }}/login"
        method: POST
        headers:
          Content-Type: application/json
        body_format: json
        body:
          domain: "{{ hostvars[inventory_hostname].ansible_httpapi_login_domain | default('local') }}"
          userName: "{{ hostvars[inventory_hostname].ansible_user }}"
          userPasswd: "{{ hostvars[inventory_hostname].ansible_password }}"
        validate_certs: "{{ hostvars[inventory_hostname].ansible_httpapi_validate_certs | default(false) | bool }}"
        return_content: true
        status_code: 200
        timeout: "{{ hostvars[inventory_hostname].ansible_command_timeout | default(600) | int }}"
      register: modify_show_auth
      failed_when: >-
        modify_show_auth.status != 200 or
        (modify_show_auth.json.jwttoken | default('') | length == 0)
      delegate_to: localhost
      connection: local
      no_log: true
      changed_when: false
      tags: modify

    ##############################################
    ##         MODIFY TEST CASES                ##
    ##############################################

    - name: "MODIFY SETUP - Record the owned clock policy ID"
      ansible.builtin.set_fact:
        modify_clock_policy_id: >-
          {{ setup_result.after | selectattr('templateName', 'equalto', 'clock_timezone')
             | map(attribute='policyId') | first }}
      tags: modify

    # TC-1 starts with a staged input change, then deploys through a metadata-only
    # update. The old command must remain running until that deployment completes.
    - name: "MODIFY TC1 - Stage a clock input change without deployment"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: "{{ modify_clock_policy_id }}"
            template_inputs:
              HOUR_OFFSET: 2
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_staged_clock
      tags: modify

    - name: "MODIFY TC1 - Independently read the staged clock policy"
      cisco.nd.nd_rest: &modify_read_clock
        method: GET
        path: "/api/v1/manage/fabrics/{{ fabric_name }}/policies/{{ modify_clock_policy_id }}"
      register: modify_clock_record
      tags: modify

    - name: "MODIFY TC1 - Record the old and desired clock commands"
      ansible.builtin.set_fact: &modify_clock_commands
        modify_old_clock_commands: >-
          {{ modify_staged_clock.before[0].generatedConfig.splitlines()
             | select('match', '^clock timezone ') | list }}
        modify_desired_clock_commands: >-
          {{ modify_clock_record.jsondata.generatedConfig.splitlines()
             | select('match', '^clock timezone ') | list }}
      tags: modify

    - name: "MODIFY TC1 - Read raw policy inventory including staged removals"
      cisco.nd.nd_rest: &modify_read_raw_policies
        method: GET
        path: "/api/v1/manage/fabrics/{{ fabric_name }}/policies?max=10000"
      register: modify_raw_policies
      until: >-
        modify_raw_policies.jsondata.policies
        | selectattr('switchId', 'equalto', switch_serial_1)
        | selectattr('markDeleted', 'defined')
        | selectattr('markDeleted', 'equalto', true)
        | selectattr('templateInputs', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'equalto', modify_clock_policy_id)
        | list | length > 0
      retries: 10
      delay: 2
      tags: modify

    - name: "MODIFY TC1 - Select removals linked to the owned clock policy"
      ansible.builtin.set_fact: &modify_clock_removals
        modify_linked_removals: >-
          {{ modify_raw_policies.jsondata.policies
             | selectattr('switchId', 'equalto', switch_serial_1)
             | selectattr('markDeleted', 'defined')
             | selectattr('markDeleted', 'equalto', true)
             | selectattr('templateInputs', 'defined')
             | selectattr('templateInputs.ORIG_POLICY_ID', 'defined')
             | selectattr('templateInputs.ORIG_POLICY_ID', 'equalto', modify_clock_policy_id)
             | list }}
      tags: modify

    - name: "MODIFY TC1 - Read running clock configuration before deployment"
      cisco.nd.nd_rest: &modify_show_clock
        method: POST
        path: /api/v1/manage/inventory/switchActions/showCommands
        content:
          commands: ["show running-config | include ^clock"]
          switchIds: ["{{ switch_serial_1 }}"]
          timeout: 1
      register: modify_show_job
      changed_when: false
      tags: modify

    - name: "MODIFY TC1 - Wait for the running clock readback"
      ansible.builtin.uri: &modify_poll_clock
        url: "https://{{ hostvars[inventory_hostname].ansible_host }}:{{ hostvars[inventory_hostname].ansible_httpapi_port | default(443) }}/api/v1/manage/inventory/switchActions/showCommands?jobId={{ modify_show_job.jsondata.jobId }}"
        method: GET
        headers:
          Authorization: "Bearer {{ modify_show_auth.json.jwttoken }}"
          Content-Type: application/json
          X-Content-Type: application/json
        validate_certs: "{{ hostvars[inventory_hostname].ansible_httpapi_validate_certs | default(false) | bool }}"
        return_content: true
        status_code: 200
        timeout: "{{ hostvars[inventory_hostname].ansible_command_timeout | default(600) | int }}"
      register: modify_running_clock
      until: "'END OF' in (modify_running_clock.json.message | default(''))"
      retries: 20
      delay: 3
      delegate_to: localhost
      connection: local
      no_log: true
      changed_when: false
      tags: modify

    - name: "MODIFY TC1 - Verify staged inputs have not changed running configuration"
      ansible.builtin.assert:
        that:
          - modify_staged_clock.changed == true
          - modify_clock_record.jsondata.templateInputs.HOUR_OFFSET | int == 2
          - modify_linked_removals | length > 0
          - modify_old_clock_commands | length == 1
          - modify_desired_clock_commands | length == 1
          - modify_old_clock_commands != modify_desired_clock_commands
          - switch_serial_1 in modify_running_clock.json.message
          - "'success' in modify_running_clock.json.message"
          - modify_old_clock_commands[0] in modify_running_clock.json.message
          - modify_desired_clock_commands[0] not in modify_running_clock.json.message
          - "(ansible_verbosity | int < 2) or (modify_staged_clock.api_paths | default([]) | select('search', '/switchActions/deploy|/policyActions/pushConfig') | list | length == 0)"
      tags: modify

    # TC-1: Modify priority of an existing policy using use_description_as_key
    - name: "MODIFY TC1 - Update priority using use_description_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 999
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 2
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC1 - Verify priority was updated using switch deployment"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.before[0].templateInputs.HOUR_OFFSET | int == 2
          - result.after[0].templateInputs.HOUR_OFFSET | int == 2
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 0)"
      tags: modify

    - name: "MODIFY TC1 - Read running clock configuration after metadata deployment"
      cisco.nd.nd_rest: *modify_show_clock
      register: modify_show_job
      changed_when: false
      tags: modify

    - name: "MODIFY TC1 - Wait for the deployed clock readback"
      ansible.builtin.uri: *modify_poll_clock
      register: modify_running_clock
      until: "'END OF' in (modify_running_clock.json.message | default(''))"
      retries: 20
      delay: 3
      delegate_to: localhost
      connection: local
      no_log: true
      changed_when: false
      tags: modify

    - name: "MODIFY TC1 - Preview remaining switch configuration"
      cisco.nd.nd_rest: &modify_preview_switch
        method: POST
        path: "/api/v1/manage/fabrics/{{ fabric_name }}/switchActions/preview?recompute=true"
        content:
          switchIds: ["{{ switch_serial_1 }}"]
      register: modify_pending_preview
      changed_when: false
      tags: modify

    - name: "MODIFY TC1 - Verify new running configuration and complete removal"
      ansible.builtin.assert: &modify_verify_clock_deployed
        that:
          - switch_serial_1 in modify_running_clock.json.message
          - "'success' in modify_running_clock.json.message"
          - modify_desired_clock_commands[0] in modify_running_clock.json.message
          - modify_old_clock_commands[0] not in modify_running_clock.json.message
          - modify_pending_preview.jsondata['items'] | length == 1
          - modify_pending_preview.jsondata['items'][0].switchId == switch_serial_1
          - modify_pending_preview.jsondata['items'][0].pendingConfigs == []
      tags: modify

    - name: "MODIFY TC2 - Wait until the completed clock removal leaves inventory"
      cisco.nd.nd_rest: *modify_read_raw_policies
      register: modify_raw_policies
      until: >-
        modify_raw_policies.jsondata.policies
        | selectattr('switchId', 'equalto', switch_serial_1)
        | selectattr('markDeleted', 'defined')
        | selectattr('markDeleted', 'equalto', true)
        | selectattr('templateInputs', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'equalto', modify_clock_policy_id)
        | list | length == 0
      retries: 10
      delay: 2
      tags: modify

    # TC-2: Idempotence after modification
    - name: "MODIFY TC2 - Idempotence after priority update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 999
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 2
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC2 - Verify idempotence"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.after == result.before
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 0)"
      tags: modify

    # TC-3: Modify template_inputs of an existing policy while omitting priority.
    # The existing priority must be preserved instead of being reset to 500.
    - name: "MODIFY TC3 - Update template_inputs without priority using use_description_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        use_description_as_key: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "BFD timers"
            template_inputs:
              CONF: "bfd interval 500 min_rx 500 multiplier 5"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC3 - Verify template_inputs were updated"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 0)"
          - result.before | length == 1
          - result.after | length == 1
          - result.before[0].priority == 115
          - result.before[0].templateInputs.CONF == "bfd interval 250 min_rx 250 multiplier 3"
          - result.after[0].priority == 115
          - result.after[0].description == "BFD timers"
          - result.after[0].templateInputs.CONF == "bfd interval 500 min_rx 500 multiplier 5"
      tags: modify

    - name: "MODIFY TC3 - Gather BFD timers after omitted-priority update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "BFD timers"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc3_gathered_result
      tags: modify

    - name: "MODIFY TC3 - Verify omitted priority was preserved"
      ansible.builtin.assert:
        that:
          - tc3_gathered_result.changed == false
          - tc3_gathered_result.gathered | length == 1
          - tc3_gathered_result.gathered[0].priority == 115
          - tc3_gathered_result.gathered[0].template_inputs.CONF == "bfd interval 500 min_rx 500 multiplier 5"
          - result.after[0].policyId == tc3_gathered_result.gathered[0].policy_id
          - result.after[0].priority == tc3_gathered_result.gathered[0].priority
          - result.after[0].templateInputs.CONF == tc3_gathered_result.gathered[0].template_inputs.CONF
      tags: modify

    # TC-4: Modify using policy ID (gathered first to get ID)
    - name: "MODIFY TC4 - Gather policies to get policy IDs"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: gathered_result
      tags: modify

    - name: "MODIFY TC4 - Verify policy-ID fixture exists"
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - gathered_result.gathered | length == 1
      tags: modify

    - name: "MODIFY TC4 - Extract policy ID from gathered result"
      ansible.builtin.set_fact:
        policy_id: "{{ gathered_result.gathered[0].policy_id }}"
      tags: modify

    - name: "MODIFY TC4 - Preview sparse policy-ID update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        config:
          - name: "{{ policy_id }}"
            priority: 800
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      check_mode: true
      register: tc4_update_preview
      tags: modify

    - name: "MODIFY TC4 - Verify effective update preview"
      ansible.builtin.assert:
        that:
          - tc4_update_preview.changed == true
          - tc4_update_preview.before | length == 1
          - tc4_update_preview.after | length == 1
          - tc4_update_preview.before[0].priority == 999
          - tc4_update_preview.after[0].priority == 800
          - tc4_update_preview.after[0].policyId == policy_id
          - tc4_update_preview.before[0].description == "Timezone CET"
          - tc4_update_preview.after[0].description == "Timezone CET"
          - tc4_update_preview.after[0].templateInputs == tc4_update_preview.before[0].templateInputs
      tags: modify

    - name: "MODIFY TC4 - Read policy after update preview"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: "{{ policy_id }}"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc4_preview_readback
      tags: modify

    - name: "MODIFY TC4 - Verify update preview did not persist"
      ansible.builtin.assert:
        that:
          - tc4_preview_readback.changed == false
          - tc4_preview_readback.gathered == gathered_result.gathered
      tags: modify

    - name: "MODIFY TC4 - Modify policy by ID while omitting description"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        config:
          - name: "{{ policy_id }}"
            priority: 800
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 2
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Verify modification by ID"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (result.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 0)"
          - result.before | length == 1
          - result.after | length == 1
          - result.before[0].priority == 999
          - result.after[0].priority == 800
          - result.after[0].description == "Timezone CET"
          - result.after[0].policyId == policy_id
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Re-gather policy after ID update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc4_gathered_result
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Filter updated policy by ID"
      ansible.builtin.set_fact:
        tc4_policy_id_matches: >-
          {{
            tc4_gathered_result.gathered
            | selectattr('policy_id', 'defined')
            | selectattr('policy_id', 'equalto', policy_id)
            | list
          }}
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Verify omitted description was preserved"
      ansible.builtin.assert:
        that:
          - tc4_policy_id_matches | length == 1
          - tc4_policy_id_matches[0].description == "Timezone CET"
          - tc4_policy_id_matches[0].priority == 800
          - result.after[0].priority == tc4_policy_id_matches[0].priority
          - result.after[0].description == tc4_policy_id_matches[0].description
          - result.after[0].templateInputs.TIME_ZONE == tc4_policy_id_matches[0].template_inputs.TIME_ZONE
      when: policy_id is defined
      tags: modify

    # TC-5: Verify modifications via gathered
    - name: "MODIFY TC5 - Gather all policies and verify modifications"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: gathered_result
      tags: modify

    - name: "MODIFY TC5 - Verify gathered results"
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - gathered_result.gathered | length >= 3
      tags: modify

    # TC-6: The controller already has the desired inputs after a staged update,
    # but its old generated command still needs removal from the switch.
    - name: "MODIFY TC6 - Stage another input change by exact policy ID"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: false
        config:
          - name: "{{ modify_clock_policy_id }}"
            template_inputs:
              HOUR_OFFSET: 3
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_staged_clock
      tags: modify

    - name: "MODIFY TC6 - Independently read the desired staged policy"
      cisco.nd.nd_rest: *modify_read_clock
      register: modify_clock_record
      tags: modify

    - name: "MODIFY TC6 - Record old and desired commands"
      ansible.builtin.set_fact: *modify_clock_commands
      tags: modify

    - name: "MODIFY TC6 - Read pending-removal inventory"
      cisco.nd.nd_rest: *modify_read_raw_policies
      register: modify_raw_policies
      until: >-
        modify_raw_policies.jsondata.policies
        | selectattr('switchId', 'equalto', switch_serial_1)
        | selectattr('markDeleted', 'defined')
        | selectattr('markDeleted', 'equalto', true)
        | selectattr('templateInputs', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'defined')
        | selectattr('templateInputs.ORIG_POLICY_ID', 'equalto', modify_clock_policy_id)
        | list | length > 0
      retries: 10
      delay: 2
      tags: modify

    - name: "MODIFY TC6 - Resolve pending removals by original policy ID"
      ansible.builtin.set_fact: *modify_clock_removals
      tags: modify

    - name: "MODIFY TC6 - Verify the staged-removal fixture"
      ansible.builtin.assert:
        that:
          - modify_staged_clock.changed == true
          - modify_clock_record.jsondata.templateInputs.HOUR_OFFSET | int == 3
          - modify_linked_removals | length > 0
          - modify_old_clock_commands | length == 1
          - modify_desired_clock_commands | length == 1
          - modify_old_clock_commands != modify_desired_clock_commands
      tags: modify

    - name: "MODIFY TC6 - Deploy identical controller inputs with a pending removal"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: "{{ modify_clock_policy_id }}"
            template_inputs:
              HOUR_OFFSET: 3
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_pending_noop
      tags: modify

    - name: "MODIFY TC6 - Independently read the policy after identical deployment"
      cisco.nd.nd_rest: *modify_read_clock
      register: modify_clock_after_noop
      tags: modify

    - name: "MODIFY TC6 - Verify no-op reporting and switch routing"
      ansible.builtin.assert:
        that:
          - modify_pending_noop.changed == false
          - modify_pending_noop.after == modify_pending_noop.before
          - modify_pending_noop.after[0].policyId == modify_clock_policy_id
          - modify_clock_after_noop.jsondata.policyId == modify_clock_policy_id
          - modify_clock_after_noop.jsondata.templateInputs.HOUR_OFFSET | int == 3
          - modify_clock_after_noop.jsondata.markDeleted | default(false) == false
          - "(ansible_verbosity | int < 2) or (modify_pending_noop.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (modify_pending_noop.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 0)"
          - "(ansible_verbosity | int < 2) or ('PUT' not in modify_pending_noop.api_verbs | default([]))"
      tags: modify

    - name: "MODIFY TC6 - Read running clock after identical deployment"
      cisco.nd.nd_rest: *modify_show_clock
      register: modify_show_job
      changed_when: false
      tags: modify

    - name: "MODIFY TC6 - Wait for the running clock readback"
      ansible.builtin.uri: *modify_poll_clock
      register: modify_running_clock
      until: "'END OF' in (modify_running_clock.json.message | default(''))"
      retries: 20
      delay: 3
      delegate_to: localhost
      connection: local
      no_log: true
      changed_when: false
      tags: modify

    - name: "MODIFY TC6 - Preview configuration after pending cleanup"
      cisco.nd.nd_rest: *modify_preview_switch
      register: modify_pending_preview
      changed_when: false
      tags: modify

    - name: "MODIFY TC6 - Verify running state and pending cleanup"
      ansible.builtin.assert: *modify_verify_clock_deployed
      tags: modify

    # TC-7: A staged deletion hides the original policy from gathered state.
    # Recreate the same switch/template/description with different inputs; its
    # unique old owner must select switch deployment, rather than policy push.
    - name: "MODIFY TC7 - Stage deletion of the exact clock policy"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        deploy: false
        config:
          - name: "{{ modify_clock_policy_id }}"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_staged_delete
      tags: modify

    - name: "MODIFY TC7 - Independently read the marked-deleted policy"
      cisco.nd.nd_rest: *modify_read_clock
      register: modify_deleted_clock
      until: modify_deleted_clock.jsondata.markDeleted | default(false) | bool
      retries: 10
      delay: 2
      tags: modify

    - name: "MODIFY TC7 - Confirm the original policy is no longer active"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: "{{ modify_clock_policy_id }}"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_deleted_clock_active
      tags: modify

    - name: "MODIFY TC7 - Verify the uniquely identified recreation fixture"
      ansible.builtin.assert:
        that:
          - modify_staged_delete.changed == true
          - modify_deleted_clock.jsondata.policyId == modify_clock_policy_id
          - modify_deleted_clock.jsondata.markDeleted == true
          - modify_deleted_clock.jsondata.switchId == switch_serial_1
          - modify_deleted_clock.jsondata.templateName == 'clock_timezone'
          - modify_deleted_clock.jsondata.description == 'Timezone CET'
          - modify_deleted_clock_active.gathered == []
      tags: modify

    - name: "MODIFY TC7 - Recreate the logical policy and deploy its earlier removal"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            description: "Timezone CET"
            priority: 800
            create_additional_policy: false
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 4
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: modify_recreated_clock
      tags: modify

    - name: "MODIFY TC7 - Verify recreation uses a new ID and switch deployment"
      ansible.builtin.assert:
        that:
          - modify_recreated_clock.changed == true
          - modify_recreated_clock.before == []
          - modify_recreated_clock.after | length == 1
          - modify_recreated_clock.after[0].policyId != modify_clock_policy_id
          - modify_recreated_clock.after[0].templateInputs.HOUR_OFFSET | int == 4
          - "(ansible_verbosity | int < 2) or (modify_recreated_clock.api_paths | default([]) | select('search', '/switchActions/deploy') | list | length == 1)"
          - "(ansible_verbosity | int < 2) or (modify_recreated_clock.api_paths | default([]) | select('search', '/policyActions/pushConfig') | list | length == 0)"
      tags: modify

    - name: "MODIFY TC7 - Record the newly owned policy ID and old running command"
      ansible.builtin.set_fact:
        modify_clock_policy_id: "{{ modify_recreated_clock.after[0].policyId }}"
        modify_old_clock_commands: >-
          {{ modify_deleted_clock.jsondata.generatedConfig.splitlines()
             | select('match', '^clock timezone ') | list }}
      tags: modify

    - name: "MODIFY TC7 - Independently read the recreated policy"
      cisco.nd.nd_rest: *modify_read_clock
      register: modify_clock_record
      tags: modify

    - name: "MODIFY TC7 - Record the independently generated desired command"
      ansible.builtin.set_fact:
        modify_desired_clock_commands: >-
          {{ modify_clock_record.jsondata.generatedConfig.splitlines()
             | select('match', '^clock timezone ') | list }}
      tags: modify

    - name: "MODIFY TC7 - Verify recreated controller state"
      ansible.builtin.assert:
        that:
          - modify_clock_record.jsondata.policyId == modify_clock_policy_id
          - modify_clock_record.jsondata.templateInputs.HOUR_OFFSET | int == 4
          - modify_old_clock_commands | length == 1
          - modify_desired_clock_commands | length == 1
          - modify_old_clock_commands != modify_desired_clock_commands
      tags: modify

    - name: "MODIFY TC7 - Read running clock after recreation"
      cisco.nd.nd_rest: *modify_show_clock
      register: modify_show_job
      changed_when: false
      tags: modify

    - name: "MODIFY TC7 - Wait for recreated running configuration"
      ansible.builtin.uri: *modify_poll_clock
      register: modify_running_clock
      until: "'END OF' in (modify_running_clock.json.message | default(''))"
      retries: 20
      delay: 3
      delegate_to: localhost
      connection: local
      no_log: true
      changed_when: false
      tags: modify

    - name: "MODIFY TC7 - Preview configuration after recreation"
      cisco.nd.nd_rest: *modify_preview_switch
      register: modify_pending_preview
      changed_when: false
      tags: modify

    - name: "MODIFY TC7 - Verify recreated running state and pending cleanup"
      ansible.builtin.assert: *modify_verify_clock_deployed
      tags: modify

  always:
    - name: "MODIFY - Cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: modify
