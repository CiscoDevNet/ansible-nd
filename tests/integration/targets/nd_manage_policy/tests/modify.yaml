---
##############################################
##               SETUP                      ##
##############################################

- name: "MODIFY - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: modify

- block:

    ##############################################
    ##     SETUP - Create initial policies      ##
    ##############################################

    - name: "MODIFY SETUP - Enable BFD feature (prerequisite for BFD timers)"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            create_additional_policy: false
            description: "Enable BFD feature"
            priority: 100
            template_inputs:
              featureName: bfd
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      tags: modify

    - name: "MODIFY SETUP - Create initial policies for modification tests"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 101
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0

          - name: switch_freeform
            create_additional_policy: false
            description: "System vlan long-name"
            priority: 110
            template_inputs:
              CONF: "system vlan long-name"

          - name: switch_freeform
            create_additional_policy: false
            description: "BFD timers"
            priority: 115
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"

          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: setup_result
      tags: modify

    - name: "MODIFY SETUP - Verify initial creation"
      ansible.builtin.assert:
        that:
          - setup_result.changed == true
      tags: modify

    ##############################################
    ##         MODIFY TEST CASES                ##
    ##############################################

    # TC-1: Modify priority of an existing policy using use_description_as_key
    - name: "MODIFY TC1 - Update priority using use_description_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 999
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC1 - Verify priority was updated"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: modify

    # TC-2: Idempotence after modification
    - name: "MODIFY TC2 - Idempotence after priority update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        use_description_as_key: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Timezone CET"
            priority: 999
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC2 - Verify idempotence"
      ansible.builtin.assert:
        that:
          - result.changed == false
      tags: modify

    # TC-3: Modify template_inputs of an existing policy while omitting priority.
    # The existing priority must be preserved instead of being reset to 500.
    - name: "MODIFY TC3 - Update template_inputs without priority using use_description_as_key"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        use_description_as_key: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "BFD timers"
            template_inputs:
              CONF: "bfd interval 500 min_rx 500 multiplier 5"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: modify

    - name: "MODIFY TC3 - Verify template_inputs were updated"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.before | length == 1
          - result.after | length == 1
          - result.before[0].priority == 115
          - result.before[0].templateInputs.CONF == "bfd interval 250 min_rx 250 multiplier 3"
          - result.after[0].priority == 115
          - result.after[0].description == "BFD timers"
          - result.after[0].templateInputs.CONF == "bfd interval 500 min_rx 500 multiplier 5"
      tags: modify

    - name: "MODIFY TC3 - Gather BFD timers after omitted-priority update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
            description: "BFD timers"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc3_gathered_result
      tags: modify

    - name: "MODIFY TC3 - Verify omitted priority was preserved"
      ansible.builtin.assert:
        that:
          - tc3_gathered_result.changed == false
          - tc3_gathered_result.gathered | length == 1
          - tc3_gathered_result.gathered[0].priority == 115
          - tc3_gathered_result.gathered[0].template_inputs.CONF == "bfd interval 500 min_rx 500 multiplier 5"
          - result.after[0].policyId == tc3_gathered_result.gathered[0].policy_id
          - result.after[0].priority == tc3_gathered_result.gathered[0].priority
          - result.after[0].templateInputs.CONF == tc3_gathered_result.gathered[0].template_inputs.CONF
      tags: modify

    # TC-4: Modify using policy ID (gathered first to get ID)
    - name: "MODIFY TC4 - Gather policies to get policy IDs"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: gathered_result
      tags: modify

    - name: "MODIFY TC4 - Verify policy-ID fixture exists"
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - gathered_result.gathered | length == 1
      tags: modify

    - name: "MODIFY TC4 - Extract policy ID from gathered result"
      ansible.builtin.set_fact:
        policy_id: "{{ gathered_result.gathered[0].policy_id }}"
      tags: modify

    - name: "MODIFY TC4 - Preview sparse policy-ID update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        config:
          - name: "{{ policy_id }}"
            priority: 800
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      check_mode: true
      register: tc4_update_preview
      tags: modify

    - name: "MODIFY TC4 - Verify effective update preview"
      ansible.builtin.assert:
        that:
          - tc4_update_preview.changed == true
          - tc4_update_preview.before | length == 1
          - tc4_update_preview.after | length == 1
          - tc4_update_preview.before[0].priority == 999
          - tc4_update_preview.after[0].priority == 800
          - tc4_update_preview.after[0].policyId == policy_id
          - tc4_update_preview.before[0].description == "Timezone CET"
          - tc4_update_preview.after[0].description == "Timezone CET"
          - tc4_update_preview.after[0].templateInputs == tc4_update_preview.before[0].templateInputs
      tags: modify

    - name: "MODIFY TC4 - Read policy after update preview"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: "{{ policy_id }}"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc4_preview_readback
      tags: modify

    - name: "MODIFY TC4 - Verify update preview did not persist"
      ansible.builtin.assert:
        that:
          - tc4_preview_readback.changed == false
          - tc4_preview_readback.gathered == gathered_result.gathered
      tags: modify

    - name: "MODIFY TC4 - Modify policy by ID while omitting description"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        config:
          - name: "{{ policy_id }}"
            priority: 800
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Verify modification by ID"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.before | length == 1
          - result.after | length == 1
          - result.before[0].priority == 999
          - result.after[0].priority == 800
          - result.after[0].description == "Timezone CET"
          - result.after[0].policyId == policy_id
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Re-gather policy after ID update"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc4_gathered_result
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Filter updated policy by ID"
      ansible.builtin.set_fact:
        tc4_policy_id_matches: >-
          {{
            tc4_gathered_result.gathered
            | selectattr('policy_id', 'defined')
            | selectattr('policy_id', 'equalto', policy_id)
            | list
          }}
      when: policy_id is defined
      tags: modify

    - name: "MODIFY TC4 - Verify omitted description was preserved"
      ansible.builtin.assert:
        that:
          - tc4_policy_id_matches | length == 1
          - tc4_policy_id_matches[0].description == "Timezone CET"
          - tc4_policy_id_matches[0].priority == 800
          - result.after[0].priority == tc4_policy_id_matches[0].priority
          - result.after[0].description == tc4_policy_id_matches[0].description
          - result.after[0].templateInputs.TIME_ZONE == tc4_policy_id_matches[0].template_inputs.TIME_ZONE
      when: policy_id is defined
      tags: modify

    # TC-5: Verify modifications via gathered
    - name: "MODIFY TC5 - Gather all policies and verify modifications"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: gathered_result
      tags: modify

    - name: "MODIFY TC5 - Verify gathered results"
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - gathered_result.gathered | length >= 3
      tags: modify

  always:
    - name: "MODIFY - Cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: modify
