---
##############################################
##               SETUP                      ##
##############################################

- name: "MERGED - Import cleanup tasks"
  ansible.builtin.import_tasks: ../tasks/cleanup.yaml
  tags: merged

- block:

    ##############################################
    ##                MERGE                     ##
    ##############################################

    # TC-1: Create a single policy with clock_timezone template
    - name: "MERGED TC1 - Preview clock_timezone creation"
      cisco.nd.nd_manage_policy: &merged_clock_tz
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        output_level: info
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "Set timezone to CET"
            priority: 101
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      check_mode: true
      register: tc1_create_preview
      tags: merged

    - name: "MERGED TC1 - Verify creation preview"
      ansible.builtin.assert:
        that:
          - tc1_create_preview.changed == true
          - tc1_create_preview.before == []
          - tc1_create_preview.after | length == 1
          - tc1_create_preview.after[0].policyId is not defined
          - tc1_create_preview.after[0].priority == 101
          - tc1_create_preview.after[0].description == "Set timezone to CET"
          - tc1_create_preview.after[0].templateInputs.TIME_ZONE == "CET"
      tags: merged

    - name: "MERGED TC1 - Gather after creation preview"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - name: clock_timezone
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: tc1_preview_readback
      tags: merged

    - name: "MERGED TC1 - Verify creation preview did not persist"
      ansible.builtin.assert:
        that:
          - tc1_preview_readback.changed == false
          - tc1_preview_readback.gathered == []
      tags: merged

    - name: "MERGED TC1 - Create clock_timezone policy"
      cisco.nd.nd_manage_policy: *merged_clock_tz
      register: result
      tags: merged

    - name: "MERGED TC1 - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.before == []
          - result.after | length == 1
          - result.after[0].policyId is defined
          - result.after[0].priority == tc1_create_preview.after[0].priority
          - result.after[0].templateInputs.TIME_ZONE == tc1_create_preview.after[0].templateInputs.TIME_ZONE
      tags: merged

    # TC-2: Idempotence - Re-run the same task
    - name: "MERGED TC2 - Idempotence in real and check modes for clock_timezone"
      cisco.nd.nd_manage_policy: *merged_clock_tz
      check_mode: "{{ item }}"
      loop: [false, true]
      loop_control:
        label: "check_mode={{ item }}"
      register: result
      tags: merged

    - name: "MERGED TC2 - Verify idempotence"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.results | length == 2
          - result.results[0].changed == false
          - result.results[1].changed == false
          - result.results[0].before == result.results[0].after
          - result.results[1].before == result.results[1].after
      tags: merged

    # TC-3: Create policy with clock_summertime template
    - name: "MERGED TC3 - Create clock_summertime policy"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: clock_summertime
            create_additional_policy: false
            description: "Set summertime to CEST"
            priority: 102
            template_inputs:
              SUMMER_TIME: "CEST 5 SUNDAY MARCH 02:00 5 SUNDAY OCTOBER 03:00 60"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: merged

    - name: "MERGED TC3 - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-4: Create policy with switch_freeform - simple one-liner
    - name: "MERGED TC4 - Create switch_freeform policy (system vlan long-name)"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "Enable system vlan long-name"
            priority: 110
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: merged

    - name: "MERGED TC4 - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-5a: Enable BFD feature first (prerequisite for BFD timers)
    - name: "MERGED TC5a - Enable BFD feature"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: feature_enable
            create_additional_policy: false
            description: "Enable BFD feature"
            priority: 112
            template_inputs:
              featureName: bfd
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: merged

    - name: "MERGED TC5a - Verify BFD feature enabled"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-5b: Create policy with no description (default empty)
    - name: "MERGED TC5b - Create bfd_timers policy with no description"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            priority: 115
            template_inputs:
              CONF: "bfd interval 250 min_rx 250 multiplier 3"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: merged

    - name: "MERGED TC5b - Verify creation"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

    # TC-6: Verify all created policies via gathered
    - name: "MERGED TC6 - Gather all policies on switch1"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config:
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: gathered_result
      tags: merged

    - name: "MERGED TC6 - Verify gathered contains created policies"
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - gathered_result.gathered | length >= 3
      tags: merged

    # TC-7: Create additional policy even when identical exists (create_additional_policy: true)
    - name: "MERGED TC7 - Create duplicate policy with create_additional_policy true"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ fabric_name }}"
        state: merged
        deploy: true
        config:
          - name: switch_freeform
            create_additional_policy: true
            description: "Enable system vlan long-name"
            priority: 110
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ switch_serial_1 }}"
      register: result
      tags: merged

    - name: "MERGED TC7 - Verify duplicate was created"
      ansible.builtin.assert:
        that:
          - result.changed == true
      tags: merged

  always:
    - name: "MERGED - Cleanup"
      ansible.builtin.import_tasks: ../tasks/cleanup.yaml
      tags: merged
