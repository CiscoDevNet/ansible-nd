---
- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

- name: Set ND test output settings
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: "{{ api_key_output_level | default('debug') }}"
  tags:
    - always

- name: Discover ND Policy Test Cases
  ansible.builtin.find:
    paths: "{{ role_path }}/tests"
    patterns: "{{ testcase }}.yaml"
  connection: local
  register: nd_testcases

- name: Build List of Test Items
  ansible.builtin.set_fact:
    test_items: "{{ nd_testcases.files | map(attribute='path') | list }}"

- name: Run ND Policy Test Cases
  ansible.builtin.include_tasks: "{{ test_case_to_run }}"
  with_items: "{{ test_items }}"
  loop_control:
    loop_var: test_case_to_run

- name: Run ND 4.x nd_manage_policy harness preflight
  ansible.builtin.include_tasks:
    file: nd4x_demo_preflight.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_merged
        - nd4x_demo_fanout
        - nd4x_demo_modify
        - nd4x_demo_gathered
        - nd4x_demo_deleted
        - nd4x_demo_edge_cases
        - nd4x_demo_negative
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_preflight
    - nd4x_demo_merged
    - nd4x_demo_fanout
    - nd4x_demo_modify
    - nd4x_demo_gathered
    - nd4x_demo_deleted
    - nd4x_demo_edge_cases
    - nd4x_demo_negative

- name: Run merged nd_manage_policy harness scenarios
  ansible.builtin.include_tasks:
    file: nd4x_demo_merged.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_merged
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_merged
  when: nd4x_supported | default(false) | bool

