        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"
        nd_queries:
          - name: Verify multiple description-key deletions
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/policies?max=10000"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.policies[?(@.description == 'ND4X-deleted-default-summertime')]"
                exists: false
              - jsonpath: "$.current.policies[?(@.description == 'ND4X-deleted-default-freeform')]"
                exists: false

  always:
    - name: "DELETED CLEANUP: Remove harness-owned policy records"
      ansible.builtin.include_tasks: nd4x_demo_cleanup.yaml
