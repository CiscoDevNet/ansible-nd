        state: merged
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
          use_description_as_key: true
        config:
          - name: switch_freeform
            create_additional_policy: false
            description: "ND4X-deleted-by-description"
            priority: 300
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"

    - name: "DELETED: Delete by description key"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: deleted
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
          use_description_as_key: true
        config:
          - description: "ND4X-deleted-by-description"
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        idempotency: false
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"

    - name: "DELETED: Gather after description-key deletion"
      cisco.nd.nd_manage_policy:
        fabric_name: "{{ test_fabric_name }}"
        state: gathered
        config:
          - name: switch_freeform
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
      register: nd4x_description_after_gathered

    - name: "DELETED: Verify description-key policy is absent"
      ansible.builtin.assert:
        that:
          - >-
            (nd4x_description_after_gathered.gathered | default([]))
            | selectattr('description', 'equalto', 'ND4X-deleted-by-description')
            | list
            | length == 0

    - name: "DELETED SETUP: Create description-key deletion fixtures"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: merged
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
        config:
          - name: clock_timezone
            create_additional_policy: false
            description: "ND4X-deleted-default-timezone"
            priority: 401
            template_inputs:
              TIME_ZONE: CET
              HOUR_OFFSET: 1
              MINUTE_OFFSET: 0
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"

    - name: "DELETED: Delete one policy by description key"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: deleted
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
          use_description_as_key: true
        config:
          - name: clock_timezone
            description: "ND4X-deleted-default-timezone"
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        idempotency: false
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"
        nd_queries:
          - name: Verify description-key timezone deletion
            path: "/api/v1/manage/fabrics/{{ test_fabric_name }}/policies?max=10000"
            method: get
            expected_status: 200
            expect:
              - jsonpath: "$.current.policies[?(@.description == 'ND4X-deleted-default-timezone')]"
                exists: false

    - name: "DELETED: Repeat default description-key deletion"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: deleted
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
          use_description_as_key: true
        config:
          - name: clock_timezone
            description: "ND4X-deleted-default-timezone"
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        idempotency: false
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"

    - name: "DELETED SETUP: Create multiple description-key deletion fixtures"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: merged
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
        config:
          - name: clock_summertime
            create_additional_policy: false
            description: "ND4X-deleted-default-summertime"
            priority: 402
            template_inputs:
              SUMMER_TIME: "CEST 5 SUNDAY MARCH 02:00 5 SUNDAY OCTOBER 03:00 60"
          - name: switch_freeform
            create_additional_policy: false
            description: "ND4X-deleted-default-freeform"
            priority: 403
            template_inputs:
              CONF: "system vlan long-name"
          - switch:
              - serial_number: "{{ test_switch_serial_1 }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        check_mode_queries: "{{ nd4x_policy_check_mode_queries }}"

    - name: "DELETED: Delete multiple policies by description key"
      cisco.nd.nd4x_module_test:
        module: cisco.nd.nd_manage_policy
        state: deleted
        common_args:
          fabric_name: "{{ test_fabric_name }}"
          output_level: "{{ nd_info.output_level }}"
          deploy: true
          use_description_as_key: true
        config:
          - name: clock_summertime
            description: "ND4X-deleted-default-summertime"
          - name: switch_freeform
