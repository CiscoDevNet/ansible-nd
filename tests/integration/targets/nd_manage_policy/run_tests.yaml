---
# Runner playbook for nd_manage_policy integration tests.
#
# Usage:
#   ansible-playbook --inventory /absolute/path/to/inventory.networking \
#     tests/integration/targets/nd_manage_policy/run_tests.yaml \
#     -e testcase=merged \
#     -e @tests/integration/integration_config.yml
#
# The committed inventory.networking is a placeholder template. Copy it to a
# private local path, fill in credentials there, and pass that path through
# --inventory. Copy integration_config.yml.template to the ignored local
# integration_config.yml; never commit real credentials or inventory values.
#
# Harness:
#   ansible-test network-integration nd_manage_policy \
#     --inventory /absolute/path/to/inventory.networking \
#     --tags never,nd4x_demo,nd4x_demo_preflight -vv

- name: ND Policy Integration Tests
  hosts: nd
  gather_facts: false
  roles:
    - role: "{{ playbook_dir }}"
