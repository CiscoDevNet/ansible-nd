---
# Dependency-ordered qualification for nd_manage_security_contracts.
# The target creates its protocol dependency first and removes it last.

- name: >-
    Require explicit mutation authorization, the expected controller, Nexus
    Dashboard credentials, a security test fabric, and a unique run ID
  ansible.builtin.fail:
    msg: >-
      Set nd_test_security_mutation_authorized=true as a boolean, set
      nd_test_security_expected_controller_host to the exact ansible_host, and
      define ansible_user, ansible_password, nd_test_security_fabric_name, and
      nd_test_security_run_id before running this target. The run ID must be
      unique for this execution.
  when: >-
    ansible_host is not defined or
    ansible_user is not defined or
    ansible_password is not defined or
    nd_test_security_expected_controller_host is not defined or
    nd_test_security_expected_controller_host | string | trim | length == 0 or
    (nd_test_security_expected_controller_host | string | trim | lower) !=
    (ansible_host | string | trim | lower) or
    (nd_test_security_mutation_authorized | default(false) | type_debug) !=
    'bool' or
    not (nd_test_security_mutation_authorized | default(false) | bool) or
    nd_test_security_fabric_name is not defined or
    nd_test_security_run_id is not defined or
    nd_test_security_run_id | string | length == 0 or
    nd_test_security_run_id | string | length > 15 or
    nd_test_security_run_id | string is not match('^[A-Za-z0-9_-]+$')

- name: Exercise security contract states
  block:
    - name: Gather contracts before claiming the run-owned name
      cisco.nd.nd_manage_security_contracts:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        state: gathered
      register: contract_preflight

    - name: Gather protocol definitions before claiming the dependency name
      cisco.nd.nd_manage_security_protocol_definitions:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        state: gathered
      register: contract_protocol_preflight

    - name: Refuse to reuse existing contract resources
      ansible.builtin.assert:
        that:
          - >-
            contract_preflight.gathered |
            map(attribute='name') | map('lower') |
            select('equalto', security_contract.name | lower) |
            list | length == 0
          - >-
            contract_protocol_preflight.gathered |
            map(attribute='name') | map('lower') |
            select('equalto', security_contract_protocol.name | lower) |
            list | length == 0
        fail_msg: >-
          Refusing to mutate a pre-existing contract test resource. Use a
          different nd_test_security_run_id.

    - name: Mark the collision-free contract resources as owned by this run
      ansible.builtin.set_fact:
        security_contract_run_owned: true

    - name: Define the run-owned contract deletion operation
      cisco.nd.nd_manage_security_contracts: &delete_contract
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config:
          - name: "{{ security_contract.name }}"
        state: deleted
      check_mode: true
      changed_when: false

    - name: Define the run-owned protocol deletion operation
      cisco.nd.nd_manage_security_protocol_definitions: &delete_protocol
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config:
          - name: "{{ security_contract_protocol.name }}"
        state: deleted
      check_mode: true
      changed_when: false

    - name: Create the protocol dependency
      cisco.nd.nd_manage_security_protocol_definitions:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config:
          - "{{ security_contract_protocol }}"
        state: merged

    - name: Plan security contract creation
      cisco.nd.nd_manage_security_contracts: &merge_contract
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config:
          - "{{ security_contract }}"
        state: merged
      check_mode: true
      register: contract_create_check

    - name: Create the security contract
      cisco.nd.nd_manage_security_contracts: *merge_contract
      register: contract_create

    - name: Replay security contract creation
      cisco.nd.nd_manage_security_contracts: *merge_contract
      register: contract_replay

    - name: Verify merged behavior and disabled action defaults
      ansible.builtin.assert:
        that:
          - contract_create_check is changed
          - contract_create is changed
          - contract_replay is not changed
          - contract_create.config_actions_result is not defined

    - name: Gather security contracts
      cisco.nd.nd_manage_security_contracts:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        state: gathered
      register: contracts_gathered

    - name: Verify gathered is read-only and replayable
      ansible.builtin.assert:
        that:
          - contracts_gathered is not changed
          - contracts_gathered.before == []
          - contracts_gathered.after == []
          - >-
            contracts_gathered.gathered |
            selectattr('name', 'equalto', security_contract.name) |
            selectattr('direction', 'equalto', security_contract.direction) |
            list | length == 1
          - contracts_gathered.config_actions_result is not defined
          - contracts_gathered.security_actions_result is not defined

    - name: Plan an authoritative contract override from exact gathered state
      cisco.nd.nd_manage_security_contracts: &override_contract_inventory
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config: "{{ contracts_gathered.gathered }}"
        state: overridden
      check_mode: true
      register: contract_override_check

    - name: Replay the authoritative contract override plan
      cisco.nd.nd_manage_security_contracts: *override_contract_inventory
      check_mode: true
      register: contract_override_replay

    - name: Verify overridden exact-state planning is idempotent
      ansible.builtin.assert:
        that:
          - contract_override_check is not changed
          - contract_override_replay is not changed

    - name: Replace the security contract
      cisco.nd.nd_manage_security_contracts: &replace_contract
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        config:
          - "{{ security_contract_replaced }}"
        state: replaced
      register: contract_replace

    - name: Replay security contract replacement
      cisco.nd.nd_manage_security_contracts: *replace_contract
      register: contract_replace_replay

    - name: Verify replaced behavior
      ansible.builtin.assert:
        that:
          - contract_replace is changed
          - contract_replace_replay is not changed

    - name: Delete the security contract
      cisco.nd.nd_manage_security_contracts: *delete_contract
      register: contract_delete

    - name: Replay security contract deletion
      cisco.nd.nd_manage_security_contracts: *delete_contract
      register: contract_delete_replay

    - name: Verify deleted behavior
      ansible.builtin.assert:
        that:
          - contract_delete is changed
          - contract_delete_replay is not changed
  always:
    - name: Remove the security contract after the test
      cisco.nd.nd_manage_security_contracts: *delete_contract
      ignore_errors: true
      check_mode: false
      when: security_contract_run_owned | default(false) | bool

    - name: Remove the protocol dependency after the contract
      cisco.nd.nd_manage_security_protocol_definitions: *delete_protocol
      ignore_errors: true
      check_mode: false
      when: security_contract_run_owned | default(false) | bool

    - name: Gather contracts after cleanup
      cisco.nd.nd_manage_security_contracts:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        state: gathered
      register: contract_cleanup_final
      failed_when: false
      changed_when: false
      when: security_contract_run_owned | default(false) | bool

    - name: Gather protocol definitions after contract cleanup
      cisco.nd.nd_manage_security_protocol_definitions:
        fabric_name: "{{ nd_test_security_fabric_name }}"
        cluster_name: "{{ nd_test_security_cluster_name | default(omit) }}"
        state: gathered
      register: contract_protocol_cleanup_final
      failed_when: false
      changed_when: false
      when: security_contract_run_owned | default(false) | bool

    - name: Verify run-owned contract resources are absent after cleanup
      ansible.builtin.assert:
        that:
          - not (contract_cleanup_final.failed | default(false))
          - not (contract_protocol_cleanup_final.failed | default(false))
          - contract_cleanup_final.gathered is defined
          - contract_protocol_cleanup_final.gathered is defined
          - >-
            contract_cleanup_final.gathered |
            default([]) |
            map(attribute='name') | map('lower') |
            select('equalto', security_contract.name | lower) |
            list | length == 0
          - >-
            contract_protocol_cleanup_final.gathered |
            default([]) |
            map(attribute='name') | map('lower') |
            select('equalto', security_contract_protocol.name | lower) |
            list | length == 0
        fail_msg: >-
          Cleanup did not prove that all run-owned contract resources are
          absent.
      when: security_contract_run_owned | default(false) | bool
  module_defaults:
    cisco.nd.nd_manage_security_protocol_definitions:
      config_actions:
        save: false
        deploy: false
    cisco.nd.nd_manage_security_contracts:
      config_actions:
        save: false
        deploy: false
