---
- name: Define preprovision harness scenario data
  ansible.builtin.set_fact:
    nd4x_policy_name: preprovision
    nd4x_fabric_name: "{{ test_fabric_preprovision }}"
    nd4x_gathered_src_fabric_name: "{{ test_fabric_preprovision }}"
    nd4x_gathered_dst_fabric_name: "{{ test_fabric_preprovision }}"
    nd4x_primary_interface: Ethernet1/30
    nd4x_removed_interfaces: [Ethernet1/31, Ethernet1/32]
    nd4x_create_count: 3
    nd4x_run_overridden: "{{ nd_test_nd4x_links_run_overridden | default(false) | bool }}"
    nd4x_run_selector_tests: false
    nd4x_run_reversed: false
    nd4x_run_secret: false
    nd4x_common_args:
      output_level: "{{ nd_output_level | default('debug') }}"
      fabric_name: "{{ test_fabric_preprovision }}"
      link_scope: manage
    nd4x_module_args: {}
    nd4x_snapshot_path: "/api/v1/manage/links?fabricName={{ test_fabric_preprovision }}&max={{ nd4x_links_page_size }}&offset=0"
    nd4x_check_mode_queries:
      - name: Snapshot all managed preprovision links
        path: "/api/v1/manage/links?fabricName={{ test_fabric_preprovision }}&max={{ nd4x_links_page_size }}&offset=0"
        expected_status: 200
        pagination:
          page_size: "{{ nd4x_links_page_size }}"
          collection_key: links
          max_pages: "{{ nd4x_links_max_pages }}"
        unordered_paths: [/links]
    nd4x_nd_queries:
      - name: Validate managed preprovision links
        path: "/api/v1/manage/links?fabricName={{ test_fabric_preprovision }}&max={{ nd4x_links_page_size }}&offset=0"
        method: get
        expected_status: 200
    nd4x_create_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')]"
        exists: true
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')].configData.templateInputs.mtu"
        equals: 9000
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')].configData.templateInputs.srcInterfaceDescription"
        equals: ansible preprovision 30 source
    nd4x_update_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')].configData.templateInputs.mtu"
        equals: 9100
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')].configData.templateInputs.srcInterfaceDescription"
        equals: updated preprovision source
    nd4x_replace_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')].configData.templateInputs.srcInterfaceDescription"
        equals: replaced preprovision source
    nd4x_override_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')]"
        exists: true
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/31' & @.configData.policyType == 'preprovision')]"
        exists: false
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/32' & @.configData.policyType == 'preprovision')]"
        exists: false
    nd4x_recreate_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/31' & @.configData.policyType == 'preprovision')]"
        exists: true
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/32' & @.configData.policyType == 'preprovision')]"
        exists: true
    nd4x_delete_one_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/30' & @.configData.policyType == 'preprovision')]"
        exists: false
    nd4x_delete_bulk_expectations:
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/31' & @.configData.policyType == 'preprovision')]"
        exists: false
      - jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/32' & @.configData.policyType == 'preprovision')]"
        exists: false
    nd4x_cleanup_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/31, dst_interface_name: Ethernet1/31}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/32, dst_interface_name: Ethernet1/32}
    nd4x_create_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30, config_data: {policy_type: preprovision, template_inputs: {mtu: 9000, speed: auto, src_interface_description: "ansible preprovision 30 source", dst_interface_description: "ansible preprovision 30 destination"}}}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/31, dst_interface_name: Ethernet1/31, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "ansible preprovision 31 source"}}}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/32, dst_interface_name: Ethernet1/32, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "ansible preprovision 32 source"}}}
    nd4x_update_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30, config_data: {policy_type: preprovision, template_inputs: {mtu: 9100, speed: auto, src_interface_description: "updated preprovision source", dst_interface_description: "updated preprovision destination"}}}
    nd4x_replace_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "replaced preprovision source"}}}
    nd4x_override_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "override preprovision source"}}}
    nd4x_recreate_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/31, dst_interface_name: Ethernet1/31, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "ansible preprovision 31 source"}}}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/32, dst_interface_name: Ethernet1/32, config_data: {policy_type: preprovision, template_inputs: {src_interface_description: "ansible preprovision 32 source"}}}
    nd4x_delete_one_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/30, dst_interface_name: Ethernet1/30}
    nd4x_delete_bulk_config:
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/31, dst_interface_name: Ethernet1/31}
      - {src_fabric_name: "{{ test_fabric_preprovision }}", dst_fabric_name: "{{ test_fabric_preprovision }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/32, dst_interface_name: Ethernet1/32}

- name: Run preprovision harness lifecycle
  ansible.builtin.include_tasks: nd4x_demo_link_lifecycle.yml

- name: Verify preprovision policy-specific returned values
  ansible.builtin.assert:
    that:
      - >-
        (nd4x_create.first_run_result.after
        | selectattr('src_interface_name', 'equalto', 'Ethernet1/30')
        | first).config_data.template_inputs.mtu == 9000
      - >-
        (nd4x_update.first_run_result.after
        | selectattr('src_interface_name', 'equalto', 'Ethernet1/30')
        | first).config_data.template_inputs.mtu == 9100
      - >-
        (nd4x_replace.first_run_result.after
        | selectattr('src_interface_name', 'equalto', 'Ethernet1/30')
        | first).config_data.template_inputs.src_interface_description
        == 'replaced preprovision source'
