- name: Run nd_manage_links negative scenarios using the ND 4.x harness
  block:
    - name: Acquire lock for nd_manage_links negative scenarios
      ansible.builtin.include_tasks: nd4x_demo_acquire_scope_lock.yml

    - name: Execute primary and optional nd_manage_links negative scenarios
      ansible.builtin.include_tasks:
        file: nd4x_demo_negative.yml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_negative
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_negative
    - name: Execute apply-time nd_manage_links harness negative scenario
      ansible.builtin.include_tasks:
        file: nd4x_demo_apply_negative.yml
        apply:
          tags:
            - never
            - nd4x_demo
            - nd4x_demo_negative
            - nd4x_demo_apply_negative
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_negative
        - nd4x_demo_apply_negative
      when:
        - nd4x_links_supported | default(false) | bool
        - run_numbered | bool
  always:
    - name: Clean up the primary negative-test baseline
      cisco.nd.nd_manage_links:
        output_level: "{{ nd_output_level | default('debug') }}"
        fabric_name: "{{ test_fabric_numbered }}"
        link_scope: manage
        config:
          - src_fabric_name: "{{ test_fabric_numbered }}"
            dst_fabric_name: "{{ test_fabric_numbered }}"
            src_switch_name: "{{ test_switch_a }}"
            dst_switch_name: "{{ test_switch_b }}"
            src_interface_name: Ethernet1/30
            dst_interface_name: Ethernet1/30
        state: deleted
      register: nd4x_negative_cleanup
      failed_when: false
      when:
        - nd4x_links_supported | default(false) | bool
        - run_numbered | bool
        - nd4x_scope_lock_acquired | default(false) | bool
      tags:
        - always

    - name: Verify primary negative-test cleanup while scope lock is held
      block:
        - name: Verify primary negative-test baseline is absent
          cisco.nd.nd_rest:
            path: "/api/v1/manage/links?fabricName={{ test_fabric_numbered }}&max={{ nd4x_links_page_size }}&offset=0"
            method: get
          register: nd4x_negative_cleanup_query
          when:
            - nd4x_links_supported | default(false) | bool
            - run_numbered | bool
            - nd4x_scope_lock_acquired | default(false) | bool
          tags:
            - always

        - name: Assert primary negative-test cleanup query succeeded
          ansible.builtin.assert:
            that:
              - nd4x_negative_cleanup_query.status | int == 200
              - not nd4x_negative_cleanup_query.failed | default(false) | bool
              - nd4x_negative_cleanup_query.jsondata is mapping
              - nd4x_negative_cleanup_query.jsondata.links is defined
              - nd4x_negative_cleanup_query.jsondata.links is sequence
              - nd4x_negative_cleanup_query.jsondata.meta is mapping
              - nd4x_negative_cleanup_query.jsondata.meta.counts is mapping
              - nd4x_negative_cleanup_query.jsondata.meta.counts.remaining is defined
              - (nd4x_negative_cleanup_query.jsondata.meta.counts.remaining | string) == '0'
            fail_msg: >-
              Could not verify primary negative-test cleanup. Expected HTTP 200
              with a links collection, got status
              {{ nd4x_negative_cleanup_query.status | default('unknown') }},
              failed={{ nd4x_negative_cleanup_query.failed | default(false) }},
              response={{ nd4x_negative_cleanup_query.jsondata | default('missing') }}.
          when:
            - nd4x_links_supported | default(false) | bool
            - run_numbered | bool
            - nd4x_scope_lock_acquired | default(false) | bool
          tags:
            - always

        - name: Fail if primary negative-test cleanup did not complete
          ansible.builtin.assert:
            that:
              - not nd4x_negative_cleanup.failed | default(false) | bool
              - >-
                nd4x_negative_cleanup_query.jsondata.links | default([])
                | selectattr('srcInterfaceName', 'equalto', 'Ethernet1/30')
                | list
                | length == 0
              - >-
                nd4x_negative_cleanup_query.jsondata.links | default([])
                | selectattr('dstInterfaceName', 'equalto', 'Ethernet1/30')
                | list
                | length == 0
            fail_msg: >-
              The primary nd_manage_links negative-test baseline could not be
              verified as absent after cleanup.
          when:
            - nd4x_links_supported | default(false) | bool
            - run_numbered | bool
            - nd4x_scope_lock_acquired | default(false) | bool
          tags:
            - always
      always:
        - name: Release lock for nd_manage_links negative scenarios after verification
          ansible.builtin.include_tasks: nd4x_demo_release_scope_lock.yml
          tags:
            - always
      tags:
        - always

  tags:
    - never
    - nd4x_demo
    - nd4x_demo_negative
  when:
    - nd4x_links_supported | default(false) | bool
    - run_numbered | bool
