- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined
  tags:
    - always

# Test variables. Override any of these via inventory or extra vars at playbook time.
# The fabric names below are what the tests assume exist in ND. Either create fabrics
# matching these names in ND 4.2, or override the corresponding nd_test_fabric_* var.
- name: Set test fabric and switch variables
  ansible.builtin.set_fact:
    test_switch_a: '{{ nd_test_switch_a | default("n9k-z17-62") }}'
    test_switch_b: '{{ nd_test_switch_b | default("n9k-z17-63") }}'

    # Optional management IPs. By default policy tests resolve switches by name.
    # Set both to opt in to the numbered-policy mixed-selector tests, which verify
    # that matching name/IP selectors are accepted and conflicting ones fail safely.
    test_switch_a_ip: '{{ nd_test_switch_a_ip | default("") }}'
    test_switch_b_ip: '{{ nd_test_switch_b_ip | default("") }}'

    # Optional manage-scope change-control context. Empty by default so runs work
    # on labs without change control. Set these to exercise the clusterName /
    # ticketId query params on manage reads and mutations.
    test_cluster_name: '{{ nd_test_cluster_name | default("") }}'
    test_ticket_id: '{{ nd_test_ticket_id | default("") }}'

    test_fabric_numbered: '{{ nd_test_fabric_numbered | default(nd_test_fabric | default("ansible-fab-numbered")) }}'
    test_fabric_unnumbered: '{{ nd_test_fabric_unnumbered | default("ansible-fab-unnumbered") }}'
    test_fabric_preprovision: '{{ nd_test_fabric_preprovision | default("ansible-fab-preprov") }}'

    test_fabric_l2dci_src: '{{ nd_test_fabric_l2dci_src | default("ansible-fab-l2dci-a") }}'
    test_fabric_l2dci_dst: '{{ nd_test_fabric_l2dci_dst | default("ansible-fab-l2dci-b") }}'

    test_fabric_msite_src: '{{ nd_test_fabric_msite_src | default("ansible-fab-msd-a") }}'
    test_fabric_msite_dst: '{{ nd_test_fabric_msite_dst | default("ansible-fab-msd-b") }}'

    test_fabric_vrflite_src: '{{ nd_test_fabric_vrflite_src | default("ansible-fab-vrflite-a") }}'
    test_fabric_vrflite_dst: '{{ nd_test_fabric_vrflite_dst | default("ansible-fab-vrflite-b") }}'

    # Extended policy-family coverage is opt-in because these policies require
    # different ND fabric capabilities, templates, or switch platforms.
    test_fabric_ipv6_link_local: '{{ nd_test_fabric_ipv6_link_local | default("ansible-fab-ipv6ll") }}'
    test_fabric_l3dci_src: '{{ nd_test_fabric_l3dci_src | default("ansible-fab-l3dci-a") }}'
    test_fabric_l3dci_dst: '{{ nd_test_fabric_l3dci_dst | default("ansible-fab-l3dci-b") }}'
    test_fabric_mpls_src: '{{ nd_test_fabric_mpls_src | default("ansible-fab-mpls-a") }}'
    test_fabric_mpls_dst: '{{ nd_test_fabric_mpls_dst | default("ansible-fab-mpls-b") }}'
    test_fabric_user_defined: '{{ nd_test_fabric_user_defined | default("ansible-fab-user-defined") }}'
    test_fabric_iosxe: '{{ nd_test_fabric_iosxe | default("ansible-fab-iosxe") }}'
    test_fabric_vpc: '{{ nd_test_fabric_vpc | default("ansible-fab-vpc") }}'
    test_fabric_one_manage: '{{ nd_test_fabric_one_manage | default("ansible-fab-one-manage") }}'
    test_one_manage_src_fabric: '{{ nd_test_one_manage_src_fabric | default("ansible-fab-one-src") }}'
    test_one_manage_dst_fabric: '{{ nd_test_one_manage_dst_fabric | default("ansible-fab-one-dst") }}'
    test_one_manage_src_cluster: '{{ nd_test_one_manage_src_cluster | default("cluster-a") }}'
    test_one_manage_dst_cluster: '{{ nd_test_one_manage_dst_cluster | default("cluster-b") }}'
    test_one_manage_cluster_name: '{{ nd_test_one_manage_cluster_name | default("") }}'
    test_one_manage_ticket_id: '{{ nd_test_one_manage_ticket_id | default("") }}'
    test_apply_negative_fabric: '{{ nd_test_apply_negative_fabric | default("nd4x-apply-negative-fabric-do-not-use") }}'
    nd4x_links_page_size: '{{ nd_test_nd4x_links_page_size | default(10000) | int }}'
    nd4x_links_max_pages: '{{ nd_test_nd4x_links_max_pages | default(1000) | int }}'

    test_iosxe_switch_a: '{{ nd_test_iosxe_switch_a | default(test_switch_a) }}'
    test_iosxe_switch_b: '{{ nd_test_iosxe_switch_b | default(test_switch_b) }}'
    test_vpc_switch_a: '{{ nd_test_vpc_switch_a | default(test_switch_a) }}'
    test_vpc_switch_b: '{{ nd_test_vpc_switch_b | default(test_switch_b) }}'

    # ND4X harness safety metadata. These values are intentionally not
    # invented by the target: the caller must identify the dedicated test
    # scope and explicitly confirm that the fabrics/switches/interfaces are
    # isolated from other work.
    nd4x_links_scope_owner: '{{ nd_test_nd4x_links_scope_owner | default("") }}'
    nd4x_links_scope_isolated: '{{ nd_test_nd4x_links_scope_isolated | default(false) | bool }}'
    nd4x_scope_lock_path: >-
      {{ nd_test_nd4x_links_scope_lock_path
         | default(
             '/tmp/nd4x-nd_manage_links-' ~
             ((ansible_host | default(inventory_hostname))
              | regex_replace('[^A-Za-z0-9_.-]', '_')),
             true
           ) }}


    # Per policy enable flags. Numbered runs by default (matches existing CI).
    # nd_test_run_all=true enables the complete non-destructive harness matrix.
    # Individual flags remain available for focused scenario runs.
    run_numbered: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_numbered | default(true) | bool }}
    run_unnumbered: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_unnumbered | default(false) | bool }}
    run_preprovision: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_preprovision | default(false) | bool }}
    run_layer2_dci: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_layer2_dci | default(false) | bool }}
    run_multisite_overlay: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_multisite_overlay | default(false) | bool }}
    run_multisite_underlay: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_multisite_underlay | default(false) | bool }}
    run_ebgp_vrf_lite: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_ebgp_vrf_lite | default(false) | bool }}
    run_ipv6_link_local: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_ipv6_link_local | default(false) | bool }}
    run_layer3_dci_vrf_lite: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_layer3_dci_vrf_lite | default(false) | bool }}
    run_mpls_underlay: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_mpls_underlay | default(false) | bool }}
    run_mpls_overlay: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_mpls_overlay | default(false) | bool }}
    run_user_defined: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_user_defined | default(false) | bool }}
    run_iosxe_numbered: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_iosxe_numbered | default(false) | bool }}
    run_vpc_peer_keepalive: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_vpc_peer_keepalive | default(false) | bool }}
    run_one_manage: >-
      {{ nd_test_run_all | default(false) | bool
         or nd_test_run_one_manage | default(false) | bool }}

  tags:
    - always

- name: Build harness scenario selection report
  ansible.builtin.set_fact:
    nd4x_harness_scenario_selection:
      - {name: numbered, enabled: "{{ run_numbered | bool }}", acceptance: implemented-default}
      - {name: unnumbered, enabled: "{{ run_unnumbered | bool }}", acceptance: implemented-opt-in}
      - {name: preprovision, enabled: "{{ run_preprovision | bool }}", acceptance: implemented-opt-in}
      - {name: layer2Dci, enabled: "{{ run_layer2_dci | bool }}", acceptance: implemented-opt-in}
      - {name: multisiteOverlay, enabled: "{{ run_multisite_overlay | bool }}", acceptance: implemented-opt-in}
      - {name: multisiteUnderlay, enabled: "{{ run_multisite_underlay | bool }}", acceptance: implemented-opt-in}
      - {name: ebgpVrfLite, enabled: "{{ run_ebgp_vrf_lite | bool }}", acceptance: implemented-opt-in}
      - {name: ipv6LinkLocal, enabled: "{{ run_ipv6_link_local | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: layer3DciVrfLite, enabled: "{{ run_layer3_dci_vrf_lite | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: mplsUnderlay, enabled: "{{ run_mpls_underlay | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: mplsOverlay, enabled: "{{ run_mpls_overlay | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: userDefined, enabled: "{{ run_user_defined | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: iosXeNumbered, enabled: "{{ run_iosxe_numbered | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: vpcPeerKeepalive, enabled: "{{ run_vpc_peer_keepalive | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: one_manage, enabled: "{{ run_one_manage | bool }}", acceptance: implemented-opt-in-lab-gated}
      - {name: auto_scope, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: switch_id_selectors, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: ebgp_password_variants, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: macsec_fields, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: qkd_fields, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: netflow_fields, enabled: false, acceptance: deferred-no-dedicated-scenario}
      - {name: policy_field_combinations, enabled: false, acceptance: deferred-no-dedicated-scenario}
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_extended

- name: Report enabled and skipped harness scenarios
  ansible.builtin.debug:
    msg:
      full_matrix_requested: "{{ nd_test_run_all | default(false) | bool }}"
      enabled: >-
        {{ nd4x_harness_scenario_selection
           | selectattr('enabled', 'equalto', true)
           | map(attribute='name') | list }}
      skipped: >-
        {{ nd4x_harness_scenario_selection
           | rejectattr('enabled', 'equalto', true)
           | map(attribute='name') | list }}
      lab_gated_not_selected: >-
        {{ nd4x_harness_scenario_selection
           | selectattr('enabled', 'equalto', false)
           | selectattr('acceptance', 'equalto', 'implemented-opt-in-lab-gated')
           | map(attribute='name') | list }}
      deferred_acceptance: >-
        {{ nd4x_harness_scenario_selection
           | selectattr('acceptance', 'equalto', 'deferred-no-dedicated-scenario')
           | map(attribute='name') | list }}
      overridden_state_enabled: >-
        {{ nd_test_nd4x_links_run_overridden | default(false) | bool
           and nd_test_nd4x_links_destructive_tests | default(false) | bool }}
      overridden_state_note: >-
        Fabric-wide overridden coverage is skipped unless both
        nd_test_nd4x_links_run_overridden=true and
        nd_test_nd4x_links_destructive_tests=true are supplied.
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_extended

