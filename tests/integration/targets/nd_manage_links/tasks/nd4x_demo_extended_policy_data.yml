---
- name: Define extended nd_manage_links harness policy matrix
  ansible.builtin.set_fact:
    nd4x_extended_manage_cases:
      - name: ipv6LinkLocal
        enabled: "{{ run_ipv6_link_local | bool }}"
        scope: manage
        fabric: "{{ test_fabric_ipv6_link_local }}"
        src_fabric: "{{ test_fabric_ipv6_link_local }}"
        dst_fabric: "{{ test_fabric_ipv6_link_local }}"
        src_switch: "{{ test_switch_a }}"
        dst_switch: "{{ test_switch_b }}"
        primary_interface: Ethernet1/50
        removed_interfaces: [Ethernet1/51]
        create_config:
          - {src_fabric_name: "{{ test_fabric_ipv6_link_local }}", dst_fabric_name: "{{ test_fabric_ipv6_link_local }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/50, dst_interface_name: Ethernet1/50, config_data: {policy_type: ipv6LinkLocal, template_inputs: {interface_admin_state: true, mtu: 9216, speed: auto, fec: auto, src_interface_description: "ansible ipv6ll 50 source", dst_interface_description: "ansible ipv6ll 50 destination"}}}
          - {src_fabric_name: "{{ test_fabric_ipv6_link_local }}", dst_fabric_name: "{{ test_fabric_ipv6_link_local }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/51, dst_interface_name: Ethernet1/51, config_data: {policy_type: ipv6LinkLocal, template_inputs: {interface_admin_state: true, mtu: 9216, speed: auto, fec: auto}}}
        update_config:
          - {src_fabric_name: "{{ test_fabric_ipv6_link_local }}", dst_fabric_name: "{{ test_fabric_ipv6_link_local }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/50, dst_interface_name: Ethernet1/50, config_data: {policy_type: ipv6LinkLocal, template_inputs: {interface_admin_state: false, mtu: 1500, speed: auto, src_interface_description: "updated ipv6ll source"}}}
        replace_config:
          - {src_fabric_name: "{{ test_fabric_ipv6_link_local }}", dst_fabric_name: "{{ test_fabric_ipv6_link_local }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/50, dst_interface_name: Ethernet1/50, config_data: {policy_type: ipv6LinkLocal, template_inputs: {interface_admin_state: true, mtu: 9216}}}
        recreate_config:
          - {src_fabric_name: "{{ test_fabric_ipv6_link_local }}", dst_fabric_name: "{{ test_fabric_ipv6_link_local }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/51, dst_interface_name: Ethernet1/51, config_data: {policy_type: ipv6LinkLocal, template_inputs: {interface_admin_state: true, mtu: 9216}}}
        query_paths:
          - {name: Validate ipv6LinkLocal links, path: "/api/v1/manage/links?fabricName={{ test_fabric_ipv6_link_local }}&max={{ nd4x_links_page_size }}&offset=0"}
        create_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'ipv6LinkLocal')].configData.templateInputs.mtu", equals: 9216}
        update_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'ipv6LinkLocal')].configData.templateInputs.mtu", equals: 1500}
        replace_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'ipv6LinkLocal')].configData.templateInputs.mtu", equals: 9216}
        recreate_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/51' & @.configData.policyType == 'ipv6LinkLocal')]", exists: true}
        delete_one_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'ipv6LinkLocal')]", exists: false}
        delete_bulk_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/51' & @.configData.policyType == 'ipv6LinkLocal')]", exists: false}

