        update_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'layer3DciVrfLite')].configData.templateInputs.linkMtu", equals: 1500}
        replace_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'layer3DciVrfLite')].configData.templateInputs.linkMtu", equals: 9216}
        recreate_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/51' & @.configData.policyType == 'layer3DciVrfLite')]", exists: true}
        delete_one_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/50' & @.configData.policyType == 'layer3DciVrfLite')]", exists: false}
        delete_bulk_expectations:
          - {jsonpath: "$.current.links[?(@.srcInterfaceName == 'Ethernet1/51' & @.configData.policyType == 'layer3DciVrfLite')]", exists: false}

      - name: mplsUnderlay
