        recreate_config:
          - {src_fabric_name: "{{ test_fabric_l3dci_src }}", dst_fabric_name: "{{ test_fabric_l3dci_dst }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/51, dst_interface_name: Ethernet1/51, config_data: {policy_type: layer3DciVrfLite, template_inputs: {src_ip_address_mask: "10.99.51.1/30", dst_ip_address_mask: "10.99.51.2/30", src_vrf_name: tenant-a, dst_vrf_name: tenant-a, link_mtu: 9216}}}
