          - {src_fabric_name: "{{ test_fabric_mpls_src }}", dst_fabric_name: "{{ test_fabric_mpls_dst }}", src_switch_name: "{{ test_switch_a }}", dst_switch_name: "{{ test_switch_b }}", src_interface_name: Ethernet1/53, dst_interface_name: Ethernet1/53, config_data: {policy_type: mplsUnderlay, template_inputs: {mpls_fabric_type: mplsSr, dci_routing_protocol: is-is, sr_global_block_range: "16000-23999", src_sr_index: 102, dst_sr_index: 103, src_ip_address_mask: "10.99.61.1/30", dst_ip_address: "10.99.61.2", link_mtu: 9216}}}
