- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ mso_output_level | default("debug") }}'
    # Test L3Out variables - update these for your environment
    test_l3out_name: ansible-test-l3out
    test_l3out_bgp_name: ansible-test-l3out-bgp
    test_l3out_static_name: ansible-test-l3out-static
    test_l3out_svi_name: ansible-test-l3out-svi

# ============================================================
# Version check - nd_l3out requires ND 4.1 or later
# ============================================================
- name: Query ND version
  cisco.nd.nd_version:
    state: gathered
  register: nd_version

- name: Execute L3Out tests only for ND version >= 4.1
  when: nd_version.current.platformVersion is version('4.1', '>=')
  block:

    # ============================================================
    # CLEANUP - ensure test L3Outs do not exist before starting
    # ============================================================
    - name: Ensure test L3Outs do not exist
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: deleted
        config:
          - name: "{{ test_l3out_name }}"
          - name: "{{ test_l3out_bgp_name }}"
          - name: "{{ test_l3out_static_name }}"
          - name: "{{ test_l3out_svi_name }}"

    # ============================================================
    # CREATE - L3Out with routed interfaces and BGP
    # ============================================================
    - name: Create L3Out with routed interfaces and BGP (check mode)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_bgp_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            tenant1_name: "{{ tenant1_name | default(omit) }}"
            tenant2_name: "{{ tenant2_name | default(omit) }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.0.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.0.2
            routing_details:
              routing_protocol: bgp
              auth: false
              bfd: true
              hold_interval: 180
              keep_alive_interval: 60
              fabric1_details:
                advertise_default_route: true
                ipv4_peering_details:
                  ipv4_route_map_in: rm-in
                  ipv4_route_map_out: rm-out
      check_mode: true
      register: cm_create_l3out_bgp

    - name: Create L3Out with routed interfaces and BGP
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_bgp_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            tenant1_name: "{{ tenant1_name | default(omit) }}"
            tenant2_name: "{{ tenant2_name | default(omit) }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.0.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.0.2
            routing_details:
              routing_protocol: bgp
              auth: false
              bfd: true
              hold_interval: 180
              keep_alive_interval: 60
              fabric1_details:
                advertise_default_route: true
                ipv4_peering_details:
                  ipv4_route_map_in: rm-in
                  ipv4_route_map_out: rm-out
      register: create_l3out_bgp

    - name: Create L3Out with routed interfaces and BGP again (idempotency)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_bgp_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            tenant1_name: "{{ tenant1_name | default(omit) }}"
            tenant2_name: "{{ tenant2_name | default(omit) }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.0.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.0.2
            routing_details:
              routing_protocol: bgp
              auth: false
              bfd: true
              hold_interval: 180
              keep_alive_interval: 60
              fabric1_details:
                advertise_default_route: true
                ipv4_peering_details:
                  ipv4_route_map_in: rm-in
                  ipv4_route_map_out: rm-out
      register: create_l3out_bgp_again

    # ============================================================
    # CREATE - L3Out with subInterface and static routing
    # ============================================================
    - name: Create L3Out with subInterface and static routing
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_static_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: fabric1
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: subInterface
              links:
                - dot1q_id: 100
                  mtu: 1500
                  ipv4_mask_length: 24
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_subif_interface | default('Ethernet1/2') }}"
                    ipv4_address: 192.168.100.1
                    interface_description: "Link to external network"
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_subif_interface | default('Ethernet1/2') }}"
                    ipv4_address: 192.168.100.2
                    interface_description: "Link from DC1"
            routing_details:
              routing_protocol: static
              fabric1_static_routes:
                - ip_version: ipv4
                  ip_prefix: 0.0.0.0/0
                  next_hop: 192.168.100.254
                  switch_ids:
                    - "{{ switch1_id }}"
                  route_preference: 1
      register: create_l3out_static

    # ============================================================
    # CREATE - L3Out with SVI and dual-stack
    # ============================================================
    - name: Create L3Out with SVI interface and dual-stack
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_svi_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: both
            ip_version: both
            connectivity_details:
              routing_interface_type: svi
              links:
                - vlan_id: 200
                  mtu: 9216
                  ipv4_mask_length: 24
                  ipv6_prefix_length: 64
                  ipv4_pim: true
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: Vlan200
                    ipv4_address: 10.200.0.1
                    ipv6_address: "2001:db8:200::1"
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: Vlan200
                    ipv4_address: 10.200.0.2
                    ipv6_address: "2001:db8:200::2"
            routing_details:
              routing_protocol: bgp
              bfd: true
              fabric1_details:
                advertise_host_routes: true
                ipv4_peering_details:
                  ipv4_route_map_in: rm-v4-in
                  ipv4_route_map_out: rm-v4-out
                ipv6_peering_details:
                  ipv6_route_map_in: rm-v6-in
                  ipv6_route_map_out: rm-v6-out
      register: create_l3out_svi

    # ============================================================
    # QUERY - read back L3Outs
    # ============================================================
    - name: Query specific L3Out
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: gathered
        config:
          - name: "{{ test_l3out_bgp_name }}"
      register: query_l3out

    - name: Query all L3Outs
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: gathered
      register: query_all_l3outs

    # ============================================================
    # UPDATE - merge changes to existing L3Out
    # ============================================================
    - name: Update BGP L3Out - change hold_interval
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: merged
        config:
          - name: "{{ test_l3out_bgp_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.0.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.0.2
            routing_details:
              routing_protocol: bgp
              auth: false
              bfd: true
              hold_interval: 240  # Changed from 180
              keep_alive_interval: 60
              fabric1_details:
                advertise_default_route: true
                ipv4_peering_details:
                  ipv4_route_map_in: rm-in
                  ipv4_route_map_out: rm-out
      register: update_l3out_bgp

    # ============================================================
    # REPLACE - completely replace L3Out configuration
    # ============================================================
    - name: Replace L3Out configuration (check mode)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: replaced
        config:
          - name: "{{ test_l3out_static_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: both  # Changed from fabric1
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed  # Changed from subInterface
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.1.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.1.2
            routing_details:
              routing_protocol: bgp  # Changed from static
              bfd: false
              fabric1_details:
                advertise_default_route: false
      check_mode: true
      register: cm_replace_l3out

    - name: Replace L3Out configuration
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: replaced
        config:
          - name: "{{ test_l3out_static_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.1.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.1.2
            routing_details:
              routing_protocol: bgp
              bfd: false
              fabric1_details:
                advertise_default_route: false
      register: replace_l3out

    - name: Replace L3Out configuration again (idempotency)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: replaced
        config:
          - name: "{{ test_l3out_static_name }}"
            fabric1_name: "{{ fabric1_name }}"
            fabric2_name: "{{ fabric2_name }}"
            vrf1_name: "{{ vrf1_name }}"
            vrf2_name: "{{ vrf2_name }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: routed
              links:
                - mtu: 9216
                  ipv4_mask_length: 30
                  switch1_details:
                    switch_id: "{{ switch1_id }}"
                    interface_name: "{{ switch1_interface }}"
                    ipv4_address: 10.0.1.1
                  switch2_details:
                    switch_id: "{{ switch2_id }}"
                    interface_name: "{{ switch2_interface }}"
                    ipv4_address: 10.0.1.2
            routing_details:
              routing_protocol: bgp
              bfd: false
              fabric1_details:
                advertise_default_route: false
      register: replace_l3out_again

    # ============================================================
    # DELETE - specific L3Outs
    # ============================================================
    - name: Delete SVI L3Out (check mode)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: deleted
        config:
          - name: "{{ test_l3out_svi_name }}"
      check_mode: true
      register: cm_delete_l3out

    - name: Delete SVI L3Out
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: deleted
        config:
          - name: "{{ test_l3out_svi_name }}"
      register: delete_l3out

    - name: Delete SVI L3Out again (idempotency - already gone)
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: deleted
        config:
          - name: "{{ test_l3out_svi_name }}"
      register: delete_l3out_again

    # ============================================================
    # DELETE - all L3Outs in fabric
    # ============================================================
    - name: Delete all remaining test L3Outs
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: deleted
        config:
          - name: "{{ test_l3out_bgp_name }}"
          - name: "{{ test_l3out_static_name }}"
      register: delete_remaining_l3outs

    - name: Query all L3Outs after cleanup
      cisco.nd.nd_l3out:
        <<: *nd_info
        fabric: "{{ fabric_name }}"
        state: gathered
      register: query_after_delete

    # ============================================================
    # ASSERTIONS
    # ============================================================
    - name: Verify all assertions
      ansible.builtin.assert:
        that:
          # Create check mode reports changed
          - cm_create_l3out_bgp.changed is true
          # Real create reports changed
          - create_l3out_bgp.changed is true
          # Idempotency: same config, no change
          - create_l3out_bgp_again.changed is false
          # Static L3Out created successfully
          - create_l3out_static.changed is true
          # SVI L3Out created successfully
          - create_l3out_svi.changed is true
          # Query returns expected L3Out
          - query_l3out.l3outs | length == 1
          - query_l3out.l3outs[0].name == test_l3out_bgp_name
          # Query never reports changed
          - query_l3out.changed is false
          - query_all_l3outs.changed is false
          # All 3 L3Outs should exist
          - query_all_l3outs.l3outs | length >= 3
          # Update causes a change
          - update_l3out_bgp.changed is true
          # Replace check mode reports changed
          - cm_replace_l3out.changed is true
          # Replace causes a change
          - replace_l3out.changed is true
          # Replace idempotency
          - replace_l3out_again.changed is false
          # Delete check mode reports changed
          - cm_delete_l3out.changed is true
          # Delete reports changed
          - delete_l3out.changed is true
          # Delete idempotency (already absent)
          - delete_l3out_again.changed is false
          # Cleanup of remaining L3Outs
          - delete_remaining_l3outs.changed is true
