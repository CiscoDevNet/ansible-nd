---
- name: Recheck ownership immediately before every real broad override
  ansible.builtin.include_tasks: ownership.yaml
  when:
    - ss_state == 'overridden'
    - not ss_check | default(false)

- name: "{{ ss_case }}"
  cisco.nd.nd_manage_smart_switches_onboarding:
    fabric_name: "{{ nd_test_smart_switches_fabric_name }}"
    cluster_name: "{{ nd_test_smart_switches_cluster_name | default(omit, true) }}"
    state: "{{ ss_state }}"
    config: "{{ ss_config }}"
    output_level: debug
  check_mode: "{{ ss_check | default(false) }}"
  register: ss_result
  ignore_errors: "{{ ss_failure | default(false) }}"

- name: Check result confidence and exact association snapshots
  ansible.builtin.include_tasks: assert_result.yaml

- name: Verify full fabric state independently after the invocation
  ansible.builtin.include_tasks: verify.yaml
  vars:
    ss_expected_ids: "{{ ss_before if ss_check | default(false) else ss_after }}"
