---

- name: Verify absent baseline for optional controller failures
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/helpers/verify.yaml"
  vars:
    ss_expected_ids: []

- name: Test controller mixed success and failure in one bulk request
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/helpers/run_case.yaml"
  vars:
    ss_case:
      name: CONTROLLER mixed resource outcomes
      state: replaced
      config:
        - switch_id: "{{ ss_a }}"
          integration_name: "{{ nd_test_smart_switches_integration_name }}"
        - switch_id: "{{ ss_b }}"
          integration_name: "{{ nd_test_smart_switches_rejection_integration_name }}"
      expect:
        changed: true
        before_ids: []
        after_ids: "{{ [ss_a] }}"
        failed: true
        created: "{{ [ss_a] }}"
        rejected: "{{ [ss_b] }}"

- name: Reset only owned fixtures after mixed failure
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/helpers/run_case.yaml"
  vars:
    ss_case:
      name: CONTROLLER reset confirmed successful association
      state: deleted
      config: "{{ ss_delete_both }}"
      expect:
        changed: true
        before_ids: "{{ [ss_a] }}"
        after_ids: []
        deleted: "{{ [ss_a] }}"

- name: Test controller all-resource failure from absent baseline
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/helpers/run_case.yaml"
  vars:
    ss_case:
      name: CONTROLLER all resource outcomes failed
      state: replaced
      config:
        - switch_id: "{{ ss_a }}"
          integration_name: "{{ nd_test_smart_switches_rejection_integration_name }}"
        - switch_id: "{{ ss_b }}"
          integration_name: "{{ nd_test_smart_switches_rejection_integration_name }}"
      expect:
        changed: false
        before_ids: []
        after_ids: []
        failed: true
        rejected: "{{ [ss_a, ss_b] }}"
