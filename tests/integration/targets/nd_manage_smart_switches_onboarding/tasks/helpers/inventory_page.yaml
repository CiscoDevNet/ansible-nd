---

- name: Read fabric inventory page independently of the onboarding module
  cisco.nd.nd_rest:
    method: get
    path: >-
      /api/v1/manage/fabrics/{{ nd_test_smart_switches_fabric_name | urlencode | replace('/', '%2F') }}/switches?max={{ nd_test_smart_switches_page_size
      | int }}&offset={{ ss_offset }}&sort=switchId%3Aasc{{ ('&clusterName=' ~ (nd_test_smart_switches_cluster_name | urlencode)) if nd_test_smart_switches_cluster_name
      | length > 0 else '' }}
  register: ss_page
  changed_when: false

- name: Validate inventory response wrapper and metadata
  ansible.builtin.assert:
    that:
      - ss_page.status | int == 200
      - ss_page.jsondata is mapping
      - ss_page.jsondata.switches is sequence
      - ss_page.jsondata.switches is not string
      - ss_page.jsondata.switches is not mapping
      - ss_page.jsondata.meta | default({}) is mapping

- name: Validate every row before retaining this page
  ansible.builtin.assert:
    that:
      - ss_row is mapping
      - ss_row.switchId is string
      - ss_row.switchId | length > 0
      - ss_row.switchId not in ss_seen_ids
      - ss_row.fabricName | default(nd_test_smart_switches_fabric_name) == nd_test_smart_switches_fabric_name
      - ss_row.additionalData | default({}) is mapping
      - ss_row.additionalSwitchData | default({}) is mapping
      - ss_row.additionalData is not defined or ss_row.additionalSwitchData is not defined or ss_row.additionalData == ss_row.additionalSwitchData
      - ss_additional.smartSwitch | default(false) is boolean
      - not ss_additional.smartSwitch | default(false) or ss_additional.hypershieldIntegrationName is defined
      - ss_additional.hypershieldIntegrationName | default('') is string
      - ss_additional.smartSwitch | default(false) or ss_additional.hypershieldIntegrationName | default('') == ""
    fail_msg: Missing, duplicate, cross-fabric or ambiguous inventory evidence; refusing writes.
  vars:
    ss_additional: "{{ ss_row.additionalData | default(ss_row.additionalSwitchData | default({})) }}"
  loop: "{{ ss_page.jsondata.switches }}"
  loop_control:
    loop_var: ss_row
    label: "{{ ss_row.switchId | default('missing-switchId') }}"

- name: Reject duplicate identifiers within this page
  vars:
    ss_page_ids: "{{ ss_page.jsondata.switches | map(attribute='switchId') | list }}"
  ansible.builtin.assert:
    that:
      - ss_page_ids | length == ss_page_ids | unique(case_sensitive=true) | length

- name: Retain validated rows and identifier membership once per page
  vars:
    ss_page_ids: "{{ ss_page.jsondata.switches | map(attribute='switchId') | list }}"
  ansible.builtin.set_fact:
    ss_inventory_rows: "{{ ss_inventory_rows + ss_page.jsondata.switches }}"
    ss_seen_ids: "{{ ss_seen_ids | combine(dict(ss_page_ids | zip(ss_page_ids))) }}"

- name: Advance collected row count
  ansible.builtin.set_fact:
    ss_offset: "{{ ss_offset | int + ss_page.jsondata.switches | length }}"

- name: Validate supplied inventory counts
  vars:
    ss_counts: "{{ ss_page.jsondata.meta.counts }}"
  ansible.builtin.assert:
    that:
      - ss_counts is mapping
      - ss_counts.total is integer
      - ss_counts.total is not boolean
      - ss_counts.remaining is integer
      - ss_counts.remaining is not boolean
      - ss_counts.total >= 0
      - ss_counts.remaining >= 0
      - ss_total | int == -1 or ss_counts.total == ss_total | int
      - ss_offset | int <= ss_counts.total
      - ss_counts.remaining == ss_counts.total - ss_offset | int
      - ss_counts.remaining == 0 or ss_page.jsondata.switches | length > 0
    fail_msg: Inventory counts changed, are malformed, or made no progress; refusing an incomplete snapshot.
  when: ss_page.jsondata.meta.counts is defined

- name: Record supplied total and terminal page
  ansible.builtin.set_fact:
    ss_total: "{{ ss_page.jsondata.meta.counts.total }}"
    ss_inventory_done: "{{ ss_page.jsondata.meta.counts.remaining == 0 }}"
  when: ss_page.jsondata.meta.counts is defined

- name: Terminate count-free pagination only on an empty page
  ansible.builtin.set_fact:
    ss_inventory_done: true
  when:
    - ss_page.jsondata.meta.counts is not defined
    - ss_page.jsondata.switches | length == 0

- name: Reject premature count-free termination after a counted page
  ansible.builtin.assert:
    that:
      - ss_total | int == -1 or ss_offset | int == ss_total | int
  when:
    - ss_inventory_done
    - ss_page.jsondata.meta.counts is not defined

- name: Advance bounded page counter
  ansible.builtin.set_fact:
    ss_inventory_page_number: "{{ ss_inventory_page_number | int + 1 }}"

- name: Read another page only while incomplete and within bounds
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/helpers/inventory_page.yaml"
  when:
    - not ss_inventory_done
    - ss_inventory_page_number | int < nd_test_smart_switches_max_pages | int
