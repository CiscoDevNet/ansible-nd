---
- name: Validate exact inventory identity and additional-data variants
  ansible.builtin.assert:
    that:
      - ss_row is mapping
      - ss_row.switchId is string
      - ss_row.switchId | length > 0
      - ss_row.switchId not in ss_inventory
      - ss_row.fabricName | default(nd_test_smart_switches_fabric_name) == nd_test_smart_switches_fabric_name
      - ss_row.additionalData | default({}) is mapping
      - ss_row.additionalSwitchData | default({}) is mapping
      - >-
        ss_row.additionalData is not defined or ss_row.additionalSwitchData is not defined
        or ss_row.additionalData == ss_row.additionalSwitchData
    fail_msg: Missing, duplicate, cross-fabric or ambiguous inventory evidence; refusing writes.

- name: Select current additional-data spelling
  ansible.builtin.set_fact:
    ss_additional: "{{ ss_row.additionalData | default(ss_row.additionalSwitchData | default({})) }}"

- name: Validate explicit Smart capability and association state
  ansible.builtin.assert:
    that:
      - ss_additional.smartSwitch | default(false) is boolean
      - not ss_additional.smartSwitch | default(false) or ss_additional.hypershieldIntegrationName is defined
      - ss_additional.hypershieldIntegrationName | default('') is string
      - ss_additional.smartSwitch | default(false) or ss_additional.hypershieldIntegrationName | default('') == ""
    fail_msg: Inventory cannot establish unambiguous onboarding state.

- name: Retain complete inventory keyed by exact switch ID
  ansible.builtin.set_fact:
    ss_inventory: >-
      {{ ss_inventory | combine({ss_row.switchId: {
      'switch_id': ss_row.switchId,
      'switch_name': ss_row.hostname | default(none),
      'smart': ss_additional.smartSwitch | default(false),
      'integration_name': ss_additional.hypershieldIntegrationName | default('')}}) }}
    ss_associations: >-
      {{ ss_associations + ([{'switch_id': ss_row.switchId,
      'switch_name': ss_row.hostname | default(none),
      'integration_name': ss_additional.hypershieldIntegrationName}]
      if ss_additional.hypershieldIntegrationName | default('') | length > 0 else []) }}
