- name: Run the ND 4.x fabric harness preflight
  ansible.builtin.include_tasks:
    file: nd4x_demo_preflight.yaml
    apply:
      tags:
        - never
        - nd4x_demo
        - nd4x_demo_preflight
        - nd4x_demo_ibgp
        - nd4x_demo_ebgp
        - nd4x_demo_campus
        - nd4x_demo_external
        - nd4x_demo_ai_ibgp
        - nd4x_demo_ai_ebgp
  tags:
    - never
    - nd4x_demo
    - nd4x_demo_preflight
    - nd4x_demo_ibgp
    - nd4x_demo_ebgp
    - nd4x_demo_campus
    - nd4x_demo_external
    - nd4x_demo_ai_ibgp
    - nd4x_demo_ai_ebgp
  when: nd4x_fabric_harness_only | default(false) | bool

- name: Run the ND 4.x iBGP fabric harness scenarios
  block:
    - name: Include iBGP fabric scenario tasks
      ansible.builtin.include_tasks:
        file: nd4x_demo_fabric_stateful.yaml
        apply:
          tags: [nd4x_demo, nd4x_demo_ibgp]
  always:
    - name: Clean up disposable iBGP fabric harness resources
      cisco.nd.nd4x_module_test:
        module: "{{ nd4x_fabric_case.module }}"
        state: deleted
        config: "{{ nd4x_fabric_case.cleanup_config }}"
        common_args:
          output_level: "{{ nd_info.output_level }}"
        check_mode: false
        idempotency: false
      ignore_errors: true
  vars:
    nd4x_fabric_case: "{{ nd4x_fabric_cases.ibgp }}"
    ansible_command_timeout: 300
  tags: [never, nd4x_demo, nd4x_demo_ibgp]
  when:
    - nd4x_fabric_harness_only | default(false) | bool
    - nd4x_supported | default(false) | bool

