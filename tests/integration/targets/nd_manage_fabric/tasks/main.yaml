---
- name: Generate a collision-resistant fabric integration run identifier
  ansible.builtin.set_fact:
    nd_fabric_test_run_id: "{{ lookup('ansible.builtin.password', '/dev/null', length=10, chars=['ascii_lowercase', 'digits']) }}"
  when: nd_fabric_test_run_id is not defined
  tags: [always]

- name: Detect an ND 4.x harness-only target run
  ansible.builtin.set_fact:
    nd4x_fabric_harness_only: >-
      {{ (ansible_run_tags | default(['all']))
         | intersect([
             'nd4x_demo', 'nd4x_demo_preflight', 'nd4x_demo_ibgp',
             'nd4x_demo_ebgp', 'nd4x_demo_campus', 'nd4x_demo_external',
             'nd4x_demo_ai_ibgp', 'nd4x_demo_ai_ebgp'
           ]) | length > 0 }}
  tags: [always]

- name: Define the disposable Campus failure-cleanup probe
  ansible.builtin.set_fact:
    campus_cleanup_failure_probe: "ndit_{{ nd_fabric_test_run_id }}_campus_cleanup"
    campus_cleanup_controlled_failure_observed: false
  tags: [always]

- name: Run nd_manage_fabric iBGP tests
  block:
    - name: Include iBGP test scenarios
      ansible.builtin.include_tasks: fabric_ibgp.yaml
  always:
    - name: Always remove disposable iBGP test fabrics
      cisco.nd.nd_manage_fabric_ibgp_vxlan:
        output_level: '{{ api_key_output_level | default("debug") }}'
        state: deleted
        config:
          - fabric_name: "{{ test_fabric_merged }}"
          - fabric_name: "{{ test_fabric_replaced }}"
          - fabric_name: "{{ test_fabric_deleted }}"
          - fabric_name: "{{ test_fabric_config_actions }}"
          - fabric_name: "{{ ibgp_multi_fabric_1 }}"
          - fabric_name: "{{ ibgp_multi_fabric_2 }}"
      ignore_errors: true
      tags: [cleanup, always]
  when: not (nd4x_fabric_harness_only | default(false) | bool)

- name: Run nd_manage_fabric Campus iBGP VXLAN tests
  block:
    - name: Prove Campus cleanup executes after a controlled failure
      block:
        - name: Create the disposable Campus failure-cleanup probe
          cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
            output_level: '{{ api_key_output_level | default("debug") }}'
            state: merged
            config:
              - fabric_name: "{{ campus_cleanup_failure_probe }}"
                management:
                  bgp_asn: "65099"
          register: campus_cleanup_failure_create

        - name: Verify the Campus failure-cleanup probe was created
          ansible.builtin.assert:
            that:
              - campus_cleanup_failure_create is changed
              - campus_cleanup_failure_create is not failed

        - name: Trigger the expected Campus cleanup failure path
          ansible.builtin.fail:
            msg: "Expected controlled failure for Campus cleanup verification"

      rescue:
        - name: Verify and record the expected controlled failure
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Expected controlled failure for Campus cleanup verification"

        - name: Record that the controlled Campus failure was observed
          ansible.builtin.set_fact:
            campus_cleanup_controlled_failure_observed: true

      always:
        - name: Remove the Campus failure-cleanup probe after the controlled failure
          cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
            output_level: '{{ api_key_output_level | default("debug") }}'
            state: deleted
            config:
              - fabric_name: "{{ campus_cleanup_failure_probe }}"

    - name: Verify the controlled Campus failure was rescued
      ansible.builtin.assert:
        that:
          - campus_cleanup_controlled_failure_observed | default(false) | bool

    - name: Delete the Campus failure-cleanup probe a second time
      cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
        output_level: '{{ api_key_output_level | default("debug") }}'
        state: deleted
        config:
          - fabric_name: "{{ campus_cleanup_failure_probe }}"
      register: campus_cleanup_failure_second_delete

    - name: Verify the controlled-failure teardown already removed the probe
      ansible.builtin.assert:
        that:
          - campus_cleanup_failure_second_delete is not changed
          - campus_cleanup_failure_second_delete is not failed

    - name: Include Campus iBGP VXLAN test scenarios
      ansible.builtin.include_tasks: fabric_campus.yaml
  always:
    - name: Always remove disposable Campus iBGP VXLAN test fabrics
      cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
        output_level: '{{ api_key_output_level | default("debug") }}'
        state: deleted
        config:
          - fabric_name: "{{ campus_test_fabric_merged }}"
          - fabric_name: "{{ campus_test_fabric_replaced }}"
          - fabric_name: "{{ campus_test_fabric_deleted }}"
          - fabric_name: "{{ campus_test_fabric_config_actions }}"
          - fabric_name: "{{ campus_cleanup_failure_probe }}"
      ignore_errors: true
      tags: [cleanup, always]
  when: not (nd4x_fabric_harness_only | default(false) | bool)

- name: Run nd_manage_fabric eBGP tests
  block:
