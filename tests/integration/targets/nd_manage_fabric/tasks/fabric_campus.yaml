- name: "TEST 2c: Replace fabric with only required fields (all optional settings revert to defaults)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ campus_test_fabric_replaced }}"
        category: fabric
        management:
          type: vxlanCampus
          bgp_asn: "65004"
  register: campus_replaced_result_3
  tags: [test_replaced, test_replaced_defaults]

- name: "TEST 2c: Verify fabric was replaced (optional settings reverted to defaults)"
  assert:
    that:
      - campus_replaced_result_3 is changed
      - campus_replaced_result_3 is not failed
