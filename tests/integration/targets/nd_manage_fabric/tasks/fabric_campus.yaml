  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ campus_test_fabric_replaced }}"
        management:
          bgp_asn: "65004"
  register: campus_replaced_result_4
