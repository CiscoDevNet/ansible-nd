    that:
      - campus_replaced_result_4 is not changed
      - campus_replaced_result_4 is not failed
    fail_msg: "Minimal replaced state is not idempotent after defaults were restored"
    success_msg: "Minimal replaced state remains idempotent after defaults were restored"
  tags: [test_replaced, test_replaced_defaults]

#############################################################################
# TEST 3: STATE DELETED - Delete fabric using deleted state
#############################################################################
- name: "TEST 3 SETUP: Create a fabric to delete"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ campus_test_fabric_deleted }}"
        management:
          bgp_asn: "65010"
  register: campus_delete_setup
  tags: [test_deleted, test_deleted_setup]

- name: "TEST 3 SETUP: Verify fabric was created for deletion test"
  assert:
    that:
      - campus_delete_setup is changed
      - campus_delete_setup is not failed
    fail_msg: "Setup for delete test failed - fabric was not created"
    success_msg: "Setup complete - fabric created for deletion test"
  tags: [test_deleted, test_deleted_setup]

- name: "TEST 3a: Delete fabric using state deleted (first run)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ campus_test_fabric_deleted }}"
  register: campus_deleted_result_1
  tags: [test_deleted, test_deleted_delete]

- name: "TEST 3a: Verify fabric was deleted"
  assert:
    that:
      - campus_deleted_result_1 is changed
      - campus_deleted_result_1 is not failed
    fail_msg: "Fabric deletion failed"
    success_msg: "Fabric successfully deleted"
  tags: [test_deleted, test_deleted_delete]

- name: "TEST 3b: Delete fabric using state deleted (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ campus_test_fabric_deleted }}"
  register: campus_deleted_result_2
  tags: [test_deleted, test_deleted_idempotent]

- name: "TEST 3b: Verify deleted state is idempotent"
  assert:
    that:
      - campus_deleted_result_2 is not changed
      - campus_deleted_result_2 is not failed
    fail_msg: "Deleted state is not idempotent - should not change when resource already absent"
    success_msg: "Deleted state is idempotent - no changes on second run"
  tags: [test_deleted, test_deleted_idempotent]

#############################################################################
# TEST 4: CONFIG ACTIONS VALIDATION - Invalid save/deploy combination
#
# Regression test for PR #256: config_actions validation must run BEFORE any
# state mutation and must fail deterministically on every run, including
# idempotent no-drift runs. deploy=true with save=false is invalid and must
# fail before the fabric is modified.
#############################################################################
- name: "TEST 4 SETUP: Create baseline fabric with system_mtu 1500"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_config_actions} | combine(fabric_config_campus) | combine({'management': (fabric_config_campus.management | default({})) | combine({'system_mtu': 1500})}) }}"
  register: campus_config_actions_baseline
  tags: [test_config_actions]

- name: "TEST 4a: Invalid config_actions (save=false, deploy=true) - first run"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_config_actions} | combine(fabric_config_campus) | combine({'management': (fabric_config_campus.management | default({})) | combine({'system_mtu': 9198})}) }}"
    config_actions:
      save: false
      deploy: true
      type: switch
  register: campus_config_actions_first_run
  ignore_errors: true
  tags: [test_config_actions]

- name: "TEST 4a: Verify first invalid run fails before any mutation"
  assert:
    that:
      - campus_config_actions_first_run is failed
      - campus_config_actions_first_run is not changed
      - "'config_actions.deploy=true requires config_actions.save=true' in campus_config_actions_first_run.msg"
    fail_msg: "Invalid config_actions did not fail before mutation on the first run"
    success_msg: "Invalid config_actions failed before mutation without changing the fabric"
  tags: [test_config_actions]

- name: "TEST 4b: Invalid config_actions (save=false, deploy=true) - identical second run"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_config_actions} | combine(fabric_config_campus) | combine({'management': (fabric_config_campus.management | default({})) | combine({'system_mtu': 9198})}) }}"
    config_actions:
      save: false
      deploy: true
      type: switch
  register: campus_config_actions_second_run
  ignore_errors: true
  tags: [test_config_actions]

- name: "TEST 4b: Verify identical second run also fails (no-drift path is not skipped)"
  assert:
    that:
      - campus_config_actions_second_run is failed
      - campus_config_actions_second_run is not changed
      - "'config_actions.deploy=true requires config_actions.save=true' in campus_config_actions_second_run.msg"
    fail_msg: "Invalid config_actions was skipped on the idempotent no-drift second run"
    success_msg: "Invalid config_actions fails consistently regardless of drift"
  tags: [test_config_actions]

- name: "TEST 4c: Confirm system_mtu was never mutated (still 1500)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_config_actions} | combine(fabric_config_campus) | combine({'management': (fabric_config_campus.management | default({})) | combine({'system_mtu': 1500})}) }}"
  register: campus_config_actions_verify_mtu
  tags: [test_config_actions]

- name: "TEST 4c: Verify system_mtu is unchanged at 1500"
  assert:
    that:
      - campus_config_actions_verify_mtu is not changed
    fail_msg: "system_mtu was mutated by an invalid config_actions run"
    success_msg: "system_mtu remained 1500 - invalid config_actions never mutated ND"
  tags: [test_config_actions]

- name: "TEST 4 CLEANUP: Delete config_actions test fabric"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ campus_test_fabric_config_actions }}"
  ignore_errors: true
  tags: [test_config_actions, cleanup, always]

#############################################################################
# CLEANUP - Ensure clean state after tests
#############################################################################
- name: Clean up all test fabrics after tests
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ campus_test_fabric_merged }}"
      - fabric_name: "{{ campus_test_fabric_replaced }}"
      - fabric_name: "{{ campus_test_fabric_deleted }}"
      - fabric_name: "{{ campus_test_fabric_config_actions }}"
  tags: always
