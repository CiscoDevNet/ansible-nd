      - fabric_name: "{{ campus_test_fabric_replaced }}"
        location:
          latitude: 37.7749
          longitude: -122.4194
        license_tier: premier
        alert_suspend: disabled
        security_domain: all
        telemetry_collection: false
        management:
          bgp_asn: "65004"
          replication_mode: multicast
          link_state_routing_protocol: ospf
          ospf_process_id: 3
          ospf_area_id: "0.0.0.1"
          system_mtu: 9198
          vlan_trunking_protocol_mode: transparent
          route_reflector_count: 4
          bgp_ipv4_unicast_peering: true
          snmp_trap: false
          nxapi: true
          nxapi_http: true
          nxapi_https_port: 443
          nxapi_http_port: 80
          performance_monitoring: true
          real_time_interface_statistics_collection: true
          interface_statistics_load_interval: 30
          sub_interface_dot1q_range: "2-511"
          day0_bootstrap: false
          local_dhcp_server: false
          dhcp_protocol_version: dhcpv4
          management_ipv4_prefix: 24
          management_ipv6_prefix: 64
  register: campus_replaced_result_1
  tags: [test_replaced, test_replaced_create]

- name: "TEST 2a: Verify fabric was created using replaced state"
  assert:
    that:
      - campus_replaced_result_1 is changed
      - campus_replaced_result_1 is not failed
    fail_msg: "Fabric creation with state replaced failed"
    success_msg: "Fabric successfully created with state replaced"
  tags: [test_replaced, test_replaced_create]

- name: "TEST 2b: Create fabric using state replaced (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: replaced
    config:
      - fabric_name: "{{ campus_test_fabric_replaced }}"
        location:
          latitude: 37.7749
          longitude: -122.4194
        license_tier: premier
        alert_suspend: disabled
        security_domain: all
        telemetry_collection: false
        management:
          bgp_asn: "65004"
          replication_mode: multicast
          link_state_routing_protocol: ospf
          ospf_process_id: 3
          ospf_area_id: "0.0.0.1"
          system_mtu: 9198
          vlan_trunking_protocol_mode: transparent
          route_reflector_count: 4
          bgp_ipv4_unicast_peering: true
          snmp_trap: false
