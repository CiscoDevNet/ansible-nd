- name: Test that we have a Nexus Dashboard host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: ansible_host, ansible_user and ansible_password.'
  when: ansible_host is not defined or ansible_user is not defined or ansible_password is not defined

- name: Set vars
  ansible.builtin.set_fact:
    nd_info: &nd_info
      output_level: '{{ api_key_output_level | default("debug") }}'

- name: Query Nexus Dashboard version for Campus release-specific coverage
  cisco.nd.nd_version:
    state: query
  register: campus_nd_version
  tags: always

#############################################################################
# CLEANUP - Ensure clean state before tests
#############################################################################
- name: Clean up any existing test fabrics before starting tests
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: deleted
    config:
      - fabric_name: "{{ campus_test_fabric_merged }}"
      - fabric_name: "{{ campus_test_fabric_replaced }}"
      - fabric_name: "{{ campus_test_fabric_deleted }}"
      - fabric_name: "{{ campus_test_fabric_config_actions }}"
  tags: always

#############################################################################
# TEST 1: STATE MERGED - Create fabric using merged state
#############################################################################
- name: "TEST 1a: Create fabric using state merged (first run)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_merged} | combine(fabric_config_campus) }}"
  register: campus_merged_result_1
  tags: [test_merged, test_merged_create]

- name: "TEST 1a: Verify fabric was created using merged state"
  assert:
    that:
      - campus_merged_result_1 is changed
      - campus_merged_result_1 is not failed
    fail_msg: "Fabric creation with state merged failed"
    success_msg: "Fabric successfully created with state merged"
  tags: [test_merged, test_merged_create]

- name: "TEST 1b: Create fabric using state merged (second run - idempotency test)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - "{{ {'fabric_name': campus_test_fabric_merged} | combine(fabric_config_campus) }}"
  register: campus_merged_result_2
  tags: [test_merged, test_merged_idempotent]

- name: "TEST 1b: Verify merged state is idempotent"
  assert:
    that:
      - campus_merged_result_2 is not changed
      - campus_merged_result_2 is not failed
    fail_msg: "Merged state is not idempotent - should not change when run twice with same config"
    success_msg: "Merged state is idempotent - no changes on second run"
  tags: [test_merged, test_merged_idempotent]

- name: "TEST 1c: Update fabric using state merged (modify existing)"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ campus_test_fabric_merged }}"
        location:
          latitude: 37.7749
          longitude: -122.4194
        license_tier: premier
        alert_suspend: disabled
        security_domain: all
        telemetry_collection: false
        management:
          bgp_asn: "65002"  # Changed from 65001
          link_state_routing_protocol: ospf
          ospf_process_id: 2  # Changed from 1
          ospf_area_id: "0.0.0.1"  # Changed from 0.0.0.0
          system_mtu: 9198  # Changed from 1500
          vlan_trunking_protocol_mode: transparent  # Changed from off
          route_reflector_count: 4  # Changed from 2
          bgp_ipv4_unicast_peering: true  # Changed from false
          snmp_trap: false  # Changed from true
          nxapi: true  # Changed from false
          nxapi_http: true  # Changed from false
          nxapi_https_port: 443
          nxapi_http_port: 80
          performance_monitoring: true  # Changed from false
          real_time_interface_statistics_collection: true  # Changed from false
          interface_statistics_load_interval: 30  # Changed from 10
          sub_interface_dot1q_range: "2-511"
          day0_bootstrap: false
          local_dhcp_server: false
          dhcp_protocol_version: dhcpv4
          management_ipv4_prefix: 24
  register: campus_merged_result_3
  tags: [test_merged, test_merged_update]

- name: "TEST 1c: Verify fabric was updated using merged state"
  assert:
    that:
      - campus_merged_result_3 is changed
      - campus_merged_result_3 is not failed
    fail_msg: "Fabric update with state merged failed"
    success_msg: "Fabric successfully updated with state merged"
  tags: [test_merged, test_merged_update]

#############################################################################
# VALIDATION: Query campus_test_fabric_merged and validate expected changes
#############################################################################
- name: "VALIDATION 1: Authenticate with ND to get token"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/login"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      domain: "{{ ansible_httpapi_login_domain | default('local') }}"
      userName: "{{ ansible_user }}"
      userPasswd: "{{ ansible_password }}"
    validate_certs: false
    return_content: true
    status_code:
      - 200
  register: nd_auth_response
  tags: [test_merged, test_merged_validation]
  delegate_to: localhost

- name: "VALIDATION 1: Query campus_test_fabric_merged configuration from ND"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/api/v1/manage/fabrics/{{ campus_test_fabric_merged }}"
    method: GET
    headers:
      Authorization: "Bearer {{ nd_auth_response.json.jwttoken }}"
      Content-Type: "application/json"
    validate_certs: false
    return_content: true
    status_code:
      - 200
      - 404
  register: campus_merged_fabric_query
  tags: [test_merged, test_merged_validation]
  delegate_to: localhost

- name: "VALIDATION 1: Parse fabric configuration response"
  set_fact:
    campus_merged_fabric_config: "{{ campus_merged_fabric_query.json }}"
  tags: [test_merged, test_merged_validation]

- name: "VALIDATION 1: Verify BGP ASN was updated to 65002"
  assert:
    that:
      - campus_merged_fabric_config.management.bgpAsn == "65002"
    fail_msg: "BGP ASN validation failed. Expected: 65002, Actual: {{ campus_merged_fabric_config.management.bgpAsn }}"
    success_msg: "BGP ASN correctly updated to 65002"
  tags: [test_merged, test_merged_validation]

- name: "VALIDATION 1: Verify OSPF Process ID was updated to 2"
  assert:
    that:
      - campus_merged_fabric_config.management.ospfProcessId == 2
    fail_msg: "OSPF Process ID validation failed. Expected: 2, Actual: {{ campus_merged_fabric_config.management.ospfProcessId }}"
    success_msg: "OSPF Process ID correctly updated to 2"
  tags: [test_merged, test_merged_validation]

- name: "VALIDATION 1: Verify System MTU was updated to 9198"
  assert:
    that:
      - campus_merged_fabric_config.management.systemMtu == 9198
    fail_msg: "System MTU validation failed. Expected: 9198, Actual: {{ campus_merged_fabric_config.management.systemMtu }}"
    success_msg: "System MTU correctly updated to 9198"
  tags: [test_merged, test_merged_validation]

- name: "VALIDATION 1: Verify Performance Monitoring was enabled"
  assert:
    that:
      - campus_merged_fabric_config.management.performanceMonitoring == true
    fail_msg: "Performance Monitoring validation failed. Expected: true, Actual: {{ campus_merged_fabric_config.management.performanceMonitoring }}"
    success_msg: "Performance Monitoring correctly enabled"
  tags: [test_merged, test_merged_validation]

#############################################################################
# VALIDATION: ND 4.3.1 Campus addition
#
# The 4.3.1 OpenAPI permits managementIpv4Prefix=31, but live ND
# 4.3.1.175 Campus fabric validation rejects it and requires 24. Keep /31
# contract coverage in the model tests and exercise the accepted release-only
# field here.
#############################################################################
- name: "VALIDATION 1d: Configure the ND 4.3.1 Campus-only field"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ campus_test_fabric_merged }}"
        management:
          bgp_asn: "65002"
          bgp_fast_convergence: true
  register: campus_43_result_1
  when: campus_nd_version.current.platformVersion is version('4.3.1', '>=')
  tags: [test_merged, test_43_fields]

- name: "VALIDATION 1d: Reapply the ND 4.3.1 Campus-only field"
  cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
    <<: *nd_info
    state: merged
    config:
      - fabric_name: "{{ campus_test_fabric_merged }}"
        management:
          bgp_asn: "65002"
          bgp_fast_convergence: true
  register: campus_43_result_2
  when: campus_nd_version.current.platformVersion is version('4.3.1', '>=')
  tags: [test_merged, test_43_fields]

- name: "VALIDATION 1d: Verify the ND 4.3.1 field is idempotent"
  ansible.builtin.assert:
    that:
      - campus_43_result_1 is changed
      - campus_43_result_1 is not failed
      - campus_43_result_2 is not changed
      - campus_43_result_2 is not failed
    fail_msg: "ND 4.3.1 Campus field update was not idempotent"
    success_msg: "ND 4.3.1 Campus field updated and remained idempotent"
  when: campus_nd_version.current.platformVersion is version('4.3.1', '>=')
  tags: [test_merged, test_43_fields]

- name: "VALIDATION 1d: Query the ND 4.3.1 Campus-only field"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ ansible_httpapi_port | default(443) }}/api/v1/manage/fabrics/{{ campus_test_fabric_merged }}"
    method: GET
    headers:
      Authorization: "Bearer {{ nd_auth_response.json.jwttoken }}"
      Content-Type: "application/json"
    validate_certs: false
    return_content: true
    status_code:
      - 200
  register: campus_43_fabric_query
  when: campus_nd_version.current.platformVersion is version('4.3.1', '>=')
  tags: [test_merged, test_43_fields]
  delegate_to: localhost

- name: "VALIDATION 1d: Verify ND stored the 4.3.1 Campus-only field"
  ansible.builtin.assert:
    that:
      - campus_43_fabric_query.json.management.bgpFastConvergence == true
    fail_msg: "ND did not retain the expected bgpFastConvergence value"
    success_msg: "ND retained bgpFastConvergence"
  when: campus_nd_version.current.platformVersion is version('4.3.1', '>=')
  tags: [test_merged, test_43_fields]

#############################################################################
