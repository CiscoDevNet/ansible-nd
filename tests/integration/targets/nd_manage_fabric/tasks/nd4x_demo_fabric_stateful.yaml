- name: "REPLACED UPDATE: Apply the legacy minimal replacement"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: replaced
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.replaced_name} | combine(nd4x_fabric_case.replace_minimal, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify replaced {{ nd4x_fabric_case.label }} defaults and identity
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.replaced_name }}"
        method: get
        expected_status: 200
        expect: >-
          {{ nd4x_fabric_case.replace_expectations
             + nd4x_fabric_legacy_field_expectations[
                 nd4x_fabric_case.field_expectation_key].replaced }}
  register: nd4x_fabric_replaced_update

- name: Verify replaced update returned state
  ansible.builtin.assert:
    that:
      - nd4x_fabric_replaced_create.first_run_result.changed | bool
      - nd4x_fabric_replaced_update.check_mode_result.changed | bool
      - nd4x_fabric_replaced_update.first_run_result.changed | bool
      - not nd4x_fabric_replaced_update.second_run_result.changed | bool

- name: "COMPARISON SEED: Create the same-fabric merged/replaced comparison baseline"
  cisco.nd.nd4x_module_test:
