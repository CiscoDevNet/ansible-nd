---
- name: "MERGED CREATE: Create {{ nd4x_fabric_case.label }} fabric through the harness"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - >-
        {{ {'fabric_name': nd4x_fabric_case.merged_name}
           | combine(nd4x_fabric_case.fixture, recursive=True)
           | combine(nd4x_fabric_case.merged_seed_overrides | default({}), recursive=True) }}
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify created {{ nd4x_fabric_case.label }} fabric
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.merged_name }}"
        method: get
        expected_status: 200
        expect:
          - jsonpath: $.current.name
            equals: "{{ nd4x_fabric_case.merged_name }}"
          - jsonpath: $.current.management.type
            exists: true
  register: nd4x_fabric_merged_create

- name: Verify merged create exercised all harness phases
  ansible.builtin.assert:
    that:
      - nd4x_fabric_merged_create.check_mode_result.changed | bool
      - nd4x_fabric_merged_create.first_run_result.changed | bool
      - not nd4x_fabric_merged_create.second_run_result.changed | bool
      - nd4x_fabric_merged_create.nd_query_results | length == 1

- name: "MERGED UPDATE: Update {{ nd4x_fabric_case.label }} fabric fields"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.merged_name} | combine(nd4x_fabric_case.merged_update, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify updated {{ nd4x_fabric_case.label }} fabric
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.merged_name }}"
        method: get
        expected_status: 200
        expect: >-
          {{ nd4x_fabric_case.merged_expectations
             + nd4x_fabric_legacy_field_expectations[
                 nd4x_fabric_case.field_expectation_key].merged }}
  register: nd4x_fabric_merged_update

- name: Verify merged update returned state and controller state
  ansible.builtin.assert:
    that:
      - nd4x_fabric_merged_update.check_mode_result.changed | bool
      - nd4x_fabric_merged_update.first_run_result.changed | bool
      - not nd4x_fabric_merged_update.second_run_result.changed | bool
      - nd4x_fabric_merged_update.nd_query_results | length == 1

- name: "MERGED RELEASE FIELD: Apply a field gated by the detected controller version"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.merged_name} | combine(nd4x_fabric_case.versioned_update, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify the release-gated fabric field
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.merged_name }}"
        method: get
        expected_status: 200
        expect: "{{ nd4x_fabric_case.versioned_expectations }}"
  register: nd4x_fabric_versioned_update
  when:
    - nd4x_fabric_case.versioned_update is defined
    - nd4x_fabric_version.current.platformVersion is version('4.3.1', '>=')

- name: "REPLACED CREATE: Create {{ nd4x_fabric_case.label }} replacement fixture"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: replaced
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - >-
        {{ {'fabric_name': nd4x_fabric_case.replaced_name}
