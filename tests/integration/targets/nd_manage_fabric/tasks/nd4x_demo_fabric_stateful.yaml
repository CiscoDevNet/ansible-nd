    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify comparison baseline for {{ nd4x_fabric_case.label }}
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.comparison.name }}"
        method: get
        expected_status: 200
        expect: "{{ nd4x_fabric_case.comparison.seed_expectations }}"
  register: nd4x_fabric_comparison_seed
  when: nd4x_fabric_case.comparison is defined

- name: "COMPARISON MERGED: Partially update the comparison fabric with merged"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.comparison.name} | combine(nd4x_fabric_case.comparison.merged_config, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify merged partial update retained the comparison state
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.comparison.name }}"
        method: get
        expected_status: 200
        expect: "{{ nd4x_fabric_case.comparison.merged_expectations }}"
  register: nd4x_fabric_comparison_merged
  when: nd4x_fabric_case.comparison is defined

- name: "COMPARISON REPLACED: Apply a partial replaced config to that same fabric"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: replaced
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.comparison.name} | combine(nd4x_fabric_case.comparison.replaced_config, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify replaced reset fields after the merged comparison
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.comparison.name }}"
        method: get
        expected_status: 200
        expect: "{{ nd4x_fabric_case.comparison.replaced_expectations }}"
  register: nd4x_fabric_comparison_replaced
  when: nd4x_fabric_case.comparison is defined

- name: "CAMPUS CLEANUP: Verify teardown runs after a controlled failure"
  block:
    - name: Create the disposable Campus cleanup probe through the harness
      cisco.nd.nd4x_module_test:
        module: "{{ nd4x_fabric_case.module }}"
        state: merged
        common_args:
          output_level: "{{ nd_info.output_level }}"
        config:
          - fabric_name: "{{ nd4x_fabric_case.failure_cleanup_probe }}"
            management:
              bgp_asn: "65099"
        check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
        expected:
          check_mode:
            changed: true
            failed: false
          apply:
            changed: true
            failed: false
          idempotency:
            changed: false
            failed: false
        nd_queries:
          - name: Verify the disposable Campus cleanup probe exists
            path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.failure_cleanup_probe }}"
            method: get
            expected_status: 200
            expect:
              - jsonpath: $.current.name
                equals: "{{ nd4x_fabric_case.failure_cleanup_probe }}"
              - jsonpath: $.current.management.type
                equals: vxlanCampus

    - name: Trigger the expected Campus cleanup failure path
      ansible.builtin.fail:
        msg: "Expected controlled failure for Campus cleanup verification"
  rescue:
    - name: Verify and record the expected controlled failure
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg == "Expected controlled failure for Campus cleanup verification"

    - name: Record that the controlled Campus failure was observed
      ansible.builtin.set_fact:
        campus_cleanup_controlled_failure_observed: true
  always:
    - name: Remove the Campus cleanup probe after the controlled failure
      cisco.nd.nd_manage_fabric_campus_ibgp_vxlan:
        output_level: "{{ nd_info.output_level }}"
        state: deleted
        config:
          - fabric_name: "{{ nd4x_fabric_case.failure_cleanup_probe }}"
      check_mode: false
  when: nd4x_fabric_case.failure_cleanup_probe is defined
  tags: [always]

- name: Verify the controlled Campus failure was rescued
  ansible.builtin.assert:
    that:
      - campus_cleanup_controlled_failure_observed | default(false) | bool
  when: nd4x_fabric_case.failure_cleanup_probe is defined

- name: Verify the Campus cleanup probe was already removed
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: deleted
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - fabric_name: "{{ nd4x_fabric_case.failure_cleanup_probe }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: false
        failed: false
      apply:
        changed: false
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify Campus failure cleanup removed the probe
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.failure_cleanup_probe }}"
        method: get
        expected_status: 404
        expected_failed: true
  when: nd4x_fabric_case.failure_cleanup_probe is defined

- name: "DELETED SETUP: Create a disposable {{ nd4x_fabric_case.label }} fabric"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - "{{ {'fabric_name': nd4x_fabric_case.deleted_name} | combine(nd4x_fabric_case.fixture, recursive=True) }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
