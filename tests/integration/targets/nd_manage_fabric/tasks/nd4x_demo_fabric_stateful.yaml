        failed: false
    nd_queries:
      - name: Verify delete fixture exists before deletion
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.deleted_name }}"
        method: get
        expected_status: 200
        expect:
          - jsonpath: $.current.name
            equals: "{{ nd4x_fabric_case.deleted_name }}"
  register: nd4x_fabric_delete_setup

- name: "DELETED: Delete the disposable {{ nd4x_fabric_case.label }} fabric"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: deleted
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - fabric_name: "{{ nd4x_fabric_case.deleted_name }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify deleted fabric is absent
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.deleted_name }}"
        method: get
        expected_status: 404
        expected_failed: true
  register: nd4x_fabric_delete

- name: Verify deleted state completed through every harness phase
  ansible.builtin.assert:
    that:
      - nd4x_fabric_delete_setup.first_run_result.changed | bool
      - nd4x_fabric_delete.check_mode_result.changed | bool
      - nd4x_fabric_delete.first_run_result.changed | bool
      - not nd4x_fabric_delete.second_run_result.changed | bool
      - nd4x_fabric_delete.nd_query_results | length == 1

- name: "CONFIG ACTIONS SETUP: Create the baseline {{ nd4x_fabric_case.label }} fabric"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - >-
        {{ {'fabric_name': nd4x_fabric_case.config_actions_name}
           | combine(nd4x_fabric_case.fixture, recursive=True)
           | combine(nd4x_fabric_case.config_actions_fixture_overrides | default({}), recursive=True)
           | combine({'management': {nd4x_fabric_case.action_field_key:
               nd4x_fabric_case.action_baseline_value}}, recursive=True) }}
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify config-actions baseline
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.config_actions_name }}"
        method: get
        expected_status: 200
        expect:
          - jsonpath: "{{ nd4x_fabric_case.action_field_jsonpath }}"
            equals: "{{ nd4x_fabric_case.action_baseline_value }}"

- name: Run direct invalid config-actions regression cases
  ansible.builtin.include_tasks:
    file: "{{ nd4x_fabric_case.config_actions_tasks }}"
    apply:
      tags: "{{ nd4x_fabric_case.harness_tags }}"
  tags: "{{ nd4x_fabric_case.harness_tags }}"
  vars:
    nd4x_action_invalid_config:
      - >-
        {{ {'fabric_name': nd4x_fabric_case.config_actions_name}
           | combine(nd4x_fabric_case.fixture, recursive=True)
           | combine(nd4x_fabric_case.config_actions_fixture_overrides | default({}), recursive=True)
           | combine({'management': {nd4x_fabric_case.action_field_key:
               nd4x_fabric_case.action_invalid_value}}, recursive=True) }}

- name: "CONFIG ACTIONS VERIFY: Confirm invalid actions left the fabric unchanged"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config:
      - >-
        {{ {'fabric_name': nd4x_fabric_case.config_actions_name}
           | combine(nd4x_fabric_case.fixture, recursive=True)
           | combine(nd4x_fabric_case.config_actions_fixture_overrides | default({}), recursive=True)
           | combine({'management': {nd4x_fabric_case.action_field_key:
               nd4x_fabric_case.action_baseline_value}}, recursive=True) }}
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: false
        failed: false
      apply:
        changed: false
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Confirm invalid config-actions did not mutate controller state
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.config_actions_name }}"
        method: get
        expected_status: 200
        expect:
          - jsonpath: "{{ nd4x_fabric_case.action_field_jsonpath }}"
            equals: "{{ nd4x_fabric_case.action_baseline_value }}"

- name: "MULTI FABRIC: Create multiple {{ nd4x_fabric_case.label }} fabrics in one harness call"
  cisco.nd.nd4x_module_test:
    module: "{{ nd4x_fabric_case.module }}"
    state: merged
    common_args:
      output_level: "{{ nd_info.output_level }}"
    config: "{{ nd4x_fabric_multi_cases[nd4x_fabric_case.field_expectation_key].configs }}"
    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify first multi-fabric resource
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.multi_fabric_names[0] }}"
        method: get
        expected_status: 200
        expect: >-
          {{ nd4x_fabric_multi_cases[
               nd4x_fabric_case.field_expectation_key].expectations[0] }}
      - name: Verify second multi-fabric resource
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.multi_fabric_names[1] }}"
        method: get
        expected_status: 200
        expect: >-
          {{ nd4x_fabric_multi_cases[
               nd4x_fabric_case.field_expectation_key].expectations[1] }}
  register: nd4x_fabric_multi_create
  when: nd4x_fabric_case.multi_fabric_names is defined

- name: Verify multi-fabric operation returned both controller resources
  ansible.builtin.assert:
    that:
      - nd4x_fabric_multi_create.get('first_run_result', {}).get('changed', false) | bool
      - nd4x_fabric_multi_create.get('nd_query_results', []) | length == 2
  when:
    - nd4x_fabric_case.multi_fabric_names is defined
