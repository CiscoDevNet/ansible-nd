    check_mode_queries: "{{ nd4x_fabric_check_mode_queries }}"
    expected:
      check_mode:
        changed: true
        failed: false
      apply:
        changed: true
        failed: false
      idempotency:
        changed: false
        failed: false
    nd_queries:
      - name: Verify created replacement fixture
        path: "/api/v1/manage/fabrics/{{ nd4x_fabric_case.replaced_name }}"
        method: get
        expected_status: 200
        expect:
          - jsonpath: $.current.name
            equals: "{{ nd4x_fabric_case.replaced_name }}"
