    phase: advanced_virtual_vpc
    execution_style: integration_role
    fabrics: [*advanced]
    switches: *advanced_all
    # ND 4.3 rejects a virtual peer-link on N9K-C9300v ("doesn't support Virtual Fabric Peering") but recommends
    # the physical pair leaf_1<->leaf_2 over the cabled Eth1/2 <-> Eth1/1. The target creates the pair itself
    # (tasks/vpc_pair_once.yaml, use_virtual_peer_link=false), so the prerequisite is only that peer-link: its
    # ports are admin-upped through `links` below and the planner SKIPs with the exact ports when it is not cabled.
    links: [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/2], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/1], admin_state: true, operational_state: when_reported_up}]
    vpc_pairs: [{fabric_ref: advanced, peer_refs: [vxlan_leaf_1, vxlan_leaf_2], state: present, mode: physical, required_path: module_creates_pair, physical_peer_links: [{src: {switch_ref: vxlan_leaf_1, interface: Ethernet1/2}, dst: {switch_ref: vxlan_leaf_2, interface: Ethernet1/1}}]}]
    resources: [{kind: allocation_entity_tokens, values: [Ethernet1/2, Ethernet1/3, Ethernet1/10], physical_links: false}]
    managed_domains: [resource_allocations, vpc_pairs]
    runtime_vars: {ansible_it_fabric: VXLAN_EVPN_Fabric, ansible_switch1: 192.0.2.195, ansible_switch2: 192.0.2.196, ansible_sno_1: SERIAL00001, ansible_sno_2: SERIAL00002, intf_1_2: Ethernet1/2, intf_1_3: Ethernet1/3, intf_1_10: Ethernet1/10}
    timeouts: *disruptive_timeouts
    confirmation: {status: pending, owner: "", evidence: "", reasons: [confirm the module-created physical vPC pair over the leaf_1 Eth1/2 <-> leaf_2 Eth1/1 peer-link, confirm interface strings are allocation entity tokens not links]}
