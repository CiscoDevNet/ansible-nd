---
schema_version: 2

runtime_defaults:
  nd_test_fabric_switches:
    VXLAN_EVPN_Fabric:
      - {name: vxlan_leaf_1, seed_ip: 192.0.2.195, serial: SERIAL00001, role: leaf}
      - {name: vxlan_leaf_2, seed_ip: 192.0.2.196, serial: SERIAL00002, role: leaf}
      - {name: vxlan_spine_1, seed_ip: 192.0.2.194, serial: SERIAL00003, role: spine}
      - {name: vxlan_border_1, seed_ip: 192.0.2.88, serial: SERIAL00004, role: border}
      - {name: vxlan_leaf_3, seed_ip: 192.0.2.85, serial: SERIAL00008, role: leaf}
      - {name: vxlan_leaf_4, seed_ip: 192.0.2.86, serial: SERIAL00009, role: leaf}
    External_Connectivity_Fabric:
      - {name: external_edge_1, seed_ip: 192.0.2.89, serial: SERIAL00005, role: edge_router}
      - {name: external_edge_2, seed_ip: 192.0.2.90, serial: SERIAL00006, role: edge_router}

defaults:
  normal_timeouts: &normal_timeouts {poll_seconds: 15, retries: 20, max_consecutive_api_errors: 3}
  disruptive_timeouts: &disruptive_timeouts {poll_seconds: 15, retries: 40, max_consecutive_api_errors: 3}
  restore: &restore {target: verified_phase_snapshot, job: verified_job_snapshot}
  pending_confirmation: &pending
    status: pending
    owner: ""
    evidence: ""
    reasons: [owner confirmation has not yet been recorded]
  profile: &profile
    links: []
    vpc_pairs: []
    resources: []
    interfabric_links: []
    # managed_domains + runtime_vars are per-profile only; defining them here too makes
    # every `<<: *profile` override a YAML duplicate key ("Using last defined value only").
    timeouts: *normal_timeouts
    restore: *restore
    confirmation: *pending

lab:
  fabrics:
    advanced: &advanced {ref: advanced, name: VXLAN_EVPN_Fabric, type: vxlanIbgp, lifecycle: retained}
    network_ebgp: &network_ebgp {ref: network_ebgp, name: VXLAN_EVPN_Fabric_eBGP, type: vxlanEbgp, lifecycle: preserved}
    external: &external {ref: external, name: External_Connectivity_Fabric, type: externalConnectivity, lifecycle: retained}
    disposable_ibgp: &disposable_ibgp {ref: disposable_ibgp, name: ANSIBLE_NIGHTLY_IBGP, type: vxlanIbgp, lifecycle: disposable}
    disposable_ebgp: &disposable_ebgp {ref: disposable_ebgp, name: ANSIBLE_NIGHTLY_EBGP, type: vxlanEbgp, lifecycle: disposable}
    disposable_ai_ibgp: &disposable_ai_ibgp {ref: disposable_ai_ibgp, name: ANSIBLE_NIGHTLY_AI_IBGP, type: aimlVxlanIbgp, lifecycle: disposable}
    disposable_ai_ebgp: &disposable_ai_ebgp {ref: disposable_ai_ebgp, name: ANSIBLE_NIGHTLY_AI_EBGP, type: aimlVxlanEbgp, lifecycle: disposable}
    disposable_external: &disposable_external {ref: disposable_external, name: ANSIBLE_NIGHTLY_EXTERNAL, type: externalConnectivity, lifecycle: disposable}
  retained_fabric_names: [VXLAN_EVPN_Fabric, External_Connectivity_Fabric]
  preserved_fabric_names: [VXLAN_EVPN_Fabric_eBGP]
  switches:
    vxlan_leaf_1: {baseline_fabric_ref: advanced, baseline_role: leaf, serial: SERIAL00001, seed_ip: 192.0.2.195}
    vxlan_leaf_2: {baseline_fabric_ref: advanced, baseline_role: leaf, serial: SERIAL00002, seed_ip: 192.0.2.196}
    vxlan_spine_1: {baseline_fabric_ref: advanced, baseline_role: spine, serial: SERIAL00003, seed_ip: 192.0.2.194}
    vxlan_border_1: {baseline_fabric_ref: advanced, baseline_role: border, serial: SERIAL00004, seed_ip: 192.0.2.88}
    vxlan_leaf_3: {baseline_fabric_ref: advanced, baseline_role: leaf, serial: SERIAL00008, seed_ip: 192.0.2.85}
    vxlan_leaf_4: {baseline_fabric_ref: advanced, baseline_role: leaf, serial: SERIAL00009, seed_ip: 192.0.2.86}
    external_edge_1: {baseline_fabric_ref: external, baseline_role: edge_router, serial: SERIAL00005, seed_ip: 192.0.2.89}
    external_edge_2: {baseline_fabric_ref: external, baseline_role: edge_router, serial: SERIAL00006, seed_ip: 192.0.2.90}
  interface_allowlist:
    # Port-channel member pools are de-conflicted: access=Eth1/10-13, trunk_host=Eth1/14-17, routed=Eth1/18-21 (order must match CANONICAL_INTERFACE_ALLOWLIST).
    vxlan_leaf_1: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4, Ethernet1/5, Ethernet1/6, Ethernet1/7, Ethernet1/8, Ethernet1/9, Ethernet1/10, Ethernet1/11, Ethernet1/12, Ethernet1/13, Ethernet1/14, Ethernet1/15, Ethernet1/16, Ethernet1/17, Ethernet1/18, Ethernet1/19, Ethernet1/20, Ethernet1/21, Ethernet1/31, Ethernet1/32, Ethernet1/33, Ethernet1/34, Ethernet1/35, Ethernet1/41, Ethernet1/42, Ethernet1/43, Ethernet1/44, Ethernet1/45, Ethernet1/46, Ethernet1/47, Ethernet1/48, Ethernet1/49, Ethernet1/50]
    vxlan_leaf_2: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4, Ethernet1/5, Ethernet1/6, Ethernet1/7, Ethernet1/8, Ethernet1/9, Ethernet1/10, Ethernet1/30, Ethernet1/31, Ethernet1/32]
    vxlan_spine_1: []
    vxlan_border_1: [Ethernet1/1, Ethernet1/2, Ethernet1/4, Ethernet1/30, Ethernet1/31, Ethernet1/32]
    # leaf_3/leaf_4 form the second vPC pair over the cabled Eth1/1 <-> Eth1/1 and Eth1/2 <-> Eth1/2 peer-links; Eth1/5-1/10 are the vPC interface member ports.
    vxlan_leaf_3: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4, Ethernet1/5, Ethernet1/6, Ethernet1/7, Ethernet1/8, Ethernet1/9, Ethernet1/10]
    vxlan_leaf_4: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4, Ethernet1/5, Ethernet1/6, Ethernet1/7, Ethernet1/8, Ethernet1/9, Ethernet1/10]
    # Eth1/1 is the subinterface parent's inter-fabric cable to vxlan_leaf_1: keep it admin-up so ND discovers the
    # Eth1/1<->Eth1/1 adjacency the read-only existing_link gate verifies (else nd_interface_subinterface_* SKIP).
    # Eth1/5+Eth1/7 (<-> edge_2 Eth1/6+Eth1/8) are the external vPC peer-link ports: kept admin-up so they stay ever-available once the lab cables them.
    external_edge_1: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4, Ethernet1/5, Ethernet1/7]
    external_edge_2: [Ethernet1/6, Ethernet1/8]

phase_order: &phase_order
  [controller_disposable, retained_no_switch, advanced_leaf, vpc_pair_isolated,
   advanced_virtual_vpc, border_external, borrowed_switch, terminal_switch, final_restore]
phases:
  controller_disposable: {ordinal: 1, topology: controller_only}
  retained_no_switch: {ordinal: 2, topology: retained_fabrics_only}
  advanced_leaf: {ordinal: 3, topology: advanced_two_leaf}
  vpc_pair_isolated: {ordinal: 4, topology: advanced_two_leaf_isolated}
  advanced_virtual_vpc: {ordinal: 5, topology: advanced_two_leaf_virtual_vpc}
  border_external: {ordinal: 6, topology: advanced_border_external_edge}
  borrowed_switch: {ordinal: 7, topology: external_edge_1_borrowed_to_advanced}
  terminal_switch: {ordinal: 8, topology: advanced_leaf_spine_border}
  final_restore: {ordinal: 9, topology: captured_job_baseline}

topology_templates:
  no_switches: &no_switches {required_count: 0, members: []}
  adv1_leaf: &adv1_leaf {required_count: 1, members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: leaf}]}
  adv1_border: &adv1_border {required_count: 1, members: [{ref: vxlan_border_1, desired_fabric_ref: advanced, desired_role: border}]}
  # nd_manage_links runs its numbered lifecycle between these two switches of the shared fabric. Live probe
  # 2026-10-07: both Normal/inSync, Ethernet1/30-32 exist on each as ND-default trunk-host ports with no link.
  links_pair: &links_pair {required_count: 2, members: [{ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_border_1, desired_fabric_ref: advanced, desired_role: border}]}
  advanced_leaves: &advanced_leaves {required_count: 2, members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: leaf}]}
  advanced_preserve: &advanced_preserve {required_count: 2, members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: preserve}, {ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: preserve}]}
  # L3Out host: vxlan_border_1 (baseline role 'border') hosts the L3Out. It is now physically
  # cabled to external_edge_1 (probe-confirmed: border_1 Eth1/1 routed, up/up <-> edge_1 Eth1/3),
  # so the ext_l3_dci_link VRF-Lite handoff runs on a real border<->edge cable. desired_role is
  # 'border' == its baseline role, so nd_manage_l3out (verify-only for switch topology --
  # managed_domains has no 'switches') requests NO role change and passes NDP_TOPOLOGY_PREFLIGHT.
  # vxlan_leaf_1 stays a plain leaf (used by resource_manager/links/vpc) and is NOT part of the
  # L3Out. (Supersedes the earlier leaf_1-as-border-leaf workaround from when border_1 was uncabled;
  # build #26 proved a plain leaf is rejected: "not a supported role for BGP L3Out".)
  border_edges: &border_edges
    required_count: 3
    members: [{ref: vxlan_border_1, desired_fabric_ref: advanced, desired_role: border}, {ref: external_edge_1, desired_fabric_ref: external, desired_role: edge_router}, {ref: external_edge_2, desired_fabric_ref: external, desired_role: edge_router}]
  advanced_policy_group: &advanced_policy_group
    required_count: 3
    members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: preserve}, {ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: preserve}, {ref: vxlan_spine_1, desired_fabric_ref: advanced, desired_role: preserve}]
  advanced_switches: &advanced_switches
    required_count: 3
    members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_spine_1, desired_fabric_ref: advanced, desired_role: spine}, {ref: vxlan_border_1, desired_fabric_ref: advanced, desired_role: border}]
  advanced_all: &advanced_all
    required_count: 4
    members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_spine_1, desired_fabric_ref: advanced, desired_role: spine}, {ref: vxlan_border_1, desired_fabric_ref: advanced, desired_role: border}]
  # Both vPC leaf pairs: leaf_1/leaf_2 (the pair the vPC interface targets use) and leaf_3/leaf_4 (the second pair their multi-pair scenario needs).
  advanced_four_leaves: &advanced_four_leaves
    required_count: 4
    members: [{ref: vxlan_leaf_1, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_2, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_3, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_4, desired_fabric_ref: advanced, desired_role: leaf}]
  vpc_snapshot: &vpc_snapshot {required_count: 0, members: [], snapshot_switch_refs: [vxlan_leaf_1, vxlan_leaf_2, vxlan_spine_1, vxlan_border_1, vxlan_leaf_3, vxlan_leaf_4, external_edge_1, external_edge_2]}
  # nd_manage_tor's reduced test: vxlan_leaf_3 takes the ToR role and pairs with vxlan_leaf_4. Both are plain leaves here; the runner
  # flips the role for the test only (the planner stays verify-only for switch topology) and puts it back afterwards.
  tor_pair: &tor_pair {required_count: 2, members: [{ref: vxlan_leaf_3, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_4, desired_fabric_ref: advanced, desired_role: leaf}]}
  # nd_maintenance_mode switches the intended system mode of the two idle leaves (vxlan_leaf_3/vxlan_leaf_4) to maintenance and back, and
  # nd_fabric_update_group attaches the same two leaves to its leaf group plus vxlan_spine_1 to its disjoint spine group. Both stay
  # verify-only for switch topology: no role or membership changes, only ND-side intent that the target restores.
  idle_leaf_pair: &idle_leaf_pair {required_count: 2, members: [{ref: vxlan_leaf_3, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_4, desired_fabric_ref: advanced, desired_role: leaf}]}
  update_group_switches: &update_group_switches {required_count: 3, members: [{ref: vxlan_leaf_3, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_leaf_4, desired_fabric_ref: advanced, desired_role: leaf}, {ref: vxlan_spine_1, desired_fabric_ref: advanced, desired_role: spine}]}
  access_links: &access_links [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  trunk_links: &trunk_links [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  l3out_smoke_links: &l3out_smoke_links [{switch_ref: vxlan_border_1, interfaces: [Ethernet1/1], admin_state: true, operational_state: when_reported_up}, {switch_ref: external_edge_1, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  # Only the cabled border_1<->edge_1 pair needs admin/oper readiness. The sub-interface and SVI links are
  # config-only (planned) ND link objects, so their ports are deliberately NOT listed here.
  l3out_links: &l3out_links [{switch_ref: vxlan_border_1, interfaces: [Ethernet1/1], admin_state: true, operational_state: when_reported_up}, {switch_ref: external_edge_1, interfaces: [Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  dedicated_l3out_links: &dedicated_l3out_links [{switch_ref: vxlan_border_1, interfaces: [Ethernet1/1, Ethernet1/2], admin_state: true, operational_state: when_reported_up}, {switch_ref: external_edge_1, interfaces: [Ethernet1/2, Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  network_link: &network_link [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/4], admin_state: true, operational_state: when_reported_up}]
  # Inter-fabric DCI links nd_manage_l3out needs but does NOT create itself (module docs: "the user must
  # manage links separately"). Live-probed on ND 4.3: ND validates ONE LINK TEMPLATE PER CONNECTIVITY TYPE and a
  # missing one fails the create with 207 "No links exist between the given fabrics for this type. Please
  # create links with <template> template". This is a CONFIG requirement, not cabling: cisco.nd.nd_manage_links
  # also accepts config-only (planned) links on uncabled ports, so the lab's single border_1<->edge_1 cable
  # is enough and no extra connection is needed.
  #   routed       -> ext_l3_dci_link  (policy layer3DciVrfLite) on the existing cable Eth1/1 <-> Eth1/3
  #   subInterface -> ext_fabric_setup (policy ebgpVrfLite)       parent Eth1/2 on both ends (nd_test_switch*_subif;
  #                                                               the runner overlay appends the dot1q id: Ethernet1/2.100)
  #   svi          -> ext_l2_dci_link  (policy layer2Dci)         trunk Eth1/4 on both ends (runner SVI overlay)
  # requires_physical=false links are created as planned links and removed again by the restore journal.
  l3out_dci_links: &l3out_dci_links
    - template: ext_l3_dci_link
      policy_type: layer3DciVrfLite
      provisioning: nd_manage_links
      requires_physical: true
      src: {switch_ref: vxlan_border_1, interface: Ethernet1/1}
      dst: {switch_ref: external_edge_1, interface: Ethernet1/3}
      template_inputs: {}
    - template: ext_fabric_setup
      policy_type: ebgpVrfLite
      provisioning: nd_manage_links
      requires_physical: false
      src: {switch_ref: vxlan_border_1, interface: Ethernet1/2}
      dst: {switch_ref: external_edge_1, interface: Ethernet1/2}
      template_inputs: {src_ebgp_asn: "1234", dst_ebgp_asn: "567", src_ip_address_mask: 10.33.1.1/30, dst_ip_address: 10.33.1.2, link_mtu: 9216}
    - template: ext_l2_dci_link
      policy_type: layer2Dci
      provisioning: nd_manage_links
      requires_physical: false
      src: {switch_ref: vxlan_border_1, interface: Ethernet1/4}
      dst: {switch_ref: external_edge_1, interface: Ethernet1/4}
      template_inputs: {trunk_allowed_vlans: "100,200,300", native_vlan: 1, port_type_fast: true, mtu_type: jumbo, speed: auto, bpdu_guard: default}
  smoke_physical_vpc: &smoke_physical_vpc [{fabric_ref: advanced, peer_refs: [vxlan_leaf_1, vxlan_leaf_2], state: present, mode: physical, required_path: module_creates_pair, physical_peer_links: [{src: {switch_ref: vxlan_leaf_1, interface: Ethernet1/2}, dst: {switch_ref: vxlan_leaf_2, interface: Ethernet1/1}}]}]
  smoke_peer_links: &smoke_peer_links [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/2], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/1], admin_state: true, operational_state: when_reported_up}]
  smoke_vpc_links: &smoke_vpc_links [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/2, Ethernet1/3], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/1, Ethernet1/3], admin_state: true, operational_state: when_reported_up}]
  # The leaf pairs over the cabled peer-links (ND 4.3 rejects a virtual peer-link on the N9K-C9300v leaves): pair 1 is leaf_1 Eth1/2 <->
  # leaf_2 Eth1/1; pair 2 is leaf_3 <-> leaf_4 over Eth1/1 <-> Eth1/1 and Eth1/2 <-> Eth1/2. The pairs are formed by the runner around the vPC
  # interface targets (pair 2 is the pre-existing second pair their multi-pair scenario asserts); the planner only needs the cables.
  vpc_peer_links: &vpc_peer_links [{switch_ref: vxlan_leaf_1, interfaces: [Ethernet1/2], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_2, interfaces: [Ethernet1/1], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_3, interfaces: [Ethernet1/1, Ethernet1/2], admin_state: true, operational_state: when_reported_up}, {switch_ref: vxlan_leaf_4, interfaces: [Ethernet1/1, Ethernet1/2], admin_state: true, operational_state: when_reported_up}]
  physical_leaf_vpc: &physical_leaf_vpc [{fabric_ref: advanced, peer_refs: [vxlan_leaf_1, vxlan_leaf_2], state: present, mode: physical, required_path: module_creates_pair, physical_peer_links: [{src: {switch_ref: vxlan_leaf_1, interface: Ethernet1/2}, dst: {switch_ref: vxlan_leaf_2, interface: Ethernet1/1}}]}, {fabric_ref: advanced, peer_refs: [vxlan_leaf_3, vxlan_leaf_4], state: present, mode: physical, required_path: module_creates_pair, physical_peer_links: [{src: {switch_ref: vxlan_leaf_3, interface: Ethernet1/1}, dst: {switch_ref: vxlan_leaf_4, interface: Ethernet1/1}}, {src: {switch_ref: vxlan_leaf_3, interface: Ethernet1/2}, dst: {switch_ref: vxlan_leaf_4, interface: Ethernet1/2}}]}]

profiles:
  smoke.nd_manage_acl:
    <<: *profile
    profile_id: smoke.nd_manage_acl
    phase: retained_no_switch
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [acls]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_acl_name: ACL_ANSIBLE_NIGHTLY}
  smoke.nd_manage_prefix_list:
    <<: *profile
    profile_id: smoke.nd_manage_prefix_list
    phase: retained_no_switch
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [prefix_lists]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_pl_name: PL_ANSIBLE_NIGHTLY}
  smoke.nd_manage_route_map:
    <<: *profile
    profile_id: smoke.nd_manage_route_map
    phase: retained_no_switch
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [route_maps]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_rm_name: RM_ANSIBLE_NIGHTLY}
  smoke.nd_manage_vrfs:
    <<: *profile
    profile_id: smoke.nd_manage_vrfs
    phase: retained_no_switch
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [vrfs]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_vrf_name: ANSIBLE_NIGHTLY_VRF, nd_vrf_id: 51901, nd_vrf_vlan: 2250}
  smoke.nd_manage_networks:
    <<: *profile
    profile_id: smoke.nd_manage_networks
    phase: retained_no_switch
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [networks]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_net_name: ANSIBLE_NIGHTLY_NET, nd_net_id: 51901, nd_net_vlan: 2301}
  smoke.nd_manage_policy:
    <<: *profile
    profile_id: smoke.nd_manage_policy
    phase: advanced_leaf
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *adv1_leaf
    managed_domains: [policies]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, nd_policy_template: switch_freeform, switch1: SERIAL00001}
  smoke.nd_manage_policy_group:
    <<: *profile
    profile_id: smoke.nd_manage_policy_group
    phase: advanced_leaf
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *advanced_leaves
    managed_domains: [policy_groups]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, pg_switch_ids: [SERIAL00001, SERIAL00002]}
  smoke.nd_manage_switches:
    <<: *profile
    profile_id: smoke.nd_manage_switches
    phase: advanced_leaf
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *advanced_preserve
    managed_domains: [switches]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric}
  smoke.nd_manage_vpc_pair:
    <<: *profile
    profile_id: smoke.nd_manage_vpc_pair
    phase: vpc_pair_isolated
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *advanced_leaves
    links: *smoke_peer_links
    vpc_pairs: *smoke_physical_vpc
    managed_domains: [vpc_pairs, physical_interfaces]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, vpc_peer1_switch_id: SERIAL00001, vpc_peer2_switch_id: SERIAL00002}
    timeouts: *disruptive_timeouts
  smoke.nd_interface_vpc_access:
    <<: *profile
    profile_id: smoke.nd_interface_vpc_access
    phase: advanced_virtual_vpc
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *advanced_leaves
    links: *smoke_vpc_links
    vpc_pairs: *smoke_physical_vpc
    managed_domains: [vpc_pairs, vpc_interfaces, physical_interfaces]
    runtime_vars: {nd_fabric_name: VXLAN_EVPN_Fabric, vpc_switch_ip: 192.0.2.195, vpc_peer1_switch_id: SERIAL00001, vpc_peer2_switch_id: SERIAL00002, vpc_peer1_members: [Ethernet1/3], vpc_peer2_members: [Ethernet1/3]}
    timeouts: *disruptive_timeouts
  smoke.nd_interface_vpc_trunk_host:
    <<: *profile
    profile_id: smoke.nd_interface_vpc_trunk_host
    phase: advanced_virtual_vpc
    execution_style: smoke_playbook
    fabrics: [*advanced]
    switches: *advanced_leaves
    links: *smoke_vpc_links
