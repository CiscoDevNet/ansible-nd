profile_executions:
  integration.nd_vpc_pair:
    - execution_id: integration.nd_vpc_pair.advanced
      fabric_ref: advanced
      switch_refs: [vxlan_leaf_1, vxlan_leaf_2]
      desired_roles: [leaf, leaf]
      pair_mode: physical
      physical_peer_links: []
      # 2026-10-13: ND reports the intended leaf_1 Eth1/2 <-> leaf_2 Eth1/1 link missing and admin-down.
      # Physical wiring needs CML confirmation; the leaves are N9K-C9300v, which do not support virtual fabric peering, so the physical peer-link is required.
      # 2026-10-15: build failure confirmed serials are correct (STALE000008/STALE000009 match this registry
      # everywhere). The suite's own nd_vpc_pair_delete.yaml TC1 setup creates with use_virtual_peer_link:true
      # (no save/deploy) and reports changed=true/failed=false, but its own immediate gather+validate then
      # reports "Validation failed. Missing pairs" -- consistent with virtual fabric peering not forming on the
      # N9K-C9300v leaves, where it is unsupported. Added a Jenkinsfile pre-clean (best-effort delete) before
      # every standalone nd_vpc_pair run so a half-created pair from this kind of mid-suite failure can never
      # poison the next build; the physical peer-link leaf_1 Eth1/2 <-> leaf_2 Eth1/1 is the supported path.
      confirmation: {status: pending, owner: lab_owner, evidence: "", reasons: ["physical peer-link required: verify leaf_1 Ethernet1/2 <-> leaf_2 Ethernet1/1 in current CML, add only if absent, then enable and verify both ends before recording physical_peer_links; ND currently reports admin-down/linkMissing; never repurpose leaf_1 Ethernet1/3 because it is the live spine uplink; the N9K-C9300v leaves do not support virtual fabric peering, so only the physical peer-link is valid", "2026-10-15: standalone run failed in nd_vpc_pair_delete.yaml TC1 VALIDATE with 'Missing pairs' for STALE000008/STALE000009 right after a changed=true/failed=false merged create requesting use_virtual_peer_link:true; this is expected on N9K-C9300v where virtual fabric peering is unsupported -- finish cabling+confirming the physical peer-link leaf_1 Eth1/2 <-> leaf_2 Eth1/1 instead"]}
    - execution_id: integration.nd_vpc_pair.external
      fabric_ref: external
      switch_refs: [external_edge_1, external_edge_2]
      desired_roles: [edge_router, edge_router]
      pair_mode: physical
      physical_peer_links: []
      # 2026-10-13: no current edge_1 <-> edge_2 peer-link is discovered. Eth1/2-3 on edge_1 are live DCI ports.
      # The standalone target's extended fixture uses edge_1 Eth1/5+1/7 and edge_2 Eth1/6+1/8; it is not a traffic test.
      confirmation: {status: pending, owner: lab_owner, evidence: "", reasons: ["for operational external vPC coverage, verify or add edge_1 Ethernet1/5 <-> edge_2 Ethernet1/6 and edge_1 Ethernet1/7 <-> edge_2 Ethernet1/8, matching the extended standalone fixture; the lean delete-safe fixture does not configure peer-link members; never repurpose edge_1 Ethernet1/2 or Ethernet1/3 because they are live DCI links; keepalive addresses and native-VLAN alignment require separate operational validation; the N9K-C9300v edge switches do not support virtual fabric peering, so only the physical peer-link is valid"]}
