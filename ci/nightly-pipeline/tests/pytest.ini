[pytest]
# Keep stale local snapshot/backup directories out of test collection.
#
# The tests/ folder accumulates ad-hoc local backups (e.g. _v1_backup_<timestamp>/)
# and a _deleted/ holding area. These contain pre-refactor copies of the
# prerequisite modules and their tests. Without this guard a bare `pytest` run in
# this directory fails during collection with:
#   * "import file mismatch" (duplicate test_*.py basenames in backup dirs), and
#   * ImportError (old validate_nd_prerequisites.py copies lacking current symbols).
# These directories are NOT executed by the nightly and are NOT Consul-synced;
# they are purely local working artifacts, so excluding them from collection is safe.
norecursedirs = _v1_backup_* _deleted *_backup_* .* build dist *.egg node_modules venv
