---
# =============================================================================
# Single-module integration-test runner for the cisco.nd collection.
#
# Runs the FULL integration suite (every test-case file, testcase='*') for ONE
# module, selected via the extra var `test_module`. The Jenkins pipeline loops
# over INTEGRATION_MODULES and invokes this playbook ONCE PER MODULE, so each
# module produces its OWN PLAY RECAP (ok / failed / skipped) and its OWN
# duration -- one failing module never hides another's results.
#
# HOW IT WORKS
#   Every integration target (tests/integration/targets/<module>) is a role
#   whose tasks/main.yaml discovers tests/<testcase>.yaml. With testcase='*' it
#   runs the entire suite for that module; each test file self-cleans via the
#   target's tasks/cleanup.yaml (or, for every interface target, its final
#   tasks/deleted.yaml state). A pre-clean and an always-cleanup keep the
#   fabric baseline clean regardless of pass/fail.
#
# PREREQUISITES
#   1. roles_path must include the collection's integration targets, e.g.
#        .../cisco/nd/tests/integration/targets   (set in consul/ansible.cfg).
#   2. Supply the standard integration vars (fabric_name, switch_serial_1..3)
#      via Jenkins extra vars or edit the vars below.
#   3. Inventory must define the `nd` group/host (reuse ../consul/inventory.yaml).
#
# RUN
#   ansible-playbook -i inventory.yaml run_integration_module.yaml -e test_module=nd_manage_policy
# =============================================================================

- name: "cisco.nd - integration suite for {{ test_module }}"
  hosts: nd
  gather_facts: false
  force_handlers: true
  vars_files:
    - "{{ playbook_dir }}/integration_config.yml"
  vars:
    nd_prerequisite:
      profile: "integration.{{ test_module }}"
    nd_prerequisite_assets_dir: "{{ playbook_dir }}"
    nd_prerequisite_wrapper_path: "{{ playbook_dir }}/nd_prerequisite/nd_prerequisite_wrapper.yaml"
    testcase: "*"                      # every test-case file in the target
    # Select compatible upstream test directories for network/VRF roles.
    # Keep MSD and MCFG absent from this list unless their fixtures exist.
    test_groups: [standalone]
    # Consumed by the integration tests (Jenkins supplies module-specific overrides via -e):
    fabric_name: VXLAN_EVPN_Fabric
    # Device credentials are injected only by Jenkins for the test process. They
    # are intentionally separate from the ND controller credentials in inventory.
    switch_username: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_USERNAME') }}"
    switch_password: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_PASSWORD') }}"
    # ansible-test normally defines this; alias it here since this harness bypasses ansible-test.
    ansible_it_fabric: "{{ fabric_name }}"
    ansible_switch1: 192.0.2.195
    ansible_switch2: 192.0.2.196
    ansible_sno_1: SERIAL00001
    ansible_sno_2: SERIAL00002
    # Second vPC pair (vxlan_leaf_3/vxlan_leaf_4) the nd_interface_vpc_* multi-pair scenario asserts; the runner forms it
    # from the roster entries with these management IPs.
    nd_test_vpc_pair2_peer1_ip: 192.0.2.85
    nd_test_vpc_pair2_peer2_ip: 192.0.2.86
    intf_1_2: Ethernet1/2
    intf_1_3: Ethernet1/3
    intf_1_10: Ethernet1/10
    ansible_network_interface1: Ethernet1/4
    acl_test_fabric: "{{ fabric_name }}"
    nd_test_fabric_name: "{{ fabric_name }}"
    nd_test_fabric1_name: "{{ fabric_name }}"
    nd_test_fabric2_name: External_Connectivity_Fabric
    # nd_manage_links inputs. The registry profile integration.nd_manage_links publishes the live-verified
    # defaults (VXLAN_EVPN_Fabric, vxlan_leaf_2, vxlan_border_1); Jenkins may override them only with -e
    # values that the planner has also verified. Empty here so nothing unverified can ever be assumed.
    nd_test_fabric_numbered: "{{ lookup('env', 'ND_LINKS_FABRIC') | default('', true) }}"
    nd_test_switch_a: "{{ lookup('env', 'ND_LINKS_SWITCH_A') | default('', true) }}"
    nd_test_switch_b: "{{ lookup('env', 'ND_LINKS_SWITCH_B') | default('', true) }}"
    nd_test_switch_a_ip: "{{ lookup('env', 'ND_LINKS_SWITCH_A_IP') | default('') }}"
    nd_test_switch_b_ip: "{{ lookup('env', 'ND_LINKS_SWITCH_B_IP') | default('') }}"
    # nd_manage_tor runs a pipeline-owned REDUCED test instead of the upstream target, which needs six or seven switches in one
    # fabric (three ToR-role, three leaf-role) plus two vPC pairs that this lab cannot provide. vxlan_leaf_3 takes the ToR role
    # for the test only and is associated with vxlan_leaf_4 (the leaf); both sit in the round's primary fabric and are cabled
    # to each other on Eth1/1 and Eth1/2. Serials are resolved live from ND by management IP, the role is restored afterwards.
    nd_tor_switch_name: vxlan_leaf_3
    nd_tor_leaf_name: vxlan_leaf_4
    # nd_maintenance_mode and nd_fabric_update_group run the upstream targets on the idle leaves vxlan_leaf_3 (.85) and vxlan_leaf_4 (.86);
    # the update-group suite adds vxlan_spine_1 (.194) as its third, disjoint switch. Both modules take management IPs and resolve the
    # serials through ND itself. The registry profiles publish the same values as runtime vars, which the prerequisite wrapper sets as
    # facts (they outrank these play vars), so a drifting default can never run the target on switches the planner did not verify.
    nd_test_maintenance_mode_fabric_name: "{{ fabric_name }}"
    nd_test_maintenance_mode_switch_ip_a: 192.0.2.85
    nd_test_maintenance_mode_switch_ip_b: 192.0.2.86
    nd_test_update_switch_a: 192.0.2.85
    nd_test_update_switch_b: 192.0.2.86
    nd_test_update_switch_c: 192.0.2.194
    # switch1 = vxlan_border_1 (SERIAL00004 / .88, role border): cabled to external_edge_1
    # (border_1 Eth1/1 routed <-> edge_1 Eth1/3, probe-confirmed up/up) for the ext_l3_dci_link.
    # Jenkins/run_all_integ.sh pass the same pair via -e; this default keeps a bare manual run
    # on the cabled border endpoint too. (Was leaf_1 while border_1 was uncabled -- build #26
    # proved a plain leaf is rejected: "not a supported role for BGP L3Out".)
    nd_test_switch1_id: SERIAL00004
    nd_test_switch2_id: SERIAL00005
    nd_test_switch1_mgmt_ip: 192.0.2.88
    nd_test_switch2_mgmt_ip: 192.0.2.89
    nd_test_switch1_interface: Ethernet1/1
    nd_test_switch2_interface: Ethernet1/3
    nd_test_switch1_subif: Ethernet1/2
    nd_test_switch2_subif: Ethernet1/2
    nd_network_test_topology: standalone
    nd_vrf_test_topology: standalone
    # Fabric VRF VLAN range is 2000-2299; the collection default nd_vrf_base_vlan=2800
    # makes every generated VRF VLAN (base+1..base+42) out of range -> deterministic
    # create failure. Pin in-range (yields 2101-2142, clear of smoke 2250 / l3out 2290-2291).
    nd_vrf_base_vlan: 2100
    
    ansible_msd_parent_fabric: ""
    ansible_msd_child_fabric: ""
    ansible_msd_switch1: ""
    ansible_mcfg_parent_fabric: ""
    ansible_mcfg_child_fabric: ""
    ansible_mcfg_switch1: ""
    switch_serial_1: SERIAL00001
    switch_serial_2: SERIAL00002
    # switch_serial_3 MUST be in VXLAN_EVPN_Fabric. SERIAL00005 is external_edge_1
    # (External_Connectivity_Fabric) -> nd_manage_policy_group TC13 400 "Invalid switchId(s)".
    switch_serial_3: SERIAL00003   # vxlan_spine_1 (in-fabric); matches profiles L298
    save: true
    deploy: true
    config_actions_type: switch
  pre_tasks:
    # =====================================================================
    # NDP_TOPOLOGY_PREFLIGHT
    # Greppable required-vs-present topology banner. In ANY build log, search
    # for  NDP_TOPOLOGY_PREFLIGHT  to jump straight to this module's contract:
    #   REQUIRED = switches/roles/fabrics THIS module needs, read live from
    #              nd_prerequisite_profiles.yaml (profiles.<id>.switches and,
    #              when present, profile_executions.<id>).
    #   PRESENT  = switches/roles/fabrics the declared inventory provides
    #              (integration_config.yml -> nd_test_fabric_switches).
    # Any count / membership / role / fabric drift fails fast with the token
    #   NDP_TOPOLOGY_PREFLIGHT_FAIL ;  a clean run prints NDP_TOPOLOGY_PREFLIGHT_OK.
    # =====================================================================
    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] load registry contract"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/nd_prerequisite_profiles.yaml"
        name: _ndp_reg

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] resolve required + present"
      ansible.builtin.set_fact:
        _ndp_profile_id: "integration.{{ test_module }}"
        _ndp_required_count: "{{ _ndp_reg.profiles['integration.' ~ test_module].switches.required_count }}"
        _ndp_required_members: "{{ _ndp_reg.profiles['integration.' ~ test_module].switches.members }}"
        _ndp_executions: "{{ (_ndp_reg.profile_executions | default({}))['integration.' ~ test_module] | default([]) }}"
        _ndp_present_names: "{{ (nd_test_fabric_switches.VXLAN_EVPN_Fabric + nd_test_fabric_switches.External_Connectivity_Fabric) | map(attribute='name') | list }}"
        _ndp_present_role_by_name: "{{ (nd_test_fabric_switches.VXLAN_EVPN_Fabric + nd_test_fabric_switches.External_Connectivity_Fabric) | items2dict(key_name='name', value_name='role') }}"
        _ndp_fabric_refs: "{{ _ndp_reg.lab.fabrics | list }}"
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] required-vs-present banner"
      ansible.builtin.debug:
        msg: |-
          ==================== NDP_TOPOLOGY_PREFLIGHT :: {{ _ndp_profile_id }} ====================
          REQUIRED  (profiles.{{ _ndp_profile_id }}.switches; required_count={{ _ndp_required_count }})
          {% for m in _ndp_required_members %}
            - {{ m.ref }}  role={{ m.desired_role }}  fabric={{ _ndp_reg.lab.fabrics[m.desired_fabric_ref].name }} ({{ m.desired_fabric_ref }})
          {% else %}
            - (module declares no required switch members)
          {% endfor %}
          {% if _ndp_executions | length > 0 %}
          REQUIRED-EXECUTIONS  (profile_executions.{{ _ndp_profile_id }})
          {% for ex in _ndp_executions %}
            - {{ ex.execution_id }}  fabric={{ ex.fabric_ref }}  switches={{ ex.switch_refs }}  roles={{ ex.desired_roles }}
          {% endfor %}
          {% endif %}
          PRESENT   (integration_config.yml -> nd_test_fabric_switches)
          {% for fab, members in nd_test_fabric_switches.items() %}
            {{ fab }}:
          {% for s in members %}
              - {{ s.name }}  role={{ s.role }}  serial={{ s.serial }}  seed_ip={{ s.seed_ip }}
          {% endfor %}
          {% endfor %}
          ==================== NDP_TOPOLOGY_PREFLIGHT :: end {{ _ndp_profile_id }} ====================
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] fail fast on drift"
      ansible.builtin.assert:
        that:
          - _ndp_required_count | int == (_ndp_required_members | length)
          - (_ndp_required_members | map(attribute='ref') | list | difference(_ndp_present_names)) | length == 0
          - (_ndp_required_members | map(attribute='desired_fabric_ref') | unique | difference(_ndp_fabric_refs)) | length == 0
          - >-
            (_ndp_required_members | rejectattr('desired_role', 'equalto', 'preserve')
             | selectattr('ref', 'in', _ndp_present_role_by_name)
             | map(attribute='ref') | map('extract', _ndp_present_role_by_name) | list)
            ==
            (_ndp_required_members | rejectattr('desired_role', 'equalto', 'preserve')
             | selectattr('ref', 'in', _ndp_present_role_by_name)
             | map(attribute='desired_role') | list)
        fail_msg: >-
          NDP_TOPOLOGY_PREFLIGHT_FAIL [{{ test_module }}]: the required switch contract no longer matches
          the declared topology. required_count={{ _ndp_required_count }}
          required={{ _ndp_required_members }} present_names={{ _ndp_present_names }}
          present_roles={{ _ndp_present_role_by_name }}.
        success_msg: "NDP_TOPOLOGY_PREFLIGHT_OK [{{ test_module }}]: required contract satisfied by declared topology."
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "[{{ test_module }}] validate canonical fabric membership"
      ansible.builtin.assert:
        that:
          - nd_test_fabric_switches.VXLAN_EVPN_Fabric | length == 6
          - nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='name') | list == ['vxlan_leaf_1', 'vxlan_leaf_2', 'vxlan_spine_1', 'vxlan_border_1', 'vxlan_leaf_3', 'vxlan_leaf_4']
          - nd_test_fabric_switches.External_Connectivity_Fabric | length == 2
          - nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='name') | list == ['external_edge_1', 'external_edge_2']
        fail_msg: "integration_config.yml does not match the canonical six-switch primary and two-switch external topology."

    - name: "[{{ test_module }}] validate the reduced ToR roster"
      ansible.builtin.assert:
        that:
          - nd_tor_switch_name != nd_tor_leaf_name
          - _nd_tor_roster | selectattr('name', 'equalto', nd_tor_switch_name) | list | length == 1
          - _nd_tor_roster | selectattr('name', 'equalto', nd_tor_leaf_name) | list | length == 1
          - (_nd_tor_roster | selectattr('name', 'equalto', nd_tor_switch_name) | map(attribute='role') | list) == ['leaf']
          - (_nd_tor_roster | selectattr('name', 'equalto', nd_tor_leaf_name) | map(attribute='role') | list) == ['leaf']
        fail_msg: >-
          NDP_TOR_PRECHECK_FAIL: the reduced nd_manage_tor test needs {{ nd_tor_switch_name }} and {{ nd_tor_leaf_name }}
          as two distinct leaf switches of {{ ansible_it_fabric }} in integration_config.yml.
      vars:
        _nd_tor_roster: "{{ nd_test_fabric_switches[ansible_it_fabric] | default([]) }}"
      when: test_module == 'nd_manage_tor'

    # Positional switch variables are consumed by older role test cases. Keep
    # them tied to the primary fabric so an old Consul runner cannot accidentally
    # pass external_edge_1 (SERIAL00005) as switch_serial_3 and produce an ND
    # "Invalid switchId" response from a primary-fabric policy-group request.
    - name: "[{{ test_module }}] validate positional switches belong to the primary fabric"
      ansible.builtin.assert:
        that:
          - switch_serial_1 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_2 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_3 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_1 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
          - switch_serial_2 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
          - switch_serial_3 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
        fail_msg: >-
          NDP_SWITCH_MAPPING_FAIL [{{ test_module }}]: positional switch_serial_1..3 must resolve to
          switches in VXLAN_EVPN_Fabric. Got [{{ switch_serial_1 }}, {{ switch_serial_2 }}, {{ switch_serial_3 }}].
          External_Connectivity_Fabric contains [{{ nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list }}].

    - name: "[{{ test_module }}] validate prerequisite-only mode"
      ansible.builtin.assert:
        that:
          - not (nd_prerequisite_only | default(false) | bool) or (nd_prerequisite_enable | default(false) | bool)
        fail_msg: "nd_prerequisite_only requires nd_prerequisite_enable=true."

    # =====================================================================
    # NDP_PC_UNBUNDLE  (per-module pre-gate port-channel member self-heal)
    # The three nd_interface_port_channel_* targets share one member pool --
    # Ethernet1/10-13 on vxlan_leaf_1 (ansible_switch1) -- and each creates
    # port-channel501/502/503. A target or build that crashed mid-run can leave a
    # stale port-channel50x still holding a member (e.g. Ethernet1/12); the
    # read-only verify_free_interfaces gate below then SKIPs the module ("reserved
    # interface is a port-channel member") without ever remediating it. Release the
    # members here, right before that gate, by deleting any leftover test
    # port-channel50x on the member switch, then Recalculate & Deploy. Best-effort:
    # every step tolerates failure, so a stuck port-channel can never block the run.
    # Mirrors playbooks/nd_ensure_pc_members_free.yaml (the cross-build pre-flight);
    # the port-channel teardown patch covers the within-build orphan.
    - name: "[{{ test_module }}] release reserved port-channel members before the gate"
      vars:
        _ndp_pc_delete_config:
          - {switch_ip: "{{ ansible_switch1 }}", interface_name: port-channel501}
          - {switch_ip: "{{ ansible_switch1 }}", interface_name: port-channel502}
          - {switch_ip: "{{ ansible_switch1 }}", interface_name: port-channel503}
      when:
        - nd_prerequisite_enable | default(false) | bool
        - test_module in ['nd_interface_port_channel_access', 'nd_interface_port_channel_trunk_host', 'nd_interface_port_channel_routed']
        - nd_prerequisite_mode | default('fixture') == 'live'
        - nd_prerequisite_apply | default(false) | bool
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
      block:
        - name: "[{{ test_module }}] delete any stale test port-channel on {{ ansible_switch1 }} (frees Ethernet1/10-13)"
          cisco.nd.nd_interface_port_channel_access:
            output_level: info
            fabric_name: "{{ ansible_it_fabric }}"
            config: "{{ _ndp_pc_delete_config }}"
            state: deleted
          register: _ndp_pc_unbundle_delete
          failed_when: false

        - name: "[{{ test_module }}] Recalculate the fabric so the unbundle is pushed"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/actions/configSave"
          register: _ndp_pc_unbundle_configsave
          failed_when: false
          when: _ndp_pc_unbundle_delete is changed

        - name: "[{{ test_module }}] Deploy the fabric so the freed members take effect"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/actions/deploy?forceShowRun=true"
          register: _ndp_pc_unbundle_deploy
          failed_when: false
          when: _ndp_pc_unbundle_delete is changed

        - name: "[{{ test_module }}] report the port-channel unbundle self-heal"
          ansible.builtin.debug:
            msg: >-
              NDP_PC_UNBUNDLE [{{ test_module }}] switch={{ ansible_switch1 }}
              freed={{ _ndp_pc_unbundle_delete is changed }}
              configSave={{ _ndp_pc_unbundle_configsave.status | default('skipped') }}
              deploy={{ _ndp_pc_unbundle_deploy.status | default('skipped') }}

    - name: "[{{ test_module }}] prepare and verify declared prerequisites"
      when: nd_prerequisite_enable | default(false) | bool
      block:
        - name: "[{{ test_module }}] run prerequisite preparation lifecycle"
          ansible.builtin.import_tasks: "{{ nd_prerequisite_wrapper_path }}"
      rescue:
        - name: "[{{ test_module }}] restore any prerequisite interfaces after preparation failure"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/nd_prerequisite/nd_prerequisite_restore.yaml"
          when: _ndp_prerequisite_restore_operations | default([]) | length > 0

        - name: "[{{ test_module }}] fail after prerequisite recovery"
          ansible.builtin.fail:
            msg: >-
              Prerequisite preparation failed and its journaled interface changes
              were restored: {{ ansible_failed_result.msg | default(ansible_failed_result) }}

  tasks:
    # Handler notifications emitted from pre_tasks are flushed before normal
    # tasks. Arm the restore here so force_handlers runs it only after the target
    # and its cleanup, including when a later task fails.
    - name: "[{{ test_module }}] arm forced prerequisite restore handler"
      ansible.builtin.debug:
        msg: >-
          Armed restore for {{ _ndp_prerequisite_restore_operations | default([]) | length }}
          prerequisite interface change(s); journal={{ _ndp_restore_file | default('not-created') }}.
      changed_when: _ndp_prerequisite_restore_operations | default([]) | length > 0
      notify: Restore prerequisite interface changes
      when: nd_prerequisite_enable | default(false) | bool

    - name: "[{{ test_module }}] validate required topology facts"
      ansible.builtin.assert:
        that:
          - ansible_it_fabric | length > 0
          - ansible_switch1 | length > 0
          - ansible_switch2 | length > 0
          - (test_module != 'nd_manage_switches') or (ansible_switch3 | length > 0)
          - (test_module != 'nd_manage_switches') or (save | bool and deploy | bool and config_actions_type == 'switch')
          # Integration target dir is nd_resource_manager (module is nd_manage_resource_manager); test_module carries the target name.
          - (test_module not in ['nd_resource_manager', 'nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']) or (ansible_sno_1 | length > 0 and ansible_sno_2 | length > 0)
          - (test_module not in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']) or (nd_test_vpc_pair2_peer1_ip | length > 0 and nd_test_vpc_pair2_peer2_ip | length > 0 and nd_test_vpc_pair2_peer1_ip != nd_test_vpc_pair2_peer2_ip)
          - (test_module != 'nd_resource_manager') or (intf_1_2 | length > 0 and intf_1_3 | length > 0 and intf_1_10 | length > 0)
          - (test_module != 'nd_manage_route_map') or (nd_test_fabric_name | length > 0)
          - (test_module != 'nd_manage_acl') or (acl_test_fabric | length > 0)
          - (test_module != 'nd_manage_l3out') or (nd_test_fabric1_name | length > 0 and nd_test_fabric2_name | length > 0)
          # nd_maintenance_mode / nd_fabric_update_group: the switches the target changes must be distinct management IPs of the round's fabric.
          - (test_module != 'nd_maintenance_mode') or (nd_test_maintenance_mode_fabric_name | length > 0 and ([nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b] | map('string') | reject('equalto', '') | unique | list | length) == 2)
          - (test_module != 'nd_fabric_update_group') or (nd_test_fabric_name | length > 0 and ([nd_test_update_switch_a, nd_test_update_switch_b, nd_test_update_switch_c] | map('string') | reject('equalto', '') | unique | list | length) == 3)
          # nd_manage_links: both switches must be members of the chosen fabric in the canonical roster, and any
          # override must equal what the planner verified (profile runtime_vars) when prerequisites are enabled.
          - (test_module != 'nd_manage_links') or (nd_test_fabric_numbered | length > 0 and nd_test_fabric_numbered in nd_test_fabric_switches)
          - (test_module != 'nd_manage_links') or (nd_test_switch_a | length > 0 and nd_test_switch_b | length > 0 and nd_test_switch_a != nd_test_switch_b)
          - (test_module != 'nd_manage_links') or (nd_test_switch_a in (nd_test_fabric_switches[nd_test_fabric_numbered] | default([]) | map(attribute='name') | list) and nd_test_switch_b in (nd_test_fabric_switches[nd_test_fabric_numbered] | default([]) | map(attribute='name') | list))
          - (test_module != 'nd_manage_links') or ((nd_test_switch_a_ip | length == 0 and nd_test_switch_b_ip | length == 0) or (nd_test_switch_a_ip | length > 0 and nd_test_switch_b_ip | length > 0 and nd_test_switch_a_ip != nd_test_switch_b_ip))
          - (test_module != 'nd_manage_links') or (_ndp_result is not defined) or (nd_test_fabric_numbered == _ndp_result.runtime_vars.nd_test_fabric_numbered and nd_test_switch_a == _ndp_result.runtime_vars.nd_test_switch_a and nd_test_switch_b == _ndp_result.runtime_vars.nd_test_switch_b)
          # nd_interface_subinterface_*: with prerequisites enabled the parent must equal the planner-verified one, so a
          # stale -e (e.g. an old job still passing Ethernet1/35) cannot run the test on a port nobody prepared.
          - (test_module not in ['nd_interface_subinterface_managed', 'nd_interface_subinterface_unmanaged']) or (_ndp_result is not defined) or (nd_test_ethernet_parent | default('') == _ndp_result.runtime_vars.nd_test_ethernet_parent)
          - switch_serial_1 != switch_serial_2
          - switch_serial_2 != switch_serial_3
          - switch_serial_1 != switch_serial_3
        fail_msg: >-
          {{ test_module }} requires a complete, distinct integration topology.
          Run the prerequisite preparation lifecycle before retrying this module.
          For nd_manage_links the fabric/switch inputs must be roster members and, with prerequisites
          enabled, equal to the profile-verified values (leave ND_LINKS_* blank to use them).
          For nd_interface_subinterface_* a non-blank nd_test_ethernet_parent must equal the profile-verified
          parent (do not pass -e nd_test_ethernet_parent to use it; got '{{ nd_test_ethernet_parent | default('unset') }}').

    # -------------------------------------------------------------------------
    # Not every target has tasks/cleanup.yaml, and include_role + tasks_from on
    # a missing file raises an error that ignore_errors does NOT suppress (it
    # aborts the play before RUN). Stat-guard the pre/post clean. stat runs on
    # localhost because the play host `nd` is a network device with no local FS.
    #
    # Lifecycle file names vary: setup/prepare and cleanup/teardown.
    # Deletion test scenarios are not idempotent lifecycle cleanup routines.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] arm cleanup for the verified-empty subinterface namespace"
      ansible.builtin.set_fact:
        _ndp_subinterface_cleanup:
          fabric: "{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_subinterface_namespace.switch_ref].baseline_fabric_ref].name }}"
          switch_ip: "{{ _ndp_registry.lab.switches[_ndp_subinterface_namespace.switch_ref].seed_ip }}"
          interfaces: "{{ _ndp_subinterface_namespace.interfaces }}"
      vars:
        _ndp_subinterface_namespace: >-
          {{ _ndp_profile.resources
             | selectattr('kind', 'equalto', 'verify_logical_interface_namespace')
             | selectattr('interface_type', 'equalto', 'subinterface')
             | selectattr('expected_state', 'equalto', 'absent') | first }}
      changed_when: true
      notify: Restore prerequisite interface changes
      when:
        - test_module in ['nd_interface_subinterface_managed', 'nd_interface_subinterface_unmanaged']
        - nd_prerequisite_enable | default(false) | bool
        - nd_prerequisite_mode | default('fixture') == 'live'
        - nd_prerequisite_apply | default(false) | bool
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
        - _ndp_result is defined

    - name: "[{{ test_module }}] discover optional setup/cleanup task files (names vary)"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks/{{ item }}"
      register: _ndp_lifecycle_probe
      loop:
        - setup.yaml
        - setup.yml
        - prepare.yaml
        - prepare.yml
        - cleanup.yaml
        - cleanup.yml
        - teardown.yaml
        - teardown.yml
      delegate_to: localhost
      when: not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] resolve first-matching setup + cleanup files"
      ansible.builtin.set_fact:
        _ndp_setup_file: "{{ _ndp_lifecycle_probe.results | selectattr('stat.exists') | map(attribute='item') | select('match', '^(setup|prepare)[.]') | list | first | default('') }}"
        _ndp_cleanup_file: "{{ _ndp_lifecycle_probe.results | selectattr('stat.exists') | map(attribute='item') | select('match', '^(cleanup|teardown)[.]') | list | first | default('') }}"
      when: not (nd_prerequisite_only | default(false) | bool)

    # A target "owns" its setup when main.yaml or any test-case already imports
    # it (most do). Only an UNWIRED setup file is run by the harness below, so
    # setup is never double-run for targets that already sequence it themselves.
    - name: "[{{ test_module }}] find files that already import the setup file"
      ansible.builtin.find:
        paths:
          - "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks"
          - "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tests"
        patterns:
          - "*.yaml"
          - "*.yml"
        contains: ".*(import_tasks|include_tasks|tasks_from|include_role|import_role).*{{ _ndp_setup_file | regex_escape }}.*"
        recurse: true
      register: _ndp_setup_importers
      failed_when: false
      delegate_to: localhost
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - _ndp_setup_file | default('') | length > 0

    # -------------------------------------------------------------------------
    # SETUP (all modules): the pre-clean below and the post-clean in the always section run the target's cleanup/teardown file
    # ON ITS OWN, but several of those files read nd_info, which only the target's main.yaml sets (live 2026-10-13 nd_maintenance_mode;
    # 2026-10-16 nd_manage_prefix_list + nd_manage_community_list: "'nd_info' is undefined" ended the play before the target started,
    # and include_role does not pass ignore_errors on to the tasks it includes). Define the fact for EVERY module here; main.yaml
    # re-sets an identical value later.
    - name: "[{{ test_module }}] SETUP - define nd_info for the stand-alone pre-clean/teardown"
      ansible.builtin.set_fact:
        nd_info:
          output_level: '{{ api_key_output_level | default("debug") }}'
      when: not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP: best-effort pre-clean of stale objects for this module, so a prior
    # aborted run cannot leak state into this one. Skipped when no cleanup file.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - pre-clean stale objects (best effort)"
      ansible.builtin.include_role:
        name: "{{ test_module }}"
        tasks_from: "{{ _ndp_cleanup_file }}"
        apply:
          ignore_errors: true
      ignore_errors: true
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - _ndp_cleanup_file | default('') | length > 0

    # -------------------------------------------------------------------------
    # SETUP (nd_manage_vrfs only): the collection's setup "Delete All VRFs"
    # cannot delete a VRF while a network references it (AKB_NET_* -> AKB_VRF_*).
    # Delete every network on the target fabric first. Same gather-then-delete
    # pattern as reset_fabric.yaml, scoped here so it also holds mid-version.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - gather networks before VRF delete"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config: []
      register: vrf_preclean_networks
      ignore_errors: true
      when: test_module == 'nd_manage_vrfs' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - delete networks before VRF delete"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        config:
          - network_name: "{{ item.network_name }}"
            is_l2only: "{{ item.is_l2only | default(omit) }}"
      loop: "{{ vrf_preclean_networks.gathered | default(vrf_preclean_networks.current) | default(vrf_preclean_networks.response) | default([]) }}"
      loop_control:
        label: "{{ fabric_name }} / {{ item.network_name | default(item) }}"
      ignore_errors: true
      when: test_module == 'nd_manage_vrfs' and not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP (nd_manage_l3out only): the collection's l3out setup.yaml deletes
    # stale L3Outs but never CREATES the VRFs its merged.yaml references
    # (test_vrf1_name 'production' on fabric1, test_vrf2_name 'external' on
    # fabric2). On ND 4.2.1 the L3Out create then 207s "VRF production not found
    # in fabric VXLAN_EVPN_Fabric" (build #30). Pre-create the VRFs here. The
    # nd_manage_vrfs MODULE is broken on 4.2.1 (bgpPasswordKeyType), so use raw
    # REST. A duplicate create is allowed, but the GET checks below are the
    # authoritative gate: the L3Out module is not started unless each required
    # VRF is present on its declared fabric.
    - name: "[{{ test_module }}] SETUP - pre-create L3Out VRF on fabric1"
      cisco.nd.nd_rest:
        method: post
        path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/vrfs"
        content:
          vrfs:
            - vrfType: vxlanIbgp
              fabricName: "{{ nd_test_fabric1_name }}"
              vrfName: "{{ nd_test_vrf1_name | default('production') }}"
              vrfId: "{{ nd_test_vrf1_id | default(58900) }}"
              vlanId: "{{ nd_test_vrf1_vlan | default(2290) }}"
      register: l3out_vrf1_precreate
      # ND may return a duplicate-object error when the prerequisite already
      # exists. The GET + assert below decides whether the prerequisite is valid.
      failed_when: false
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - pre-create L3Out VRF on fabric2"
      cisco.nd.nd_rest:
        method: post
        path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}/vrfs"
        content:
          vrfs:
            - vrfType: externalConnectivity
              fabricName: "{{ nd_test_fabric2_name }}"
              vrfName: "{{ nd_test_vrf2_name | default('external') }}"
              vrfId: "{{ nd_test_vrf2_id | default(58901) }}"
              vlanId: "{{ nd_test_vrf2_vlan | default(2291) }}"
      register: l3out_vrf2_precreate
      failed_when: false
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - verify L3Out VRF on fabric1"
      cisco.nd.nd_rest:
        method: get
        path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/vrfs"
      register: l3out_vrf1_live
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - verify L3Out VRF on fabric2"
      cisco.nd.nd_rest:
        method: get
        path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}/vrfs"
      register: l3out_vrf2_live
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - fail closed if L3Out VRFs are missing"
      ansible.builtin.assert:
        that:
          - >-
            (nd_test_vrf1_name | default('production')) in
            (l3out_vrf1_live.current.vrfs | default([]) | map(attribute='vrfName') | list)
          - >-
            (nd_test_vrf2_name | default('external')) in
            (l3out_vrf2_live.current.vrfs | default([]) | map(attribute='vrfName') | list)
        fail_msg: >-
          NDP_L3OUT_VRF_PREREQUISITE_FAIL: required VRFs were not confirmed before
          nd_manage_l3out. Expected
          {{ nd_test_vrf1_name | default('production') }} on {{ nd_test_fabric1_name }} and
          {{ nd_test_vrf2_name | default('external') }} on {{ nd_test_fabric2_name }}.
          Check the raw VRF POST response and controller permissions.
        success_msg: >-
          NDP_L3OUT_VRF_PREREQUISITE_OK: confirmed
          {{ nd_test_vrf1_name | default('production') }} on {{ nd_test_fabric1_name }} and
          {{ nd_test_vrf2_name | default('external') }} on {{ nd_test_fabric2_name }}.
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP (nd_manage_l3out only): ND 4.3 refuses several inputs of the upstream l3out vars, so layer a
    # lab overlay on them (set_fact outranks the role's vars/main.yaml; nothing in the collection is edited):
    #   * BGP with configured_fabrics=both needs routing_details.bgp.fabric2_details.local_asn
    #     ("Fabric is set to be configured, but routing details are not provided") -> the fabric2 BGP ASN
    #   * an SVI link must name the PHYSICAL trunk port of the ext_l2_dci_link (Vlan200 -> "No appropriate
    #     link found"), taken from the registry's ext_l2_dci_link spec, and advertise_host_routes cannot
    #     be combined with a custom outbound route map
    #   * the route maps the vars reference must exist in fabric1 ("Route map rm-in not found in fabric")
    # Subinterface names carry their dot1q suffix through the registry runtime vars (Ethernet1/2.100).
    - name: "[{{ test_module }}] SETUP - ND 4.3 lab overlay for the l3out test vars"
      when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - load the target's own l3out vars so the overlay can build on them"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/tests/integration/targets/nd_manage_l3out/vars/main.yaml"

        - name: "[{{ test_module }}] SETUP - read the fabric2 BGP ASN and the SVI trunk link from the registry"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}"
          register: _ndp_l3out_fabric2
          no_log: true

        - name: "[{{ test_module }}] SETUP - resolve overlay inputs"
          ansible.builtin.set_fact:
            _ndp_l3out_fabric2_asn: "{{ (_ndp_l3out_fabric2.current.management.bgpAsn | default('')) | string }}"
            _ndp_l3out_svi_link: >-
              {{ _ndp_reg.profiles['integration.nd_manage_l3out'].interfabric_links
                 | selectattr('template', 'equalto', 'ext_l2_dci_link') | list | first }}
            # Only routing_details is serialised: the vars' tenant keys resolve to Ansible's omit sentinel, which to_json rejects.
            _ndp_l3out_route_maps: >-
              {{ [l3out_bgp.routing_details, l3out_bgp_updated.routing_details, l3out_svi.routing_details] | to_json
                 | regex_findall('"ipv[46]_route_map_(?:in|out)": ?"([^"]+)"') | unique | list }}

        - name: "[{{ test_module }}] SETUP - require a fabric2 BGP ASN"
          ansible.builtin.assert:
            that:
              - _ndp_l3out_fabric2_asn | length > 0
            fail_msg: "NDP_L3OUT_OVERLAY_FAIL: {{ nd_test_fabric2_name }} reports no management.bgpAsn."

        - name: "[{{ test_module }}] SETUP - overlay the BGP/SVI/replaced test vars"
          ansible.builtin.set_fact:
            l3out_bgp: "{{ l3out_bgp | combine(_ndp_l3out_f2_overlay, recursive=True) }}"
            l3out_bgp_updated: "{{ l3out_bgp_updated | combine(_ndp_l3out_f2_overlay, recursive=True) }}"
            l3out_svi: >-
              {{ l3out_svi | combine(_ndp_l3out_f2_overlay, recursive=True)
                 | combine(_ndp_l3out_svi_overlay, recursive=True) }}
            # The upstream replaced case turns the static L3Out into a routed BGP one; ND 4.3 answers 400
            # "Changing the routing protocol of an L3Out is not supported", so replace it with a changed
            # static configuration instead (the case only asserts changed + idempotent).
            # The sub-interface names need their dot1q id ("Subinterface name should contain dot1q ID"). The
            # nd_test_*_subif extra vars come from the Jenkins inventory file and outrank any fact, so the
            # suffix is applied to the l3out_static dict itself (never to those variables).
            l3out_static: "{{ _ndp_l3out_static_overlaid }}"
            l3out_static_replaced: "{{ _ndp_l3out_static_overlaid | combine(_ndp_l3out_static_replaced_overlay, recursive=True) }}"
          vars:
            _ndp_l3out_static_link0: "{{ l3out_static.connectivity_details.links[0] }}"
            _ndp_l3out_subif1: >-
              {{ test_switch1_subif if (test_switch1_subif | string is search('[.][0-9]+$'))
                 else (test_switch1_subif ~ '.' ~ _ndp_l3out_static_link0.vlan_id) }}
            _ndp_l3out_subif2: >-
              {{ test_switch2_subif if (test_switch2_subif | string is search('[.][0-9]+$'))
                 else (test_switch2_subif ~ '.' ~ _ndp_l3out_static_link0.vlan_id) }}
            _ndp_l3out_static_overlaid: >-
              {{ l3out_static | combine({'connectivity_details': {'links': [
                   _ndp_l3out_static_link0 | combine({
                     'switch1_details': {'interface_name': _ndp_l3out_subif1},
                     'switch2_details': {'interface_name': _ndp_l3out_subif2}}, recursive=True)]}}, recursive=True) }}
            _ndp_l3out_f2_overlay:
              routing_details: {bgp: {fabric2_details: {local_asn: "{{ _ndp_l3out_fabric2_asn }}"}}}
            _ndp_l3out_svi_overlay:
              connectivity_details:
                links:
                  - "{{ l3out_svi.connectivity_details.links[0] | combine({
                       'switch1_details': {'interface_name': _ndp_l3out_svi_link.src.interface},
                       'switch2_details': {'interface_name': _ndp_l3out_svi_link.dst.interface}}, recursive=True) }}"
              routing_details: {bgp: {fabric1_details: {advertise_host_routes: false}}}
            _ndp_l3out_static_replaced_overlay:
              connectivity_details:
                links:
                  - "{{ _ndp_l3out_static_overlaid.connectivity_details.links[0] | combine({'mtu': 9216}) }}"
              routing_details:
                static:
                  fabric1_static_routes:
                    - "{{ l3out_static.routing_details.static.fabric1_static_routes[0] | combine({'route_preference': 5}) }}"

        - name: "[{{ test_module }}] SETUP - list the route maps already in {{ nd_test_fabric1_name }}"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/routeMaps"
          register: _ndp_l3out_route_maps_live
          no_log: true

        - name: "[{{ test_module }}] SETUP - create only the missing route maps (existing ones are never modified)"
          ansible.builtin.set_fact:
            _ndp_l3out_route_maps_created: >-
              {{ _ndp_l3out_route_maps | difference(
                   (_ndp_l3out_route_maps_live.current.routeMaps | default(_ndp_l3out_route_maps_live.current.items | default([])))
                   | map(attribute='name') | list) }}

        - name: "[{{ test_module }}] SETUP - create the route maps the l3out vars reference"
          cisco.nd.nd_manage_route_map:
            fabric_name: "{{ nd_test_fabric1_name }}"
            config: >-
              {{ _ndp_l3out_route_maps_created
                 | map('community.general.dict_kv', 'name') | list
                 | map('combine', {'entries': [{'sequence_number': 10, 'action': 'permit',
                                                 'rule_entries': [{'rule_type': 'setLocalPreference', 'value': 100}]}]})
                 | list }}
            state: merged
          when: _ndp_l3out_route_maps_created | length > 0

    # -------------------------------------------------------------------------
    # SETUP (nd_interface_subinterface_managed only): ND 4.3 refuses a sub-interface create whose policy sets
    # adminState without an mtu (207 "Policy [subinterface] - Validation failed for following fields: [mtu]";
    # live 2026-10-08), and the upstream vars give only subif_eth_2 an mtu. Layer ND's own default (9216, the
    # value subif_eth_2 already uses) on the other creates. set_fact outranks the role's vars/main.yaml, so
    # nothing in the collection is edited. The sub-interface names resolve from the verified parent facts.
    - name: "[{{ test_module }}] SETUP - ND 4.3 mtu overlay for the sub-interface create vars"
      when: test_module == 'nd_interface_subinterface_managed' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - load the target's own sub-interface vars so the overlay can build on them"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/tests/integration/targets/nd_interface_subinterface_managed/vars/main.yaml"

        - name: "[{{ test_module }}] SETUP - overlay an mtu on the sub-interface create vars"
          ansible.builtin.set_fact:
            subif_eth_3: "{{ subif_eth_3 | combine(_ndp_subif_mtu_overlay, recursive=True) }}"
            subif_eth_4: "{{ subif_eth_4 | combine(_ndp_subif_mtu_overlay, recursive=True) }}"
            subif_pc_5: "{{ subif_pc_5 | combine(_ndp_subif_mtu_overlay, recursive=True) }}"
          vars:
            _ndp_subif_mtu_overlay:
              config_data: {network_os: {policy: {mtu: 9216}}}

        # The replaced/overridden cases carry their configs inline (no var to overlay), and ND 4.3 answers their
        # PUTs with 400 "Validation failed for following fields: [mtu]" for the same reason, so give those
        # policy blocks the same mtu in the target's own task files (the run's checkout, never committed).
        - name: "[{{ test_module }}] SETUP - give the inline replaced/overridden sub-interface configs an mtu"
          ansible.builtin.replace:
            path: "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks/{{ item }}"
            regexp: '^([ ]+)admin_state: true[ ]*\n(?![ ]+mtu:)'
            replace: '\1admin_state: true\n\1mtu: 9216\n'
          loop:
            - replaced.yaml
            - overridden.yaml
          delegate_to: localhost

    # -------------------------------------------------------------------------
    # SETUP (community lists only): the develop targets set module_defaults `timeout: 300` for modules whose
    # argument spec has no such option, so every task fails "Unsupported parameters ... timeout" (live 2026-10-09).
    # Drop that defaults block from the run's own checkout of the target (never committed).
    - name: "[{{ test_module }}] SETUP - drop the unsupported timeout module default from the target"
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks/main.yaml"
        regexp: '^  module_defaults:\n    cisco[.]nd[.]{{ test_module }}:\n      timeout: [0-9]+\n?'
        replace: ''
      delegate_to: localhost
      when:
        - test_module in ['nd_manage_community_list', 'nd_manage_extended_community_list']
        - not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP (vPC interface targets): their own setup only builds a VIRTUAL-peer-link pair with vpc_pair_details, which
    # ND 4.3 rejects on the N9K-C9300v leaves and on a vxlanIbgp fabric. Form the PHYSICAL pair over the cabled
    # leaf_1 Eth1/2 <-> leaf_2 Eth1/1 peer-link here and hand it to the target as pre-existing substrate
    # (nd_test_manage_vpc_pairs=false: its setup/teardown then leave the pair alone). The target's multi-pair
    # scenario asserts a SECOND pair, so the runner also forms leaf_3/leaf_4 over their cabled Eth1/1 + Eth1/2
    # peer-links. The CLEANUP unpairs what this run created because the destructive nd_manage_switches module
    # runs later in the same job.
    - name: "[{{ test_module }}] SETUP - standing physical vPC pair for the vPC interface target"
      when: test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host'] and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the target runs"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_vpcif_pairs_before

        - name: "[{{ test_module }}] SETUP - record whether the pair pre-existed"
          ansible.builtin.set_fact:
            _ndp_vpcif_pair_preexisting: >-
              {{ ((_ndp_vpcif_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_before.vpc_pairs | default([])))
                 | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                 | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2])
                 | selectattr('peerSwitchId', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
                 or ((_ndp_vpcif_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_before.vpc_pairs | default([])))
                 | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                 | selectattr('switch_id', 'in', [ansible_sno_1, ansible_sno_2])
                 | selectattr('peer_switch_id', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0 }}

        - name: "[{{ test_module }}] SETUP - wait until ND reports the physical peer-link as present"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
          register: _ndp_vpcif_peer_link
          retries: 12
          delay: 15
          until: >-
            {{ (_ndp_vpcif_peer_link.current.links | default([]))
               | selectattr('srcSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
               | selectattr('dstSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
               | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
          failed_when: false
          no_log: true
          when: not (_ndp_vpcif_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - create the physical vPC pair"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: merged
            config_actions: {save: true, deploy: true, type: switch}
            config:
              - peer1_switch_id: "{{ ansible_sno_1 }}"
                peer2_switch_id: "{{ ansible_sno_2 }}"
                use_virtual_peer_link: false
          when: not (_ndp_vpcif_pair_preexisting | bool)

        # Same convergence pause the targets' own setup uses after forming a pair.
        - name: "[{{ test_module }}] SETUP - pause for pair-establishment convergence"
          ansible.builtin.pause:
            seconds: 30
          when: not (_ndp_vpcif_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - gather the vPC pairs once the pair is formed"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_vpcif_pairs_after

        - name: "[{{ test_module }}] SETUP - require the leaf pair before the target starts"
          ansible.builtin.assert:
            that: >-
              ((_ndp_vpcif_pairs_after.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_after.vpc_pairs | default([])))
              | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
              | selectattr('switch_id', 'in', [ansible_sno_1, ansible_sno_2])
              | selectattr('peer_switch_id', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
              or ((_ndp_vpcif_pairs_after.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_after.vpc_pairs | default([])))
              | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
              | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2])
              | selectattr('peerSwitchId', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
            fail_msg: >-
              The physical vPC pair {{ ansible_sno_1 }}/{{ ansible_sno_2 }} does not exist in {{ ansible_it_fabric }} after the
              runner formed it; the vPC interface target needs it as substrate.

        - name: "[{{ test_module }}] SETUP - hand the pair to the target as pre-existing lab substrate"
          ansible.builtin.set_fact:
            nd_test_manage_vpc_pairs: false
            nd_test_vpc_peer1_ip: "{{ ansible_switch1 }}"
            nd_test_vpc_peer2_ip: "{{ ansible_switch2 }}"

        # Second pair (leaf_3/leaf_4): the targets' multi-pair scenario asserts that it exists with reciprocal vpcPair records
        # and never creates it, so the runner forms it exactly like the first pair. Its switches are looked up in the roster
        # by the nd_test_vpc_pair2_peer*_ip management IPs the target reads, so the pair, the roster and the target agree.
        - name: "[{{ test_module }}] SETUP - resolve the second vPC pair from the roster"
          ansible.builtin.set_fact:
            _ndp_vpcif2_sno_1: >-
              {{ ((nd_test_fabric_switches[ansible_it_fabric] | default([]))
                  | selectattr('seed_ip', 'equalto', nd_test_vpc_pair2_peer1_ip)
                  | map(attribute='serial') | list + ['']) | first }}
            _ndp_vpcif2_sno_2: >-
              {{ ((nd_test_fabric_switches[ansible_it_fabric] | default([]))
                  | selectattr('seed_ip', 'equalto', nd_test_vpc_pair2_peer2_ip)
                  | map(attribute='serial') | list + ['']) | first }}

        - name: "[{{ test_module }}] SETUP - require two distinct roster switches for the second pair"
          ansible.builtin.assert:
            that:
              - _ndp_vpcif2_sno_1 | length > 0
              - _ndp_vpcif2_sno_2 | length > 0
              - _ndp_vpcif2_sno_1 != _ndp_vpcif2_sno_2
              - ([_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2] | intersect([ansible_sno_1, ansible_sno_2])) | length == 0
            fail_msg: >-
              The second vPC pair {{ nd_test_vpc_pair2_peer1_ip }}/{{ nd_test_vpc_pair2_peer2_ip }} must resolve to two distinct
              {{ ansible_it_fabric }} roster switches that are not the first pair; got serials
              '{{ _ndp_vpcif2_sno_1 }}'/'{{ _ndp_vpcif2_sno_2 }}'.

        - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the second pair is formed"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_vpcif2_pairs_before

        - name: "[{{ test_module }}] SETUP - record whether the second pair pre-existed"
          ansible.builtin.set_fact:
            _ndp_vpcif2_pair_preexisting: >-
              {{ ((_ndp_vpcif2_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_before.vpc_pairs | default([])))
                 | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                 | selectattr('switchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                 | selectattr('peerSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0
                 or ((_ndp_vpcif2_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_before.vpc_pairs | default([])))
                 | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                 | selectattr('switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                 | selectattr('peer_switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0 }}

        - name: "[{{ test_module }}] SETUP - wait until ND reports the second pair's physical peer-link as present"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
          register: _ndp_vpcif2_peer_link
          retries: 12
          delay: 15
          until: >-
            {{ (_ndp_vpcif2_peer_link.current.links | default([]))
               | selectattr('srcSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
               | selectattr('dstSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
               | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
          failed_when: false
          no_log: true
          when: not (_ndp_vpcif2_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - create the second physical vPC pair"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: merged
            config_actions: {save: true, deploy: true, type: switch}
            config:
              - peer1_switch_id: "{{ _ndp_vpcif2_sno_1 }}"
                peer2_switch_id: "{{ _ndp_vpcif2_sno_2 }}"
                use_virtual_peer_link: false
          when: not (_ndp_vpcif2_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - pause for second-pair establishment convergence"
          ansible.builtin.pause:
            seconds: 30
          when: not (_ndp_vpcif2_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - gather the vPC pairs once the second pair is formed"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_vpcif2_pairs_after

        - name: "[{{ test_module }}] SETUP - require the second leaf pair before the target starts"
          ansible.builtin.assert:
            that: >-
              ((_ndp_vpcif2_pairs_after.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_after.vpc_pairs | default([])))
              | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
              | selectattr('switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
              | selectattr('peer_switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0
              or ((_ndp_vpcif2_pairs_after.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_after.vpc_pairs | default([])))
              | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
              | selectattr('switchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
              | selectattr('peerSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0
            fail_msg: >-
              The physical vPC pair {{ _ndp_vpcif2_sno_1 }}/{{ _ndp_vpcif2_sno_2 }} does not exist in {{ ansible_it_fabric }} after
              the runner formed it; the vPC interface target's multi-pair scenario needs it as its second pair.

        - name: "[{{ test_module }}] SETUP - wait for all four vPC peers to be inSync before interface tests"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
          register: _ndp_vpcif_device_convergence
          retries: 24
          delay: 15
          until:
            - not (_ndp_vpcif_device_convergence.failed | default(false))
            - >-
              (_ndp_vpcif_device_convergence.current.switches | default([])
               | selectattr('switchId', 'defined')
               | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2, _ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
               | selectattr('additionalData', 'defined')
               | selectattr('additionalData.configSyncStatus', 'defined')
               | selectattr('additionalData.configSyncStatus', 'equalto', 'inSync')
               | map(attribute='switchId') | unique | list | sort)
              == ([ansible_sno_1, ansible_sno_2, _ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2] | unique | list | sort)
          no_log: true

    # -------------------------------------------------------------------------
    # SETUP (nd_resource_manager only): the target forms a PHYSICAL vPC pair itself (ND 4.3 rejects a virtual
    # peer-link on N9K-C9300v). Before it starts, remember whether the pair already existed and give ND time to
    # report the leaf peer-link as present (the prerequisite admin-ups its two ports just before this).
    - name: "[{{ test_module }}] SETUP - vPC pair and peer-link readiness"
      when: test_module == 'nd_resource_manager' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the target runs"
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_rm_pairs_before

        - name: "[{{ test_module }}] SETUP - record whether the pair pre-existed"
          ansible.builtin.set_fact:
            _ndp_rm_pair_preexisting: >-
              {{ ((_ndp_rm_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_rm_pairs_before.vpc_pairs | default([])))
                 | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                 | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2])
                 | selectattr('peerSwitchId', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
                 or ((_ndp_rm_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_rm_pairs_before.vpc_pairs | default([])))
                 | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                 | selectattr('switch_id', 'in', [ansible_sno_1, ansible_sno_2])
                 | selectattr('peer_switch_id', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0 }}

        - name: "[{{ test_module }}] SETUP - wait until ND reports the physical peer-link as present"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
          register: _ndp_rm_peer_link
          retries: 12
          delay: 15
          until: >-
            {{ (_ndp_rm_peer_link.current.links | default([]))
               | selectattr('srcSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
               | selectattr('dstSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
               | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
          failed_when: false
          no_log: true
          when: not (_ndp_rm_pair_preexisting | bool)

        - name: "[{{ test_module }}] SETUP - peer-link readiness verdict"
          ansible.builtin.debug:
            msg: >-
              NDP_RM_PEER_LINK {{ 'present' if ((_ndp_rm_peer_link.current.links | default([]))
              | selectattr('linkPresent', 'equalto', true) | list | length > 0) else 'NOT reported present by ND (the target may fail creating the pair)' }}
              (pair pre-existing: {{ _ndp_rm_pair_preexisting }}).
          when: not (_ndp_rm_pair_preexisting | bool)

    # -------------------------------------------------------------------------
    # SETUP (nd_manage_tor only, read-only): the reduced ToR test pairs vxlan_leaf_3 (given the ToR role by the RUN block)
    # with vxlan_leaf_4 (leaf) in the round's primary fabric. Serials come live from ND by management IP, so a rebuilt switch
    # with a new serial still resolves. Nothing is changed here: this only proves the two switches are present, normal and
    # not vPC paired, and records what a later restore must put back.
    - name: "[{{ test_module }}] SETUP - precheck the reduced ToR topology"
      when: test_module == 'nd_manage_tor' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - resolve the ToR and leaf management IPs from the roster"
          ansible.builtin.set_fact:
            _ndp_tor_ip: >-
              {{ ((nd_test_fabric_switches[ansible_it_fabric] | selectattr('name', 'equalto', nd_tor_switch_name)
                   | map(attribute='seed_ip') | list) + ['']) | first }}
            _ndp_leaf_ip: >-
              {{ ((nd_test_fabric_switches[ansible_it_fabric] | selectattr('name', 'equalto', nd_tor_leaf_name)
                   | map(attribute='seed_ip') | list) + ['']) | first }}
            _ndp_tor_role_restore: >-
              {{ ((nd_test_fabric_switches[ansible_it_fabric] | selectattr('name', 'equalto', nd_tor_switch_name)
                   | map(attribute='role') | list) + ['leaf']) | first }}

        - name: "[{{ test_module }}] SETUP - read the live switches of the fabric"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
          register: _ndp_tor_live
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - resolve the live ToR and leaf switches by management IP"
          ansible.builtin.set_fact:
            _ndp_tor_sw: >-
              {{ (((_ndp_tor_live.current.switches | default([])) | selectattr('fabricManagementIp', 'equalto', _ndp_tor_ip)
                   | list) + [{}]) | first }}
            _ndp_tor_leaf_sw: >-
              {{ (((_ndp_tor_live.current.switches | default([])) | selectattr('fabricManagementIp', 'equalto', _ndp_leaf_ip)
                   | list) + [{}]) | first }}

        - name: "[{{ test_module }}] SETUP - record serials, roles and modes"
          ansible.builtin.set_fact:
            _ndp_tor_serial: "{{ _ndp_tor_sw.serialNumber | default(_ndp_tor_sw.switchId | default('')) }}"
            _ndp_leaf_serial: "{{ _ndp_tor_leaf_sw.serialNumber | default(_ndp_tor_leaf_sw.switchId | default('')) }}"
            _ndp_tor_role_before: "{{ _ndp_tor_sw.switchRole | default('') | lower }}"
            _ndp_leaf_role_before: "{{ _ndp_tor_leaf_sw.switchRole | default('') | lower }}"
            _ndp_tor_mode: "{{ (_ndp_tor_sw.additionalData | default({})).systemMode | default('') | lower }}"
            _ndp_leaf_mode: "{{ (_ndp_tor_leaf_sw.additionalData | default({})).systemMode | default('') | lower }}"

        - name: "[{{ test_module }}] SETUP - require both switches present, normal and in the expected roles"
          ansible.builtin.assert:
            that:
              - _ndp_tor_ip | length > 0
              - _ndp_leaf_ip | length > 0
              - _ndp_tor_serial | length > 0
              - _ndp_leaf_serial | length > 0
              - _ndp_tor_serial != _ndp_leaf_serial
              - _ndp_tor_role_before in ['leaf', 'tor']
              - _ndp_leaf_role_before == 'leaf'
              - _ndp_tor_mode == 'normal'
              - _ndp_leaf_mode == 'normal'
            fail_msg: >-
              NDP_TOR_PRECHECK_FAIL: the reduced ToR test needs {{ nd_tor_switch_name }} ({{ _ndp_tor_ip }}, serial
              '{{ _ndp_tor_serial }}', role '{{ _ndp_tor_role_before }}', mode '{{ _ndp_tor_mode }}') and {{ nd_tor_leaf_name }}
              ({{ _ndp_leaf_ip }}, serial '{{ _ndp_leaf_serial }}', role '{{ _ndp_leaf_role_before }}', mode '{{ _ndp_leaf_mode }}')
              in {{ ansible_it_fabric }}, both in normal mode, the first a leaf or tor and the second a leaf.
            success_msg: >-
              NDP_TOR_PRECHECK_OK {{ nd_tor_switch_name }}={{ _ndp_tor_serial }} (role {{ _ndp_tor_role_before }}) pairs with
              {{ nd_tor_leaf_name }}={{ _ndp_leaf_serial }} (role {{ _ndp_leaf_role_before }}) in {{ ansible_it_fabric }}.

        - name: "[{{ test_module }}] SETUP - read the vPC pairs of the fabric"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/vpcPairs"
          register: _ndp_tor_pairs
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - require neither switch to be vPC paired"
          ansible.builtin.assert:
            that:
              - (_ndp_tor_pairs.current.vpcPairs | default([])
                 | selectattr('switchId', 'in', [_ndp_tor_serial, _ndp_leaf_serial]) | list | length) == 0
              - (_ndp_tor_pairs.current.vpcPairs | default([])
                 | selectattr('peerSwitchId', 'in', [_ndp_tor_serial, _ndp_leaf_serial]) | list | length) == 0
            fail_msg: >-
              NDP_TOR_PRECHECK_FAIL: {{ nd_tor_switch_name }} or {{ nd_tor_leaf_name }} is still in a vPC pair
              ({{ _ndp_tor_pairs.current.vpcPairs | default([]) }}); ND rejects a single ToR association for a paired ToR.

        - name: "[{{ test_module }}] SETUP - read the existing ToR associations"
          cisco.nd.nd_manage_tor:
            fabric_name: "{{ ansible_it_fabric }}"
            state: gathered
          register: _ndp_tor_assoc_before

        # Associations that involve neither switch belong to someone else; the destructive overridden step is skipped then.
        - name: "[{{ test_module }}] SETUP - count the associations this test does not own"
          ansible.builtin.set_fact:
            _ndp_tor_foreign_count: >-
              {{ (_ndp_tor_assoc_before.after | default([]))
                 | rejectattr('access_or_tor_switch_id', 'in', [_ndp_tor_serial, _ndp_leaf_serial])
                 | rejectattr('aggregation_or_leaf_switch_id', 'in', [_ndp_tor_serial, _ndp_leaf_serial])
                 | list | length }}

    # -------------------------------------------------------------------------
    # SETUP (nd_local_user only, read-only): the target's overridden step deletes every controller local user that is not in its
    # config, and its first asserts expect admin to be the only user. Read the local users first and start the target only while the
    # logins are admin plus, at most, leftovers of the target's own three test logins (it deletes those itself before it starts).
    # Anything else ends the play with the skip marker before a single account is touched, so no foreign login is ever removed.
    # The skip reason must not contain an apostrophe, and ends with a Read pointer: the Jenkins skip-note parser cuts the note at the
    # first apostrophe or at the first ' Read `', whichever comes first.
    - name: "[{{ test_module }}] SETUP - read the controller local users"
      cisco.nd.nd_rest:
        method: get
        path: /api/v1/infra/aaa/localUsers
      register: _ndp_lu_live
      check_mode: false
      no_log: true
      when: test_module == 'nd_local_user' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - find the logins this test does not own"
      ansible.builtin.set_fact:
        _ndp_lu_logins: "{{ (_ndp_lu_live.current.localusers | default([])) | map(attribute='loginID') | list }}"
        _ndp_lu_foreign: >-
          {{ (_ndp_lu_live.current.localusers | default([])) | map(attribute='loginID')
             | reject('in', ['admin', 'ansible_local_user', 'ansible_local_user_2', 'ansible_local_user_3']) | list }}
      when: test_module == 'nd_local_user' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - report nd_local_user as skipped when other local users exist"
      ansible.builtin.debug:
        msg: >-
          NDP_MODULE_SKIPPED [integration.{{ test_module }}]: {{
          ('local users besides admin exist (' ~ (_ndp_lu_foreign | join(', ')) ~ '); the overridden step of the target would delete them')
          if (_ndp_lu_foreign | length > 0)
          else 'the controller has no local user named admin, which the target expects' }}. Read `SETUP - read the controller local users` in run_integration_module.yaml for the guard.
      when:
        - test_module == 'nd_local_user'
        - not (nd_prerequisite_only | default(false) | bool)
        - (_ndp_lu_foreign | length > 0) or ('admin' not in _ndp_lu_logins)

    - name: "[{{ test_module }}] SETUP - end the play cleanly before any local user is touched"
      ansible.builtin.meta: end_play
      when:
        - test_module == 'nd_local_user'
        - not (nd_prerequisite_only | default(false) | bool)
        - (_ndp_lu_foreign | length > 0) or ('admin' not in _ndp_lu_logins)

    # -------------------------------------------------------------------------
    # SETUP (nd_maintenance_mode only, read-only): the target moves two switches to maintenance and back. It stops before any change when
    # a switch is in migration mode and when an IP is not in the fabric, so prove both switches are present and not migrating first.
    - name: "[{{ test_module }}] SETUP - precheck the maintenance-mode switches"
      when: test_module == 'nd_maintenance_mode' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - read the live switches for the maintenance-mode precheck"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_live
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - select the two switches by management IP"
          ansible.builtin.set_fact:
            _ndp_mm_switches: >-
              {{ (_ndp_mm_live.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b]) | list }}

        - name: "[{{ test_module }}] SETUP - require both switches present and not migrating"
          ansible.builtin.assert:
            that:
              - _ndp_mm_switches | length == 2
              - (_ndp_mm_switches | map(attribute='additionalData.systemMode', default='') | map('lower') | select('equalto', 'migration') | list | length) == 0
              - (_ndp_mm_switches | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | select('equalto', 'migration') | list | length) == 0
            fail_msg: >-
              NDP_MAINT_PRECHECK_FAIL: nd_maintenance_mode needs {{ nd_test_maintenance_mode_switch_ip_a }} and
              {{ nd_test_maintenance_mode_switch_ip_b }} in {{ nd_test_maintenance_mode_fabric_name }}, neither in migration mode; found
              {{ _ndp_mm_switches | map(attribute='fabricManagementIp') | list }} with system modes
              {{ _ndp_mm_switches | map(attribute='additionalData.systemMode', default='') | list }} and intended modes
              {{ _ndp_mm_switches | map(attribute='additionalData.intendedSystemMode', default='') | list }}.
            success_msg: >-
              NDP_MAINT_PRECHECK_OK {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} are present in
              {{ nd_test_maintenance_mode_fabric_name }} and not migrating; the target forces both to normal first.

    # -------------------------------------------------------------------------
    # SETUP (nd_fabric_update_group only, read-only): the target's overridden and auto-assign steps act on EVERY update group of the
    # fabric, and attaching a switch moves it out of any group it belongs to. ND keeps a built-in default group literally named None
    # (the module ignores it). Start the target only while no other group exists (leftovers of its own two groups are fine, it
    # deletes them first); otherwise end the play with the skip marker before anything is changed. Every non-default group that
    # exists after the target ran was therefore created by it, which is what the CLEANUP relies on.
    - name: "[{{ test_module }}] SETUP - precheck the update-group topology"
      when: test_module == 'nd_fabric_update_group' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - read the live switches for the update-group precheck"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/switches"
          register: _ndp_ug_live
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - read the existing update groups"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/updateGroups"
          register: _ndp_ug_groups
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - find the test switches and the groups this test does not own"
          ansible.builtin.set_fact:
            _ndp_ug_present: >-
              {{ (_ndp_ug_live.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_update_switch_a, nd_test_update_switch_b, nd_test_update_switch_c])
                 | map(attribute='fabricManagementIp') | list }}
            _ndp_ug_foreign: >-
              {{ (_ndp_ug_groups.current.updateGroups | default([]))
                 | map(attribute='updateGroupName', default='')
                 | reject('in', ['None', '', 'ansible_leaf_group', 'ansible_spine_group']) | list }}

        - name: "[{{ test_module }}] SETUP - require the three test switches in the fabric"
          ansible.builtin.assert:
            that:
              - _ndp_ug_present | length == 3
            fail_msg: >-
              NDP_UPDATE_GROUP_PRECHECK_FAIL: nd_fabric_update_group needs {{ nd_test_update_switch_a }}, {{ nd_test_update_switch_b }} and
              {{ nd_test_update_switch_c }} in {{ nd_test_fabric_name }}; found {{ _ndp_ug_present }}.
            success_msg: >-
              NDP_UPDATE_GROUP_PRECHECK_OK {{ _ndp_ug_present }} are present in {{ nd_test_fabric_name }}; foreign update groups:
              {{ _ndp_ug_foreign }}.

        - name: "[{{ test_module }}] SETUP - report nd_fabric_update_group as skipped when other update groups exist"
          ansible.builtin.debug:
            msg: >-
              NDP_MODULE_SKIPPED [integration.{{ test_module }}]: update groups besides the default one exist
              ({{ _ndp_ug_foreign | join(', ') }}); the overridden and auto-assign steps of the target would delete or regroup them.
              Read `SETUP - precheck the update-group topology` in run_integration_module.yaml for the guard.
          when: _ndp_ug_foreign | length > 0

        - name: "[{{ test_module }}] SETUP - end the play cleanly before any update group is touched"
          ansible.builtin.meta: end_play
          when: _ndp_ug_foreign | length > 0

    # -------------------------------------------------------------------------
    # SETUP: run the target's own setup/prepare file FIRST, but only when the
    # target does not already wire it (main.yaml or a test-case importing it).
    # Best-effort so a setup expecting main.yaml-scoped facts cannot abort the
    # suite; idempotent pre-clean semantics make an extra up-front run safe.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - run target setup/prepare first (names vary)"
      ansible.builtin.include_role:
        name: "{{ test_module }}"
        tasks_from: "{{ _ndp_setup_file }}"
      ignore_errors: true
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - _ndp_setup_file | default('') | length > 0
        - (_ndp_setup_importers.matched | default(0)) | int == 0

    # -------------------------------------------------------------------------
    # RUN: the module's full suite. A failure here fails the PLAY (so the recap
    # reports failed>0), while the always-cleanup still resets the fabric.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] RUN full integration suite (all test cases)"
      block:
        - name: "[{{ test_module }}] validate selected test groups"
          ansible.builtin.assert:
            that:
              - test_groups == ['standalone']
              - nd_network_test_topology == 'standalone'
              - nd_vrf_test_topology == 'standalone'
            fail_msg: "Only standalone network and VRF integration tests are enabled."
          when: test_module in ['nd_manage_networks', 'nd_manage_vrfs']

        - name: "[{{ test_module }}] include selected network/VRF groups"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
          vars:
            testcase: "*"
            nd_network_test_topology: "{{ test_group }}"
            nd_vrf_test_topology: "{{ test_group }}"
          loop: "{{ test_groups }}"
          loop_control:
            loop_var: test_group
          when: test_module in ['nd_manage_networks', 'nd_manage_vrfs']

        - name: "[{{ test_module }}] include collection target (all configured cases)"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
          when: test_module not in ['nd_manage_networks', 'nd_manage_vrfs', 'nd_manage_tor']

        # nd_manage_tor: the pipeline-owned reduced test. ND 4.3 records an association (intent only, no save or deploy) even
        # while it reports the two switches "not connected" (live 2026-10-13), so the single 1:1 topology needs no extra
        # cabling or admin-up: vxlan_leaf_3 takes the ToR role, pairs with vxlan_leaf_4, and the CLEANUP below puts everything
        # back. The cases mirror the single-association half of the upstream target (create, update, drift, delete, gathered).
        - name: "[{{ test_module }}] reduced ToR pairing test"
          when: test_module == 'nd_manage_tor'
          block:
            # Recorded first so the CLEANUP restores the role even when the change below half-fails.
            - name: "[{{ test_module }}] RUN - record the role change attempt"
              ansible.builtin.set_fact:
                _ndp_tor_flip_attempted: true

            # nd_rest only parses 200/201/202/204 bodies and changeRoles answers 207, so the call may report a parse error
            # after ND already acted; the role is verified by reading it back.
            - name: "[{{ test_module }}] RUN - change {{ nd_tor_switch_name }} to the tor role"
              cisco.nd.nd_rest:
                method: post
                path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switchActions/changeRoles"
                content:
                  switchRoles:
                    - switchId: "{{ _ndp_tor_serial }}"
                      role: tor
              failed_when: false
              no_log: true
              when: _ndp_tor_role_before != 'tor'

            - name: "[{{ test_module }}] RUN - read the role back"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
              register: _ndp_tor_after_flip
              retries: 6
              delay: 10
              until: >-
                ((_ndp_tor_after_flip.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'equalto', _ndp_tor_ip)
                 | map(attribute='switchRole') | map('lower') | list) == ['tor']
              failed_when: false
              check_mode: false
              no_log: true

            - name: "[{{ test_module }}] RUN - require the tor role"
              ansible.builtin.assert:
                that:
                  - >-
                    ((_ndp_tor_after_flip.current.switches | default([]))
                     | selectattr('fabricManagementIp', 'equalto', _ndp_tor_ip)
                     | map(attribute='switchRole') | map('lower') | list) == ['tor']
                fail_msg: >-
                  NDP_TOR_ROLE_FLIP_FAIL: ND did not report {{ nd_tor_switch_name }} ({{ _ndp_tor_serial }}) with the tor role
                  after changeRoles; the CLEANUP restores '{{ _ndp_tor_role_restore }}'.
                success_msg: "NDP_TOR_ROLE_OK {{ nd_tor_switch_name }} ({{ _ndp_tor_serial }}) now holds the tor role."

            # TC0: start from a clean association state (best effort).
            - name: "[{{ test_module }}] TC0 - clear any leftover test association"
              cisco.nd.nd_manage_tor: &ndp_tor_delete
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                state: deleted
              ignore_errors: true

            # TC1: gathered is read-only and starts empty.
            - name: "[{{ test_module }}] TC1 - gather the fabric's associations"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                state: gathered
              register: _tor_gathered_0

            - name: "[{{ test_module }}] TC1 - gathered is read-only and the test pair is absent"
              ansible.builtin.assert:
                that:
                  - _tor_gathered_0 is not changed
                  - _tor_gathered_0.before == _tor_gathered_0.after
                  - (_tor_gathered_0.after | selectattr('access_or_tor_switch_id', 'equalto', _ndp_tor_serial) | list | length) == 0

            # TC2: create (check mode, real, idempotent) with explicit port-channel ids.
            - name: "[{{ test_module }}] TC2 - associate the ToR with the leaf (merged, check mode)"
              cisco.nd.nd_manage_tor: &ndp_tor_create
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                    access_or_tor_port_channel_id: 501
                    aggregation_or_leaf_port_channel_id: 502
                state: merged
              check_mode: true
              register: _tor_cm_create

            - name: "[{{ test_module }}] TC2 - associate the ToR with the leaf (merged)"
              cisco.nd.nd_manage_tor: *ndp_tor_create
              register: _tor_nm_create

            - name: "[{{ test_module }}] TC2 - associate the ToR with the leaf (merged, idempotency)"
              cisco.nd.nd_manage_tor: *ndp_tor_create
              register: _tor_nm_create_again

            - name: "[{{ test_module }}] TC2 - create asserts"
              ansible.builtin.assert:
                that:
                  - _tor_cm_create is changed
                  - _tor_nm_create is changed
                  - _tor_nm_create_again is not changed

            # TC3: config_actions validation fails before any API call.
            - name: "[{{ test_module }}] TC3 - deploy without save is rejected"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                    access_or_tor_port_channel_id: 501
                    aggregation_or_leaf_port_channel_id: 502
                state: merged
                config_actions:
                  save: false
                  deploy: true
              check_mode: true
              register: _tor_bad_actions
              ignore_errors: true

            - name: "[{{ test_module }}] TC3 - config_actions asserts"
              ansible.builtin.assert:
                that:
                  - _tor_bad_actions is failed
                  - "'config_actions.deploy=true requires config_actions.save=true' in (_tor_bad_actions.msg | default(''))"

            # TC4: gathered reports the association with its port channels.
            - name: "[{{ test_module }}] TC4 - gather the associations of the leaf"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                state: gathered
              register: _tor_gathered_1

            - name: "[{{ test_module }}] TC4 - gathered asserts"
              ansible.builtin.assert:
                that:
                  - _tor_gathered_1 is not changed
                  - (_tor_gathered_1.after | selectattr('access_or_tor_switch_id', 'equalto', _ndp_tor_serial)
                     | selectattr('aggregation_or_leaf_switch_id', 'equalto', _ndp_leaf_serial) | list | length) == 1
                  - (_tor_gathered_1.after | selectattr('access_or_tor_switch_id', 'equalto', _ndp_tor_serial)
                     | map(attribute='access_or_tor_port_channel_id') | list) == [501]
                  - (_tor_gathered_1.after | selectattr('access_or_tor_switch_id', 'equalto', _ndp_tor_serial)
                     | map(attribute='aggregation_or_leaf_port_channel_id') | list) == [502]

            # TC5: update the port channels (check mode, real, idempotent).
            - name: "[{{ test_module }}] TC5 - change the port channels (merged, check mode)"
              cisco.nd.nd_manage_tor: &ndp_tor_update
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                    access_or_tor_port_channel_id: 511
                    aggregation_or_leaf_port_channel_id: 512
                state: merged
              check_mode: true
              register: _tor_cm_update

            - name: "[{{ test_module }}] TC5 - change the port channels (merged)"
              cisco.nd.nd_manage_tor: *ndp_tor_update
              register: _tor_nm_update

            - name: "[{{ test_module }}] TC5 - change the port channels (merged, idempotency)"
              cisco.nd.nd_manage_tor: *ndp_tor_update
              register: _tor_nm_update_again

            - name: "[{{ test_module }}] TC5 - update asserts"
              ansible.builtin.assert:
                that:
                  - _tor_cm_update is changed
                  - _tor_nm_update is changed
                  - _tor_nm_update_again is not changed

            # TC6: ND allocates and echoes port-channel ids; only an id the config states explicitly may count as drift.
            - name: "[{{ test_module }}] TC6 - omit the port channels (merged, ND keeps its allocation)"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                state: merged
              register: _tor_nm_omit

            # overridden would remove associations this test does not own, so it only runs on a fabric without any.
            - name: "[{{ test_module }}] TC6 - omit the port channels (overridden, reverse-diff regression)"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                state: overridden
              register: _tor_nm_omit_overridden
              when: (_ndp_tor_foreign_count | default(1) | int) == 0

            - name: "[{{ test_module }}] TC6 - a different explicit port channel is drift"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                config:
                  - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                    aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
                    access_or_tor_port_channel_id: 521
                    aggregation_or_leaf_port_channel_id: 522
                state: merged
              register: _tor_nm_drift

            - name: "[{{ test_module }}] TC6 - drift asserts"
              ansible.builtin.assert:
                that:
                  - _tor_nm_omit is not changed
                  - (_tor_nm_omit_overridden is skipped) or (_tor_nm_omit_overridden is not changed)
                  - _tor_nm_drift is changed

            # TC7: delete (check mode, real, idempotent).
            - name: "[{{ test_module }}] TC7 - disassociate (deleted, check mode)"
              cisco.nd.nd_manage_tor: *ndp_tor_delete
              check_mode: true
              register: _tor_cm_delete

            - name: "[{{ test_module }}] TC7 - disassociate (deleted)"
              cisco.nd.nd_manage_tor: *ndp_tor_delete
              register: _tor_nm_delete

            - name: "[{{ test_module }}] TC7 - disassociate (deleted, idempotency)"
              cisco.nd.nd_manage_tor: *ndp_tor_delete
              register: _tor_nm_delete_again

            - name: "[{{ test_module }}] TC7 - delete asserts"
              ansible.builtin.assert:
                that:
                  - _tor_cm_delete is changed
                  - _tor_nm_delete is changed
                  - _tor_nm_delete_again is not changed

            # TC8: nothing of the test pair is left.
            - name: "[{{ test_module }}] TC8 - gather the associations after the deletion"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ ansible_it_fabric }}"
                state: gathered
              register: _tor_gathered_2

            - name: "[{{ test_module }}] TC8 - gathered asserts"
              ansible.builtin.assert:
                that:
                  - _tor_gathered_2 is not changed
                  - (_tor_gathered_2.after | selectattr('access_or_tor_switch_id', 'equalto', _ndp_tor_serial) | list | length) == 0
      when: not (nd_prerequisite_only | default(false) | bool)
      always:
        - name: "[{{ test_module }}] CLEANUP - post-clean (required)"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
            tasks_from: "{{ _ndp_cleanup_file }}"
          when:
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_cleanup_file | default('') | length > 0

        # A failed l3out run can leave its test L3Outs behind; ND refuses to delete the planned links or route
        # maps they reference, so remove them first (best effort, never masks the test result).
        - name: "[{{ test_module }}] CLEANUP - remove leftover test L3Outs and the route maps this run created"
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)
          block:
            - name: "[{{ test_module }}] CLEANUP - delete leftover test L3Outs"
              cisco.nd.nd_manage_l3out:
                fabric_name: "{{ nd_test_fabric_name }}"
                state: deleted
                config:
                  - name: "{{ test_l3out_bgp_name | default('ansible-test-l3out-bgp') }}"
                  - name: "{{ test_l3out_static_name | default('ansible-test-l3out-static') }}"
                  - name: "{{ test_l3out_svi_name | default('ansible-test-l3out-svi') }}"
              ignore_errors: true

            - name: "[{{ test_module }}] CLEANUP - delete the route maps created for this run"
              cisco.nd.nd_manage_route_map:
                fabric_name: "{{ nd_test_fabric1_name }}"
                config: "{{ _ndp_l3out_route_maps_created | map('community.general.dict_kv', 'name') | list }}"
                state: deleted
              ignore_errors: true
              when: _ndp_l3out_route_maps_created | default([]) | length > 0

        # The target leaves the pair it created ("create once"); the destructive nd_manage_switches module runs
        # later in the same job and ND refuses to remove switches that are still paired, so unpair what this
        # run created. A pair that already existed is never touched.
        - name: "[{{ test_module }}] CLEANUP - unpair the vPC pair this run created"
          when:
            - test_module == 'nd_resource_manager'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_rm_pair_preexisting is defined
            - not (_ndp_rm_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ ansible_sno_1 }}"
                peer2_switch_id: "{{ ansible_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # Same reason for the vPC interface targets: the runner formed the pair, so the runner removes it (a pair that
        # already existed is never touched).
        - name: "[{{ test_module }}] CLEANUP - unpair the vPC pair the runner formed for the vPC interface target"
          when:
            - test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_vpcif_pair_preexisting is defined
            - not (_ndp_vpcif_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ ansible_sno_1 }}"
                peer2_switch_id: "{{ ansible_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # The second (leaf_3/leaf_4) pair the runner formed for the multi-pair scenario is removed the same way.
        - name: "[{{ test_module }}] CLEANUP - unpair the second vPC pair the runner formed for the vPC interface target"
          when:
            - test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_vpcif2_pair_preexisting is defined
            - not (_ndp_vpcif2_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ _ndp_vpcif2_sno_1 }}"
                peer2_switch_id: "{{ _ndp_vpcif2_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # nd_local_user: the target deletes its own logins at the end, but an aborted run leaves them behind. The precheck proved
        # that admin was the only other account, so the three test logins are all there is to remove (best effort, never masks the
        # test result). Without a passed precheck nothing is deleted.
        - name: "[{{ test_module }}] CLEANUP - delete the test local users this run may have left"
          cisco.nd.nd_local_user:
            config:
              - login_id: ansible_local_user
              - login_id: ansible_local_user_2
              - login_id: ansible_local_user_3
            state: deleted
          ignore_errors: true
          when:
            - test_module == 'nd_local_user'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_lu_foreign is defined
            - _ndp_lu_foreign | length == 0

        # nd_fabric_update_group: the target deletes its groups itself, but an abort between its auto-assign and delete steps leaves
        # role-based groups with generated names behind. The precheck proved the fabric held no other group (besides ND's built-in
        # default named None), so every group that exists now was created by this run. Without a passed precheck nothing is deleted.
        - name: "[{{ test_module }}] CLEANUP - read the update groups left in the fabric"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/updateGroups"
          register: _ndp_ug_after
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_fabric_update_group'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_ug_foreign is defined
            - _ndp_ug_foreign | length == 0

        - name: "[{{ test_module }}] CLEANUP - delete every update group this run created"
          cisco.nd.nd_fabric_update_group:
            fabric_name: "{{ nd_test_fabric_name }}"
            config: >-
              {{ _ndp_ug_leftover | map('community.general.dict_kv', 'update_group_name') | list }}
            state: deleted
          ignore_errors: true
          vars:
            _ndp_ug_leftover: >-
              {{ (_ndp_ug_after.current.updateGroups | default([]))
                 | map(attribute='updateGroupName', default='') | reject('in', ['None', '']) | list }}
          when:
            - test_module == 'nd_fabric_update_group'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_ug_foreign is defined
            - _ndp_ug_foreign | length == 0
            - (_ndp_ug_after.current.updateGroups | default([]) | map(attribute='updateGroupName', default='') | reject('in', ['None', '']) | list | length) > 0

        # nd_maintenance_mode: the target puts both switches back to normal mode itself (its teardown ran as the post-clean above), but
        # only the INTENT was toggled, so ND may keep reporting them as not in sync until a configuration save. Read both back, and
        # recalculate plus deploy only when they are not both in sync (the deploy then has nothing to push). A mode that cannot be
        # restored fails the module loudly; the next switch guard also heals it.
        - name: "[{{ test_module }}] CLEANUP - read both switches back after the mode restore"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_restored
          retries: 6
          delay: 10
          until: >-
            ((_ndp_mm_restored.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.systemMode', default='') | map('lower') | list) == ['normal', 'normal']
            and
            ((_ndp_mm_restored.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | list) == ['normal', 'normal']
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

        - name: "[{{ test_module }}] CLEANUP - record the configuration sync state after the mode restore"
          ansible.builtin.set_fact:
            _ndp_mm_sync: >-
              {{ (_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.configSyncStatus', default='') | list }}
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

        - name: "[{{ test_module }}] CLEANUP - save the fabric configuration so ND reports the maintenance-mode switches in sync again"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/actions/configSave"
            content: {}
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        # switchActions/deploy answers 207 ("No Commands to execute"), which nd_rest cannot parse; the outcome is read from state.
        - name: "[{{ test_module }}] CLEANUP - push the pending maintenance-mode switch state (nothing to push is expected)"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switchActions/deploy"
            content:
              switchIds: "{{ _ndp_mm_switches | map(attribute='switchId') | list }}"
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        - name: "[{{ test_module }}] CLEANUP - wait for both maintenance-mode switches to report in sync"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_synced
          retries: 12
          delay: 10
          until: >-
            ((_ndp_mm_synced.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.configSyncStatus', default='') | list) == ['inSync', 'inSync']
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        - name: "[{{ test_module }}] CLEANUP - report the mode restore"
          ansible.builtin.assert:
            that:
              - >-
                ((_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.systemMode', default='') | map('lower') | list) == ['normal', 'normal']
              - >-
                ((_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | list) == ['normal', 'normal']
            fail_msg: >-
              NDP_MAINT_RESTORE_FAIL: {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} do not both
              report normal system and intended modes after the test; the next switch guard heals them.
            success_msg: >-
              NDP_MAINT_RESTORE_OK {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} are back in
              normal mode; sync before recalculation {{ _ndp_mm_sync | default([]) }}.
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

        # nd_manage_tor: undo what the reduced test changed. The association is removed first (best effort), then the ToR
        # switch gets its roster role back and the fabric is recalculated so ND reports both switches in sync again (a role
        # change plus association leaves them 'pending' until a config save; the deploy then finds nothing to push). A role
        # that cannot be restored fails the module loudly; the next switch guard also heals it from the roster.
        - name: "[{{ test_module }}] CLEANUP - remove the ToR association this run may have left"
          cisco.nd.nd_manage_tor:
            fabric_name: "{{ ansible_it_fabric }}"
            config:
              - access_or_tor_switch: "{{ _ndp_tor_serial }}"
                aggregation_or_leaf_switch: "{{ _ndp_leaf_serial }}"
            state: deleted
          ignore_errors: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_serial is defined
            - _ndp_leaf_serial is defined

        - name: "[{{ test_module }}] CLEANUP - give {{ nd_tor_switch_name }} its roster role back"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switchActions/changeRoles"
            content:
              switchRoles:
                - switchId: "{{ _ndp_tor_serial | default('') }}"
                  role: "{{ _ndp_tor_role_restore | default('leaf') }}"
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool

        - name: "[{{ test_module }}] CLEANUP - read the role back"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
          register: _ndp_tor_restored
          retries: 6
          delay: 10
          until: >-
            ((_ndp_tor_restored.current.switches | default([]))
             | selectattr('fabricManagementIp', 'equalto', _ndp_tor_ip)
             | map(attribute='switchRole') | map('lower') | list) == [_ndp_tor_role_restore | default('leaf')]
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool

        - name: "[{{ test_module }}] CLEANUP - recalculate the fabric so ND reports the switches in sync again"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/actions/configSave"
            content: {}
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool

        # switchActions/deploy answers 207 ("No Commands to execute"), which nd_rest cannot parse; the outcome is read from state.
        - name: "[{{ test_module }}] CLEANUP - deploy the two switches (nothing to push is expected)"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switchActions/deploy"
            content:
              switchIds:
                - "{{ _ndp_tor_serial | default('') }}"
                - "{{ _ndp_leaf_serial | default('') }}"
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool

        - name: "[{{ test_module }}] CLEANUP - wait until both switches report in sync"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
          register: _ndp_tor_synced
          retries: 12
          delay: 10
          until: >-
            ((_ndp_tor_synced.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [_ndp_tor_ip, _ndp_leaf_ip])
             | map(attribute='additionalData.configSyncStatus', default='') | list) == ['inSync', 'inSync']
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool

        - name: "[{{ test_module }}] CLEANUP - report the restore"
          ansible.builtin.assert:
            that:
              - >-
                ((_ndp_tor_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'equalto', _ndp_tor_ip)
                 | map(attribute='switchRole') | map('lower') | list) == [_ndp_tor_role_restore | default('leaf')]
            fail_msg: >-
              NDP_TOR_RESTORE_FAIL: {{ nd_tor_switch_name }} ({{ _ndp_tor_ip }}) does not report the role
              '{{ _ndp_tor_role_restore | default('leaf') }}' after the test; the next switch guard heals it from the roster.
            success_msg: >-
              NDP_TOR_RESTORE_OK {{ nd_tor_switch_name }} holds '{{ _ndp_tor_role_restore | default('leaf') }}' again;
              sync {{ ((_ndp_tor_synced.current.switches | default([]))
              | selectattr('fabricManagementIp', 'in', [_ndp_tor_ip, _ndp_leaf_ip])
              | map(attribute='additionalData.configSyncStatus', default='') | list) }}.
          when:
            - test_module == 'nd_manage_tor'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_tor_flip_attempted | default(false) | bool
  handlers:
    - name: Restore prerequisite interface changes
      ansible.builtin.include_tasks: "{{ playbook_dir }}/nd_prerequisite/nd_prerequisite_restore.yaml"
