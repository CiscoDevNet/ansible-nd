---
# =============================================================================
# Single-module integration-test runner for the cisco.nd collection.
#
# Runs the FULL integration suite (every test-case file, testcase='*') for ONE
# module, selected via the extra var `test_module`. The Jenkins pipeline loops
# over INTEGRATION_MODULES and invokes this playbook ONCE PER MODULE, so each
# module produces its OWN PLAY RECAP (ok / failed / skipped) and its OWN
# duration -- one failing module never hides another's results.
#
# HOW IT WORKS
#   Every integration target (tests/integration/targets/<module>) is a role
#   whose tasks/main.yaml discovers tests/<testcase>.yaml. With testcase='*' it
#   runs the entire suite for that module; each test file self-cleans via the
#   target's tasks/cleanup.yaml (or, for every interface target, its final
#   tasks/deleted.yaml state). A pre-clean and an always-cleanup keep the
#   fabric baseline clean regardless of pass/fail.
#
# PREREQUISITES
#   1. roles_path must include the collection's integration targets, e.g.
#        .../cisco/nd/tests/integration/targets   (set in consul/ansible.cfg).
#   2. Supply the standard integration vars (fabric_name, switch_serial_1..3)
#      via Jenkins extra vars or edit the vars below.
#   3. Inventory must define the `nd` group/host (reuse ../consul/inventory.yaml).
#
# RUN
#   ansible-playbook -i inventory.yaml run_integration_module.yaml -e test_module=nd_manage_policy
# =============================================================================

- name: "cisco.nd - integration suite for {{ test_module }}"
  hosts: nd
  gather_facts: false
  force_handlers: true
  vars_files:
    - "{{ playbook_dir }}/integration_config.yml"
  vars:
    nd_prerequisite:
      profile: "integration.{{ test_module }}"
    nd_prerequisite_assets_dir: "{{ playbook_dir }}"
    nd_prerequisite_wrapper_path: "{{ playbook_dir }}/nd_prerequisite/nd_prerequisite_wrapper.yaml"
    # Best-effort prerequisite failures are reported separately. The L3Out fixture
    # has its own admission check inside the run block so cleanup still executes.
    nd_prerequisite_continue_on_failure: true
    testcase: "*"                      # every test-case file in the target
    # Select compatible upstream test directories for network/VRF roles.
    # Keep MSD and MCFG absent from this list unless their fixtures exist.
    test_groups: [standalone]
    # Consumed by the integration tests (Jenkins supplies module-specific overrides via -e):
    fabric_name: VXLAN_EVPN_Fabric
    # Device credentials are injected only by Jenkins for the test process. They
    # are intentionally separate from the ND controller credentials in inventory.
    switch_username: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_USERNAME') }}"
    switch_password: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_PASSWORD') }}"
    # ansible-test normally defines this; alias it here since this harness bypasses ansible-test.
    ansible_it_fabric: "{{ fabric_name }}"
    nd_pipeline_switches_topology: "{{ (nd_test_fabric_switches | default({})).get(fabric_name, []) }}"
    ansible_switch1: 192.0.2.195
    ansible_switch2: 192.0.2.196
    ansible_sno_1: SERIAL00001
    ansible_sno_2: SERIAL00002
    # Second vPC pair (vxlan_leaf_3/vxlan_leaf_4) the nd_interface_vpc_* multi-pair scenario asserts; the runner forms it
    # from the roster entries with these management IPs.
    nd_test_vpc_pair2_peer1_ip: 192.0.2.85
    nd_test_vpc_pair2_peer2_ip: 192.0.2.86
    intf_1_2: Ethernet1/2
    intf_1_3: Ethernet1/3
    intf_1_10: Ethernet1/10
    ansible_network_interface1: Ethernet1/4
    acl_test_fabric: "{{ fabric_name }}"
    nd_test_fabric_name: "{{ fabric_name }}"
    nd_test_fabric1_name: "{{ fabric_name }}"
    nd_test_fabric2_name: External_Connectivity_Fabric
    # nd_manage_links inputs. The registry profile integration.nd_manage_links publishes the live-verified
    # defaults (VXLAN_EVPN_Fabric, vxlan_leaf_2, vxlan_border_1); Jenkins may override them only with -e
    # values that the planner has also verified. Empty here so nothing unverified can ever be assumed.
    nd_test_fabric_numbered: "{{ lookup('env', 'ND_LINKS_FABRIC') | default('', true) }}"
    nd_test_switch_a: "{{ lookup('env', 'ND_LINKS_SWITCH_A') | default('', true) }}"
    nd_test_switch_b: "{{ lookup('env', 'ND_LINKS_SWITCH_B') | default('', true) }}"
    nd_test_switch_a_ip: "{{ lookup('env', 'ND_LINKS_SWITCH_A_IP') | default('') }}"
    nd_test_switch_b_ip: "{{ lookup('env', 'ND_LINKS_SWITCH_B_IP') | default('') }}"
    # nd_maintenance_mode and nd_fabric_update_group run the upstream targets on the idle leaves vxlan_leaf_3 (.85) and vxlan_leaf_4 (.86);
    # the update-group suite adds vxlan_spine_1 (.194) as its third, disjoint switch. Both modules take management IPs and resolve the
    # serials through ND itself. The registry profiles publish the same values as runtime vars, which the prerequisite wrapper sets as
    # facts (they outrank these play vars), so a drifting default can never run the target on switches the planner did not verify.
    nd_test_maintenance_mode_fabric_name: "{{ fabric_name }}"
    nd_test_maintenance_mode_switch_ip_a: 192.0.2.85
    nd_test_maintenance_mode_switch_ip_b: 192.0.2.86
    nd_test_update_switch_a: 192.0.2.85
    nd_test_update_switch_b: 192.0.2.86
    nd_test_update_switch_c: 192.0.2.194
    # switch1 = vxlan_border_1 (SERIAL00004 / .88, role border): cabled to external_edge_1
    # (border_1 Eth1/1 routed <-> edge_1 Eth1/3, probe-confirmed up/up) for the ext_l3_dci_link.
    # Jenkins/run_all_integ.sh pass the same pair via -e; this default keeps a bare manual run
    # on the cabled border endpoint too. (Was leaf_1 while border_1 was uncabled -- build #26
    # proved a plain leaf is rejected: "not a supported role for BGP L3Out".)
    nd_test_switch1_id: SERIAL00004
    nd_test_switch2_id: SERIAL00005
    nd_test_switch1_mgmt_ip: 192.0.2.88
    nd_test_switch2_mgmt_ip: 192.0.2.89
    nd_test_switch1_interface: Ethernet1/1
    nd_test_switch2_interface: Ethernet1/3
    nd_test_switch1_subif: Ethernet1/2.100
    nd_test_switch2_subif: Ethernet1/2.100
    nd_network_test_topology: standalone
    nd_vrf_test_topology: standalone
    # Fabric VRF VLAN range is 2000-2299; the collection default nd_vrf_base_vlan=2800
    # makes every generated VRF VLAN (base+1..base+42) out of range -> deterministic
    # create failure. Pin in-range (yields 2101-2142, clear of smoke 2250 / l3out 2290-2291).
    nd_vrf_base_vlan: 2100
    
    ansible_msd_parent_fabric: ""
    ansible_msd_child_fabric: ""
    ansible_msd_switch1: ""
    ansible_mcfg_parent_fabric: ""
    ansible_mcfg_child_fabric: ""
    ansible_mcfg_switch1: ""
    switch_serial_1: SERIAL00001
    switch_serial_2: SERIAL00002
    # switch_serial_3 MUST be in VXLAN_EVPN_Fabric. SERIAL00005 is external_edge_1
    # (External_Connectivity_Fabric) -> nd_manage_policy_group TC13 400 "Invalid switchId(s)".
    switch_serial_3: SERIAL00003   # vxlan_spine_1 (in-fabric); matches profiles L298
    save: true
    deploy: true
    config_actions_type: switch
  pre_tasks:
    # =====================================================================
    # NDP_TOPOLOGY_PREFLIGHT
    # Greppable required-vs-present topology banner. In ANY build log, search
    # for  NDP_TOPOLOGY_PREFLIGHT  to jump straight to this module's contract:
    #   REQUIRED = switches/roles/fabrics THIS module needs, read live from
    #              nd_prerequisite_profiles.yaml (profiles.<id>.switches and,
    #              when present, profile_executions.<id>).
    #   PRESENT  = switches/roles/fabrics the declared inventory provides
    #              (integration_config.yml -> nd_test_fabric_switches).
    # Any count / membership / role / fabric drift fails fast with the token
    #   NDP_TOPOLOGY_PREFLIGHT_FAIL ;  a clean run prints NDP_TOPOLOGY_PREFLIGHT_OK.
    # =====================================================================
    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] load registry contract"
      ansible.builtin.include_vars:
        file: "{{ nd_prerequisite_registry | default(playbook_dir ~ '/nd_prerequisite_profiles.yaml', true) }}"
        name: _ndp_reg

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] resolve required + present"
      ansible.builtin.set_fact:
        _ndp_profile_id: "integration.{{ test_module }}"
        _ndp_selected_profile: "{{ _ndp_reg.profiles['integration.' ~ test_module] }}"
        _ndp_required_count: "{{ _ndp_reg.profiles['integration.' ~ test_module].switches.required_count }}"
        _ndp_required_members: "{{ _ndp_reg.profiles['integration.' ~ test_module].switches.members }}"
        _ndp_executions: "{{ (_ndp_reg.profile_executions | default({}))['integration.' ~ test_module] | default([]) }}"
        _ndp_present_names: "{{ (nd_test_fabric_switches.VXLAN_EVPN_Fabric + nd_test_fabric_switches.External_Connectivity_Fabric) | map(attribute='name') | list }}"
        _ndp_present_role_by_name: "{{ (nd_test_fabric_switches.VXLAN_EVPN_Fabric + nd_test_fabric_switches.External_Connectivity_Fabric) | items2dict(key_name='name', value_name='role') }}"
        _ndp_fabric_refs: "{{ _ndp_reg.lab.fabrics | list }}"
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] required-vs-present banner"
      ansible.builtin.debug:
        msg: |-
          ==================== NDP_TOPOLOGY_PREFLIGHT :: {{ _ndp_profile_id }} ====================
          REQUIRED  (profiles.{{ _ndp_profile_id }}.switches; required_count={{ _ndp_required_count }})
          {% for m in _ndp_required_members %}
            - {{ m.ref }}  role={{ m.desired_role }}  fabric={{ _ndp_reg.lab.fabrics[m.desired_fabric_ref].name }} ({{ m.desired_fabric_ref }})
          {% else %}
            - (module declares no required switch members)
          {% endfor %}
          {% if _ndp_executions | length > 0 %}
          REQUIRED-EXECUTIONS  (profile_executions.{{ _ndp_profile_id }})
          {% for ex in _ndp_executions %}
            - {{ ex.execution_id }}  fabric={{ ex.fabric_ref }}  switches={{ ex.switch_refs }}  roles={{ ex.desired_roles }}
          {% endfor %}
          {% endif %}
          PRESENT   (integration_config.yml -> nd_test_fabric_switches)
          {% for fab, members in nd_test_fabric_switches.items() %}
            {{ fab }}:
          {% for s in members %}
              - {{ s.name }}  role={{ s.role }}  serial={{ s.serial }}  seed_ip={{ s.seed_ip }}
          {% endfor %}
          {% endfor %}
          ==================== NDP_TOPOLOGY_PREFLIGHT :: end {{ _ndp_profile_id }} ====================
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "NDP_TOPOLOGY_PREFLIGHT [{{ test_module }}] fail fast on drift"
      ansible.builtin.assert:
        that:
          - _ndp_required_count | int == (_ndp_required_members | length)
          - (_ndp_required_members | map(attribute='ref') | list | difference(_ndp_present_names)) | length == 0
          - (_ndp_required_members | map(attribute='desired_fabric_ref') | unique | difference(_ndp_fabric_refs)) | length == 0
          - >-
            (_ndp_required_members | rejectattr('desired_role', 'equalto', 'preserve')
             | selectattr('ref', 'in', _ndp_present_role_by_name)
             | map(attribute='ref') | map('extract', _ndp_present_role_by_name) | list)
            ==
            (_ndp_required_members | rejectattr('desired_role', 'equalto', 'preserve')
             | selectattr('ref', 'in', _ndp_present_role_by_name)
             | map(attribute='desired_role') | list)
        fail_msg: >-
          NDP_TOPOLOGY_PREFLIGHT_FAIL [{{ test_module }}]: the required switch contract no longer matches
          the declared topology. required_count={{ _ndp_required_count }}
          required={{ _ndp_required_members }} present_names={{ _ndp_present_names }}
          present_roles={{ _ndp_present_role_by_name }}.
        success_msg: "NDP_TOPOLOGY_PREFLIGHT_OK [{{ test_module }}]: required contract satisfied by declared topology."
      ignore_errors: true
      when: ('integration.' ~ test_module) in _ndp_reg.profiles

    - name: "[{{ test_module }}] validate canonical fabric membership"
      ansible.builtin.assert:
        that:
          - nd_test_fabric_switches.VXLAN_EVPN_Fabric | length == 6
          - nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='name') | list == ['vxlan_leaf_1', 'vxlan_leaf_2', 'vxlan_spine_1', 'vxlan_border_1', 'vxlan_leaf_3', 'vxlan_leaf_4']
          - nd_test_fabric_switches.External_Connectivity_Fabric | length == 2
          - nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='name') | list == ['external_edge_1', 'external_edge_2']
        fail_msg: "integration_config.yml does not match the canonical six-switch primary and two-switch external topology."
      ignore_errors: true

    # Positional switch variables are consumed by older role test cases. Keep
    # them tied to the primary fabric so an old Consul runner cannot accidentally
    # pass external_edge_1 (SERIAL00005) as switch_serial_3 and produce an ND
    # "Invalid switchId" response from a primary-fabric policy-group request.
    - name: "[{{ test_module }}] validate positional switches belong to the primary fabric"
      ansible.builtin.assert:
        that:
          - switch_serial_1 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_2 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_3 in (nd_test_fabric_switches.VXLAN_EVPN_Fabric | map(attribute='serial') | list)
          - switch_serial_1 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
          - switch_serial_2 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
          - switch_serial_3 not in (nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list)
        fail_msg: >-
          NDP_SWITCH_MAPPING_FAIL [{{ test_module }}]: positional switch_serial_1..3 must resolve to
          switches in VXLAN_EVPN_Fabric. Got [{{ switch_serial_1 }}, {{ switch_serial_2 }}, {{ switch_serial_3 }}].
          External_Connectivity_Fabric contains [{{ nd_test_fabric_switches.External_Connectivity_Fabric | map(attribute='serial') | list }}].
      ignore_errors: true

    - name: "[{{ test_module }}] validate prerequisite-only mode"
      ansible.builtin.assert:
        that:
          - not (nd_prerequisite_only | default(false) | bool) or (nd_prerequisite_enable | default(false) | bool)
        fail_msg: "nd_prerequisite_only requires nd_prerequisite_enable=true."
      ignore_errors: true

    - name: "[{{ test_module }}] validate interface inputs before preparation"
      ansible.builtin.assert:
        that:
          - _ndp_required_members | length == 1
          - _ndp_selected_profile.runtime_vars.nd_test_switch_ip == _ndp_reg.lab.switches[_ndp_required_members[0].ref].seed_ip
          - _ndp_selected_profile.runtime_vars.nd_test_fabric_name == _ndp_reg.lab.fabrics[_ndp_required_members[0].desired_fabric_ref].name
          - nd_test_switch_ip is not defined or nd_test_switch_ip == _ndp_selected_profile.runtime_vars.nd_test_switch_ip
          - nd_test_fabric_name == _ndp_selected_profile.runtime_vars.nd_test_fabric_name
          - _ndp_selected_profile.runtime_vars.nd_test_ethernet_parent is not defined or nd_test_ethernet_parent is not defined or nd_test_ethernet_parent == _ndp_selected_profile.runtime_vars.nd_test_ethernet_parent
          - nd_interface_selection_changed is not defined or (nd_interface_selection_changed | bool) == (_ndp_selected_profile.interface_selection_changed | default(false) | bool)
          - not (_ndp_selected_profile.interface_selection_changed | default(false) | bool) or not (nd_prerequisite_repair_baseline | default(false) | bool)
        fail_msg: "Interface inputs must match the selected prerequisite registry before preparation; custom selections require a fresh namespace without baseline deletion."
      ignore_errors: true
      when:
        - nd_prerequisite_enable | default(false) | bool
        - test_module is match('^nd_interface_')
        - _ndp_selected_profile.runtime_vars.nd_test_switch_ip is defined

    # =====================================================================
    # NDP_PC_UNBUNDLE: release access/trunk-host PC501-503 leftovers before the
    # gate, on the switch/fabric declared by the same selected profile.
    # Custom selections must prove an empty namespace and skip this cleanup.
    # Routed targets own PC520-523 and use scoped baseline repair instead.
    - name: "[{{ test_module }}] release reserved port-channel members before the gate"
      vars:
        _ndp_pc_switch_ip: "{{ _ndp_selected_profile.runtime_vars.nd_test_switch_ip | default('') }}"
        _ndp_pc_fabric_name: "{{ _ndp_selected_profile.runtime_vars.nd_test_fabric_name | default('') }}"
        _ndp_pc_delete_config:
          - {switch_ip: "{{ _ndp_pc_switch_ip }}", interface_name: port-channel501}
          - {switch_ip: "{{ _ndp_pc_switch_ip }}", interface_name: port-channel502}
          - {switch_ip: "{{ _ndp_pc_switch_ip }}", interface_name: port-channel503}
      when:
        - nd_prerequisite_enable | default(false) | bool
        - test_module in ['nd_interface_port_channel_access', 'nd_interface_port_channel_trunk_host']
        - not (_ndp_selected_profile.interface_selection_changed | default(false) | bool)
        - nd_prerequisite_mode | default('fixture') == 'live'
        - nd_prerequisite_apply | default(false) | bool
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
      block:
        - name: "[{{ test_module }}] delete any stale test port-channel on {{ _ndp_pc_switch_ip }} (frees reserved members)"
          cisco.nd.nd_interface_port_channel_access:
            output_level: info
            fabric_name: "{{ _ndp_pc_fabric_name }}"
            config: "{{ _ndp_pc_delete_config }}"
            state: deleted
          register: _ndp_pc_unbundle_delete
          failed_when: false

        - name: "[{{ test_module }}] Recalculate the fabric so the unbundle is pushed"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ _ndp_pc_fabric_name }}/actions/configSave"
          register: _ndp_pc_unbundle_configsave
          failed_when: false
          when: _ndp_pc_unbundle_delete is changed

        - name: "[{{ test_module }}] Deploy the fabric so the freed members take effect"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ _ndp_pc_fabric_name }}/actions/deploy?forceShowRun=true"
          register: _ndp_pc_unbundle_deploy
          failed_when: false
          when: _ndp_pc_unbundle_delete is changed

        - name: "[{{ test_module }}] report the port-channel unbundle self-heal"
          ansible.builtin.debug:
            msg: >-
              NDP_PC_UNBUNDLE [{{ test_module }}] switch={{ _ndp_pc_switch_ip }}
              freed={{ _ndp_pc_unbundle_delete is changed }}
              configSave={{ _ndp_pc_unbundle_configsave.status | default('skipped') }}
              deploy={{ _ndp_pc_unbundle_deploy.status | default('skipped') }}

    # A runner killed before its restore handler (build 184 nd_manage_policy) leaves the shared
    # baseline repair lock behind, and every later module then skips baseline repair. Reclaim it
    # only when owner.json names a pipeline run id that no live process carries as an exact
    # nd_prerequisite_run_id=<id> argument. Missing/unreadable owners, local-* owners, live owners
    # and hosts without a process table keep the lock for operator review. Never fails the module.
    - name: "[{{ test_module }}] reclaim a baseline repair lock whose owning run has exited"
      ansible.builtin.command:
        argv:
          - "{{ nd_prerequisite_python | default(ansible_playbook_python) }}"
          - "-c"
          - |
            import fcntl, json, os, re, shutil, stat, sys, time
            lock = os.environ["NDP_LOCK_DIR"]
            proc = os.environ.get("NDP_PROC_ROOT") or "/proc"
            def report(marker, **fields):
                print(marker + " " + json.dumps(fields, sort_keys=True))
                sys.exit(0)
            if not re.fullmatch(r"/.+/nd-prerequisite-baseline[.]lock", lock):
                report("NDP_PREREQUISITE_LOCK_CHECK_SKIPPED", reason="unsafe lock path", lock=lock)
            with open(lock + ".reclaim", "a") as guard:
                fcntl.flock(guard, fcntl.LOCK_EX)
                try:
                    info = os.lstat(lock)
                except FileNotFoundError:
                    sys.exit(0)
                if not stat.S_ISDIR(info.st_mode):
                    report("NDP_PREREQUISITE_LOCK_HELD", reason="lock path is not a directory", lock=lock)
                try:
                    with open(os.path.join(lock, "owner.json")) as handle:
                        owner = json.load(handle)
                    run_id = str(owner.get("run_id") or "")
                except (OSError, ValueError, AttributeError):
                    report("NDP_PREREQUISITE_LOCK_HELD", reason="owner.json missing or unreadable", lock=lock)
                if not run_id or run_id.startswith("local-"):
                    report("NDP_PREREQUISITE_LOCK_HELD", reason="owner has no pipeline run id", owner_run_id=run_id)
                if not os.path.isdir(proc):
                    report("NDP_PREREQUISITE_LOCK_HELD", reason="process table unavailable", owner_run_id=run_id)
                token = re.compile(r"nd_prerequisite_run_id=([^\s'\",]+)")
                alive = []
                for pid in os.listdir(proc):
                    if not pid.isdigit() or int(pid) == os.getpid():
                        continue
                    try:
                        with open(os.path.join(proc, pid, "cmdline"), "rb") as handle:
                            arguments = handle.read().decode("utf-8", "replace").split("\0")
                    except OSError:
                        continue
                    if any(run_id in token.findall(argument) for argument in arguments):
                        alive.append(int(pid))
                if alive:
                    report("NDP_PREREQUISITE_LOCK_HELD", reason="owner run is still active", owner_run_id=run_id, pids=sorted(alive)[:5])
                tombstone = "%s.stale-%d-%d" % (lock, time.time(), os.getpid())
                os.rename(lock, tombstone)
                shutil.rmtree(tombstone, ignore_errors=True)
                report("NDP_PREREQUISITE_STALE_LOCK_RECLAIMED", owner_run_id=run_id,
                       owner_execution_id=str(owner.get("execution_id") or ""),
                       lock_age_seconds=int(time.time() - info.st_mtime),
                       reclaimed_by=os.environ.get("NDP_RUN_ID", ""))
      environment:
        NDP_LOCK_DIR: "{{ nd_prerequisite_repair_lock_dir | default('/tmp/nd-prerequisite-baseline.lock') }}"
        NDP_RUN_ID: "{{ nd_prerequisite_run_id | default('') }}"
      register: _ndp_stale_lock_check
      changed_when: "'NDP_PREREQUISITE_STALE_LOCK_RECLAIMED' in (_ndp_stale_lock_check.stdout | default(''))"
      failed_when: false
      delegate_to: localhost
      run_once: true
      when:
        - nd_prerequisite_enable | default(false) | bool
        - nd_prerequisite_mode | default('fixture') == 'live'
        - nd_prerequisite_apply | default(false) | bool
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode

    - name: "[{{ test_module }}] report the baseline repair lock check"
      ansible.builtin.debug:
        msg: "{{ (_ndp_stale_lock_check.stdout | default('', true)) or (_ndp_stale_lock_check.stderr | default('', true) | truncate(400)) }}"
      when:
        - _ndp_stale_lock_check is not skipped
        - ((_ndp_stale_lock_check.stdout | default('', true)) ~ (_ndp_stale_lock_check.stderr | default('', true))) | length > 0

    - name: "[{{ test_module }}] prepare and verify declared prerequisites"
      when: nd_prerequisite_enable | default(false) | bool
      block:
        - name: "[{{ test_module }}] run prerequisite preparation lifecycle"
          ansible.builtin.import_tasks: "{{ nd_prerequisite_wrapper_path }}"
      rescue:
        # Journaled changes and an owned lock stay armed for the forced restore handler, which runs
        # after the authored target and its cleanup exactly as on the successful path.
        - name: "[{{ test_module }}] record the prerequisite failure and continue to the authored target"
          ansible.builtin.set_fact:
            _ndp_prerequisite_failed: true
            _ndp_continued_failures: >-
              {{ _ndp_continued_failures | default([])
                 + ['prerequisites: ' ~ (ansible_failed_task.name | default('unknown task', true) | string | truncate(200))] }}

        # Use the planner's values when it produced them, otherwise the registry-declared ones, so the
        # target never falls back to an undeclared default (for example an underlay uplink parent).
        - name: "[{{ test_module }}] publish declared runtime variables for the authored target"
          ansible.builtin.set_fact:
            "{{ _ndp_item.key }}": "{{ _ndp_item.value }}"
          loop: >-
            {{ ((_ndp_selected_profile | default({})).runtime_vars | default({}))
               | combine((_ndp_result | default({})).runtime_vars | default({}))
               | dict2items }}
          loop_control:
            loop_var: _ndp_item
            label: "{{ _ndp_item.key }}"

        - name: "[{{ test_module }}] report the prerequisite failure and continue to the authored target"
          ansible.builtin.debug:
            msg: >-
              NDP_PREREQUISITE_FAILED_CONTINUING [{{ test_module }}]: prerequisite preparation failed at
              '{{ ansible_failed_task.name | default('unknown task', true) }}'; running the authored target anyway.
              Journaled changes ({{ _ndp_prerequisite_restore_operations | default([]) | length }}) are restored after it.

  tasks:
    # Handler notifications emitted from pre_tasks are flushed before normal
    # tasks. Arm the restore here so force_handlers runs it only after the target
    # and its cleanup, including when a later task fails.
    - name: "[{{ test_module }}] arm forced prerequisite restore handler"
      ansible.builtin.debug:
        msg: >-
          Armed restore for {{ _ndp_prerequisite_restore_operations | default([]) | length }}
          prerequisite interface change(s); journal={{ _ndp_restore_file | default('not-created') }}.
      changed_when: (_ndp_prerequisite_restore_operations | default([]) | length > 0) or (_ndp_baseline_repair_lock_acquired | default(false) | bool)
      notify: Restore prerequisite interface changes
      when: nd_prerequisite_enable | default(false) | bool

    - name: "[{{ test_module }}] validate required topology facts"
      ansible.builtin.assert:
        that:
          - ansible_it_fabric | length > 0
          - ansible_switch1 | length > 0
          - ansible_switch2 | length > 0
          - (test_module != 'nd_manage_switches') or (ansible_switch3 | length > 0)
          - (test_module != 'nd_manage_switches') or (save | bool and deploy | bool and config_actions_type == 'switch')
          # Integration target dir is nd_resource_manager (module is nd_manage_resource_manager); test_module carries the target name.
          - (test_module not in ['nd_resource_manager', 'nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']) or (ansible_sno_1 | length > 0 and ansible_sno_2 | length > 0)
          - (test_module not in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']) or (nd_test_vpc_pair2_peer1_ip | length > 0 and nd_test_vpc_pair2_peer2_ip | length > 0 and nd_test_vpc_pair2_peer1_ip != nd_test_vpc_pair2_peer2_ip)
          - (test_module != 'nd_resource_manager') or (intf_1_2 | length > 0 and intf_1_3 | length > 0 and intf_1_10 | length > 0)
          - (test_module != 'nd_manage_route_map') or (nd_test_fabric_name | length > 0)
          - (test_module != 'nd_manage_acl') or (acl_test_fabric | length > 0)
          - (test_module != 'nd_manage_l3out') or (nd_test_fabric1_name | length > 0 and nd_test_fabric2_name | length > 0)
          # nd_maintenance_mode / nd_fabric_update_group: the switches the target changes must be distinct management IPs of the round's fabric.
          - (test_module != 'nd_maintenance_mode') or (nd_test_maintenance_mode_fabric_name | length > 0 and ([nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b] | map('string') | reject('equalto', '') | unique | list | length) == 2)
          - (test_module != 'nd_fabric_update_group') or (nd_test_fabric_name | length > 0 and ([nd_test_update_switch_a, nd_test_update_switch_b, nd_test_update_switch_c] | map('string') | reject('equalto', '') | unique | list | length) == 3)
          # nd_manage_links: both switches must be members of the chosen fabric in the canonical roster, and any
          # override must equal what the planner verified (profile runtime_vars) when prerequisites are enabled.
          - (test_module != 'nd_manage_links') or (nd_test_fabric_numbered | length > 0 and nd_test_fabric_numbered in nd_test_fabric_switches)
          - (test_module != 'nd_manage_links') or (nd_test_switch_a | length > 0 and nd_test_switch_b | length > 0 and nd_test_switch_a != nd_test_switch_b)
          - (test_module != 'nd_manage_links') or (nd_test_switch_a in (nd_test_fabric_switches[nd_test_fabric_numbered] | default([]) | map(attribute='name') | list) and nd_test_switch_b in (nd_test_fabric_switches[nd_test_fabric_numbered] | default([]) | map(attribute='name') | list))
          - (test_module != 'nd_manage_links') or ((nd_test_switch_a_ip | length == 0 and nd_test_switch_b_ip | length == 0) or (nd_test_switch_a_ip | length > 0 and nd_test_switch_b_ip | length > 0 and nd_test_switch_a_ip != nd_test_switch_b_ip))
          - (test_module != 'nd_manage_links') or (_ndp_result is not defined) or (nd_test_fabric_numbered == _ndp_result.runtime_vars.nd_test_fabric_numbered and nd_test_switch_a == _ndp_result.runtime_vars.nd_test_switch_a and nd_test_switch_b == _ndp_result.runtime_vars.nd_test_switch_b)
          - (not (test_module is match('^nd_interface_'))) or (_ndp_result is not defined) or (_ndp_result.runtime_vars.nd_test_switch_ip is not defined) or (nd_test_switch_ip == _ndp_result.runtime_vars.nd_test_switch_ip and nd_test_fabric_name == _ndp_result.runtime_vars.nd_test_fabric_name)
          # nd_interface_subinterface_*: with prerequisites enabled the parent must equal the planner-verified one, so a
          # stale -e (e.g. an old job still passing Ethernet1/35) cannot run the test on a port nobody prepared.
          - (test_module not in ['nd_interface_subinterface_managed', 'nd_interface_subinterface_unmanaged']) or (_ndp_result is not defined) or (nd_test_ethernet_parent | default('') == _ndp_result.runtime_vars.nd_test_ethernet_parent)
          - switch_serial_1 != switch_serial_2
          - switch_serial_2 != switch_serial_3
          - switch_serial_1 != switch_serial_3
        fail_msg: >-
          {{ test_module }} requires a complete, distinct integration topology.
          Run the prerequisite preparation lifecycle before retrying this module.
          For nd_manage_links the fabric/switch inputs must be roster members and, with prerequisites
          enabled, equal to the profile-verified values (leave ND_LINKS_* blank to use them).
          For nd_interface_subinterface_* a non-blank nd_test_ethernet_parent must equal the profile-verified
          parent (do not pass -e nd_test_ethernet_parent to use it; got '{{ nd_test_ethernet_parent | default('unset') }}').
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Not every target has tasks/cleanup.yaml, and include_role + tasks_from on
    # a missing file raises an error that ignore_errors does NOT suppress (it
    # aborts the play before RUN). Stat-guard the pre/post clean. stat runs on
    # localhost because the play host `nd` is a network device with no local FS.
    #
    # Lifecycle file names vary: setup/prepare and cleanup/teardown.
    # Deletion test scenarios are not idempotent lifecycle cleanup routines.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] arm cleanup for the verified-empty subinterface namespace"
      ansible.builtin.set_fact:
        _ndp_subinterface_cleanup:
          fabric: "{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_subinterface_namespace.switch_ref].baseline_fabric_ref].name }}"
          switch_ip: "{{ _ndp_registry.lab.switches[_ndp_subinterface_namespace.switch_ref].seed_ip }}"
          interfaces: "{{ _ndp_subinterface_namespace.interfaces }}"
      vars:
        _ndp_subinterface_namespace: >-
          {{ _ndp_profile.resources
             | selectattr('kind', 'equalto', 'verify_logical_interface_namespace')
             | selectattr('interface_type', 'equalto', 'subinterface')
             | selectattr('expected_state', 'equalto', 'absent') | first }}
      changed_when: true
      notify: Restore prerequisite interface changes
      when:
        - test_module in ['nd_interface_subinterface_managed', 'nd_interface_subinterface_unmanaged']
        - nd_prerequisite_enable | default(false) | bool
        - nd_prerequisite_mode | default('fixture') == 'live'
        - nd_prerequisite_apply | default(false) | bool
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
        - _ndp_result is defined
        - not (_ndp_prerequisite_failed | default(false) | bool)

    - name: "[{{ test_module }}] clean the known ToR test association before switch deletion"
      when:
        - test_module == 'nd_manage_switches'
        - fabric_name in ['VXLAN_EVPN_Fabric', 'VXLAN_EVPN_Fabric_eBGP']
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
      block: &ndp_cleanup_test_tor
        - name: "[{{ test_module }}] resolve the known ToR test pair from the active roster"
          vars:
            _tor_members: "{{ nd_pipeline_switches_topology | selectattr('name', 'equalto', 'vxlan_leaf_3') | list }}"
            _leaf_members: "{{ nd_pipeline_switches_topology | selectattr('name', 'equalto', 'vxlan_leaf_4') | list }}"
          ansible.builtin.assert:
            that:
              - ansible_it_fabric == fabric_name
              - _tor_members | length == 1
              - _leaf_members | length == 1
              - _tor_members[0].serial is string and _tor_members[0].serial | trim | length > 0
              - _leaf_members[0].serial is string and _leaf_members[0].serial | trim | length > 0
              - _tor_members[0].serial | lower != _leaf_members[0].serial | lower
            fail_msg: "NDP_TOR_CLEANUP_BLOCKED: the active fabric or the known test pair could not be verified."

        - name: "[{{ test_module }}] gather active-fabric ToR associations"
          cisco.nd.nd_manage_tor:
            fabric_name: "{{ fabric_name }}"
            state: gathered
          register: _ndp_tor_cleanup_before
          no_log: true

        - name: "[{{ test_module }}] require valid ToR association readback"
          ansible.builtin.assert:
            that:
              - _ndp_tor_cleanup_before.changed is sameas false
              - _ndp_tor_cleanup_before.before | type_debug == 'list'
              - _ndp_tor_cleanup_before.before == _ndp_tor_cleanup_before.after
              - >-
                _ndp_tor_cleanup_before.after | selectattr('fabric_name', 'defined')
                | selectattr('fabric_name', 'equalto', fabric_name)
                | selectattr('access_or_tor_switch_id', 'defined')
                | selectattr('aggregation_or_leaf_switch_id', 'defined') | list | length
                == _ndp_tor_cleanup_before.after | length
            fail_msg: "NDP_TOR_CLEANUP_BLOCKED: the controller did not return verifiable fabric associations."

        - name: "[{{ test_module }}] remove and deploy only the exact standalone ToR test pair"
          vars:
            _tor_id: "{{ (nd_pipeline_switches_topology | selectattr('name', 'equalto', 'vxlan_leaf_3') | first).serial }}"
            _leaf_id: "{{ (nd_pipeline_switches_topology | selectattr('name', 'equalto', 'vxlan_leaf_4') | first).serial }}"
            _pair_rows: >-
              {{ _ndp_tor_cleanup_before.after
                 | selectattr('access_or_tor_switch_id', 'equalto', _tor_id)
                 | selectattr('aggregation_or_leaf_switch_id', 'equalto', _leaf_id) | list }}
          when: _pair_rows | length > 0
          block:
            - name: "[{{ test_module }}] refuse ambiguous or vPC test-pair matches"
              ansible.builtin.assert:
                that:
                  - _pair_rows | length == 1
                  - not (_pair_rows[0].access_or_tor_peer_switch_id | default(none, true))
                  - not (_pair_rows[0].aggregation_or_leaf_peer_switch_id | default(none, true))
                fail_msg: "NDP_TOR_CLEANUP_BLOCKED: the known pair is duplicated or belongs to a vPC association."

            - name: "[{{ test_module }}] disassociate the test pair, then Recalculate and Deploy"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ fabric_name }}"
                state: deleted
                config:
                  - access_or_tor_switch: "{{ _tor_id }}"
                    aggregation_or_leaf_switch: "{{ _leaf_id }}"
                config_actions:
                  save: true
                  deploy: true
                  type: switch
              register: _ndp_tor_cleanup_delete
              no_log: true

            - name: "[{{ test_module }}] require a confirmed disassociation before claiming deployment"
              ansible.builtin.assert:
                that: _ndp_tor_cleanup_delete.changed is sameas true
                fail_msg: "NDP_TOR_CLEANUP_BLOCKED: the expected disassociation did not change; Recalculate and Deploy are unconfirmed."

            - name: "[{{ test_module }}] verify the ToR test association is absent"
              cisco.nd.nd_manage_tor:
                fabric_name: "{{ fabric_name }}"
                state: gathered
              register: _ndp_tor_cleanup_after
              until: >-
                _ndp_tor_cleanup_after is succeeded
                and _ndp_tor_cleanup_after.changed is sameas false
                and _ndp_tor_cleanup_after.after | type_debug == 'list'
                and _ndp_tor_cleanup_after.before == _ndp_tor_cleanup_after.after
                and _ndp_tor_cleanup_after.after
                  | selectattr('fabric_name', 'defined') | selectattr('fabric_name', 'equalto', fabric_name)
                  | selectattr('access_or_tor_switch_id', 'defined') | selectattr('aggregation_or_leaf_switch_id', 'defined')
                  | list | length == _ndp_tor_cleanup_after.after | length
                and _ndp_tor_cleanup_after.after
                  | selectattr('access_or_tor_switch_id', 'equalto', _tor_id)
                  | selectattr('aggregation_or_leaf_switch_id', 'equalto', _leaf_id) | list | length == 0
              retries: 5
              delay: 5
              no_log: true

            - name: "[{{ test_module }}] report verified ToR test-pair cleanup"
              ansible.builtin.debug:
                msg: "NDP_TOR_CLEANUP_OK: disassociation and switch-scoped Recalculate/Deploy completed; the test pair is absent."
      rescue: &ndp_cleanup_test_tor_failure
        - name: "[{{ test_module }}] report unverified ToR cleanup"
          ansible.builtin.fail:
            msg: "NDP_TOR_CLEANUP_FAILED: {{ ansible_failed_task.name }}; cleanup did not complete or could not be verified."

    # This target deletes the entire fabric inventory, not just its three seeds.
    # Unlike best-effort fixture checks, an unverified delete must not continue.
    - name: "[{{ test_module }}] require safe fabric-wide switch deletion"
      when:
        - test_module == 'nd_manage_switches'
        - not (nd_prerequisite_only | default(false) | bool)
        - not ansible_check_mode
      block:
        - name: "[{{ test_module }}] require a declared switch-delete fabric and roster"
          ansible.builtin.assert:
            that:
              - ansible_it_fabric == fabric_name
              - nd_pipeline_switches_topology | length > 0
              - nd_pipeline_switches_topology | map(attribute='serial') | unique | length == nd_pipeline_switches_topology | length
            fail_msg: "NDP_SWITCH_DELETE_PREFLIGHT_BLOCKED: target fabric or canonical roster is unverified; no target lifecycle was started."

        - name: "[{{ test_module }}] enforce NDP_INTERFACE_BASELINE_HOOK before switch-delete admission"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/nd_prerequisite/interface_baseline.yaml"
          vars:
            nd_fabric_name: "{{ fabric_name }}"
            nd_external_fabric_name: "{{ nd_test_fabric2_name }}"
          when: nd_interface_baseline_enabled | default(lookup('env', 'ND_INTERFACE_BASELINE_ENABLED') | default(true, true)) | bool

        - name: "[{{ test_module }}] read switch-delete inventory"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ fabric_name | urlencode }}/switches?max=200"
          register: _ndp_delete_inventory
          failed_when: false
          no_log: true

        - name: "[{{ test_module }}] read switch-delete ToR associations"
          cisco.nd.nd_manage_tor:
            fabric_name: "{{ fabric_name }}"
            state: gathered
          register: _ndp_delete_tor
          failed_when: false
          no_log: true

        - name: "[{{ test_module }}] read switch-delete anomalies"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/analyze/anomalies/details?fabricName={{ fabric_name | urlencode }}&max=200"
          register: _ndp_delete_anomalies
          failed_when: false
          no_log: true

        - name: "[{{ test_module }}] read global inventory for retired Leaf-ToR identities"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/inventory/switches?max=10000"
          register: _ndp_delete_global_inventory
          failed_when: false
          no_log: true

        - name: "[{{ test_module }}] require complete switch-delete safety evidence"
          ansible.builtin.assert:
            that:
              - _ndp_delete_inventory.status | default(0) | int == 200
              - _ndp_delete_inventory.current is mapping
              - "'error' not in _ndp_delete_inventory.current and 'errors' not in _ndp_delete_inventory.current and 'code' not in _ndp_delete_inventory.current"
              - _ndp_delete_inventory.current.switches is defined
              - _ndp_delete_inventory.current.switches | type_debug == 'list'
              - _ndp_delete_inventory.current.switches | length < 200
              - not (_ndp_delete_tor.changed | default(false) | bool)
              - _ndp_delete_tor.before is defined
              - _ndp_delete_tor.after is defined
              - _ndp_delete_tor.before | type_debug == 'list'
              - _ndp_delete_tor.before == _ndp_delete_tor.after
              - _ndp_delete_anomalies.status | default(0) | int == 200
              - _ndp_delete_anomalies.current is mapping
              - "'error' not in _ndp_delete_anomalies.current and 'errors' not in _ndp_delete_anomalies.current and 'code' not in _ndp_delete_anomalies.current"
              - _ndp_delete_anomalies.current.anomalies is defined
              - _ndp_delete_anomalies.current.anomalies | type_debug == 'list'
              - _ndp_delete_anomalies.current.anomalies | length < 200
            fail_msg: "NDP_SWITCH_DELETE_PREFLIGHT_UNVERIFIED: incomplete or failed controller readback; no target lifecycle was started."

        - name: "[{{ test_module }}] require only canonical switches in the delete fabric"
          ansible.builtin.assert:
            that:
              - _ndp_delete_inventory.current.switches | map(attribute='switchId') | sort == nd_pipeline_switches_topology | map(attribute='serial') | sort
              - _ndp_delete_tor.before | length == 0
            fail_msg: "NDP_SWITCH_DELETE_PREFLIGHT_BLOCKED: fabric membership differs from the roster or ToR associations remain; no target lifecycle was started."

        - name: "[{{ test_module }}] require roster roles before switch deletion"
          ansible.builtin.assert:
            that:
              - item.switchRole | default('') | lower == _ndp_expected_role | lower
            fail_msg: "NDP_SWITCH_DELETE_PREFLIGHT_BLOCKED: a switch role differs from the roster; no target lifecycle was started."
          vars:
            _ndp_expected_role: "{{ (nd_pipeline_switches_topology | selectattr('serial', 'equalto', item.switchId) | first).role }}"
          loop: "{{ _ndp_delete_inventory.current.switches }}"
          no_log: true

        # ND keeps the October Leaf-ToR unpairing warnings for the retained test pair
        # (vxlan_leaf_3/vxlan_leaf_4) uncleared even after Recalculate and Deploy with no
        # association left; the switches count patch accepts exactly that retained pair.
        # Historical identities require exact name/serial matching and verified global absence.
        - name: "[{{ test_module }}] classify uncleared Leaf-ToR deletion warnings"
          vars:
            _ndp_retired_leaf_tor_identities:
              vxlan_leaf_3: 9FHEMB26I85
              vxlan_leaf_4: 9NM46MBYL0B
          ansible.builtin.set_fact:
            _ndp_delete_leaf_tor: >-
              {%- set pair = nd_pipeline_switches_topology | selectattr('name', 'defined')
                   | selectattr('name', 'in', ['vxlan_leaf_3', 'vxlan_leaf_4'])
                   | map(attribute='serial') | map('lower') | list -%}
              {%- set global_reply = _ndp_delete_global_inventory | default({}) -%}
              {%- set global_body = global_reply.current | default({}) -%}
              {%- set global_rows = global_body.switches | default(none) if global_body is mapping else none -%}
              {%- set counts = global_body.meta.counts | default({}) if global_body is mapping else {} -%}
              {%- set global_verified = global_reply.status | default(0) | int == 200
                   and not (global_reply.failed | default(false))
                   and global_body is mapping and 'error' not in global_body and 'errors' not in global_body and 'code' not in global_body
                   and global_rows is sequence and global_rows is not string and global_rows is not mapping
                   and global_rows | length < 10000 and counts is mapping
                   and counts.remaining | default(none) | type_debug == 'int'
                   and counts.total | default(none) | type_debug == 'int'
                   and counts.remaining | default(-1) | int == 0 and counts.total | default(-1) | int == global_rows | length -%}
              {%- set live_ids = namespace(values=[], valid=global_verified) -%}
              {%- if global_verified -%}
                {%- for switch in global_rows -%}
                  {%- if switch is not mapping or switch.switchId | default(none) is not string or not switch.switchId -%}
                    {%- set live_ids.valid = false -%}
                  {%- else -%}{%- set live_ids.values = live_ids.values + [switch.switchId | lower] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set ns = namespace(malformed=0, known=0, retired=0, unknown=0) -%}
              {%- for row in _ndp_delete_anomalies.current.anomalies -%}
                {%- if row is not mapping or row.get('fabricName') is not string or row.get('anomalyString') is not string
                      or row.get('cleared') is not boolean -%}
                  {%- set ns.malformed = ns.malformed + 1 -%}
                {%- elif row.fabricName == fabric_name and not row.cleared
                      and row.anomalyString is search('(?i)leaf-tor unpairing')
                      and row.anomalyString is search('(?i)recalculate\\s+and\\s+deploy') -%}
                  {%- set identities = row.anomalyString | lower | regex_findall('\\[([^\\[\\]]+)\\]') -%}
                  {%- set hit = namespace(pair=0, retired=0, other=0) -%}
                  {%- for identity in identities -%}
                    {%- set parts = identity.split('/') -%}
                    {%- set serial = parts[-1] -%}
                    {%- if pair | length == 2 and identity is match('^[a-z0-9_.-]+(/[a-z0-9_.-]+)?$') and serial in pair -%}
                      {%- set hit.pair = hit.pair + 1 -%}
                    {%- elif pair | length == 2 and parts | length == 2
                          and parts[0] in _ndp_retired_leaf_tor_identities
                          and serial == _ndp_retired_leaf_tor_identities[parts[0]] | lower
                          and live_ids.valid and serial not in live_ids.values -%}
                      {%- set hit.retired = hit.retired + 1 -%}
                    {%- else -%}{%- set hit.other = hit.other + 1 -%}{%- endif -%}
                  {%- endfor -%}
                  {%- if hit.pair + hit.retired > 0 and hit.other == 0 -%}
                    {%- if hit.retired > 0 -%}{%- set ns.retired = ns.retired + 1 -%}
                    {%- else -%}{%- set ns.known = ns.known + 1 -%}{%- endif -%}
                  {%- else -%}{%- set ns.unknown = ns.unknown + 1 -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{- {'malformed': ns.malformed, 'known': ns.known, 'retired': ns.retired, 'unknown': ns.unknown} -}}

        - name: "[{{ test_module }}] require cleared Leaf-ToR deletion warnings outside the retained test pair"
          ansible.builtin.assert:
            that:
              - _ndp_delete_leaf_tor.malformed | int == 0
              - _ndp_delete_leaf_tor.unknown | int == 0
            fail_msg: >-
              NDP_SWITCH_DELETE_PREFLIGHT_BLOCKED: unverified Leaf-ToR warnings remain
              (current_pair={{ _ndp_delete_leaf_tor.known }}, retired_pair={{ _ndp_delete_leaf_tor.retired }},
              unknown={{ _ndp_delete_leaf_tor.unknown }}, malformed={{ _ndp_delete_leaf_tor.malformed }}).
              Historical identities require complete global inventory and verified absence; no target lifecycle was started.

        - name: "[{{ test_module }}] report verified switch-delete readiness"
          ansible.builtin.debug:
            msg: >-
              NDP_SWITCH_DELETE_PREFLIGHT_OK: canonical roles and membership confirmed, no ToR associations,
              no active Leaf-ToR deletion warnings outside the retained test pair
              (retained_pair_warnings={{ _ndp_delete_leaf_tor.known }},
              retired_pair_warnings={{ _ndp_delete_leaf_tor.retired }}).
      rescue:
        - name: "[{{ test_module }}] stop an unsafe switch-delete target"
          ansible.builtin.fail:
            msg: >-
              NDP_SWITCH_DELETE_PREFLIGHT_BLOCKED: {{ ansible_failed_task.name }};
              no target lifecycle was started. Inspect ToR associations, roster roles and Leaf-ToR anomalies.
              The safety check does not change roles, force-remove switches or acknowledge anomalies.

    # Controller-side existence tests: the 8 candidate names were 8 stat module runs (~9.5 s per module).
    - name: "[{{ test_module }}] discover optional setup/cleanup task files (names vary)"
      ansible.builtin.set_fact:
        _ndp_setup_file: >-
          {{ (['setup.yaml', 'setup.yml', 'prepare.yaml', 'prepare.yml']
              | map('regex_replace', '^', _ndp_lifecycle_dir ~ '/') | select('exists') | map('basename') | list + ['']) | first }}
        _ndp_cleanup_file: >-
          {{ (['cleanup.yaml', 'cleanup.yml', 'teardown.yaml', 'teardown.yml']
              | map('regex_replace', '^', _ndp_lifecycle_dir ~ '/') | select('exists') | map('basename') | list + ['']) | first }}
      vars:
        _ndp_lifecycle_dir: "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks"
      when: not (nd_prerequisite_only | default(false) | bool)

    # A target "owns" its setup when main.yaml or any test-case already imports
    # it (most do). Only an UNWIRED setup file is run by the harness below, so
    # setup is never double-run for targets that already sequence it themselves.
    - name: "[{{ test_module }}] find files that already import the setup file"
      ansible.builtin.find:
        paths:
          - "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tasks"
          - "{{ playbook_dir }}/tests/integration/targets/{{ test_module }}/tests"
        patterns:
          - "*.yaml"
          - "*.yml"
        contains: ".*(import_tasks|include_tasks|tasks_from|include_role|import_role).*{{ _ndp_setup_file | regex_escape }}.*"
        recurse: true
      register: _ndp_setup_importers
      failed_when: false
      delegate_to: localhost
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - _ndp_setup_file | default('') | length > 0

    # -------------------------------------------------------------------------
    # SETUP (all modules): the pre-clean below and the post-clean in the always section run the target's cleanup/teardown file
    # ON ITS OWN, but several of those files read nd_info, which only the target's main.yaml sets (live 2026-10-13 nd_maintenance_mode;
    # 2026-10-16 nd_manage_prefix_list + nd_manage_community_list: "'nd_info' is undefined" ended the play before the target started,
    # and include_role does not pass ignore_errors on to the tasks it includes). Define the fact for EVERY module here; main.yaml
    # re-sets an identical value later.
    - name: "[{{ test_module }}] SETUP - define nd_info for the stand-alone pre-clean/teardown"
      ansible.builtin.set_fact:
        nd_info:
          output_level: '{{ api_key_output_level | default("debug") }}'
      when: not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP: best-effort pre-clean of stale objects for this module, so a prior
    # aborted run cannot leak state into this one. Skipped when no cleanup file.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - pre-clean stale objects (best effort)"
      ansible.builtin.include_role:
        name: "{{ test_module }}"
        tasks_from: "{{ _ndp_cleanup_file }}"
        apply:
          ignore_errors: true
      ignore_errors: true
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - _ndp_cleanup_file | default('') | length > 0

    # -------------------------------------------------------------------------
    # SETUP (nd_manage_vrfs only): the collection's setup "Delete All VRFs"
    # cannot delete a VRF while a network references it (AKB_NET_* -> AKB_VRF_*).
    # Delete every network on the target fabric first. Same gather-then-delete
    # pattern as reset_fabric.yaml, scoped here so it also holds mid-version.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - gather networks before VRF delete"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ fabric_name }}"
        state: gathered
        config: []
      register: vrf_preclean_networks
      ignore_errors: true
      when: test_module == 'nd_manage_vrfs' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - delete networks before VRF delete"
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ fabric_name }}"
        state: deleted
        config:
          - network_name: "{{ item.network_name }}"
            is_l2only: "{{ item.is_l2only | default(omit) }}"
      loop: "{{ vrf_preclean_networks.gathered | default(vrf_preclean_networks.current) | default(vrf_preclean_networks.response) | default([]) }}"
      loop_control:
        label: "{{ fabric_name }} / {{ item.network_name | default(item) }}"
      ignore_errors: true
      when: test_module == 'nd_manage_vrfs' and not (nd_prerequisite_only | default(false) | bool)

    # Record pipeline fixture failures separately from authored setup failures.
    - name: "[{{ test_module }}] SETUP - prepare module-specific pipeline fixtures"
      block:
        # -------------------------------------------------------------------------
        # SETUP (nd_manage_l3out only): the collection's l3out setup.yaml deletes
        # stale L3Outs but never CREATES the VRFs its merged.yaml references
        # (test_vrf1_name 'production' on fabric1, test_vrf2_name 'external' on
        # fabric2). On ND 4.2.1 the L3Out create then 207s "VRF production not found
        # in fabric VXLAN_EVPN_Fabric" (build #30). Pre-create the VRFs here. The
        # nd_manage_vrfs MODULE is broken on 4.2.1 (bgpPasswordKeyType), so use raw
        # REST. A duplicate create is allowed, but the GET checks below are the
        # authoritative gate: the L3Out module is not started unless each required
        # VRF is present on its declared fabric.
        - name: "[{{ test_module }}] SETUP - pre-create L3Out VRF on fabric1"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/vrfs"
            content:
              vrfs:
                - vrfType: vxlanIbgp
                  fabricName: "{{ nd_test_fabric1_name }}"
                  vrfName: "{{ nd_test_vrf1_name | default('production') }}"
                  vrfId: "{{ nd_test_vrf1_id | default(58900) }}"
                  vlanId: "{{ nd_test_vrf1_vlan | default(2290) }}"
          register: l3out_vrf1_precreate
          # ND may return a duplicate-object error when the prerequisite already
          # exists. The GET + assert below decides whether the prerequisite is valid.
          failed_when: false
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

        - name: "[{{ test_module }}] SETUP - pre-create L3Out VRF on fabric2"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}/vrfs"
            content:
              vrfs:
                - vrfType: externalConnectivity
                  fabricName: "{{ nd_test_fabric2_name }}"
                  vrfName: "{{ nd_test_vrf2_name | default('external') }}"
                  vrfId: "{{ nd_test_vrf2_id | default(58901) }}"
                  vlanId: "{{ nd_test_vrf2_vlan | default(2291) }}"
          register: l3out_vrf2_precreate
          failed_when: false
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

        - name: "[{{ test_module }}] SETUP - verify L3Out VRF on fabric1"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/vrfs"
          register: l3out_vrf1_live
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

        - name: "[{{ test_module }}] SETUP - verify L3Out VRF on fabric2"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}/vrfs"
          register: l3out_vrf2_live
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

        - name: "[{{ test_module }}] SETUP - fail closed if L3Out VRFs are missing"
          ansible.builtin.assert:
            that:
              - >-
                (nd_test_vrf1_name | default('production')) in
                (l3out_vrf1_live.current.vrfs | default([]) | map(attribute='vrfName') | list)
              - >-
                (nd_test_vrf2_name | default('external')) in
                (l3out_vrf2_live.current.vrfs | default([]) | map(attribute='vrfName') | list)
            fail_msg: >-
              NDP_L3OUT_VRF_PREREQUISITE_FAIL: required VRFs were not confirmed before
              nd_manage_l3out. Expected
              {{ nd_test_vrf1_name | default('production') }} on {{ nd_test_fabric1_name }} and
              {{ nd_test_vrf2_name | default('external') }} on {{ nd_test_fabric2_name }}.
              Check the raw VRF POST response and controller permissions.
            success_msg: >-
              NDP_L3OUT_VRF_PREREQUISITE_OK: confirmed
              {{ nd_test_vrf1_name | default('production') }} on {{ nd_test_fabric1_name }} and
              {{ nd_test_vrf2_name | default('external') }} on {{ nd_test_fabric2_name }}.
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)

        # -------------------------------------------------------------------------
        # Prepare route maps and supply only a missing external ASN for L3Out BGP cases.
        - name: "[{{ test_module }}] SETUP - prepare route-map prerequisites for the original L3Out cases"
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)
          block:
            - name: "[{{ test_module }}] SETUP - read the target's unchanged L3Out variables"
              ansible.builtin.include_vars:
                file: "{{ playbook_dir }}/tests/integration/targets/nd_manage_l3out/vars/main.yaml"

            - name: "[{{ test_module }}] SETUP - verify L3Out subinterface names match the authored VLAN"
              ansible.builtin.assert:
                that:
                  - l3out_static.connectivity_details.routing_interface_type == 'subInterface'
                  - l3out_static.connectivity_details.links | length == 1
                  - l3out_static.connectivity_details.links[0].vlan_id | int >= 1
                  - l3out_static.connectivity_details.links[0].vlan_id | int <= 4094
                  - (test_switch1_subif | string).endswith('.' ~ (l3out_static.connectivity_details.links[0].vlan_id | string))
                  - (test_switch2_subif | string).endswith('.' ~ (l3out_static.connectivity_details.links[0].vlan_id | string))
                fail_msg: "NDP_L3OUT_SUBINTERFACE_VLAN_MISMATCH: the configured subinterface names must include the authored VLAN suffix."

            - name: "[{{ test_module }}] SETUP - read external fabric BGP settings"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ nd_test_fabric2_name }}"
              register: _ndp_l3out_fabric2
              failed_when: false
              no_log: true

            - name: "[{{ test_module }}] SETUP - require external fabric ASN when missing from a BGP case"
              ansible.builtin.assert:
                that:
                  - not (_ndp_l3out_fabric2.failed | default(false) | bool)
                  - (_ndp_l3out_fabric2.current.management.bgpAsn | default('', true) | string | trim | length) > 0
                fail_msg: "NDP_L3OUT_FABRIC2_ASN_MISSING: external fabric BGP ASN could not be verified."
              loop: [l3out_bgp, l3out_bgp_updated, l3out_svi, l3out_static_replaced]
              vars:
                _ndp_l3out_case: "{{ lookup('ansible.builtin.vars', item) }}"
              when:
                - _ndp_l3out_case.configured_fabrics | default('') in ['both', 'fabric2']
                - _ndp_l3out_case.routing_details.routing_protocol | default('') == 'bgp'
                - _ndp_l3out_case.routing_details.bgp.fabric2_details.local_asn | default('', true) | string | trim | length == 0

            - name: "[{{ test_module }}] SETUP - supply missing external fabric ASN to BGP cases"
              ansible.builtin.set_fact:
                "{{ item }}": >-
                  {{ _ndp_l3out_case | combine({'routing_details': {'bgp': {'fabric2_details':
                     {'local_asn': (_ndp_l3out_fabric2.current.management.bgpAsn | string | trim)}}}}, recursive=True) }}
              loop: [l3out_bgp, l3out_bgp_updated, l3out_svi, l3out_static_replaced]
              vars:
                _ndp_l3out_case: "{{ lookup('ansible.builtin.vars', item) }}"
              when:
                - _ndp_l3out_case.configured_fabrics | default('') in ['both', 'fabric2']
                - _ndp_l3out_case.routing_details.routing_protocol | default('') == 'bgp'
                - _ndp_l3out_case.routing_details.bgp.fabric2_details.local_asn | default('', true) | string | trim | length == 0
              no_log: true

            - name: "[{{ test_module }}] SETUP - resolve route maps referenced by the original cases"
              ansible.builtin.set_fact:
                _ndp_l3out_route_maps: >-
                  {{ [l3out_bgp.routing_details, l3out_bgp_updated.routing_details, l3out_svi.routing_details] | to_json
                     | regex_findall('"ipv[46]_route_map_(?:in|out)": ?"([^"]+)"') | unique | list }}

            - name: "[{{ test_module }}] SETUP - list the route maps already in {{ nd_test_fabric1_name }}"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ nd_test_fabric1_name }}/routeMaps"
              register: _ndp_l3out_route_maps_live
              no_log: true

            - name: "[{{ test_module }}] SETUP - create only the missing route maps (existing ones are never modified)"
              ansible.builtin.set_fact:
                _ndp_l3out_route_maps_created: >-
                  {{ _ndp_l3out_route_maps | difference(
                       (_ndp_l3out_route_maps_live.current.routeMaps | default(_ndp_l3out_route_maps_live.current.items | default([])))
                       | map(attribute='name') | list) }}

            - name: "[{{ test_module }}] SETUP - create the route maps the l3out vars reference"
              cisco.nd.nd_manage_route_map:
                fabric_name: "{{ nd_test_fabric1_name }}"
                config: >-
                  {{ _ndp_l3out_route_maps_created
                     | map('community.general.dict_kv', 'name') | list
                     | map('combine', {'entries': [{'sequence_number': 10, 'action': 'permit',
                                                     'rule_entries': [{'rule_type': 'setLocalPreference', 'value': 100}]}]})
                     | list }}
                state: merged
              when: _ndp_l3out_route_maps_created | length > 0

        # -------------------------------------------------------------------------
        # SETUP (nd_manage_l3out SVI case): require the discovered physical path,
        # manage the ext_l2_dci_link on it, then verify both deployed endpoints.
        - name: "[{{ test_module }}] SETUP - deploy the stored L2 DCI endpoint intent the SVI case uses"
          when:
            - test_module == 'nd_manage_l3out'
            - not (nd_prerequisite_only | default(false) | bool)
            - (l3out_svi | default({})).connectivity_details.routing_interface_type | default('') == 'svi'
          vars:
            _ndp_l2dci_oper: "{{ _ndp_l2dci_current.operData | default({}, true) }}"
            _ndp_l2dci_vlan_range: "{{ _ndp_l2dci_oper.vlanRange | default('', true) | string | lower | regex_replace('\\s+', '') }}"
            _ndp_l2dci_vlan_list_reported: >-
              {{ _ndp_l2dci_vlan_range in ['all', 'none']
                 or _ndp_l2dci_vlan_range is match('^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$') }}
            _ndp_l2dci_vlan_allowed: >-
              {%- set result = namespace(allowed=_ndp_l2dci_vlan_range == 'all') -%}
              {%- if _ndp_l2dci_vlan_list_reported | bool and _ndp_l2dci_vlan_range not in ['all', 'none'] -%}
                {%- for token in _ndp_l2dci_vlan_range.split(',') -%}
                  {%- set bounds = token.split('-') | map('int') | list -%}
                  {%- if bounds[0] <= (_ndp_l2dci_vlan | int) <= bounds[-1] -%}
                    {%- set result.allowed = true -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ result.allowed }}
            _ndp_l2dci_port_trunk: >-
              {{ (_ndp_l2dci_current.switchId | default('')) == _ndp_l2dci_endpoint.serial
                 and (_ndp_l2dci_current.interfaceName | default('')) == _ndp_l2dci_endpoint.interface
                 and (_ndp_l2dci_oper.mode | default('')) == 'trunk'
                 and (_ndp_l2dci_oper.adminStatus | default('')) == 'up' }}
            _ndp_l2dci_port_ready: >-
              {{ (_ndp_l2dci_port_trunk | bool)
                 and (_ndp_l2dci_oper.operationalStatus | default('')) == 'up'
                 and (_ndp_l2dci_vlan_allowed | bool) }}
          block:
            - name: "[{{ test_module }}] SETUP - resolve the authored SVI switch pair"
              ansible.builtin.set_fact:
                _ndp_l2dci_fabric1: "{{ l3out_svi.fabric1_name | default('') | string }}"
                _ndp_l2dci_fabric_by_switch: >-
                  {{ {(_ndp_l2dci_case_link.switch1_details.switch_id | default('') | string): (l3out_svi.fabric1_name | default('') | string),
                      (_ndp_l2dci_case_link.switch2_details.switch_id | default('') | string): (l3out_svi.fabric2_name | default('') | string)} }}
                _ndp_l2dci_switch1: "{{ _ndp_l2dci_case_link.switch1_details.switch_id | default('') | string }}"
                _ndp_l2dci_switch2: "{{ _ndp_l2dci_case_link.switch2_details.switch_id | default('') | string }}"
                _ndp_l2dci_vlan: "{{ _ndp_l2dci_case_link.vlan_id | default(0) | int }}"
                _ndp_l2dci_interface1: "{{ nd_l3out_l2dci_switch1_interface | default('Ethernet1/4') }}"
                _ndp_l2dci_interface2: "{{ nd_l3out_l2dci_switch2_interface | default('Ethernet1/4') }}"
                _ndp_l2dci_physical_matches: []
                _ndp_l2dci_matches: []
                _ndp_l2dci_endpoints: []
                _ndp_l2dci_state: []
                _ndp_l2dci_pending: []
                _ndp_l2dci_port_status: []
                _ndp_l2dci_physical_readable: false
              vars:
                _ndp_l2dci_case_link: "{{ l3out_svi.connectivity_details.links | default([], true) | first | default({}, true) }}"

            - name: "[{{ test_module }}] SETUP - require the authored SVI endpoints and VLAN"
              ansible.builtin.assert:
                that:
                  - _ndp_l2dci_fabric_by_switch | length == 2
                  - "'' not in _ndp_l2dci_fabric_by_switch"
                  - "'' not in (_ndp_l2dci_fabric_by_switch.values() | list)"
                  - 1 <= (_ndp_l2dci_vlan | int) <= 4094
                fail_msg: "NDP_L3OUT_L2DCI_PREREQUISITE_FAILED: the authored SVI requires two switches, two fabric endpoints, and a valid VLAN."

            - name: "[{{ test_module }}] SETUP - read discovered physical links for the SVI fabric"
              cisco.nd.nd_rest:
                method: get
                path: "/appcenter/cisco/ndfc/api/v1/lan-fabric/rest/control/links?fabric={{ _ndp_l2dci_fabric1 }}"
              register: _ndp_l2dci_links
              no_log: true

            - name: "[{{ test_module }}] SETUP - select the exact discovered physical SVI cable"
              ansible.builtin.set_fact:
                _ndp_l2dci_physical_readable: "{{ _ndp_l2dci_rows is not string and _ndp_l2dci_rows is iterable and _ndp_l2dci_rows is not mapping }}"
                _ndp_l2dci_physical_matches: >-
                  {{ ([] if (_ndp_l2dci_rows is string or _ndp_l2dci_rows is not iterable or _ndp_l2dci_rows is mapping) else _ndp_l2dci_rows)
                     | select('mapping')
                     | selectattr('link-type', 'defined') | selectattr('link-type', 'equalto', 'ethisl')
                     | selectattr('sw1-info.sw-serial-number', 'defined')
                     | selectattr('sw2-info.sw-serial-number', 'defined')
                     | selectattr('sw1-info.if-name', 'defined')
                     | selectattr('sw2-info.if-name', 'defined')
                     | selectattr('sw1-info.sw-serial-number', 'equalto', _ndp_l2dci_switch1)
                     | selectattr('sw2-info.sw-serial-number', 'equalto', _ndp_l2dci_switch2)
                     | selectattr('sw1-info.if-name', 'equalto', _ndp_l2dci_interface1)
                     | selectattr('sw2-info.if-name', 'equalto', _ndp_l2dci_interface2)
                     | list
                     +
                     (([] if (_ndp_l2dci_rows is string or _ndp_l2dci_rows is not iterable or _ndp_l2dci_rows is mapping) else _ndp_l2dci_rows)
                      | select('mapping')
                      | selectattr('link-type', 'defined') | selectattr('link-type', 'equalto', 'ethisl')
                      | selectattr('sw1-info.sw-serial-number', 'defined')
                      | selectattr('sw2-info.sw-serial-number', 'defined')
                      | selectattr('sw1-info.if-name', 'defined')
                      | selectattr('sw2-info.if-name', 'defined')
                      | selectattr('sw1-info.sw-serial-number', 'equalto', _ndp_l2dci_switch2)
                      | selectattr('sw2-info.sw-serial-number', 'equalto', _ndp_l2dci_switch1)
                      | selectattr('sw1-info.if-name', 'equalto', _ndp_l2dci_interface2)
                      | selectattr('sw2-info.if-name', 'equalto', _ndp_l2dci_interface1)
                      | list) }}
              vars:
                _ndp_l2dci_rows: >-
                  {{ _ndp_l2dci_links.current.DATA
                     if ((_ndp_l2dci_links.current | default('')) is mapping and _ndp_l2dci_links.current.DATA is defined)
                     else (_ndp_l2dci_links.current.links
                           if ((_ndp_l2dci_links.current | default('')) is mapping and _ndp_l2dci_links.current.links is defined)
                           else _ndp_l2dci_links.current | default('')) }}

            - name: "[{{ test_module }}] SETUP - require one discovered physical path for the L2 DCI link"
              ansible.builtin.assert:
                that:
                  - _ndp_l2dci_physical_readable | bool
                  - _ndp_l2dci_physical_matches | length == 1
                fail_msg: >-
                  NDP_L3OUT_L2DCI_PREREQUISITE_FAILED: expected exactly one discovered physical
                  ethisl adjacency between {{ _ndp_l2dci_switch1 }}/{{ _ndp_l2dci_interface1 }} and
                  {{ _ndp_l2dci_switch2 }}/{{ _ndp_l2dci_interface2 }}; found
                  {{ _ndp_l2dci_physical_matches | length }}. No logical link or interface intent was changed.

            - name: "[{{ test_module }}] SETUP - ensure the SVI ext_l2_dci_link on the discovered cable"
              cisco.nd.nd_manage_links:
                fabric_name: "{{ _ndp_l2dci_fabric1 }}"
                link_scope: manage
                config:
                  - src_fabric_name: "{{ l3out_svi.fabric1_name }}"
                    dst_fabric_name: "{{ l3out_svi.fabric2_name }}"
                    src_switch_id: "{{ _ndp_l2dci_switch1 }}"
                    dst_switch_id: "{{ _ndp_l2dci_switch2 }}"
                    src_interface_name: "{{ _ndp_l2dci_interface1 }}"
                    dst_interface_name: "{{ _ndp_l2dci_interface2 }}"
                    config_data:
                      policy_type: layer2Dci
                      template_inputs:
                        trunk_allowed_vlans: "{{ ([100, 200, 300, _ndp_l2dci_vlan | int] | unique | sort) | join(',') }}"
                        native_vlan: 1
                        port_type_fast: true
                        mtu_type: jumbo
                        speed: auto
                        bpdu_guard: default
                state: merged
              when: nd_l3out_deploy_l2dci_endpoints | default(true) | bool

            - &ndp_read_l2dci_link
              name: "[{{ test_module }}] SETUP - read the managed SVI L2 DCI link"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/links?fabricName={{ _ndp_l2dci_fabric1 }}"
              register: _ndp_l2dci_managed_links
              failed_when: false
              no_log: true

            - &ndp_select_l2dci_link
              name: "[{{ test_module }}] SETUP - select the managed layer2Dci link for the exact cable"
              ansible.builtin.set_fact:
                _ndp_l2dci_matches: >-
                  {{ ([] if (_ndp_l2dci_rows is string or _ndp_l2dci_rows is not iterable or _ndp_l2dci_rows is mapping) else _ndp_l2dci_rows)
                     | select('mapping')
                     | selectattr('configData', 'defined') | selectattr('configData', 'mapping')
                     | selectattr('configData.policyType', 'defined')
                     | selectattr('configData.policyType', 'equalto', 'layer2Dci')
                     | selectattr('srcFabricName', 'defined') | selectattr('dstFabricName', 'defined')
                     | selectattr('srcFabricName', 'equalto', l3out_svi.fabric1_name)
                     | selectattr('dstFabricName', 'equalto', l3out_svi.fabric2_name)
                     | selectattr('srcSwitchId', 'defined') | selectattr('dstSwitchId', 'defined')
                     | selectattr('srcInterfaceName', 'defined') | selectattr('dstInterfaceName', 'defined')
                     | selectattr('srcSwitchId', 'equalto', _ndp_l2dci_switch1)
                     | selectattr('dstSwitchId', 'equalto', _ndp_l2dci_switch2)
                     | selectattr('srcInterfaceName', 'equalto', _ndp_l2dci_interface1)
                     | selectattr('dstInterfaceName', 'equalto', _ndp_l2dci_interface2)
                     | list
                     +
                     (([] if (_ndp_l2dci_rows is string or _ndp_l2dci_rows is not iterable or _ndp_l2dci_rows is mapping) else _ndp_l2dci_rows)
                      | select('mapping')
                      | selectattr('configData', 'defined') | selectattr('configData', 'mapping')
                      | selectattr('configData.policyType', 'defined')
                      | selectattr('configData.policyType', 'equalto', 'layer2Dci')
                      | selectattr('srcFabricName', 'defined') | selectattr('dstFabricName', 'defined')
                      | selectattr('srcFabricName', 'equalto', l3out_svi.fabric2_name)
                      | selectattr('dstFabricName', 'equalto', l3out_svi.fabric1_name)
                      | selectattr('srcSwitchId', 'defined') | selectattr('dstSwitchId', 'defined')
                      | selectattr('srcInterfaceName', 'defined') | selectattr('dstInterfaceName', 'defined')
                      | selectattr('srcSwitchId', 'equalto', _ndp_l2dci_switch2)
                      | selectattr('dstSwitchId', 'equalto', _ndp_l2dci_switch1)
                      | selectattr('srcInterfaceName', 'equalto', _ndp_l2dci_interface2)
                      | selectattr('dstInterfaceName', 'equalto', _ndp_l2dci_interface1)
                      | list) }}
              vars:
                _ndp_l2dci_rows: >-
                  {{ _ndp_l2dci_managed_links.current.links
                     if ((_ndp_l2dci_managed_links.current | default('')) is mapping and _ndp_l2dci_managed_links.current.links is defined)
                     else '' }}

            - name: "[{{ test_module }}] SETUP - verify the managed link before deploying either endpoint"
              ansible.builtin.assert:
                that:
                  - _ndp_l2dci_matches | length == 1
                fail_msg: >-
                  NDP_L3OUT_L2DCI_PREREQUISITE_FAILED: expected one managed layer2Dci link for the
                  declared fabrics and cable; found {{ _ndp_l2dci_matches | length }}.

            - name: "[{{ test_module }}] SETUP - name both endpoints of the single matching link"
              ansible.builtin.set_fact:
                _ndp_l2dci_endpoints:
                  - name: "{{ _ndp_l2dci_link.srcSwitchName | default('switch1') if _ndp_l2dci_link.srcSwitchId == _ndp_l2dci_switch1 else _ndp_l2dci_link.dstSwitchName | default('switch1') }}"
                    fabric: "{{ _ndp_l2dci_fabric_by_switch[_ndp_l2dci_switch1] }}"
                    serial: "{{ _ndp_l2dci_switch1 }}"
                    interface: "{{ _ndp_l2dci_interface1 }}"
                  - name: "{{ _ndp_l2dci_link.dstSwitchName | default('switch2') if _ndp_l2dci_link.dstSwitchId == _ndp_l2dci_switch2 else _ndp_l2dci_link.srcSwitchName | default('switch2') }}"
                    fabric: "{{ _ndp_l2dci_fabric_by_switch[_ndp_l2dci_switch2] }}"
                    serial: "{{ _ndp_l2dci_switch2 }}"
                    interface: "{{ _ndp_l2dci_interface2 }}"
              vars:
                _ndp_l2dci_link: "{{ _ndp_l2dci_matches | first }}"
              when:
                - _ndp_l2dci_matches | length == 1
                - _ndp_l2dci_matches[0].srcSwitchId != _ndp_l2dci_matches[0].dstSwitchId

            - name: "[{{ test_module }}] SETUP - read each L2 DCI endpoint's stored intent and switch-reported mode"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ item.fabric }}/switches/{{ item.serial }}/interfaces/{{ item.interface | replace('/', '%2F') }}"
              loop: "{{ _ndp_l2dci_endpoints }}"
              register: _ndp_l2dci_before
              failed_when: false
              no_log: true

            - name: "[{{ test_module }}] SETUP - classify each L2 DCI endpoint before any deploy"
              ansible.builtin.set_fact:
                _ndp_l2dci_state: >-
                  {{ _ndp_l2dci_state + [item.item | combine({
                       'intent_trunk': _ndp_l2dci_intent_ok | bool,
                       'needs_deploy': not (_ndp_l2dci_port_trunk | bool)
                           or ((_ndp_l2dci_oper.operationalStatus | default('')) == 'up'
                               and (_ndp_l2dci_vlan_list_reported | bool)
                               and not (_ndp_l2dci_vlan_allowed | bool))})] }}
              loop: "{{ _ndp_l2dci_before.results | default([]) }}"
              vars:
                _ndp_l2dci_endpoint: "{{ item.item }}"
                _ndp_l2dci_current: "{{ item.current if (item.current | default('')) is mapping else {} }}"
                _ndp_l2dci_intent_ok: >-
                  {{ (_ndp_l2dci_current.switchId | default('')) == item.item.serial
                     and (_ndp_l2dci_current.interfaceName | default('')) == item.item.interface
                     and (_ndp_l2dci_current.configData.mode | default('')) == 'trunk'
                     and (_ndp_l2dci_current.configData.networkOS.policy.policyType | default('')) == 'l2DciLinkMember'
                     and (_ndp_l2dci_current.configData.networkOS.policy.adminState | default(false) | bool) }}
              no_log: true

            - name: "[{{ test_module }}] SETUP - require enabled L2 DCI trunk intent on both endpoints"
              ansible.builtin.assert:
                that:
                  - _ndp_l2dci_state | length == 2
                  - _ndp_l2dci_state | rejectattr('intent_trunk') | list | length == 0
                fail_msg: "NDP_L3OUT_L2DCI_PREREQUISITE_FAILED: stored intent is not an enabled l2DciLinkMember trunk on both endpoints."

            - name: "[{{ test_module }}] SETUP - select endpoints whose stored trunk intent is not on the switch"
              ansible.builtin.set_fact:
                _ndp_l2dci_pending: "{{ _ndp_l2dci_state | selectattr('needs_deploy') | list }}"
              when: nd_l3out_deploy_l2dci_endpoints | default(true) | bool

            # interfaceActions/deploy can return HTTP 207 after accepting the request.
            # Verify the outcome using both ports' operational readback.
            - name: "[{{ test_module }}] SETUP - deploy the stored trunk intent of unconverged L2 DCI endpoints"
              cisco.nd.nd_rest:
                method: post
                path: "/api/v1/manage/fabrics/{{ item.fabric }}/interfaceActions/deploy"
                content:
                  interfaces:
                    - interfaceName: "{{ item.interface }}"
                      switchId: "{{ item.serial }}"
              loop: "{{ _ndp_l2dci_pending }}"
              failed_when: false
              no_log: true

            # Read both ports again, including ports that needed no deployment.
            # Keep exhausted results so the assertion can report each endpoint.
            - name: "[{{ test_module }}] SETUP - wait for the switch to report the deployed trunk endpoints"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ item.fabric }}/switches/{{ item.serial }}/interfaces/{{ item.interface | replace('/', '%2F') }}"
              loop: "{{ _ndp_l2dci_endpoints }}"
              register: _ndp_l2dci_after
              retries: "{{ nd_l3out_l2dci_retries | default(12) | int }}"
              delay: "{{ nd_l3out_l2dci_delay | default(10) | int }}"
              vars:
                _ndp_l2dci_endpoint: "{{ item }}"
                _ndp_l2dci_current: "{{ _ndp_l2dci_after.current if (_ndp_l2dci_after.current | default('')) is mapping else {} }}"
              until: >-
                (_ndp_l2dci_port_ready | bool)
                or (_ndp_l2dci_after.attempts | default(0) | int) >= (nd_l3out_l2dci_retries | default(12) | int)
              failed_when: false
              no_log: true

            - name: "[{{ test_module }}] SETUP - summarize the operational trunk and VLAN readback"
              ansible.builtin.set_fact:
                _ndp_l2dci_port_status: >-
                  {{ _ndp_l2dci_port_status + [{
                       'port': item.item.name ~ ' ' ~ item.item.interface,
                       'mode': _ndp_l2dci_oper.mode | default('unknown', true),
                       'admin': _ndp_l2dci_oper.adminStatus | default('unknown', true),
                       'oper': _ndp_l2dci_oper.operationalStatus | default('unknown', true),
                       'vlans': _ndp_l2dci_vlan_range if (_ndp_l2dci_vlan_list_reported | bool) else 'unreported',
                       'ready': _ndp_l2dci_port_ready | bool}] }}
              loop: "{{ _ndp_l2dci_after.results | default([]) }}"
              vars:
                _ndp_l2dci_endpoint: "{{ item.item }}"
                _ndp_l2dci_current: "{{ item.current if (item.current | default('')) is mapping else {} }}"
              no_log: true

            - *ndp_read_l2dci_link
            - *ndp_select_l2dci_link

            # The compact Jenkins callback keeps task names but drops successful result messages.
            - name: >-
                [{{ test_module }}] SETUP - verify L2 DCI readiness
                {{ _ndp_l2dci_summary if _ndp_l2dci_port_status is defined else '' }}
              ansible.builtin.assert:
                that:
                  - _ndp_l2dci_matches | length == 1
                  - _ndp_l2dci_link.linkPresent | default(false) == true
                  - not (_ndp_l2dci_link.linkPlanned | default(false) | bool)
                  - _ndp_l2dci_link.linkState | default('') not in ['down', 'shutdown']
                  - _ndp_l2dci_port_status | length == 2
                  - _ndp_l2dci_port_status | rejectattr('ready') | list | length == 0
                fail_msg: "NDP_L3OUT_L2DCI_ENDPOINTS_UNVERIFIED: {{ _ndp_l2dci_summary }}"
                success_msg: "NDP_L3OUT_L2DCI_ENDPOINTS_OK: {{ _ndp_l2dci_summary }}"
              vars:
                _ndp_l2dci_link: "{{ _ndp_l2dci_matches | first | default({}) }}"
                _ndp_l2dci_summary: >-
                  VLAN {{ _ndp_l2dci_vlan }}; matching links={{ _ndp_l2dci_matches | length }};
                  present={{ _ndp_l2dci_link.linkPresent | default('unknown') }};
                  planned={{ _ndp_l2dci_link.linkPlanned | default('unknown') }};
                  link state={{ _ndp_l2dci_link.linkState | default('unreported', true) }};
                  deployed={{ _ndp_l2dci_pending | length }};
                  endpoints={{ _ndp_l2dci_port_status | to_json }}.

        # -------------------------------------------------------------------------
        # SETUP (vPC interface targets): prepare the declared physical fixture over the cabled
        # leaf_1 Eth1/2 <-> leaf_2 Eth1/1 peer-link. The original target retains ownership of its
        # own setup and teardown; no runner flag bypasses those tasks. The target's multi-pair
        # scenario asserts a SECOND pair, so the runner also forms leaf_3/leaf_4 over their cabled Eth1/1 + Eth1/2
        # peer-links. The CLEANUP unpairs what this run created because the destructive nd_manage_switches module
        # runs later in the same job.
        - name: "[{{ test_module }}] SETUP - standing physical vPC pair for the vPC interface target"
          when: test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host'] and not (nd_prerequisite_only | default(false) | bool)
          block:
            - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the target runs"
              cisco.nd.nd_manage_vpc_pair:
                fabric_name: "{{ ansible_it_fabric }}"
                state: gathered
              register: _ndp_vpcif_pairs_before

            - name: "[{{ test_module }}] SETUP - record whether the pair pre-existed"
              ansible.builtin.set_fact:
                _ndp_vpcif_pair_preexisting: >-
                  {{ ((_ndp_vpcif_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_before.vpc_pairs | default([])))
                     | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                     | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2])
                     | selectattr('peerSwitchId', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
                     or ((_ndp_vpcif_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif_pairs_before.vpc_pairs | default([])))
                     | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                     | selectattr('switch_id', 'in', [ansible_sno_1, ansible_sno_2])
                     | selectattr('peer_switch_id', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0 }}

            - name: "[{{ test_module }}] SETUP - wait until ND reports the physical peer-link as present"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
              register: _ndp_vpcif_peer_link
              retries: 12
              delay: 15
              until: >-
                {{ (_ndp_vpcif_peer_link.current.links | default([]))
                   | selectattr('srcSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
                   | selectattr('dstSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
                   | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
              failed_when: false
              no_log: true
              when: not (_ndp_vpcif_pair_preexisting | bool)

            - name: "[{{ test_module }}] SETUP - create the physical vPC pair"
              cisco.nd.nd_manage_vpc_pair:
                fabric_name: "{{ ansible_it_fabric }}"
                state: merged
                config_actions: {save: true, deploy: true, type: switch}
                config:
                  - peer1_switch_id: "{{ ansible_sno_1 }}"
                    peer2_switch_id: "{{ ansible_sno_2 }}"
                    use_virtual_peer_link: false
              when: not (_ndp_vpcif_pair_preexisting | bool)

            # Same convergence pause the targets' own setup uses after forming a pair.
            - name: "[{{ test_module }}] SETUP - pause for pair-establishment convergence"
              ansible.builtin.pause:
                seconds: 30
              when: not (_ndp_vpcif_pair_preexisting | bool)

            # nd_manage_vpc_pair state=gathered returns an empty vpc_pairs list on develop even while ND lists the pair (build
            # 196; reproduced offline at 9fde9f7 and 57406c7), so polling it can never prove the pair. Prove it the way the
            # target's multi-pair precondition does: reciprocal per-switch vpcPair records. The attempts clause ends the poll
            # without Ansible's retry-exhaustion failure; the assertion below names what is missing. The pre-existence reads
            # above deliberately stay on the module's stale-filtered view: while it is empty the runner always forms and later
            # removes the pair, whereas a vpcPair record can briefly outlive an unpair and would wrongly skip the create.
            - name: "[{{ test_module }}] SETUP - wait for reciprocal vpcPair records of the formed pair"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches/{{ item.0 }}/vpcPair"
              loop: "{{ [[ansible_sno_1, ansible_sno_2], [ansible_sno_2, ansible_sno_1]] }}"
              register: _ndp_vpcif_pairs_after
              retries: 8
              delay: 15
              until: >-
                ((_ndp_vpcif_pairs_after.current | default({}, true)).switchId | default('')) == item.0
                and ((_ndp_vpcif_pairs_after.current | default({}, true)).peerSwitchId | default('')) == item.1
                or (_ndp_vpcif_pairs_after.attempts | default(0) | int) >= 8
              failed_when: false
              no_log: true

            - name: "[{{ test_module }}] SETUP - require the leaf pair before the target starts"
              ansible.builtin.assert:
                that:
                  - >-
                    (_ndp_vpcif_pairs_after.results | default([]) | map(attribute='current.switchId', default='') | list)
                    == [ansible_sno_1, ansible_sno_2]
                  - >-
                    (_ndp_vpcif_pairs_after.results | default([]) | map(attribute='current.peerSwitchId', default='') | list)
                    == [ansible_sno_2, ansible_sno_1]
                fail_msg: >-
                  The physical vPC pair {{ ansible_sno_1 }}/{{ ansible_sno_2 }} does not exist in {{ ansible_it_fabric }} after the
                  runner formed it; the vPC interface target needs it as substrate. vpcPair records:
                  {% for r in _ndp_vpcif_pairs_after.results | default([]) %}{{ r.item.0 | default('?') }} -> peer={{
                  (r.current | default({}, true)).peerSwitchId | default('none', true) }} (http {{ r.status | default('n/a') }}){{
                  '' if loop.last else ', ' }}{% endfor %}.

            - name: "[{{ test_module }}] SETUP - map the declared vPC peer management IPs"
              ansible.builtin.set_fact:
                nd_test_vpc_peer1_ip: "{{ ansible_switch1 }}"
                nd_test_vpc_peer2_ip: "{{ ansible_switch2 }}"

            # Second pair (leaf_3/leaf_4): the targets' multi-pair scenario asserts that it exists with reciprocal vpcPair records
            # and never creates it, so the runner forms it exactly like the first pair. Its switches are looked up in the roster
            # by the nd_test_vpc_pair2_peer*_ip management IPs the target reads, so the pair, the roster and the target agree.
            - name: "[{{ test_module }}] SETUP - resolve the second vPC pair from the roster"
              ansible.builtin.set_fact:
                _ndp_vpcif2_sno_1: >-
                  {{ ((nd_test_fabric_switches[ansible_it_fabric] | default([]))
                      | selectattr('seed_ip', 'equalto', nd_test_vpc_pair2_peer1_ip)
                      | map(attribute='serial') | list + ['']) | first }}
                _ndp_vpcif2_sno_2: >-
                  {{ ((nd_test_fabric_switches[ansible_it_fabric] | default([]))
                      | selectattr('seed_ip', 'equalto', nd_test_vpc_pair2_peer2_ip)
                      | map(attribute='serial') | list + ['']) | first }}

            - name: "[{{ test_module }}] SETUP - require two distinct roster switches for the second pair"
              ansible.builtin.assert:
                that:
                  - _ndp_vpcif2_sno_1 | length > 0
                  - _ndp_vpcif2_sno_2 | length > 0
                  - _ndp_vpcif2_sno_1 != _ndp_vpcif2_sno_2
                  - ([_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2] | intersect([ansible_sno_1, ansible_sno_2])) | length == 0
                fail_msg: >-
                  The second vPC pair {{ nd_test_vpc_pair2_peer1_ip }}/{{ nd_test_vpc_pair2_peer2_ip }} must resolve to two distinct
                  {{ ansible_it_fabric }} roster switches that are not the first pair; got serials
                  '{{ _ndp_vpcif2_sno_1 }}'/'{{ _ndp_vpcif2_sno_2 }}'.

            - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the second pair is formed"
              cisco.nd.nd_manage_vpc_pair:
                fabric_name: "{{ ansible_it_fabric }}"
                state: gathered
              register: _ndp_vpcif2_pairs_before

            - name: "[{{ test_module }}] SETUP - record whether the second pair pre-existed"
              ansible.builtin.set_fact:
                _ndp_vpcif2_pair_preexisting: >-
                  {{ ((_ndp_vpcif2_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_before.vpc_pairs | default([])))
                     | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                     | selectattr('switchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                     | selectattr('peerSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0
                     or ((_ndp_vpcif2_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_vpcif2_pairs_before.vpc_pairs | default([])))
                     | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                     | selectattr('switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                     | selectattr('peer_switch_id', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]) | list | length > 0 }}

            - name: "[{{ test_module }}] SETUP - wait until ND reports the second pair's physical peer-link as present"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
              register: _ndp_vpcif2_peer_link
              retries: 12
              delay: 15
              until: >-
                {{ (_ndp_vpcif2_peer_link.current.links | default([]))
                   | selectattr('srcSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                   | selectattr('dstSwitchId', 'in', [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                   | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
              failed_when: false
              no_log: true
              when: not (_ndp_vpcif2_pair_preexisting | bool)

            - name: "[{{ test_module }}] SETUP - create the second physical vPC pair"
              cisco.nd.nd_manage_vpc_pair:
                fabric_name: "{{ ansible_it_fabric }}"
                state: merged
                config_actions: {save: true, deploy: true, type: switch}
                config:
                  - peer1_switch_id: "{{ _ndp_vpcif2_sno_1 }}"
                    peer2_switch_id: "{{ _ndp_vpcif2_sno_2 }}"
                    use_virtual_peer_link: false
              when: not (_ndp_vpcif2_pair_preexisting | bool)

            - name: "[{{ test_module }}] SETUP - pause for second-pair establishment convergence"
              ansible.builtin.pause:
                seconds: 30
              when: not (_ndp_vpcif2_pair_preexisting | bool)

            # Same reciprocal vpcPair proof as the first pair; it is exactly the target's multi-pair precondition.
            - name: "[{{ test_module }}] SETUP - wait for reciprocal vpcPair records of the second formed pair"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches/{{ item.0 }}/vpcPair"
              loop: "{{ [[_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2], [_ndp_vpcif2_sno_2, _ndp_vpcif2_sno_1]] }}"
              register: _ndp_vpcif2_pairs_after
              retries: 8
              delay: 15
              until: >-
                ((_ndp_vpcif2_pairs_after.current | default({}, true)).switchId | default('')) == item.0
                and ((_ndp_vpcif2_pairs_after.current | default({}, true)).peerSwitchId | default('')) == item.1
                or (_ndp_vpcif2_pairs_after.attempts | default(0) | int) >= 8
              failed_when: false
              no_log: true

            - name: "[{{ test_module }}] SETUP - require the second leaf pair before the target starts"
              ansible.builtin.assert:
                that:
                  - >-
                    (_ndp_vpcif2_pairs_after.results | default([]) | map(attribute='current.switchId', default='') | list)
                    == [_ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2]
                  - >-
                    (_ndp_vpcif2_pairs_after.results | default([]) | map(attribute='current.peerSwitchId', default='') | list)
                    == [_ndp_vpcif2_sno_2, _ndp_vpcif2_sno_1]
                fail_msg: >-
                  The physical vPC pair {{ _ndp_vpcif2_sno_1 }}/{{ _ndp_vpcif2_sno_2 }} does not exist in {{ ansible_it_fabric }} after
                  the runner formed it; the vPC interface target's multi-pair scenario needs it as its second pair. vpcPair records:
                  {% for r in _ndp_vpcif2_pairs_after.results | default([]) %}{{ r.item.0 | default('?') }} -> peer={{
                  (r.current | default({}, true)).peerSwitchId | default('none', true) }} (http {{ r.status | default('n/a') }}){{
                  '' if loop.last else ', ' }}{% endfor %}.

            - name: "[{{ test_module }}] SETUP - wait for all four vPC peers to be inSync before interface tests"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/fabrics/{{ ansible_it_fabric }}/switches"
              register: _ndp_vpcif_device_convergence
              retries: 24
              delay: 15
              until:
                - not (_ndp_vpcif_device_convergence.failed | default(false))
                - >-
                  (_ndp_vpcif_device_convergence.current.switches | default([])
                   | selectattr('switchId', 'defined')
                   | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2, _ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2])
                   | selectattr('additionalData', 'defined')
                   | selectattr('additionalData.configSyncStatus', 'defined')
                   | selectattr('additionalData.configSyncStatus', 'equalto', 'inSync')
                   | map(attribute='switchId') | unique | list | sort)
                  == ([ansible_sno_1, ansible_sno_2, _ndp_vpcif2_sno_1, _ndp_vpcif2_sno_2] | unique | list | sort)
              no_log: true

        # -------------------------------------------------------------------------
        # SETUP (nd_resource_manager only): the target forms a PHYSICAL vPC pair itself (ND 4.3 rejects a virtual
        # peer-link on N9K-C9300v). Before it starts, remember whether the pair already existed and give ND time to
        # report the leaf peer-link as present (the prerequisite admin-ups its two ports just before this).
        - name: "[{{ test_module }}] SETUP - vPC pair and peer-link readiness"
          when: test_module == 'nd_resource_manager' and not (nd_prerequisite_only | default(false) | bool)
          block:
            - name: "[{{ test_module }}] SETUP - gather the vPC pairs before the target runs"
              cisco.nd.nd_manage_vpc_pair:
                fabric_name: "{{ ansible_it_fabric }}"
                state: gathered
              register: _ndp_rm_pairs_before

            - name: "[{{ test_module }}] SETUP - record whether the pair pre-existed"
              ansible.builtin.set_fact:
                _ndp_rm_pair_preexisting: >-
                  {{ ((_ndp_rm_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_rm_pairs_before.vpc_pairs | default([])))
                     | selectattr('switchId', 'defined') | selectattr('peerSwitchId', 'defined')
                     | selectattr('switchId', 'in', [ansible_sno_1, ansible_sno_2])
                     | selectattr('peerSwitchId', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0
                     or ((_ndp_rm_pairs_before.gathered.vpc_pairs | default([])) + (_ndp_rm_pairs_before.vpc_pairs | default([])))
                     | selectattr('switch_id', 'defined') | selectattr('peer_switch_id', 'defined')
                     | selectattr('switch_id', 'in', [ansible_sno_1, ansible_sno_2])
                     | selectattr('peer_switch_id', 'in', [ansible_sno_1, ansible_sno_2]) | list | length > 0 }}

            - name: "[{{ test_module }}] SETUP - wait until ND reports the physical peer-link as present"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/manage/links?fabricName={{ ansible_it_fabric }}"
              register: _ndp_rm_peer_link
              retries: 12
              delay: 15
              until: >-
                {{ (_ndp_rm_peer_link.current.links | default([]))
                   | selectattr('srcSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
                   | selectattr('dstSwitchId', 'in', [ansible_sno_1, ansible_sno_2])
                   | selectattr('linkPresent', 'equalto', true) | list | length > 0 }}
              failed_when: false
              no_log: true
              when: not (_ndp_rm_pair_preexisting | bool)

            - name: "[{{ test_module }}] SETUP - peer-link readiness verdict"
              ansible.builtin.debug:
                msg: >-
                  NDP_RM_PEER_LINK {{ 'present' if ((_ndp_rm_peer_link.current.links | default([]))
                  | selectattr('linkPresent', 'equalto', true) | list | length > 0) else 'NOT reported present by ND (the target may fail creating the pair)' }}
                  (pair pre-existing: {{ _ndp_rm_pair_preexisting }}).
              when: not (_ndp_rm_pair_preexisting | bool)
      rescue:
        - name: "[{{ test_module }}] SETUP - record the L3Out fixture failure for the run gate"
          ansible.builtin.set_fact:
            _ndp_l3out_fixture_failure: "{{ ansible_failed_task.name | default('unknown task', true) | truncate(200) }}"
          when: test_module == 'nd_manage_l3out'

        - name: "[{{ test_module }}] SETUP - record the failed pipeline fixture and continue to the authored target"
          ansible.builtin.set_fact:
            _ndp_continued_failures: >-
              {{ _ndp_continued_failures | default([])
                 + ['fixture: ' ~ (ansible_failed_task.name | default('unknown task', true) | string | truncate(200))] }}
          when: test_module != 'nd_manage_l3out'

        - name: "[{{ test_module }}] SETUP - report the failed pipeline fixture and continue to the authored target"
          ansible.builtin.debug:
            msg: >-
              NDP_PREREQUISITE_FAILED_CONTINUING [{{ test_module }}]: pipeline fixture failed at
              '{{ ansible_failed_task.name | default('unknown task', true) }}'; running the authored target anyway.
          when: test_module != 'nd_manage_l3out'

    # -------------------------------------------------------------------------
    # SETUP (nd_local_user only, read-only): the target's overridden step deletes every controller local user that is not in its
    # config, and its first asserts expect admin to be the only user. Read the local users first and start the target only while the
    # logins are admin plus, at most, leftovers of the target's own three test logins (it deletes those itself before it starts).
    # This observation is informational only: the requested policy runs every
    # selected module even when a precheck finds unexpected lab state.
    - name: "[{{ test_module }}] SETUP - read the controller local users"
      cisco.nd.nd_rest:
        method: get
        path: /api/v1/infra/aaa/localUsers
      register: _ndp_lu_live
      check_mode: false
      no_log: true
      failed_when: false
      when: test_module == 'nd_local_user' and not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] SETUP - find the logins this test does not own"
      ansible.builtin.set_fact:
        _ndp_lu_logins: "{{ (_ndp_lu_live.current.localusers | default([])) | map(attribute='loginID') | list }}"
        _ndp_lu_foreign: >-
          {{ (_ndp_lu_live.current.localusers | default([])) | map(attribute='loginID')
             | reject('in', ['admin', 'ansible_local_user', 'ansible_local_user_2', 'ansible_local_user_3']) | list }}
      when: test_module == 'nd_local_user' and not (nd_prerequisite_only | default(false) | bool)

    # -------------------------------------------------------------------------
    # SETUP (nd_maintenance_mode only, read-only): the target moves two switches to maintenance and back. It stops before any change when
    # a switch is in migration mode and when an IP is not in the fabric, so prove both switches are present and not migrating first.
    - name: "[{{ test_module }}] SETUP - precheck the maintenance-mode switches"
      when: test_module == 'nd_maintenance_mode' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - read the live switches for the maintenance-mode precheck"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_live
          check_mode: false
          no_log: true

        - name: "[{{ test_module }}] SETUP - select the two switches by management IP"
          ansible.builtin.set_fact:
            _ndp_mm_switches: >-
              {{ (_ndp_mm_live.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b]) | list }}

        - name: "[{{ test_module }}] SETUP - require both switches present and not migrating"
          ansible.builtin.assert:
            that:
              - _ndp_mm_switches | length == 2
              - (_ndp_mm_switches | map(attribute='additionalData.systemMode', default='') | map('lower') | select('equalto', 'migration') | list | length) == 0
              - (_ndp_mm_switches | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | select('equalto', 'migration') | list | length) == 0
            fail_msg: >-
              NDP_MAINT_PRECHECK_FAIL: nd_maintenance_mode needs {{ nd_test_maintenance_mode_switch_ip_a }} and
              {{ nd_test_maintenance_mode_switch_ip_b }} in {{ nd_test_maintenance_mode_fabric_name }}, neither in migration mode; found
              {{ _ndp_mm_switches | map(attribute='fabricManagementIp') | list }} with system modes
              {{ _ndp_mm_switches | map(attribute='additionalData.systemMode', default='') | list }} and intended modes
              {{ _ndp_mm_switches | map(attribute='additionalData.intendedSystemMode', default='') | list }}.
            success_msg: >-
              NDP_MAINT_PRECHECK_OK {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} are present in
              {{ nd_test_maintenance_mode_fabric_name }} and not migrating; the target forces both to normal first.
      rescue:
        - name: "[{{ test_module }}] SETUP - record the failed maintenance-mode precheck and continue to the authored target"
          ansible.builtin.set_fact:
            _ndp_continued_failures: >-
              {{ _ndp_continued_failures | default([])
                 + ['fixture: ' ~ (ansible_failed_task.name | default('unknown task', true) | string | truncate(200))] }}

        - name: "[{{ test_module }}] SETUP - report the failed maintenance-mode precheck and continue to the authored target"
          ansible.builtin.debug:
            msg: >-
              NDP_PREREQUISITE_FAILED_CONTINUING [{{ test_module }}]: pipeline precheck failed at
              '{{ ansible_failed_task.name | default('unknown task', true) }}'; running the authored target anyway.

    # -------------------------------------------------------------------------
    # SETUP (nd_fabric_update_group only, read-only): the target's overridden and auto-assign steps act on EVERY update group of the
    # fabric, and attaching a switch moves it out of any group it belongs to. ND keeps a built-in default group literally named None
    # (the module ignores it). Start the target only while no other group exists (leftovers of its own two groups are fine, it
    # deletes them first); otherwise end the play with the skip marker before anything is changed. Every non-default group that
    # exists after the target ran was therefore created by it, which is what the CLEANUP relies on.
    - name: "[{{ test_module }}] SETUP - precheck the update-group topology"
      when: test_module == 'nd_fabric_update_group' and not (nd_prerequisite_only | default(false) | bool)
      block:
        - name: "[{{ test_module }}] SETUP - read the live switches for the update-group precheck"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/switches"
          register: _ndp_ug_live
          check_mode: false
          no_log: true
          failed_when: false

        - name: "[{{ test_module }}] SETUP - read the existing update groups"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/updateGroups"
          register: _ndp_ug_groups
          check_mode: false
          no_log: true
          failed_when: false

        - name: "[{{ test_module }}] SETUP - find the test switches and the groups this test does not own"
          ansible.builtin.set_fact:
            _ndp_ug_present: >-
              {{ (_ndp_ug_live.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_update_switch_a, nd_test_update_switch_b, nd_test_update_switch_c])
                 | map(attribute='fabricManagementIp') | list }}
            _ndp_ug_foreign: >-
              {{ (_ndp_ug_groups.current.updateGroups | default([]))
                 | map(attribute='updateGroupName', default='')
                 | reject('in', ['None', '', 'ansible_leaf_group', 'ansible_spine_group']) | list }}

        - name: "[{{ test_module }}] SETUP - require the three test switches in the fabric"
          ansible.builtin.assert:
            that:
              - _ndp_ug_present | length == 3
            fail_msg: >-
              NDP_UPDATE_GROUP_PRECHECK_FAIL: nd_fabric_update_group needs {{ nd_test_update_switch_a }}, {{ nd_test_update_switch_b }} and
              {{ nd_test_update_switch_c }} in {{ nd_test_fabric_name }}; found {{ _ndp_ug_present }}.
            success_msg: >-
              NDP_UPDATE_GROUP_PRECHECK_OK {{ _ndp_ug_present }} are present in {{ nd_test_fabric_name }}; foreign update groups:
              {{ _ndp_ug_foreign }}.
          ignore_errors: true

        - name: "[{{ test_module }}] SETUP - report unexpected update groups and continue"
          ansible.builtin.debug:
            msg: >-
              NDP_PREREQUISITE_FAILED_CONTINUING [{{ test_module }}]: precheck found foreign groups
              {{ _ndp_ug_foreign | default([]) }}; executing the selected module anyway.
          when: _ndp_ug_foreign | default([]) | length > 0

    # -------------------------------------------------------------------------
    # SETUP: run the target's own setup/prepare file FIRST, but only when the
    # target does not already wire it (main.yaml or a test-case importing it).
    # A failure in this separate pipeline invocation is reported, then the suite
    # still runs. Setup and checks invoked inside the collection remain unchanged.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] SETUP - run target setup/prepare first (names vary)"
      when:
        - not (nd_prerequisite_only | default(false) | bool)
        - not (_ndp_l3out_fixture_failure | default(''))
        - _ndp_setup_file | default('') | length > 0
        - (_ndp_setup_importers.matched | default(0)) | int == 0
      block:
        - name: "[{{ test_module }}] SETUP - execute target setup/prepare"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
            tasks_from: "{{ _ndp_setup_file }}"
      rescue:
        - name: "[{{ test_module }}] SETUP - record target setup failure and continue"
          ansible.builtin.set_fact:
            _ndp_continued_failures: >-
              {{ _ndp_continued_failures | default([])
                 + ['setup: ' ~ (ansible_failed_task.name | default('unknown task', true) | string | truncate(200))] }}

        - name: "[{{ test_module }}] SETUP - report target setup failure and continue"
          ansible.builtin.debug:
            msg: >-
              NDP_PREREQUISITE_FAILED_CONTINUING [{{ test_module }}]: pipeline-invoked setup failed at
              '{{ ansible_failed_task.name | default('unknown task', true) }}'; running the authored suite anyway.

    # -------------------------------------------------------------------------
    # RUN: the module's full suite. A failure here fails the PLAY (so the recap
    # reports failed>0), while the always-cleanup still resets the fabric.
    # -------------------------------------------------------------------------
    - name: "[{{ test_module }}] Begin execution timing"
      ansible.builtin.debug:
        msg: "NDP_PHASE_EXECUTION"
      tags: [nd_phase_execution]
      when: not (nd_prerequisite_only | default(false) | bool)

    - name: "[{{ test_module }}] RUN full integration suite (all test cases)"
      block:
        - name: "[{{ test_module }}] block L3Out when its fixture failed"
          ansible.builtin.assert:
            that:
              - not (_ndp_l3out_fixture_failure | default(''))
            fail_msg: >-
              NDP_L3OUT_PREREQUISITE_FAILED: {{ _ndp_l3out_fixture_failure }}.
              The integration role was blocked.
          when: test_module == 'nd_manage_l3out'

        - name: "[{{ test_module }}] validate selected test groups"
          ansible.builtin.assert:
            that:
              - test_groups == ['standalone']
              - nd_network_test_topology == 'standalone'
              - nd_vrf_test_topology == 'standalone'
            fail_msg: "Only standalone network and VRF integration tests are enabled."
          when: test_module in ['nd_manage_networks', 'nd_manage_vrfs']

        - name: "[{{ test_module }}] include selected network/VRF groups"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
          vars:
            testcase: "*"
            nd_network_test_topology: "{{ test_group }}"
            nd_vrf_test_topology: "{{ test_group }}"
          loop: "{{ test_groups }}"
          loop_control:
            loop_var: test_group
          when: test_module in ['nd_manage_networks', 'nd_manage_vrfs']

        - name: "[{{ test_module }}] include collection target (all configured cases)"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
          when: test_module not in ['nd_manage_networks', 'nd_manage_vrfs']

      when: not (nd_prerequisite_only | default(false) | bool)
      always:
        - name: "[{{ test_module }}] Begin cleanup timing"
          ansible.builtin.debug:
            msg: "NDP_PHASE_CLEANUP"
          tags: [nd_phase_cleanup]

        - name: "[{{ test_module }}] snapshot Leaf-ToR warnings before recovery"
          when:
            - test_module == 'nd_manage_switches'
            - not (nd_prerequisite_only | default(false) | bool)
            - not ansible_check_mode
          block:
            - name: "[{{ test_module }}] read post-test fabric anomalies"
              cisco.nd.nd_rest:
                method: get
                path: "/api/v1/analyze/anomalies/details?fabricName={{ fabric_name | urlencode }}&max=200"
              register: _ndp_post_delete_anomalies
              failed_when: false
              timeout: 20
              vars:
                ansible_command_timeout: 20
              no_log: true

            - name: "[{{ test_module }}] report sanitized post-test anomaly counts"
              vars:
                _body: "{{ _ndp_post_delete_anomalies.current | default(none) }}"
                _rows: "{{ _body.get('anomalies') if _body is mapping else none }}"
              ansible.builtin.debug:
                msg: >-
                  {%- if _ndp_post_delete_anomalies.status | default(0) | int == 200 and _body is mapping
                      and 'error' not in _body and 'errors' not in _body and 'code' not in _body
                      and _rows | type_debug == 'list' and _rows | length < 200
                      and _rows | select('mapping') | selectattr('fabricName', 'defined')
                        | selectattr('cleared', 'boolean') | selectattr('anomalyString', 'string') | list | length == _rows | length -%}
                    NDP_SWITCH_DELETE_CONTROLLER_SNAPSHOT active_leaf_tor={{
                      _rows | selectattr('fabricName', 'equalto', fabric_name) | selectattr('cleared', 'sameas', false)
                      | selectattr('anomalyString', 'search', '(?i)leaf-tor unpairing') | list | length }}
                  {%- else -%}
                    NDP_SWITCH_DELETE_CONTROLLER_SNAPSHOT unavailable: incomplete or failed anomaly read
                  {%- endif -%}
          rescue:
            - name: "[{{ test_module }}] report unavailable diagnostics without blocking recovery"
              ansible.builtin.debug:
                msg: "NDP_SWITCH_DELETE_CONTROLLER_SNAPSHOT unavailable: diagnostic task failed"

        - name: "[{{ test_module }}] clean the known ToR test association after execution"
          when:
            - test_module == 'nd_manage_tor'
            - fabric_name in ['VXLAN_EVPN_Fabric', 'VXLAN_EVPN_Fabric_eBGP']
            - not (nd_prerequisite_only | default(false) | bool)
            - not ansible_check_mode
          block: *ndp_cleanup_test_tor
          rescue: *ndp_cleanup_test_tor_failure

        - name: "[{{ test_module }}] CLEANUP - post-clean (required)"
          ansible.builtin.include_role:
            name: "{{ test_module }}"
            tasks_from: "{{ _ndp_cleanup_file }}"
          when:
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_cleanup_file | default('') | length > 0

        - name: "[{{ test_module }}] CLEANUP - remove this target's staged overlay fixtures"
          when:
            - test_module in ['nd_manage_networks', 'nd_manage_vrfs']
            - not (nd_prerequisite_only | default(false) | bool)
            - not ansible_check_mode
            - staged_create_result is defined
            - not (staged_create_result.skipped | default(false) | bool)
          vars:
            _ndp_staged_identity: "{{ 'network_name' if test_module == 'nd_manage_networks' else 'vrf_name' }}"
            _ndp_staged_fixtures: >-
              {{ (nd_network_staged_seed | default([])) + (nd_network_staged_create_config | default([]))
                 if test_module == 'nd_manage_networks'
                 else (nd_vrf_staged_seed | default([])) + (nd_vrf_staged_create_config | default([])) }}
            _ndp_staged_name_pattern: "{{ '^ndnetstg(create|add|remove|detach|omit)$' if test_module == 'nd_manage_networks' else '^ndvrfstg(create|add|remove|detach|omit)$' }}"
          block:
            - name: "[{{ test_module }}] CLEANUP - require exact staged fixture identities"
              ansible.builtin.assert:
                that:
                  - target_fabric | default('') == fabric_name
                  - _ndp_staged_fixtures | length > 0
                  - _ndp_staged_fixtures | selectattr(_ndp_staged_identity, 'defined') | list | length == _ndp_staged_fixtures | length
                  - _ndp_staged_fixtures | map(attribute=_ndp_staged_identity) | select('match', _ndp_staged_name_pattern) | list | length == _ndp_staged_fixtures | length
                fail_msg: "NDP_STAGED_CLEANUP_REFUSED: staged fixture ownership or fabric could not be established."

            - name: "[{{ test_module }}] CLEANUP - initialize explicit staged deletion selectors"
              ansible.builtin.set_fact:
                _ndp_staged_cleanup_config: []

            - name: "[{{ test_module }}] CLEANUP - select only authored staged fixture names"
              ansible.builtin.set_fact:
                _ndp_staged_cleanup_config: >-
                  {{ _ndp_staged_cleanup_config +
                     [dict([(_ndp_staged_identity, _ndp_staged_fixture[_ndp_staged_identity]),
                            ('deploy', true)]) |
                      combine({'layer': 'layer2'} if test_module == 'nd_manage_networks' else {})] }}
              loop: "{{ _ndp_staged_fixtures }}"
              loop_control:
                loop_var: _ndp_staged_fixture
                label: "{{ _ndp_staged_fixture[_ndp_staged_identity] }}"

            - name: "[{{ test_module }}] CLEANUP - detach deploy and delete staged test networks"
              cisco.nd.nd_manage_networks:
                fabric_name: "{{ target_fabric }}"
                state: deleted
                config: "{{ _ndp_staged_cleanup_config }}"
              when: test_module == 'nd_manage_networks'

            - name: "[{{ test_module }}] CLEANUP - detach deploy and delete staged test VRFs"
              cisco.nd.nd_manage_vrfs:
                fabric_name: "{{ target_fabric }}"
                state: deleted
                config: "{{ _ndp_staged_cleanup_config }}"
              when: test_module == 'nd_manage_vrfs'

            - name: "[{{ test_module }}] CLEANUP - gather the staged test networks after deletion"
              cisco.nd.nd_manage_networks:
                fabric_name: "{{ target_fabric }}"
                state: gathered
                config: "{{ _ndp_staged_cleanup_config }}"
              register: _ndp_staged_networks_after
              when: test_module == 'nd_manage_networks'

            - name: "[{{ test_module }}] CLEANUP - gather the staged test VRFs after deletion"
              cisco.nd.nd_manage_vrfs:
                fabric_name: "{{ target_fabric }}"
                state: gathered
                config: "{{ _ndp_staged_cleanup_config }}"
              register: _ndp_staged_vrfs_after
              when: test_module == 'nd_manage_vrfs'

            - name: "[{{ test_module }}] CLEANUP - verify staged fixture definitions are absent"
              ansible.builtin.assert:
                that:
                  - _ndp_staged_after.gathered is defined
                  - _ndp_staged_after.gathered is sequence
                  - _ndp_staged_after.gathered is not string
                  - _ndp_staged_after.gathered is not mapping
                  - _ndp_staged_after.gathered | selectattr(_ndp_staged_identity, 'defined') | list | length == _ndp_staged_after.gathered | length
                  - >-
                    _ndp_staged_after.gathered |
                    selectattr(_ndp_staged_identity, 'in', _ndp_staged_cleanup_config | map(attribute=_ndp_staged_identity) | list) |
                    list | length == 0
                fail_msg: "NDP_STAGED_CLEANUP_FAILED: staged test definitions remain or readback is incomplete."
                success_msg: "NDP_STAGED_CLEANUP_OK: staged test definitions removed."
              vars:
                _ndp_staged_after: "{{ _ndp_staged_networks_after if test_module == 'nd_manage_networks' else _ndp_staged_vrfs_after }}"

        # A failed l3out run can leave its test L3Outs behind; ND refuses to delete the planned links or route
        # maps they reference, so remove them first (best effort, never masks the test result).
        - name: "[{{ test_module }}] CLEANUP - remove leftover test L3Outs and the route maps this run created"
          when: test_module == 'nd_manage_l3out' and not (nd_prerequisite_only | default(false) | bool)
          block:
            - name: "[{{ test_module }}] CLEANUP - delete leftover test L3Outs"
              cisco.nd.nd_manage_l3out:
                fabric_name: "{{ nd_test_fabric_name }}"
                state: deleted
                config:
                  - name: "{{ test_l3out_bgp_name | default('ansible-test-l3out-bgp') }}"
                  - name: "{{ test_l3out_static_name | default('ansible-test-l3out-static') }}"
                  - name: "{{ test_l3out_svi_name | default('ansible-test-l3out-svi') }}"
              ignore_errors: true

            - name: "[{{ test_module }}] CLEANUP - delete the route maps created for this run"
              cisco.nd.nd_manage_route_map:
                fabric_name: "{{ nd_test_fabric1_name }}"
                config: "{{ _ndp_l3out_route_maps_created | map('community.general.dict_kv', 'name') | list }}"
                state: deleted
              ignore_errors: true
              when: _ndp_l3out_route_maps_created | default([]) | length > 0

        # The target leaves the pair it created ("create once"); the destructive nd_manage_switches module runs
        # later in the same job and ND refuses to remove switches that are still paired, so unpair what this
        # run created. A pair that already existed is never touched.
        - name: "[{{ test_module }}] CLEANUP - unpair the vPC pair this run created"
          when:
            - test_module == 'nd_resource_manager'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_rm_pair_preexisting is defined
            - not (_ndp_rm_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ ansible_sno_1 }}"
                peer2_switch_id: "{{ ansible_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # Same reason for the vPC interface targets: the runner formed the pair, so the runner removes it (a pair that
        # already existed is never touched).
        - name: "[{{ test_module }}] CLEANUP - unpair the vPC pair the runner formed for the vPC interface target"
          when:
            - test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_vpcif_pair_preexisting is defined
            - not (_ndp_vpcif_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ ansible_sno_1 }}"
                peer2_switch_id: "{{ ansible_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # The second (leaf_3/leaf_4) pair the runner formed for the multi-pair scenario is removed the same way.
        - name: "[{{ test_module }}] CLEANUP - unpair the second vPC pair the runner formed for the vPC interface target"
          when:
            - test_module in ['nd_interface_vpc_access', 'nd_interface_vpc_trunk_host']
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_vpcif2_pair_preexisting is defined
            - not (_ndp_vpcif2_pair_preexisting | bool)
          cisco.nd.nd_manage_vpc_pair:
            fabric_name: "{{ ansible_it_fabric }}"
            state: deleted
            config:
              - peer1_switch_id: "{{ _ndp_vpcif2_sno_1 }}"
                peer2_switch_id: "{{ _ndp_vpcif2_sno_2 }}"
            config_actions: {save: true, deploy: true, type: switch}
          ignore_errors: true

        # nd_local_user: the target deletes its own logins at the end, but an aborted run leaves them behind. The precheck proved
        # that admin was the only other account, so the three test logins are all there is to remove (best effort, never masks the
        # test result). Without a passed precheck nothing is deleted.
        - name: "[{{ test_module }}] CLEANUP - delete the test local users this run may have left"
          cisco.nd.nd_local_user:
            config:
              - login_id: ansible_local_user
              - login_id: ansible_local_user_2
              - login_id: ansible_local_user_3
            state: deleted
          ignore_errors: true
          when:
            - test_module == 'nd_local_user'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_lu_foreign is defined
            - _ndp_lu_foreign | length == 0

        # nd_fabric_update_group: the target deletes its groups itself, but an abort between its auto-assign and delete steps leaves
        # role-based groups with generated names behind. The precheck proved the fabric held no other group (besides ND's built-in
        # default named None), so every group that exists now was created by this run. Without a passed precheck nothing is deleted.
        - name: "[{{ test_module }}] CLEANUP - read the update groups left in the fabric"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_fabric_name }}/updateGroups"
          register: _ndp_ug_after
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_fabric_update_group'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_ug_foreign is defined
            - _ndp_ug_foreign | length == 0

        - name: "[{{ test_module }}] CLEANUP - delete every update group this run created"
          cisco.nd.nd_fabric_update_group:
            fabric_name: "{{ nd_test_fabric_name }}"
            config: >-
              {{ _ndp_ug_leftover | map('community.general.dict_kv', 'update_group_name') | list }}
            state: deleted
          ignore_errors: true
          vars:
            _ndp_ug_leftover: >-
              {{ (_ndp_ug_after.current.updateGroups | default([]))
                 | map(attribute='updateGroupName', default='') | reject('in', ['None', '']) | list }}
          when:
            - test_module == 'nd_fabric_update_group'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_ug_foreign is defined
            - _ndp_ug_foreign | length == 0
            - (_ndp_ug_after.current.updateGroups | default([]) | map(attribute='updateGroupName', default='') | reject('in', ['None', '']) | list | length) > 0

        # nd_maintenance_mode: the target puts both switches back to normal mode itself (its teardown ran as the post-clean above), but
        # only the INTENT was toggled, so ND may keep reporting them as not in sync until a configuration save. Read both back, and
        # recalculate plus deploy only when they are not both in sync (the deploy then has nothing to push). A mode that cannot be
        # restored fails the module loudly; the next switch guard also heals it.
        - name: "[{{ test_module }}] CLEANUP - read both switches back after the mode restore"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_restored
          retries: 6
          delay: 10
          until: >-
            ((_ndp_mm_restored.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.systemMode', default='') | map('lower') | list) == ['normal', 'normal']
            and
            ((_ndp_mm_restored.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | list) == ['normal', 'normal']
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

        - name: "[{{ test_module }}] CLEANUP - record the configuration sync state after the mode restore"
          ansible.builtin.set_fact:
            _ndp_mm_sync: >-
              {{ (_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.configSyncStatus', default='') | list }}
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

        - name: "[{{ test_module }}] CLEANUP - save the fabric configuration so ND reports the maintenance-mode switches in sync again"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/actions/configSave"
            content: {}
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        # switchActions/deploy answers 207 ("No Commands to execute"), which nd_rest cannot parse; the outcome is read from state.
        - name: "[{{ test_module }}] CLEANUP - push the pending maintenance-mode switch state (nothing to push is expected)"
          cisco.nd.nd_rest:
            method: post
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switchActions/deploy"
            content:
              switchIds: "{{ _ndp_mm_switches | map(attribute='switchId') | list }}"
          failed_when: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        - name: "[{{ test_module }}] CLEANUP - wait for both maintenance-mode switches to report in sync"
          cisco.nd.nd_rest:
            method: get
            path: "/api/v1/manage/fabrics/{{ nd_test_maintenance_mode_fabric_name }}/switches"
          register: _ndp_mm_synced
          retries: 12
          delay: 10
          until: >-
            ((_ndp_mm_synced.current.switches | default([]))
             | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
             | map(attribute='additionalData.configSyncStatus', default='') | list) == ['inSync', 'inSync']
          failed_when: false
          check_mode: false
          no_log: true
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_sync is defined
            - _ndp_mm_sync != ['inSync', 'inSync']

        - name: "[{{ test_module }}] CLEANUP - report the mode restore"
          ansible.builtin.assert:
            that:
              - >-
                ((_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.systemMode', default='') | map('lower') | list) == ['normal', 'normal']
              - >-
                ((_ndp_mm_restored.current.switches | default([]))
                 | selectattr('fabricManagementIp', 'in', [nd_test_maintenance_mode_switch_ip_a, nd_test_maintenance_mode_switch_ip_b])
                 | map(attribute='additionalData.intendedSystemMode', default='') | map('lower') | list) == ['normal', 'normal']
            fail_msg: >-
              NDP_MAINT_RESTORE_FAIL: {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} do not both
              report normal system and intended modes after the test; the next switch guard heals them.
            success_msg: >-
              NDP_MAINT_RESTORE_OK {{ nd_test_maintenance_mode_switch_ip_a }} and {{ nd_test_maintenance_mode_switch_ip_b }} are back in
              normal mode; sync before recalculation {{ _ndp_mm_sync | default([]) }}.
          when:
            - test_module == 'nd_maintenance_mode'
            - not (nd_prerequisite_only | default(false) | bool)
            - _ndp_mm_switches is defined

  post_tasks:
    - name: "[{{ test_module }}] report best-effort prerequisite failures"
      ansible.builtin.debug:
        msg: >-
          NDP_PREREQUISITE_STATUS: FAILED [{{ test_module }}] but module execution continued:
          {{ _ndp_continued_failures | join('; ') }}
      when: _ndp_continued_failures | default([]) | length > 0

  # Ansible notifies handler tasks, not block names, and ignores rescue sections in
  # handler blocks. Keep this a named task; the included file reports failures and
  # releases this execution's lock in its always section.
  handlers:
    - name: Restore prerequisite interface changes
      ansible.builtin.include_tasks: "{{ playbook_dir }}/nd_prerequisite/nd_prerequisite_restore.yaml"
