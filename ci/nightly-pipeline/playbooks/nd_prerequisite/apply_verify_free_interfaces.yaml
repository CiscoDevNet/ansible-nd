---
# Verify the current target ports without enabling them, and persist their exact
# before-images. Authored interface targets may normalize a deleted port back to
# admin-up; the forced restore handler must return it to its captured state.
- name: "verify_free_interfaces guard {{ _ndp_operation.switch_ref }}"
  ansible.builtin.assert:
    that:
      - _ndp_operation.interfaces | length > 0
      - _ndp_operation.interfaces | unique | list | length == _ndp_operation.interfaces | length
      - _ndp_operation.constraints | sort == ['exists', 'not_fabric_link', 'not_port_channel_member']
      - >-
        (_ndp_operation.interfaces
         | difference(_ndp_registry.lab.interface_allowlist[_ndp_operation.switch_ref]))
        | length == 0
    fail_msg: >-
      The planner emitted an invalid free-interface verification operation for
      {{ _ndp_operation.switch_ref }}.
    success_msg: >-
      Reserved interfaces are present, outside fabric links, and free of
      port-channel membership: {{ _ndp_operation.interfaces | join(', ') }}.
  run_once: true

- name: Require a restore journal before releasing physical ports to a target
  ansible.builtin.assert:
    that:
      - _ndp_restore_file is defined
      - _ndp_operation.serial == _ndp_registry.lab.switches[_ndp_operation.switch_ref].serial
    fail_msg: "NDP_INTERFACE_SNAPSHOT_REQUIRED: no target may change a port without its restore journal."
  run_once: true

- name: Capture each exact standalone port-channel before detaching reserved members
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name
      }}/switches/{{ _ndp_operation.serial }}/interfaces/{{ _ndp_pc_detachment.interface }}
    method: get
  loop: "{{ _ndp_operation.port_channel_detachments | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_detachment
    label: "{{ _ndp_pc_detachment.interface }}"
  register: _ndp_pc_before
  no_log: true
  run_once: true

- name: Require exact standalone parent identity and membership before detaching
  ansible.builtin.assert:
    that:
      - _ndp_pc_before_result.current.switchId == _ndp_operation.serial
      - _ndp_pc_before_result.current.interfaceName == _ndp_pc_before_result._ndp_pc_detachment.interface
      - _ndp_pc_before_result.current.interfaceType == 'portChannel'
      - _ndp_pc_before_result.current.configData.networkOS.policy.policyType in ['accessPoHost', 'trunkPoHost', 'l3Po']
      - _ndp_pc_before_result.current.configData.networkOS.policy.ports | sort == _ndp_pc_before_result._ndp_pc_detachment.members_before | sort
    fail_msg: >-
      NDP_PORT_CHANNEL_SNAPSHOT_UNVERIFIED: refusing to detach reserved members from
      {{ _ndp_operation.switch_ref }}/{{ _ndp_pc_before_result._ndp_pc_detachment.interface }}.
  loop: "{{ _ndp_pc_before.results | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_before_result
    label: "{{ _ndp_pc_before_result._ndp_pc_detachment.interface }}"
  run_once: true
  no_log: true

- name: Journal exact port-channel membership before detaching reserved members
  ansible.builtin.set_fact:
    _ndp_prerequisite_restore_operations: >-
      {{ (_ndp_prerequisite_restore_operations | default([])) + [{
        'action': 'restore_port_channel_members',
        'switch_ref': _ndp_operation.switch_ref,
        'serial': _ndp_operation.serial,
        'switch_ip': _ndp_registry.lab.switches[_ndp_operation.switch_ref].seed_ip,
        'fabric_name': _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name,
        'interface': _ndp_pc_before_result._ndp_pc_detachment.interface,
        'module': _ndp_pc_before_result._ndp_pc_detachment.module,
        'policy_type': _ndp_pc_before_result.current.configData.networkOS.policy.policyType,
        'members_before': _ndp_pc_before_result._ndp_pc_detachment.members_before,
        'members_after': _ndp_pc_before_result._ndp_pc_detachment.members_after}] }}
  loop: "{{ _ndp_pc_before.results | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_before_result
    label: "{{ _ndp_pc_before_result._ndp_pc_detachment.interface }}"
  run_once: true
  no_log: true
  when: _ndp_pc_before.results | default([]) | length > 0

- name: Persist standalone port-channel before-images before detaching members
  ansible.builtin.copy:
    dest: "{{ _ndp_restore_file }}"
    content: >-
      {{ {'schema_version': 1, 'run_id': _ndp_run_id, 'execution_id': _ndp_execution_id,
          'operations': _ndp_prerequisite_restore_operations} | to_nice_yaml }}
    mode: "0600"
  delegate_to: localhost
  no_log: true
  run_once: true
  check_mode: false
  when: _ndp_pc_before.results | default([]) | length > 0

- name: Detach reserved members from standalone access port-channels
  cisco.nd.nd_interface_port_channel_access:
    fabric_name: "{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name }}"
    config:
      - switch_ip: "{{ _ndp_registry.lab.switches[_ndp_operation.switch_ref].seed_ip }}"
        interface_name: "{{ _ndp_pc_detachment.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_pc_detachment.members_after }}"
    config_actions: {deploy: true}
    state: merged
  loop: "{{ _ndp_operation.port_channel_detachments | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_detachment
    label: "{{ _ndp_pc_detachment.interface }}"
  no_log: true
  run_once: true
  when: _ndp_pc_detachment.module == 'access'

- name: Detach reserved members from standalone trunk port-channels
  cisco.nd.nd_interface_port_channel_trunk_host:
    fabric_name: "{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name }}"
    config:
      - switch_ip: "{{ _ndp_registry.lab.switches[_ndp_operation.switch_ref].seed_ip }}"
        interface_name: "{{ _ndp_pc_detachment.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_pc_detachment.members_after }}"
    config_actions: {deploy: true}
    state: merged
  loop: "{{ _ndp_operation.port_channel_detachments | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_detachment
    label: "{{ _ndp_pc_detachment.interface }}"
  no_log: true
  run_once: true
  when: _ndp_pc_detachment.module == 'trunk'

- name: Detach reserved members from standalone routed port-channels
  cisco.nd.nd_interface_port_channel_routed:
    fabric_name: "{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name }}"
    config:
      - switch_ip: "{{ _ndp_registry.lab.switches[_ndp_operation.switch_ref].seed_ip }}"
        interface_name: "{{ _ndp_pc_detachment.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_pc_detachment.members_after }}"
    config_actions: {deploy: true}
    state: merged
  loop: "{{ _ndp_operation.port_channel_detachments | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_detachment
    label: "{{ _ndp_pc_detachment.interface }}"
  no_log: true
  run_once: true
  when: _ndp_pc_detachment.module == 'routed'

- name: Verify only the reserved members were removed from standalone port-channels
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name
      }}/switches/{{ _ndp_operation.serial }}/interfaces/{{ _ndp_pc_detachment.interface }}
    method: get
  loop: "{{ _ndp_operation.port_channel_detachments | default([]) }}"
  loop_control:
    loop_var: _ndp_pc_detachment
    label: "{{ _ndp_pc_detachment.interface }}"
  register: _ndp_pc_after
  retries: 12
  delay: 5
  until: >-
    _ndp_pc_after.current.switchId | default('') == _ndp_operation.serial and
    _ndp_pc_after.current.interfaceName | default('') == _ndp_pc_detachment.interface and
    _ndp_pc_after.current.configData.networkOS.policy.ports | default([]) | sort == _ndp_pc_detachment.members_after | sort
  no_log: true
  run_once: true

- name: Capture the exact configuration of only this target's physical ports
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name }}/switches/{{
        _ndp_operation.serial }}/interfaces/{{ _ndp_free_port | replace('/', '%2F') }}
    method: get
  loop: "{{ _ndp_operation.interfaces }}"
  loop_control:
    loop_var: _ndp_free_port
  register: _ndp_free_before
  no_log: true
  run_once: true

- name: Require exact identities and typed before-images for every released port
  ansible.builtin.assert:
    that:
      - _ndp_free_result.current.switchId == _ndp_operation.serial
      - _ndp_free_result.current.interfaceName == _ndp_free_result._ndp_free_port
      - _ndp_free_result.current.interfaceType == 'ethernet'
      - _ndp_free_result.current.configData.mode in ['trunk', 'access', 'routed']
      - _ndp_free_result.current.configData.networkOS.networkOSType == 'nx-os'
      - _ndp_free_result.current.configData.networkOS.policy.adminState is boolean
      - _ndp_free_result.current.configData.networkOS.policy.portChannelId is not defined
    fail_msg: "NDP_INTERFACE_SNAPSHOT_UNVERIFIED: the target has not started."
  loop: "{{ _ndp_free_before.results }}"
  loop_control:
    loop_var: _ndp_free_result
  no_log: true
  run_once: true

- name: Append exact before-images before the authored target can change the ports
  ansible.builtin.set_fact:
    _ndp_prerequisite_restore_operations: >-
      {{ (_ndp_prerequisite_restore_operations | default([])) + [{
        'action': 'restore_ethernet', 'switch_ref': _ndp_operation.switch_ref,
        'serial': _ndp_operation.serial,
        'switch_ip': _ndp_registry.lab.switches[_ndp_operation.switch_ref].seed_ip,
        'fabric_name': _ndp_registry.lab.fabrics[_ndp_registry.lab.switches[_ndp_operation.switch_ref].baseline_fabric_ref].name,
        'interface': _ndp_free_result._ndp_free_port,
        'pre_change_intent_exists': true,
        'pre_change_config_data': _ndp_free_result.current.configData}] }}
  loop: "{{ _ndp_free_before.results }}"
  loop_control:
    loop_var: _ndp_free_result
  no_log: true
  run_once: true

- name: Persist target-port before-images before the integration target starts
  ansible.builtin.copy:
    dest: "{{ _ndp_restore_file }}"
    content: >-
      {{ {'schema_version': 1, 'run_id': _ndp_run_id, 'execution_id': _ndp_execution_id,
          'operations': _ndp_prerequisite_restore_operations} | to_nice_yaml }}
    mode: "0600"
  delegate_to: localhost
  no_log: true
  run_once: true
  check_mode: false
