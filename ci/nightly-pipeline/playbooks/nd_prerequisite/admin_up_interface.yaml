---
# admin_up_interface: ensure ONE physical interface is administratively up (no-shutdown).
#
# Reusable, idempotent, best-effort helper included by the link/interface prerequisites
# so that a module which needs an inter-fabric link (e.g. l3out / ext_l3_dci_link) or a
# cabled vPC peer-link can self-heal an administratively shut endpoint before failing on
# "physical link not found".
#
# ND 4.3 carries admin state in the interface intent (configData.networkOS.policy.adminState)
# of the manage API. The legacy lan-fabric globalInterface PUT answers HTTP 405 there, which
# silently turned this helper into a no-op, so it now GETs the interface, flips adminState
# while preserving every other field (via `combine`), PUTs it back and deploys just that
# interface through interfaceActions/deploy. Re-applying an already-up interface is a no-op.
#
# Contract -- the caller passes a single dict `_auif`:
#   _auif.fabric  : fabric that owns the switch (e.g. VXLAN_EVPN_Fabric)
#   _auif.serial  : switch serial number (e.g. SERIAL00001)
#   _auif.ifname  : interface name       (e.g. Ethernet1/1)
#   _auif.label   : human label for logs (e.g. vxlan_leaf_1/Ethernet1/1)
#
# Non-fatal: an interface ND does not manage (no policy) is skipped with a debug note; the
# PUT/deploy results are reported but not hard-asserted (the caller re-probes the link and
# owns the final verdict).

- name: "admin_up guard {{ _auif.label }} is an allowlisted physical interface"
  ansible.builtin.assert:
    that:
      - _auif.ifname is match('^Ethernet[0-9]+/[0-9]+$')
      - _auif.fabric | default('') | length > 0
    fail_msg: "Refusing to admin-up a non-physical/allowlisted interface (or one without a fabric): {{ _auif.label }}"

- name: "admin_up GET current interface intent for {{ _auif.label }}"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
    method: get
  register: _auif_get
  no_log: true
  failed_when: false

- name: "admin_up resolve the current intent for {{ _auif.label }}"
  ansible.builtin.set_fact:
    _auif_cur: "{{ _auif_get.current | default({}) if (_auif_get.current | default({}) is mapping) else {} }}"

- name: "admin_up skip {{ _auif.label }} (no managed interface policy -- undiscovered/unmanaged port)"
  ansible.builtin.debug:
    msg: >-
      No managed interface policy returned for {{ _auif.label }}; cannot admin-up it
      (the port is likely undiscovered). Skipping -- physical cabling is still required.
  when: (_auif_cur.configData.networkOS.policy | default({})) | length == 0

- name: "admin_up {{ _auif.label }} is already administratively up"
  ansible.builtin.debug:
    msg: "{{ _auif.label }} adminState is already true; nothing to do."
  when:
    - (_auif_cur.configData.networkOS.policy | default({})) | length > 0
    - _auif_cur.configData.networkOS.policy.adminState | default(false) | bool

- name: "admin_up apply adminState=true (no-shutdown) for {{ _auif.label }}"
  when:
    - (_auif_cur.configData.networkOS.policy | default({})) | length > 0
    - not (_auif_cur.configData.networkOS.policy.adminState | default(false) | bool)
  block:
    - name: "admin_up PUT interface (preserve intent, force adminState=true) {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
        method: put
        content:
          switchId: "{{ _auif.serial }}"
          interfaceName: "{{ _auif.ifname }}"
          interfaceType: "{{ _auif_cur.interfaceType | default('ethernet') }}"
          configData: "{{ _auif_cur.configData | combine({'networkOS': {'policy': {'adminState': true}}}, recursive=True) }}"
      register: _auif_put
      failed_when: false

    - name: "admin_up deploy only {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/interfaceActions/deploy"
        method: post
        content:
          interfaces:
            - interfaceName: "{{ _auif.ifname }}"
              switchId: "{{ _auif.serial }}"
      register: _auif_deploy
      failed_when: false

    - name: "admin_up result for {{ _auif.label }}"
      ansible.builtin.debug:
        msg: >-
          admin-up {{ _auif.label }}: PUT status {{ _auif_put.status | default('n/a') }},
          deploy status {{ _auif_deploy.status | default('n/a') }}
          (adminState forced true{{ '' if (_auif_put.failed | default(false) | bool) is false else '; PUT FAILED -- ' ~ (_auif_put.msg | default('')) }}).
