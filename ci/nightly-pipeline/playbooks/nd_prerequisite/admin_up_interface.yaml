---
# Enable one currently requested port, preserving its policy and journaling the
# before-image when called by the prerequisite runner. Ownership is not a request
# to enable the rest of the reservation pool.
- name: "admin_up resolve the approved switch for {{ _auif.label }}"
  ansible.builtin.set_fact:
    _auif_registry: "{{ _ndp_registry | default(_ndreg | default({})) }}"

- name: "admin_up resolve the exact registry alias"
  ansible.builtin.set_fact:
    _auif_matches: >-
      {{ _auif_registry.lab.switches | dict2items | selectattr('value.serial', 'equalto', _auif.serial) | list }}

- name: "admin_up guard {{ _auif.label }} is an allowlisted physical interface"
  ansible.builtin.assert:
    that:
      - _auif.ifname is match('^Ethernet[0-9]+/[0-9]+$')
      - _auif.fabric | default('') | length > 0
      - _auif_matches | length == 1
      - _auif.ifname in _auif_registry.lab.interface_allowlist[(_auif_matches | first).key]
    fail_msg: "Refusing an unowned or undeclared admin-up request: {{ _auif.label }}"

- name: "admin_up GET current interface intent for {{ _auif.label }}"
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
    method: get
  register: _auif_get
  no_log: true

- name: "admin_up require an identified, managed before-image for {{ _auif.label }}"
  ansible.builtin.assert:
    that:
      - _auif_get.current.switchId == _auif.serial
      - _auif_get.current.interfaceName == _auif.ifname
      - _auif_get.current.interfaceType == 'ethernet'
      - _auif_get.current.configData.networkOS.policy.adminState is boolean
      - _auif_get.current.configData.networkOS.policy.policyType | length > 0
    fail_msg: "NDP_ADMIN_UP_UNVERIFIED: missing or mismatched managed interface; no port was enabled."
  no_log: true

- name: "admin_up resolve the current and requested intent for {{ _auif.label }}"
  ansible.builtin.set_fact:
    _auif_cur: "{{ _auif_get.current }}"
    _auif_expected: "{{ _auif_get.current.configData | combine({'networkOS': {'policy': {'adminState': true}}}, recursive=True) }}"
  no_log: true

- name: "admin_up apply only the requested interface {{ _auif.label }}"
  when: not _auif_cur.configData.networkOS.policy.adminState
  block:
    - name: Journal the exact pre-change intent before enabling the port
      ansible.builtin.set_fact:
        _ndp_prerequisite_restore_operations: >-
          {{ (_ndp_prerequisite_restore_operations | default([])) + [{
             'action': 'restore_ethernet', 'interface': _auif.ifname,
             'switch_ref': (_auif_matches | first).key, 'serial': _auif.serial,
             'switch_ip': (_auif_matches | first).value.seed_ip, 'fabric_name': _auif.fabric,
             'pre_change_intent_exists': true, 'pre_change_config_data': _auif_cur.configData}] }}
      no_log: true
      when: _ndp_restore_file is defined

    - name: Persist the admin-up before-image before mutation
      ansible.builtin.copy:
        dest: "{{ _ndp_restore_file }}"
        content: >-
          {{ {'schema_version': 1, 'run_id': _ndp_run_id, 'execution_id': _ndp_execution_id,
              'operations': _ndp_prerequisite_restore_operations} | to_nice_yaml }}
        mode: "0600"
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: _ndp_restore_file is defined

    - name: "admin_up PUT preserved intent for {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
        method: put
        content:
          switchId: "{{ _auif.serial }}"
          interfaceName: "{{ _auif.ifname }}"
          interfaceType: ethernet
          configData: "{{ _auif_expected }}"
      register: _auif_put
      failed_when: false
      no_log: true

    # A 207 can be accepted by ND but not decoded by older nd_rest versions.
    # Read back the exact intent before any deploy; a rejected PUT is never deployed.
    - name: "admin_up verify the requested intent was accepted for {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
        method: get
      register: _auif_accepted
      failed_when: >-
        (_auif_accepted.current.switchId | default('')) != _auif.serial or
        (_auif_accepted.current.interfaceName | default('')) != _auif.ifname or
        (_auif_accepted.current.configData | default({})) != _auif_expected
      no_log: true

    - name: "admin_up deploy only {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/interfaceActions/deploy"
        method: post
        content:
          interfaces:
            - interfaceName: "{{ _auif.ifname }}"
              switchId: "{{ _auif.serial }}"
      register: _auif_deploy
      failed_when: false
      no_log: true

    - name: "admin_up verify the observed admin state for {{ _auif.label }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _auif.fabric }}/switches/{{ _auif.serial }}/interfaces/{{ _auif.ifname | replace('/', '%2F') }}"
        method: get
      register: _auif_verified
      retries: 12
      delay: 5
      until: >-
        (_auif_verified.current.switchId | default('')) == _auif.serial and
        (_auif_verified.current.interfaceName | default('')) == _auif.ifname and
        (_auif_verified.current.configData | default({})) == _auif_expected and
        (_auif_verified.current.operData.adminStatus | default('')) == 'up'
      no_log: true
