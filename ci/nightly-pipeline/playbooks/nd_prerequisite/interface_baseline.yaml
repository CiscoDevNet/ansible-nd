---
- name: Resolve the complete interface reservation registry
  ansible.builtin.set_fact:
    _nd_interface_baseline_registry_path: >-
      {{ lookup('ansible.builtin.first_found', {
           'files': ([nd_interface_baseline_registry_file | default('')]
                     + [playbook_dir ~ '/nd_prerequisite_profiles.yaml',
                        playbook_dir ~ '/../tests/nd_prerequisite_profiles.yaml'])
                    | select | list, 'skip': false}) }}

- name: Load the interface reservation registry without exposing its contents
  block:
    - name: Preflight registry readability and YAML structure without exposing contents
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-c"
          - |
            import sys
            try:
                import yaml
            except Exception:
                raise SystemExit(30)
            try:
                with open(sys.argv[1], encoding="utf-8") as registry_file:
                    registry = yaml.safe_load(registry_file)
            except FileNotFoundError:
                raise SystemExit(10)
            except PermissionError:
                raise SystemExit(11)
            except yaml.YAMLError:
                raise SystemExit(20)
            except OSError:
                raise SystemExit(12)
            except Exception:
                raise SystemExit(21)
            if not isinstance(registry, dict):
                raise SystemExit(22)
          - "{{ _nd_interface_baseline_registry_path }}"
      register: _nd_interface_baseline_registry_preflight
      changed_when: false
      failed_when: false
      no_log: true

    - name: Report and stop on a private registry preflight failure
      when: _nd_interface_baseline_registry_preflight.rc != 0
      block:
        - name: Report only the sanitized registry preflight category
          ansible.builtin.debug:
            msg: >-
              NDP_INTERFACE_REGISTRY_LOAD_FAILED: category={{ 'REGISTRY_FILE_UNAVAILABLE' if _nd_interface_baseline_registry_preflight.rc == 10 else
              'REGISTRY_ACCESS_DENIED' if _nd_interface_baseline_registry_preflight.rc == 11 else
              'REGISTRY_READ_FAILED' if _nd_interface_baseline_registry_preflight.rc == 12 else
              'REGISTRY_CONTENT_PARSE_FAILED' if _nd_interface_baseline_registry_preflight.rc == 20 else
              'REGISTRY_ROOT_NOT_MAPPING' if _nd_interface_baseline_registry_preflight.rc == 22 else
              'REGISTRY_PARSER_UNAVAILABLE' if _nd_interface_baseline_registry_preflight.rc == 30 else
              'REGISTRY_PREFLIGHT_FAILED' }}; path and contents withheld

        - name: Stop when the private registry fails preflight
          ansible.builtin.fail:
            msg: "NDP_INTERFACE_REGISTRY_LOAD_FAILED: no baseline mutation or membership transfer is permitted"

    - name: Include the private interface reservation registry
      ansible.builtin.include_vars:
        file: "{{ _nd_interface_baseline_registry_path }}"
        name: _nd_interface_baseline_registry
      no_log: true
  rescue:
    - name: Report an unexpected Ansible registry include failure
      ansible.builtin.debug:
        msg: "NDP_INTERFACE_REGISTRY_LOAD_FAILED: category=INCLUDE_VARS_FAILED_AFTER_PREFLIGHT; path and contents withheld"

    - name: Stop when Ansible cannot include the private registry
      ansible.builtin.fail:
        msg: "NDP_INTERFACE_REGISTRY_LOAD_FAILED: no baseline mutation or membership transfer is permitted"

- name: Create a private baseline checkpoint directory
  ansible.builtin.tempfile:
    state: directory
    prefix: nd_interface_baseline_
  delegate_to: localhost
  connection: local
  register: _nd_interface_baseline_checkpoint
  check_mode: false

- name: Resolve the fabrics in this baseline scope
  ansible.builtin.set_fact:
    _nd_interface_baseline_fabrics: >-
      {{ (((nd_test_fabric_switches | default({})).keys() | list)
          + (nd_switch_rehome_fabrics | default([]))
          + [nd_fabric_name | default(''), nd_external_fabric_name | default('')])
         | reject('equalto', '') | unique | list }}

# A failed authored port-channel delete leaves owned members bundled on the switch
# behind free ND intent, and the switch outOfSync, which blocks the sync gate below
# for the whole run. Deploy only that already-staged unbundle on owned ports.
- name: Converge staged port-channel drift on owned ports before the baseline sync gate
  ansible.builtin.include_tasks: converge_port_channel_member_drift.yaml
  loop: "{{ _nd_interface_baseline_registry.lab.switches | dict2items }}"
  loop_control:
    loop_var: _nd_cv_switch
    label: "{{ _nd_cv_switch.key }}"
  vars:
    _ndp_cv:
      fabric: "{{ _nd_interface_baseline_registry.lab.fabrics[_nd_cv_switch.value.baseline_fabric_ref].name }}"
      serial: "{{ _nd_cv_switch.value.serial }}"
      label: "{{ _nd_cv_switch.key }}"
      members: "{{ _nd_interface_baseline_registry.lab.interface_allowlist[_nd_cv_switch.key] }}"
      port_channels: >-
        {{ (_nd_interface_baseline_registry.profiles | default({})).values() | list
           | map(attribute='resources', default=[]) | flatten
           | selectattr('kind', 'defined') | selectattr('kind', 'equalto', 'verify_logical_interface_namespace')
           | selectattr('interface_type', 'defined') | selectattr('interface_type', 'equalto', 'port_channel')
           | selectattr('switch_ref', 'defined') | selectattr('switch_ref', 'equalto', _nd_cv_switch.key)
           | map(attribute='interfaces') | flatten | unique | list }}
      strict: false
  when:
    - nd_switch_apply | default(true) | bool
    - not (nd_prerequisite_only | default(false) | bool)
    - _nd_cv_switch.value.baseline_fabric_ref | default('') in (_nd_interface_baseline_registry.lab.fabrics | default({}))
    - _nd_interface_baseline_registry.lab.fabrics[_nd_cv_switch.value.baseline_fabric_ref].name in _nd_interface_baseline_fabrics
    - (_nd_interface_baseline_registry.lab.interface_allowlist[_nd_cv_switch.key] | default([])) | length > 0

- name: Plan or apply the bounded interface baseline
  nd_interface_baseline:
    registry: "{{ _nd_interface_baseline_registry }}"
    fabrics: "{{ _nd_interface_baseline_fabrics }}"
    switch_refs: "{{ _nd_interface_baseline_registry.lab.switches.keys() | list }}"
    journal_path: "{{ _nd_interface_baseline_checkpoint.path }}/mutations.jsonl"
    ensure_host_admin_down_default: true
    # This include runs only at lifecycle boundaries or after reset, when the
    # target has finished cleanup. Future reservations are not active port use.
    idle_reserved_ports: true
    # Recalculate & Deploy identity/mode-verified lab switches whose only gap is
    # configSyncStatus, then require fresh inSync. Not tied to interface apply.
    # Operators can disable it with ND_INTERFACE_BASELINE_RECOVER_SYNC=false.
    recover_config_sync: >-
      {{ (nd_interface_baseline_recover_config_sync | default(lookup('env', 'ND_INTERFACE_BASELINE_RECOVER_SYNC') | default(true, true)) | bool)
          and (nd_switch_apply | default(true) | bool)
          and not (nd_prerequisite_only | default(false) | bool) }}
    apply: >-
      {{ (nd_interface_baseline_apply | default(lookup('env', 'ND_INTERFACE_BASELINE_APPLY') | default(false, true)) | bool)
          and (nd_switch_apply | default(true) | bool)
          and not (nd_prerequisite_only | default(false) | bool) }}
    timeout_seconds: >-
      {{ [nd_interface_baseline_timeout_seconds | default(900) | int,
           ((nd_switch_guard_timeout_seconds | default(3600) | float)
             - ((_nd_switch_clock | float) - (_nd_switch_guard_started | float)) - 60)
           if _nd_switch_guard_started is defined else 900] | min | int }}
    call_timeout_seconds: 30
    poll_seconds: "{{ nd_interface_baseline_poll_seconds | default(5) | int }}"
  register: _nd_interface_baseline_result
  no_log: true
  failed_when: false

- name: Report interface baseline decisions without raw controller payloads
  ansible.builtin.debug:
    msg:
      - "NDP_INTERFACE_BASELINE reason={{ _nd_interface_baseline_result.reason | default('UNVERIFIED') }} apply={{ _nd_interface_baseline_result.apply | default(false) }} inspected={{ _nd_interface_baseline_result.inspected | default(0) }} candidates={{ _nd_interface_baseline_result.candidates | default(0) }} verified={{ _nd_interface_baseline_result.verified | default(0) }}"
      - "{{ _nd_interface_baseline_result.decisions | default([]) }}"

# Only the post-recovery call site opts in. An audit that changed nothing and
# found only ND config-sync lag (no identity/mode failure) cannot make the lab
# unsafe, so it must not abort the round and leave every module NOT_RUN.
- name: Classify an audit-only config-sync gap as advisory
  ansible.builtin.set_fact:
    _nd_interface_baseline_advisory: >-
      {{ (nd_interface_baseline_audit_advisory | default(false) | bool)
         and (_nd_interface_baseline_result.apply | default(true)) is sameas false
         and (_nd_interface_baseline_result.changed | default(true)) is sameas false
         and (_nd_interface_baseline_result.reason | default('')) == 'SWITCH_READINESS_OR_IDENTITY_UNVERIFIED'
         and _nd_baseline_unready | length > 0
         and (_nd_baseline_unready | map(attribute='failed_checks', default=[]) | map('join', ',') | unique | list) == ['configSyncStatus'] }}
  vars:
    _nd_baseline_unready: >-
      {{ _nd_interface_baseline_result.decisions | default([])
         | selectattr('decision', 'defined')
         | selectattr('decision', 'equalto', 'SWITCH_READINESS_OR_IDENTITY_UNVERIFIED') | list }}

- name: Report the advisory audit-only config-sync gap
  ansible.builtin.debug:
    msg: >-
      NDP_INTERFACE_BASELINE_ADVISORY: audit-only baseline made no changes; switches not yet in config sync
      {{ _nd_interface_baseline_result.decisions | selectattr('decision', 'defined')
         | selectattr('decision', 'equalto', 'SWITCH_READINESS_OR_IDENTITY_UNVERIFIED')
         | map(attribute='switch') | list }}. Continuing; module targets own their own deploy/sync.
  when: _nd_interface_baseline_advisory | bool

- name: Require accepted operations and fresh verification for interface baseline changes
  ansible.builtin.assert:
    that:
      - (_nd_interface_baseline_result.baseline_failed | default(true)) is sameas false
        or _nd_interface_baseline_advisory | bool
    fail_msg: "NDP_INTERFACE_BASELINE_BLOCKED: inventory, safety, deployment or verification could not be established; no membership transfer is permitted."
  ignore_errors: true

- name: Report an incomplete interface baseline without blocking module execution
  ansible.builtin.debug:
    msg: "NDP_INTERFACE_BASELINE_BLOCKED_CONTINUING: baseline readiness was not confirmed; continuing with the selected module."
  when:
    - (_nd_interface_baseline_result.baseline_failed | default(true)) is not sameas false
    - not (_nd_interface_baseline_advisory | bool)
