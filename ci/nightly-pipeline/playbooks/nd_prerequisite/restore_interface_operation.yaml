---
- name: Validate the journaled prerequisite restore operation
  ansible.builtin.assert:
    that:
       - _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet', 'delete_created_port_channel', 'delete_planned_link', 'restore_port_channel_members']
       - _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet', 'restore_port_channel_members'] or not (_ndp_restore_operation.pre_change_intent_exists | bool)
    fail_msg: "Refusing an unsupported or non-empty prerequisite restore snapshot."
  run_once: true

- name: Require the captured Ethernet before-image instead of inventing host defaults
  ansible.builtin.assert:
    that:
      - _ndp_restore_operation.pre_change_config_data is mapping
      - _ndp_restore_operation.pre_change_config_data.mode in ['trunk', 'access', 'routed']
      - _ndp_restore_operation.pre_change_config_data.networkOS.networkOSType == 'nx-os'
      - _ndp_restore_operation.pre_change_config_data.networkOS.policy.adminState is boolean
      - _ndp_restore_operation.pre_change_config_data.networkOS.policy.policyType | length > 0
    fail_msg: "NDP_RESTORE_SNAPSHOT_REQUIRED: retain the journal and recover its before-image; never guess admin-up host defaults."
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet']

# The routed Ethernet / Port-channel parent is one this run created on a port the planner proved free, so every
# sub-interface still on it was created by the test that just ran. ND refuses to change or delete the parent while
# they exist (400 "Changing the routed interface policy type is prohibited when subinterfaces are configured on the
# interface"; live 2026-10-08) and the targets have no cleanup file, so a test that stopped part-way would leave the
# parent routed. Remove them with the collection's own module (remove + deploy) before restoring the parent.
- name: "List the interfaces of {{ _ndp_restore_operation.serial }} to find sub-interfaces left on {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces
    method: get
  register: _ndp_restore_iface_list
  no_log: true
  failed_when: false
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'delete_created_port_channel']

- name: "Find the sub-interfaces left on {{ _ndp_restore_operation.interface }}"
  ansible.builtin.set_fact:
    _ndp_restore_leftover_subifs: >-
      {{ ((((_ndp_restore_iface_list | default({})).current | default({})).interfaces | default([]))
          | map(attribute='interfaceName')
          | select('match', '(?i)^' ~ (_ndp_restore_operation.interface | regex_escape) ~ '[.][0-9]+$') | list) }}
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'delete_created_port_channel']

- name: "Remove the managed sub-interfaces {{ test_module | default('') }} left on {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_interface_subinterface_managed:
    fabric_name: "{{ _ndp_restore_operation.fabric_name }}"
    config:
      - switch_ip: "{{ _ndp_restore_operation.switch_ip }}"
        interface_name: "{{ item | regex_replace('(?i)^port-channel', 'Port-channel') | regex_replace('(?i)^ethernet', 'Ethernet') }}"
    state: deleted
  loop: "{{ _ndp_restore_leftover_subifs | default([]) }}"
  run_once: true
  ignore_errors: true
  when:
    - _ndp_restore_operation.action in ['reset_routed_ethernet', 'delete_created_port_channel']
    - (_ndp_restore_operation.switch_ip | default('')) | length > 0
    - test_module | default('') == 'nd_interface_subinterface_managed'

- name: Read the standalone port-channel before restoring reserved members
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{ _ndp_restore_operation.interface }}
    method: get
  register: _ndp_restore_pc_current
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'restore_port_channel_members'

- name: Require the parent and expected detached membership before restoring
  ansible.builtin.assert:
    that:
      - _ndp_restore_pc_current.current.switchId == _ndp_restore_operation.serial
      - _ndp_restore_pc_current.current.interfaceName == _ndp_restore_operation.interface
      - _ndp_restore_pc_current.current.interfaceType == 'portChannel'
      - _ndp_restore_pc_current.current.configData.networkOS.policy.policyType == _ndp_restore_operation.policy_type
      - _ndp_restore_pc_current.current.configData.networkOS.policy.ports | sort == _ndp_restore_operation.members_after | sort
    fail_msg: >-
      NDP_PORT_CHANNEL_RESTORE_UNVERIFIED: {{ _ndp_restore_operation.interface }} changed after prerequisite detach;
      retaining the journal and refusing to overwrite newer membership.
  run_once: true
  no_log: true
  when: _ndp_restore_operation.action == 'restore_port_channel_members'

- name: Restore reserved members to the standalone access port-channel
  cisco.nd.nd_interface_port_channel_access:
    fabric_name: "{{ _ndp_restore_operation.fabric_name }}"
    config:
      - switch_ip: "{{ _ndp_restore_operation.switch_ip }}"
        interface_name: "{{ _ndp_restore_operation.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_restore_operation.members_before }}"
    config_actions: {deploy: true}
    state: merged
  no_log: true
  run_once: true
  when:
    - _ndp_restore_operation.action == 'restore_port_channel_members'
    - _ndp_restore_operation.module == 'access'

- name: Restore reserved members to the standalone trunk port-channel
  cisco.nd.nd_interface_port_channel_trunk_host:
    fabric_name: "{{ _ndp_restore_operation.fabric_name }}"
    config:
      - switch_ip: "{{ _ndp_restore_operation.switch_ip }}"
        interface_name: "{{ _ndp_restore_operation.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_restore_operation.members_before }}"
    config_actions: {deploy: true}
    state: merged
  no_log: true
  run_once: true
  when:
    - _ndp_restore_operation.action == 'restore_port_channel_members'
    - _ndp_restore_operation.module == 'trunk'

- name: Restore reserved members to the standalone routed port-channel
  cisco.nd.nd_interface_port_channel_routed:
    fabric_name: "{{ _ndp_restore_operation.fabric_name }}"
    config:
      - switch_ip: "{{ _ndp_restore_operation.switch_ip }}"
        interface_name: "{{ _ndp_restore_operation.interface }}"
        config_data:
          network_os:
            network_os_type: nx-os
            policy:
              ports: "{{ _ndp_restore_operation.members_before }}"
    config_actions: {deploy: true}
    state: merged
  no_log: true
  run_once: true
  when:
    - _ndp_restore_operation.action == 'restore_port_channel_members'
    - _ndp_restore_operation.module == 'routed'

- name: Verify the original standalone port-channel member list was restored
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{ _ndp_restore_operation.interface }}
    method: get
  register: _ndp_restore_pc_verified
  retries: 12
  delay: 5
  until: >-
    _ndp_restore_pc_verified.current.switchId | default('') == _ndp_restore_operation.serial and
    _ndp_restore_pc_verified.current.interfaceName | default('') == _ndp_restore_operation.interface and
    _ndp_restore_pc_verified.current.configData.networkOS.policy.policyType | default('') == _ndp_restore_operation.policy_type and
    _ndp_restore_pc_verified.current.configData.networkOS.policy.ports | default([]) | sort == _ndp_restore_operation.members_before | sort
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'restore_port_channel_members'

- name: "Remove the unmanaged sub-interfaces {{ test_module | default('') }} left on {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_interface_subinterface_unmanaged:
    fabric_name: "{{ _ndp_restore_operation.fabric_name }}"
    config:
      - switch_ip: "{{ _ndp_restore_operation.switch_ip }}"
        interface_name: "{{ item | regex_replace('(?i)^port-channel', 'Port-channel') | regex_replace('(?i)^ethernet', 'Ethernet') }}"
    state: deleted
  loop: "{{ _ndp_restore_leftover_subifs | default([]) }}"
  run_once: true
  ignore_errors: true
  when:
    - _ndp_restore_operation.action in ['reset_routed_ethernet', 'delete_created_port_channel']
    - (_ndp_restore_operation.switch_ip | default('')) | length > 0
    - test_module | default('') == 'nd_interface_subinterface_unmanaged'

# Only config-only (planned) links are journaled, so deleting them can never remove a real cable's link.
- name: "Delete the planned link {{ _ndp_restore_operation.interface }} created for this execution"
  cisco.nd.nd_manage_links:
    fabric_name: "{{ _ndp_restore_operation.link.src_fabric_name }}"
    link_scope: manage
    config:
      - src_fabric_name: "{{ _ndp_restore_operation.link.src_fabric_name }}"
        dst_fabric_name: "{{ _ndp_restore_operation.link.dst_fabric_name }}"
        src_switch_id: "{{ _ndp_restore_operation.link.src_switch_id }}"
        dst_switch_id: "{{ _ndp_restore_operation.link.dst_switch_id }}"
        src_interface_name: "{{ _ndp_restore_operation.link.src_interface_name }}"
        dst_interface_name: "{{ _ndp_restore_operation.link.dst_interface_name }}"
    state: deleted
  register: _ndp_restore_planned_link
  run_once: true
  # A leftover planned link is harmless (the next prerequisite run finds and reuses it), so a refusal here
  # must not mask the module's own result.
  ignore_errors: true
  when: _ndp_restore_operation.action == 'delete_planned_link'

- name: "Report a planned link that could not be deleted"
  ansible.builtin.debug:
    msg: >-
      NDP_PLANNED_LINK_LEFTOVER: could not delete the planned link
      {{ _ndp_restore_operation.link.src_switch_id }}/{{ _ndp_restore_operation.link.src_interface_name }} <->
      {{ _ndp_restore_operation.link.dst_switch_id }}/{{ _ndp_restore_operation.link.dst_interface_name }};
      the next prerequisite run reuses it.
  run_once: true
  when:
    - _ndp_restore_operation.action == 'delete_planned_link'
    - _ndp_restore_planned_link is failed

# Restore the full captured configuration. A fabricated trunkHost/admin-up default
# can leave an unused port enabled or put edge semantics on a switch-facing link.
- name: "Read the current intent of Ethernet parent {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{
        _ndp_restore_operation.interface | replace('/', '%2F') }}
    method: get
  register: _ndp_restore_ethernet_cur
  no_log: true
  failed_when: false
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet']

- name: Require the current Ethernet identity before restoring its captured configuration
  ansible.builtin.assert:
    that:
      - _ndp_restore_ethernet_cur.current.switchId | default('') == _ndp_restore_operation.serial
      - _ndp_restore_ethernet_cur.current.interfaceName | default('') == _ndp_restore_operation.interface
      - _ndp_restore_ethernet_cur.current.interfaceType | default('') == 'ethernet'
    fail_msg: "NDP_RESTORE_IDENTITY_UNVERIFIED: refusing to overwrite an unidentified interface."
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet']

- name: "Reset Ethernet parent {{ _ndp_restore_operation.interface }} to its pre-test default"
  when:
    - _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet']
    - >-
      ((_ndp_restore_ethernet_cur.current | default({})) is mapping)
      and (_ndp_restore_ethernet_cur.current.configData | default({})) != _ndp_restore_operation.pre_change_config_data
  run_once: true
  block:
    - name: "Restore {{ _ndp_restore_operation.interface }} to its captured pre-test intent"
      cisco.nd.nd_rest:
        path: >-
          /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{
            _ndp_restore_operation.interface | replace('/', '%2F') }}
        method: put
        content:
          switchId: "{{ _ndp_restore_operation.serial }}"
          interfaceName: "{{ _ndp_restore_operation.interface }}"
          interfaceType: ethernet
          configData: "{{ _ndp_restore_operation.pre_change_config_data }}"
      register: _ndp_restore_ethernet_put
      no_log: true
      failed_when: false

    - name: Verify the exact restored intent was accepted before deploying
      cisco.nd.nd_rest:
        path: >-
          /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{
            _ndp_restore_operation.interface | replace('/', '%2F') }}
        method: get
      register: _ndp_restore_accepted
      failed_when: >-
        (_ndp_restore_accepted.current.switchId | default('')) != _ndp_restore_operation.serial or
        (_ndp_restore_accepted.current.interfaceName | default('')) != _ndp_restore_operation.interface or
        (_ndp_restore_accepted.current.configData | default({})) != _ndp_restore_operation.pre_change_config_data
      no_log: true

    # ND answers interfaceActions/deploy with HTTP 207 Multi-Status. nd_rest only returns a body for 200/201/202/204, so it
    # raises "object to sanitize can only be of type list or dict. Got NoneType" AFTER ND accepted and ran the deploy
    # (live 2026-10-08: the port was back in trunk mode on the switch). The task result therefore proves nothing; the
    # deploy is verified below through the mode the switch itself reports.
    - name: "Deploy the reset of {{ _ndp_restore_operation.interface }}"
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/interfaceActions/deploy"
        method: post
        content:
          interfaces:
            - interfaceName: "{{ _ndp_restore_operation.interface }}"
              switchId: "{{ _ndp_restore_operation.serial }}"
      register: _ndp_restore_ethernet_deploy
      no_log: true
      failed_when: false

- name: "Verify the exact intent and observed admin state of {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_rest:
    path: >-
      /api/v1/manage/fabrics/{{ _ndp_restore_operation.fabric_name }}/switches/{{ _ndp_restore_operation.serial }}/interfaces/{{
        _ndp_restore_operation.interface | replace('/', '%2F') }}
    method: get
  register: _ndp_restore_ethernet_mode
  retries: 12
  delay: 10
  until: >-
    (_ndp_restore_ethernet_mode.current.switchId | default('')) == _ndp_restore_operation.serial
    and (_ndp_restore_ethernet_mode.current.interfaceName | default('')) == _ndp_restore_operation.interface
    and (_ndp_restore_ethernet_mode.current.configData | default({})) == _ndp_restore_operation.pre_change_config_data
    and (_ndp_restore_ethernet_mode.current.operData.adminStatus | default('')) ==
      ('up' if _ndp_restore_operation.pre_change_config_data.networkOS.policy.adminState else 'down')
    and (_ndp_restore_ethernet_mode.current.operData.mode | default('')) == _ndp_restore_operation.pre_change_config_data.mode
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action in ['reset_routed_ethernet', 'restore_ethernet']

- name: "Verify Ethernet parent {{ _ndp_restore_operation.interface }} no longer has routed intent"
  cisco.nd.nd_rest:
    path: >-
      /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/interface?serialNumber={{
        _ndp_restore_operation.serial
      }}&ifName={{ _ndp_restore_operation.interface | replace('/', '%2F') }}
    method: get
  register: _ndp_restore_ethernet_verify
  retries: 3
  delay: 5
  until: >-
    {{
      ((_ndp_restore_ethernet_verify.current
        if (_ndp_restore_ethernet_verify.current is not mapping)
        else (_ndp_restore_ethernet_verify.current.DATA | default(_ndp_restore_ethernet_verify.current.response | default([]))))
       | selectattr('policy', 'match', '^int_routed_host') | list | length) == 0
    }}
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'reset_routed_ethernet'

- name: "Mark temporary port-channel {{ _ndp_restore_operation.interface }} for deletion"
  cisco.nd.nd_rest:
    path: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/interface/markdelete
    method: delete
    content:
      - serialNumber: "{{ _ndp_restore_operation.serial }}"
        ifName: "{{ _ndp_restore_operation.interface }}"
  register: _ndp_restore_port_channel_delete
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'delete_created_port_channel'

- name: "Deploy temporary port-channel deletion {{ _ndp_restore_operation.interface }}"
  cisco.nd.nd_rest:
    path: /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/globalInterface/deploy
    method: post
    content:
      - serialNumber: "{{ _ndp_restore_operation.serial }}"
        ifName: "{{ _ndp_restore_operation.interface }}"
        fabricName: "{{ _ndp_restore_operation.fabric_name }}"
  register: _ndp_restore_port_channel_deploy
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'delete_created_port_channel'

- name: "Verify temporary port-channel {{ _ndp_restore_operation.interface }} is absent"
  cisco.nd.nd_rest:
    path: >-
      /appcenter/cisco/ndfc/api/v1/lan-fabric/rest/interface?serialNumber={{
        _ndp_restore_operation.serial
      }}&ifName={{ _ndp_restore_operation.interface }}
    method: get
  register: _ndp_restore_port_channel_verify
  retries: 3
  delay: 5
  until: >-
    {{
      (_ndp_restore_port_channel_verify.current
       if (_ndp_restore_port_channel_verify.current is not mapping)
       else (_ndp_restore_port_channel_verify.current.DATA | default(_ndp_restore_port_channel_verify.current.response | default([]))))
      | length == 0
    }}
  no_log: true
  run_once: true
  when: _ndp_restore_operation.action == 'delete_created_port_channel'
