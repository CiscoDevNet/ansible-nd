---
# Static FALLBACK inventory for the cisco.nd nightly pipeline.
#
# The Jenkins pipeline normally builds a dynamic inventory at runtime
# (generateDynamicInventory -> CURRENT_NDFC_INVENTORY) and only falls back to
# this file if that step is skipped. Its structure mirrors the generated one.
#
# No secrets are stored here. Controller and switch credentials are read from
# their separate Jenkins-bound environment variables at runtime.
all:
  vars:
    ansible_user: "{{ lookup('env', 'NDFC_USER') }}"
    ansible_password: "{{ lookup('env', 'NDFC_PASSWORD') }}"
    ansible_python_interpreter: python
    ansible_httpapi_validate_certs: false
    ansible_httpapi_use_ssl: true
    ansible_httpapi_login_domain: "local"
    switch_username: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_USERNAME') }}"
    switch_password: "{{ lookup('env', 'ANSIBLE_NXOS_SWITCH_PASSWORD') }}"
    fabric_name: VXLAN_EVPN_Fabric
    ansible_it_fabric: VXLAN_EVPN_Fabric
    nd_test_fabric_name: VXLAN_EVPN_Fabric
    nd_test_fabric1_name: VXLAN_EVPN_Fabric
    nd_test_fabric2_name: External_Connectivity_Fabric
    nd_fabric_names: [VXLAN_EVPN_Fabric, External_Connectivity_Fabric]
    nd_test_fabric_switches:
      VXLAN_EVPN_Fabric:
        - {name: vxlan_leaf_1, seed_ip: 10.122.84.195, serial: 9PICV0LTD7C, role: leaf}
        - {name: vxlan_leaf_2, seed_ip: 10.122.84.196, serial: 9VISBXAWYYB, role: leaf}
        - {name: vxlan_spine_1, seed_ip: 10.122.84.194, serial: 9FKMQG17900, role: spine}
        - {name: vxlan_border_1, seed_ip: 10.122.84.88, serial: 9FTTP2QGS0H, role: border}
      External_Connectivity_Fabric:
        - {name: external_edge_1, seed_ip: 10.122.84.89, serial: 9V1IZP23KBG, role: edge_router}
        - {name: external_edge_2, seed_ip: 10.122.84.90, serial: 9GRLA6ZC4Z0, role: edge_router}
    nd_switches:
      - {name: vxlan_leaf_1, ip: 10.122.84.195, serial: 9PICV0LTD7C, fabric: VXLAN_EVPN_Fabric, role: leaf}
      - {name: vxlan_leaf_2, ip: 10.122.84.196, serial: 9VISBXAWYYB, fabric: VXLAN_EVPN_Fabric, role: leaf}
      - {name: vxlan_spine_1, ip: 10.122.84.194, serial: 9FKMQG17900, fabric: VXLAN_EVPN_Fabric, role: spine}
      - {name: vxlan_border_1, ip: 10.122.84.88, serial: 9FTTP2QGS0H, fabric: VXLAN_EVPN_Fabric, role: border}
      - {name: external_edge_1, ip: 10.122.84.89, serial: 9V1IZP23KBG, fabric: External_Connectivity_Fabric, role: edge_router}
      - {name: external_edge_2, ip: 10.122.84.90, serial: 9GRLA6ZC4Z0, fabric: External_Connectivity_Fabric, role: edge_router}
    # Positional module-slot aliases (NOT the switch registry). The COMPLETE six-switch
    # inventory is nd_test_fabric_switches + nd_switches above (4 VXLAN + 2 External).
    # The scalars below only re-expose specific switches under the fixed names individual
    # upstream tests read; they are a subset by design. vxlan_spine_1's IP and external_edge_2
    # are consumed via the lists above, so they intentionally have no scalar alias here.
    ansible_switch1: 10.122.84.195         # vxlan_leaf_1  seed IP  (VXLAN_EVPN_Fabric)
    ansible_switch2: 10.122.84.196         # vxlan_leaf_2  seed IP  (VXLAN_EVPN_Fabric)
    ansible_sno_1: 9PICV0LTD7C             # vxlan_leaf_1  serial
    ansible_sno_2: 9VISBXAWYYB             # vxlan_leaf_2  serial
    switch_serial_1: 9PICV0LTD7C           # vxlan_leaf_1  serial (nd_manage_policy_group)
    switch_serial_2: 9VISBXAWYYB           # vxlan_leaf_2  serial (nd_manage_policy_group)
    switch_serial_3: 9FKMQG17900           # vxlan_spine_1 serial (nd_manage_policy_group)
    nd_test_switch1_id: 9FTTP2QGS0H        # vxlan_border_1 serial
    nd_test_switch2_id: 9V1IZP23KBG        # external_edge_1 serial (L3Out endpoint, not a switch-add target)
    nd_test_switch1_mgmt_ip: 10.122.84.88  # vxlan_border_1  mgmt IP
    nd_test_switch2_mgmt_ip: 10.122.84.89  # external_edge_1 mgmt IP
    test_groups: [standalone]
    nd_network_test_topology: standalone
    nd_vrf_test_topology: standalone
    ansible_msd_parent_fabric: ""
    ansible_msd_child_fabric: ""
    ansible_msd_switch1: ""
    ansible_mcfg_parent_fabric: ""
    ansible_mcfg_child_fabric: ""
    ansible_mcfg_switch1: ""
  children:
    nd:
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.nd.nd
      hosts:
        nd_controller:
          ansible_host: 10.122.84.117
