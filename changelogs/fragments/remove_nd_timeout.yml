---
breaking_changes:
  - >-
    The shared module-level ``timeout`` option and its ``ND_TIMEOUT`` environment
    variable fallback have been removed in cisco.nd 2.0.0. Configure persistent
    command timeouts with ``ansible_command_timeout`` in your playbooks or inventory
    instead. Users relying on the environment variable must migrate from
    ``export ND_TIMEOUT=300`` to ``export ANSIBLE_PERSISTENT_COMMAND_TIMEOUT=300``.
    The ND HTTPAPI plugin now preserves Ansible's native
    ``persistent_command_timeout`` value instead of overwriting it.
