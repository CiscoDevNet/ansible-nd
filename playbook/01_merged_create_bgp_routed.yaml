---
- name: "MERGED CREATE: Create BGP L3Out with routed interfaces"
  hosts: nd
  gather_facts: false
  connection: local
  vars_files:
    - "{{ playbook_dir }}/../tests/integration/targets/nd_manage_l3out/vars/main.yaml"
  vars:
    nd_info:
      output_level: '{{ api_key_output_level | default("debug") }}'
    test_fabric_name: "jeet-fabric-ibgp"
    test_fabric1_name: "jeet-fabric-ibgp"
    test_fabric2_name: "jeet-fabric-ext"
    test_vrf1_name: "vrf1"
    test_vrf2_name: "vrf1"
    test_tenant1_name: "{{ omit }}"
    test_tenant2_name: "{{ omit }}"
    test_switch1_id: "9LJHKH3VF1S"
    test_switch2_id: "9W5HXHTY88P"
    test_switch1_mgmt_ip: "192.168.10.122"
    test_switch2_mgmt_ip: "192.168.10.124"
    test_switch1_interface: "Ethernet1/1"
    test_switch2_interface: "Ethernet1/2"
    test_switch1_subif: "Ethernet1/1"
    test_switch2_subif: "Ethernet1/2"
    test_subinterface_vlan_id: 100
    test_dci_link_ready: false

  tasks:
    - name: "SETUP: Remove test L3Outs before state tests"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tests/integration/targets/nd_manage_l3out/tasks/setup.yaml"

# reate link for type of L3out

    - name: "MERGED CREATE: Create routed + BGP L3Out (check mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ l3out_bgp }}"
        state: merged
      check_mode: true
      register: cm_merged_create_bgp_routed

    - name: "MERGED CREATE: Create routed + BGP L3Out (normal mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ l3out_bgp }}"
        state: merged
      register: nm_merged_create_bgp_routed

    - name: "MERGED CREATE: Verify routed + BGP L3Out creation"
      ansible.builtin.assert:
        that:
          - cm_merged_create_bgp_routed is changed
          - nm_merged_create_bgp_routed is changed
          - nm_merged_create_bgp_routed.after | length >= 1
        fail_msg: "FAILED: routed + BGP L3Out was not created"
        success_msg: "PASSED: routed + BGP L3Out created successfully"

    - name: "MERGED IDEMPOTENT: Re-apply routed + BGP L3Out (check mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ l3out_bgp }}"
        state: merged
      check_mode: true
      register: cm_merged_idem_bgp_routed

    - name: "MERGED IDEMPOTENT: Re-apply routed + BGP L3Out (normal mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - "{{ l3out_bgp }}"
        state: merged
      register: nm_merged_idem_bgp_routed

    - name: "MERGED IDEMPOTENT: Verify no change on second routed + BGP run"
      ansible.builtin.assert:
        that:
          - cm_merged_idem_bgp_routed is not changed
          - nm_merged_idem_bgp_routed is not changed
        fail_msg: "FAILED: routed + BGP L3Out was not idempotent"
        success_msg: "PASSED: routed + BGP L3Out remained idempotent"
