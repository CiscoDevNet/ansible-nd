---
- name: "MERGED CREATE: Create BGP L3Out with subInterface links"
  hosts: nd
  gather_facts: false
  connection: local
  vars_files:
    - "{{ playbook_dir }}/../tests/integration/targets/nd_manage_l3out/vars/main.yaml"
  vars:
    nd_info:
      output_level: '{{ api_key_output_level | default("debug") }}'
    test_fabric_name: "jeet-fabric-ibgp"
    test_fabric1_name: "jeet-fabric-ibgp"
    test_fabric2_name: "jeet-fabric-ext"
    test_vrf1_name: "vrf1"
    test_vrf2_name: "vrf1"
    test_tenant1_name: "{{ omit }}"
    test_tenant2_name: "{{ omit }}"
    test_switch1_id: "9LJHKH3VF1S"
    test_switch2_id: "9W5HXHTY88P"
    test_switch1_mgmt_ip: "192.168.10.122"
    test_switch2_mgmt_ip: "192.168.10.124"
    test_switch1_interface: "Ethernet1/1"
    test_switch2_interface: "Ethernet1/2"
    test_switch1_subif: "Ethernet1/1"
    test_switch2_subif: "Ethernet1/2"
    test_subinterface_vlan_id: 100
    test_dci_link_ready: false

  tasks:
    - name: "MERGED CREATE: Create subInterface + BGP L3Out (check mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - name: "ansible-test-l3out-subif-bgp"
            fabric1_name: "{{ test_fabric1_name }}"
            fabric2_name: "{{ test_fabric2_name }}"
            vrf1_name: "{{ test_vrf1_name }}"
            vrf2_name: "{{ test_vrf2_name }}"
            tenant1_name: "{{ test_tenant1_name }}"
            tenant2_name: "{{ test_tenant2_name }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: subInterface
              links:
                - vlan_id: "{{ test_subinterface_vlan_id }}"
                  mtu: 1500
                  ipv4_mask_length: 24
                  switch1_details:
                    switch_id: "{{ test_switch1_id }}"
                    interface_name: "{{ test_switch1_subif }}.{{ test_subinterface_vlan_id }}"
                    interface_ipv4_address: 192.168.101.1
                    interface_description: "Link to external network"
                  switch2_details:
                    switch_id: "{{ test_switch2_id }}"
                    interface_name: "{{ test_switch2_subif }}.{{ test_subinterface_vlan_id }}"
                    interface_ipv4_address: 192.168.101.2
                    interface_description: "Link from DC1"
            routing_details:
              routing_protocol: bgp
              bgp:
                bfd: true
                hold_interval: 180
                keep_alive_interval: 60
                fabric1_details:
                  advertise_default_route: true
                  ipv4_peering_details:
                    ipv4_route_map_in: rm-in
                    ipv4_route_map_out: rm-out
                fabric2_details:
                  advertise_default_route: true
                  ipv4_peering_details:
                    ipv4_route_map_in: rm-in
                    ipv4_route_map_out: rm-out
        state: merged
      check_mode: true
      register: cm_merged_create_bgp_subif

    - name: "MERGED CREATE: Create subInterface + BGP L3Out (normal mode)"
      cisco.nd.nd_manage_l3out:
        output_level: "{{ nd_info.output_level }}"
        fabric_name: "{{ test_fabric_name }}"
        config:
          - name: "ansible-test-l3out-subif-bgp"
            fabric1_name: "{{ test_fabric1_name }}"
            fabric2_name: "{{ test_fabric2_name }}"
            vrf1_name: "{{ test_vrf1_name }}"
            vrf2_name: "{{ test_vrf2_name }}"
            tenant1_name: "{{ test_tenant1_name }}"
            tenant2_name: "{{ test_tenant2_name }}"
            configured_fabrics: both
            ip_version: ipv4
            connectivity_details:
              routing_interface_type: subInterface
              links:
                - vlan_id: "{{ test_subinterface_vlan_id }}"
                  mtu: 1500
                  ipv4_mask_length: 24
                  switch1_details:
                    switch_id: "{{ test_switch1_id }}"
                    interface_name: "{{ test_switch1_subif }}.{{ test_subinterface_vlan_id }}"
                    interface_ipv4_address: 192.168.101.1
                    interface_description: "Link to external network"
                  switch2_details:
                    switch_id: "{{ test_switch2_id }}"
                    interface_name: "{{ test_switch2_subif }}.{{ test_subinterface_vlan_id }}"
                    interface_ipv4_address: 192.168.101.2
                    interface_description: "Link from DC1"
            routing_details:
              routing_protocol: bgp
              bgp:
                bfd: true
                hold_interval: 180
                keep_alive_interval: 60
                fabric1_details:
                  advertise_default_route: true
                  ipv4_peering_details:
                    ipv4_route_map_in: rm-in
                    ipv4_route_map_out: rm-out
                fabric2_details:
                  advertise_default_route: true
                  ipv4_peering_details:
                    ipv4_route_map_in: rm-in
                    ipv4_route_map_out: rm-out
        state: merged
      register: nm_merged_create_bgp_subif

    - name: "MERGED CREATE: Verify subInterface + BGP L3Out creation"
      ansible.builtin.assert:
        that:
          - cm_merged_create_bgp_subif is changed
          - nm_merged_create_bgp_subif is changed
        fail_msg: "FAILED: subInterface + BGP L3Out was not created"
        success_msg: "PASSED: subInterface + BGP L3Out created successfully"
